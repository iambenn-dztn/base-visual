/* ---- TRỤC NHIỆT ĐỘ: màu nền là hàm của t (storyboard mục 2) -------------
 * Người xem phải CẢM được vũ trụ đang nguội chỉ bằng màu. Không nhảy cóc ngược
 * trên trục này — ngoại lệ duy nhất là một nhịp bật nóng ở S27 khi cửa mở.
 */
var TEMP_KEYS = [
  [0.0,    0x0B1018],   // C01–C10 trắng-xanh nung (nền vẫn tối, hạt mới sáng)
  [115.5,  0x0F1116],   // C11–C25 trắng ngả kem
  [261.8,  0x160F0C],   // C26–C40 cam vàng
  [405.0,  0x18100A],   // C41–C48 cam trầm
  [492.5,  0x150A08],   // C49–C74 đỏ trầm
  [742.6,  0x0E0605],   // C75–C79 đỏ than — lửa tàn
  [785.5,  0x080D14],   // C80+ lam lạnh
  [1045.96,0x05070B]
];
var _tc1=new THREE.Color(), _tc2=new THREE.Color(), _tcOut=new THREE.Color();
function tempColor(t){
  for (var i=0;i<TEMP_KEYS.length-1;i++){
    var a=TEMP_KEYS[i], b=TEMP_KEYS[i+1];
    if (t>=a[0] && t<=b[0]){
      var u=smooth((t-a[0])/Math.max(0.001,b[0]-a[0]));
      _tc1.setHex(a[1]); _tc2.setHex(b[1]);
      return _tcOut.copy(_tc1).lerp(_tc2, u);
    }
  }
  return _tcOut.setHex(TEMP_KEYS[TEMP_KEYS.length-1][1]);
}

/* ---- helper cập nhật buffer -------------------------------------------- */
function posArr(P){ return P.geometry.attributes.position.array; }
function alpArr(P){ return P.geometry.attributes.aA.array; }
function flushPos(P){ P.geometry.attributes.position.needsUpdate = true; }
function flushAlp(P){ P.geometry.attributes.aA.needsUpdate = true; }
function pOp(P, v){ P.material.uniforms.uOp.value = v; }
function pEm(P, v){ P.material.uniforms.uEm.value = v; }

/* Đặt một đoạn LineSegments (i-th) đi từ a → b. */
function segSet(arr, i, ax,ay,az, bx,by,bz){
  var o=i*6;
  arr[o]=ax; arr[o+1]=ay; arr[o+2]=az;
  arr[o+3]=bx; arr[o+4]=by; arr[o+5]=bz;
}

/* Camera: đặt theo vị trí + nhìn vào điểm, kèm rung nhẹ tất định. */
var _look = new THREE.Vector3();
function cam(px,py,pz, lx,ly,lz, fov, shake, t){
  camera.position.set(px,py,pz);
  if (shake){
    camera.position.x += Math.sin(t*23.1)*shake;
    camera.position.y += Math.cos(t*19.7)*shake;
  }
  _look.set(lx||0, ly||0, lz||0);
  camera.lookAt(_look);
  if (fov && Math.abs(camera.fov-fov)>0.001){ camera.fov=fov; camera.updateProjectionMatrix(); }
}

/* ==========================================================================
 * renderAtTime — HÀM THUẦN CỦA t. Mọi chuyển động là hàm đóng của t;
 * không tích luỹ, không đồng hồ hệ thống, không Math.random.
 * ========================================================================== */
function renderAtTime(t){
  var i, k, u, v, a, b, x, y, z, n, p, arr, s, w, o;

  /* nền theo trục nhiệt độ */
  renderer.setClearColor(tempColor(t), 1);

  /* tắt hết, rồi chỉ bật nhóm của shot đang chạy → "cắt cảnh" tất định */
  for (var gk in G) G[gk].visible = false;

  var vis;   // hệ số hiển thị của shot hiện hành

  /* ======================= CHƯƠNG 1 ======================= */

  /* --- S01: điểm trắng-xanh nở thành trường plasma lấp kín khung --------- */
  /* --- S02: bốn ảnh chờ bị đốt tan --- S04: máy nghiền ------------------- */
  var vPlasma = Math.max(W(t,'S01',0.6), W(t,'S02',0.6));
  // plasma còn làm hậu cảnh cho S03 và S04
  vPlasma = Math.max(vPlasma, W(t,'S03',0.6)*0.70, W(t,'S04',0.6)*0.95);
  if (vPlasma > 0.002){
    show(gPlasma, vPlasma);
    var pmu = plasmaField.userData.mat.uniforms;
    pmu.uT.value = t;
    pmu.uWarmMix.value = clamp((t-88)/70, 0, 1);   // nguội dần sang kem
    if (inSc(t,'S01')){
      u = loc(t,'S01');
      // đứng yên trên nền đen, rồi NỞ RA lấp kín khung — zoom-out để lộ ra
      // rằng trường plasma KHÔNG CÓ MÉP, không tâm, không chân trời
      var born = smooth((t-1.2)/2.6);
      pmu.uGrow.value = 0.06 + born*1.25;
      pmu.uEdge.value = 1.0;
      pmu.uOp.value = vPlasma*born;
      pmu.uEm.value = 1.0;
      var fov1 = 30 + smooth((u-0.15)/0.85)*34;
      cam(0,0, 52 - born*14, 0,0,0, fov1, 0.045, t);
    } else {
      pmu.uGrow.value = 1.35;
      pmu.uEdge.value = 0.0;       // PHỦ KÍN: không tâm, không rìa, không chân trời
      // S04 hạ một nhịp để cặp hạt proton/neutron đọc được trên nền
      // ĐỤC KÍN: không để lộ nền tối qua khe, nếu không khung đọc thành
      // "bầu trời có mây" thay vì môi trường plasma đặc.
      pmu.uOp.value = vPlasma*0.985;
      pmu.uEm.value = W(t,'S04',0.6) > 0.02 ? 0.82 : 1.0;
    }
  }

  if (inSc(t,'S02')){
    u = loc(t,'S02'); vis = W(t,'S02',0.6);
    show(gGhost, vis);
    // bốn ảnh chờ hiện lần lượt rồi bị plasma ĐỐT TAN ngay khi vừa thành hình
    var pushIn = 0;
    for (i=0;i<4;i++){
      var st = 0.10 + i*0.20, life = 0.145;
      var lu = (u - st)/life;
      var o2 = ghosts[i];
      if (lu < 0 || lu > 1.35){ ghostOpacity(o2, 0); continue; }
      var app = smooth(lu/0.32);
      var dis = 1 - smooth((lu-0.55)/0.45);       // dissolve từ tâm
      ghostOpacity(o2, vis*0.35*app*dis);
      o2.rotation.y = t*0.35 + i;
      o2.scale.setScalar(1 + (1-dis)*0.55);
      if (lu>0.55 && lu<1.0) pushIn = Math.max(pushIn, Math.sin((lu-0.55)/0.45*Math.PI));
    }
    // nhiệt độ toàn khung đẩy lên trắng ở lõi hạt — điểm NÓNG NHẤT cả tập
    plasmaField.userData.mat.uniforms.uEm.value = 1.0 + smooth(u)*0.18;
    cam(0, 0, 40 - pushIn*1.2, 0,0,0, 46, 0.05, t);
  }

  /* --- S03: mẩu sắt bị THÁO TUNG theo bậc thang ------------------------- */
  if (inSc(t,'S03')){
    u = loc(t,'S03'); vis = W(t,'S03',0.5);
    show(gIron, vis);
    // 4 bậc rã, mỗi bậc ~0.5s tính theo tiến độ shot
    var T0 = 0.16;                       // mẩu sắt tồn tại tới đây
    var st1 = smooth((u-T0)/0.09);       // lưới tinh thể bung
    var st2 = smooth((u-T0-0.09)/0.09);  // electron bị GIẬT ra TRƯỚC
    var st3 = smooth((u-T0-0.18)/0.09);  // hạt nhân lộ ra
    var st4 = smooth((u-T0-0.27)/0.12);  // hạt nhân vỡ thành p/n
    ironCube.material.opacity = vis*(1-st1);
    ironCube.rotation.y = t*0.35; ironCube.rotation.x = t*0.21;
    ironCube.visible = st1 < 0.99;

    // lưới tinh thể: nguyên tử bung ra theo hướng riêng
    arr = posArr(ironLattice); var bas = ironLattice.userData.base, dir = ironLattice.userData.dir;
    var expand = st1*3.2 + st2*7.0;
    for (i=0;i<arr.length;i+=3){
      arr[i]  = bas[i]  + dir[i]*expand;
      arr[i+1]= bas[i+1]+ dir[i+1]*expand;
      arr[i+2]= bas[i+2]+ dir[i+2]*expand;
    }
    flushPos(ironLattice);
    pOp(ironLattice, vis*st1*(1-st3));
    ironLattice.rotation.y = t*0.35;

    // electron bay ra ngoài TRƯỚC TIÊN — đúng thứ tự vật lý
    arr = posArr(ironElectrons); var eb = ironElectrons.userData.base;
    var eOut = 1 + st2*7.5;
    for (i=0;i<arr.length;i++) arr[i] = eb[i]*eOut;
    flushPos(ironElectrons);
    pOp(ironElectrons, vis*st1*(1-smooth((u-T0-0.30)/0.2)*0.75));
    ironElectrons.rotation.y = t*0.5;

    // hạt nhân lộ ra rồi VỠ
    arr = posArr(ironNucleons);
    var nb = ironNucleons.userData.base, nd = ironNucleons.userData.dir;
    var burst = st4*9.0;
    for (i=0;i<arr.length;i+=3){
      // sau khi vỡ, hai loại hạt trôi chậm (hàm thuần của t)
      var dr = 0;
      if (st4>0.99) dr = (t - (SC.S03[0] + (T0+0.39)*(SC.S03[1]-SC.S03[0])))*0.30;
      arr[i]  = nb[i]  + nd[i]  *(burst+dr);
      arr[i+1]= nb[i+1]+ nd[i+1]*(burst+dr);
      arr[i+2]= nb[i+2]+ nd[i+2]*(burst+dr);
    }
    flushPos(ironNucleons);
    pOp(ironNucleons, vis*st3);
    // dolly-in nhanh theo mẩu sắt, phanh gấp khi chỉ còn nucleon
    var dz = 26 - smooth(u/T0)*13;
    if (u > T0+0.27) dz = 13 + smooth((u-T0-0.27)/0.15)*7;
    cam(0, 0, dz, 0,0,0, 50, 0.05*(1-st4), t);
  }

  /* --- S04: máy nghiền — bất kỳ thứ gì vừa ghép lại đều bị đập vỡ ------- */
  if (inSc(t,'S04')){
    vis = W(t,'S04',0.4);
    show(gCrush, vis);
    for (i=0;i<crushPairs.length;i++){
      o = crushPairs[i]; var ud = o.userData;
      // nhịp lặp BẤT ĐỐI XỨNG: mỗi cặp một chu kỳ riêng → cảm giác LOẠN
      var ph = ((t + ud.phase) % ud.period) / ud.period;
      var join = smooth(ph/0.55);              // dính vào nhau
      var brk  = ph > 0.62 ? smooth((ph-0.62)/0.10) : 0;  // bị xé trong <0.2s
      var sep = 2.6 - join*1.5 + brk*7.5;
      var ca=Math.cos(ud.ang), sa=Math.sin(ud.ang);
      ud.a.position.set(-ca*sep, -sa*sep*0.6, ud.tilt*sep*0.3);
      ud.b.position.set( ca*sep,  sa*sep*0.6,-ud.tilt*sep*0.3);
      tickNucleon(ud.a, t, null, vis*(1-brk*0.35));
      tickNucleon(ud.b, t, null, vis*(1-brk*0.35));
      ud.bond.position.set(0,0,0);
      ud.bond.rotation.z = ud.ang;
      ud.bond.scale.setScalar(sep*0.55);
      ud.bond.material.opacity = vis*join*(1-brk)*0.9;
      // vệt photon lao tới xé đôi
      var pv = (ph>0.50 && ph<0.72) ? 1 : 0;
      ud.ph.visible = pv>0;
      if (pv){
        var pu = (ph-0.50)/0.22;
        aimStreak(ud.ph, ca*22*(1-pu)+0, sa*14*(1-pu), 12*(1-pu),
          0, 0, 0);
        ud.ph.userData.mat.uniforms.uOp.value = vis*(1-Math.abs(pu-0.5)*1.6);
      }
    }
    // tĩnh, hơi ngửa lên như nhìn vào TRẦN LÒ
    cam(0, -9, 34, 0, 4, 0, 35, 0.04, t);
  }

  /* --- S05 ★ VŨ TRỤ ĐỤC: ánh sáng bị giam tại chỗ ----------------------- */
  if (inSc(t,'S05')){
    u = loc(t,'S05'); vis = W(t,'S05',0.5);
    show(gOpaque, vis);
    opqFog.material.uniforms.uT.value = t;
    opqFog.material.uniforms.uOp.value = vis*0.62;
    opqWeb.material.opacity = vis*0.30*smooth((u-0.12)/0.3);
    pOp(opqElectrons, vis*0.85);
    // electron nhấp nháy tại các điểm gấp
    arr = alpArr(opqElectrons); var eph = opqElectrons.userData.ph;
    for (i=0;i<arr.length;i++){
      arr[i] = 0.35 + 0.65*Math.pow(0.5+0.5*Math.sin(t*7.0+eph[i]), 3.0);
    }
    flushAlp(opqElectrons);

    // photon chủ thể đi dọc đường gấp khúc — mỗi đoạn là một cú nảy
    var seg = Math.floor(t*26) % (heroPath.length-2);
    var segU = (t*26) % 1;
    var A = heroPath[seg], B2 = heroPath[seg+1];
    aimStreak(heroStreak,
      A.x+(B2.x-A.x)*Math.max(0,segU-0.35), A.y+(B2.y-A.y)*Math.max(0,segU-0.35),
      A.z+(B2.z-A.z)*Math.max(0,segU-0.35),
      A.x+(B2.x-A.x)*segU, A.y+(B2.y-A.y)*segU, A.z+(B2.z-A.z)*segU);
    heroStreak.userData.mat.uniforms.uOp.value = vis;
    // đuôi motion-trail ngắn
    for (i=0;i<heroTrail.length;i++){
      var si = seg - i - 1;
      if (si < 0){ heroTrail[i].visible=false; continue; }
      heroTrail[i].visible = true;
      var A2=heroPath[si], B3=heroPath[si+1];
      aimStreak(heroTrail[i], A2.x,A2.y,A2.z, B3.x,B3.y,B3.z);
      heroTrail[i].userData.mat.uniforms.uOp.value = vis*(1-i/heroTrail.length)*0.5;
    }
    // bám sát photon 3 cú nảy, rồi pull-back rất chậm ra khung CỰC RỘNG
    var track = 1 - smooth((u-0.20)/0.55);
    var cd = 6 + (1-track)*54;
    var cx2 = A.x*track, cy2 = A.y*track, cz2 = A.z*track;
    cam(cx2*0.7, cy2*0.7+2, cz2*0.7+cd, cx2, cy2, cz2, 60 - track*18, 0.05, t);
  }

  /* --- S06: đám đông — một tỉ photon trên một hạt vật chất -------------- */
  if (inSc(t,'S06')){
    u = loc(t,'S06'); vis = W(t,'S06',0.5);
    show(gCrowd, vis);
    // ba lớp hiện LẦN LƯỢT
    var lP = smooth(u/0.10), lN = smooth((u-0.11)/0.10), lE = smooth((u-0.22)/0.10);
    pOp(crowdP, vis*lP); pOp(crowdN, vis*lN); pOp(crowdE, vis*lE);
    [crowdP, crowdN, crowdE].forEach(function(P){
      var ar=posArr(P), ba=P.userData.base, hp=P.userData.ph;
      for (var q=0;q<ar.length;q+=3){
        var j=q/3;
        ar[q]  = ba[q]  + Math.sin(t*0.55+hp[j])*0.85;
        ar[q+1]= ba[q+1]+ Math.cos(t*0.47+hp[j]*1.4)*0.75;
        ar[q+2]= ba[q+2]+ Math.sin(t*0.41+hp[j]*2.1)*0.7;
      }
      flushPos(P);
    });
    // photon tràn vào tới khi che GẦN HẾT hai lớp kia
    var flood = smooth((u-0.34)/0.42);
    crowdPhoton.material.opacity = vis*flood*0.75;
    // zoom-out từng NẤC (3 nấc rời) — mỗi lần nhân mật độ photon lên x10
    var step = u<0.52?0 : (u<0.66?1 : (u<0.80?2:3));
    var zoomD = 44 + step*17;
    crowdPhoton.scale.setScalar(1 + step*0.42);
    ratioBar.userData.one.material.opacity  = vis*smooth((u-0.60)/0.12);
    ratioBar.userData.many.material.opacity = vis*smooth((u-0.62)/0.12)*0.85;
    // kết shot: photon dồn về tâm rồi tắt đột ngột
    var collapse = u>0.93 ? smooth((u-0.93)/0.07) : 0;
    crowdPhoton.scale.multiplyScalar(1-collapse*0.75);
    crowdPhoton.material.opacity *= (1-collapse);
    cam(0, 0, zoomD, 0,0,0, 46, 0.04, t);
  }

  /* --- S07: ngôi sao đang chết — "đúng MỘT PHẦN" ------------------------ */
  if (inSc(t,'S07')){
    u = loc(t,'S07'); vis = W(t,'S07',0.6);
    show(gDying, vis);
    // khung TƯỞNG TƯỢNG: giảm bão hoà 20% bằng cách hạ emissive + kéo về xám
    tickStar(dyingStar, t, 1.55, vis);
    var shell = smooth((u-0.18)/0.5);
    arr = posArr(dyingShell); var db = dyingShell.userData.base;
    var grow = 1 + shell*0.55 + t*0.004;
    for (i=0;i<arr.length;i++) arr[i] = db[i]*grow;
    flushPos(dyingShell);
    pOp(dyingShell, vis*shell*0.75);
    for (i=0;i<dyingLabels.length;i++){
      var sp = dyingLabels[i], sd=sp.userData;
      var lu2 = smooth((u-0.30-i*0.045)/0.18);
      var rr2 = sd.r0 + lu2*9.5;
      sp.position.set(Math.cos(sd.a)*rr2, sd.y*0.5 + lu2*2.2, Math.sin(sd.a)*rr2*0.5);
      sp.material.opacity = vis*lu2*(1-smooth((u-0.82)/0.18))*0.9;
    }
    dyingNote.material.opacity = vis*band(u,0.55,0.86,0.10)*0.85;
    // orbit chậm 10° quanh ngôi sao đang chết
    var ang = -0.30 + smooth(u)*0.175;
    cam(Math.sin(ang)*44, 5, Math.cos(ang)*44, 0,0,0, 46, 0.03, t);
    // kết: hình ngôi sao CO LẠI thành một chấm sáng
    var shrink = u>0.90 ? smooth((u-0.90)/0.10) : 0;
    dyingStar.scale.setScalar(1-shrink*0.92);
    dyingShell.scale.setScalar(1-shrink*0.9);
  }

  /* --- S08: kiểm đếm cơ thể theo SỐ NGUYÊN TỬ -------------------------- */
  if (inSc(t,'S08')){
    u = loc(t,'S08'); vis = W(t,'S08',0.5);
    show(gBody, vis);
    var kind = bodyHuman.userData.kind, a0 = bodyHuman.userData.alpha0;
    arr = alpArr(bodyHuman);
    // ba nhóm hiện TRƯỚC (C, O, Fe), rồi tất cả mờ đi và 60% bật sáng HYDRO
    var showCOF = smooth((u-0.06)/0.16);
    var toH     = smooth((u-0.44)/0.22);
    for (i=0;i<kind.length;i++){
      var kk = kind[i];
      var av;
      if (kk===0) av = 0.10 + toH*0.95;                 // hydro
      else        av = showCOF*(1 - toH*0.72);          // C / O / Fe
      arr[i] = a0[i]*av;
    }
    flushAlp(bodyHuman);
    pEm(bodyHuman, 0.90);
    pOp(bodyHuman, vis*0.30);
    // graph 10 ô, 6 ô sáng hydro
    var bx = boxRow.userData.arr;
    for (i=0;i<10;i++){
      var lit = i<6 ? smooth((u-0.58-i*0.028)/0.09) : 0;
      bx[i].q.material.opacity = vis*(0.04 + lit*0.85);
      bx[i].f.material.opacity = vis*0.45*smooth((u-0.52)/0.1);
    }
    // đứng yên; cuối shot push-in nhẹ vào vùng NGỰC
    var push = smooth((u-0.78)/0.22);
    cam(0, 0.6 + push*1.2, 25 - push*5.5, 0, 0.6+push*1.4, 0, 40, 0.025, t);
  }

  /* --- S09: hai cách đếm — ĐẦU NGƯỜI ↔ CÂN NẶNG ------------------------ */
  if (inSc(t,'S09')){
    u = loc(t,'S09'); vis = W(t,'S09',0.5);
    show(gBody, vis*0.9); show(gMass, vis);
    var kind2 = bodyHuman.userData.kind, a02 = bodyHuman.userData.alpha0;
    arr = alpArr(bodyHuman);
    for (i=0;i<kind2.length;i++) arr[i] = a02[i]*(kind2[i]===0?1.0:0.30);
    flushAlp(bodyHuman);
    pOp(bodyHuman, vis*0.85);
    boxRow.visible = false;
    // morph MƯỢT giữa hai thanh để thấy rõ ĐẢO NGƯỢC
    var mu = smooth((u-0.16)/0.30);       // 0 = SỐ LƯỢNG, 1 = KHỐI LƯỢNG
    var mud = massBars.userData;
    var frac = [ 0.62*(1-mu) + 0.10*mu,      // H: 62% → 10%
                 0.24*(1-mu) + 0.65*mu,      // O: 24% → 65%
                 0.12*(1-mu) + 0.18*mu ];    // C: 12% → 18%
    var TW2 = 21, xoff = -10.5, ybar = 9.0;
    for (i=0;i<3;i++){
      var wseg = frac[i]*TW2;
      mud.segs[i].scale.x = Math.max(0.01, wseg);
      mud.segs[i].position.set(xoff, ybar, 0);
      mud.segs[i].material.opacity = vis*0.92;
      sizeLabel(mud.labs[i], 0.9);
      mud.labs[i].position.set(xoff + wseg*0.5, ybar + 1.8, 0);
      mud.labs[i].material.opacity = vis*(wseg>1.4?0.9:0.0);
      xoff += wseg;
    }
    if (mud.cap.userData.txt !== (mu>0.5?'m':'n')){ /* nhãn đổi bằng opacity */ }
    mud.cap.material.opacity = vis*0.75;
    mud.cap.position.set(-10.5 + TW2*0.5, ybar+3.6, 0);
    // nửa sau: ngôi sao quay lại rất MỜ rồi bị lớp kính lam CHẶN LẠI
    var back = smooth((u-0.56)/0.22);
    tickStar(massStarGhost, t, 0.85, vis*back*0.55);
    glassPane.material.opacity = vis*smooth((u-0.72)/0.16)*0.20;
    massStarGhost.visible = back>0.01;
    // ngôi sao mờ hẳn về đen ở cuối
    var fadeOut = smooth((u-0.90)/0.10);
    if (fadeOut>0){ tickStar(massStarGhost, t, 0.85, vis*back*0.55*(1-fadeOut)); }
    cam(0, 0.5, 27, 0, 0.5, 0, 44, 0.025, t);
  }

  /* --- S10: ĐỒNG HỒ HAI MƯƠI PHÚT lần đầu ------------------------------ */
  if (inSc(t,'S10')){
    u = loc(t,'S10'); vis = W(t,'S10',0.5);
    show(gPlasma, vis*0.42); show(gClock10, vis);
    var p10 = plasmaField.userData.mat.uniforms;
    p10.uT.value = t; p10.uGrow.value = 1.35;
    p10.uWarmMix.value = 1.0;          // nền plasma đã NGUỘI một nấc: ngả kem

    p10.uEm.value = 0.42;
    setClock(clock10, 20*smooth((u-0.20)/0.55), vis*smooth(u/0.14), true);
    var eb2 = eonBar.userData;
    var eV = vis*smooth((u-0.42)/0.2);
    eb2.line.material.opacity = eV*0.8;
    eb2.tick.material.opacity = eV;
    eb2.lab.material.opacity = eV*0.75;
    eb2.lab2.material.opacity = eV*0.9;
    // push-in chậm 35mm → 60mm
    var pi = smooth(u);
    cam(0, -2.0 + pi*1.4, 34 - pi*7, 0, -2.0+pi*1.4, 0, 52 - pi*14, 0.03, t);
  }

  /* --- S11: ba biểu tượng — CỬA / ĐỒNG HỒ / KHO NEUTRON ---------------- */
  if (inSc(t,'S11')){
    u = loc(t,'S11'); vis = W(t,'S11',0.5);
    show(gThree, vis);

    setClock(clock11, 20 - (t-SC.S11[0])*0.75, vis*smooth((u-0.14)/0.16), true);

    arr = alpArr(store11);
    var dth = store11.userData.death, al0 = store11.userData.alpha0;

      var dt2 = (t - SC.S11[0])/12.0;
      var dead = dth[i] < dt2*0.28 ? 1 : 0;
      var blink = dead ? 0 : (0.75 + 0.25*Math.sin(t*3.0 + i));
      arr[i] = al0[i]*blink*(1-dead);
    }
    flushAlp(store11);
    pOp(store11, vis*smooth((u-0.26)/0.16));

    cam(0, 0, 40 + back2*16, 0, 0, 0, 46, 0.03, t);

  /* ======================= CHƯƠNG 2 ======================= */

  /* --- S12: macro MỘT proton và MỘT neutron ---------------------------- */
  if (inSc(t,'S12')){
    u = loc(t,'S12'); vis = W(t,'S12',0.5);
    show(gPair, vis);
    tickNucleon(pairP, t, 1.4, vis);
    tickNucleon(pairN, t, 1.2, vis);

    }

  }

  /* --- S13: HOÁN ĐỔI n ↔ p, luôn kèm LEPTON --------------------------- */
  if (inSc(t,'S13')){
    u = loc(t,'S13'); vis = W(t,'S13',0.5);
    show(gSwap, vis);
    var rate = swapPts.userData.rate, sph = swapPts.userData.ph;
    var cA2 = swapPts.geometry.attributes.color.array;
    var cp = C3(COL.proton), cn = C3(COL.neutron);
    // nhịp hoán đổi bắt đầu CHẬM LẠI ở cuối shot (dẫn thẳng vào freeze-out)
    var slow = 1 - smooth((u-0.72)/0.28)*0.72;
    for (i=0;i<SWAP_N;i++){
      var ph2 = Math.sin(t*rate[i]*2.6*slow + sph[i]);
      var isP2 = ph2 > 0;
      var mixv = clamp(Math.abs(ph2)*3.0, 0, 1);
      var c1 = isP2?cp:cn, c2 = isP2?cn:cp;
      cA2[i*3]   = c2.r + (c1.r-c2.r)*mixv;
      cA2[i*3+1] = c2.g + (c1.g-c2.g)*mixv;
      cA2[i*3+2] = c2.b + (c1.b-c2.b)*mixv;
    }
    swapPts.geometry.attributes.color.needsUpdate = true;
    arr = posArr(swapPts); var sb = swapPts.userData.base;

      arr[i+1]= sb[i+1]+ Math.cos(t*0.39+sph[j2]*1.5)*0.95;

    pOp(swapPts, vis);

    for (i=0;i<na.length/6;i++){
      var o3=i*7;
      var born = (t*0.55 + nsd[o3])%1;
      var sx=(nsd[o3+1]-0.5)*54, sy=(nsd[o3+2]-0.5)*31, sz=(nsd[o3+3]-0.5)*32;
      var dx=(nsd[o3+4]-0.5), dy=(nsd[o3+5]-0.5), dz=(nsd[o3+6]-0.5);
      var dl=Math.sqrt(dx*dx+dy*dy+dz*dz)||1;
      var tr = born*60;
      segSet(na, i, sx+dx/dl*tr, sy+dy/dl*tr, sz+dz/dl*tr,
        sx+dx/dl*(tr+3.2), sy+dy/dl*(tr+3.2), sz+dz/dl*(tr+3.2));
    }
    swapNeutrinos.geometry.attributes.position.needsUpdate = true;
    swapNeutrinos.material.opacity = vis*0.30*slow;
    // electron/positron kèm theo
    arr = posArr(swapLeptons); var lb2 = swapLeptons.userData.base, lph = swapLeptons.userData.ph;
    var la = alpArr(swapLeptons), la0 = swapLeptons.userData.alpha0;
    for (i=0;i<arr.length;i+=3){
      var j3=i/3;
      var pop = (t*1.3 + lph[j3])%1;
      var fly = pop*7.0;
      arr[i]  = lb2[i]  + Math.cos(lph[j3])*fly;
      arr[i+1]= lb2[i+1]+ Math.sin(lph[j3]*1.7)*fly;
      arr[i+2]= lb2[i+2]+ Math.sin(lph[j3]*2.3)*fly;
      la[j3] = la0[j3]*(1-pop)*slow;
    }
    flushPos(swapLeptons); flushAlp(swapLeptons);
    pOp(swapLeptons, vis*0.9);
    // pull-back từ macro ra khung vừa, rồi TĨNH để mắt bắt được nhịp
    var pb = smooth(u/0.34);
    cam(0, 0, 18 + pb*28, 0,0,0, 30 + pb*16, 0.03, t);
  }

  /* --- S14: CÂN hai đĩa — neutron NẶNG hơn một chút ------------------- */
  if (inSc(t,'S14')){
    u = loc(t,'S14'); vis = W(t,'S14',0.5);
    show(gScale, vis);
    var sr = scaleRig.userData;
    // thanh nhiệt độ tụt dần; MỖI NẤC TỤT thì góc nghiêng lại TĂNG
    var cool = smooth((u-0.12)/0.72);
    sr.tFill.scale.y = 1 - cool*0.62;
    var tilt = -(0.5 + cool*2.6) * Math.PI/180;   // 0,5° → 3,1°
    sr.beam.rotation.z = tilt;
    sr.pl.position.set(-10, Math.sin(-tilt)*10, 0);
    sr.pr.position.set( 10, Math.sin(tilt)*10, 0);
    tickNucleon(sr.pl.userData.n, t, 1.4, vis);
    tickNucleon(sr.pr.userData.n, t, 1.2, vis);
    sr.zoom.visible = u>0.34;
    sr.zoom.children.forEach(function(ch){
      if (ch.material) ch.material.opacity = vis*smooth((u-0.34)/0.14)*(ch.type==='Line'?0.6:0.9);
    });
    // bảng màu dịch một nấc: trắng-xanh → cam vàng (vũ trụ đang nguội)
    sr.beam.material.emissiveIntensity = 0.9;
    // cuối shot đẩy nhẹ vào ĐIỂM CÂN, rồi cân đứng KHỰNG
    var freezeAt = u>0.94 ? 1 : 0;
    if (freezeAt){ sr.beam.rotation.z = -(0.5+2.6)*Math.PI/180; }
    var pin = smooth((u-0.76)/0.24);
    cam(0, -1 - pin*1.5, 40 - pin*9, 0, -1-pin*1.5, 0, 46, 0.025*(1-freezeAt), t);
  }

  /* --- S15: FREEZE-OUT — giãn ĐỀU theo scale factor, KHÔNG có tâm ----- */
  if (inSc(t,'S15')){
    u = loc(t,'S15'); vis = W(t,'S15',0.4);
    show(gFreeze, vis);
    // a(t): toàn trường nhân đều — khoảng cách TƯƠNG ĐỐI giữ nguyên
    var aScale = 1 + smooth(u)*0.92;
    var lockU = smooth((u-0.60)/0.06);            // khoảnh khắc KHOÁ
    arr = posArr(freezePts);
    var fb = freezePts.userData.base, fph = freezePts.userData.ph, frt = freezePts.userData.rate;
    var cA3 = freezePts.geometry.attributes.color.array;
    var cp2=C3(COL.proton), cn2=C3(COL.neutron);
    for (i=0;i<arr.length;i+=3){
      var j4=i/3;
      arr[i]  = (fb[i]  + Math.sin(t*0.3+fph[j4])*0.7)*aScale;
      arr[i+1]= (fb[i+1]+ Math.cos(t*0.27+fph[j4]*1.3)*0.6)*aScale;
      arr[i+2]= (fb[i+2]+ Math.sin(t*0.24+fph[j4]*1.9)*0.65)*aScale;
      // các tia hoán đổi THƯA DẦN rồi TẮT HẲN; sau đó MÀU bị khoá vĩnh viễn
      var swRate = (1-lockU);
      var ph3 = Math.sin(t*frt[j4]*2.2*swRate + fph[j4]);
      var isP3 = lockU>0.5 ? (fph[j4] > 0.85) : (ph3>0);   // khoá ~1/6 neutron
      var c3 = isP3?cn2:cp2;
      cA3[j4*3]=c3.r; cA3[j4*3+1]=c3.g; cA3[j4*3+2]=c3.b;
    }
    flushPos(freezePts);
    freezePts.geometry.attributes.color.needsUpdate = true;
    pOp(freezePts, vis);
    // khung viền BĂNG chạy quanh mép khung như đóng băng
    iceFrame.visible = lockU>0.01;
    iceFrame.userData.parts.forEach(function(q){ q.material.opacity = vis*lockU*0.85; });
    // tĩnh tuyệt đối; đúng khoảnh khắc khoá, khung GIẬT một nhịp rất nhỏ
    var jolt = (u>0.60 && u<0.615) ? 0.45 : 0;
    cam(0+jolt, 0, 52, 0,0,0, 46, 0, t);
  }

  /* --- S16: NGÂN SÁCH chốt — sáu proton cho một neutron --------------- */
  if (inSc(t,'S16')){
    u = loc(t,'S16'); vis = W(t,'S16',0.5);

    for (i=0;i<cells.length;i++){
      var cd = cells[i];
      var gx0 = (cd.idx-3)*2.2, gy0 = (2.5-cd.cluster)*2.5;
      var gx1 = (cd.idx-3)*1.45 - 3.0, gy1 = (2.5-cd.cluster)*2.9;
      cd.n.position.set(gx0+(gx1-gx0)*gather, gy0+(gy1-gy0)*gather,
        Math.sin(t*0.5+i)*0.25);
      tickNucleon(cd.n, t, cd.isN?1.2:1.4, vis);
    }
    var sbu = storeBar.userData;
    var sv = vis*smooth((u-0.42)/0.16);
    sbu.frame.material.opacity = sv*0.9;
    sbu.fill.material.opacity = sv*0.75;
    sbu.fill.scale.y = 1.0;

    sbu.lockBody.material.opacity = sv*lockv;
    sbu.sh.material.opacity = sv*lockv;
    var pin2 = smooth((u-0.62)/0.2);
    cam(0, 0, 30 - pin2*1.2, 0,0,0, 46, 0.02, t);

  /* --- S17: neutron TRONG hạt nhân (bất tử) ↔ TỰ DO (tự vỡ) ---------- */
  if (inSc(t,'S17')){

      bc.arr[i].position.x += Math.sin(t*5.0+i)*0.012;

    var dp = decayProducts;
    dp.p.visible = dec>0.01; dp.e.visible = dec>0.01; dp.nu.visible = dec>0.01;
    if (dec>0.01){
      var fly2 = dec*7.0;
      dp.p.position.set(4.4 - fly2*0.55, 1 - fly2*0.28, 0);
      tickNucleon(dp.p, t, 1.4, vis*dec);
      arr = posArr(dp.e);
      arr[0]=4.4+fly2*1.1; arr[1]=1+fly2*0.75; arr[2]=fly2*0.3;
      flushPos(dp.e); pOp(dp.e, vis*dec);

    }

    // giữa hai chủ thể nên khung trống một nửa, không đọc ra ý gì.
    var pan = smooth((u-0.10)/0.26);
    var fx = -4.4 + pan*8.8;
    cam(fx, 0.9, 17.5, fx, 0.9, 0, 36, 0.025, t);
  }

  /* --- S18 ★ tỉ số TRƯỢT 1/6 → 1/7 ---------------------------------- */
  if (inSc(t,'S18')){

    for (i=0;i<rr3.NP;i++){

      var yy = (ratio - 0.13)/0.045 * rr3.H*0.62 + rr3.H*0.18;
      var clip = Math.min(fu, prog);

      var ycl = (rc - 0.13)/0.045 * rr3.H*0.62 + rr3.H*0.18;
      rr3.arr[i*3]   = clip*rr3.W;

      rr3.arr[i*3+2] = 0;
    }

    rr3.curve.material.opacity = vis*appear;

  }

  /* --- S19: nguyên liệu chết dần → nhốt vào hạt nhân là ĐƯỢC CỨU ----- */
  if (inSc(t,'S19')){

  }

  /* --- S20: DEUTERIUM ra đời — mối nối MẢNH và RUNG ------------------ */
  if (inSc(t,'S20')){
    u = loc(t,'S20'); vis = W(t,'S20',0.5);

    [dd2.bond, dd2.bond2].forEach(function(r){

  }

  /* --- S21: vừa hình thành đã bị XÉ TOẠC — thủ phạm: photon --------- */
  if (inSc(t,'S21')){
    u = loc(t,'S21'); vis = W(t,'S21',0.35);
    show(gSmash, vis);
    var sd2 = smashD.userData;
    // ba nhịp NGẮN DẦN (0.9s → 0.5s → 0.3s) — không kịp thở
    var marks2 = [0, 0.30, 0.58, 0.78], lens2 = [0.30, 0.28, 0.20, 0.22];
    var cyc = 0, cu = 0;
    for (i=0;i<4;i++){ if (u >= marks2[i]){ cyc = i; cu = (u-marks2[i])/lens2[i]; } }
    cu = clamp(cu,0,1);
    var joinD = smooth(cu/0.55), brkD = cu>0.68 ? smooth((cu-0.68)/0.14) : 0;
    var sp2 = 5.4 - joinD*3.2 + brkD*13.0;
    sd2.p.position.set(-sp2, brkD*2.2, 0);
    sd2.n.position.set( sp2,-brkD*2.2, 0);
    tickNucleon(sd2.p, t, 1.4, vis);
    tickNucleon(sd2.n, t, 1.2, vis);
    sd2.bond.scale.setScalar(sp2*0.52);
    sd2.bond.material.opacity = vis*joinD*(1-brkD)*(0.85+0.15*Math.sin(t*13));
    sd2.bond.rotation.y = t*0.5;
    // vệt photon emissive 2.6 LAO XÉO vào
    var pShow = (cu>0.50 && cu<0.80);
    smashPhoton.visible = pShow;
    if (pShow){
      var pu2 = (cu-0.50)/0.30;
      aimStreak(smashPhoton, 30-pu2*30, 20-pu2*20, 14-pu2*14, 0,0,0);
      smashPhoton.userData.mat.uniforms.uOp.value = vis*(1-Math.abs(pu2-0.55)*1.5);
    }
    // rack-focus: hậu cảnh KHÔNG phải bóng tối mà là BIỂN PHOTON đang chờ
    photonSea.material.opacity = vis*smooth((u-0.42)/0.30)*0.55;
    cam(0, 0, 17, 0, 0, 0, 30, 0.03, t);
  }

  /* --- S22 ★ SÂN VẬN ĐỘNG: hai viên gạch, một tỉ người ném đá ------- */
  if (inSc(t,'S22')){
    u = loc(t,'S22'); vis = W(t,'S22',0.35);
    show(gStadium, vis);
    // CRANE-UP + pull-back liên tục KHÔNG CẮT
    var cu2 = smooth(u);
    var camY = 2.2 + Math.pow(cu2,1.35)*185;
    var camZ = 9 + Math.pow(cu2,1.3)*215;
    // khán đài nhân bản ra ngoài mép khung khi lên cao (không đếm nổi)
    stadCrowd.scale.setScalar(1 + cu2*1.65);
    pOp(stadCrowd, vis*(0.55+cu2*0.45));
    stadFloor.material.opacity = vis*0.35*(1-cu2*0.6);
    // hai viên gạch giữ ĐÚNG bảng màu hạt — kết shot chỉ còn 2 pixel
    var sbk = stadBricks.userData;
    tickNucleon(sbk.p, t, 1.4, vis);
    tickNucleon(sbk.n, t, 1.2, vis);
    // mưa đá: mật độ TĂNG theo độ cao camera
    var ra = stadRain.geometry.attributes.position.array;
    var rsd = stadRain.userData.seed;
    var active = Math.floor(600 + cu2*4600);
    for (i=0;i<ra.length/6;i++){
      if (i>=active){ segSet(ra,i, 0,-999,0, 0,-999,0); continue; }
      var o4=i*5;
      var fall = ((t*0.55 + rsd[o4])%1);
      var ang2 = rsd[o4+1]*6.283;
      var r0 = 32 + rsd[o4+2]*130;
      var h0 = 6 + rsd[o4+3]*80;
      var rr4 = r0*(1-fall);
      var hh2 = h0*(1-fall) + 1.0;
      var rr5 = r0*(1-Math.min(1,fall+0.035));
      var hh3 = h0*(1-Math.min(1,fall+0.035)) + 1.0;
      segSet(ra, i, Math.cos(ang2)*rr4, hh2, Math.sin(ang2)*rr4,
        Math.cos(ang2)*rr5, hh3, Math.sin(ang2)*rr5);
    }
    stadRain.geometry.attributes.position.needsUpdate = true;
    stadRain.material.opacity = vis*(0.35+cu2*0.45);
    cam(0, camY, camZ, 0, camY*0.12, 0, 42 + cu2*18, 0.03, t);
  }

  /* --- S23: phân bố năng lượng photon — cái ĐUÔI là toàn bộ vấn đề -- */
  if (inSc(t,'S23')){
    u = loc(t,'S23'); vis = W(t,'S23',0.5);
    show(gDist, vis);
    var dr2 = distRig.userData;
    // gò lớn quanh giá trị TRUNG BÌNH + đuôi kéo dài về phải
    var peakX = 0.22;
    var thrX = 0.62;                     // ngưỡng nằm XA bên phải đỉnh gò
    for (i=0;i<dr2.NP;i++){
      var fx = i/(dr2.NP-1);
      // phân bố Planck-ish: x^2 e^{-x/T}
      var xn = fx/peakX*2.0;
      var yv = Math.pow(xn,2.0)*Math.exp(-xn)*dr2.H*0.72;
      dr2.hump.userData.arr[i*3]   = fx*dr2.W;
      dr2.hump.userData.arr[i*3+1] = yv;
      dr2.hump.userData.arr[i*3+2] = 0;
      // dải fill chỉ ở phần ĐUÔI vượt ngưỡng
      var inTail = fx >= thrX;
      dr2.tail.userData.arr[i*6]   = fx*dr2.W;
      dr2.tail.userData.arr[i*6+1] = 0;
      dr2.tail.userData.arr[i*6+2] = 0.05;
      dr2.tail.userData.arr[i*6+3] = fx*dr2.W;
      dr2.tail.userData.arr[i*6+4] = inTail ? yv : 0;
      dr2.tail.userData.arr[i*6+5] = 0.05;
    }
    dr2.hump.geometry.attributes.position.needsUpdate = true;
    dr2.tail.geometry.attributes.position.needsUpdate = true;
    var gv2 = vis*smooth(u/0.12);
    dr2.hump.material.opacity = gv2*0.75;
    dr2.ax.material.opacity = gv2*0.6;
    dr2.thr.position.set(thrX*dr2.W, 0, 0);
    dr2.thr.material.opacity = gv2*smooth((u-0.20)/0.12);
    dr2.thrLab.position.set(thrX*dr2.W + 5.0, dr2.H*0.92, 0);
    dr2.thrLab.material.opacity = gv2*smooth((u-0.22)/0.12)*0.9;
    // diện tích TÍ HON nhưng KHÔNG bằng không
    dr2.tail.material.opacity = gv2*smooth((u-0.36)/0.16)*0.85;
    // sợi mảnh deuterium — chỉ photon lấy từ vùng ĐUÔI mới bẻ được
    var dbu = distBond.userData;
    tickNucleon(dbu.p, t, 1.4, vis);
    tickNucleon(dbu.n, t, 1.2, vis);
    var snap = (t*0.55)%1;
    dbu.fib.material.opacity = vis*(snap<0.7 ? 0.9 : 0.0);
    dbu.p.position.set(-0.95 - (snap>0.7?(snap-0.7)*9:0), 0, 0);
    dbu.n.position.set( 0.95 + (snap>0.7?(snap-0.7)*9:0), 0, 0);
    // cuối shot lia ngang sang phần đuôi và GIỮ ở đó
    var pan2 = smooth((u-0.70)/0.30);
    cam(pan2*13, 0, 38 - pan2*8, pan2*13, 0, 0, 46, 0.02, t);
  }

  /* --- S24: NÚT THẮT CỔ CHAI DEUTERIUM ------------------------------ */
  if (inSc(t,'S24')){
    u = loc(t,'S24'); vis = W(t,'S24',0.5);
    // nửa đầu: gò dịch sang trái (nguội) nhưng ĐUÔI vẫn vắt qua ngưỡng
    var half = smooth((u-0.42)/0.18);
    if (half < 0.99){
      show(gDist, vis*(1-half));
      var dr3 = distRig.userData;
      var peak2 = 0.22 - smooth(u/0.42)*0.085;     // nguội đi
      var thr2 = 0.62;
      for (i=0;i<dr3.NP;i++){
        var fx2 = i/(dr3.NP-1);
        var xn2 = fx2/peak2*2.0;
        var yv2 = Math.pow(xn2,2.0)*Math.exp(-xn2)*dr3.H*0.72;
        dr3.hump.userData.arr[i*3]=fx2*dr3.W; dr3.hump.userData.arr[i*3+1]=yv2;
        dr3.tail.userData.arr[i*6]=fx2*dr3.W; dr3.tail.userData.arr[i*6+1]=0;
        dr3.tail.userData.arr[i*6+2]=0.05;
        dr3.tail.userData.arr[i*6+3]=fx2*dr3.W;
        dr3.tail.userData.arr[i*6+4]=fx2>=thr2?yv2:0;
        dr3.tail.userData.arr[i*6+5]=0.05;
      }
      dr3.hump.geometry.attributes.position.needsUpdate=true;
      dr3.tail.geometry.attributes.position.needsUpdate=true;
      dr3.hump.material.opacity = vis*(1-half)*0.75;
      dr3.ax.material.opacity = vis*(1-half)*0.6;
      dr3.thr.position.set(thr2*dr3.W,0,0);
      dr3.thr.material.opacity = vis*(1-half);
      dr3.thrLab.material.opacity = vis*(1-half)*0.9;
      dr3.tail.material.opacity = vis*(1-half)*0.85;
      distBond.visible = false;
    }
    // nửa sau: CỔ CHAI dựng bằng chính dòng hạt, NGHẼN ở đoạn cổ hẹp
    if (half > 0.01){
      show(gNeck, vis*half);
      neckOutline.children.forEach(function(l){ l.material.opacity = vis*half*0.95; });
      var na2 = posArr(neckFlow), nsd2 = neckFlow.userData.seed;
      var naa = alpArr(neckFlow);
      for (i=0;i<na2.length/3;i++){
        var o5=i*4;
        var rise = ((t*0.20 + nsd2[o5])%1);
        var yy2 = -13 + rise*26;
        // bị NGHẼN: chỉ vài hạt lọt qua rồi bị đánh bật trở lại
        var pass = nsd2[o5+1] < 0.045;
        if (yy2 > 3.4 && !pass){
          yy2 = 3.4 - (yy2-3.4)*2.2;                // bật ngược
        }
        var wlim = 9.0 - 7.2*Math.exp(-Math.pow((yy2-4.0)/3.2,2));
        if (yy2>4.0) wlim = Math.min(wlim, 1.8+(yy2-4.0)*0.10);
        na2[i*3]   = (nsd2[o5+2]-0.5)*2*wlim*0.92;
        na2[i*3+1] = yy2;
        na2[i*3+2] = (nsd2[o5+3]-0.5)*4.5;
        naa[i] = yy2 > 6.0 ? 0.25 : 0.85;           // phần trên TỐI OM
      }
      neckFlow.geometry.attributes.position.needsUpdate=true;
      flushAlp(neckFlow);
      pOp(neckFlow, vis*half);
    }
    cam(0, 0, 40, 0, 0, 0, 46, 0.02, t);
  }

  /* --- S25: đủ nguyên liệu, đủ nhiệt, nhưng CỬA BỊ KHOÁ ------------- */
  if (inSc(t,'S25')){
    u = loc(t,'S25'); vis = W(t,'S25',0.5);
    show(gLocked, vis);
    // lớp gần: kho nguyên liệu đầy hạt, ĐANG ÉP SÁT
    arr = posArr(lockedStore);
    var lsb = lockedStore.userData.base, lsp = lockedStore.userData.ph;
    var press = smooth(u)*0.30;
    for (i=0;i<arr.length;i+=3){
      var j6=i/3;
      arr[i]  = lsb[i]  + Math.sin(t*0.5+lsp[j6])*0.5;
      arr[i+1]= lsb[i+1]+ Math.cos(t*0.44+lsp[j6]*1.4)*0.45;
      arr[i+2]= lsb[i+2]*(1-press) - press*4;
    }
    flushPos(lockedStore);
    // DOF chuyển focus lần lượt qua BA lớp
    var f1 = 1 - smooth((u-0.20)/0.18);
    var f2 = smooth((u-0.20)/0.18) * (1-smooth((u-0.58)/0.18));
    var f3 = smooth((u-0.58)/0.18);
    pOp(lockedStore, vis*(0.35 + f1*0.6));
    // lớp giữa: ổ khoá là một cụm PHOTON xoáy — ánh sáng CHÍNH LÀ cái khoá
    setDoor(lockedDoor, t, 0, 1, vis*(0.42 + f2*0.58));
    setClock(lockedClock, 20 - (t-SC.S25[0])*0.62, vis*(0.35+f3*0.65), true);
    var lsbu = lockedStoreBar.userData;
    lsbu.fill.scale.y = 1 - smooth(u)*0.22;
    lsbu.fill.material.opacity = vis*(0.35+f3*0.5);
    lsbu.frame.material.opacity = vis*(0.30+f3*0.45);
    cam(0, 0, 36, 0, 0, -8, 46, 0.022, t);
  }

  /* --- S26: chớp-vỡ hàng tỉ lần → hydro trơn → GIÃN NỞ (NGUỘI ĐI) --- */
  if (inSc(t,'S26')){
    u = loc(t,'S26'); vis = W(t,'S26',0.5);
    show(gCycle, vis);
    var cyA = cyclePairs.arr;
    var cpa = posArr(cyclePairs.P), cba = posArr(cyclePairs.B);
    var cpal = alpArr(cyclePairs.P), cbal = alpArr(cyclePairs.B);
    // ba đoạn: (a) chớp-vỡ dày đặc, (b) hydro trơn tối om, (c) GIÃN NỞ
    var segA = 1 - smooth((u-0.36)/0.10);
    var segB = smooth((u-0.36)/0.10) * (1-smooth((u-0.62)/0.10));
    var segC = smooth((u-0.62)/0.12);
    var expand2 = 1 + segC*0.75;
    for (i=0;i<cyA.length;i++){
      var ca2 = cyA[i];
      var ph4 = ((t + ca2.ph)/ca2.per)%1;
      var joinC = smooth(ph4/0.5), brkC = ph4>0.62 ? smooth((ph4-0.62)/0.14) : 0;
      var sepC = (2.4 - joinC*1.5 + brkC*5.5);
      var cc2=Math.cos(ca2.ang), sc2=Math.sin(ca2.ang);
      var bx2=ca2.x*expand2, by2=ca2.y*expand2, bz2=ca2.z*expand2;
      cpa[i*6]  =bx2-cc2*sepC; cpa[i*6+1]=by2-sc2*sepC; cpa[i*6+2]=bz2;
      cpa[i*6+3]=bx2+cc2*sepC; cpa[i*6+4]=by2+sc2*sepC; cpa[i*6+5]=bz2;
      cpal[i*2]=cpal[i*2+1]=segA;
      cba[i*3]=bx2; cba[i*3+1]=by2; cba[i*3+2]=bz2;
      cbal[i]=segA*joinC*(1-brkC);
    }
    cyclePairs.P.geometry.attributes.position.needsUpdate=true;
    cyclePairs.B.geometry.attributes.position.needsUpdate=true;
    flushAlp(cyclePairs.P); flushAlp(cyclePairs.B);
    pOp(cyclePairs.P, vis); pOp(cyclePairs.B, vis);
    // chấm neutron LẶNG LẼ tắt xen kẽ
    var cna = posArr(cycleNeutrons), cnb = cycleNeutrons.userData.base;
    var cndh = cycleNeutrons.userData.death, cnal = alpArr(cycleNeutrons);
    for (i=0;i<cna.length;i+=3){
      var j7=i/3;
      cna[i]=cnb[i]*expand2; cna[i+1]=cnb[i+1]*expand2; cna[i+2]=cnb[i+2]*expand2;
      cnal[j7] = (cndh[j7] > u*0.55 ? 0.9 : 0)*Math.max(segA, segC*0.35);
    }
    cycleNeutrons.geometry.attributes.position.needsUpdate=true;
    flushAlp(cycleNeutrons);
    pOp(cycleNeutrons, vis);
    // (b) vũ trụ HYDRO TRƠN: chỉ lác đác proton cam trong đen tuyệt đối
    var lpa = posArr(loneProtons), lpb = loneProtons.userData.base;
    for (i=0;i<lpa.length;i++) lpa[i]=lpb[i]*expand2;
    flushPos(loneProtons);
    pOp(loneProtons, vis*Math.max(segB, segC*0.6));
    // drift lùi rất chậm và ĐỀU suốt shot — chính là chuyển động giãn nở
    cam(0, 0, 44 + u*28, 0,0,0, 46, 0.02, t);
  }


  /* ======================= CHƯƠNG 3 ======================= */

  /* --- S27: CÁNH CỬA BẬT TUNG — ổ khoá photon MẤT LỰC --------------- */
  if (inSc(t,'S27')){
    u = loc(t,'S27'); vis = W(t,'S27',0.35);
    show(gOpen, vis);
    // thanh nhiệt độ tụt QUA vạch một tỉ độ
    var tb = tempBar.userData;
    var drop = smooth(u/0.42);
    tb.fill.scale.y = 1 - drop*0.58;
    tb.fill.material.opacity = vis;
    tb.mark.position.y = 10 - 0.58*20 + 0.0;
    tb.mark.material.opacity = vis*0.9;
    tb.lab.position.y = tb.mark.position.y - 1.5;
    tb.lab.material.opacity = vis*0.9;
    // đúng lúc đó: emissive ổ khoá RƠI 2.6 → 0.8 (dưới ngưỡng bloom, TẮT LOÉ)
    var burst = smooth((u-0.42)/0.12);
    var lockEm = 2.6 - burst*1.8;
    openDoor.userData.lock.material.uniforms.uEm.value = lockEm;
    // cửa BẬT TUNG — không từ từ
    setDoor(openDoor, t, Math.pow(burst,0.55), 1-burst, vis);
    // dòng hạt bị nén TRÀN QUA thành vệt
    var oa2 = posArr(openFlow), osd = openFlow.userData.seed;
    var oal = alpArr(openFlow);
    for (i=0;i<oa2.length/3;i++){
      var o6=i*4;
      var prog2 = ((t*0.5 + osd[o6])%1);
      var xx = -26 + prog2*52*burst;
      oa2[i*3]   = burst>0.02 ? xx : -26 + osd[o6+1]*4;
      oa2[i*3+1] = (osd[o6+2]-0.5)*(20 - Math.abs(xx)*0.22);
      oa2[i*3+2] = (osd[o6+3]-0.5)*11;
      oal[i] = burst*0.9;
    }
    openFlow.geometry.attributes.position.needsUpdate=true;
    flushAlp(openFlow);
    pOp(openFlow, vis*burst);
    // bảng màu bật ngược lên NÓNG một nhịp rồi bắt đầu nguội thật sự
    lens.uniforms.uFlash.value = burst>0.88 ? (1-(burst-0.88)/0.12)*0.55 : 0;
    // tĩnh trên khe cửa, rồi whip-out giật một nhịp
    var whip = burst>0.5 ? smooth((burst-0.5)/0.5) : 0;
    cam(0, 0, 30 + whip*26, 0,0,0, 42 + whip*22, 0.02+whip*0.12, t);
  } else {
    lens.uniforms.uFlash.value = 0;
  }

  /* --- S28: tất cả tràn qua cùng lúc → PHẢN ỨNG DÂY CHUYỀN ---------- */
  if (inSc(t,'S28')){
    u = loc(t,'S28'); vis = W(t,'S28',0.4);
    show(gChain, vis);
    var ca3 = posArr(chainFlow), csd = chainFlow.userData.seed;
    var cal = alpArr(chainFlow);
    // tốc độ TĂNG DẦN; số phản ứng tăng theo hàm mũ của t
    var speed = 0.35 + smooth(u)*1.5;
    for (i=0;i<ca3.length/3;i++){
      var o7=i*5;
      var pr3 = ((t*speed*(0.6+csd[o7+4]*0.8) + csd[o7])%1);
      // mật độ cao nhất ngay SÁT KHE, rồi toả ra
      var xx2 = -40 + pr3*95;
      var squeeze = Math.exp(-Math.pow(xx2/9, 2))*0.55;
      ca3[i*3]   = xx2;
      ca3[i*3+1] = (csd[o7+1]-0.5)*32*(1-squeeze);
      ca3[i*3+2] = (csd[o7+2]-0.5)*32*(1-squeeze);
      cal[i] = 0.8;
    }
    chainFlow.geometry.attributes.position.needsUpdate=true;
    pOp(chainFlow, vis);
    // photon vẫn bay quanh nhưng emissive THẤP, đi XUYÊN QUA vô hại
    var pa = chainPhotons.geometry.attributes.position.array;
    var psd = chainPhotons.userData.seed;
    for (i=0;i<pa.length/6;i++){
      var o8=i*5;
      var fl = ((t*0.9 + psd[o8])%1);
      var sx2 = -46 + fl*100, sy2=(psd[o8+1]-0.5)*36, sz2=(psd[o8+2]-0.5)*34;
      segSet(pa, i, sx2, sy2, sz2, sx2+3.6, sy2+(psd[o8+3]-0.5)*1.2, sz2);
    }
    chainPhotons.geometry.attributes.position.needsUpdate=true;
    chainPhotons.material.opacity = vis*0.42;
    // tracking bay CÙNG dòng hạt qua cửa, tốc độ tăng dần
    var fly3 = smooth(u);
    cam(-26 + fly3*44, 2, 34 - fly3*7, -18 + fly3*48, 0, 0, 48, 0.035, t);
  }

  /* --- S29: chuỗi phản ứng đổ dồn về HELI-4 ------------------------ */
  if (inSc(t,'S29')){
    u = loc(t,'S29'); vis = W(t,'S29',0.5);
    show(gFuse, vis);
    var fb2 = fuseBranches.userData;
    // ba nhánh, mỗi nhánh một đường sáng riêng, MỌI vector hướng về CÙNG đích
    var run = smooth((u-0.08)/0.42);
    [fb2.b1, fb2.b1b, fb2.b2, fb2.b2b].forEach(function(o9, idx){
      var sx3 = o9.position.x, tgtx = 0;
      var pu3 = clamp(run*1.25 - idx*0.06, 0, 1);
      o9.position.x = -16 + pu3*16;
      o9.position.y = o9.position.y;
      var ov = vis*(1-smooth((pu3-0.82)/0.18));
      o9.userData.ns.forEach(function(nn, ni){
        tickNucleon(nn, t, nn.userData.isP?1.4:1.2, ov);
      });
    });
    // giữ y nguyên gốc cho các nhánh (đặt lại mỗi frame → tất định)

      tickNucleon(be8LateP, t, 1.4, vis*(1-Math.max(0,(lp-0.75)/0.25)));
    }
    // macro tĩnh; sau khi Be-8 tan, camera KHÔNG di chuyển — để cái trống rỗng ở lại
    cam(0, 0, 26, 0,0,0, 44, 0.02, t);
  }

  /* --- S39 ★ (4/4): HAI BẬC BỊ RÚT MẤT — một TAI NẠN ------------- */
  if (inSc(t,'S39')){
    u = loc(t,'S39'); vis = W(t,'S39',0.5);
    show(gGaps, vis);
    // hai bậc RỖNG được nhấn bằng cách các bậc KHÁC DỊM TỐI 40% trong 1s
    var dimPulse = band(u, 0.34, 0.40, 0.045);
    var dimv = 1 - dimPulse*0.4;
    setLadder(gapsLadder, vis, {1:0.6,2:0.6,3:0.6,4:0.8}, dimv);
    // lực hạt nhân vẽ như những SỢI NỐI; ở A=5, A=8 các sợi KHÔNG khép được vòng
    var webV = smooth((u-0.22)/0.22);
    bondWeb.userData.arr.forEach(function(wo){
      wo.o.children.forEach(function(ch){
        if (ch.material && ch.material.opacity !== undefined){
          if (ch.type==='Points') ch.material.uniforms.uOp.value = vis*webV;
          else ch.material.opacity = vis*webV*(wo.closed?0.85:0.30);
        }
      });
      wo.o.rotation.y = Math.sin(t*0.3)*0.25;
    });
    // bảng tuần hoàn khổng lồ PHÍA TRÊN bậc 8, TỐI HOÀN TOÀN, không với tới được
    var tblV = smooth((u-0.52)/0.28);
    darkTable.visible = tblV>0.01;
    darkTable.userData.cells.forEach(function(cd2){
      cd2.q.material.opacity = vis*tblV*0.55;
      cd2.fr.material.opacity = vis*tblV*0.5;
      cd2.lb.material.opacity = vis*tblV*0.75;
    });
    // pull-back RẤT CHẬM và DÀI từ bậc 8 xuống chân thang, rồi tiếp tục lùi
    var pbk = smooth(u);
    cam(0, ladderY(8) - pbk*11, 26 + Math.pow(pbk,1.2)*62,
        0, ladderY(6) + pbk*5, 0, 44, 0.02, t);
  }

  /* --- S40: đủ nguyên liệu, đủ nhiệt — chỉ vài tia lách qua thành Li */
  if (inSc(t,'S40')){
    u = loc(t,'S40'); vis = W(t,'S40',0.5);
    show(gLith, vis);
    setLadder(lithLadder, vis*0.9, {1:0.5,2:0.5,3:0.5,4:0.7}, 1);
    // biển hạt vẫn DÀY ĐẶC và vẫn NÓNG — nhấn mạnh KHÔNG THIẾU gì cả
    var la2 = posArr(lithSea), lsb2 = lithSea.userData.base, lsp2 = lithSea.userData.ph;
    for (i=0;i<la2.length;i+=3){
      var j8=i/3;
      la2[i]  = lsb2[i]  + Math.sin(t*0.35+lsp2[j8])*1.1;
      la2[i+1]= lsb2[i+1]+ Math.cos(t*0.31+lsp2[j8]*1.3)*0.9;
      la2[i+2]= lsb2[i+2]+ Math.sin(t*0.28+lsp2[j8]*1.9)*1.0;
    }
    flushPos(lithSea);
    pOp(lithSea, vis*0.9);
    // hàng nghìn mũi tên phản ứng nhỏ ĐÂM LÊN bậc 5/8 rồi BẬT LẠI
    var lba = lithBounce.geometry.attributes.position.array;
    var lbs = lithBounce.userData.seed;
    for (i=0;i<lba.length/6;i++){
      var o13=i*4;
      var rise2 = ((t*0.7 + lbs[o13])%1);
      var tgtY = lbs[o13+1]<0.6 ? ladderY(5) : ladderY(8);
      var yA = -16 + rise2*(tgtY+16);
      var bounce = yA > tgtY-0.6;
      if (bounce) yA = tgtY-0.6 - (yA-(tgtY-0.6))*2.0;
      var xA = (lbs[o13+2]-0.5)*LAD_W*0.9;
      lba[i*6]=xA; lba[i*6+1]=yA; lba[i*6+2]=(lbs[o13+3]-0.5)*4;
      lba[i*6+3]=xA; lba[i*6+4]=yA+1.4; lba[i*6+5]=(lbs[o13+3]-0.5)*4;
    }
    lithBounce.geometry.attributes.position.needsUpdate=true;
    lithBounce.material.opacity = vis*0.4;
    // đúng 3–4 hạt Li-7, emissive 1.05, gần như không loé — phải TÌM MỚI THẤY
    var liV = smooth((u-0.42)/0.24);
    lithNuclei.userData.arr.forEach(function(L2, li){
      L2.visible = liV>0.01;
      L2.rotation.y = t*0.2 + li;
      L2.userData.arr.forEach(function(nn){ tickNucleon(nn, t, 1.05, vis*liV*0.85); });
    });
    lithBorder.l.material.opacity = vis*smooth((u-0.56)/0.16)*0.85;
    lithBorder.lb.material.opacity = vis*smooth((u-0.58)/0.16)*0.8;
    // khung rộng tĩnh; cuối shot push-in cực chậm vào MỘT hạt lithium đơn độc
    var zin = smooth((u-0.74)/0.26);
    cam(-12*zin, 6 - zin*10, 62 - zin*44, -12*zin, 6-zin*10, 6*zin, 46, 0.02, t);
  }

  /* --- S41: giãn nở + rào thế COULOMB ---------------------------- */
  if (inSc(t,'S41')){
    u = loc(t,'S41'); vis = W(t,'S41',0.5);
    show(gCool, vis);
    // (1) mật độ giảm ~40%, (2) tốc độ hạt CHẬM LẠI, motion-trail NGẮN DẦN
    var dilute = 1 + smooth(u)*0.62;
    var slowF = 1 - smooth(u)*0.62;
    var cfa = coolField.geometry.attributes.position.array;
    var cfs = coolField.userData.seed;
    for (i=0;i<cfa.length/6;i++){
      var o14=i*6;
      var bx3=(cfs[o14]-0.5)*70*dilute, by3=(cfs[o14+1]-0.5)*40*dilute,
          bz3=(cfs[o14+2]-0.5)*46*dilute;
      var dx2=(cfs[o14+3]-0.5), dy2=(cfs[o14+4]-0.5), dz2=(cfs[o14+5]-0.5);
      var dl2=Math.sqrt(dx2*dx2+dy2*dy2+dz2*dz2)||1;
      var drift2 = Math.sin(t*0.5*slowF + cfs[o14]*6.283)*3.5;
      var trail = (0.5 + slowF*2.6);
      var px2=bx3+dx2/dl2*drift2, py2=by3+dy2/dl2*drift2, pz2=bz3+dz2/dl2*drift2;
      segSet(cfa, i, px2, py2, pz2,
        px2+dx2/dl2*trail, py2+dy2/dl2*trail, pz2+dz2/dl2*trail);
    }
    coolField.geometry.attributes.position.needsUpdate=true;
    coolField.material.opacity = vis*0.8;
    // minh hoạ rào thế: hạt LEO LÊN dốc vòm rồi TỤT XUỐNG không qua nổi
    var cbV = smooth((u-0.30)/0.22);
    coulomb.visible = cbV>0.01;
    var cbu = coulomb.userData;
    cbu.dome.material.opacity = vis*cbV*0.95;
    cbu.base.material.opacity = vis*cbV*0.45;
    // hai lần: ở nhiệt độ cao vượt DỄ DÀNG, giờ thì không
    var attempt = ((t - SC.S41[0])*0.28)%1;
    var wasHot = u < 0.52;
    var xh2 = -9 + attempt*18;
    var yh = 6.0*Math.exp(-xh2*xh2/5.5);
    if (!wasHot && xh2 > -1.2){
      // TỤT XUỐNG: không qua nổi
      xh2 = -1.2 - (xh2+1.2)*1.5;
      yh = 6.0*Math.exp(-xh2*xh2/5.5);
    }
    cbu.a.position.set(xh2, yh+0.5, 0);
    tickNucleon(cbu.a, t, 1.4, vis*cbV);
    tickNucleon(cbu.b, t, 1.4, vis*cbV);
    // drift lùi ĐỀU suốt shot (chuyển động giãn nở), không cắt
    cam(0, 1, 44 + u*22, 0, -1, 0, 46, 0.02, t);
  }

  /* --- S42: LỬA ĐÃ TÀN — emissive rơi DƯỚI ngưỡng, tắt loé ------ */
  if (inSc(t,'S42')){
    u = loc(t,'S42'); vis = W(t,'S42',0.4);
    show(gEmber, vis);
    // kim đồng hồ chạm mốc 20 phút ở CUỐI shot
    setClock(emberClock, 17.5 + u*2.5, vis*0.9, true);
    // biển hạt vẫn ĐÔNG ĐẢO (còn thừa nguyên liệu) nhưng không còn tia phản ứng
    var ea = posArr(emberSea), eb3 = emberSea.userData.base, eph2 = emberSea.userData.ph;
    var creep = 1 - smooth(u)*0.55;       // các cú va chạm NẢY NHẸ HỀU
    for (i=0;i<ea.length;i+=3){
      var j9=i/3;
      ea[i]  = eb3[i]  + Math.sin(t*0.22*creep+eph2[j9])*0.85;
      ea[i+1]= eb3[i+1]+ Math.cos(t*0.19*creep+eph2[j9]*1.3)*0.7;
      ea[i+2]= eb3[i+2]+ Math.sin(t*0.17*creep+eph2[j9]*1.8)*0.75;
    }
    flushPos(emberSea);
    // emissive rơi XUỐNG DƯỚI 1.0 → TẮT LOÉ (dùng đúng ngưỡng HDR làm công cụ kể chuyện)
    pEm(emberSea, 1.15 - smooth(u)*0.42);
    pOp(emberSea, vis*0.9);
    cam(0, 2, 56, 0, -2, 0, 46, 0.02, t);
  }

  /* --- S43: CÁNH CỬA ĐÓNG LẠI — và không bao giờ mở lại nữa ----- */
  if (inSc(t,'S43')){
    u = loc(t,'S43'); vis = W(t,'S43',0.3);
    show(gClose, vis);
    // khép lại từ hai phía với gia tốc CHẬM-NHANH-DỪNG
    var closeU = clamp(u/0.40, 0, 1);
    var ease = closeU<0.5 ? 2*closeU*closeU : 1-Math.pow(-2*closeU+2,2)/2;
    // lần này KHÔNG có ổ khoá photon — cửa đóng vì KHÔNG CÒN GÌ ĐỂ MỞ
    setDoor(closeDoor, t, (1-ease)*0.62, 0, vis);
    // khi khép hết, một XUNG SÁNG lan ra rồi TẮT về đen gần hoàn toàn
    var pulse = band(u, 0.40, 0.48, 0.03);
    closePulse.material.opacity = vis*pulse*0.9;
    closePulse.scale.setScalar(1 + (u-0.40)*90);
    // vài hạt còn lại ngoài cửa trôi CHẬM DẦN rồi ĐỨNG YÊN
    var ra2 = posArr(closeRemnant), rb2 = closeRemnant.userData.base;
    var rph = closeRemnant.userData.ph;
    var motion = Math.max(0, 1 - u*2.2);
    for (i=0;i<ra2.length;i+=3){
      var j10=i/3;
      ra2[i]  = rb2[i]  + Math.sin(t*0.3+rph[j10])*1.4*motion;
      ra2[i+1]= rb2[i+1]+ Math.cos(t*0.26+rph[j10]*1.4)*1.2*motion;
      ra2[i+2]= rb2[i+2];
    }
    flushPos(closeRemnant);
    pOp(closeRemnant, vis*(1-smooth((u-0.45)/0.3)*0.85));
    // tắt về ĐEN gần hoàn toàn, giữ khung TĨNH HOÀN TOÀN 3 giây
    var blackout = smooth((u-0.50)/0.26);
    setDoor(closeDoor, t, 0, 0, vis*(1-blackout*0.92));
    cam(0, 0, 32, 0,0,0, 42, 0, t);
  }

  /* --- S44: trong lòng SAO (hàng tỉ năm) ↔ vũ trụ (MỘT lần) ----- */
  if (inSc(t,'S44')){
    u = loc(t,'S44'); vis = W(t,'S44',0.6);
    show(gOnce, vis);
    // lớp gần: một ngôi sao dãy chính, đối lưu granulation THẬT, lõi ổn định
    tickStar(mainStar, t, 1.75, vis*smooth(u/0.14));
    starLoop.l.material.opacity = vis*smooth((u-0.12)/0.16)*0.6;
    starLoop.head.material.opacity = vis*smooth((u-0.12)/0.16)*0.8;
    starLoop.l.rotation.z = t*0.35;
    starLoop.head.rotation.z = t*0.35;
    // lớp xa: toàn khung vũ trụ nhấp nháy MỘT lần ĐỒNG THỜI ở mọi điểm rồi tắt
    var flashAt = 0.44;
    var oal2 = alpArr(onceField), oph = onceField.userData.ph;
    var onceFlash = band(u, flashAt, flashAt+0.035, 0.03);
    for (i=0;i<oal2.length;i++){
      oal2[i] = 0.18 + onceFlash*0.85;     // ĐỒNG THỜI: mọi hạt cùng một giá trị
    }
    flushAlp(onceField);
    pEm(onceField, 1.0 + onceFlash*1.4);
    pOp(onceField, vis*smooth((u-0.22)/0.16));
    // mũi tên thời gian MỘT CHIỀU + ổ khoá đóng sập trên đoạn 0–20 phút
    var taV = smooth((u-0.60)/0.20);
    timeArrow.visible = taV>0.01;
    var tau = timeArrow.userData;
    [tau.shaft, tau.head, tau.shL].forEach(function(l){ l.material.opacity = vis*taV*0.9; });
    tau.seg.material.opacity = vis*taV*0.9;
    tau.lockB.material.opacity = vis*smooth((u-0.72)/0.14);
    tau.shL.material.opacity = vis*smooth((u-0.72)/0.14);
    // pull-back liên tục từ sao ra tới thang thời gian một chiều
    var pb3 = smooth(u);
    cam(-6 + pb3*8, 2 - pb3*4, 34 + Math.pow(pb3,1.15)*54, 0, -pb3*7, 0, 44, 0.02, t);
  }


  /* ======================= CHƯƠNG 4 ======================= */
  /* Starfield CHỈ bật từ S47 trở đi: trước đó chưa ngôi sao nào tồn tại. */
  var starV = 0;
  if (t >= SC.S47[0]){
    starV = smooth((t - SC.S47[0])/3.5);
    // các shot macro/graph không cần sao nền
    if (inSc(t,'S50') || inSc(t,'S53') || inSc(t,'S55') || inSc(t,'S56') ||
        inSc(t,'S58') || inSc(t,'S60') || inSc(t,'S45') || inSc(t,'S49')) starV *= 0.0;
    if (inSc(t,'S54')) starV *= 0.35;

  }
  if (starV > 0.004){

    starfield.rotation.y = t*0.0015;
  }

  /* --- S45: kiểm kê — ba phần tư hydro, một phần tư heli -------- */
  if (inSc(t,'S45')){
    u = loc(t,'S45'); vis = W(t,'S45',0.6);
    show(gInv, vis);
    var ib = invBars.userData;
    var grow2 = smooth((u-0.06)/0.38);

    var segsI = [ib.h, ib.he, ib.d, ib.li];
    for (i=0;i<4;i++){
      var wI = fr2[i]*ib.TW*grow2;
      segsI[i].scale.x = Math.max(0.005, wI);

    ib.frame.material.opacity = vis*0.45;

    ib.lHe.material.opacity = vis*smooth((u-0.36)/0.16);

  }

  /* --- S46: danh sách VẮNG MẶT → mây nguyên thuỷ (KHÔNG starfield) */
  if (inSc(t,'S46')){
    u = loc(t,'S46'); vis = W(t,'S46',0.6);
    show(gAbsent, vis);

    var cloudV = smooth((u-0.40)/0.18);
    primCloud.visible = cloudV>0.01;
    var pca = posArr(primCloud), pcb = primCloud.userData.base;
    // cuộn lại dưới sức hút của CHÍNH NÓ (co về tâm cụm, hàm thuần của t)
    var contract = 1 - smooth((u-0.48)/0.52)*0.26;

    cam(0, 2 - dolly*2, 32 - listV*0 + (1-listV)*0 + (78 - dolly*44)*cloudV*0 + (cloudV>0.01? (78-dolly*46) : 34)*0 + 0,
        0, 0, 0, 46, 0.02, t);
    // đặt lại camera rõ ràng cho hai nửa (tránh biểu thức rối ở trên)
    if (cloudV > 0.01){

  /* --- S47: NGÔI SAO ĐẦU TIÊN (Pop III) + BA-ALPHA ------------- */
  if (inSc(t,'S47')){
    u = loc(t,'S47'); vis = W(t,'S47',0.5);
    var coreV = smooth((u-0.46)/0.14);
    if (coreV < 0.99){
      show(gPop3, vis*(1-coreV));

      tickStar(pop3Star, t, 1.2 + ignite*1.6, vis*(1-coreV)*ignite);
      pop3Star.scale.setScalar(0.35 + ignite*0.65);
      // tàn dư mây đang BỊ THỔI BẠT
      var pra = posArr(pop3Remnant), prb = pop3Remnant.userData.base;
      var blow = 1 + ignite*0.45;
      for (i=0;i<pra.length;i++) pra[i] = prb[i]*blow;
      flushPos(pop3Remnant);
      pOp(pop3Remnant, vis*(1-coreV)*(0.85-ignite*0.30));
      var dolly2 = smooth(u/0.5);
      cam(0, 2 - dolly2*2, 74 - Math.pow(dolly2,1.2)*48, 0,0,0, 46, 0.025, t);
    }
    if (coreV > 0.01){
      show(gAlpha3, vis*coreV);
      // BA-ALPHA: đúng BA hạt He-4 gặp nhau GẦN NHƯ ĐỒNG THỜI, nhảy A=4 → A=12
      var meet = smooth((u-0.58)/0.26);
      var made = smooth((u-0.82)/0.12);
      for (i=0;i<3;i++){
        var an2 = i/3*Math.PI*2 + t*0.12;
        var rA = 16*(1-meet) + 1.9;
        a3He[i].position.set(Math.cos(an2)*rA, Math.sin(an2)*rA*0.75, Math.sin(an2*1.7)*rA*0.4);
        a3He[i].rotation.y = t*0.4 + i;
        tickHe4(a3He[i], t, 1.9, vis*coreV*(1-made));
      }

        for (i=0;i<aba.length;i+=3){
          aba[i]=abb[i]+Math.sin(t*0.2+i)*0.8;
          aba[i+1]=abb[i+1]; aba[i+2]=abb[i+2];
        }
        flushPos(altB);
        pOp(altB, vis*b2v*0.55);
      }
    }
    if (b3v>0.01){
      show(gGrow, vis*b3v);
      var gbu = growBars.userData;
      gbu.h.scale.y = 1; gbu.he.scale.y = 1;
      gbu.h.material.opacity = vis*b3v*0.9;
      gbu.he.material.opacity = vis*b3v*0.9;
      // MỌC RA TỪ chính hai cột, CÙNG MÀU GỐC, để thấy nguồn
      growLife.forEach(function(hu, hi){
        var gv3 = smooth((b3v*1.5 - hi*0.18));
        hu.visible = gv3>0.01;
        hu.scale.y = (hi===0?1.25:(hi===2?0.8:1.0))*gv3;
        pOp(hu, vis*b3v*gv3*0.65);
      });
    }
    // ba nhịp TĨNH nối bằng hoà tan, KHÔNG di chuyển máy — nhịp chiêm nghiệm
    var camZ2 = b1v>0.5 ? 46 : (b2v>0.5 ? 62 : 44);
    cam(0, b3v>0.5?-6:2, camZ2, 0, b3v>0.5?-8:0, 0, 46, 0.015, t);
  }

  /* --- S58 ★ HƠI THỞ ------------------------------------------- */
  if (inSc(t,'S58')){
    u = loc(t,'S58'); vis = W(t,'S58',0.5);
    show(gBreath, vis);
    // nhịp thở THẬT: ~4s vào, ~5s ra — hàm thuần của t
    var bt = ((t - SC.S58[0]) % 9.0);
    var inhale = bt < 4.0 ? smooth(bt/4.0) : 1 - smooth((bt-4.0)/5.0);
    var flow = (inhale - 0.5)*2;          // +1 vào, -1 ra
    var bfa = posArr(breathFlow), bsd2 = breathFlow.userData.seed;
    var bfal = alpArr(breathFlow);
    for (i=0;i<bfa.length/3;i++){
      var o17=i*5;
      var st2 = ((t*0.16 + bsd2[o17])%1);
      var lane = (bsd2[o17+1]-0.5), lane2=(bsd2[o17+2]-0.5);
      // dòng khí vào-ra CHẬM; camera KHÔNG nhúc nhích trong suốt shot
      var zz = -30 + st2*60;
      var conv = 1 - Math.exp(-Math.abs(zz)/20)*0.55;
      bfa[i*3]   = lane*34*conv + flow*3.0;
      bfa[i*3+1] = lane2*20*conv;
      bfa[i*3+2] = zz;
      bfal[i] = (0.22 + 0.22*Math.sin(t*0.8 + bsd2[o17+3]*6.283))*(0.5+0.5*Math.abs(flow));
    }
    breathFlow.geometry.attributes.position.needsUpdate=true;
    flushAlp(breathFlow);
    // cả khung còn lại DỊU (0.8), chỉ hydro loé qua ngưỡng
    pEm(breathFlow, 0.8);
    pOp(breathFlow, vis);
    // phân tử nước: hai hạt H BẬT SÁNG hơn (1.5) phần còn lại (0.8)
    breathMols.forEach(function(m2, mi){
      var sd3 = m2.userData.seed;
      m2.position.set(sd3.x + flow*3.2, sd3.y + Math.sin(t*0.3+mi)*1.1, sd3.z);
      m2.rotation.set(sd3.rx + t*sd3.sp*0.3, sd3.ry + t*sd3.sp*0.4, 0);
      var mu2 = m2.userData;
      tickNucleon(mu2.O, t, 0.8, vis*0.85);
      tickNucleon(mu2.H1, t, 1.5, vis);
      tickNucleon(mu2.H2, t, 1.5, vis);
      mu2.b1.material.opacity = vis*0.30;
      mu2.b2.material.opacity = vis*0.30;
    });
    // hậu cảnh: plasma trắng-xanh của S01 hiện lại như KÝ ỨC alpha 0.12 — nối đầu với cuối
    var mal = alpArr(breathMemory), mph = breathMemory.userData.ph;
    for (i=0;i<mal.length;i++){
      mal[i] = 0.05 + 0.055*(0.5+0.5*Math.sin(t*1.6 + mph[i]));
    }
    flushAlp(breathMemory);
    pOp(breathMemory, vis*0.55);
    pEm(breathMemory, 1.35);
    // cực cận, TĨNH; chỉ có MỘT chuyển động duy nhất trong khung là dòng khí
    cam(0, 0, 22, 0, 0, -4, 40, 0, t);
  }

  /* --- S59: pull-back rất chậm và dài, thang đo NGƯỢC ---------- */
  if (inSc(t,'S59')){
    u = loc(t,'S59'); vis = W(t,'S59',0.5);
    show(gScaleUp, vis);
    // giọt nước macro → mao mạch → lồng ngực → silhouette toàn thân
    var zoomOut = smooth(u);
    var dropV = 1 - smooth((u-0.30)/0.26);
    suDrop.visible = dropV>0.01;
    var sual = alpArr(suDrop), suph = suDrop.userData.ph;
    // các hạt hydro trong cơ thể phát sáng ĐỒNG BỘ, nhẹ, theo NHỊP THỞ
    var bt2 = ((t - SC.S59[0]) % 9.0);
    var breathe = bt2<4.0 ? smooth(bt2/4.0) : 1-smooth((bt2-4.0)/5.0);
    for (i=0;i<sual.length;i++){
      sual[i] = 0.14 + 0.22*(0.5+0.5*Math.sin(t*0.8+suph[i])) + breathe*0.10;
    }
    flushAlp(suDrop);
    pOp(suDrop, vis*dropV);
    suDrop.rotation.y = t*0.05;
    // silhouette hạt TOÀN THÂN đứng yên
    var humV = smooth((u-0.34)/0.24);
    suHuman.visible = humV>0.01;
    var sha = alpArr(suHuman), sha0 = suHuman.userData.alpha0;
    for (i=0;i<sha.length;i++) sha[i] = sha0[i]*(0.55 + breathe*0.35);
    flushAlp(suHuman);
    pOp(suHuman, vis*humV*0.24);
    pEm(suHuman, 0.88);
    // dải thời gian mảnh chạy DỌC: "20 phút" chỉ là một CHẤM ở đầu
    var tlV2 = smooth((u-0.48)/0.2);
    var stu = suTimeline.userData;
    stu.line.material.opacity = vis*tlV2*0.7;
    stu.dot.material.opacity = vis*tlV2;
    stu.l1.material.opacity = vis*tlV2*0.85;
    stu.l2.material.opacity = vis*tlV2*0.8;
    cam(0, 1 + zoomOut*1.5, 17 + Math.pow(zoomOut,1.1)*54, 0, zoomOut*1.5, 0, 42, 0.015, t);
  }

  /* --- S60: CÂU KẾT — hình người TAN VỀ plasma của S01 --------- */
  if (inSc(t,'S60')){
    u = loc(t,'S60'); vis = W(t,'S60',0.5);
    show(gEnd, vis);
    var ekd = endHuman.userData.kind, ea0 = endHuman.userData.alpha0;
    var eba = endHuman.userData.base, etg = endHuman.userData.target;
    var epa = posArr(endHuman), eal = alpArr(endHuman);
    // các hạt SAO (sắt, oxy) mờ đi TRƯỚC, để lại ~60% hạt hydro sáng lên chậm
    var starFade = smooth((u-0.16)/0.26);
    // 2s cuối: toàn bộ hình người dần biến thành TRƯỜNG PLASMA của S01
    var dissolve = smooth((u - 0.62)/0.30);
    for (i=0;i<ekd.length;i++){
      var kk3 = ekd[i];
      var av4 = kk3===0 ? (0.35 + smooth((u-0.20)/0.28)*0.65) : (1-starFade);
      eal[i] = ea0[i]*av4;
      var o18=i*3;
      epa[o18]   = eba[o18]   + (etg[o18]  -eba[o18])  *dissolve;
      epa[o18+1] = eba[o18+1] + (etg[o18+1]-eba[o18+1])*dissolve;
      epa[o18+2] = eba[o18+2] + (etg[o18+2]-eba[o18+2])*dissolve;
    }
    flushPos(endHuman); flushAlp(endHuman);
    // màu cũng chuyển về trắng-xanh nung của S01 — vòng tròn khép kín
    // Hat xep chong day: em 1.5 + additive lam ca hinh chay thanh khoi trang bet,
    // mat han sac lam cua hydro.
    // Bloom HDR ngưỡng 1.0: mọi giá trị trên 1.0 đều nở sáng. Hạt silhouette
    // xếp chồng rất dày + additive nên phải để em DƯỚI ngưỡng, nếu không cả
    // hình cộng dồn thành khối trắng bệt và mất hết sắc lam của hydro.
    pEm(endHuman, 0.80 + dissolve*0.10);
    pOp(endHuman, vis*0.30);
    // tĩnh TUYỆT ĐỐI: không zoom, không pan, không orbit
    cam(0, 0, 30, 0, 0, 0, 44, 0, t);
  }

  /* ---- phụ đề, nhãn chương, fade toàn cục, hậu kỳ ------------- */
  HFA.applySubtitle(elSub, CUES, t);
  HFA.applyChapter(elChap, CHAPTERS, t, 6.0);

  lens.uniforms.uT.value = t;
  // fade vào/ra: mở từ ĐEN TUYỆT ĐỐI, kết bằng fade to black rất chậm (≥3s)
  lens.uniforms.uFade.value = HFA.globalFade(t, TOTAL, 2.2, 3.6);
  // grain nhẹ hơn ở các shot lặng (S50, S58, S60) để chúng "thở"
  var calmShot = inSc(t,'S50') || inSc(t,'S58') || inSc(t,'S60') || inSc(t,'S43');
  lens.uniforms.uGrain.value = calmShot ? 0.028 : 0.045;
  // CH1: môi trường plasma tràn kín mép. Hai lớp vignette (CSS + lens) chồng
  // nhau sẽ khoét ra một hình OVAL sáng giữa khung tối — đọc thành "sương mù
  // trong khung", không phải "đang ở BÊN TRONG lò".
  var inPlasma = vPlasma > 0.25;
  lens.uniforms.uVig.value = inPlasma ? 1.30 : 0.34;
  if (elVig) elVig.style.opacity = inPlasma ? '0' : '1';

  composer.render();
}

/* ---- ĐĂNG KÝ TIMELINE ---------------------------------------------------
 * Dòng dưới phải nằm NGUYÊN DẠNG trong file này: StaticGuard quét VĂN BẢN,
 * giấu vào hàm dùng chung sẽ bị báo thiếu đăng ký và render ra frame tĩnh.
 * Khoá phải trùng ĐÚNG data-composition-id của div gốc.
 */
window.__timelines = window.__timelines || {};
window.__timelines["nguyen-to-dau-tien"] = HFA.makeTimeline("nguyen-to-dau-tien", TOTAL, renderAtTime);


</script>
