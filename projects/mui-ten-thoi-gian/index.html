// ---- seeded PRNG (mulberry32) ----
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// ---- scene boundaries (real time = cue.start) ----
const SC={
  A:[0,7.47], B:[7.47,26.99], C:[26.99,46], D:[46,65.46], E:[65.46,78.6],
  F:[78.6,92.44], G:[92.44,130.05], H:[130.05,160.25], I:[160.25,211.8],
  K:[211.8,244.8], L:[244.8,285.41], M:[285.41,325.22], N:[325.22,358.07],
  O:[358.07,407.18], P:[407.18,442.83], Q:[442.83,489.56], R:[489.56,530.61],
  S:[530.61,579.6], T:[579.6,642.96], U:[642.96,684.44], V:[684.44,718.12],
  W:[718.12,769.31], X:[769.31,818.33]
};
function loc(t,k){const w=SC[k];return Math.min(1,Math.max(0,(t-w[0])/(w[1]-w[0])));}
function inSc(t,k){const w=SC[k];return t>=w[0]&&t<w[1];}
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=(x)=>{x=clamp(x,0,1);return x*x*(3-2*x);};
function band(t,a,b,f){f=f||0.8;if(t<a-f||t>b+f)return 0;let up=smooth((t-(a-f))/(2*f));let dn=smooth(((b+f)-t)/(2*f));return Math.min(1,Math.min(up,dn));}
const TAU=Math.PI*2;

const LensShader={
  uniforms:{tDiffuse:{value:null},uT:{value:0},uVig:{value:0.34},uCA:{value:0.0015},uGrain:{value:0.04},uFade:{value:1.0},uFlash:{value:0.0}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
   varying vec2 vUv;uniform sampler2D tDiffuse;uniform float uT,uVig,uCA,uGrain,uFade,uFlash;
   float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
   void main(){
     vec2 d=vUv-0.5;float r=dot(d,d);
     vec2 off=d*uCA*(1.0+r*2.2);
     vec3 col;
     col.r=texture2D(tDiffuse,vUv+off).r;
     col.g=texture2D(tDiffuse,vUv).g;
     col.b=texture2D(tDiffuse,vUv-off).b;
     float vig=smoothstep(1.02,uVig,r*2.0);
     col*=mix(1.0,vig,0.85);
     float g=h(vUv*vec2(1920.0,1080.0)+fract(uT)*97.3)-0.5;
     col+=g*uGrain;
     col=mix(col,vec3(0.95,0.97,1.0),uFlash);
     col*=uFade;
     gl_FragColor=vec4(col,1.0);
   }`
};
const lens=new THREE.ShaderPass(LensShader);lens.renderToScreen=true;composer.addPass(lens);

const STAR_R=13000;
function buildStars(){
  const N=4200,pr=mulberry32(20260808);
  const pos=new Float32Array(N*3),col=new Float32Array(N*3),siz=new Float32Array(N);
  const tmp=new THREE.Vector3();
  for(let i=0;i<N;i++){
    let u=pr(),v=pr();
    let theta=Math.acos(2*u-1),phi=TAU*v;
    let bnd=pr();if(bnd<0.4){theta=Math.PI*0.5+(pr()-0.5)*0.5;}
    tmp.set(Math.sin(theta)*Math.cos(phi),Math.cos(theta)*0.7,Math.sin(theta)*Math.sin(phi)).normalize().multiplyScalar(STAR_R);
    pos[i*3]=tmp.x;pos[i*3+1]=tmp.y;pos[i*3+2]=tmp.z;
    let tt=pr();let c=new THREE.Color();
    if(tt<0.14)c.setRGB(0.62,0.72,1.0);
    else if(tt<0.4)c.setRGB(0.9,0.94,1.0);
    else if(tt<0.7)c.setRGB(1.0,0.96,0.85);
    else if(tt<0.88)c.setRGB(1.0,0.84,0.6);
    else c.setRGB(1.0,0.66,0.5);
    let br=0.35+pr()*0.6;c.multiplyScalar(br);
    col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
    siz[i]=(pr()<0.06?3.2:1.0)*(0.9+pr()*1.6);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));

function makeGrid(cx,cy,n,cell,seed){
  const grp=new THREE.Group();grp.position.set(cx,cy,0);
  const pr=mulberry32(seed||5);
  const cells=[];
  const gap=cell*1.08;
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    const m=new THREE.Mesh(new THREE.PlaneGeometry(cell,cell),new THREE.MeshBasicMaterial({color:0x5FC8E8,transparent:true,opacity:0.9}));
    m.position.set((c-(n-1)/2)*gap,(r-(n-1)/2)*gap,0);
    m.userData={r,c,ph:pr()*TAU,ord:(r+c)%2};
    cells.push(m);grp.add(m);
  }
  grp.userData={cells,n,gap};
  return grp;
}

// ============================================================
//  renderAtTime(t) — deterministic
// ============================================================
function renderAtTime(t){
  t=Math.max(0,Math.min(TOTAL,t));
  let flash=0;

  gA.visible=inSc(t,'A');gB.visible=inSc(t,'B');gC.visible=inSc(t,'C');gD.visible=inSc(t,'D');
  gE.visible=inSc(t,'E');gF.visible=inSc(t,'F');gG.visible=inSc(t,'G');gH.visible=inSc(t,'H');
  gI.visible=inSc(t,'I');gK.visible=inSc(t,'K');gL.visible=inSc(t,'L');gM.visible=inSc(t,'M');
  gN.visible=inSc(t,'N');gO.visible=inSc(t,'O');gP.visible=inSc(t,'P');gQ.visible=inSc(t,'Q');
  gR.visible=inSc(t,'R');gS.visible=inSc(t,'S');gT.visible=inSc(t,'T');gU.visible=inSc(t,'U');
  gV.visible=inSc(t,'V');gW.visible=inSc(t,'W');gX.visible=inSc(t,'X');
  const cosmic=inSc(t,'O')||inSc(t,'P')||inSc(t,'Q')||inSc(t,'R')||inSc(t,'S')||inSc(t,'U')||inSc(t,'X');
  stars.visible=cosmic;
  if(cosmic)stars.material.uniforms.uOp.value=0.5;

  try{
  // ---------------- A: clock ----------------
  if(gA.visible){
    const d=gA.userData;
    d.hand.rotation.z=-t*(TAU/12);
    d.hh.rotation.z=-t*(TAU/120);
    setOp(d.arrow,0.35+0.15*Math.sin(t*0.8));
    camSet(0,0,7.6,0,0,0,46);
  }

  // ---------------- B: memory timeline ----------------
  if(gB.visible){
    const d=gB.userData;const p=loc(t,'B');
    const arr=d.mem.geometry.attributes.position.array;
    for(let i=0;i<d.N;i++){const b=i*3;
      arr[b]=d.base[b]+Math.sin(t*0.5+d.ph[i])*0.15;
      arr[b+1]=d.base[b+1]+Math.cos(t*0.4+d.ph[i])*0.15;
      arr[b+2]=d.base[b+2];}
    d.mem.geometry.attributes.position.needsUpdate=true;
    d.mem.material.opacity=0.85*smooth(clamp((t-7.47)/2,0,1));
    const fa=d.fog.geometry.attributes.position.array;
    for(let i=0;i<d.NF;i++){const b=i*3;
      fa[b]=d.fb[b]+Math.sin(t*0.25+d.fph[i])*0.5;
      fa[b+1]=d.fb[b+1]+Math.cos(t*0.2+d.fph[i])*0.5;
      fa[b+2]=d.fb[b+2];}
    d.fog.geometry.attributes.position.needsUpdate=true;
    d.fog.material.opacity=0.4;
    camSet(3.0-p*6.0,0,9.5,3.0-p*6.0,0,0,50);
  }

  // ---------------- C: cup fall + shatter ----------------
  if(gC.visible){
    const d=gC.userData;
    const fall=smooth(clamp((t-26.99)/2.4,0,1));
    const impactT=29.4;
    const shatter=smooth(clamp((t-impactT)/2.6,0,1));
    d.cup.visible=shatter<0.02;
    d.cup.position.y=2.4-fall*4.4;
    d.cup.rotation.z=fall*0.3;
    d.shards.visible=shatter>0.01;
    if(d.shards.visible){
      for(let i=0;i<d.NS;i++){const s=d.sd[i];const m=d.shards.children[i];
        const rise=Math.max(0,s.dir.y*shatter*2.2 - shatter*shatter*2.0);
        m.position.set(s.dir.x*shatter*3.0,-2.0+rise,s.dir.z*shatter*3.0);
        m.rotation.set(s.rot.x*shatter,s.rot.y*shatter,s.rot.z*shatter);
        m.material.opacity=0.95;}
      if(t>=impactT&&t<impactT+0.28)flash=0.5*(1-(t-impactT)/0.28);
    }
    d.revLbl.material.opacity=0.85*band(t,36.87,46,1.0)*(0.6+0.4*Math.sin(t*3));
    camSet(0,0.3,8,0,0.2,0,48);
  }

  // ---------------- D: smoke + ink one-way ----------------
  if(gD.visible){
    const d=gD.userData;
    const sa=d.smoke.geometry.attributes.position.array;
    for(let i=0;i<d.NSm;i++){const b=i*3;const life=((t*0.09*d.srate[i]+d.sph[i])%1);
      const spread=life*2.4;
      sa[b]=d.sdir[b]*spread+Math.sin(t*0.6+i)*0.2;
      sa[b+1]=-1.6+d.sdir[b+1]*life*4.2;
      sa[b+2]=d.sdir[b+2]*spread+Math.cos(t*0.5+i)*0.2;}
    d.smoke.geometry.attributes.position.needsUpdate=true;
    d.smoke.material.opacity=0.45;
    const ia=d.ink.geometry.attributes.position.array;
    const diff=smooth(clamp((t-47)/9,0,1));
    for(let i=0;i<d.NInk;i++){const b=i*3;const rr=d.ir[i]*(0.2+diff*1.5);
      ia[b]=Math.cos(d.ia[i])*rr;
      ia[b+1]=1.4-diff*(1.2+d.iel[i]*0.8)+Math.sin(t*0.4+i)*0.05*diff;
      ia[b+2]=Math.sin(d.ia[i])*rr;}
    d.ink.geometry.attributes.position.needsUpdate=true;
    d.ink.material.opacity=0.85;
    d.lbl.material.opacity=0.85*band(t,52.93,65.46,1.5);
    camSet(0,0,9.5,0,0,0,50);
  }

  // ---------------- E: arrow named + bow ----------------
  if(gE.visible){

    camSet(0,0,10,0,0,0,50);
  }

  // ---------------- F: symmetric laws ----------------
  if(gF.visible){
    const d=gF.userData;
    d.node.rotation.y=t*0.4;d.node.rotation.x=t*0.2;
    const pa=d.parts.geometry.attributes.position.array;
    for(let i=0;i<d.N;i++){const b=i*3;const x=((d.px0[i]+d.pdir[i]*t*0.9)%14+14)%14-7;
      pa[b]=x;pa[b+1]=d.py0[i]+Math.sin(t*1.5+d.pph[i])*0.2;pa[b+2]=0;}
    d.parts.geometry.attributes.position.needsUpdate=true;
    const g=0.7+0.25*Math.sin(t*1.5);
    setOp(d.aR,g);setOp(d.aL,g);
    camSet(0,0,10,0,0,0,50);
  }

  // ---------------- G: billiard fwd/reverse ----------------
  if(gG.visible){
    const d=gG.userData;
    const period=4.0;const lt=(t-92.44)%period;
    function place(tab,tt){
      const half=period/2;
      let ax,az,bx,bz;
      if(tt<half){const u=tt/half;ax=-2.6+u*2.6;az=0.35;bx=0;bz=0.35;}
      else{const u=(tt-half)/half;ax=0-u*0.6;az=0.35-u*0.9;bx=u*2.6;bz=0.35+u*0.9;}
      tab.ballA.position.set(ax,0,az);tab.ballB.position.set(bx,0,bz);
    }
    place(d.tF,lt);
    place(d.tR,period-lt);
    setOp(d.tick,0.85);setOp(d.tick2,0.85);
    d.qLbl.material.opacity=0.85*band(t,124.37,130.05,1.2)*(0.6+0.4*Math.sin(t*3));
    camSet(0,3.2,10.5,0,0,0,52);
  }

  // ---------------- H: entropy label + grid ----------------
  if(gH.visible){
    const d=gH.userData;
    d.grid.userData.cells.forEach((m,i)=>{
      const v=0.5+0.5*Math.sin(t*1.4+m.userData.ph*3+i*0.3);
      m.material.color.setHSL(0.55,0.6,0.35+v*0.35);
      m.material.opacity=0.5+0.4*v;
    });
    d.lbl.material.opacity=smooth(clamp((t-130.05)/1.2,0,1));
    d.sub.material.opacity=0.8*band(t,154.32,160.25,1.0);
    camSet(0,0,9,0,0,0,50);
  }

  // ---------------- I: desk tidy<->messy ----------------
  if(gI.visible){
    const d=gI.userData;
    const mess=smooth(clamp((t-166.94)/8,0,1));
    for(let i=0;i<d.N;i++){const o=d.od[i];const m=d.objs.children[i];

    d.boltz.material.opacity=0.9*band(t,196.27,211.8,1.2);
    d.bname.material.opacity=0.9*band(t,196.27,211.8,1.2);
    camSet(Math.sin(t*0.05)*1.5,0,10,0,0,0,52);
  }

  // ---------------- K: gas corner vs spread ----------------
  if(gK.visible){
    const d=gK.userData;
    const spread=smooth(clamp((t-222.07)/8,0,1));
    const ga=d.gas.geometry.attributes.position.array;
    for(let i=0;i<d.N;i++){const b=i*3;
      const jx=Math.sin(t*1.6+d.ph[b])*0.12,jy=Math.cos(t*1.4+d.ph[b+1])*0.12,jz=Math.sin(t*1.2+d.ph[b+2])*0.12;

  }

  // ---------------- L: cup shards reverse hint ----------------

    const quiver=band(t,258,268,1.5);
    for(let i=0;i<d.NS;i++){const s=d.sd[i];const m=d.shards.children[i];
      const lift=quiver*(0.3+0.5*Math.sin(t*6+s.ph));

    d.lbl.material.opacity=0.85;

  // ---------------- M: entropy bar + crowd ----------------
  if(gM.visible){

    for(let i=0;i<d.NL;i++){const xN=i/(d.NL-1);const x=-5.4+xN*10.8;

  // ---------------- N: missing piece + symmetric parabola ----------------
  if(gN.visible){
    const d=gN.userData;
    const gapPulse=0.5+0.5*Math.sin(t*3);

    const d=gR.userData;const p=loc(t,'R');
    const clump=smooth(clamp((t-493)/16,0,1));
    const ga=d.gas.geometry.attributes.position.array;
    for(let i=0;i<d.N;i++){const b=i*3;
      const jx=Math.sin(t*0.7+d.ph[i])*0.1,jy=Math.cos(t*0.6+d.ph[i])*0.1;
      ga[b]=d.start[b]+(d.cluster[b]-d.start[b])*clump+jx;
      ga[b+1]=d.start[b+1]+(d.cluster[b+1]-d.start[b+1])*clump+jy;
      ga[b+2]=d.start[b+2]+(d.cluster[b+2]-d.start[b+2])*clump;}
    d.gas.geometry.attributes.position.needsUpdate=true;
    const heatIn=smooth(clamp((t-510.81)/8,0,1));
    const ha=d.heat.geometry.attributes.position.array;
    for(let i=0;i<d.NH;i++){const b=i*3;const c=d.cc[d.hc[i]];const life=((t*0.15+d.hph[i])%1);
      const rr=life*4.0;
      ha[b]=c.x+d.hdir[b]*rr;ha[b+1]=c.y+d.hdir[b+1]*rr;ha[b+2]=c.z+d.hdir[b+2]*rr;}
    d.heat.geometry.attributes.position.needsUpdate=true;
    d.heat.material.opacity=0.5*heatIn;
    d.lbl.material.opacity=0.85*band(t,510.81,530.61,1.5);
    camSet(Math.sin(t*0.05)*2,0,11-p*1.5,0,0,0,52);
  }

  // ---------------- S: black hole + cosmic entropy curve ----------------
  if(gS.visible){
    const d=gS.userData;
    const collapse=smooth(clamp((t-541.85)/6,0,1));
    const ia=d.infall.geometry.attributes.position.array;
    for(let i=0;i<d.N;i++){const a=d.ia[i]+t*(0.4+ (1-d.ir[i]/6)*1.2);
      const rr=d.ir[i]*(1-collapse*0.85)+0.2;
      ia[i*3]=Math.cos(a)*rr;ia[i*3+1]=d.iel[i]*rr*0.4;ia[i*3+2]=Math.sin(a)*rr;}
    d.infall.geometry.attributes.position.needsUpdate=true;
    d.infall.material.opacity=0.85;
    d.eh.visible=collapse>0.2;d.eh.scale.setScalar(Math.max(0.01,collapse));
    d.rim.visible=collapse>0.2;d.rim.scale.setScalar(Math.max(0.01,collapse));d.rim.rotation.z=t*0.3;
    d.rim.material.opacity=0.9*collapse;
    d.disk.visible=collapse>0.2;
    const dda=d.disk.geometry.attributes.position.array;
    for(let i=0;i<d.ND;i++){const a=d.da[i]+t*(0.6+ (2.0-d.dr[i])*0.4);const rr=d.dr[i]*collapse;
      dda[i*3]=Math.cos(a)*rr;dda[i*3+1]=d.dy[i];dda[i*3+2]=Math.sin(a)*rr;}
    d.disk.geometry.attributes.position.needsUpdate=true;
    d.disk.material.opacity=0.85*collapse;
    const showCurve=smooth(clamp((t-556.43)/6,0,1));
    d.curve.visible=showCurve>0.02;
    if(d.curve.visible){
      const la=d.curve.geometry.attributes.position.array;
      for(let i=0;i<d.NL;i++){const xN=i/(d.NL-1);const x=-5.2+xN*10.4;
        const y=-1.8+(1-Math.exp(-xN*2.8))*3.2;
        la[i*3]=x;la[i*3+1]=y;la[i*3+2]=0;}
      d.curve.geometry.attributes.position.needsUpdate=true;
      setOp(d.curve,0.9*showCurve);
    }
    d.lbl2.material.opacity=0.85*showCurve;
    d.lbl.material.opacity=0.85*band(t,530.61,556.43,2.0);
    camSet(Math.sin(t*0.05)*1.5,showCurve*1.0,9.5+showCurve*1.5,0,showCurve*0.5,0,50);
  }

  // ---------------- T: clock returns + Past Hypothesis ----------------
  if(gT.visible){
    const d=gT.userData;
    d.hand.rotation.z=-t*(TAU/60)*0.5;
    d.seedGlow.material.opacity=0.6+0.3*Math.sin(t*1.5);
    d.circle.rotation.z=t*0.3;
    setOp(d.arrow,0.8);
    d.lbl.material.opacity=0.9*band(t,601,642.96,1.5);
    camSet(0,0,10,0,0,0,52);
  }

  // ---------------- U: stars die + heat death ----------------
  if(gU.visible){
    const d=gU.userData;const p=loc(t,'U');
    const fade=smooth(clamp((t-650.48)/10,0,1));
    const sa=d.starPts.geometry.attributes.position.array;
    for(let i=0;i<d.N;i++){sa[i*3]=d.sx[i];sa[i*3+1]=d.sy[i];sa[i*3+2]=d.sz[i];}
    d.starPts.geometry.attributes.position.needsUpdate=true;
    d.starPts.material.opacity=0.9*(1-fade);
    const cold=smooth(clamp((t-661.88)/10,0,1));
    const ca=d.cold.geometry.attributes.position.array;
    for(let i=0;i<d.NC;i++){const b=i*3;
      ca[b]=d.cb[b]+Math.sin(t*0.15+d.cph[i])*0.2;
      ca[b+1]=d.cb[b+1]+Math.cos(t*0.13+d.cph[i])*0.2;
      ca[b+2]=d.cb[b+2];}
    d.cold.geometry.attributes.position.needsUpdate=true;
    d.cold.material.opacity=0.45*cold;
    d.lbl2.material.opacity=0.85*band(t,661.88,684.44,2.0);
    setOp(d.arrow,0.7*(1-cold*0.6));
    camSet(Math.sin(t*0.04)*2,0,11+p*1.5,0,0,0,52);
  }

  // ---------------- V: entropy slope + body ----------------
  if(gV.visible){
    const d=gV.userData;
    d.hereGlow.material.opacity=0.6+0.3*Math.sin(t*1.5);
    const bodyIn=smooth(clamp((t-697.63)/3,0,1));
    d.bodyGrp.visible=bodyIn>0.02;
    if(d.bodyGrp.visible){
      const beat=0.5+0.5*Math.sin(t*3.2);
      d.heartGlow.scale.setScalar(1.0+beat*0.5);
      d.heartGlow.material.opacity=0.7+0.3*beat;
      d.bodyGrp.scale.y=1.0+0.02*Math.sin(t*1.4);
      const oa=d.orderIn.geometry.attributes.position.array;
      for(let i=0;i<d.NIn;i++){const life=((t*0.3+d.inPh[i])%1);const rr=(1-life)*3.5+0.4;
        const a=d.inA[i]+t*0.4;
        oa[i*3]=Math.cos(a)*rr;oa[i*3+1]=Math.sin(a)*rr*0.7+0.1;oa[i*3+2]=Math.sin(d.inR[i]*TAU)*0.5;}
      d.orderIn.geometry.attributes.position.needsUpdate=true;
      d.orderIn.material.opacity=0.6*bodyIn;
      const ha=d.heatOut.geometry.attributes.position.array;
      for(let i=0;i<d.NOut;i++){const life=((t*0.25+d.outPh[i])%1);const rr=life*3.8+0.3;
        ha[i*3]=Math.cos(d.outA[i])*rr;ha[i*3+1]=Math.sin(d.outA[i])*rr*0.7+d.outEl[i];ha[i*3+2]=Math.sin(d.outEl[i])*rr*0.4;}
      d.heatOut.geometry.attributes.position.needsUpdate=true;
      d.heatOut.material.opacity=0.55*bodyIn;
      d.lblLife.material.opacity=0.85*band(t,712.69,718.12,1.0);
      setOp(d.slope,0.4);d.lblHere.material.opacity=0.6*(1-bodyIn);
      d.here.material.opacity=1-bodyIn;d.hereGlow.material.opacity*=(1-bodyIn);
    }else{
      setOp(d.slope,0.7);d.lblHere.material.opacity=0.85;
    }
    camSet(0,0,10,0,0,0,50);
  }

  // ---------------- W: neurons + arrows merge ----------------
  if(gW.visible){
    const d=gW.userData;
    const form=smooth(clamp((t-734.11)/6,0,1));
    d.conns.forEach((ln,i)=>{const v=0.5+0.5*Math.sin(t*2+ln.userData.ph);
      ln.material.opacity=ln.userData.base*(0.4+form*v);});
    d.nodes.forEach((m,i)=>{m.material.opacity=0.7+0.3*Math.sin(t*1.5+i);
      m.scale.setScalar(1+form*0.4*Math.sin(t*2+i));});
    const ha=d.heat.geometry.attributes.position.array;
    for(let i=0;i<d.NH;i++){const life=((t*0.3+d.hph[i])%1);const rr=life*5.0+0.5;
      ha[i*3]=d.hdir[i*3]*rr;ha[i*3+1]=d.hdir[i*3+1]*rr;ha[i*3+2]=d.hdir[i*3+2]*rr;}
    d.heat.geometry.attributes.position.needsUpdate=true;
    d.heat.material.opacity=0.5*form;
    const merge=smooth(clamp((t-729.87)/3,0,1));
    d.aPsy.position.y=1.6*(1-merge);
    d.aTher.position.y=-1.6*(1-merge);
    setOp(d.aPsy,0.7*(1-merge*0.6));setOp(d.aTher,0.7*(1-merge*0.6));
    d.lbl.material.opacity=0.9*merge;
    d.lPsy.material.opacity=0.7*(1-merge);d.lTher.material.opacity=0.7*(1-merge);
    camSet(Math.sin(t*0.05)*1.5,0,10,0,0,0,52);
  }

  // ---------------- X: memories thread to seed, clock closes ----------------
  if(gX.visible){
    const d=gX.userData;
    setOp(d.arrow,0.7);
    d.seedGlow.material.opacity=0.6+0.3*Math.sin(t*1.2);
    const memIn=smooth(clamp((t-770)/6,0,1));
    d.pp.forEach((m,i)=>{m.material.opacity=memIn*(0.6+0.4*Math.sin(t*1.2+m.userData.ph));
      m.position.y=(1.4+Math.sin(i*1.3)*0.6)+Math.sin(t*0.8+m.userData.ph)*0.08;});
    d.thread.material.opacity=0.6*memIn;
    const clkIn=smooth(clamp((t-788.94)/4,0,1));
    d.clk.visible=clkIn>0.02;
    if(d.clk.visible){
      setOp(d.clk,clkIn*0.85);
      d.hand.rotation.z=-t*(TAU/60)*0.35;
      d.photos.children.forEach(m=>{m.material.opacity*=(1-clkIn*0.7);});
      d.thread.material.opacity*=(1-clkIn*0.7);
    }
    d.lbl.material.opacity=0.85*band(t,778.79,800,2.0)*(1-clkIn*0.5);
    camSet(0,0,10+clkIn*2,0,0,0,50);
  }
  }catch(err){var ed=document.getElementById('err');if(ed){ed.style.display='block';ed.textContent='SCENE ERR @t='+t.toFixed(1)+': '+(err&&err.message||err);}}

  // ---------------- global fades ----------------
  let fade=1.0;
  fade*=smooth(clamp(t/3.0,0,1));
  fade*=smooth(clamp((TOTAL-t)/4.0,0,1));

  lens.uniforms.uT.value=t;
  lens.uniforms.uFade.value=fade;
  lens.uniforms.uFlash.value=flash;
  const fiery=inSc(t,'P')||inSc(t,'R')||(inSc(t,'C')&&t<32);
  bloom.strength=fiery?1.05:0.8;

  updateText(t);
  composer.render();
}

// subtitle / chapter lookup
let _lastSub=-1,_lastChap='';
function updateText(t){
  let idx=0;for(let i=0;i<CUES.length;i++){if(CUES[i].t<=t+1e-6)idx=i;else break;}
  const cur=CUES[idx];
  if(idx!==_lastSub){document.getElementById('sub').textContent=cur?cur.s:'';_lastSub=idx;}
  let chT=-1,chS='';for(const c of CUES){if(c.ch&&c.t<=t){chT=c.t;chS=c.ch;}}
  const chapEl=document.getElementById('chap');
  if(chS!==_lastChap){chapEl.textContent=chS;_lastChap=chS;}
  const op=chT>=0?smooth(clamp((t-chT)/0.8,0,1))*smooth(clamp((chT+4.5-t)/1.2,0,1)):0;
  chapEl.style.opacity=op;
  document.getElementById('sub').style.opacity=1;
}

// ============================================================
//  GSAP timeline (paused) — deterministic driver
// ============================================================
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});
const clk={t:0};
tl.to(clk,{t:TOTAL,duration:TOTAL,ease:"none",onUpdate:()=>renderAtTime(clk.t)},0);
window.__timelines["mui-ten-thoi-gian"]=tl;

// initial render
renderAtTime(0);
</script>
