<script>
/* ===== HFA:BEGIN — sinh tự động bởi scripts/inject-lib.mjs, ĐỪNG SỬA TAY ===== */
/* ============================================================================
 * hf-astro.js — bộ khung dùng chung cho composition Du Mục Vũ Trụ
 *
 * Trích từ các tập ĐÃ RENDER VÀ VERIFY (01–07). Trước khi có file này, mỗi tập
 * tự dựng lại cùng một đoạn code (mulberry32, ACESFilmic, composer+bloom, lens
 * pass, starfield, tra phụ đề, driver timeline) — nên bug đã sửa ở tập này lại
 * tái xuất ở tập sau. Dùng file này thay vì chép tay.
 *
 * CÁCH DÙNG: KHÔNG nạp bằng thẻ script ngoài. Preview/render server của HyperFrames
 *      không phục vụ file .js tuỳ ý trong project — nó trả về SPA shell HTML cho
 *      đường dẫn đó, browser parse "doctype html" thành lỗi cú pháp và tập chết
 *      (đã kiểm chứng: curl -D- trả về 200 text/html, 593 byte). Composition phải
 *      TỰ CHỨA. Nhúng bằng:
 *
 *          node scripts/inject-lib.mjs --html index.html
 *
 *      Lệnh này dán nội dung file này vào đầu khối code của tập, giữa hai mốc
 *      HFA:BEGIN / HFA:END. Chạy lại được nhiều lần. Định nghĩa một global: HFA.
 *      Yêu cầu three.min.js + EffectComposer/RenderPass/ShaderPass/UnrealBloomPass
 *      đã nạp trước đó.
 *
 * LUẬT TẤT ĐỊNH: file này không dùng Date.now / performance.now / Math.random /
 * requestAnimationFrame / setTimeout. Mọi thứ là hàm thuần của t hoặc của seed.
 * ========================================================================== */
(function (global) {
  'use strict';

  var HFA = {};

  /* ---- PRNG có seed ------------------------------------------------------
   * Math.random() bị cấm (render phải tất định). Mỗi cụm vật thể dùng MỘT
   * seed riêng — dùng chung một chuỗi cho hai cụm thì thêm/bớt hạt ở cụm này
   * sẽ xê dịch layout cụm kia.
   */
  HFA.mulberry32 = function (a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  /* ---- helper toán -------------------------------------------------------- */
  HFA.clamp = function (x, a, b) { return Math.min(b, Math.max(a, x)); };

  HFA.smooth = function (x) { x = HFA.clamp(x, 0, 1); return x * x * (3 - 2 * x); };

  /** Bao lồi mềm: 0 ngoài [a,b], lên/xuống mượt trong dải f giây ở hai mép. */
  HFA.band = function (t, a, b, f) {
    f = f || 0.8;
    if (t < a - f || t > b + f) return 0;
    var up = HFA.smooth((t - (a - f)) / (2 * f));
    var dn = HFA.smooth(((b + f) - t) / (2 * f));
    return Math.min(1, Math.min(up, dn));
  };

  /* ---- cửa sổ cảnh --------------------------------------------------------
   * SC = {A:[start,end], B:[...], ...} theo GIÂY THẬT (lấy từ timing.json cue.start).
   * Trả về loc(t,k) ∈ [0,1] (tiến độ trong cảnh) và inSc(t,k).
   */
  HFA.scenes = function (SC) {
    return {
      SC: SC,
      loc: function (t, k) {
        var w = SC[k];
        return Math.min(1, Math.max(0, (t - w[0]) / (w[1] - w[0])));
      },
      inSc: function (t, k) { var w = SC[k]; return t >= w[0] && t < w[1]; }
    };
  };

  /* ---- shader lens — PASS CUỐI, kiêm luôn tone mapping + mã hoá sRGB --------
   *
   * ⚠ VÌ SAO PASS NÀY PHẢI TỰ TONE MAP:
   * three.js chỉ chèn ACES + sRGB vào shader của VẬT LIỆU nó tự dựng. Một
   * ShaderMaterial thô trong ShaderPass KHÔNG được chèn — nên khi pass cuối ghi
   * ra màn hình, ảnh chưa hề được mã hoá sRGB.
   * Đo thật (xám #808080, r128): vẽ thẳng = 197, qua EffectComposer = 143.
   * Sai lệch đó là lý do các tập 01–07 ra tối hơn và sai gamma.
   *
   * Vì vậy chuỗi mới là: cảnh vẽ TUYẾN TÍNH vào target HDR (không tone map)
   * → bloom ăn giá trị HDR thật → pass này mới ACES + sRGB ở bước cuối.
   * Bloom đứng TRƯỚC tone mapping mới đúng thứ tự điện ảnh: vùng cực sáng
   * (quang cầu, đĩa bồi tụ) chưa bị nén ngọn nên quầng sáng nở tự nhiên.
   *
   * Thứ tự trong shader: CA → vignette → fade (đều ở TUYẾN TÍNH, vì chúng là
   * phơi sáng) → ACES → sRGB → grain + flash (ở không gian hiển thị, vì grain
   * phim và chớp trắng là hiện tượng của bản in, không phải của ánh sáng).
   * Grain seed theo t, KHÔNG theo đồng hồ — cùng t phải cho cùng frame.
   */
  HFA.LensShader = {
    uniforms: {
      tDiffuse: { value: null }, uT: { value: 0 }, uVig: { value: 0.34 },
      uCA: { value: 0.0015 }, uGrain: { value: 0.045 },
      uFade: { value: 1.0 }, uFlash: { value: 0.0 },
      uExposure: { value: 1.02 }, uToneMap: { value: 1.0 }
    },
    vertexShader:
      'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader: [
      'varying vec2 vUv;uniform sampler2D tDiffuse;',
      'uniform float uT,uVig,uCA,uGrain,uFade,uFlash,uExposure,uToneMap;',
      'float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}',
      // ACES — SAO CHÉP ĐÚNG bản three.js r128 dùng cho ACESFilmicToneMapping
      // (ma trận vào/ra + RRTAndODTFit + tiền tỉ lệ /0.6). KHÔNG dùng xấp xỉ
      // Narkowicz: nó sáng hơn ~4% ở vùng trung, đo được (206 vs 197 trên xám
      // giữa) và sẽ lệch với mọi tài liệu/preset tính theo three.js.
      'vec3 rrt(vec3 v){vec3 a=v*(v+0.0245786)-0.000090537;',
      '  vec3 b=v*(0.983729*v+0.4329510)+0.238081;return a/b;}',
      'vec3 aces(vec3 color){',
      '  const mat3 mIn=mat3(0.59719,0.07600,0.02840, 0.35458,0.90834,0.13383, 0.04823,0.01566,0.83777);',
      '  const mat3 mOut=mat3(1.60475,-0.10208,-0.00327, -0.53108,1.10813,-0.07276, -0.07367,-0.00605,1.07602);',
      '  color/=0.6;',
      '  color=mIn*color; color=rrt(color); color=mOut*color;',
      '  return clamp(color,0.0,1.0);}',
      // tuyến tính → sRGB, đúng công thức chuẩn (không phải pow(1/2.2) cho nhanh)
      'vec3 toSRGB(vec3 c){c=max(c,vec3(0.0));',
      '  return mix(c*12.92,1.055*pow(c,vec3(1.0/2.4))-0.055,step(vec3(0.0031308),c));}',
      'void main(){',
      '  vec2 d=vUv-0.5;float r=dot(d,d);',
      '  vec2 off=d*uCA*(1.0+r*2.2);',
      '  vec3 col;',
      '  col.r=texture2D(tDiffuse,vUv+off).r;',
      '  col.g=texture2D(tDiffuse,vUv).g;',
      '  col.b=texture2D(tDiffuse,vUv-off).b;',
      // --- còn ở TUYẾN TÍNH: vignette + fade là phơi sáng ---
      '  float vig=smoothstep(1.02,uVig,r*2.0);',
      '  col*=mix(1.0,vig,0.85);',
      '  col*=uFade;',
      // --- tone map + mã hoá hiển thị ---
      '  col=mix(col*uExposure,aces(col*uExposure),uToneMap);',
      '  col=toSRGB(col);',
      // --- không gian hiển thị: grain + chớp trắng ---
      '  float g=h(vUv*vec2(1920.0,1080.0)+fract(uT)*97.3)-0.5;',
      '  col+=g*uGrain;',
      '  col=mix(col,vec3(1.0,0.98,0.94),uFlash);',
      '  gl_FragColor=vec4(clamp(col,0.0,1.0),1.0);',
      '}'
    ].join('\n')
  };

  /* ---- dựng sân khấu ------------------------------------------------------
   * Trả về {renderer, scene, camera, composer, bloom, lens, W, H, loadTex}.
   * Ánh sáng mặc định (amb/key/rim) tắt được bằng opt.lights=false.
   */
  HFA.createStage = function (opt) {
    opt = opt || {};
    var W = opt.width || 1920, H = opt.height || 1080;
    var canvas = typeof opt.canvas === 'string'
      ? document.getElementById(opt.canvas)
      : (opt.canvas || document.getElementById('c'));

    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(1);
    renderer.setSize(W, H);
    renderer.setClearColor(opt.clearColor != null ? opt.clearColor : 0x08080a, 1);

    // Tone mapping + sRGB CỐ Ý tắt ở đây: cả hai được làm ở pass lens cuối cùng.
    // Bật ở đây thì cảnh bị nén dải TRƯỚC khi bloom nhìn thấy (quầng sáng bẹt),
    // rồi lại không được mã hoá sRGB lúc ghi ra màn hình (xem chú thích LensShader).
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.outputEncoding = THREE.LinearEncoding;

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(
      opt.fov || 46, W / H, opt.near || 0.05, opt.far || 60000);
    camera.position.set(0, 0, 60);

    if (opt.lights !== false) {
      var amb = new THREE.AmbientLight(0x232838, 0.85); scene.add(amb);
      var key = new THREE.DirectionalLight(0xffe8d2, 1.05); key.position.set(6, 4, 8); scene.add(key);
      var rim = new THREE.DirectionalLight(0x6f9cff, 0.4); rim.position.set(-8, -3, -6); scene.add(rim);
      scene.userData.lights = { amb: amb, key: key, rim: rim };
    }

    /* --- render target: MSAA + HDR -------------------------------------------
     * `antialias:true` ở trên CHỈ tác dụng lên framebuffer mặc định. Đi qua
     * EffectComposer là vẽ vào target offscreen, và target đó KHÔNG multisample
     * theo mặc định — nên cờ antialias thành vô nghĩa và mọi rìa bị răng cưa.
     * WebGLMultisampleRenderTarget (có từ r111) khôi phục MSAA thật.
     * HalfFloat giữ giá trị >1.0 để bloom ăn được highlight HDR thật.
     */
    var samples = opt.msaa != null ? opt.msaa : 4;
    var rtOpts = {
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat,
      type: opt.hdr === false ? THREE.UnsignedByteType : THREE.HalfFloatType
    };
    var rt;
    if (samples > 0 && typeof THREE.WebGLMultisampleRenderTarget === 'function') {
      rt = new THREE.WebGLMultisampleRenderTarget(W, H, rtOpts);
      rt.samples = samples;
    } else {
      rt = new THREE.WebGLRenderTarget(W, H, rtOpts);
      if (samples > 0) console.warn('[hf-astro] không có WebGLMultisampleRenderTarget — chạy không MSAA.');
    }

    var composer = new THREE.EffectComposer(renderer, rt);
    composer.addPass(new THREE.RenderPass(scene, camera));

    /* Ngưỡng bloom: cảnh giờ là HDR TUYẾN TÍNH, không còn bị nén về [0,1] như
     * trước. Highlight thật nằm TRÊN 1.0, nên ngưỡng cũ 0.62 (chỉnh cho ảnh đã
     * tone map) sẽ làm cả những vùng sáng vừa cũng loé. Mặc định nâng lên 1.0. */
    var bloom = new THREE.UnrealBloomPass(
      new THREE.Vector2(W, H),
      opt.bloomStrength != null ? opt.bloomStrength : 0.78,
      opt.bloomRadius != null ? opt.bloomRadius : 0.7,
      opt.bloomThreshold != null ? opt.bloomThreshold : (opt.hdr === false ? 0.62 : 1.0));
    composer.addPass(bloom);

    // Bản sao uniforms để hai stage không dùng chung state.
    var lensDef = {
      uniforms: THREE.UniformsUtils.clone(HFA.LensShader.uniforms),
      vertexShader: HFA.LensShader.vertexShader,
      fragmentShader: HFA.LensShader.fragmentShader
    };
    var lens = new THREE.ShaderPass(lensDef);
    lens.renderToScreen = true;
    lens.uniforms.uExposure.value = opt.exposure != null ? opt.exposure : 1.02;
    composer.addPass(lens);

    var texLoader = new THREE.TextureLoader();
    texLoader.setCrossOrigin('anonymous');
    function loadTex(path, enc) {
      var tx = texLoader.load(path);
      if (enc) tx.encoding = enc;
      tx.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return tx;
    }

    var stage = {
      renderer: renderer, scene: scene, camera: camera,
      composer: composer, bloom: bloom, lens: lens, rt: rt,
      W: W, H: H, loadTex: loadTex,
      clearColor: opt.clearColor != null ? opt.clearColor : 0x08080a
    };

    /* --- environment map (IBL) ----------------------------------------------
     * MeshStandardMaterial là vật liệu PBR: nó phản xạ MÔI TRƯỜNG. Không có
     * envMap thì kim loại và bề mặt bóng mất gần hết thông tin phản xạ, chỉ còn
     * highlight từ đèn → ra chất nhựa sơn. (Tập "Vàng" là ví dụ rõ nhất.)
     * Dựng một bầu trời tối có vài đốm sáng, nướng qua PMREM MỘT LẦN lúc khởi
     * tạo → tất định, không phụ thuộc t, mọi MeshStandardMaterial hưởng ngay
     * qua scene.environment mà không phải sửa từng vật liệu.
     */
    if (opt.environment !== false) {
      stage.environment = HFA.buildEnvironment(renderer, scene, opt.environmentSeed || 4242);
    }

    return stage;
  };

  /** Bầu trời sao mờ nướng thành envMap PMREM. Trả về texture (đã gán scene.environment). */
  HFA.buildEnvironment = function (renderer, scene, seed) {
    var pr = HFA.mulberry32(seed);
    var cv = document.createElement('canvas');
    cv.width = 512; cv.height = 256;
    var cx = cv.getContext('2d');

    // nền: gradient rất tối, hơi lạnh ở dưới, ấm nhạt ở trên (ánh sáng thiên hà)
    var gr = cx.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, '#0a0d16'); gr.addColorStop(0.5, '#070910'); gr.addColorStop(1, '#05060b');
    cx.fillStyle = gr; cx.fillRect(0, 0, 512, 256);

    // dải Ngân Hà mờ vắt ngang → cho phản xạ có hướng, tránh env phẳng lì
    var bandGr = cx.createLinearGradient(0, 96, 0, 160);
    bandGr.addColorStop(0, 'rgba(70,80,110,0)');
    bandGr.addColorStop(0.5, 'rgba(120,130,165,0.30)');
    bandGr.addColorStop(1, 'rgba(70,80,110,0)');
    cx.fillStyle = bandGr; cx.fillRect(0, 96, 512, 64);

    // vài nguồn sáng nhỏ để kim loại có điểm loé
    for (var i = 0; i < 220; i++) {
      var x = pr() * 512, y = pr() * 256, s = pr() < 0.06 ? 2.2 : 1.0;
      var b = 0.35 + pr() * 0.65;
      cx.fillStyle = 'rgba(255,252,245,' + b.toFixed(3) + ')';
      cx.fillRect(x, y, s, s);
    }

    var tex = new THREE.CanvasTexture(cv);
    tex.mapping = THREE.EquirectangularReflectionMapping;
    tex.encoding = THREE.sRGBEncoding;

    var pmrem = new THREE.PMREMGenerator(renderer);
    pmrem.compileEquirectangularShader();
    var env = pmrem.fromEquirectangular(tex).texture;
    pmrem.dispose();
    tex.dispose();

    scene.environment = env;   // KHÔNG gán scene.background — nền do starfield lo
    return env;
  };

  /* ---- CHỌN MÀU SAO CHO SỐNG SÓT QUA ACES ---------------------------------
   * Bài học đo được ở tập 08, tốn 3 vòng sửa mới ra. Đọc trước khi chọn bảng màu.
   *
   * ACES nén mạnh vùng sáng. Càng đẩy độ sáng lên, sắc càng bị kéo về trắng/xám.
   * Nên SẮC PHẢI ĐẾN TỪ TỈ LỆ GIỮA CÁC KÊNH, không đến từ độ sáng.
   *
   * Đo thật (bão hoà còn lại sau khi qua chuỗi ACES của three.js r128):
   *   (0.42, 0.60, 1.05)  → còn 11–25%  → ra XÁM BÊ TÔNG. Đừng dùng.
   *   (0.10, 0.32, 1.00)  → còn 37–67%  → ra LAM THẬT.
   *
   * Quy tắc rút ra:
   *   - Kênh yếu nên ≤ 0.2× kênh mạnh. Nâng kênh yếu lên là giết sắc.
   *   - Kênh mạnh giữ quanh 1.0, đừng hơn.
   *   - Muốn SÁNG hơn thì tăng emissive (vượt ngưỡng bloom), ĐỪNG nâng kênh yếu.
   *
   * Hệ quả cho chữ và sơ đồ: bloom làm NHOÈ MẤT NÉT CHỮ. Nét biểu đồ và typo phải
   * để DƯỚI ngưỡng bloom (<1.0). Muốn chữ rõ hơn thì tăng độ dày nét, không tăng
   * emissive.
   *
   * Chống cháy trắng: giữ diện tích có luminance >0.85 (sau tonemap) dưới ~12%
   * khung. Cần một vùng sáng rộng thì đẩy bằng SỐ LƯỢNG hạt nhỏ, đừng đẩy bằng
   * độ sáng của hạt lớn.

  HFA.saturationAfterACES = function (r, g, b) {
    // Ước lượng nhanh xem một màu tuyến tính có giữ được sắc sau ACES không.
    // Trả về {before, after} ∈ [0,1]. after < 0.3 nghĩa là sẽ ra xám.
    function aces(v) {
      // xấp xỉ đủ dùng để SO SÁNH các màu với nhau (không phải bản đầy đủ)
      return Math.max(0, Math.min(1, (v * (2.51 * v + 0.03)) / (v * (2.43 * v + 0.59) + 0.14)));
    }
    function sat(x, y, z) {
      var mx = Math.max(x, y, z), mn = Math.min(x, y, z);
      return mx <= 0 ? 0 : (mx - mn) / mx;

    return { before: sat(r, g, b), after: sat(aces(r), aces(g), aces(b)) };

  /* ---- sprite hạt tròn mềm (tránh hạt vuông) ------------------------------ */
  HFA.dotTex = function (rr, gg, bb) {

    gr.addColorStop(0, 'rgba(' + rr + ',' + gg + ',' + bb + ',1)');
    gr.addColorStop(0.4, 'rgba(' + rr + ',' + gg + ',' + bb + ',0.55)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    cx.fillStyle = gr; cx.fillRect(0, 0, 64, 64);

  /* ---- starfield màu theo nhiệt độ ----------------------------------------
   * ⚠ BÁN KÍNH: radius PHẢI lớn hơn khoảng cách camera XA NHẤT trong cả timeline.
   * Camera bay ra ngoài quả cầu sao → nhìn thấy "quả bóng vũ trụ" bo tròn. Đây là
   * lỗi đã xảy ra thật. Truyền opt.maxCamDist để bật cảnh báo tự động.
   * Hằng số trong gl_PointSize phải BẰNG ĐÚNG radius, nếu không sao đổi độ to khi
   * đổi bán kính — nên nó được nội suy vào shader ngay dưới đây.
   */
  HFA.buildStars = function (opt) {
    opt = opt || {};
    var R = opt.radius || 9000;
    var N = opt.count || 3600;
    var pr = HFA.mulberry32(opt.seed || 20260808);

    if (opt.maxCamDist && R <= opt.maxCamDist * 1.5) {
      console.warn('[hf-astro] starfield radius ' + R + ' quá nhỏ so với camera xa nhất ' +
        opt.maxCamDist + ' — sẽ lộ "quả bóng vũ trụ". Tăng radius lên >' +
        Math.ceil(opt.maxCamDist * 2) + ' (và giữ < camera.far).');
    }

    var pos = new Float32Array(N * 3), col = new Float32Array(N * 3), siz = new Float32Array(N);
    var tmp = new THREE.Vector3();
    for (var i = 0; i < N; i++) {
      var u = pr(), v = pr();
      var theta = Math.acos(2 * u - 1), phi = 2 * Math.PI * v;
      tmp.set(Math.sin(theta) * Math.cos(phi), Math.cos(theta) * 0.8, Math.sin(theta) * Math.sin(phi))
        .normalize().multiplyScalar(R);
      pos[i * 3] = tmp.x; pos[i * 3 + 1] = tmp.y; pos[i * 3 + 2] = tmp.z;

      // màu theo nhiệt độ: xanh nóng → trắng → vàng nhạt
      var tt = pr(), c = new THREE.Color();
      if (tt < 0.14) c.setRGB(0.6, 0.72, 1.0);
      else if (tt < 0.5) c.setRGB(0.85, 0.9, 1.0);
      else if (tt < 0.8) c.setRGB(0.9, 0.92, 1.0);
      else c.setRGB(0.8, 0.82, 0.95);
      c.multiplyScalar(0.3 + pr() * 0.5);
      col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;

      siz[i] = (pr() < 0.05 ? 2.6 : 1.0) * (0.8 + pr() * 1.4);
    }

    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    g.setAttribute('aS', new THREE.BufferAttribute(siz, 1));

    var m = new THREE.ShaderMaterial({
      uniforms: { uOp: { value: 1 } },
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      vertexShader:
        'attribute float aS;attribute vec3 color;varying vec3 vC;' +
        'void main(){vC=color;vec4 mv=modelViewMatrix*vec4(position,1.0);' +
        'gl_PointSize=aS*(' + R.toFixed(1) + '/-mv.z);gl_Position=projectionMatrix*mv;}',
      fragmentShader:
        'varying vec3 vC;uniform float uOp;' +
        'void main(){vec2 d=gl_PointCoord-0.5;float r=length(d);' +
        'float a=smoothstep(0.5,0.0,r);gl_FragColor=vec4(vC,a*uOp);}'
    });

    var pts = new THREE.Points(g, m);
    pts.userData.radius = R;
    return pts;
  };

  /* ---- TÍCH LUỸ ĐA MẪU: khử răng cưa + motion blur thật -------------------
   *
   * Chỉ làm được vì renderAtTime(t) là HÀM THUẦN, không trạng thái: gọi lại với
   * t nào cũng cho đúng kết quả của t đó. Render offline nên được phép trả giá
   * bằng thời gian để đổi lấy chất lượng — đây là thứ engine realtime không có.
   *
   * Mỗi frame xuất ra lấy N mẫu:
   *   - t rải đều trong khoảng 1/fps      → MOTION BLUR thật theo quỹ đạo
   *   - camera lệch dưới-một-pixel        → SUPERSAMPLING, khử cả răng cưa
   *     shader/specular mà MSAA không xử lý được
   * rồi cộng trung bình.
   *
   * Giá: thời gian capture ×N. Nháp để samples=1, bản giao hàng đặt 4.
   *
   * CÁCH DÙNG — trong file tập:
   *   HFA.enableAccumulation(stage, {samples:4, fps:30});
   *   ... window.__time""lines[id] = HFA.makeTimeline(id, TOTAL, renderAtTime);
   * makeTimeline tự phát hiện stage đã bật tích luỹ nếu bạn truyền stage:
   *   HFA.makeTimeline(id, TOTAL, renderAtTime, stage)
   */
  HFA.enableAccumulation = function (stage, o) {
    o = o || {};
    var N = Math.max(1, o.samples || 1);
    if (N === 1) {
      // tắt tích luỹ → PHẢI trả composer về chế độ vẽ thẳng ra màn hình,
      // nếu không màn hình đen (không pass nào ghi ra nữa).
      stage.accum = null;
      stage.composer.renderToScreen = true;
      return stage;
    }

    /* Chuyển hướng đầu ra composer vào texture thay vì màn hình.
     * ⚠ PHẢI đặt trên COMPOSER, không phải trên pass: EffectComposer.render()
     * gán lại pass.renderToScreen mỗi frame theo công thức
     *   pass.renderToScreen = composer.renderToScreen && làPassCuốiCùng
     * nên mọi thiết lập trực tiếp lên lens.renderToScreen đều bị xoá. (Đo được:
     * đặt trên pass thì cả read/write buffer đều chứa dữ liệu TRƯỚC lens.) */
    stage.composer.renderToScreen = false;

    var rtOpts = {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat, type: THREE.HalfFloatType
    };
    var accumRT = new THREE.WebGLRenderTarget(stage.W, stage.H, rtOpts);

    // quad toàn màn hình dùng để cộng dồn rồi để xuất ra
    var quadScene = new THREE.Scene();
    var quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    var quadMat = new THREE.ShaderMaterial({
      uniforms: { tSrc: { value: null }, uWeight: { value: 1 / N } },
      transparent: true, depthTest: false, depthWrite: false,
      blending: THREE.CustomBlending,
      blendEquation: THREE.AddEquation,
      blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,   // cộng thuần
      vertexShader: 'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}',
      fragmentShader: 'varying vec2 vUv;uniform sampler2D tSrc;uniform float uWeight;' +
        'void main(){gl_FragColor=vec4(texture2D(tSrc,vUv).rgb*uWeight,1.0);}'
    });
    quadScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), quadMat));

    var outMat = new THREE.ShaderMaterial({
      uniforms: { tSrc: { value: accumRT.texture } },
      depthTest: false, depthWrite: false,
      vertexShader: 'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}',
      fragmentShader: 'varying vec2 vUv;uniform sampler2D tSrc;' +
        'void main(){gl_FragColor=vec4(texture2D(tSrc,vUv).rgb,1.0);}'
    });
    var outScene = new THREE.Scene();
    outScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), outMat));

    stage.accum = {
      samples: N, fps: o.fps || 30,
      rt: accumRT, quadScene: quadScene, quadCam: quadCam,
      quadMat: quadMat, outScene: outScene
    };
    return stage;
  };

  /* Vị trí lệch subpixel — chuỗi Halton (2,3): phân bố đều hơn ngẫu nhiên,
   * và tất định tuyệt đối (không đụng tới PRNG chung). */
  function halton(i, b) {
    var f = 1, r = 0;
    while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); }
    return r;
  }

  /** Vẽ MỘT frame tại t. Tự dùng tích luỹ nếu stage đã bật, không thì vẽ thẳng. */
  HFA.renderFrame = function (stage, renderAtTime, t) {
    var acc = stage && stage.accum;
    if (!acc) { renderAtTime(t); return; }   // renderAtTime tự gọi composer.render()

    var r = stage.renderer, cam = stage.camera, N = acc.samples;
    var dt = 1 / acc.fps;
    var prevAutoClear = r.autoClear;

    // xoá bộ tích luỹ ĐÚNG MỘT LẦN, trước vòng lặp
    r.setRenderTarget(acc.rt);
    r.setClearColor(0x000000, 1);
    r.clear(true, true, true);
    r.setRenderTarget(null);

    for (var i = 0; i < N; i++) {
      // lệch dưới-một-pixel (Halton, tất định)
      var jx = halton(i + 1, 2) - 0.5, jy = halton(i + 1, 3) - 0.5;
      cam.setViewOffset(stage.W, stage.H, jx, jy, stage.W, stage.H);

      // trải t trong đúng một frame → motion blur
      var tt = t + ((i + 0.5) / N - 0.5) * dt;
      r.setClearColor(stage.clearColor, 1);   // trả màu nền cho RenderPass
      renderAtTime(tt < 0 ? 0 : tt);

      /* ⚠ autoClear PHẢI tắt ở đây.
       * renderer.autoClear mặc định TRUE → mỗi r.render() xoá sạch target trước
       * khi vẽ. Cộng dồn mà không tắt thì 3 mẫu đầu bị xoá, chỉ mẫu cuối sống
       * sót và nó mang trọng số 1/N → ảnh tối đúng N lần. (Đã dính lỗi này:
       * ảnh ra tối bằng 1/4 với N=4.) */
      // pass cuối có needsSwap=true nên sau render(), kết quả nằm ở readBuffer
      acc.quadMat.uniforms.tSrc.value = stage.composer.readBuffer.texture;
      r.autoClear = false;
      r.setRenderTarget(acc.rt);
      r.render(acc.quadScene, acc.quadCam);
      r.setRenderTarget(null);
      r.autoClear = prevAutoClear;
    }

    cam.clearViewOffset();
    r.setClearColor(stage.clearColor, 1);
    r.render(acc.outScene, acc.quadCam);   // xuất ra màn hình
  };

  /* ---- phụ đề -------------------------------------------------------------
   * CUES = [{t, s}] do scripts/gen-captions.mjs sinh (đã cắt ≤42 ký tự/dòng).
   * Đừng cắt tay và đừng đổi mảng này bằng tay.

    }

      var m = marks[i];

 {t:142.37,s:"đâu."},
 {t:142.65,s:"Và làm sao con người biết được điều đó,"},
 {t:145.57,s:"khi không aai từng ở đó để xem."},
 {t:149.89,s:"Tôi muốn đưa bạn tới nơi làm ra nước."},
 {t:152.04,s:"Nhưng tôi phải báo trước."},
 {t:153.72,s:"Nó không giống bất cứ thứ gì bạn hình dung"},
 {t:156.44,s:"khi nghe hai chữ vũ trụ."},
 {t:158,s:"Không có ngôi sao nào ở đây."},
 {t:159.58,s:"Không có ánh sáng, không có màu sắc, không"},
 {t:163.2,s:"có hơi ấm."},
 {t:164.06,s:"Tôi đang ở giữa một đám mây tối nằm lơ"},
 {t:166.84,s:"lửng giữa các vì sao."},
 {t:168.38,s:"Trong ngành thiên văn người ta gọi nó là"},
 {t:171.73,s:"đám mây phân tử."},
 {t:173.07,s:"Từ xa nhìn lại, nó chỉ là một vết đen trên"},
 {t:176.14,s:"nền trời đầy sao."},
 {t:177.38,s:"Một mảng mà ánh sáng không đi qua được."},
 {t:179.8,s:"Nhìn từ Trái Đất, nó trông như có aai lấy"},
 {t:182.87,s:"mực bôi lên một góc dải Ngân Hà."},
 {t:185.26,s:"Ở đây lạnh."},
 {t:186.15,s:"Lạnh hơn mọi thứ tôi từng chạm vào."},
 {t:188.84,s:"Khoảng mười độ trên không độ tuyệt đối."},
 {t:191.82,s:"Nếu bạn cần một con số dễ hình dung, đó là"},
 {t:195.03,s:"âm hai trăm sáu mươi ba độ C."},
 {t:197.24,s:"Lạnh hơn bề mặt Diêm Vương Tinh."},
 {t:199.55,s:"Lạnh gần tới cái giới hạn mà tự nhiên cho"},
 {t:202.96,s:"phép."},
 {t:203.38,s:"Và ở đây trống rỗng tới mức buồn cười."},
 {t:206.32,s:"Mỗi centimet khối chỗ này chứa vài chục"},
 {t:209.02,s:"nghìn hạt."},
 {t:209.71,s:"Nghe thì nhiều."},
 {t:211.08,s:"Nhưng một centimet khối không khí trong"},
 {t:213.82,s:"phòng tôi chứa nhiều gấp mười tỉ tỉ lần."},
 {t:216.63,s:"Phòng thí nghiệm tốt nhất trên Trái Đất,"},
 {t:219.08,s:"với những máy bơm chân không đắt nhất từng"},
 {t:221.65,s:"chế tạo, vẫn không hút ra nổi một khoảng"},
 {t:224.1,s:"trống rỗng như chỗ này."},
 {t:227.01,s:"Vậy mà đây chính là nơi nước ra đời."},
 {t:229.93,s:"Trong cái lạnh đó."},
 {t:231.53,s:"Trong cái trống rỗng đó."},
 {t:233.31,s:"Trong bóng tối hoàn toàn."},
 {t:235.57,s:"Câu hỏi đặt ra ngay lập tức."},
 {t:237.23,s:"Làm sao hai nguyên tử gặp được nhau ở một"},
 {t:240.03,s:"nơi mà chúng gần như không bao giờ va vào"},
 {t:242.83,s:"nhau?"},
 {t:243.17,s:"Trong không gian trống như thế, một nguyên"},
 {t:245.58,s:"tử hydro có thể trôi hàng trăm năm trước"},
 {t:247.88,s:"khi đụng phải một nguyên tử khác."},
 {t:249.77,s:"Và ngay cả khi đụng, chúng thường bật ra."},
 {t:252.9,s:"Để dính vào nhau, hai nguyên tử phải nhả"},
 {t:255.56,s:"bớt năng lượng đi đâu đó."},
 {t:257.22,s:"Mà giữa chân không thì chẳng có chỗ nào để"},
 {t:260.25,s:"nhả."},
 {t:260.54,s:"Hoá học kiểu chúng ta biết cần một cái"},
 {t:263.89,s:"bàn."},
 {t:264.24,s:"Cần một môi trường đông đúc, nơi các phân"},
 {t:267.26,s:"tử chen chúc và va đập liên tục."},
 {t:269.62,s:"Ở đây không có gì cả."},
 {t:274.48,s:"Trừ một thứ."},
 {t:275.49,s:"Bụi."},
 {t:276.69,s:"Rải rác trong đám mây là những hạt rắn tí"},
 {t:279.99,s:"hon."},
 {t:280.31,s:"Lõi của chúng là silicat hoặc cacbon, thứ"},
 {t:283.39,s:"tàn dư mà những ngôi sao chết trước đó đã"},
 {t:286.48,s:"thổi ra."},
 {t:287.08,s:"Mỗi hạt nhỏ cỡ một phần mười micromet."},
 {t:290.05,s:"Nhỏ hơn hạt khói thuốc lá."},
 {t:292.3,s:"Nhỏ tới mức một triệu hạt gộp lại vẫn"},
 {t:295.3,s:"không đủ để bạn nhìn thấy bằng mắt."},
 {t:298.14,s:"Nhưng với một nguyên tử, hạt bụi đó là cả"},
 {t:301.1,s:"một lục địa."},
 {t:301.96,s:"Và đây là chuyện xảy ra."},
 {t:303.88,s:"Một nguyên tử oxy trôi qua, chạm vào bề"},
 {t:306.91,s:"mặt lạnh của hạt bụi, và dính lại."},
 {t:309.55,s:"Ở mười độ trên không tuyệt đối, nó không"},
 {t:312.19,s:"có đủ năng lượng để bật ra nữa."},
 {t:314.24,s:"Nó nằm đó."},
 {t:315.44,s:"Bị bắt."},
 {t:316.74,s:"Rồi một nguyên tử hydro trôi tới, và cũng"},
 {t:320,s:"dính."},
 {t:320.4,s:"Nhưng hydro nhẹ, nó không nằm yên."},
 {t:322.97,s:"Nó trườn trên bề mặt hạt bụi, đi lang"},
 {t:325.5,s:"thang từ chỗ lồi này sang chỗ lõm kia, như"},
 {t:328.37,s:"một con kiến bò quanh một hòn đá."},
 {t:330.62,s:"Và sớm muộn gì con kiến đó cũng bò tới chỗ"},
 {t:333.72,s:"nguyên tử oxy đang nằm."},
 {t:335.42,s:"Chúng gắn vào nhau."},
 {t:336.58,s:"Phần năng lượng dư thừa được hạt bụi hấp"},
 {t:339.01,s:"thụ và tản đi."},
 {t:339.86,s:"Hạt bụi chính là cái bàn."},
 {t:341.7,s:"Nó là nơi phản ứng đứng, và là nơi đổ"},
 {t:345.21,s:"nhiệt."},
 {t:345.78,s:"Thêm một nguyên tử hydro nữa bò tới."},
 {t:348.24,s:"Gắn tiếp."},
 {t:349.35,s:"Và bây giờ, trên bề mặt một hạt bụi giữa"},
 {t:352.3,s:"hư không, có một phân tử nước."},
 {t:356.51,s:"Chuyện đó lặp lại."},
 {t:357.79,s:"Trong hàng triệu năm, lặp đi lặp lại trên"},
 {t:360.66,s:"từng hạt bụi trong đám mây."},
 {t:362.55,s:"Mỗi hạt dần dần bọc trong một lớp băng."},
 {t:365.3,s:"Một lớp áo dày vài chục, có khi vài trăm"},
 {t:368.69,s:"phân tử."},
 {t:369.37,s:"Không có lửa."},
 {t:370.51,s:"Không có tia chớp."},
 {t:371.97,s:"Không có ngôi sao nào thắp sáng cảnh này."},
 {t:374.74,s:"Chỉ có bóng tối, cái lạnh, và sự kiên"},
 {t:378.7,s:"nhẫn."},
 {t:379.23,s:"Tôi thấy có gì đó rất lạ ở chuyện này."},
 {t:381.34,s:"Chúng ta quen nghĩ vũ trụ tạo ra mọi thứ"},
 {t:384.17,s:"trong lửa."},
 {t:384.88,s:"Trong lò hạt nhân của các ngôi sao, trong"},
 {t:387.88,s:"vụ nổ siêu tân tinh, trong nhiệt độ hàng"},
 {t:390.81,s:"tỉ độ."},
 {t:391.25,s:"Nhưng thứ quan trọng nhất với sự sống lại"},
 {t:393.48,s:"không sinh ra trong lửa."},
 {t:394.78,s:"Nó sinh ra trong cái lạnh."},
 {t:396.98,s:"Trên một bề mặt tối."},
 {t:398.76,s:"Từng nguyên tử một."},
 {t:402.62,s:"Bây giờ tới phần tôi thấy khó tin nhất."},
 {t:405.1,s:"Không phải chuyện nước hình thành ở đó."},
 {t:407.52,s:"Mà chuyện làm sao chúng ta biết được."},
 {t:410.1,s:"Không aai đứng trong đám mây đó để xem."},
 {t:412.71,s:"Không có máy quay."},
 {t:414.3,s:"Chuyện xảy ra trước khi Mặt Trời tồn tại,"},
 {t:417.22,s:"ở một nơi không còn nữa."},
 {t:418.93,s:"Vậy mà con người vẫn nói được, một cách"},
 {t:421.79,s:"khá tự tin, rằng một phần nước biển được"},
 {t:424.73,s:"làm ra ở đấy."},
 {t:425.68,s:"Lý do là vì nước mang theo một cái nhãn."},
 {t:428.38,s:"Và cái nhãn đó ghi nhiệt độ nơi nó ra đời."},
 {t:434.42,s:"Hydro có hai phiên bản."},
 {t:436.46,s:"Phiên bản thường chỉ là một proton trần"},
 {t:438.83,s:"trụi, một hạt nhân đơn độc với một"},
 {t:440.9,s:"electron quay quanh."},
 {t:442.12,s:"Đó là loại phổ biến áp đảo."},
 {t:444.32,s:"Phiên bản thứ hai có thêm một neutron đi"},
 {t:447.09,s:"kèm."},
 {t:447.37,s:"Vẫn là hydro, vẫn hành xử hoá học gần như"},
 {t:450.89,s:"y hệt, nhưng nặng gấp đôi."},
 {t:453.13,s:"Nó tên là deuteri."},
 {t:455.39,s:"Deuteri có từ vũ trụ sơ khai, được đúc ra"},
 {t:458.32,s:"trong những phút đầu tiên sau Big Bang, và"},
 {t:461.31,s:"từ đó tới nay gần như không aai làm thêm"},
 {t:464.17,s:"được nữa."},
 {t:464.81,s:"Nó hiếm."},
 {t:465.99,s:"Trong vũ trụ, cứ khoảng bốn mươi nghìn"},
 {t:468.97,s:"nguyên tử hydro thì có một nguyên tử"},
 {t:471.78,s:"deuteri."},
 {t:472.41,s:"Nhưng tôi không quan tâm deuteri được làm"},
 {t:474.73,s:"ra thế nào."},
 {t:475.35,s:"Tôi quan tâm nó làm được gì cho tôi bây"},
 {t:477.86,s:"giờ."},
 {t:478.12,s:"Và nó làm được một việc rất cụ thể."},
 {t:480.75,s:"Nó là một cái nhiệt kế."},
 {t:482.78,s:"Nếu một phân tử nước có một nguyên tử"},
 {t:485.47,s:"deuteri thay cho hydro thường, nó nặng hơn"},
 {t:488.52,s:"một chút."},
 {t:489.17,s:"Và ở nhiệt độ rất thấp, cái chút nặng hơn"},
 {t:492.64,s:"đó thay đổi mọi thứ."},
 {t:494.34,s:"Liên kết với deuteri chắc hơn liên kết với"},
 {t:497.42,s:"hydro thường một chút xíu."},
 {t:499.32,s:"Trong phòng ấm, sự khác biệt đó không đáng"},
 {t:502.37,s:"gì, nhiệt độ làm mọi thứ xáo trộn đủ để nó"},
 {t:505.42,s:"biến mất trong nhiễu."},
 {t:506.95,s:"Nhưng ở mười độ trên không tuyệt đối,"},
 {t:509.43,s:"không còn nhiễu nữa."},
 {t:510.77,s:"Không có gì để xáo trộn."},
 {t:512.52,s:"Và cái khác biệt nhỏ xíu đó trở thành quy"},
 {t:515.22,s:"luật."},
 {t:515.55,s:"Deuteri được ưu tiên."},
 {t:518.1,s:"Nó bị giữ lại nhiều hơn, gắn vào nước"},
 {t:521.09,s:"nhiều hơn."},
 {t:521.9,s:"Kết quả là nước hình thành trong cái lạnh"},
 {t:524.34,s:"cực độ chứa nhiều deuteri hơn hẳn mức"},
 {t:526.55,s:"trung bình của vũ trụ."},
 {t:527.86,s:"Có khi nhiều gấp hàng chục, hàng trăm lần."},
 {t:531.39,s:"Còn nước hình thành ở nơi ấm hơn thì"},
 {t:533.59,s:"không."},
 {t:533.96,s:"Nó giữ tỉ lệ gần với mức nền."},
 {t:536.56,s:"Nghĩa là mỗi khối nước trong vũ trụ mang"},
 {t:539.39,s:"trong nó một con số."},
 {t:540.81,s:"Tỉ lệ deuteri trên hydro."},
 {t:543.28,s:"Và con số đó chính là nhiệt độ của cái nơi"},
 {t:546.18,s:"nó được ráp lại, đóng dấu vào từ ngày đầu"},
 {t:549.02,s:"và không phai đi."},
 {t:550.19,s:"Đó là dấu vân tay."},
 {t:552.2,s:"Và nếu tôi có dấu vân tay, tôi có thể đi"},
 {t:555.23,s:"truy nguồn gốc."},
 {t:557.87,s:"Việc đầu tiên là lấy mẫu ở nhà."},
 {t:560.43,s:"Người ta đo nước biển Trái Đất, và đặt cho"},
 {t:563.46,s:"nó một cái tên chuẩn để cả thế giới dùng"},
 {t:566.34,s:"chung làm mốc so sánh."},
 {t:567.93,s:"Con số là thế này."},
 {t:569.1,s:"Trong nước biển, cứ khoảng sáu nghìn tư"},
 {t:571.95,s:"nguyên tử hydro thì có một nguyên tử"},
 {t:574.58,s:"deuteri."},
 {t:575.17,s:"So với mức nền của vũ trụ, nước biển giàu"},
 {t:578.32,s:"deuteri hơn khoảng sáu, bảy lần."},
 {t:580.77,s:"Nó không phải thứ nước được lắp ráp ở nơi"},
 {t:583.55,s:"ấm áp."},
 {t:583.96,s:"Nó mang dấu của cái lạnh."},
 {t:585.9,s:"Đại dương của chúng ta mang chữ ký hoá học"},
 {t:588.62,s:"của một nơi mà Trái Đất chưa bao giờ đi"},
 {t:591.15,s:"qua."},
 {t:593.41,s:"Việc thứ hai là ra ngoài kia lấy mẫu của"},
 {t:597.08,s:"hàng xóm."},
 {t:597.9,s:"Và chuyện này thì con người đã làm thật,"},
 {t:600.56,s:"bằng những con tàu gửi đi hàng chục năm."},
 {t:603.22,s:"Sao chổi là ứng viên đầu tiên aai cũng"},
 {t:605.69,s:"nghĩ tới."},
 {t:606.28,s:"Chúng gần như là những tảng băng bẩn được"},
 {t:608.74,s:"cất trong tủ đông từ ngày hệ Mặt Trời mới"},
 {t:611.21,s:"hình thành."},
 {t:611.87,s:"Nếu có thứ gì còn giữ nguyên nước cổ, thì"},
 {t:615.08,s:"là chúng."},
 {t:615.78,s:"Năm hai nghìn mười bốn, một con tàu của"},
 {t:618.19,s:"châu Âu tên Rosetta đuổi kịp một sao chổi"},
 {t:620.71,s:"sau mười năm bay, rồi bay kèm bên cạnh nó"},
 {t:623.24,s:"như một người bạn đồng hành."},
 {t:624.97,s:"Sao chổi đó có cái tên khó đọc,"},
 {t:627.72,s:"Churyumov-Gerasimenko, nhưng aai cũng gọi"},
 {t:631.36,s:"tắt là sáu bảy P."},
 {t:632.87,s:"Nó trông như hai củ khoai tây dính vào"},
 {t:635.57,s:"nhau, dài chừng bốn cây số, đen như than."},
 {t:638.49,s:"Tàu Rosetta có một cái máy ngửi được hơi"},
 {t:641.36,s:"nước bốc ra từ bề mặt sao chổi, và đo được"},
 {t:644.37,s:"tỉ lệ deuteri trong đó."},
 {t:646.02,s:"Kết quả không khớp."},
 {t:647.48,s:"Nước của sáu bảy P giàu deuteri gấp khoảng"},
 {t:650.25,s:"ba lần nước biển Trái Đất."},
 {t:651.97,s:"Ba lần là rất nhiều với loại phép đo này."},
 {t:655.45,s:"Nếu đại dương của chúng ta được rót đầy"},
 {t:658,s:"bởi những sao chổi như thế, nó đã phải"},
 {t:660.49,s:"nặng hơn nhiều so với thực tế."},
 {t:662.45,s:"Ngọn nguồn aai cũng đinh ninh bỗng nhiên"},
 {t:664.98,s:"bị loại ra."},
 {t:667.18,s:"Tôi phải nói thẳng ở đây, vì đây là khoa"},
 {t:669.5,s:"học thật chứ không phải chuyện kể cho gọn."},
 {t:671.94,s:"Câu chuyện sao chổi chưa khép lại."},
 {t:674.43,s:"Những sao chổi khác đo ra những con số"},
 {t:676.72,s:"khác nhau, có cái gần nước biển hơn hẳn."},
 {t:679.13,s:"Cách đo hơi nước bốc ra từ một khối băng"},
 {t:681.72,s:"đang tan cũng khó, và các nhóm nghiên cứu"},
 {t:684.37,s:"vẫn đang cãi nhau về chuyện bụi mang băng"},
 {t:687.02,s:"bay lẫn trong hơi có làm lệch kết quả hay"},
 {t:689.67,s:"không."},
 {t:690.06,s:"Không aai có một câu trả lời sạch sẽ."},
 {t:692.2,s:"Nhưng bức tranh nghiêng dần về một hướng"},
 {t:694.83,s:"khác."},
 {t:695.16,s:"Có một loại thiên thạch tên là chondrite"},
 {t:697.84,s:"cacbon."},
 {t:698.31,s:"Chúng là những mảnh đá đen, xốp, vỡ ra từ"},
 {t:701.79,s:"các tiểu hành tinh, và bên trong đá đó có"},
 {t:705.28,s:"nước, khoá trong cấu trúc khoáng vật."},
 {t:708.42,s:"Người ta nhặt được chúng ở Nam Cực, ở sa"},
 {t:711.07,s:"mạc, đôi khi nhặt được ngay sau khi tận"},
 {t:713.65,s:"mắt thấy chúng rơi."},
 {t:714.91,s:"Và khi đo deuteri trong nước bị khoá trong"},
 {t:717.84,s:"những viên đá đó, con số ra gần với nước"},
 {t:720.63,s:"biển Trái Đất hơn nhiều."},
 {t:722.3,s:"Nghĩa là phần lớn nước có lẽ không tới đây"},
 {t:724.78,s:"trên những cái đuôi sáng rực mà ta hay vẽ"},
 {t:727.2,s:"trong sách."},
 {t:727.85,s:"Nó tới trên những tảng đá đen xấu xí, lặng"},
 {t:731.1,s:"lẽ, chẳng aai ngước lên nhìn."},
 {t:735.34,s:"Nhưng câu hỏi quan trọng nhất vẫn chưa"},
 {t:737.57,s:"được trả lời."},
 {t:738.33,s:"Và nó không phải là nước tới đây bằng"},
 {t:740.69,s:"phương tiện gì."},
 {t:741.65,s:"Câu hỏi là, cái đám nước đó, dù đi bằng"},
 {t:744.54,s:"sao chổi hay bằng đá, được ráp lại lúc"},
 {t:747.36,s:"nào?"},
 {t:747.66,s:"Trước khi Mặt Trời hình thành, hay sau đó?"},
 {t:750.83,s:"Bởi vì có một khả năng làm hỏng toàn bộ"},
 {t:753.11,s:"câu chuyện tôi vừa kể."},
 {t:754.39,s:"Khi một ngôi sao hình thành, đám mây lạnh"},
 {t:757.09,s:"sụp đổ vào chính nó."},
 {t:758.41,s:"Nhiệt độ vọt lên."},
 {t:759.98,s:"Một cái đĩa vật chất khổng lồ quay tròn"},
 {t:762.7,s:"quanh ngôi sao mới sinh, và ở vòng trong"},
 {t:765.5,s:"của cái đĩa đó, mọi thứ nóng đến mức bốc"},
 {t:768.29,s:"hơi hết."},
 {t:768.85,s:"Bức xạ cực tím xé toang các liên kết hoá"},
 {t:771.51,s:"học."},
 {t:771.78,s:"Phân tử nước bị đập ra thành nguyên tử"},
 {t:774.42,s:"rời, rồi ráp lại từ đầu trong điều kiện"},
 {t:777.13,s:"hoàn toàn mới."},
 {t:778.1,s:"Nếu chuyện đó xảy ra với tất cả, thì mọi"},
 {t:780.53,s:"phân tử nước trên Trái Đất đều trẻ hơn Mặt"},
 {t:783.09,s:"Trời."},
 {t:783.39,s:"Chúng sẽ là hàng mới, làm lại trong đĩa,"},
 {t:786.28,s:"và cái đám mây lạnh kia chỉ còn là một"},
 {t:789.02,s:"chương mở đầu không để lại dấu vết gì."},
 {t:793.26,s:"Năm hai nghìn mười bốn, một nhóm nghiên"},
 {t:795.63,s:"cứu ngồi xuống và hỏi ngược lại câu đó."},
 {t:798,s:"Được, cứ cho là nước bị phá hết và làm lại"},
 {t:801.42,s:"trong đĩa."},
 {t:802.24,s:"Vậy cái đĩa đó có làm nổi không?"},
 {t:804.97,s:"Bởi vì để ráp ra nước giàu deuteri như"},
 {t:807.58,s:"nước biển của chúng ta, cần một chuỗi phản"},
 {t:810.47,s:"ứng rất kén."},
 {t:811.29,s:"Nó cần lạnh, và nó cần một lượng ion nhất"},
 {t:814.44,s:"định để khởi động."},
 {t:815.83,s:"Không có đủ ion thì dây chuyền đó chạy"},
 {t:818.7,s:"chậm như rùa."},
 {t:819.68,s:"Họ dựng một mô hình đầy đủ về mức ion hoá"},
 {t:822.21,s:"trong đĩa tiền hành tinh."},
 {t:823.75,s:"Ngôi sao trẻ chắn bớt tia vũ trụ từ bên"},
 {t:826.78,s:"ngoài."},
 {t:827.25,s:"Các nguyên tố phóng xạ trong đĩa chỉ đóng"},
 {t:830.18,s:"góp một phần nhỏ."},
 {t:831.4,s:"Khi cộng hết lại, họ đếm ra mức ion quá"},
 {t:834.63,s:"thấp."},
 {t:835.04,s:"Cái đĩa không kịp làm ra đủ nước nặng"},
 {t:837.13,s:"trong quãng thời gian nó có."},
 {t:838.71,s:"Ngay cả khi cho nó chạy hết công suất"},
 {t:841.11,s:"trong cả triệu năm, nó vẫn không giải"},
 {t:843.51,s:"thích nổi lượng deuteri đang nằm trong đại"},
 {t:846.23,s:"dương."},
 {t:846.62,s:"Nghĩa là một phần nước ấy không được làm"},
 {t:849.38,s:"trong đĩa."},
 {t:850.07,s:"Nó đã có sẵn từ trước, và nó sống sót."},
 {t:855.54,s:"Con số họ đưa ra là khoảng từ ba mươi tới"},
 {t:858.4,s:"năm mươi phần trăm."},
 {t:859.72,s:"Từ một phần ba đến một nửa lượng nước trên"},
 {t:862.62,s:"Trái Đất được lắp ráp trong đám mây lạnh,"},
 {t:865.46,s:"trước khi Mặt Trời tồn tại, và chưa bao"},
 {t:868.15,s:"giờ bị tháo ra."},
 {t:869.19,s:"Những phân tử đó đi qua toàn bộ quá trình"},
 {t:871.94,s:"sinh ra một ngôi sao mà không bị phá."},
 {t:874.42,s:"Chúng nấp trong lớp băng bọc quanh các hạt"},
 {t:877.22,s:"bụi, ở vùng ngoài lạnh giá của đĩa, nơi"},
 {t:879.82,s:"nhiệt không với tới."},
 {t:881.15,s:"Rồi bụi dính vào nhau thành viên sỏi, sỏi"},
 {t:884.51,s:"thành đá, đá thành tiểu hành tinh."},
 {t:887.29,s:"Và rồi, hàng triệu năm sau, một trong"},
 {t:890.06,s:"những tảng đá đó rơi xuống một hành tinh"},
 {t:893.05,s:"nóng chảy còn chưa có tên."},
 {t:894.99,s:"Nước bên trong nó thoát ra thành hơi, bay"},
 {t:897.84,s:"lên thành khí quyển, nguội đi, và rơi"},
 {t:900.41,s:"xuống thành mưa."},
 {t:901.52,s:"Một cơn mưa kéo dài, người ta nghĩ là hàng"},
 {t:904.52,s:"nghìn năm không dứt."},
 {t:905.95,s:"Đó là lần đầu tiên nước đó rơi."},
 {t:908.04,s:"Nhưng nó đã già hơn cả ngôi sao đang chiếu"},
 {t:911.17,s:"sáng lên cơn mưa ấy."},
 {t:915.16,s:"Tôi quay về căn phòng của mình."},
 {t:916.88,s:"Cốc nước vẫn ở đó, trên bàn, và nó đã ấm"},
 {t:920.08,s:"lên một chút trong tay tôi."},
 {t:922.24,s:"Trong cốc này có khoảng tám triệu tỉ tỉ"},
 {t:924.77,s:"phân tử nước."},
 {t:925.61,s:"Tôi không dừng lại ở con số đó lâu, vì nó"},
 {t:928.36,s:"lớn đến mức vô nghĩa với cảm giác của con"},
 {t:931.12,s:"người."},
 {t:931.52,s:"Điều tôi dừng lại là chuyện này."},
 {t:933.25,s:"Trong số đó, có những phân tử chưa bao giờ"},
 {t:936.02,s:"bị tháo rời kể từ cái ngày chúng được ráp"},
 {t:938.73,s:"trên một hạt bụi trong bóng tối, cách đây"},
 {t:941.43,s:"hơn bốn tỉ sáu trăm triệu năm."},
 {t:943.41,s:"Tôi thử nghĩ xem chúng đã ở những đâu"},
 {t:945.96,s:"trong quãng thời gian đó."},
 {t:947.69,s:"Chúng đã nằm trong lòng một tiểu hành"},
 {t:949.72,s:"tinh."},
 {t:949.99,s:"Đã rơi xuống một hành tinh còn đang cháy."},
 {t:952.85,s:"Đã bốc lên thành mây, rơi xuống thành mưa,"},
 {t:956.52,s:"hàng tỉ lần."},
 {t:957.57,s:"Chúng đã ở trong một đại dương chưa có"},
 {t:959.6,s:"sinh vật nào."},
 {t:960.29,s:"Rồi ở trong tế bào đầu tiên biết tự nhân"},
 {t:963.34,s:"đôi."},
 {t:963.64,s:"Rồi trong máu của một con cá."},
 {t:966.15,s:"Trong nhựa của một cái cây."},
 {t:968.18,s:"Trong băng ở đỉnh một ngọn núi suốt mười"},
 {t:971.03,s:"nghìn năm, rồi tan ra và chảy đi tiếp."},
 {t:973.73,s:"Chúng đã đi qua cơ thể của những sinh vật"},
 {t:976.35,s:"mà không aai còn nhớ tên."},
 {t:977.94,s:"Và chúng vẫn nguyên như vậy."},
 {t:979.96,s:"Cùng một nguyên tử oxy."},
 {t:982,s:"Cùng hai nguyên tử hydro."},
 {t:983.91,s:"Cùng cái góc chữ V đó."},
 {t:988.15,s:"Tôi thấy có một điều rất kỳ ở nước, mà tôi"},
 {t:991.03,s:"chưa từng để ý trước đây."},
 {t:992.74,s:"Cơ thể tôi không giữ nước lại."},
 {t:994.51,s:"Nó chỉ cho nước mượn đường đi qua."},
 {t:996.99,s:"Phần lớn lượng nước trong người tôi được"},
 {t:999.14,s:"thay mới trong vòng vài tuần."},
 {t:1000.7,s:"Tôi không sở hữu nó."},
 {t:1002.41,s:"Tôi chỉ là một chặng."},
 {t:1004.27,s:"Cái cây ngoài kia cũng là một chặng."},
 {t:1006.46,s:"Đám mây là một chặng."},
 {t:1008.07,s:"Con sông là một chặng."},
 {t:1009.8,s:"Không aai giữ được nước, aai cũng chỉ mượn"},
 {t:1012.84,s:"nó một lúc rồi trả lại."},
 {t:1014.5,s:"Và trong cái vòng tuần hoàn đó, phân tử"},
 {t:1017.1,s:"nước là thứ duy nhất không đổi."},
 {t:1019.17,s:"Chúng ta thay nhau đến rồi đi."},
 {t:1021.12,s:"Chúng thì ở lại."},
 {t:1024.8,s:"Lần tới nếu bạn đứng dưới mưa, tôi muốn"},
 {t:1027.85,s:"bạn thử một chuyện."},
 {t:1029.33,s:"Đừng nghĩ về cơn mưa."},
 {t:1030.91,s:"Nghĩ về một giọt thôi."},
 {t:1032.58,s:"Một giọt đang chạm vào mu bàn tay bạn."},
 {t:1035.36,s:"Giọt đó vừa rơi từ một đám mây cách mặt"},
 {t:1038.21,s:"đất một cây số."},
 {t:1039.31,s:"Nhưng những phân tử trong nó thì vừa đi"},
 {t:1041.69,s:"một quãng đường dài hơn thế rất nhiều, và"},
 {t:1044.2,s:"bạn không nghe thấy gì cả."},
 {t:1045.79,s:"Nước không kể chuyện."},
 {t:1047.41,s:"Nó chỉ mang lịch sử theo trong cách nó"},
 {t:1049.91,s:"được ráp lại."},
 {t:1050.76,s:"Chúng hình thành trong cái lạnh, trong"},
 {t:1053.42,s:"bóng tối, trên một hạt bụi, ở một nơi chưa"},
 {t:1056.35,s:"có ngôi sao nào."},
 {t:1057.47,s:"Rồi Mặt Trời bật sáng."},
 {t:1059.28,s:"Rồi các hành tinh kết lại."},
 {t:1061.03,s:"Rồi đại dương đầy lên."},
 {t:1062.8,s:"Rồi sự sống bắt đầu."},
 {t:1064.62,s:"Rồi bốn tỉ năm trôi qua với tất cả những"},
 {t:1067.77,s:"gì xảy ra trong đó."},
 {t:1069.26,s:"Và bây giờ nó đang nằm trên mu bàn tay"},
 {t:1072.04,s:"bạn, và sắp trượt xuống."},
 {t:1075.8,s:"Tôi cầm cốc nước lên và uống một ngụm."},
 {t:1079.06,s:"Nó mát."},
 {t:1079.84,s:"Nó không có vị gì."},
 {t:1081.57,s:"Nó đi xuống và tôi gần như không cảm thấy."},
 {t:1084.45,s:"Một phần trong đó già hơn Mặt Trời."},
 {t:1086.83,s:"Và tôi vừa uống nó trong lúc đang nghĩ về"},
 {t:1089.76,s:"chuyện khác."}
];

/* --- CANVAS TEXT: chữ số / nhãn graph -----------------------------------
 * Chữ phải ĐỌC ĐƯỢC: nét dày, emissive 0.70–0.78, KHÔNG để bloom nhoè.
 * Vẽ lên canvas rồi dán lên plane basic (không nhận sáng) — giữ nét tuyệt đối. */
function textTex(txt, px, colr, wpx, hpx, align, weight){
  var cv=document.createElement('canvas');
  cv.width = wpx||1024; cv.height = hpx||256;
  var cx=cv.getContext('2d');
  cx.clearRect(0,0,cv.width,cv.height);
  cx.font=(weight||'700')+' '+(px||120)+'px "Segoe UI",Arial,sans-serif';
  cx.textBaseline='middle';
  cx.textAlign= align||'center';
  cx.fillStyle=colr||'#CDE6FF';
  var x = align==='left' ? 10 : (align==='right' ? cv.width-10 : cv.width/2);
  var lines = String(txt).split('\n');
  var lh = (px||120)*1.18;
  var y0 = cv.height/2 - lh*(lines.length-1)/2;
  for(var i=0;i<lines.length;i++) cx.fillText(lines[i], x, y0+i*lh);
  var tx=new THREE.CanvasTexture(cv);
  tx.encoding=THREE.sRGBEncoding; tx.minFilter=THREE.LinearFilter;
  tx.anisotropy=renderer.capabilities.getMaxAnisotropy();
  return tx;
}
/* plane mang chữ. scale theo chiều cao mong muốn (đơn vị world). */
function textPlane(txt, hWorld, px, colr, wpx, hpx, align){

   * camera thực tế (~26–32 world). Đo bằng snapshot: dưới hệ số này chữ
   * nhỏ hơn 18px trên khung 1080 và không đọc nổi. */
  hWorld = hWorld * 1.62;
  var tx=textTex(txt,px,colr,wpx,hpx,align);
  var w=(wpx||1024)/(hpx||256);
  var m=new THREE.MeshBasicMaterial({map:tx,transparent:true,depthWrite:false,
    opacity:0.76, blending:THREE.NormalBlending});
  var p=new THREE.Mesh(new THREE.PlaneGeometry(hWorld*w,hWorld),m);
  p.userData.baseOp=0.76;
  return p;
}

/* --- PHÂN TỬ H2O: góc HOH = 104.5° đúng chuẩn --------------------------
 * O bán kính gấp ~1.4 lần H. Liên kết là ỐNG SÁNG (trọng tâm hình ở S07).
 * Trả về group có userData.{o,h1,h2,b1,b2} để điều khiển riêng từng phần. */
var HOH = 104.5 * Math.PI/180;
function buildWater(scale, bondHex, hCol2){
  var g=new THREE.Group();
  var rO=1.0*scale, rH=0.71*scale, L=1.86*scale;
  var matO=new THREE.MeshStandardMaterial({color:0xE03A2A, roughness:0.42, metalness:0.05,
    emissive:0x2A0704, emissiveIntensity:0.30});
  var o=new THREE.Mesh(new THREE.SphereGeometry(rO,40,28),matO); g.add(o);
  var half=HOH/2;
  var dirs=[ new THREE.Vector3(Math.sin(half),Math.cos(half),0),
             new THREE.Vector3(-Math.sin(half),Math.cos(half),0) ];
  var hs=[],bs=[];
  for(var i=0;i<2;i++){
    var hc = (i===1 && hCol2) ? hCol2 : 0x9AA6B8;
    var mh=new THREE.MeshStandardMaterial({color:hc, roughness:0.52, metalness:0.02,
      emissive:hc, emissiveIntensity:0.12});
    var h=new THREE.Mesh(new THREE.SphereGeometry(rH,32,22),mh);
    h.position.copy(dirs[i]).multiplyScalar(L); g.add(h); hs.push(h);
    /* ống liên kết */
    /* ỐNG LIÊN KẾT — trọng tâm hình của tập (storyboard S07). Shader tự vẽ
     * lõi sáng + fresnel rìa để ống có KHỐI, không phải một dải phẳng. */
    var bm=new THREE.ShaderMaterial({transparent:true,depthWrite:false,
      blending:THREE.AdditiveBlending,
      uniforms:{uC:{value:new THREE.Color(bondHex||COL.iceCyan)},uK:{value:0.92}},
      vertexShader:'varying vec3 vN,vW;void main(){vN=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.0);vW=-normalize(mv.xyz);gl_Position=projectionMatrix*mv;}',
      fragmentShader:'varying vec3 vN,vW;uniform vec3 uC;uniform float uK;void main(){vec3 N=normalize(vN),V=normalize(vW);float nd=clamp(dot(N,V),0.0,1.0);float core=pow(nd,1.1);float fres=pow(1.0-nd,2.2);float a=core*0.72+fres*0.95;gl_FragColor=vec4(uC*a*uK*1.15, a*clamp(uK,0.0,1.0));}'});
    bm.__isBond=true;
    var b=new THREE.Mesh(new THREE.CylinderGeometry(0.20*scale,0.20*scale,L,16),bm);
    b.position.copy(dirs[i]).multiplyScalar(L*0.5);
    b.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dirs[i]);
    g.add(b); bs.push(b);
  }
  g.userData={o:o,h:hs,b:bs,matO:matO,scale:scale};
  return g;
}
/* đặt emissive cho ống liên kết (khoảnh khắc hình thành cần vượt 1.0) */
function setBond(g, val, hex){
  for(var i=0;i<g.userData.b.length;i++){
    var m=g.userData.b[i].material;
    if(m.uniforms && m.uniforms.uK){
      m.uniforms.uK.value = clamp(val,0,2);
      if(hex!=null) m.uniforms.uC.value.setHex(hex);
    } else {
      m.opacity = clamp(val,0,2);
      if(hex!=null) m.color.setHex(hex);
    }
  }
}
/* --- ĐIỀU KHIỂN ĐỘ MỜ THEO LỚP -----------------------------------------
 * Mỗi group cảnh đăng ký MỘT LẦN danh sách material + opacity gốc của nó
 * (mat.__base). Sau đó setGroupOp chỉ nhân — không đọc lại opacity hiện tại
 * (đọc lại sẽ trôi dần về 0 vì opacity đã bị nhân ở frame trước).
 * Material KHÔNG dùng chung giữa hai group: mỗi builder tự tạo material mới. */
function regOp(g){
  var list=[];
  g.traverse(function(o){
    if(o.material){
      var ms = Array.isArray(o.material)?o.material:[o.material];
      for(var i=0;i<ms.length;i++){
        if(ms[i].__base==null){ ms[i].__base = (ms[i].opacity==null?1:ms[i].opacity); ms[i].transparent=true; }
        list.push(ms[i]);
      }
    }
  });
  g.userData.__ops = list;
  return g;
}
function setGroupOp(g, op){
  g.visible = op>0.003;
  if(!g.visible) return;
  var L=g.userData.__ops; if(!L) return;
  for(var i=0;i<L.length;i++) L[i].opacity = L[i].__base*op;
}

    'float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);',

    /* chùm key từ trái trên: rơi sáng gần cốc, tối dần ra xa */
    ' vec2 d=uv-vec2(0.44,0.52); float key=exp(-dot(d,d)*7.0);',
    /* bóng đổ dài về TRÁI của cốc */
    ' vec2 sh=uv-vec2(0.30,0.50); sh.x*=0.34;',
    ' float shadow=1.0-0.78*exp(-dot(sh,sh)*22.0);',
    ' vec3 col=vec3(0.085,0.055,0.034)*(0.30+grain*0.9)*(0.22+key*1.55)*shadow;',
    ' col+=(h21(vU*1024.0)-0.5)/255.0;',
    ' gl_FragColor=vec4(col,uOp);}'
  ].join('\n')});
var table = new THREE.Mesh(new THREE.PlaneGeometry(120,80), tableMat);
table.rotation.x=-Math.PI/2; table.position.y=-4.05; gRoom.add(table);

/* hạt bụi lơ lửng bắt sáng trong chùm key — motif gieo cho chương 2 */
var roomDustN=220;
var rdPos=new Float32Array(roomDustN*3), rdPh=new Float32Array(roomDustN), rdS=new Float32Array(roomDustN);
for(var i=0;i<roomDustN;i++){
  rdPos[i*3]  =(rndDust()-0.5)*34;
  rdPos[i*3+1]=(rndDust())*16-3.0;
  rdPos[i*3+2]=(rndDust()-0.5)*22;
  rdPh[i]=rndDust()*6.2831; rdS[i]=0.6+rndDust()*1.6;
}
var roomDustG=new THREE.BufferGeometry();
roomDustG.setAttribute('position',new THREE.BufferAttribute(rdPos,3));
roomDustG.setAttribute('aPh',new THREE.BufferAttribute(rdPh,1));
roomDustG.setAttribute('aS',new THREE.BufferAttribute(rdS,1));
var roomDustMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,
  blending:THREE.AdditiveBlending,
  uniforms:{uT:{value:0},uOp:{value:1}},
  vertexShader:[
    'attribute float aPh,aS;uniform float uT;varying float vF;',
    'void main(){vec3 p=position;',
    /* trôi chậm theo hàm thuần của t, không tích luỹ */
    ' p.y+=sin(uT*0.11+aPh)*0.9+mod(uT*0.06+aPh,1.0)*0.5;',
    ' p.x+=cos(uT*0.08+aPh*1.7)*0.7;',
    /* càng gần chùm key (trái-trên) càng sáng */
    ' vF=exp(-pow(length(p.xy-vec2(-6.0,4.0))*0.10,2.0));',
    ' vec4 mv=modelViewMatrix*vec4(p,1.0);gl_PointSize=aS*(160.0/-mv.z);gl_Position=projectionMatrix*mv;}'
  ].join('\n'),
  fragmentShader:[
    'varying float vF;uniform float uOp;',
    'void main(){vec2 d=gl_PointCoord-0.5;float a=smoothstep(0.5,0.0,length(d));',
    ' gl_FragColor=vec4(vec3(1.00,0.72,0.40)*vF*1.1,a*vF*uOp*0.85);}'
  ].join('\n')});
var roomDust=new THREE.Points(roomDustG,roomDustMat); gRoom.add(roomDust);

/* dòng nước rót (S01) — trụ nước mảnh + bọt khí nhỏ nổi lên rồi vỡ */
var pourMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,
  uniforms:{uT:{value:0},uOp:{value:0}},
  vertexShader:'varying vec2 vU;void main(){vU=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:[
    'varying vec2 vU;uniform float uT,uOp;',
    'float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}',
    'void main(){float x=vU.x-0.5;',
    ' float wob=sin(vU.y*24.0-uT*9.0)*0.030+sin(vU.y*41.0-uT*13.0)*0.016;',
    ' float d=abs(x-wob);',
    ' float core=smoothstep(0.075,0.012,d);',
    ' float edge=smoothstep(0.10,0.05,d)*0.5;',
    ' vec3 col=vec3(1.00,0.74,0.42)*(core*0.85+edge*0.35);',
    ' col+=vec3(0.30,0.55,0.90)*core*0.20;',

  ].join('\n')});
var pour=new THREE.Mesh(new THREE.PlaneGeometry(2.4,9.0),pourMat);

/* bọt khí trong nước */
var bubN=70;

for(var i=0;i<bubN;i++){
  var a=rndMisc()*6.2831, rr=Math.sqrt(rndMisc())*2.4;
  bbPos[i*3]=Math.cos(a)*rr; bbPos[i*3+1]=0; bbPos[i*3+2]=Math.sin(a)*rr;
  bbPh[i]=rndMisc();
}
var bubG=new THREE.BufferGeometry();
bubG.setAttribute('position',new THREE.BufferAttribute(bbPos,3));
bubG.setAttribute('aPh',new THREE.BufferAttribute(bbPh,1));
var bubMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  uniforms:{uT:{value:0},uOp:{value:0}},
  vertexShader:[
    'attribute float aPh;uniform float uT;varying float vA;',
    'void main(){vec3 p=position;',
    ' float k=fract(uT*0.45+aPh);',

    ' vA=smoothstep(0.0,0.1,k)*smoothstep(1.0,0.86,k);',
    ' vec4 mv=modelViewMatrix*vec4(p,1.0);gl_PointSize=(1.4+aPh*2.2)*(70.0/-mv.z);gl_Position=projectionMatrix*mv;}'
  ].join('\n'),
  fragmentShader:'varying float vA;uniform float uOp;void main(){vec2 d=gl_PointCoord-0.5;float r=length(d);float a=smoothstep(0.5,0.30,r)*0.8+smoothstep(0.34,0.44,r)*smoothstep(0.5,0.44,r)*1.2;gl_FragColor=vec4(vec3(0.95,0.88,0.80)*a,a*vA*uOp*0.7);}'});
var bubbles=new THREE.Points(bubG,bubMat); gRoom.add(bubbles);

/* bàn tay (S02 rút đi, S82 cầm cốc lên) — khối tối tuyệt đối, chỉ silhouette */
var handMat=new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.0});
var hand=new THREE.Mesh(new THREE.SphereGeometry(4.6,24,16),handMat);
hand.scale.set(1.6,0.55,1.0); gRoom.add(hand);
regOp(gRoom);

/* --- S05: chuỗi lùi thời gian của nước (5 hình, whip-pan sang trái) ------
 * Không chữ, không nhãn. Ngả xanh lạnh, bão hoà thấp, như ký ức.
 * Mỗi hình là một shader thủ tục riêng chọn bằng uMode. */
var gFlow=new THREE.Group(); scene.add(gFlow); gFlow.visible=false;
var flowMat=new THREE.ShaderMaterial({transparent:true,
  uniforms:{uT:{value:0},uMode:{value:0},uMix:{value:0},uOp:{value:1},uPan:{value:0}},
  vertexShader:'varying vec2 vU;void main(){vU=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:[
    'varying vec2 vU;uniform float uT,uMode,uMix,uOp,uPan;',
    'float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}',
    'float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);',
    ' return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}',
    'float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*vn(p);p*=2.07;a*=.5;}return s;}',
    /* mỗi scene trả về luminance; dòng chảy luôn đi PHẢI→TRÁI */
    'float sceneVal(int m, vec2 uv, float tt){',
    ' if(m==0){ /* vòi nước: trụ dọc + tia rơi */',
    '   float d=abs(uv.x-0.56+sin(uv.y*20.0-tt*8.0)*0.012);',
    '   float jet=smoothstep(0.030,0.004,d)*step(uv.y,0.72);',
    '   float tap=smoothstep(0.06,0.0,length(uv-vec2(0.56,0.76))-0.05);',
    '   return jet*0.9+tap*0.5; }',
    ' if(m==1){ /* đường ống: các ống ngang song song, dòng sáng chạy sang trái */',
    '   float band=smoothstep(0.03,0.012,abs(fract(uv.y*5.0)-0.5)-0.16);',
    '   float flow=smoothstep(0.6,1.0,fbm(vec2(uv.x*4.0+tt*0.9,uv.y*9.0)));',
    '   return band*(0.28+flow*0.9); }',
    ' if(m==2){ /* nhà máy: các bể tròn nhìn từ trên, gợn sóng */',
    '   float s=0.0;',
    '   for(int k=0;k<3;k++){ float fk=float(k);',
    '     vec2 c=vec2(0.26+fk*0.24,0.44+sin(fk*2.1)*0.14);',
    '     float r=length(uv-c);',
    '     s+=smoothstep(0.155,0.14,r)*(0.35+0.4*sin(r*70.0-tt*4.0)); }',
    '   return clamp(s,0.0,1.4); }',
    ' if(m==3){ /* dòng sông: dải uốn chảy sang trái */',
    '   float cy=0.5+sin(uv.x*4.4+1.1)*0.16+sin(uv.x*9.0)*0.05;',
    '   float riv=smoothstep(0.13,0.02,abs(uv.y-cy));',
    '   float cur=fbm(vec2(uv.x*7.0+tt*1.3,uv.y*14.0));',
    '   return riv*(0.32+cur*0.85); }',
    ' if(m==4){ /* đám mây + mưa */',
    '   float cl=fbm(vec2(uv.x*3.2+tt*0.25,uv.y*4.6))*smoothstep(0.34,0.62,uv.y);',
    '   float rainx=fract(uv.x*90.0+floor(uv.y*3.0)*0.37);',
    '   float rn=step(0.93,h21(vec2(floor(uv.x*90.0),floor(tt*2.0))));',
    '   float rain=rn*smoothstep(0.5,0.0,abs(rainx-0.5))*smoothstep(0.62,0.1,uv.y)*0.5;',
    '   return cl*1.1+rain; }',
    ' /* m==5: đại dương bốc hơi dưới nắng */',
    ' float sea=smoothstep(0.52,0.48,uv.y)*(0.20+0.55*fbm(vec2(uv.x*6.0+tt*0.7,uv.y*20.0)));',
    ' float glint=pow(clamp(fbm(vec2(uv.x*24.0+tt*1.6,uv.y*40.0)),0.0,1.0),5.0)*step(uv.y,0.52)*2.2;',
    ' float vap=smoothstep(0.48,0.9,uv.y)*fbm(vec2(uv.x*3.0-tt*0.4,uv.y*3.0-tt*0.5))*0.55;',
    ' return sea+glint+vap;',
    '}',
    'void main(){',
    ' vec2 uv=vU; uv.x+=uPan;',
    ' int m0=int(uMode); int m1=m0+1;',
    ' float a=sceneVal(m0,uv,uT), b=sceneVal(m1,uv,uT);',
    ' float v=mix(a,b,uMix);',
    /* ngả xanh lạnh, bão hoà thấp — như ký ức */
    ' vec3 col=mix(vec3(0.020,0.045,0.075), vec3(0.16,0.44,0.78), clamp(v,0.0,1.0));',
    ' col+=vec3(0.06,0.22,0.40)*clamp(v-1.0,0.0,1.0);',
    /* vignette + dither */
    ' vec2 q=vU-0.5; col*=1.0-dot(q,q)*1.05;',
    ' col+=(h21(vU*1024.0+uT)-0.5)/255.0;',
    ' gl_FragColor=vec4(col,uOp);}'
  ].join('\n')});
var flowQuad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),flowMat);
gFlow.add(flowQuad);
regOp(gFlow);

/* --- S06 / S72 / S84: phân tử H2O đơn lẻ trên nền đen -------------------

var gMol=new THREE.Group(); scene.add(gMol); gMol.visible=false;

/* đèn riêng cho phân tử — phân tử cần hình khối, không phải bóng phẳng */

/* --- S07: CÚ LẬT LIÊN KẾT (split-screen mềm) -----------------------------
 * Trái: 3 quả cầu ROCK_GREY RỜI trôi phân kỳ, KHÔNG ống liên kết, bị
 * desaturate + hạ exposure về 0.15. Phải: cùng 3 quả cầu nhưng hai ỐNG
 * LIÊN KẾT bật sáng emissive 1.4 — trọng tâm là ỐNG, hạt tối đi. */
var gFlip=new THREE.Group(); scene.add(gFlip); gFlip.visible=false;
/* nửa trái: 3 hạt xám rời */
var flipL=new THREE.Group(); flipL.position.x=-9.5; gFlip.add(flipL);
var loose=[];
for(var i=0;i<3;i++){
  var rr=(i===0)?1.0:0.71;
  var m=new THREE.MeshStandardMaterial({color:COL.rockGrey,roughness:0.88,metalness:0.0,
    emissive:0x0A0A0A,emissiveIntensity:0.3,transparent:true});
  var s=new THREE.Mesh(new THREE.SphereGeometry(rr,30,20),m);
  flipL.add(s); loose.push(s);
}
/* gạch bỏ nửa trái: một nét chéo mảnh ROCK_GREY sáng (không đỏ chói) */
var strikeL=new THREE.Mesh(new THREE.PlaneGeometry(9.0,0.16),
  new THREE.MeshBasicMaterial({color:0x8A8886,transparent:true,opacity:0.0,depthWrite:false}));
strikeL.rotation.z=-0.42; flipL.add(strikeL);
/* nửa phải: cùng 3 hạt nhưng ĐƯỢC LIÊN KẾT */
var flipR=new THREE.Group(); flipR.position.x=9.5; gFlip.add(flipR);
var flipMol=buildWater(1.0, COL.iceCyan);
/* ống dày lên: trọng tâm hình */
for(var i=0;i<2;i++) flipMol.userData.b[i].scale.set(1.75,1.0,1.75);
/* hạt tối đi so với bình thường */
flipMol.userData.matO.color.setHex(0x6B2018); flipMol.userData.matO.emissiveIntensity=0.18;
for(var i=0;i<2;i++){ flipMol.userData.h[i].material.color.setHex(0x7A8290);
  flipMol.userData.h[i].material.emissiveIntensity=0.12; }
flipR.add(flipMol);
var flipKey=new THREE.PointLight(0xFFD2B0,4.4,80); flipKey.position.set(4,7,9); gFlip.add(flipKey);
var flipRim=new THREE.PointLight(0x148CFF,2.9,80); flipRim.position.set(-5,-4,-7); gFlip.add(flipRim);
regOp(gFlip);

/* --- S08: phân tử nhỏ lại thành đốm sáng, trôi qua 3 lớp nền parallax ----
 * Nền đổi (ngôi sao trẻ → hành tinh → silhouette người), nó KHÔNG đổi. */
var gTravel=new THREE.Group(); scene.add(gTravel); gTravel.visible=false;
var travelBg=new THREE.Mesh(new THREE.PlaneGeometry(2,2), new THREE.ShaderMaterial({
  transparent:true,
  uniforms:{uT:{value:0},uK:{value:0},uOp:{value:1}},
  vertexShader:'varying vec2 vU;void main(){vU=uv;gl_Position=vec4(position.xy,0.999,1.0);}',
  fragmentShader:[
    'varying vec2 vU;uniform float uT,uK,uOp;',
    'float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}',
    'float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);',
    ' return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}',
    'float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*vn(p);p*=2.1;a*=.5;}return s;}',
    'void main(){',
    ' vec2 uv=vU; vec2 q=(vU-0.5)*vec2(1.777,1.0);',
    /* lớp 1: sao xa — chạy CHẬM NHẤT (parallax) */
    ' vec2 s1=q+vec2(uK*0.10,0.0); vec2 si=floor(s1*26.0);',
    ' float sr=h21(si); float star=0.0;',
    ' if(sr>0.86){ vec2 sf=fract(s1*26.0)-0.5; star=smoothstep(0.14,0.0,length(sf))*(0.3+sr*0.7); }',
    ' vec3 col=vec3(0.76,0.84,1.00)*star*0.7;',
    /* ngôi sao trẻ: hiện ở giai đoạn 1 */
    ' float g1=smoothstep(0.02,0.22,uK)*smoothstep(0.42,0.26,uK);',
    ' vec2 sc=q+vec2(uK*0.9-0.28,0.06);',
    ' float sd=length(sc);',
    ' col+=vec3(1.00,0.72,0.42)*g1*(exp(-sd*11.0)*1.6+exp(-sd*3.0)*0.14);',
    /* hành tinh: giai đoạn 2 */
    ' float g2=smoothstep(0.30,0.48,uK)*smoothstep(0.72,0.56,uK);',
    ' vec2 pc=q+vec2(uK*1.5-0.62,-0.02);',
    ' float pd=length(pc);',
    ' float disk=smoothstep(0.26,0.245,pd);',
    ' float lit=clamp(dot(normalize(vec3(pc/0.26,sqrt(max(0.0,1.0-dot(pc/0.26,pc/0.26))))),normalize(vec3(-0.7,0.35,0.6))),0.0,1.0);',
    ' col+=vec3(0.06,0.34,0.44)*disk*g2*(0.06+lit*0.95);',
    /* silhouette người: giai đoạn 3 — mảng ĐEN TUYỆT ĐỐI cắt vào nền */
    ' float g3=smoothstep(0.62,0.80,uK);',
    ' vec2 hc=q+vec2(uK*2.1-1.28,0.34);',
    ' float head=smoothstep(0.20,0.19,length(hc*vec2(1.0,0.86)));',
    ' float neck=smoothstep(0.13,0.12,length((hc-vec2(0.0,0.30))*vec2(1.0,0.42)));',
    ' float body=smoothstep(0.42,0.40,length((hc-vec2(0.0,0.72))*vec2(0.62,0.70)));',
    ' float sil=clamp(head+neck+body,0.0,1.0)*g3;',
    ' col*= (1.0-sil);',
    /* nền rất tối có cấu trúc để không bẹt */
    ' col+=vec3(0.010,0.016,0.030)*(0.4+fbm(q*3.0+vec2(uK*0.4,0.0))*0.9)*(1.0-sil);',
    ' col+=(h21(vU*1024.0+uT)-0.5)/255.0;',
    ' gl_FragColor=vec4(col,uOp);}'
  ].join('\n')}));
gTravel.add(travelBg);
var travelDot=dot(COL.iceCyan, 1.5, 1.0); gTravel.add(travelDot);
regOp(gTravel);

/* --- S09: đốm sáng đơn độc giữa đen tuyền rồi tắt ------------------------
 * Điểm nghỉ thị giác duy nhất của nửa đầu tập. ĐỪNG thêm gì.
 * Đây là 1 trong 2 shot được phép KHÔNG có điểm neo (cùng S84). */

var loneDot=dot(COL.iceCyan, 2.4, 1.0); gLone.add(loneDot);

/* ==========================================================================
 * CHƯƠNG 2 — CÁI XƯỞNG LẠNH (S10–S32 · C16–C41)
 * Xương sống của tập. TỐI NHẤT. Quy ước bắt buộc (GHI CHÚ mục 5):
 *   ĐÁM MÂY PHÂN TỬ KHÔNG CÓ TÂM SÁNG. Chiếu sáng duy nhất là ánh sao nền ở
 *   rìa ngoài tán xạ vào → độ sáng GIẢM khi camera đi sâu vào trong.

/* --- starfield nền (dùng cho S10, S12, S21, và nền không gian sâu) -------
 * Sao nhỏ 1–2px, KHÔNG bloom (emissive 0.60–0.80, dưới ngưỡng 1.0).
 * Bán kính phải lớn hơn camera xa nhất — camera tập này không vượt 260. */
var stars = HFA.buildStars({ radius:9000, count:3000, seed:77310, maxCamDist:300 });
scene.add(stars); stars.visible=false;

/* --- ĐÁM MÂY PHÂN TỬ (S10, S11, S13, S16, S17, S18 nền) -----------------
 * Volume raymarch FBM 4 octave. Ánh sáng đến TỪ RÌA NGOÀI: độ sáng tỉ lệ
 * nghịch với độ sâu quang học tích luỹ từ ngoài vào (extinction).
 * uDepth = camera đã đi sâu bao nhiêu (0 ở ngoài, 1 ở tâm) → giảm sáng.
 * Dither 1/255 bắt buộc: dải luminance 0.02–0.10 không có dither sẽ banding. */
var cloudMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false,
  uniforms:{
    uT:{value:0}, uOp:{value:1}, uDepth:{value:0}, uDens:{value:1.0},
    uStarBack:{value:1.0}, uZoom:{value:1.0}, uOff:{value:new THREE.Vector2(0,0)},
    uRise:{value:0.0}

    ].join('\n'),

/* ==========================================================================
 * HẠT BỤI SILICAT — nhân vật chính của chương 2 (S19–S28, S30, S79)
 * Hình BẤT ĐỊNH (không phải cầu), bề mặt gồ ghề nhiều hốc. Albedo thấp:
 * chỉ đọc được nhờ RIM LIGHT LẠNH rất yếu từ phía sau.
 * ========================================================================== */
function makeGrain(seed, detail){
  var geo=new THREE.IcosahedronGeometry(3.0, detail||4);
  var pos=geo.attributes.position;
  var pr=HFA.mulberry32(seed);
  /* 7 "khối u" ngẫu nhiên + noise mịn → hình bất định, nhiều hốc lõm */
  var lobes=[];
  for(var i=0;i<7;i++){
    lobes.push({v:new THREE.Vector3(pr()*2-1,pr()*2-1,pr()*2-1).normalize(),
                a:0.22+pr()*0.42, w:1.2+pr()*2.4});
  }
  var craters=[];
  for(var i=0;i<9;i++){
    craters.push({v:new THREE.Vector3(pr()*2-1,pr()*2-1,pr()*2-1).normalize(),
                  a:0.10+pr()*0.26, w:5.0+pr()*8.0});
  }
  var v=new THREE.Vector3();
  for(var i=0;i<pos.count;i++){
    v.fromBufferAttribute(pos,i).normalize();
    var r=3.0;
    for(var k=0;k<lobes.length;k++){
      var d=v.dot(lobes[k].v);
      r += lobes[k].a*Math.pow(Math.max(0,d),lobes[k].w);
    }
    /* hốc lõm */
    for(var k=0;k<craters.length;k++){
      var d=v.dot(craters[k].v);
      r -= craters[k].a*Math.pow(Math.max(0,d),craters[k].w);
    }
    /* nhám mịn */
    r += (Math.sin(v.x*17.3+v.y*9.1)*Math.cos(v.z*13.7-v.x*5.3))*0.055;
    r += (Math.sin(v.x*41.0)*Math.sin(v.y*37.0)*Math.sin(v.z*43.0))*0.025;
    pos.setXYZ(i, v.x*r, v.y*r, v.z*r);
  }
  geo.computeVertexNormals();
  return geo;
}

/* quỹ đạo hopping của H: chuỗi bước NHẢY ngắn (không trượt mượt), seeded.
 * Mỗi bước là một nhảy sang hốc kề bên. Nhịp THƯA DẦN và NGẮN LẠI khi tới
 * gần O — cái lạnh không cho phép tăng tốc. */
var HOPS=[];
(function(){
  var lon=-0.62, lat=0.30;       /* toạ độ góc trên mặt cầu, bắt đầu xa O */
  for(var i=0;i<40;i++){
    HOPS.push({lon:lon, lat:lat});
    var f=1-i/39;
    lon += (0.050 + rndHop()*0.030)*f + 0.010;
    lat += (rndHop()-0.5)*0.055*f;
  }
  /* điểm cuối phải trùng vị trí O */
  HOPS.push({lon:0.0, lat:0.0});
})();
function sphPos(lon, lat, rad){
  var cl=Math.cos(lat);
  return new THREE.Vector3(Math.sin(lon)*cl, Math.cos(lon)*cl, Math.sin(lat)).multiplyScalar(rad);
}
/* vị trí H tại tiến độ k ∈ [0,1] — bước nhảy RỜI RẠC, không nội suy mượt */
var _tmpV=new THREE.Vector3(), _tmpV2=new THREE.Vector3();
function hopAt(k, rad){
  k=clamp(k,0,1);
  var n=HOPS.length-1;
  var fk=k*n, i=Math.floor(fk), fr=fk-i;
  if(i>=n){ i=n-1; fr=1; }
  var a=HOPS[i], b=HOPS[i+1];
  /* nhảy: đứng yên 70% thời gian, chuyển trong 30% cuối (cung nhỏ nảy lên) */
  var j=smooth(clamp((fr-0.62)/0.38,0,1));
  var lon=lerp(a.lon,b.lon,j), lat=lerp(a.lat,b.lat,j);
  var hop=Math.sin(j*Math.PI)*0.26;   /* nảy lên khỏi bề mặt khi di chuyển */
  return sphPos(lon,lat,rad+hop);
}

      ' vec4 mv=modelViewMatrix*instanceMatrix*vec4(position,1.0);vW=-normalize(mv.xyz);',
      ' gl_Position=projectionMatrix*mv;}'
    ].join('\n'),
    fragmentShader:[
      'varying vec3 vN,vW;uniform float uOp,uT;',
      'void main(){vec3 N=normalize(vN),V=normalize(vW);',
      /* phần lớn hạt chỉ là silhouette hơi sáng hơn nền — KHÔNG thêm đèn */
      ' float kd=clamp(dot(N,normalize(vec3(-0.4,0.6,0.55))),0.0,1.0);',
      ' vec3 col=vec3(0.028,0.038,0.052)*(0.25+kd*0.9);',
      /* rim lạnh CỰC YẾU là ánh sáng duy nhất */
      ' float rim=pow(1.0-clamp(dot(N,V),0.0,1.0),3.0);',
      ' col+=vec3(0.08,0.55,1.00)*rim*0.115;',
      ' gl_FragColor=vec4(col,uOp);}'
    ].join('\n')});
  var N=900;
  var im=new THREE.InstancedMesh(geo, mat, N);
  var pr=HFA.mulberry32(553311);
  var d=new THREE.Object3D();
  var axes=[];
  for(var i=0;i<N;i++){
    var a=pr()*6.2831, b=Math.acos(2*pr()-1), rr=18+Math.pow(pr(),0.45)*175;
    d.position.set(Math.sin(b)*Math.cos(a)*rr, Math.cos(b)*rr*0.55, Math.sin(b)*Math.sin(a)*rr);
    d.rotation.set(pr()*6.28,pr()*6.28,pr()*6.28);
    var s=(0.10+pr()*0.30);
    d.scale.setScalar(s);
    d.updateMatrix();
    im.setMatrixAt(i,d.matrix);
    axes.push({p:d.position.clone(), r:d.rotation.clone(), s:s, sp:(pr()-0.5)*0.10});
  }
  im.instanceMatrix.needsUpdate=true;
  gField.add(im);
  gField.userData={im:im, axes:axes, dummy:new THREE.Object3D(), mat:mat};
})();
regOp(gField);

/* --- S29: hai cái lò của vũ trụ (lõi sao + siêu tân tinh) ---------------

  fragmentShader:[
    'varying vec2 vU;uniform float uT,uOp,uMode,uK;',
    'float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}',
    'float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);',
    ' return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}',
    'float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*vn(p);p*=2.07;a*=.5;}return s;}',
    'void main(){vec2 q=(vU-0.5)*vec2(1.777,1.0); float r=length(q);',
    ' vec3 col=vec3(0.0);',
    ' if(uMode<0.5){',
    /* LÒ SAO: lõi đối lưu DISK_HOT — giới hạn bán kính để <10% khung */
    '  float conv=fbm(q*7.0+vec2(uT*0.5,-uT*0.4))*0.7+fbm(q*17.0-vec2(uT*0.8,uT*0.6))*0.3;',

    '  float sh=uK*0.52;',
    '  float ring=exp(-pow((r-sh)*11.0,2.0));',
    '  float fil=fbm(normalize(q+1e-5).xy*9.0+vec2(uT*0.3))*0.7+0.3;',

    ' }',
    ' vec2 vq=vU-0.5; col*=1.0-dot(vq,vq)*1.10;',
    ' col+=(h21(vU*1024.0+fract(uT))-0.5)/255.0;',

  ].join('\n')});

/* --- S33/S34: sơ đồ hydro thường vs deuteri ------------------------------

 * Đám mây electron hai bên VẼ GIỐNG HỆT NHAU — "hành xử hoá học y hệt". */
var gIso=new THREE.Group(); scene.add(gIso); gIso.visible=false;
function eCloud(){
  var m=new THREE.ShaderMaterial({transparent:true,depthWrite:false,
    blending:THREE.AdditiveBlending, side:THREE.DoubleSide,
    uniforms:{uT:{value:0},uOp:{value:1}},
    vertexShader:'varying vec3 vP,vN,vW;void main(){vP=position;vN=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.0);vW=-normalize(mv.xyz);gl_Position=projectionMatrix*mv;}',
    fragmentShader:[
      'varying vec3 vP,vN,vW;uniform float uT,uOp;',
      'float h31(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453);}',
      'void main(){vec3 N=normalize(vN),V=normalize(vW);',
      /* vỏ mờ: đậm ở rìa (tích phân quang học qua vỏ cầu), rỗng ở giữa */
      ' float nd=abs(dot(N,V));',
      ' float shell=pow(1.0-nd,1.5)*0.9+0.06;',
      /* lốm đốm xác suất, chuyển động rất chậm */
      ' float grainy=h31(floor(vP*9.0+vec3(sin(uT*0.2)*2.0)));',
      ' shell*=0.55+grainy*0.85;',
      ' vec3 col=vec3(0.22,0.50,1.00)*shell*0.34;',
      ' gl_FragColor=vec4(col, shell*uOp*0.42);}'
    ].join('\n')});
  return new THREE.Mesh(new THREE.SphereGeometry(3.1,40,28), m);
}

var gCham=new THREE.Group(); scene.add(gCham); gCham.visible=false;
function chamber(x, seed, label, tempLab){
  var g=new THREE.Group(); g.position.x=x; gCham.add(g);
  var box=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(9,8,6)),
    new THREE.LineBasicMaterial({color:0x8FC2E8,transparent:true,opacity:0.60}));
  g.add(box);
  var pr=HFA.mulberry32(seed), n=170;
  var pos=new Float32Array(n*3), ph=new Float32Array(n), kind=new Float32Array(n), sd=new Float32Array(n*3);
  for(var i=0;i<n;i++){
    pos[i*3]=(pr()-0.5)*8.2; pos[i*3+1]=(pr()-0.5)*7.2; pos[i*3+2]=(pr()-0.5)*5.2;
    ph[i]=pr()*6.2831; kind[i]= pr()<0.16 ? 1.0 : 0.0;   /* 1 = deuteri */
    sd[i*3]=pr()*2-1; sd[i*3+1]=pr()*2-1; sd[i*3+2]=pr()*2-1;
  }
  var bg=new THREE.BufferGeometry();
  bg.setAttribute('position',new THREE.BufferAttribute(pos,3));
  bg.setAttribute('aPh',new THREE.BufferAttribute(ph,1));
  bg.setAttribute('aK',new THREE.BufferAttribute(kind,1));
  bg.setAttribute('aD',new THREE.BufferAttribute(sd,3));
  var m=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    uniforms:{uT:{value:0},uOp:{value:1},uSpd:{value:1.0},uSettle:{value:0.0}},
    vertexShader:[
      'attribute float aPh,aK;attribute vec3 aD;uniform float uT,uSpd,uSettle;varying float vK;',
      'void main(){vK=aK;',
      /* Brown seeded — biên độ tỉ lệ nhiệt độ */
      ' vec3 j=vec3(sin(uT*uSpd*2.2+aPh)*aD.x,cos(uT*uSpd*1.9+aPh*1.4)*aD.y,sin(uT*uSpd*2.6+aPh*0.8)*aD.z)*1.5;',
      /* buồng lạnh: D lắng xuống đáy (bị GIỮ LẠI), H bị đẩy lên/ra */
      ' vec3 p=position+j;',
      ' p.y=mix(p.y, mix(3.2, -3.0, aK), uSettle*(0.4+aK*0.6));',
      ' vec4 mv=modelViewMatrix*vec4(p,1.0);gl_PointSize=(aK>0.5?2.9:1.9)*(200.0/-mv.z);',
      ' gl_Position=projectionMatrix*mv;}'
    ].join('\n'),
    fragmentShader:[
      'varying float vK;uniform float uOp;',
      'void main(){vec2 d=gl_PointCoord-0.5;float a=smoothstep(0.5,0.0,length(d));',
      ' vec3 c = vK>0.5 ? vec3(1.00,0.06,0.42) : vec3(0.72,0.80,0.95);',
      ' gl_FragColor=vec4(c*a*(vK>0.5?1.5:0.85), a*uOp*(vK>0.5?0.95:0.6));}'
    ].join('\n')});
  g.add(new THREE.Points(bg,m));
  var lb=textPlane(label,0.58,64,'#BFD9F2',900,150); lb.position.set(0,-5.9,0); g.add(lb);
  var tl=textPlane(tempLab,0.50,56,'#8FB6DC',700,140); tl.position.set(0,-7.3,0); g.add(tl);
  /* chỉ số D/H của buồng */
  var idx=textPlane('D/H —',0.56,62,'#FFB0CE',900,150); idx.position.set(0,5.2,0); g.add(idx);
  g.userData={mat:m, idx:idx, idxPos:new THREE.Vector3(x,5.2,0)};
  return g;
}

function makeLiveNumber(colr){

function setLiveNumber(p, txt, px){

  u.cx.font='700 '+(px||96)+'px "Segoe UI",Arial,sans-serif';

  u.cx.fillStyle=u.colr;
  u.cx.fillText(txt, u.cv.width/2, u.cv.height/2);

}

function iceBlock(seed, hex){
  var geo=makeGrain(seed,5);
  var m=new THREE.ShaderMaterial({transparent:true,
    uniforms:{uOp:{value:1},uC:{value:new THREE.Color(hex)},uT:{value:0}},
    vertexShader:'varying vec3 vN,vW,vP;void main(){vN=normalize(normalMatrix*normal);vP=position;vec4 mv=modelViewMatrix*vec4(position,1.0);vW=-normalize(mv.xyz);gl_Position=projectionMatrix*mv;}',
    fragmentShader:[
      'varying vec3 vN,vW,vP;uniform float uOp,uT;uniform vec3 uC;',
      'float h31(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453);}',
      'void main(){vec3 N=normalize(vN),V=normalize(vW);',
      /* bump thủ tục: phá mặt phẳng của lưới đa diện */
      ' float e=0.05;',
      ' float b0=h31(floor(vP*7.0)), bx=h31(floor((vP+vec3(e,0,0))*7.0)), by=h31(floor((vP+vec3(0,e,0))*7.0)), bz=h31(floor((vP+vec3(0,0,e))*7.0));',
      ' N=normalize(N + vec3(bx-b0,by-b0,bz-b0)*0.55);',
      ' float nd=clamp(dot(N,V),0.0,1.0);',
      /* băng TRONG MỜ: tán xạ dưới bề mặt + fresnel rìa */
      ' float sss=pow(1.0-nd,1.7);',
      ' float kd=clamp(dot(N,normalize(vec3(-0.5,0.7,0.6))),0.0,1.0);',
      ' vec3 col=uC*(0.10+kd*0.42)+uC*sss*0.85;',
      ' col+=vec3(0.08,0.55,1.00)*pow(1.0-nd,3.4)*0.11;',
      ' col+=(h31(vP*211.0+uT)-0.5)/255.0;',
      ' gl_FragColor=vec4(col,uOp*(0.55+sss*0.5));}'
    ].join('\n')});
  return new THREE.Mesh(geo,m);
}

function lobeGeo(seed, rad, squash){
  var geo=new THREE.IcosahedronGeometry(rad, 4);
  var pos=geo.attributes.position, pr=HFA.mulberry32(seed), v=new THREE.Vector3();
  var craters=[];
  for(var i=0;i<14;i++) craters.push({v:new THREE.Vector3(pr()*2-1,pr()*2-1,pr()*2-1).normalize(),
    a:(0.06+pr()*0.20)*rad, w:6.0+pr()*16.0});
  var lobes=[];
  for(var i=0;i<5;i++) lobes.push({v:new THREE.Vector3(pr()*2-1,pr()*2-1,pr()*2-1).normalize(),
    a:(0.05+pr()*0.16)*rad, w:1.5+pr()*2.5});
  for(var i=0;i<pos.count;i++){
    v.fromBufferAttribute(pos,i).normalize();
    var r=rad;
    for(var k=0;k<lobes.length;k++) r+=lobes[k].a*Math.pow(Math.max(0,v.dot(lobes[k].v)),lobes[k].w);
    for(var k=0;k<craters.length;k++) r-=craters[k].a*Math.pow(Math.max(0,v.dot(craters[k].v)),craters[k].w);
    r+=(Math.sin(v.x*23.0+v.y*11.0)*Math.cos(v.z*17.0))*rad*0.022;
    pos.setXYZ(i, v.x*r, v.y*r*(squash||1.0), v.z*r);
  }
  geo.computeVertexNormals();
  return geo;
}

/* JET hơi nước từ vùng CỔ — mảnh, thẳng, mờ dần theo khoảng cách */
function makeJet(hex, origin, dir, len, wid, seed){
  var m=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    side:THREE.DoubleSide,
    uniforms:{uT:{value:0},uOp:{value:0},uC:{value:new THREE.Color(hex)},uSeed:{value:seed||1.0}},
    vertexShader:'varying vec2 vU;void main(){vU=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:[
      'varying vec2 vU;uniform float uT,uOp,uSeed;uniform vec3 uC;',
      'float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}',
      'float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);',
      ' return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}',
      'void main(){',
      ' float y=vU.y;',   /* 0 = gốc jet, 1 = xa */
      /* mở rộng nhẹ theo khoảng cách + mờ dần */
      ' float halfw=0.10+y*0.30;',
      ' float d=abs(vU.x-0.5)/halfw;',
      ' if(d>1.0) discard;',
      ' float prof=pow(1.0-d,1.6);',
      ' float turb=vn(vec2(vU.x*7.0+uSeed, y*9.0-uT*1.4))*0.55+0.55;',
      ' float fade=exp(-y*2.1);',
      ' vec3 col=uC*prof*turb*fade*1.5;',
      ' gl_FragColor=vec4(col, prof*turb*fade*uOp*0.65);}'
    ].join('\n')});
  var p=new THREE.Mesh(new THREE.PlaneGeometry(wid,len),m);
  /* gốc jet đặt tại origin, hướng theo dir */
  p.position.copy(origin).add(dir.clone().multiplyScalar(len*0.5));
  p.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
  p.userData.mat=m;
  return p;
}

    'float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*vn(p);p*=2.08;a*=.5;}return s;}',

 *   • PHÂN TẦNG NHIỆT rõ: trong DISK_HOT → giữa DUST_WARM → ngoài ICE_CYAN
 *   • FLARING: mỏng ở rìa, phồng ở vùng trong
 *   • quay VI PHÂN KEPLER: vòng trong nhanh hơn vòng ngoài RÕ RỆT
 *   • vùng nóng giới hạn dưới 12% khung; ngoài đĩa + nền ≥70% ở luminance <0.3

var gDisk=new THREE.Group(); scene.add(gDisk); gDisk.visible=false;
