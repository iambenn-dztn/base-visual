/* ==========================================================================
 * renderAtTime(t) — HÀM THUẦN. Mọi chuyển động là hàm đóng của t.
 * Không tích luỹ, không đồng hồ hệ thống.
 * ========================================================================== */
function renderAtTime(t){
  /* --- reset: tắt hết, bật lại theo shot --- */
  for(var i=0;i<ALL_GROUPS.length;i++) ALL_GROUPS[i].visible=false;
  stars.visible=false; gasPts.visible=false;
  ambL.intensity=0.0; keyL.intensity=0.0; rimL.intensity=0.0; fillL.intensity=0.0;
  camera.fov=44; camera.up.set(0,1,0);

  var vigCss=1.0, vigLens=0.34, grain=0.040, ca=0.0015, flash=0.0, expo=1.06;

  /* =====================================================================
   * CHƯƠNG 1 — S01–S09
   * ===================================================================== */
  /* --- S01–S04 + S68/S82/S83: CĂN PHÒNG (một sân khấu dùng lại 3 lần) --- */
  var wRoom = Math.max(WR(t,'S01','S04',0.5), WR(t,'S68','S68',0.5),
                       WR(t,'S82','S83',0.5));
  if(wRoom>0.003){
    setGroupOp(gRoom, wRoom);
    ambL.intensity=0.30; keyL.intensity=1.15; rimL.intensity=0.16;
    keyL.position.set(-9,6,7);
    var rt = inSc(t,'S01')?ts(t,'S01'): inSc(t,'S02')?ts(t,'S02')+2.15
            : inSc(t,'S03')?ts(t,'S03')+10.53 : inSc(t,'S04')?ts(t,'S04')+19.91 : t;
    waterSurfMat.uniforms.uT.value=t;
    causMat.uniforms.uT.value=t;
    roomDustMat.uniforms.uT.value=t;
    pourMat.uniforms.uT.value=t;
    bubMat.uniforms.uT.value=t;

    /* mực nước: S01 rót lên tới ~2/3 cốc rồi dừng */
    var fill;
    if(t<SC.S02[1]) fill = smooth(pr01(t,0.35,3.6));
    else fill = 1.0;
    waterDisc.position.y = lerp(-3.4, 1.2, fill);
    waterBody.position.y = lerp(-5.5, -1.0, fill);
    waterBody.scale.y = lerp(0.05, 1.0, fill);
    /* S83: cốc nghiêng — mặt nước GIỮ PHẲNG theo trọng lực */
    var tiltK = inSc(t,'S83') ? smooth(pr01(t,SC.S83[0]+0.4,SC.S83[0]+3.2)) : 0;
    gRoom.rotation.z = -tiltK*0.34;
    waterDisc.rotation.z = tiltK*0.34;     /* bù lại → mặt nước vẫn ngang */
    waterDisc.position.x = tiltK*1.15;
    causDisc.material.uniforms.uOp.value = (1-tiltK*0.9)*wRoom;

    /* rót: chỉ S01 */
    pourMat.uniforms.uOp.value = inSc(t,'S01')? band(t,0.0,2.0,0.45)*0.9 : 0;
    bubMat.uniforms.uOp.value  = band(t,0.2,4.2,0.8)*0.85;

    /* phản chiếu: S04 crossfade trần phòng → starfield */
    waterSurfMat.uniforms.uRefl.value = inSc(t,'S04') ? smooth(pr01(t,SC.S04[0]+0.5,SC.S04[1]-0.8))
      : (t>=SC.S04[1] && t<SC.S05[0] ? 1.0 : 0.0);
    /* biên độ sóng: S03 nhịp tim rõ, S04 lặng dần */
    var amp = inSc(t,'S03') ? 1.0 : (inSc(t,'S04')? lerp(1.0,0.22,smooth(loc(t,'S04'))) : 0.55);
    if(inSc(t,'S01')) amp=1.5;
    if(t>=SC.S68[0]) amp=0.40;
    waterSurfMat.uniforms.uAmp.value=amp;
    waterSurfMat.uniforms.uOp.value=1.0;

    /* bàn tay: S02 rút đi, S82 cầm cốc lên */
    var handOp=0;
    if(inSc(t,'S02')){ var k=smooth(pr01(t,SC.S02[0],SC.S02[0]+2.6));
      handOp=(1-k)*0.98; hand.position.set(lerp(1.0,9.0,k), lerp(3.2,7.0,k), lerp(3.0,6.0,k)); }
    if(inSc(t,'S82')){ var k2=smooth(pr01(t,SC.S82[0]+0.5,SC.S82[1]));
      handOp=k2*0.98; hand.position.set(lerp(9.0,0.6,Math.min(1,k2*2)), lerp(8.0,3.4,Math.min(1,k2*2)), 3.0); }
    handMat.opacity=handOp;

    /* S82: cốc được NHẤC LÊN khỏi khung phía trên; còn lại VỆT NƯỚC tròn */
    var lift = inSc(t,'S82') ? smooth(pr01(t,SC.S82[0]+1.2,SC.S82[1])) : 0;
    glass.position.y=lift*16; glassBase.position.y=-3.8+lift*16; glassRim.position.y=lift*16;
    waterDisc.position.y+=lift*16; waterBody.position.y+=lift*16; causDisc.position.y=-3.5+lift*16;
    bubbles.position.y=lift*16;

    /* --- camera --- */
    if(inSc(t,'S01')){
      /* tĩnh, 85mm macro, DOF nông; fade-in từ đen 1.5s */
      camera.fov=26; camera.position.set(0.4,1.6,17.5); camera.lookAt(0,1.0,0);
    } else if(inSc(t,'S02')){
      /* pull-back rất chậm 85mm → 50mm, camera hạ ngang mặt bàn */
      var k=smooth(loc(t,'S02'));
      camera.fov=lerp(26,42,k);
      camera.position.set(lerp(0.4,-3.2,k), lerp(1.6,-1.0,k), lerp(17.5,27.0,k));
      camera.lookAt(lerp(0,-1.4,k), lerp(1.0,-1.2,k), 0);
    } else if(inSc(t,'S03')||inSc(t,'S04')){
      /* tĩnh, nhìn xiên 30° xuống mặt nước, 100mm macro */
      var dr=Math.sin(t*0.16)*0.10;
      camera.fov=24; camera.position.set(0.3+dr, 6.6, 9.4); camera.lookAt(0,1.2,0);
    } else if(inSc(t,'S68')){
      /* ĐÚNG khung S02 (rhyme), rồi dolly-in rất chậm về phía cốc */
      var k=smooth(loc(t,'S68'));
      camera.fov=lerp(42,30,k);
      camera.position.set(lerp(-3.2,-0.8,k), lerp(-1.0,0.9,k), lerp(27.0,15.0,k));
      camera.lookAt(lerp(-1.4,0,k), lerp(-1.2,0.6,k), 0);
    } else if(inSc(t,'S82')){
      camera.fov=42; camera.position.set(-3.2,-1.0,27.0); camera.lookAt(-1.4,-1.2,0);
    } else {
      /* S83 macro bám mặt nước, nghiêng theo cốc */
      camera.fov=34; camera.position.set(0.6,5.4,14.5); camera.lookAt(0,0.6,0);
    }
    vigLens = inSc(t,'S01') ? 0.62 : 0.42;
    grain=0.030;
    /* S83: khung tối dần đều về gần đen */
    if(inSc(t,'S83')) expo = lerp(1.06, 0.06, smooth(pr01(t,SC.S83[0]+1.6,SC.S83[1])));
  }

  /* --- S05: chuỗi lùi thời gian (6 hình, whip-pan trái) --- */
  var wFlow=W(t,'S05',0.35);
  if(wFlow>0.003){
    setGroupOp(gFlow,wFlow);
    var k=loc(t,'S05')*5.0;            /* 6 hình → 5 khoảng chuyển */
    var idx=clamp(Math.floor(k),0,4);
    var fr=k-idx;
    /* whip-pan: chuyển rất nhanh ở 18% cuối mỗi đoạn */
    var mixv=smooth(clamp((fr-0.82)/0.18,0,1));
    flowMat.uniforms.uMode.value=idx;
    flowMat.uniforms.uMix.value=mixv;
    flowMat.uniforms.uT.value=t;
    /* pan sang TRÁI trong lúc chuyển (dòng chảy đi phải→trái) */
    flowMat.uniforms.uPan.value = mixv*0.9 - (1-mixv)*0.0;
    flowMat.uniforms.uOp.value=1.0;
    camera.position.set(0,0,10); camera.lookAt(0,0,0);
    grain=0.050;
  }

  /* --- S06: lao vào phân tử H₂O; S72/S84 dùng lại cùng model --- */
  var wMol=Math.max(W(t,'S06',0.4), W(t,'S72',0.5), band(t,SC.S84[0],SC.S84[0]+4.2,0.5));
  if(wMol>0.003){
    setGroupOp(gMol,wMol);
    molKey.intensity = inSc(t,'S84')? 1.6 : 5.0;
    molRim.intensity = inSc(t,'S84')? 1.1 : 3.2;
    /* phân tử xoay quanh trục riêng, tốc độ CHẬM — hàm thuần của t */
    molecule.rotation.y=t*0.16;
    molecule.rotation.x=Math.sin(t*0.09)*0.22;
    /* dao động uốn/kéo rất nhẹ tại chỗ */
    var br=0.92+Math.sin(t*2.1)*0.05;
    setBond(molecule, br*wMol);
    if(inSc(t,'S06')){
      /* dolly-in cực nhanh xuyên qua mặt biển rồi PHANH GẤP (ease-out mạnh) */
      var k=loc(t,'S06');
      /* S06 dài 61s (C06–C11) — chia nội bộ: lao vào (0–8%), rồi giữ cận cảnh */
      var dive=eOut(clamp(k/0.085,0,1));
      var dist=lerp(120, 9.5, dive);
      var ang=t*0.030;
      camera.position.set(Math.sin(ang)*dist*0.28, lerp(20,1.6,dive)+Math.sin(t*0.07)*0.5, dist);
      camera.lookAt(0,0,0);
      /* tối dần xung quanh về cuối shot → S07 */
      expo = lerp(1.06, 0.72, smooth(pr01(t,SC.S06[1]-6.0,SC.S06[1])));
      /* nền biển trong 8% đầu */
      if(dive<0.98){ setGroupOp(gFlow, (1-dive)*0.9);
        flowMat.uniforms.uMode.value=5; flowMat.uniforms.uMix.value=0;
        flowMat.uniforms.uT.value=t; flowMat.uniforms.uOp.value=1.0; }
    } else if(inSc(t,'S72')){
      /* orbit RẤT CHẬM — shot tĩnh lặng nhất chương; cùng tỉ lệ S06 */
      var a=0.25+ts(t,'S72')*0.022;
      camera.position.set(Math.sin(a)*9.5, 1.2, Math.cos(a)*9.5); camera.lookAt(0,0,0);
      vigLens=0.52;
    } else {
      /* S84: MỘT phân tử trôi qua khung PHẢI→TRÁI rồi ra ngoài; nền ĐEN */
      camera.position.set(0,0,9.5); camera.lookAt(0,0,0);
      /* storyboard: phân tử cuối sáng D_MAGENTA rất nhạt */
      setBond(molecule,(0.90)*wMol, COL.dMagenta);
      var sx=lerp(5.4,-6.2, clamp(ts(t,'S84')/4.2,0,1));
      gMol.position.set(sx, -0.3, 0);
      molKey.position.set(sx+4,5,6); molRim.position.set(sx-5,-3,-5);
      vigLens=1.35; grain=0.014; expo=0.72;
    }
    if(!inSc(t,'S84')){ gMol.position.set(0,0,0); setBond(molecule, br*wMol, COL.iceCyan); }
    grain = inSc(t,'S06')?0.038:0.026;
  }

  /* --- S07: CÚ LẬT LIÊN KẾT (hard-cut, split-screen mềm) --- */
  if(WH(t,'S07')>0){
    setGroupOp(gFlip,1);
    var k=ts(t,'S07'), K=loc(t,'S07');
    /* nửa trái: 3 hạt trôi PHÂN KỲ, KHÔNG ống liên kết */
    var sp=1.0+k*0.085;
    loose[0].position.set(0, 0.5*sp, 0);
    loose[1].position.set( 1.55*sp, -0.9*sp, 0.3*sp);
    loose[2].position.set(-1.55*sp, -0.9*sp,-0.3*sp);
    for(var i=0;i<3;i++) loose[i].rotation.y=t*0.1+i;
    /* desaturate + hạ exposure về 0.15 trong 1.2s (bắt đầu ở giây 2.0) */
    var dim=lerp(1.0,0.15, smooth(pr01(t,SC.S07[0]+2.0,SC.S07[0]+3.2)));
    for(var i=0;i<3;i++){
      loose[i].material.color.setRGB(0.34*dim,0.33*dim,0.32*dim);
      loose[i].material.emissiveIntensity=0.3*dim;
      loose[i].material.opacity=1.0;
    }
    strikeL.material.opacity = smooth(pr01(t,SC.S07[0]+3.0,SC.S07[0]+4.2))*0.52*dim*3.2;
    /* nửa phải: ống liên kết BẬT SÁNG emissive 1.4 (nguồn sáng, được vượt 1.0) */
    var on=smooth(pr01(t,SC.S07[0]+1.2,SC.S07[0]+2.8));
    setBond(flipMol, on*1.40);
    flipMol.rotation.y=Math.sin(t*0.10)*0.30;
    flipMol.rotation.x=Math.sin(t*0.07)*0.12;
    /* camera: tĩnh; cuối shot TRƯỢT SANG PHẢI loại bỏ hoàn toàn nửa trái */
    var slide=smooth(pr01(t, SC.S07[1]-7.0, SC.S07[1]-0.6));
    camera.fov=lerp(44,32,slide);
    camera.position.set(lerp(0,9.5,slide), 0, lerp(30,17,slide));
    camera.lookAt(lerp(0,9.5,slide),0,0);
    /* nửa trái mờ hẳn khi camera trượt */
    setGroupOp(flipL, (1-slide)*1.0);
    flipKey.intensity=4.4; flipRim.intensity=2.9;
    vigLens=0.46; grain=0.034;
  }

  /* --- S08: đốm sáng trôi qua 3 lớp nền parallax --- */
  var wTr=W(t,'S08',0.35);
  if(wTr>0.003){
    setGroupOp(gTravel,wTr);
    var K=loc(t,'S08');
    travelBg.material.uniforms.uK.value=K;
    travelBg.material.uniforms.uT.value=t;
    travelBg.material.uniforms.uOp.value=1.0;
    /* phân tử giữ CỐ ĐỊNH ở 1/3 trái khung, NGUYÊN VẸN, không đổi kích cỡ */
    camera.fov=44; camera.position.set(0,0,10); camera.lookAt(0,0,0);
    travelDot.position.set(-3.6, 0.2+Math.sin(t*0.5)*0.10, 0);
    travelDot.material.opacity=wTr;
    /* nền thứ ba tối hẳn ở cuối, chỉ còn đốm sáng */
    expo=lerp(1.06,0.80, smooth(pr01(t,SC.S08[1]-2.5,SC.S08[1])));
    grain=0.034;
  }

  /* --- S09: đốm sáng đơn độc rồi TẮT; đen 1s trước chương 2 --- */
  if(WH(t,'S09')>0){
    setGroupOp(gLone,1);
    camera.fov=44; camera.position.set(0,0,10); camera.lookAt(0,0,0);
    var k=loc(t,'S09');
    /* thu nhỏ theo hàm MŨ rồi tắt hẳn, giữ đen 1s */
    var sz=2.4*Math.exp(-k*2.2);
    loneDot.scale.set(sz,sz,1);
    loneDot.material.opacity=Math.exp(-k*1.7)*clamp((SC.S09[1]-1.0-t)/0.6,0,1);
    vigLens=1.15; grain=0.018; expo=1.0;
  }

  /* =====================================================================
   * CHƯƠNG 2 — S10–S32 (TỐI NHẤT; đám mây KHÔNG có tâm sáng)
   * ===================================================================== */
  /* nền mây dùng chung S10–S18, S30 */
  var wCloud=Math.max(WR(t,'S10','S18',0.5), W(t,'S19',0.5), W(t,'S30',0.5),
                      WR(t,'S31','S32',0.5));
  if(wCloud>0.003 && !inSc(t,'S12')){
    setGroupOp(gCloud,wCloud);
    cloudMat.uniforms.uT.value=t;
    cloudMat.uniforms.uOp.value=1.0;
    /* uDepth: camera lún vào — độ sáng GIẢM khi đi sâu */
    var dep=0;
    if(inSc(t,'S10')) dep=loc(t,'S10')*0.20;
    else if(inSc(t,'S11')) dep=lerp(0.20,0.62,loc(t,'S11'));
    else if(t>=SC.S13[0]&&t<SC.S19[0]) dep=0.66+Math.sin(t*0.02)*0.03;
    else dep=0.70;
    cloudMat.uniforms.uDepth.value=dep;
    cloudMat.uniforms.uDens.value = inSc(t,'S10') ? lerp(0.5,1.0,loc(t,'S10')) : 1.05;
    cloudMat.uniforms.uStarBack.value = inSc(t,'S10') ? 1.0 : lerp(1.0,0.35,clamp((dep-0.2)/0.5,0,1));
    cloudMat.uniforms.uZoom.value = 1.0 + (inSc(t,'S11')?loc(t,'S11')*0.55:0.55);
    cloudMat.uniforms.uOff.value.set(Math.sin(t*0.010)*0.06, Math.cos(t*0.008)*0.04);
    /* S10: khối tối lớn dần chiếm khung TỪ DƯỚI LÊN */
    cloudMat.uniforms.uRise.value = inSc(t,'S10') ? lerp(1.4,0.0,smooth(loc(t,'S10'))) : 0.0;
    camera.fov = inSc(t,'S10') ? 62 : 46;
    camera.position.set(0,0,10); camera.lookAt(0,0,0);
    vigLens=0.40; grain=0.030;
  }

  /* --- S10: starfield thưa phía sau (sao nhỏ, KHÔNG bloom) --- */
  if(inSc(t,'S10')){
    stars.visible=true;
    stars.material.uniforms.uOp.value=0.42*(1-loc(t,'S10')*0.5);
    stars.rotation.y=t*0.0006;
  }

  /* --- S12: dải Ngân Hà + vết đen extinction --- */
  var wMW=W(t,'S12',0.5);
  if(wMW>0.003){
    setGroupOp(gMW,wMW);
    mwMat.uniforms.uT.value=t;
    mwMat.uniforms.uOp.value=1.0;
    /* tilt-up RẤT CHẬM từ đường chân trời lên dải Ngân Hà */
    mwMat.uniforms.uTilt.value = lerp(-0.34, 0.16, smooth(loc(t,'S12')));
    camera.position.set(0,0,10); camera.lookAt(0,0,0);
    vigLens=0.34; grain=0.028;
  }

  /* --- S13: thang nhiệt 10 K / −263 °C + hạt khí chậm dần --- */
  var wTh=W(t,'S13',0.6);
  if(wTh>0.003){
    setGroupOp(gTherm,wTh);
    var K=loc(t,'S13');
    var drop=smooth(pr01(t,SC.S13[0]+1.0,SC.S13[0]+7.5));
    /* kim tụt xuống, DỪNG NGAY TRÊN vạch 0 K */
    var ny=lerp(4.6,-5.05,drop);
    gTherm.userData.needle.position.y=ny;
    gTherm.userData.big.position.y=ny;
    gTherm.userData.sub.position.y=ny;
    /* hạt khí chuyển động CHẬM DẦN khi số tụt (nhiệt độ = TỐC ĐỘ HẠT) */
    gasPts.visible=true;
    gasMat.uniforms.uT.value=t;
    gasMat.uniforms.uSpd.value=lerp(1.0,0.055,drop);
    gasMat.uniforms.uOp.value=wTh*0.9;
    /* drift ngang 2% khung để hình không chết cứng */
    camera.fov=46; camera.position.set(Math.sin(t*0.09)*0.55,0,26); camera.lookAt(0,0,0);
    vigLens=0.44; grain=0.028;
  }

  /* --- S14: hai ô mật độ --- */
  var wD=W(t,'S14',0.5);
  if(wD>0.003){
    setGroupOp(gDens,wD);
    boxCloud.userData.mat.uniforms.uT.value=t;
    boxRoom.userData.mat.uniforms.uT.value=t;
    /* ô phải xuất hiện sau, rồi BIẾN MẤT ĐỘT NGỘT ở cuối */
    var appear=smooth(pr01(t,SC.S14[0]+3.4,SC.S14[0]+5.0));
    var vanish= t>SC.S14[1]-1.6 ? 0 : 1;
    setGroupOp(boxRoom, appear*vanish);
    setGroupOp(boxCloud, 1.0);
    densLab2.material.opacity=0.76*appear*vanish;
    /* camera nhích nhẹ sang ô thứ hai khi nó xuất hiện */
    camera.fov=44; camera.position.set(lerp(-7.0,0.5,appear*vanish), 0.4, 27);
    camera.lookAt(lerp(-7.0,0.5,appear*vanish),-0.6,0);
    vigLens=0.42; grain=0.028;
  }

  /* --- S15: buồng chân không vs ô mây --- */
  var wV=W(t,'S15',0.5);
  if(wV>0.003){
    setGroupOp(gVac,wV);
    gVac.userData.inner.uniforms.uT.value=t;
    camera.fov=46; camera.position.set(0.2,0.2,30); camera.lookAt(0.2,-0.6,0);
    /* buồng MỜ TAN ở cuối, camera lún trở lại vào mây */
    var fade=1-smooth(pr01(t,SC.S15[1]-2.0,SC.S15[1]));
    setGroupOp(gVac,wV*fade);
    vigLens=0.42; grain=0.028;
  }

  /* --- S16: nhịp nghỉ — chỉ volume tối, luminance TB ≤0.06 nhưng ĐỌC ĐƯỢC --- */
  if(inSc(t,'S16')){
    /* drift-in cực chậm, gần như đứng yên */
    camera.fov=lerp(46,43,loc(t,'S16'));
    camera.position.set(Math.sin(t*0.03)*0.4,0,10); camera.lookAt(0,0,0);
    vigLens=0.34; grain=0.024; expo=1.02;   /* nâng nhẹ để chi tiết còn đọc được */
  }

  /* --- S17: hai H trôi, đường bay lượn qua nhau, va chạm BẬT RA --- */
  var wM=W(t,'S17',0.5);
  if(wM>0.003){
    setGroupOp(gMiss,wM);
    var k=ts(t,'S17'), K=loc(t,'S17');
    var TC=0.80;      /* thời điểm va chạm (tiến độ) */
    function pathA(u){
      var x=lerp(-13,6,u)+Math.sin(u*5.1)*1.2;
      var y=Math.sin(u*3.4+0.6)*3.2;
      return new THREE.Vector3(x,y,Math.sin(u*2.2)*1.2);
    }
    function pathB(u){
      var x=lerp(13,6,u)-Math.sin(u*4.6)*1.1;
      var y=-Math.sin(u*3.1+1.1)*3.0;
      return new THREE.Vector3(x,y,-Math.sin(u*2.6)*1.1);
    }
    /* sau va chạm: BẬT RA theo góc phản xạ đàn hồi, KHÔNG dính */
    function posA(u){
      if(u<=TC) return pathA(u);
      var p=pathA(TC), q=pathA(TC-0.02);
      var v=p.clone().sub(q).normalize();
      /* phản xạ: đảo thành phần y */
      v.y=-v.y; v.x*=0.55;
      return p.clone().add(v.multiplyScalar((u-TC)*160));
    }
    function posB(u){
      if(u<=TC) return pathB(u);
      var p=pathB(TC), q=pathB(TC-0.02);
      var v=p.clone().sub(q).normalize();
      v.y=-v.y; v.x*=0.55;
      return p.clone().add(v.multiplyScalar((u-TC)*160));
    }
    missA.position.copy(posA(K)); missB.position.copy(posB(K));
    /* trail mảnh mờ dần */
    for(var L=0;L<2;L++){
      var tr = L===0?trailA:trailB, f = L===0?posA:posB;
      var P=tr.userData.pos;
      for(var i=0;i<tr.userData.n;i++){
        var u=clamp(K-i*0.0055,0,1);
        var p=f(u);
        P[i*3]=p.x; P[i*3+1]=p.y; P[i*3+2]=p.z;
      }
      tr.userData.geo.attributes.position.needsUpdate=true;
      tr.material.uniforms.uOp.value=wM;
    }
    /* xung sáng nhỏ THOÁT RA NGOÀI: năng lượng không có chỗ nhả */
    var pk=clamp((K-TC)/0.06,0,1);
    if(K>TC-0.01 && K<TC+0.18){
      missPulse.visible=true;
      var pc=pathA(TC).lerp(pathB(TC),0.5);
      missPulse.position.copy(pc);
      var s=0.8+pk*7.5;
      missPulse.scale.set(s,s,1);
      missPulse.material.opacity=(1-pk)*0.75*wM;
    } else missPulse.material.opacity=0;
    /* camera THEO SAU một nguyên tử (tracking), 50mm, nền mây chạy chậm */
    var cp=posA(K);
    camera.fov=42;
    camera.position.set(cp.x*0.55, cp.y*0.4+1.0, 21);
    camera.lookAt(cp.x*0.7, cp.y*0.5, 0);
    vigLens=0.42; grain=0.030;
  }

  /* --- S18: chất lỏng đông đúc rồi CO LẠI thành hư không trống --- */
  var wL=W(t,'S18',0.4);
  if(wL>0.003){
    var K=loc(t,'S18');
    /* giữ chuyển động đến tận lúc biến mất; khung trống giữ 1 nhịp cuối */
    var shrink=1.0-smooth(pr01(t,SC.S18[0]+7.0,SC.S18[0]+10.6));
    var vis = t<SC.S18[0]+10.8 ? 1 : 0;
    setGroupOp(gLiquid, wL*vis);
    gLiquid.userData.mat.uniforms.uT.value=t;
    gLiquid.userData.mat.uniforms.uShrink.value=Math.max(shrink,0.02);
    camera.fov=46; camera.position.set(0,0,22); camera.lookAt(0,0,0);
    vigLens=0.44; grain=0.030;
  }

  /* --- S19–S21: hạt bụi vào khung, cận cảnh, thang tỉ lệ --- */
  var wG=WR(t,'S19','S21',0.35);
  if(wG>0.003 && t<SC.S21[1]){
    setGroupOp(gGrain,wG);
    grainMat.uniforms.uT.value=t;
    grainMat.uniforms.uOp.value=1.0;
    grainMat.uniforms.uIce.value=0.0;     /* chưa phủ băng */
    grainMat.uniforms.uRim.value=0.11;
    dustGrain.rotation.y=t*0.045; dustGrain.rotation.x=Math.sin(t*0.03)*0.25;
    /* S19: hạt trôi VÀO từ mép PHẢI rồi dừng giữa khung */
    var enter = inSc(t,'S19') ? smooth(loc(t,'S19')) : 1;
    dustGrain.position.set(lerp(16,0,enter),lerp(2.4,0,enter),0);
    /* thang tỉ lệ chỉ hiện ở S20 */
    var scK = W(t,'S20',0.6);
    setGroupOp(gScale, scK*0.95);
    if(gScale.userData.smoke){
      gScale.userData.smoke.rotation.y=t*0.02;
      gScale.userData.smoke.material.uniforms.uT.value=t;
      gScale.userData.smoke.material.uniforms.uIce.value=0;
      gScale.userData.smoke.material.uniforms.uRim.value=0.09;
      gScale.userData.smoke.material.uniforms.uOp.value=scK;
    }
    /* camera dolly-in liên tục S19 → S21 */
    var kk = pr01(t, SC.S19[0], SC.S21[0]);
    var dist = lerp(34, 6.6, smooth(kk));
    camera.fov=42;
    if(inSc(t,'S20')){
      /* lùi xa hơn khi thang tỉ lệ hiện (để thấy sợi tóc khổng lồ) */
      var sk=smooth(loc(t,'S20'));
      dist=lerp(34, 12.0, sk);
      camera.position.set(lerp(0,20,sk*0.6), lerp(0,-2.0,sk), dist);
      camera.lookAt(lerp(0,8,sk*0.5), lerp(0,-1.5,sk), 0);
    } else {
      camera.position.set(0, 0.5, dist); camera.lookAt(0,0,0);
    }
    vigLens=0.46; grain=0.030;
  }

  /* --- S21: camera hạ sát bề mặt → địa hình + chân trời CONG --- */
  /* S21–S28 dùng chung SÂN KHẤU gStage */
  var wSt=WR(t,'S21','S28',0.35);
  if(wSt>0.003 && t>=SC.S21[0]-0.4 && t<SC.S28[1]){
    setGroupOp(gStage,wSt);
    surfMat.uniforms.uT.value=t;
    surfMat.uniforms.uOp.value=1.0;
    /* lớp băng dày lên ở S27 — HÀM THUẦN của t, không tích luỹ */
    var iceK = inSc(t,'S27') ? smooth(loc(t,'S27')) : (t>=SC.S28[0] ? 1.0 : 0.0);
    surfMat.uniforms.uIce.value=iceK;

    /* --- vị trí O và H trên mặt cầu --- */
    var rSurf=surfR-0.55;
    var pO=sphPos(0,0,rSurf+0.52);
    atomO.position.copy(pO);
    /* S22: O trôi TỪ TRÊN CAO, chạm, NẢY RẤT KHẼ một lần rồi nằm yên */
    var oOp=0, oY=0;
    if(t>=SC.S22[0]){
      var ok=pr01(t,SC.S22[0]+0.4,SC.S22[0]+4.2);
      var drop=eOut(ok);
      /* nảy khẽ một lần ngay sau khi chạm */
      var bounce = ok>=1 ? Math.exp(-(ts(t,'S22')-4.2)*3.4)*Math.abs(Math.sin((ts(t,'S22')-4.2)*7.0))*0.38 : 0;
      oY = lerp(12, 0, drop) + bounce;
      /* sau khi dừng: chỉ dao động biên độ CỰC NHỎ tại chỗ, KHÔNG di chuyển */
      if(ok>=1) oY += Math.sin(t*3.1)*0.020;
      atomO.position.copy(sphPos(0,0,rSurf+1.05+oY));
      oOp=smooth(pr01(t,SC.S22[0],SC.S22[0]+0.6));
      /* gợn sáng lan khi chạm rồi TẮT */
      var lk=pr01(t,SC.S22[0]+4.2,SC.S22[0]+6.4);
      if(lk>0&&lk<1){
        landRing.position.copy(sphPos(0,0,rSurf+0.1));
        landRing.lookAt(0,0,0);
        var sc=1+lk*7;
        landRing.scale.set(sc,sc,1);
        landRing.material.opacity=(1-lk)*0.55*wSt;
      } else landRing.material.opacity=0;
    }
    atomO.userData.mat.uniforms.uOp.value=oOp*wSt;
    atomO.userData.mat.uniforms.uE.value=0.90;

    /* S23–S25: H thứ nhất TRƯỜN bằng bước NHẢY (hopping) tới O */
    var h1Op=0, pH1=sphPos(-0.62,0.30,rSurf+0.7);
    if(t>=SC.S23[0]){
      /* hạ xuống cách O một quãng */
      var lk=smooth(pr01(t,SC.S23[0],SC.S23[0]+1.8));
      /* tiến độ hopping: S23 (bò) → S24 (thu hẹp) → chạm ở đầu S25 */
      var hk=pr01(t, SC.S23[0]+1.8, SC.S25[0]+1.2);
      /* nhịp bước THƯA DẦN khi tới gần (không tăng tốc) */
      var hkEase = 1-Math.pow(1-hk, 1.55);
      pH1=hopAt(hkEase, rSurf+0.30);
      pH1.y += (1-lk)*7;
      h1Op=smooth(pr01(t,SC.S23[0],SC.S23[0]+0.5));
      /* vệt mờ RẤT NGẮN đánh dấu đường đã đi */
      var P=hopTrail.userData.pos;
      for(var i=0;i<hopTrail.userData.n;i++){
        var u=clamp(hkEase-i*0.010,0,1);
        var p=hopAt(u, rSurf+0.28);
        P[i*3]=p.x; P[i*3+1]=p.y; P[i*3+2]=p.z;
      }
      hopTrail.userData.geo.attributes.position.needsUpdate=true;
      hopTrail.material.uniforms.uOp.value=wSt*0.62*clamp(hk*3,0,1)*(1-clamp((hk-0.95)/0.05,0,1));
    } else hopTrail.material.uniforms.uOp.value=0;
    atomH1.position.copy(pH1);
    atomH1.userData.mat.uniforms.uOp.value=h1Op*wSt;

    /* S25: KHOẢNH KHẮC LIÊN KẾT — ống bật emissive 1.5 trong 3 frame rồi về 0.9 */
    var bondT=SC.S25[0]+1.2;
    var b1v=0;
    if(t>=bondT){
      var dt=t-bondT;
      b1v = dt<0.10 ? 1.50 : lerp(1.50,0.90, clamp((dt-0.10)/0.7,0,1));
      /* ống nối O ↔ H1 */
      var mid=pO.clone().lerp(pH1,0.5);
      bond1.position.copy(mid);
      var dir=pH1.clone().sub(pO);
      bond1.scale.set(1,dir.length(),1);
      bond1.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
      /* H1 khoá vào vị trí liên kết */
      var half=HOH/2;
      var up=pO.clone().normalize();
      var tang=new THREE.Vector3(1,0,0).sub(up.clone().multiplyScalar(up.x)).normalize();
      var bindDir=up.clone().multiplyScalar(Math.cos(half)).add(tang.clone().multiplyScalar(Math.sin(half))).normalize();
      var pBind=pO.clone().add(bindDir.multiplyScalar(0.86));
      atomH1.position.lerp(pBind, clamp(dt*3.0,0,1));
      var mid2=pO.clone().lerp(atomH1.position,0.5);
      bond1.position.copy(mid2);
      var d2=atomH1.position.clone().sub(pO);
      bond1.scale.set(1,d2.length(),1);
      bond1.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d2.clone().normalize());
      /* SÓNG NĂNG LƯỢNG lan VÀO hạt bụi rồi tắt (đi VÀO, không bay ra) */
      surfMat.uniforms.uHeatC.value.copy(pO);
      surfMat.uniforms.uHeat.value = clamp(dt/2.6,0,1.0);
      if(dt>2.6) surfMat.uniforms.uHeat.value=0;
    } else surfMat.uniforms.uHeat.value=0;
    bond1.userData.mat.opacity=b1v*wSt;
    bond1.visible=b1v>0.01;

    /* S26: H THỨ HAI bò tới từ mép khung, gắn vào phía còn lại của O */
    var h2Op=0, b2v=0;
    if(t>=SC.S26[0]){
      var hk2=pr01(t, SC.S26[0]+0.2, SC.S26[0]+4.6);
      var hk2e=1-Math.pow(1-hk2,1.5);
      /* đường hopping đối xứng qua trục */
      var p2=hopAt(hk2e, rSurf+0.30);
      p2.x=-p2.x;    /* từ mép đối diện */
      var half=HOH/2;
      var up=pO.clone().normalize();
      var tang=new THREE.Vector3(1,0,0).sub(up.clone().multiplyScalar(up.x)).normalize();
      var bindDir2=up.clone().multiplyScalar(Math.cos(half)).add(tang.clone().multiplyScalar(-Math.sin(half))).normalize();
      var pBind2=pO.clone().add(bindDir2.multiplyScalar(0.86));
      atomH2.position.copy(p2.lerp(pBind2, smooth(clamp((hk2-0.75)/0.25,0,1))));
      h2Op=smooth(pr01(t,SC.S26[0],SC.S26[0]+0.5));
      if(hk2>0.95){
        var d3=atomH2.position.clone().sub(pO);
        bond2.position.copy(pO.clone().lerp(atomH2.position,0.5));
        bond2.scale.set(1,d3.length(),1);
        bond2.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d3.clone().normalize());
        b2v=lerp(1.40,0.90, clamp((hk2-0.95)/0.05,0,1));
      }
    }
    atomH2.userData.mat.uniforms.uOp.value=h2Op*wSt;
    bond2.userData.mat.opacity=b2v*wSt;
    bond2.visible=b2v>0.01;
    /* sau S26: phân tử hoàn chỉnh dao động uốn/kéo RẤT NHẸ tại chỗ */
    if(t>=SC.S26[1]){
      bond1.userData.mat.opacity=(0.90+Math.sin(t*2.4)*0.06)*wSt;
      bond2.userData.mat.opacity=(0.90+Math.sin(t*2.4+1.1)*0.06)*wSt;
      bond1.visible=bond2.visible=true;
      atomH1.userData.mat.uniforms.uOp.value=wSt;
      atomH2.userData.mat.uniforms.uOp.value=wSt;
    }

    /* --- camera của sân khấu --- */
    if(inSc(t,'S21')){
      /* hạ xuống SÁT bề mặt rồi ngẩng lên → chân trời CONG hiện ra */
      var k=smooth(loc(t,'S21'));
      var h=lerp(40, 1.6, k);
      camera.fov=lerp(46,56,k);
      camera.position.set(-5, surfR+h, 13);
      camera.lookAt(lerp(0,-1,k)*7, surfR+lerp(14,1.5,k), 0);
    } else if(inSc(t,'S22')||inSc(t,'S23')||inSc(t,'S24')){
      /* tĩnh thấp ngang bề mặt (S22), tracking theo H (S23), dolly-in (S24) */
      var camTgt=new THREE.Vector3();
      if(inSc(t,'S22')) camTgt.copy(pO);
      else camTgt.copy(pH1).lerp(pO, inSc(t,'S24')?0.5:0.25);
      var dd = inSc(t,'S24') ? lerp(16.0,9.0, smooth(loc(t,'S24'))) : (inSc(t,'S22')?17.0:15.0);
      camera.fov = inSc(t,'S22') ? 36 : 40;
      camera.position.set(camTgt.x*0.45, surfR+1.35, camTgt.z+dd);
      camera.lookAt(camTgt.x, camTgt.y-0.08, camTgt.z);
    } else if(inSc(t,'S25')){
      /* cận cảnh CỰC ĐẠI, TĨNH TUYỆT ĐỐI 0.5s tại thời điểm liên kết */
      var pre=pr01(t,SC.S25[0],SC.S25[0]+1.0);
      var mid=pO.clone().lerp(atomH1.position,0.5);
      var dd2=lerp(9.0,5.6,smooth(pre));
      /* điểm nghỉ camera: dt<0.5 giữ NGUYÊN */
      camera.fov=34;
      camera.position.set(mid.x*0.5, surfR+0.92, mid.z+dd2);
      camera.lookAt(mid.x, mid.y-0.10, mid.z);
    } else if(inSc(t,'S26')){
      /* sau liên kết thứ hai, camera LÙI RA RẤT CHẬM để lộ cả hạt bụi */
      var k=smooth(pr01(t,SC.S26[0]+5.0,SC.S26[1]));
      camera.fov=lerp(28,44,k);
      camera.position.set(0, surfR+lerp(1.15,42,k), lerp(6.4,290,k));
      camera.lookAt(0, surfR+lerp(0.10,-60,k), 0);
    } else if(inSc(t,'S27')){
      /* ORBIT chậm quanh hạt bụi trong lúc lớp băng dày lên */
      var a=0.4+ts(t,'S27')*0.055;
      var dist=lerp(410,470,loc(t,'S27'));
      camera.fov=44;
      camera.position.set(Math.sin(a)*dist, 105, Math.cos(a)*dist);
      camera.lookAt(0,0,0);
    } else {
      /* S28 pull-back rộng — nhưng cảnh chính là trường hạt bên dưới */
      camera.fov=48; camera.position.set(0,150,lerp(470,720,loc(t,'S28')));
      camera.lookAt(0,0,0);
    }
    /* S28: chỉ còn trường hạt, sân khấu mờ đi */
    if(inSc(t,'S28')) setGroupOp(gStage, wSt*(1-smooth(loc(t,'S28')))*0.7);
    vigLens=0.48; grain=0.028;
  }

  /* --- S28: hàng nghìn hạt phủ băng trôi trong bóng tối --- */
  var wF=W(t,'S28',0.5);
  if(wF>0.003){
    setGroupOp(gField,wF);
    gField.userData.mat.uniforms.uOp.value=1.0;
    /* mỗi hạt một phương hướng xoay riêng seeded — hàm thuần của t */
    var ud=gField.userData, d=ud.dummy;
    for(var i=0;i<ud.axes.length;i++){
      var ax=ud.axes[i];
      d.position.copy(ax.p);
      d.rotation.set(ax.r.x+t*ax.sp, ax.r.y+t*ax.sp*0.7, ax.r.z);
      d.scale.setScalar(ax.s);
      d.updateMatrix(); ud.im.setMatrixAt(i,d.matrix);
    }
    ud.im.instanceMatrix.needsUpdate=true;
    var k=smooth(loc(t,'S28'));
    camera.fov=48;
    camera.position.set(0, lerp(120,210,k), lerp(430,760,k));
    camera.lookAt(0,0,0);
    vigLens=0.52; grain=0.026; expo=1.20;   /* tương phản cục bộ, không thêm đèn */
  }

  /* --- S29: hai cái lò RỰC RỠ rồi bị DẬP TẮT (hard-cut về đen) --- */
  if(WH(t,'S29')>0){
    setGroupOp(gForge,1);
    var k=loc(t,'S29');
    forgeMat.uniforms.uT.value=t;
    /* hai hình liên tiếp, mỗi hình một cú zoom-in ngắn rồi CẮT */
    var isSN = k>0.5;
    forgeMat.uniforms.uMode.value = isSN?1:0;
    forgeMat.uniforms.uK.value = isSN ? pr01(k,0.5,0.95) : pr01(k,0.0,0.45);
    /* zoom-in ngắn: dùng fov */
    camera.fov = isSN ? lerp(52,42,pr01(k,0.5,0.95)) : lerp(52,40,pr01(k,0.0,0.45));
    camera.position.set(0,0,10); camera.lookAt(0,0,0);
    /* tắt dứt khoát ở 2 frame cuối → hard-cut về ĐEN */
    forgeMat.uniforms.uOp.value = t>SC.S29[1]-0.10 ? 0 : 1;
    vigLens=0.58; grain=0.036;
  }

  /* --- S30: từ đen, trở lại ĐÚNG cận cảnh S26 (rhyme cố ý) --- */
  var wR30=W(t,'S30',0.5);
  if(wR30>0.003){
    setGroupOp(gStage,wR30);
    surfMat.uniforms.uT.value=t;
    surfMat.uniforms.uOp.value=1.0;
    surfMat.uniforms.uIce.value=0.28;
    surfMat.uniforms.uHeat.value=0;
    var rSurf2=surfR-0.55;
    var pO2=sphPos(0,0,rSurf2+0.52);
    atomO.position.copy(pO2);
    atomO.userData.mat.uniforms.uOp.value=wR30;
    var half=HOH/2, up=pO2.clone().normalize();
    var tang=new THREE.Vector3(1,0,0).sub(up.clone().multiplyScalar(up.x)).normalize();
    var d1=up.clone().multiplyScalar(Math.cos(half)).add(tang.clone().multiplyScalar( Math.sin(half))).normalize();
    var d2=up.clone().multiplyScalar(Math.cos(half)).add(tang.clone().multiplyScalar(-Math.sin(half))).normalize();
    atomH1.position.copy(pO2.clone().add(d1.clone().multiplyScalar(0.86)));
    atomH2.position.copy(pO2.clone().add(d2.clone().multiplyScalar(0.86)));
    atomH1.userData.mat.uniforms.uOp.value=wR30;
    atomH2.userData.mat.uniforms.uOp.value=wR30;
    var bb=(0.90+Math.sin(t*2.2)*0.05)*wR30;
    [[bond1,atomH1],[bond2,atomH2]].forEach(function(pair){
      var b=pair[0], h=pair[1];
      var dd=h.position.clone().sub(pO2);
      b.position.copy(pO2.clone().lerp(h.position,0.5));
      b.scale.set(1,dd.length(),1);
      b.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dd.clone().normalize());
      b.visible=true; b.userData.mat.opacity=bb;
    });
    hopTrail.material.uniforms.uOp.value=0;
    landRing.material.opacity=0;
    /* ĐÚNG khung hình S26 (cùng tiêu cự, cùng khoảng cách) */
    camera.fov=34;
    camera.position.set(0, surfR+1.15, 6.4);
    camera.lookAt(0, surfR+0.10, 0);
    vigLens=0.50; grain=0.026;
  }

  /* --- S31: khung ngắm / lưới đo TRỐNG quanh hạt phủ băng --- */
  var wP=W(t,'S31',0.5);
  if(wP>0.003){
    setGroupOp(gGrain,wP*0.9);
    grainMat.uniforms.uT.value=t;
    grainMat.uniforms.uOp.value=1.0;
    grainMat.uniforms.uIce.value=0.85;
    grainMat.uniforms.uRim.value=0.12;
    dustGrain.position.set(0,0,0);
    dustGrain.rotation.y=t*0.03;
    setGroupOp(gScale,0);
    setGroupOp(gProbe,wP);
    /* khung đo TRƯỢT VÀO từ ngoài rồi KHOÁ LẠI quanh hạt */
    var k=smooth(pr01(t,SC.S31[0]+1.0,SC.S31[0]+4.0));
    var brs=gProbe.userData.brackets;
    var cs=[[-1,1],[1,1],[-1,-1],[1,-1]];
    for(var i=0;i<4;i++)
      brs[i].position.set(cs[i][0]*lerp(18,7.0,k), cs[i][1]*lerp(11,4.2,k),0);
    gProbe.userData.grid.scale.setScalar(lerp(1.5,1.0,k));
    /* ô ghi chú bỏ trống hiện sau */
    setGroupOp(gProbe.userData.note, smooth(pr01(t,SC.S31[0]+6.0,SC.S31[0]+8.0))*wP);
    camera.fov=44; camera.position.set(0,0,22); camera.lookAt(0,0,0);
    vigLens=0.46; grain=0.028;
  }

  /* --- S32: cái NHÃN — một nguyên tử SÁNG KHÁC MÀU (D_MAGENTA) --- */
  var wLb=W(t,'S32',0.4);
  if(wLb>0.003){
    setGroupOp(gLabel,wLb);
    labelKey.intensity=4.6; labelRim.intensity=2.9;
    labelMol.rotation.y=Math.sin(t*0.10)*0.5+0.35;
    labelMol.rotation.x=Math.sin(t*0.07)*0.15;
    setBond(labelMol, (0.90+Math.sin(t*2.0)*0.05)*wLb);
    /* dolly-in SÁT vào cho tới khi cái nhãn chiếm giữa khung */
    var k=smooth(loc(t,'S32'));
    /* vị trí world của nguyên tử D (hydro thứ 2) */
    var dpos=new THREE.Vector3();
    labelMol.userData.h[1].getWorldPosition(dpos);
    camera.fov=lerp(42,20,k);
    var tgt=new THREE.Vector3(0,0,0).lerp(dpos,k*0.92);
    camera.position.set(tgt.x*0.7, tgt.y*0.7+0.4, lerp(19,5.2,k));
    camera.lookAt(tgt);
    /* vòng nhấn quanh D */
    labelRing.position.copy(dpos);
    labelRing.lookAt(camera.position);
    var rs=1+Math.sin(t*2.2)*0.06;
    labelRing.scale.set(rs,rs,1);
    labelRing.material.opacity=smooth(pr01(t,SC.S32[0]+2.4,SC.S32[0]+4.0))*0.55*wLb;
    vigLens=0.46; grain=0.028;
  }
  return renderPart2(t, vigCss, vigLens, grain, ca, flash, expo);
}
/* ==========================================================================
 * renderPart2 — CHƯƠNG 3 + CHƯƠNG 4 + hậu kỳ. Vẫn là hàm thuần của t.
 * ========================================================================== */
function renderPart2(t, vigCss, vigLens, grain, ca, flash, expo){

  /* nền đen PHẲNG cho mọi shot graph/sơ đồ (không nebula, không sao) */
  var wBg=Math.max(WR(t,'S33','S42',0.4), W(t,'S44',0.4), WR(t,'S48','S50',0.4),
                   W(t,'S54',0.4), W(t,'S56',0.4), WR(t,'S60','S64',0.4),
                   W(t,'S49',0.4), W(t,'S78',0.4));
  if(wBg>0.003){
    setGroupOp(gGraphBg,wBg);
    gGraphBg.children[0].material.uniforms.uT.value=t;
    gGraphBg.children[0].material.uniforms.uOp.value=1.0;
  }

  /* --- S33/S34: sơ đồ H vs D --- */
  var wI=WR(t,'S33','S34',0.45);
  if(wI>0.003){
    setGroupOp(gIso,wI);
    isoH.children.forEach(function(c){ if(c.material&&c.material.uniforms&&c.material.uniforms.uT) c.material.uniforms.uT.value=t; });
    isoD.children.forEach(function(c){ if(c.material&&c.material.uniforms&&c.material.uniforms.uT) c.material.uniforms.uT.value=t; });
    /* S34: phiên bản hai TRƯỢT VÀO; cân nghiêng rõ về phía D theo tỉ lệ 2:1 */
    var slide=smooth(pr01(t,SC.S34[0],SC.S34[0]+2.2));
    isoD.position.x=lerp(30,8.6,slide);
    setGroupOp(isoD, slide*wI);
    /* cân: nghiêng tối đa atan(1/3) ≈ 18.4° cho tỉ lệ 2:1 trên đòn cân */
    var tilt=-slide*0.322;
    gIso.userData.scaleG.rotation.z=tilt;
    gIso.userData.panL.position.set(-3.6, 3.6*Math.sin(-tilt)-0.55, 0);
    gIso.userData.panR.position.set( 3.6,-3.6*Math.sin(-tilt)-0.55, 0);
    setGroupOp(gIso.userData.scaleG, slide*wI);
    ratioLab.material.opacity=0.76*slide*wI;
    /* S33 nhích nhẹ sang phải cuối shot để dành chỗ */
    var shift = inSc(t,'S33') ? smooth(pr01(t,SC.S33[1]-2.5,SC.S33[1]))*0.35 : 1.0;
    camera.fov=46;
    camera.position.set(lerp(-8.6, 0, Math.max(shift,slide)), -1.0, 27);
    camera.lookAt(lerp(-8.6, 0, Math.max(shift,slide)), -1.6, 0);
    /* S34: mờ sơ đồ H ở cuối, giữ D */
    var fadeH = inSc(t,'S34') ? 1-smooth(pr01(t,SC.S34[1]-2.0,SC.S34[1]))*0.72 : 1;
    setGroupOp(isoH, wI*fadeH);
    isoBarFill.material.opacity=0.62*wI*fadeH;
    isoBarBg.material.opacity=0.55*wI*fadeH;
    isoBarLab.material.opacity=0.76*wI*fadeH;
    vigLens=0.38; grain=0.026;
  }

  /* --- S35: vũ trụ sơ khai NGẮN; C45→C46 hard-cut, plasma tắt 1 frame --- */
  if(WH(t,'S35')>0){
    setGroupOp(gEarly,1);
    var k=loc(t,'S35');
    plasmaMat.uniforms.uT.value=t;
    /* plasma nóng ở đầu, nguội nhanh khi đồng hồ nhảy vọt */
    var cool=smooth(pr01(k,0.18,0.45));
    plasmaMat.uniforms.uK.value=cool;
    plasmaMat.uniforms.uOp.value=1.0;
    /* thanh thời gian: "vài phút" rồi KÉO DÀI thành 13,8 tỉ năm */
    var stretch=smooth(pr01(k,0.20,0.50));
    earlyBar.scale.x=lerp(1.0,22.0,stretch);
    earlyLabA.material.opacity=0.76*(1-stretch*0.75);
    earlyLabB.material.opacity=0.76*stretch;
    /* lưới 200×200 chỉ 1 chấm D — hiện ở nửa sau */
    var gk=smooth(pr01(k,0.48,0.68));
    gridMat.uniforms.uOp.value=gk;
    gridMat.uniforms.uPulse.value=0.5+0.5*Math.sin(t*2.6);
    gridLab.material.opacity=0.76*gk;
    /* MỘT cú zoom-out nhanh duy nhất, không nấn ná */
    camera.fov=lerp(30,52, eOut(clamp(k/0.30,0,1)));
    camera.position.set(0,0,10); camera.lookAt(0,0,0);
    /* ⭐ tắt TRONG 1 FRAME ở cuối, không dissolve, không tàn dư */
    if(t>SC.S35[1]-0.034){ setGroupOp(gEarly,0); plasmaMat.uniforms.uOp.value=0; }
    vigLens=0.44; grain=0.040;
  }

  /* --- S36: NHIỆT KẾ chiếm trọn khung — chuyển hướng DỨT KHOÁT --- */
  var wT2=W(t,'S36',0.16);
  if(wT2>0.003){
    setGroupOp(gTherm2,wT2);
    /* cột deuteri dâng lên tới ~10 K rồi giữ (thang 10→300 K) */
    var rise=smooth(pr01(t,SC.S36[0]+0.3,SC.S36[0]+2.2));
    var atoms=gTherm2.userData.atoms;
    for(var i=0;i<atoms.length;i++){
      var need = i/atoms.length;
      /* sàn tối thiểu 0.16 để cột luôn đọc được (10 K nằm sát đáy thang) */
      atoms[i].material.opacity = (need < (0.10+rise*0.22) ? 1.0 : 0.0)*wT2;
    }
    /* TĨNH, không chuyển động */
    camera.fov=46; camera.position.set(0,0,19.5); camera.lookAt(0,-0.4,0);
    /* nhiệt kế thu về GÓC PHẢI làm mốc thường trực cho các shot sau */
    var tuck=smooth(pr01(t,SC.S36[1]-2.2,SC.S36[1]));
    gTherm2.position.set(lerp(0,13.5,tuck), lerp(0,3.0,tuck), 0);
    gTherm2.scale.setScalar(lerp(1.0,0.42,tuck));
    vigLens=0.40; grain=0.026;
  } else { gTherm2.position.set(0,0,0); gTherm2.scale.setScalar(1); }

  /* --- S37: H₂O vs HDO, nhánh D rung CHẬM HƠN, biên độ NHỎ HƠN --- */
  var wH=W(t,'S37',0.4);
  if(wH>0.003){
    setGroupOp(gHDO,wH);
    hdoKey.intensity=5.2; hdoRim.intensity=3.2;
    /* dao động zero-point: H nhanh & biên rộng, D chậm & biên hẹp */
    var a1=Math.sin(t*6.2)*0.20, a2=Math.sin(t*6.2+2.1)*0.20;
    molH2O.userData.h[0].position.setLength(1.86*(1+a1));
    molH2O.userData.h[1].position.setLength(1.86*(1+a2));
    molH2O.rotation.y=Math.sin(t*0.09)*0.30;
    var b1=Math.sin(t*6.2)*0.20;                 /* nhánh H của HDO */
    var b2=Math.sin(t*4.4+0.7)*0.085;            /* nhánh D: CHẬM + NHỎ */
    molHDO.userData.h[0].position.setLength(1.86*(1+b1));
    molHDO.userData.h[1].position.setLength(1.86*(1+b2));
    molHDO.rotation.y=Math.sin(t*0.09)*0.30;
    setBond(molH2O,0.92*wH); setBond(molHDO,0.92*wH);
    /* camera vào SÁT liên kết D ở cuối shot */
    var zoom=smooth(pr01(t,SC.S37[1]-3.5,SC.S37[1]));
    camera.fov=lerp(46,24,zoom);
    camera.position.set(lerp(0,8.0,zoom), lerp(-0.6,1.6,zoom), lerp(30,10,zoom));
    camera.lookAt(lerp(0,8.6,zoom), lerp(-1.2,1.0,zoom), 0);
    vigLens=0.40; grain=0.026;
  }

  /* --- S38/S39/S40: hai buồng --- */
  var wC=WR(t,'S38','S39',0.4);
  if(wC>0.003){
    setGroupOp(gCham,wC);
    chamWarm.userData.mat.uniforms.uT.value=t;
    chamCold.userData.mat.uniforms.uT.value=t;
    chamWarm.userData.mat.uniforms.uSpd.value=1.0;      /* 300 K: xáo trộn dữ dội */
    chamWarm.userData.mat.uniforms.uSettle.value=0.0;   /* không quy luật */
    /* buồng lạnh: gần như ĐỨNG; D bám vào và Ở LẠI, H bị đẩy ra */
    var coldOn=W(t,'S39',0.5);
    chamCold.userData.mat.uniforms.uSpd.value=lerp(0.85,0.045, coldOn);
    chamCold.userData.mat.uniforms.uSettle.value=smooth(pr01(t,SC.S39[0]+1.0,SC.S39[1]-1.0))*coldOn;
    /* chỉ số D/H: ấm NHẤP NHÁY LOẠN, lạnh TĂNG ĐỀU và ỔN ĐỊNH */
    var noise=Math.sin(t*9.1)*0.5+Math.sin(t*13.7)*0.3+Math.sin(t*21.3)*0.2;
    setLiveNumber(numWarm, (1.0+noise*0.55).toFixed(2)+' ×nền', 74);
    var coldV=lerp(1.0, 46.0, smooth(pr01(t,SC.S39[0]+1.0,SC.S39[1])));
    setLiveNumber(numCold, coldV.toFixed(1)+' ×nền', 74);
    numWarm.material.opacity=0.80*wC;
    numCold.material.opacity=0.80*wC*Math.max(0.25,coldOn);
    /* S38 tập trung buồng ấm (lạnh còn MỜ); S39 TRƯỢT sang buồng lạnh */
    var slideK = inSc(t,'S38') ? smooth(pr01(t,SC.S38[1]-2.0,SC.S38[1])) : 1.0;
    setGroupOp(chamWarm, wC*lerp(1.0,0.45,slideK));
    setGroupOp(chamCold, wC*lerp(0.22,1.0,slideK));
    var dollyK = inSc(t,'S39') ? smooth(pr01(t,SC.S39[0]+2.0,SC.S39[1])) : 0;
    camera.fov=lerp(48,34,dollyK);
    camera.position.set(lerp(-9.5,9.5,slideK), 0.4, lerp(24,17,dollyK));
    camera.lookAt(lerp(-9.5,9.5,slideK), -0.3, 0);
    vigLens=0.40; grain=0.028;
  }

  /* --- S40: hai cột kết quả theo trục LOG --- */
  var wCo=W(t,'S40',0.4);
  if(wCo>0.003){
    setGroupOp(gCols,wCo);
    var k=smooth(pr01(t,SC.S40[0]+0.5,SC.S40[0]+3.5));
    /* cột LẠNH cao vọt (~×100 → 2 decade = 6.4 world), cột ẤM sát vạch nền */
    var hc=k*6.9, hw=k*0.55;
    gCols.userData.cold.scale.y=Math.max(hc,0.01);
    gCols.userData.cold.position.y=-5.2+hc/2;
    gCols.userData.warm.scale.y=Math.max(hw,0.01);
    gCols.userData.warm.position.y=-5.2+hw/2;
    /* hai cột MỜ ĐI ở cuối, GIỮ LẠI đường nền */
    var fade=1-smooth(pr01(t,SC.S40[1]-1.8,SC.S40[1]))*0.85;
    gCols.userData.cold.material.opacity=0.72*wCo*fade;
    gCols.userData.warm.material.opacity=0.55*wCo*fade;
    camera.fov=46; camera.position.set(0,0.4,24); camera.lookAt(0,-0.2,0);
    vigLens=0.38; grain=0.026;
  }

  /* --- S41: ba khối băng, con số KHÔNG đổi khi khối xoay --- */
  var wB=W(t,'S41',0.14);
  if(wB>0.003){
    setGroupOp(gBlocks,wB);
    var bl=gBlocks.userData.blocks;
    for(var i=0;i<bl.length;i++){
      bl[i].rotation.y=t*(0.10+i*0.035);
      bl[i].rotation.x=Math.sin(t*0.06+i)*0.28;
      bl[i].material.uniforms.uT.value=t;
      bl[i].material.uniforms.uOp.value=wB;
    }
    /* ORBIT chậm quanh cụm — nhưng chữ số vẫn quay về camera (billboard tự nhiên
     * vì camera chỉ dịch ngang nhẹ) */
    var a=Math.sin(t*0.055)*0.30;
    camera.fov=46;
    camera.position.set(Math.sin(a)*32, 1.2, Math.cos(a)*32);
    camera.lookAt(0,-0.8,0);
    /* ba khối DỒN thành một ở cuối */
    var merge=smooth(pr01(t,SC.S41[1]-2.0,SC.S41[1]));
    bl[0].position.x=lerp(-9.0,0,merge); bl[2].position.x=lerp(9.0,0,merge);
    vigLens=0.42; grain=0.026;
  } else { gBlocks.userData.blocks[0].position.x=-9.0; gBlocks.userData.blocks[2].position.x=9.0; }

  /* --- S42: dấu vân tay bằng chuỗi phân tử nước --- */
  var wFg=W(t,'S42',0.14);
  if(wFg>0.003){
    setGroupOp(gFinger,wFg);
    fingerMat.uniforms.uT.value=t;
    fingerMat.uniforms.uOp.value=1.0;
    /* dolly-in từ TOÀN BỘ dấu tay vào MỘT đường vân */
    fingerMat.uniforms.uZoom.value=lerp(1.0,5.6,smooth(loc(t,'S42')));
    camera.position.set(0,0,10); camera.lookAt(0,0,0);
    vigLens=0.44; grain=0.028;
  }

  /* --- S43/S45: Trái Đất thật --- */
  var wE=Math.max(W(t,'S43',0.4), W(t,'S45',0.4));
  if(wE>0.003){
    setGroupOp(gEarth,wE);
    /* TỰ QUAY NGƯỢC CHIỀU KIM ĐỒNG HỒ nhìn từ cực Bắc = +y tăng dần */
    earthSpin.rotation.y=t*0.035;
    cloudBall.rotation.y=t*0.028;      /* mây xoay chậm hơn */
    var sunDir=new THREE.Vector3(16,4,10).normalize();
    atmo.material.uniforms.uSun.value.copy(sunDir);
    nightMat.uniforms.uSun.value.copy(sunDir);
    atmo.material.uniforms.uOp.value=wE;
    nightMat.uniforms.uOp.value=wE;
    if(inSc(t,'S43')){
      /* orbit chậm quanh chí tuyến, Trái Đất chiếm 2/3 khung DƯỚI */
      var a=0.35+ts(t,'S43')*0.020;
      camera.fov=44;
      camera.position.set(Math.sin(a)*15.5, 5.2, Math.cos(a)*15.5);
      camera.lookAt(0,-2.4,0);
      /* tia lấy mẫu chạm mặt biển rồi RÚT LÊN mang theo một giọt */
      var sk=pr01(t,SC.S43[0]+3.5,SC.S43[1]-0.4);
      var down=smooth(clamp(sk/0.45,0,1)), up2=smooth(clamp((sk-0.55)/0.45,0,1));
      var bLen=lerp(0,12,down)*(1-up2*0.85);
      sampleBeam.scale.y=Math.max(bLen/14,0.001);
      sampleBeam.position.set(2.6, 6.0+bLen*0.05, 3.4);
      sampleBeam.material.opacity=(down-up2*0.6)*0.60*wE;
      sampleDrop.position.set(2.6, lerp(6.2,13.0,up2), 3.4);
      sampleDrop.material.opacity=up2*0.95*wE;
      linkCurve.material.uniforms.uOp.value=0;
    } else {
      /* S45: pull-back rộng, Trái Đất nhỏ dần về GÓC DƯỚI TRÁI */
      var k=smooth(loc(t,'S45'));
      camera.fov=lerp(44,58,k);
      camera.position.set(lerp(6,24,k), lerp(4,14,k), lerp(16,52,k));
      camera.lookAt(lerp(0,7,k), lerp(-2,3,k), 0);
      sampleBeam.material.opacity=0; sampleDrop.material.opacity=0;
      /* đường nối MẢNH vươn ra bóng tối liên sao, KHÔNG có mũi tên */
      linkCurve.material.uniforms.uOp.value=smooth(pr01(t,SC.S45[0]+1.0,SC.S45[1]-0.5))*wE;
    }
    vigLens=0.40; grain=0.026;
  }

  /* --- S44: GRAPH D/H nước biển — camera TĨNH TUYỆT ĐỐI --- */
  var wS=W(t,'S44',0.4);
  if(wS>0.003){
    setGroupOp(gSea,wS);
    gSea.userData.gridMat.uniforms.uT.value=t;
    gSea.userData.gridMat.uniforms.uOp.value=1.0;
    /* thanh so sánh mọc ra theo tỉ lệ THẬT */
    var k=smooth(pr01(t,SC.S44[0]+4.0,SC.S44[0]+7.0));
    var L=gSea.userData.L;
    gSea.userData.b1.scale.x=Math.max(k,0.001);
    gSea.userData.b1.position.x=-5.4+L*(0.25/1.56)*k/2;
    gSea.userData.b2.scale.x=Math.max(k,0.001);
    gSea.userData.b2.position.x=-5.4+L*k/2;
    /* lưới chấm MỜ ĐI ở cuối, giữ graph */
    var fade=1-smooth(pr01(t,SC.S44[1]-1.8,SC.S44[1]))*0.75;
    gSea.userData.gridMat.uniforms.uOp.value=fade;
    /* TĨNH TUYỆT ĐỐI */
    camera.fov=46; camera.position.set(0,0,25); camera.lookAt(0,0,0);
    vigLens=0.34; grain=0.022;
  }

  /* --- S46: tàu thăm dò + sao chổi xa CHƯA có đuôi --- */
  var wPs=W(t,'S46',0.4);
  if(wPs>0.003){
    var half=SC.S46[0]+(SC.S46[1]-SC.S46[0])*0.46;
    if(t<half){
      /* con tàu: tracking bên hông, chậm */
      setGroupOp(gProbeShip,wPs);
      var sh=gProbeShip.userData.ship;
      sh.rotation.y=0.35+Math.sin(t*0.05)*0.06;
      sh.position.set(Math.sin(t*0.06)*1.2, Math.sin(t*0.09)*0.5, 0);
      /* pin mặt trời hướng về điểm sáng Mặt Trời (x=+52) */
      gProbeShip.userData.panels.forEach(function(p){ p.rotation.y=-0.35; });
      camera.fov=42;
      var k=loc(t,'S46')/0.46;
      camera.position.set(lerp(-14,-10,k), 3.2, lerp(18,14,k));
      camera.lookAt(0,0,0);
      stars.visible=true; stars.material.uniforms.uOp.value=0.42*wPs; stars.rotation.y=t*0.0004;
    } else {
      /* sao chổi ở XA: wide TĨNH, CHƯA có đuôi, Mặt Trời là điểm sáng rất xa */
      setGroupOp(g67P,wPs);
      cometMat.uniforms.uT.value=t;
      cometMat.uniforms.uOp.value=1.0;
      comet67.rotation.y=t*0.018;   /* chu kỳ 12,4 h → xoay rất chậm */
      comet67.rotation.z=0.22;
      jetA.userData.mat.uniforms.uOp.value=0;   /* chưa hoạt động */
      jetB.userData.mat.uniforms.uOp.value=0;
      lab67.material.opacity=0; scaleBar67.visible=false;
      camera.fov=48; camera.position.set(0,2.0,26); camera.lookAt(0,0,0);
      stars.visible=true; stars.material.uniforms.uOp.value=0.38*wPs; stars.rotation.y=t*0.0004;
    }
    vigLens=0.44; grain=0.028;
  }

  /* --- S47: Rosetta bay kèm 67P — orbit nửa vòng lộ hình HAI THUỲ --- */
  var w67=Math.max(W(t,'S47',0.4), W(t,'S49',0.3)*0.55);
  if(w67>0.003 && t<SC.S49[1]){
    setGroupOp(g67P,w67);
    cometMat.uniforms.uT.value=t;
    cometMat.uniforms.uOp.value=1.0;
    comet67.rotation.y=t*0.018; comet67.rotation.z=0.22;
    /* JET hơi nước từ vùng CỔ — mảnh, thẳng, mờ dần theo khoảng cách */
    var jk = inSc(t,'S47') ? smooth(pr01(t,SC.S47[0]+7.0,SC.S47[0]+11.0)) : 0.35;
    jetA.userData.mat.uniforms.uT.value=t;
    jetB.userData.mat.uniforms.uT.value=t;
    jetA.userData.mat.uniforms.uOp.value=jk*w67;
    jetB.userData.mat.uniforms.uOp.value=jk*0.72*w67;
    lab67.material.opacity=smooth(pr01(t,SC.S47[0]+2.0,SC.S47[0]+4.0))*0.72*w67;
    scaleBar67.visible=true;
    setGroupOp(scaleBar67, smooth(pr01(t,SC.S47[0]+2.5,SC.S47[0]+4.5))*w67);
    /* bay kèm: sao chổi ĐỨNG YÊN trong khung, SAO NỀN TRÔI */
    stars.visible=true;
    stars.material.uniforms.uOp.value=0.40*w67;
    stars.rotation.y=t*0.0055;     /* sao nền trôi = chuyển động tương đối */
    /* orbit NỬA VÒNG để lộ hình hai thuỳ */
    var a=lerp(-0.55, 2.35, smooth(loc(t,'S47')));
    var dd=lerp(19,14.5,smooth(loc(t,'S47')));
    camera.fov=44;
    camera.position.set(Math.sin(a)*dd, 2.8, Math.cos(a)*dd);
    camera.lookAt(0,0,0);
    /* một nhịp IM LẶNG, khung TỐI LẠI trước con số */
    if(inSc(t,'S47')) expo=lerp(1.06,0.34, smooth(pr01(t,SC.S47[1]-2.4,SC.S47[1])));
    vigLens=0.46; grain=0.028;
  }

  /* ===== THANG D/H chung: S48, S50, S54 ===== */
  var wDH=Math.max(W(t,'S48',0.4), W(t,'S50',0.4), W(t,'S54',0.4));
  if(wDH>0.003){
    setGroupOp(gDH,wDH);
    var isS48=inSc(t,'S48'), isS50=inSc(t,'S50'), isS54=inSc(t,'S54');
    /* --- S48: ba mốc — nền, nước biển, 67P; 67P TRƯỢT VÀO một lần rồi ĐỨNG --- */
    setGroupOp(mkBase, wDH*(isS48||isS54?1:0.5));
    setGroupOp(mkSea,  wDH*(isS48?1:0));
    setGroupOp(seaLine, wDH*(isS50||isS54?1:0.0));
    var s67on = isS48 ? smooth(pr01(t,SC.S48[0]+2.2,SC.S48[0]+4.2)) : (isS50?0.30:0);
    setGroupOp(mk67P, wDH*s67on);
    /* mốc 67P trượt vào vị trí MỘT LẦN rồi đứng yên */
    mk67P.position.x = lerp(dhX(5.3e-4)+12.0, dhX(5.3e-4), s67on);
    /* vùng ×3 tô sáng */
    x3Band.material.opacity = (isS48? smooth(pr01(t,SC.S48[0]+5.0,SC.S48[0]+6.5))*0.11 : 0)*wDH;
    x3Lab.material.opacity  = (isS48? smooth(pr01(t,SC.S48[0]+5.0,SC.S48[0]+6.5))*0.76 : 0)*wDH;
    /* --- S50: 6–8 mốc sao chổi PHÂN TÁN, nảy vào LẦN LƯỢT, KHÔNG theo thứ tự.
     *    KHÔNG đường trung bình, KHÔNG vùng kết luận. --- */
    var order=[3,0,6,5,1,7,2,4];
    for(var i=0;i<cometMarks.length;i++){
      var oi=order[i];
      var on = isS50 ? smooth(pr01(t, SC.S50[0]+0.8+i*0.62, SC.S50[0]+1.5+i*0.62)) : 0;
      setGroupOp(cometMarks[oi], wDH*on);
      /* nảy vào: lệch y rồi ổn định */
      cometMarks[oi].position.y = cometMarks[oi].userData.baseY==null
        ? (cometMarks[oi].userData.baseY=cometMarks[oi].position.y)
        : cometMarks[oi].userData.baseY;
      cometMarks[oi].position.y = cometMarks[oi].userData.baseY + (1-on)*2.4;
    }
    setGroupOp(gDH.userData.note, wDH*(isS50? smooth(pr01(t,SC.S50[0]+4.5,SC.S50[1]-0.5)) : 0));
    setGroupOp(cometLab, wDH*((isS50||isS54)?0.9:0));
    /* --- S54: graph TỔNG KẾT — 4 nhóm, vạch nước biển đi qua ĐÚNG GIỮA
     *    cụm chondrite. Đó là toàn bộ nội dung shot. --- */
    var chonOn = isS54 ? smooth(pr01(t,SC.S54[0]+1.0,SC.S54[0]+3.0)) : 0;
    for(var i=0;i<chonMarks.length;i++) setGroupOp(chonMarks[i], wDH*chonOn);
    setGroupOp(gDH.userData.chonLab, wDH*chonOn);
    for(var i=0;i<cometMarks.length;i++)
      if(isS54) setGroupOp(cometMarks[i], wDH*0.75);
    cloudBandDH.material.opacity=(isS54? smooth(pr01(t,SC.S54[0]+3.0,SC.S54[0]+4.5))*0.13 : 0)*wDH;
    setGroupOp(cloudBandLab, wDH*(isS54? smooth(pr01(t,SC.S54[0]+3.0,SC.S54[0]+4.5)) : 0));
    /* TĨNH TUYỆT ĐỐI */
    camera.fov=46; camera.position.set(0,1.2,27); camera.lookAt(0,1.2,0);
    vigLens=0.34; grain=0.022;
  }

  /* --- S49: danh sách ứng viên, "sao chổi" BỊ GẠCH --- */
  var wCa=W(t,'S49',0.35);
  if(wCa>0.003){
    setGroupOp(gCand,wCa);
    /* gạch chéo nét MẢNH, ROCK_GREY sáng — không đỏ chói, không kịch tính */
    var k=smooth(pr01(t,SC.S49[0]+0.8,SC.S49[0]+2.2));
    gCand.userData.strike.scale.x=Math.max(k,0.001);
    gCand.userData.strike.material.opacity=k*0.68*wCa;
    camera.fov=46; camera.position.set(0,0.4,27); camera.lookAt(0,0.4,0);
    vigLens=0.38; grain=0.024;
  }

  /* --- S50 mở đầu: dấu gạch vừa rồi MỜ NHẠT đi (chưa chắc đã đúng) --- */
  if(inSc(t,'S50') && ts(t,'S50')<2.2){
    var fadeS=1-smooth(pr01(t,SC.S50[0],SC.S50[0]+2.0));
    setGroupOp(gCand, fadeS*0.8);
    gCand.userData.strike.material.opacity=fadeS*0.68;
  }

  /* --- S51: hai nguồn hơi TRỘN, chỉ số KHÔNG hội tụ --- */
  var wMx=W(t,'S51',0.35);
  if(wMx>0.003){
    setGroupOp(gMix,wMx);
    gMix.children.forEach(function(c){
      if(c.userData&&c.userData.mat&&c.userData.mat.uniforms&&c.userData.mat.uniforms.uT)
        c.userData.mat.uniforms.uT.value=t;
      if(c.material&&c.material.uniforms&&c.material.uniforms.uT) c.material.uniforms.uT.value=t;
    });
    gMix.userData.dustMat.uniforms.uT.value=t;
    /* chỉ số DAO ĐỘNG trong một DẢI, TUYỆT ĐỐI không dừng ở một giá trị */
    var osc=Math.sin(t*1.6)*0.55+Math.sin(t*2.7+1.1)*0.30+Math.sin(t*4.3)*0.15;
    gMix.userData.needle.position.x=osc*3.0;
    setLiveNumber(mixNum, (3.1+osc*1.35).toFixed(2)+' ×10⁻⁴', 72);
    mixNum.material.opacity=0.80*wMx;
    /* camera hơi LẮC RẤT KHẼ (bất ổn) — biên độ nhỏ, hàm sin của t */
    camera.fov=42;
    camera.position.set(Math.sin(t*1.35)*0.30, 3.4+Math.sin(t*1.05)*0.22, 27);
    camera.lookAt(Math.sin(t*0.9)*0.16, 3.0, 0);
    vigLens=0.46; grain=0.032;
  }

  /* --- S52: chondrite cắt đôi lộ chondrule --- */
  var wCh=W(t,'S52',0.4);
  if(wCh>0.003){
    setGroupOp(gChon,wCh);
    var u=gChon.userData;
    u.h1.material.uniforms.uT.value=t; u.h1.material.uniforms.uOp.value=wCh;
    u.cutMat.uniforms.uT.value=t;
    u.cutMat.uniforms.uOp.value=wCh;
    /* orbit chậm rồi CẮT LỚP MỞ RA */
    var open=smooth(pr01(t,SC.S52[0]+5.5,SC.S52[1]-1.0));
    u.h1.position.set(-open*3.6,0,0); u.h2.position.set(open*3.6,0,0);
    u.h1.rotation.set(0.2, t*0.07, 0.1);
    u.h2.rotation.set(0.2, t*0.07+Math.PI, 0.1);
    u.c1.position.set(-open*3.6+0.02,0,0); u.c1.rotation.y=Math.PI/2+0.001;
    u.c2.position.set( open*3.6-0.02,0,0); u.c2.rotation.y=-Math.PI/2;
    u.c1.material.opacity=open; u.c2.material.opacity=open;
    setGroupOp(u.c1, open*wCh); setGroupOp(u.c2, open*wCh);
    /* mạch khoáng NGẬM NƯỚC phát sáng ICE_CYAN RẤT YẾU */
    u.cutMat.uniforms.uVein.value=smooth(pr01(t,SC.S52[0]+8.0,SC.S52[1]))*open;
    u.lab.material.opacity=0.76*smooth(pr01(t,SC.S52[0]+8.5,SC.S52[1]))*wCh;
    var a=0.3+Math.sin(t*0.06)*0.35;
    camera.fov=44;
    camera.position.set(Math.sin(a)*18, 2.2, Math.cos(a)*18);
    camera.lookAt(0,-0.4,0);
    vigLens=0.46; grain=0.028;
  }

  /* --- S53: Nam Cực → sa mạc → vệt lửa rơi (3 hình match-cut) --- */
  var wFi=W(t,'S53',0.3);
  if(wFi>0.003){
    setGroupOp(gFind,wFi);
    findMat.uniforms.uT.value=t;
    findMat.uniforms.uOp.value=1.0;
    var k=loc(t,'S53');
    var mode = k<0.40?0 : (k<0.72?1:2);
    findMat.uniforms.uMode.value=mode;
    findMat.uniforms.uK.value = mode===2 ? pr01(k,0.72,1.0) : 0;
    camera.position.set(0,0,10); camera.lookAt(0,0,0);
    /* ⚠ shot SÁNG NHẤT tập — hạ exposure để băng không vượt 0.85 */
    expo = mode===0 ? 0.90 : 1.02;
    vigLens = mode===0 ? 0.58 : 0.46;
    grain=0.030;
  }

  /* --- S55: sao chổi kitsch MỜ TAN → đàn đá đen lặng lẽ --- */
  var wSw=W(t,'S55',0.4);
  if(wSw>0.003){
    setGroupOp(gSwap,wSw);
    var u=gSwap.userData;
    u.kitsch.uniforms.uT.value=t;
    /* phép thay thế xảy ra TẠI CHỖ */
    var sw=smooth(pr01(t,SC.S55[0]+3.0,SC.S55[0]+7.0));
    u.kitsch.uniforms.uOp.value=(1-sw)*wSw;
    u.mat.uniforms.uOp.value=sw*wSw;
    var d=u.dummy;
    for(var i=0;i<u.arr.length;i++){
      var a=u.arr[i];
      /* đàn đá BAY TỚI */
      d.position.set(a.p.x, a.p.y, a.p.z + lerp(-60,0,sw)*a.dr);
      d.rotation.set(a.r.x+t*a.sp, a.r.y+t*a.sp*0.8, a.r.z);
      d.scale.setScalar(a.s);
      d.updateMatrix(); u.im.setMatrixAt(i,d.matrix);
    }
    u.im.instanceMatrix.needsUpdate=true;
    camera.fov=48; camera.position.set(0,1.0,34); camera.lookAt(0,0,0);
    vigLens=0.48; grain=0.030;
  }

  /* --- S56: trục thời gian, phân tử DO DỰ quanh vạch, KHÔNG dừng --- */
  var wAx=W(t,'S56',0.4);
  if(wAx>0.003){
    setGroupOp(gAxis,wAx);
    axisKey.intensity=4.2; axisRim.intensity=2.4;
    axisMol.rotation.y=t*0.12;
    setBond(axisMol,(0.90+Math.sin(t*2.0)*0.05)*wAx);
    /* trượt lên rồi xuống quanh vạch: sin biên độ GIẢM DẦN nhưng KHÔNG DỪNG */
    var k=ts(t,'S56');
    var amp=lerp(3.4,0.85, smooth(clamp(k/11.0,0,1)));
    axisMol.position.set(2.6, Math.sin(k*0.72)*amp, 0);
    camera.fov=42; camera.position.set(0,0,22); camera.lookAt(0,0,0);
    vigLens=0.40; grain=0.026;
  }

  /* --- S57/S58/S59: ĐĨA TIỀN HÀNH TINH --- */
  var wDk=WR(t,'S57','S59',0.4);
  if(wDk>0.003){
    setGroupOp(gDisk,wDk);
    diskMat.uniforms.uT.value=t;
    diskMat.uniforms.uOp.value=1.0;
    diskTop.material.uniforms.uT.value=t;
    diskTop.material.uniforms.uOp.value=1.0;
    youngStar.material.uniforms.uT.value=t;
    /* ngôi sao trẻ: emissive 1.8–2.2, nguồn sáng THẬT, được bloom mạnh */
    youngStar.material.uniforms.uE.value=2.0;
    youngStar.material.uniforms.uOp.value=wDk;
    starGlow.material.opacity=0.42*wDk;
    /* làn sóng PHÁ HUỶ lan từ trong ra ngoài (chỉ S59) */
    var dest = inSc(t,'S59') ? lerp(-0.12, 1.25, smooth(pr01(t,SC.S59[0]+0.5,SC.S59[1]-2.5))) : -1.0;
    diskMat.uniforms.uDestroy.value=dest;
    diskTop.material.uniforms.uDestroy.value=dest;
    if(inSc(t,'S57')){
      /* từ TRÊN CAO hạ dần xuống GẦN MẶT PHẲNG đĩa — liên tục, KHÔNG cắt */
      var k=smooth(loc(t,'S57'));
      var a=0.4+ts(t,'S57')*0.012;
      var dd=lerp(150,86,k);
      camera.fov=46;
      camera.position.set(Math.sin(a)*dd, lerp(118,9.5,k), Math.cos(a)*dd);
      camera.lookAt(0,0,0);
    } else if(inSc(t,'S58')){
      /* dolly-in MẠNH vào vùng trong, rung nhẹ (biên độ nhỏ, hàm của t) */
      var k=smooth(loc(t,'S58'));
      var sh=Math.sin(t*9.3)*0.35*k, sh2=Math.cos(t*7.7)*0.28*k;
      camera.fov=lerp(46,54,k);
      camera.position.set(lerp(60,16,k)+sh, lerp(9,3.2,k)+sh2, lerp(52,12,k));
      camera.lookAt(sh*0.5,0,0);
      setGroupOp(gDisk, wDk*(1-k*0.55));
    } else {
      /* S59: pull-back từ vùng trong ra TOÀN ĐĨA */
      var k=smooth(loc(t,'S59'));
      camera.fov=lerp(54,50,k);
      camera.position.set(lerp(16,30,k), lerp(3.2,58,k), lerp(12,132,k));
      camera.lookAt(0,0,0);
    }
    /* vùng nóng <12% khung đã được kiểm soát bằng bán kính trong + vignette */
    vigLens=0.62; grain=0.030;
  }

  /* --- S58: UV XÉ LIÊN KẾT — đảo ngược của S07 --- */
  var wUV=W(t,'S58',0.35);
  if(wUV>0.003){
    setGroupOp(gUVbg,wUV);
    uvBgMat.uniforms.uT.value=t;
    uvBgMat.uniforms.uOp.value=1.0;
    setGroupOp(gUV,wUV);
    uvKey.intensity=9; uvRim.intensity=5;
    var K=loc(t,'S58');
    for(var i=0;i<uvMols.length;i++){
      var m=uvMols[i], brk=m.userData.brk;
      m.rotation.y=t*0.12+i;
      var bk=clamp((K-brk)/0.10,0,1);
      /* tia UV bắn tới ngay trước lúc xé */
      var rayK=band(K, brk-0.07, brk+0.03, 0.035);
      uvRays[i].material.opacity=rayK*0.85*wUV;
      /* hai ống liên kết ĐỨT */
      setBond(m, (1-bk)*0.92*wUV);
      /* ba quả cầu VĂNG RA rời nhau */
      var half=HOH/2;
      var base=[new THREE.Vector3(Math.sin(half),Math.cos(half),0).multiplyScalar(1.86*0.90),
                new THREE.Vector3(-Math.sin(half),Math.cos(half),0).multiplyScalar(1.86*0.90)];
      for(var h=0;h<2;h++)
        m.userData.h[h].position.copy(base[h]).add(m.userData.dirs[h].clone().multiplyScalar(bk*bk*16));
      m.userData.o.position.copy(m.userData.dirs[2].clone().multiplyScalar(bk*bk*7));
      m.userData.matO.emissiveIntensity=0.55*(1-bk*0.7);
    }
    /* ⚠ vùng sáng nóng <12% khung — phần còn lại giữ TỐI */
    camera.fov=46;
    var sh=Math.sin(t*9.3)*0.30, sh2=Math.cos(t*7.7)*0.22;
    camera.position.set(sh, sh2, lerp(30,21,smooth(K)));
    camera.lookAt(sh*0.5,sh2*0.5,0);
    vigLens=0.74; grain=0.038;
  } else {
    /* trả phân tử UV về nguyên trạng ngoài shot */
    for(var i=0;i<uvMols.length;i++){
      var m=uvMols[i], half=HOH/2;
      m.userData.h[0].position.set(Math.sin(half),Math.cos(half),0).multiplyScalar(1.86*0.90);
      m.userData.h[1].position.set(-Math.sin(half),Math.cos(half),0).multiplyScalar(1.86*0.90);
      m.userData.o.position.set(0,0,0);
    }
  }

  /* --- S59 kết: TIẾNG GẦM CẮT ĐỘT NGỘT — hard-cut về ĐEN + im lặng ~1s --- */
  if(inSc(t,'S59') && t>SC.S59[1]-1.1){
    for(var i=0;i<ALL_GROUPS.length;i++) ALL_GROUPS[i].visible=false;
    expo=0.0;
  }

  /* --- S60–S63: CLEEVES 2014 --- */
  var wCl=W(t,'S60',0.35);
  if(wCl>0.003){
    setGroupOp(gCleavesA,wCl);
    /* sơ đồ đĩa XOAY 180° MỘT LẦN rồi DỪNG */
    var k=smooth(pr01(t,SC.S60[0]+2.0,SC.S60[0]+5.5));
    cleavesFlip.rotation.y=k*Math.PI;
    camera.fov=46; camera.position.set(5.0,0.4,30); camera.lookAt(5.0,0,0);
    vigLens=0.38; grain=0.024;
  }
  var wCn=W(t,'S61',0.35);
  if(wCn>0.003){
    setGroupOp(gChain,wCn);
    var u=gChain.userData;
    /* van ION gần đóng → các khâu chạy CHẬM DẦN thấy rõ */
    var close=smooth(pr01(t,SC.S61[0]+3.0,SC.S61[0]+7.0));
    u.valveIon.rotation.z=lerp(0, Math.PI/2*0.86, close);
    u.valveT.rotation.z=0;
    /* tốc độ khâu TỈ LỆ với độ mở van ion */
    var spd=lerp(1.0,0.10,close);
    for(var i=0;i<u.arrows.length;i++){
      var ar=u.arrows[i];
      var ph=fract01(t*0.36*spd + i*0.21);
      ar.pd.position.x=lerp(ar.x0,ar.x1,ph);
      ar.pd.material.opacity=0.9*wCn;
    }
    camera.fov=46; camera.position.set(-1.0,0.6,30); camera.lookAt(-1.0,0.6,0);
    vigLens=0.38; grain=0.024;
  }
  var wIn=W(t,'S62',0.35);
  if(wIn>0.003){
    setGroupOp(gIon,wIn);
    var u=gIon.userData;
    /* tia vũ trụ từ ngoài rìa BỊ GIÓ SAO BẺ CONG và CHẶN — chỉ một phần lọt */
    for(var i=0;i<u.rays.length;i++){
      var r=u.rays[i];
      var ph=fract01(t*0.19 + i*0.137);
      var pass = (i%5===0);      /* chỉ ~20% lọt vào đĩa */
      var x=lerp(-16, pass?12:-5.2, ph);
      var bend = pass?0 : Math.pow(ph,2.2)*2.4;
      r.m.position.set(x, r.y*0.62 - bend*Math.sign(r.y||1), 0);
      r.m.rotation.z = pass?0 : -0.4*ph;
      r.m.material.opacity=(pass?0.60:0.34)*(1-Math.pow(ph,3))*wIn;
    }
    u.shield.material.opacity=0.34*wIn*(0.85+0.15*Math.sin(t*1.4));
    /* thanh TỔNG dâng lên rồi DỪNG RÕ DƯỚI vạch ngưỡng */
    var fill=smooth(pr01(t,SC.S62[0]+5.0,SC.S62[0]+10.5))*0.52;   /* dừng ở 52% vs ngưỡng 86% */
    u.total.scale.x=Math.max(22.0*fill,0.01);
    u.total.position.x=-11.0+22.0*fill/2;
    camera.fov=46; camera.position.set(0,0.2,27); camera.lookAt(0,0.2,0);
    vigLens=0.38; grain=0.024;
  }
  var wRn=W(t,'S63',0.35);
  if(wRn>0.003){
    setGroupOp(gRun,wRn);
    var u=gRun.userData;
    /* đồng hồ quay NHANH tới 1 triệu năm rồi DỪNG */
    var run=smooth(pr01(t,SC.S63[0]+1.0,SC.S63[0]+7.0));
    u.hand.rotation.z=-run*62.0;
    u.hand.position.set(Math.cos(-run*62.0)*0.85, Math.sin(-run*62.0)*0.85, 0);
    /* thanh sản lượng: đường BÃO HOÀ, phẳng ra SỚM */
    var sat=1-Math.exp(-run*4.2);
    var w=17.0*sat*0.56;      /* đỉnh dừng ở 56% vs vạch đại dương 90% */
    u.prod.scale.x=Math.max(w,0.01);
    u.prod.position.x=-8.5+w/2;
    /* khoảng THIẾU HỤT tô sáng ICE_CYAN */
    var gapOn=smooth(pr01(t,SC.S63[0]+8.0,SC.S63[0]+11.0));
    var gx0=-8.5+w, gx1=-8.5+17.0*0.90;
    u.gap.scale.x=Math.max(gx1-gx0,0.01);
    u.gap.position.x=(gx0+gx1)/2;
    u.gap.material.opacity=gapOn*0.24*wRn;
    u.gapLab.material.opacity=gapOn*0.76*wRn;
    camera.fov=46; camera.position.set(0,0.6,26); camera.lookAt(0,0.4,0);
    vigLens=0.38; grain=0.024;
  }

  /* --- S64: khối cầu đại dương chia DẢI 30–50% --- */
  var wOc=W(t,'S64',0.4);
  if(wOc>0.003){
    setGroupOp(gOcean,wOc);
    oceanBall.material.uniforms.uT.value=t;
    oceanBall.material.uniforms.uOp.value=wOc;
    oceanBall.material.uniforms.uSplit.value=smooth(pr01(t,SC.S64[0]+1.0,SC.S64[0]+3.5));
    /* ORBIT chậm để thấy tỉ lệ phân chia là THẬT (khối, không phải hình phẳng) */
    var a=0.2+ts(t,'S64')*0.085;
    camera.fov=44;
    camera.position.set(Math.sin(a)*24, 2.2, Math.cos(a)*24);
    camera.lookAt(0,-3.2,0);
    vigLens=0.42; grain=0.024;
  }

  /* --- S65: chuỗi SỐNG SÓT — ra rìa đĩa rồi KẾT TỤ theo bậc --- */
  var wSv=W(t,'S65',0.4);
  if(wSv>0.003){
    setGroupOp(gSurv,wSv);
    var u=gSurv.userData;
    u.mat.uniforms.uT.value=t;
    u.mat.uniforms.uOp.value=1.0;
    u.mat.uniforms.uD.value=1.0;
    /* kết tụ theo BẬC: bụi → sỏi → đá → tiểu hành tinh */
    var K=loc(t,'S65');
    var agg=smooth(clamp((K-0.35)/0.55,0,1));
    var d=u.dummy;
    for(var i=0;i<u.arr.length;i++){
      var a=u.arr[i], c=u.cores[a.grp];
      /* hội tụ về hạt nhân kết tụ theo bậc */
      var pos=a.p.clone().lerp(c, agg*0.94);
      pos.x+=Math.sin(t*0.3+i)*0.4*(1-agg);
      d.position.copy(pos);
      d.rotation.set(a.r.x+t*a.sp, a.r.y+t*a.sp*0.7, a.r.z);
      d.scale.setScalar(a.s*lerp(1.0,1.9,agg));
      d.updateMatrix(); u.im.setMatrixAt(i,d.matrix);
    }
    u.im.instanceMatrix.needsUpdate=true;
    u.lab.material.opacity=0.76*smooth(pr01(t,SC.S65[0]+5.0,SC.S65[1]-2.0))*wSv;
    /* dolly LIÊN TỤC dọc bán kính đĩa từ TRONG RA NGOÀI, rồi pull-back (tỉ lệ) */
    camera.fov=lerp(44,52,agg);
    camera.position.set(lerp(-26,6,smooth(clamp(K/0.35,0,1))), lerp(6,22,agg), lerp(30,78,agg));
    camera.lookAt(0,0,0);
    /* nền: đĩa vùng ngoài rất tối */
    setGroupOp(gDisk, 0);
    diskMat.uniforms.uT.value=t; diskMat.uniforms.uOp.value=1.0;
    diskMat.uniforms.uDestroy.value=-1.0;
    diskTop.material.uniforms.uT.value=t; diskTop.material.uniforms.uOp.value=1.0;
    diskTop.material.uniforms.uDestroy.value=-1.0;
    youngStar.material.uniforms.uOp.value=0;
    starGlow.material.opacity=0;
    vigLens=0.52; grain=0.028;
  }

  /* --- S66: tảng đá lao xuống hành tinh magma, CẮT TRƯỚC va chạm --- */
  var wMg=W(t,'S66',0.3);
  if(wMg>0.003){
    setGroupOp(gMagma,wMg);
    magmaBall.material.uniforms.uT.value=t;
    magmaBall.material.uniforms.uOp.value=wMg;
    magmaBall.material.uniforms.uCool.value=0;
    magmaBall.rotation.y=t*0.008;
    var K=loc(t,'S66');
    /* tảng đá: silhouette ĐEN, chỉ rìa dưới bắt sáng từ hành tinh */
    rockFall.position.set(lerp(2.0,0.6,K), lerp(24,-2.0,eOut(K*1.05)), lerp(6,0,K));
    rockFall.rotation.set(t*0.22, t*0.15, t*0.09);
    rockFall.scale.setScalar(lerp(0.45,1.25,K));
    rockFall.material.uniforms.uOp.value=wMg;
    /* theo sau tảng đá (tracking từ PHÍA SAU), lao xuống, rồi CẮT */
    camera.fov=lerp(46,56,K);
    camera.position.set(rockFall.position.x+1.2, rockFall.position.y+7.0, rockFall.position.z+13.0);
    camera.lookAt(rockFall.position.x, rockFall.position.y-5.0, rockFall.position.z);
    /* hard-cut sang ĐEN 0.4s trước khi mở ra hơi nước */
    if(t>SC.S66[1]-0.42) expo=0.0;
    vigLens=0.92; grain=0.034;
  }

  /* --- S67: hơi nước → mây → MƯA hàng nghìn năm --- */
  var wRe=W(t,'S67',0.3);
  if(wRe>0.003 && t>SC.S66[1]-0.02){
    setGroupOp(gRainEra,wRe);
    rainEraMat.uniforms.uT.value=t;
    rainEraMat.uniforms.uOp.value=1.0;
    rainEraMat.uniforms.uK.value=smooth(loc(t,'S67'));
    camera.position.set(0,0,10); camera.lookAt(0,0,0);
    vigLens=0.46; grain=0.030;
  }

  /* =====================================================================
   * CHƯƠNG 4 — S68–S84
   * ===================================================================== */
  /* --- S68 cuối: con số 8×10²⁴ hiện RẤT MẢNH rồi TỰ MỜ ĐI ngay --- */
  /* (dựng trong khối gRoom ở renderAtTime; nhãn thêm ở đây) */

  /* --- S69: biển phân tử trong cốc --- */
  var wS2=W(t,'S69',0.4);
  if(wS2>0.003){
    setGroupOp(gSea2,wS2);
    gSea2.userData.mat.uniforms.uT.value=t;
    gSea2.userData.mat.uniforms.uOp.value=1.0;
    chosenKey.intensity=3.8; chosenRim.intensity=2.4;
    /* dolly-in xuyên mặt nước rồi TRÔI LƠ LỬNG giữa đám phân tử */
    var K=smooth(loc(t,'S69'));
    camera.fov=lerp(40,48,K);
    camera.position.set(Math.sin(t*0.05)*1.6, lerp(16,0.6,K), lerp(52,10,K));
    camera.lookAt(0,0,0);
    /* MỘT phân tử sáng được CHỌN, camera khoá vào nó ở cuối shot */
    var lock=smooth(pr01(t,SC.S69[1]-3.5,SC.S69[1]));
    chosenMol.position.set(lerp(6.0,0,lock), lerp(-3.0,0,lock)+Math.sin(t*0.6)*0.3, lerp(-6,3.5,lock));
    chosenMol.rotation.y=t*0.16;
    setBond(chosenMol,(0.92+Math.sin(t*2.2)*0.05)*wS2*lock);
    setGroupOp(chosenMol, wS2*lock);
    vigLens=0.52; grain=0.026;
  }

  /* --- S70/S71: HỒI KÝ — phân tử CỐ ĐỊNH giữa khung, thế giới đổi quanh nó */
  var wMem=WR(t,'S70','S71',0.4);
  if(wMem>0.003){
    setGroupOp(gMemory,wMem);
    memBgMat.uniforms.uT.value=t;
    memBgMat.uniforms.uOp.value=1.0;
    /* S70: 4 bối cảnh (tiểu hành tinh, hành tinh cháy, mây, mưa) —
     *      vòng mây-mưa TĂNG TỐC tới chóng mặt.
     * S71: 6 bối cảnh; cảnh BĂNG NÚI giữ LÂU NHẤT rồi tan chậm. */
    var sIdx=0, sMix=0;
    if(inSc(t,'S70')){
      var K=loc(t,'S70');
      if(K<0.58){
        var k4=K/0.58*3.0;    /* 0→3: 4 bối cảnh, dissolve NHANH DẦN */
        sIdx=clamp(Math.floor(k4),0,2);
        var fr=k4-sIdx;
        var sharp=lerp(0.42,0.16,K/0.58);   /* nhanh dần */
        sMix=smooth(clamp((fr-(1-sharp))/sharp,0,1));
      } else {
        /* vòng MÂY↔MƯA lặp đủ nhanh để thành một NHỊP ĐẬP */
        var beat=(K-0.58)/0.42;
        var f=lerp(0.55,3.4,beat);
        var osc=0.5-0.5*Math.cos(6.2831*(K-0.58)*12.0*f);
        sIdx=2; sMix=osc;
      }
    } else {
      var K=loc(t,'S71');
      /* 6 bối cảnh: đại dương(4) → tế bào(5) → máu(6) → nhựa(7) → băng(8) → tan(9) */
      /* băng giữ LÂU NHẤT: chia thời gian không đều */
      var segs=[0.0,0.16,0.30,0.42,0.54,0.82,1.0];
      var si=4;
      for(var i=0;i<6;i++) if(K>=segs[i]&&K<segs[i+1]) si=4+i;
      var i0=si-4;
      var fr=(K-segs[i0])/(segs[i0+1]-segs[i0]);
      sIdx=si; sMix=smooth(clamp((fr-0.80)/0.20,0,1));
      if(si>=9){ sIdx=9; sMix=0; }
    }
    memBgMat.uniforms.uScene.value=clamp(sIdx,0,8);
    memBgMat.uniforms.uMix.value=sMix;
    /* phân tử NEO: luôn cố định GIỮA khung, KHÔNG đổi hình/màu suốt shot */
    setGroupOp(gMol, wMem);
    gMol.position.set(0,0,0);
    molecule.rotation.y=t*0.14;
    molecule.rotation.x=Math.sin(t*0.08)*0.18;
    setBond(molecule,(0.92+Math.sin(t*2.0)*0.05)*wMem);
    molKey.intensity=4.6; molRim.intensity=2.9;
    molKey.position.set(5,6,7); molRim.position.set(-6,-3,-6);
    camera.fov=42; camera.position.set(0,0,10.5); camera.lookAt(0,0,0);
    vigLens=0.46; grain=0.028;
  }

  /* --- S73: silhouette người, nước chảy XUYÊN QUA --- */
  var wBd=W(t,'S73',0.4);
  if(wBd>0.003){
    setGroupOp(gBody,wBd);
    gBody.userData.mat.uniforms.uT.value=t;
    gBody.userData.mat.uniforms.uOp.value=1.0;
    /* pull-back cuối shot để lộ các "chặng" khác */
    var k=smooth(pr01(t,SC.S73[1]-3.0,SC.S73[1]));
    camera.fov=lerp(46,54,k);
    camera.position.set(lerp(0,3,k),lerp(0,1,k),lerp(30,44,k));
    camera.lookAt(0,0,0);
    vigLens=0.46; grain=0.026;
  }

  /* --- S74/S75: vòng tuần hoàn; các nút TẮT DẦN, dòng hạt Ở LẠI --- */
  var wCy=WR(t,'S74','S75',0.4);
  if(wCy>0.003){
    setGroupOp(gCycle,wCy);
    gCycle.userData.mat.uniforms.uT.value=t;
    /* ⚠ mật độ và tốc độ hạt KHÔNG ĐỔI trước và sau khi nút tắt */
    gCycle.userData.mat.uniforms.uOp.value=1.0;
    /* S75: bốn nút tắt LẦN LƯỢT */
    for(var i=0;i<cycleNodes.length;i++){
      var off = inSc(t,'S75') ? smooth(pr01(t, SC.S75[0]+1.2+i*1.5, SC.S75[0]+2.6+i*1.5)) : 0;
      setGroupOp(cycleNodes[i], wCy*(1-off));
    }
    if(inSc(t,'S74')){
      var k=smooth(loc(t,'S74'));
      var a=0.15+ts(t,'S74')*0.028;
      camera.fov=lerp(50,46,k);
      camera.position.set(Math.sin(a)*lerp(46,34,k), lerp(14,7,k), Math.cos(a)*lerp(46,34,k));
      camera.lookAt(0,0,0);
    } else {
      camera.fov=46; camera.position.set(0,5.0,34); camera.lookAt(0,0,0);
    }
    vigLens=0.46; grain=0.026;
  }

  /* --- S76/S77/S81: mưa đêm → một giọt → macro mu bàn tay --- */
  var wRa=W(t,'S76',0.35);
  if(wRa>0.003){
    setGroupOp(gRain,wRa);
    rainMat.uniforms.uT.value=t;
    rainMat.uniforms.uOp.value=1.0;
    /* tilt-down từ bầu trời mưa xuống, rồi dolly-in bám MỘT giọt duy nhất */
    var K=loc(t,'S76');
    rainMat.uniforms.uFocus.value=smooth(clamp((K-0.30)/0.70,0,1));
    rainMat.uniforms.uDropY.value=K*0.22;
    camera.position.set(0,0,10); camera.lookAt(0,0,0);
    vigLens=0.48; grain=0.030;
  }
  var wHd=Math.max(W(t,'S77',0.3), W(t,'S81',0.3));
  if(wHd>0.003){
    setGroupOp(gHand,wHd);
    handMat2.uniforms.uT.value=t;
    handMat2.uniforms.uOp.value=1.0;
    if(inSc(t,'S77')){
      /* macro 100mm tĩnh; slow-motion ở khoảnh khắc chạm.
       * Biến dạng ĐÚNG VẬT LÝ: dẹt ra, dội lại một lần rất nhỏ, rồi VÒM. */
      handMat2.uniforms.uImpact.value=clamp(loc(t,'S77')*1.5,0,1);
      handMat2.uniforms.uSlide.value=0;
    } else {
      /* S81: ĐÚNG khung S77; giọt mất cân bằng và TRƯỢT, có ma sát */
      handMat2.uniforms.uImpact.value=1.0;
      var sl=smooth(pr01(t,SC.S81[0]+1.2,SC.S81[1]));
      /* chuyển động CHẬM, có ma sát — không rơi tự do */
      handMat2.uniforms.uSlide.value=Math.pow(sl,1.35);
    }
    camera.position.set(0,0,10); camera.lookAt(0,0,0);
    vigLens=0.46; grain=0.028;
  }

  /* --- S78: bên trong giọt — 1 km vs quãng đường THẬT --- */
  var wDs=W(t,'S78',0.4);
  if(wDs>0.003){
    setGroupOp(gDist,wDs);
    /* ⚠ TUYỆT ĐỐI IM LẶNG về mặt hình — chỉ một đường dài ra rồi mờ đi */
    gDist.userData.m2.uniforms.uP.value=smooth(pr01(t,SC.S78[0]+3.0,SC.S78[1]-1.5));
    gDist.userData.m2.uniforms.uOp.value=wDs;
    camera.fov=46; camera.position.set(2.0,0,30); camera.lookAt(2.0,0,0);
    vigLens=0.44; grain=0.022;
  }

  /* --- S79: TRỞ LẠI CHÍNH XÁC S26 — cú khép vòng quan trọng nhất --- */
  var wR79=W(t,'S79',0.5);
  if(wR79>0.003){
    setGroupOp(gStage,wR79);
    surfMat.uniforms.uT.value=t;
    surfMat.uniforms.uOp.value=1.0;
    surfMat.uniforms.uIce.value=0.28;     /* GIỐNG HỆT S30/S26 */
    surfMat.uniforms.uHeat.value=0;
    var rS=surfR-0.55, pO3=sphPos(0,0,rS+0.52);
    atomO.position.copy(pO3);
    atomO.userData.mat.uniforms.uOp.value=wR79;
    var hf=HOH/2, up3=pO3.clone().normalize();
    var tg3=new THREE.Vector3(1,0,0).sub(up3.clone().multiplyScalar(up3.x)).normalize();
    var da=up3.clone().multiplyScalar(Math.cos(hf)).add(tg3.clone().multiplyScalar( Math.sin(hf))).normalize();
    var db=up3.clone().multiplyScalar(Math.cos(hf)).add(tg3.clone().multiplyScalar(-Math.sin(hf))).normalize();
    atomH1.position.copy(pO3.clone().add(da.clone().multiplyScalar(0.86)));
    atomH2.position.copy(pO3.clone().add(db.clone().multiplyScalar(0.86)));
    atomH1.userData.mat.uniforms.uOp.value=wR79;
    atomH2.userData.mat.uniforms.uOp.value=wR79;
    var bv=(0.90+Math.sin(t*2.2)*0.05)*wR79;
    var pairs=[[bond1,atomH1],[bond2,atomH2]];
    for(var i=0;i<2;i++){
      var b=pairs[i][0], h=pairs[i][1];
      var dd=h.position.clone().sub(pO3);
      b.position.copy(pO3.clone().lerp(h.position,0.5));
      b.scale.set(1,dd.length(),1);
      b.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dd.clone().normalize());
      b.visible=true; b.userData.mat.opacity=bv;
    }
    hopTrail.material.uniforms.uOp.value=0;
    landRing.material.opacity=0;
    /* ĐÚNG khung hình và tiêu cự của S26/S30 */
    camera.fov=34;
    camera.position.set(0, surfR+1.15, 6.4);
    camera.lookAt(0, surfR+0.10, 0);
    vigLens=0.50; grain=0.026;
  }

  /* --- S80: TIMELAPSE 4,6 tỉ năm — pull-back liên tục KHÔNG CẮT --- */
  var wSo=W(t,'S80',0.35);
  if(wSo>0.003){
    setGroupOp(gSolar,wSo);
    var K=loc(t,'S80');
    solarSun.material.uniforms.uT.value=t;
    /* giai đoạn 1: Mặt Trời BẬT SÁNG — cú tăng sáng LỚN NHẤT tập */
    var ignite=smooth(clamp(K/0.18,0,1));
    solarSun.material.uniforms.uE.value=lerp(0.02,2.6,ignite);
    solarSun.material.uniforms.uOp.value=wSo;
    solarGlow.material.opacity=ignite*0.55*wSo;
    var gs=lerp(4,22,ignite); solarGlow.scale.set(gs,gs,1);
    solarLight.intensity=lerp(2,90,ignite);
    /* giai đoạn 2: các HÀNH TINH kết lại; Kepler, CÙNG CHIỀU (ngược kim đồng hồ) */
    var form=smooth(clamp((K-0.16)/0.26,0,1));
    for(var i=0;i<planets.length;i++){
      var p=planets[i];
      /* CÙNG CHIỀU: góc TĂNG dần → nhìn từ +Y (cực Bắc) là ngược kim đồng hồ */
      var ang=p.ph + t*0.30/p.T;
      var rr=p.a*form;
      p.m.position.set(Math.cos(ang)*rr, 0, -Math.sin(ang)*rr);
      p.m.rotation.y=t*0.5;
      p.m.rotation.z=p.tilt;
      p.m.material.opacity=form; p.m.material.transparent=true;
      p.m.visible=form>0.02;
      p.orb.material.opacity=0.34*form*wSo;
      p.orb.visible=form>0.05;
    }
    /* pull-back LIÊN TỤC từ hạt bụi ra toàn hệ Mặt Trời rồi VÀO LẠI Trái Đất */
    var out=smooth(clamp(K/0.62,0,1));
    var back=smooth(clamp((K-0.68)/0.32,0,1));
    var dist=lerp(lerp(7,46,out), 9.0, back);
    var hgt =lerp(lerp(1.6,26,out), 3.0, back);
    /* vào lại Trái Đất: camera bám hành tinh thứ 3 */
    var ep=planets[2].m.position;
    camera.fov=lerp(46,42,back);
    camera.position.set(lerp(Math.sin(0.3)*dist, ep.x*1.55, back), hgt, lerp(dist, ep.z*1.55+4, back));
    camera.lookAt(lerp(0,ep.x,back), 0, lerp(0,ep.z,back));
    /* ⚠ đĩa sáng <12% khung: vignette MẠNH */
    vigLens=lerp(0.52,1.05,ignite);
    grain=0.026;
  }

  /* --- S84: sau khi phân tử ra khỏi khung, GIỮ ĐEN ≥2s --- */
  if(inSc(t,'S84') && ts(t,'S84')>4.2){
    for(var i=0;i<ALL_GROUPS.length;i++) ALL_GROUPS[i].visible=false;
    /* không chữ, không logo, không outro — kết bằng IM LẶNG */
    expo=0.0; vigLens=1.2;
  }

  /* =====================================================================
   * PHỤ ĐỀ · NHÃN CHƯƠNG · HẬU KỲ
   * ===================================================================== */
  HFA.applySubtitle(elSub, CUES, t);
  /* S84 không chữ: tắt phụ đề sau khi lời thoại kết thúc */
  if(t>1089.9) elSub.textContent='';
  HFA.applyChapter(elChap, CHAPS, t, 5.5);

  var fade=HFA.globalFade(t, TOTAL, 1.8, 3.4);
  lens.uniforms.uT.value=t;
  lens.uniforms.uFade.value=fade;
  lens.uniforms.uExposure.value=expo;
  lens.uniforms.uVig.value=vigLens;
  lens.uniforms.uGrain.value=grain;
  lens.uniforms.uCA.value=ca;
  lens.uniforms.uFlash.value=flash;
  /* vignette CSS tắt khi lens vignette đã mạnh (tránh oval sáng giữa khung) */
  if(elVig) elVig.style.opacity = vigLens>0.70 ? '0' : '1';

  camera.updateProjectionMatrix();
  composer.render();
}

/* phần lẻ của số dương — dùng thay cho mod để rõ ý */
function fract01(x){ return x-Math.floor(x); }

/* ---- ĐĂNG KÝ TIMELINE ---------------------------------------------------
 * Dòng dưới phải nằm NGUYÊN DẠNG trong file này: StaticGuard quét VĂN BẢN,
 * giấu vào hàm dùng chung sẽ bị báo thiếu đăng ký và render ra frame tĩnh.
 * Khoá phải trùng ĐÚNG data-composition-id của div gốc.
 */
window.__timelines = window.__timelines || {};
window.__timelines["nuoc-co-hon-mat-troi"] = HFA.makeTimeline("nuoc-co-hon-mat-troi", TOTAL, renderAtTime);

</script>
