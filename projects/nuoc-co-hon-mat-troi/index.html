var diskMat=new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, side:THREE.DoubleSide,
  blending:THREE.AdditiveBlending,
  uniforms:{uT:{value:0},uOp:{value:1},uDestroy:{value:-1.0},uCool:{value:0}},
  vertexShader:[
    'varying vec2 vU; varying vec3 vP; varying float vR;',
    'uniform float uT;',
    'void main(){vU=uv; vec3 p=position; vR=length(p.xz);',
    /* FLARING: đĩa mỏng ở rìa, PHỒNG ở vùng trong (H/R giảm theo R) */
    ' float flare = 2.6*exp(-vR*0.030) + 0.55*pow(vR/62.0,1.25);',
    ' p.y *= flare;',
    ' vP=p;',
    ' gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);}'
  ].join('\n'),
  fragmentShader:[
    'varying vec2 vU; varying vec3 vP; varying float vR;',
    'uniform float uT,uOp,uDestroy,uCool;',
    'float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}',
    'float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);',
    ' return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}',
    'float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*vn(p);p*=2.08;a*=.5;}return s;}',
    'void main(){',
    ' float r=vR; float th=atan(vP.z,vP.x);',
    ' if(r<7.0||r>62.0) discard;',
    ' float u=(r-7.0)/55.0;',
    /* --- VI PHÂN KEPLER: góc quay ∝ r^-1.5 (vòng trong nhanh hơn RÕ) --- */
    ' float omega = 8.0*pow(r,-1.5);',
    ' float phi = th + uT*omega;',
    /* cấu trúc xoắn/hạt */
    ' float tex = fbm(vec2(phi*2.4, r*0.20))*0.62 + fbm(vec2(phi*6.0, r*0.55))*0.28;',
    ' float spiral = 0.5+0.5*sin(phi*2.0 - log(r)*4.2);',
    ' float dens = (0.38+tex*0.9)*(0.6+spiral*0.55);',
    /* mật độ giảm ra ngoài */
    ' dens *= exp(-u*1.55)+0.075;',
    /* --- KHE HỞ do hành tinh non: một vành r≈27 bị khoét --- */
    ' float gap = 1.0 - 0.94*exp(-pow((r-27.0)*0.72,2.0));',
    ' dens *= gap;',
    /* khe thứ hai mảnh hơn */
    ' dens *= 1.0 - 0.58*exp(-pow((r-43.0)*1.25,2.0));',
    /* --- PHÂN TẦNG NHIỆT: trong nóng → giữa ấm → ngoài lạnh --- */
    ' vec3 cHot  = vec3(1.00,0.30,0.05);',   /* DISK_HOT */
    ' vec3 cWarm = vec3(1.00,0.42,0.12);',   /* DUST_WARM */
    ' vec3 cCold = vec3(0.08,0.55,1.00);',   /* ICE_CYAN */
    ' vec3 col;',
    ' if(u<0.10){ col = mix(cHot*1.5, cWarm, smoothstep(0.0,0.10,u)); }',
    ' else if(u<0.40){ col = mix(cWarm, cWarm*0.30, smoothstep(0.10,0.40,u)); }',
    ' else { col = mix(cWarm*0.30, cCold*0.16, smoothstep(0.40,1.0,u)); }',
    /* vùng ngoài rất tối — giữ ≥70% khung dưới 0.3 */
    ' float bright = mix(0.55, 0.030, smoothstep(0.0,0.26,u));',
    ' col *= dens*bright;',
    /* ánh sáng ngôi sao HẮT LÊN MẶT TRÊN đĩa */
    ' col += cWarm*dens*0.05*exp(-u*3.0)*step(0.0,vP.y);',
    /* --- LÀN SÓNG PHÁ HUỶ lan từ trong ra ngoài (S59) --- */
    ' if(uDestroy>=0.0){',
    '   float w=exp(-pow((u-uDestroy)*6.5,2.0));',
    '   col+=vec3(0.30,0.18,1.00)*w*dens*1.1;',
    /* phía sau sóng: vật chất "trẻ", trắng thuần, không còn D */
    '   col=mix(col, vec3(0.30,0.34,0.42)*dens*0.22, smoothstep(uDestroy+0.03,uDestroy-0.10,u));',
    ' }',
    ' col *= (1.0-uCool*0.80);',
    ' float a=clamp(dens*0.72,0.0,1.0);',
    ' col+=(h21(vU*1024.0+fract(uT))-0.5)/255.0;',
    ' gl_FragColor=vec4(col, a*uOp);}'
  ].join('\n')});

 *   S02 ↔ S68 ↔ S82 (căn phòng) · S06 ↔ S72 ↔ S84 (phân tử) ·
 *   S26 ↔ S30 ↔ S79 (phân tử trên hạt bụi) · S77 ↔ S81 (giọt trên mu tay)
 * ========================================================================== */

/* --- S69: biển phân tử trong cốc ---------------------------------------
 * ⚠ mật độ cao dễ CHÁY TRẮNG — clamp alpha tích luỹ, nền dưới 0.5.
 * Tỉ lệ phân tử D_MAGENTA sáng phải HIẾM (vài phần nghìn). */
var gSea2=new THREE.Group(); scene.add(gSea2); gSea2.visible=false;
(function(){
  var N=1400, pr=HFA.mulberry32(690069);
  var pos=new Float32Array(N*3), ph=new Float32Array(N), kind=new Float32Array(N), sd=new Float32Array(N*3);
  for(var i=0;i<N;i++){
    pos[i*3]=(pr()-0.5)*46; pos[i*3+1]=(pr()-0.5)*30; pos[i*3+2]=(pr()-0.5)*40;
    ph[i]=pr()*6.2831;
    /* vài phần nghìn → ~4/1400 sáng. Dùng 6 để mắt bắt được. */
    kind[i]= (i%233===7) ? 1.0 : 0.0;
    sd[i*3]=pr()*2-1; sd[i*3+1]=pr()*2-1; sd[i*3+2]=pr()*2-1;
  }
  var bg=new THREE.BufferGeometry();
  bg.setAttribute('position',new THREE.BufferAttribute(pos,3));
  bg.setAttribute('aPh',new THREE.BufferAttribute(ph,1));
  bg.setAttribute('aK',new THREE.BufferAttribute(kind,1));
  bg.setAttribute('aD',new THREE.BufferAttribute(sd,3));
  var m=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    uniforms:{uT:{value:0},uOp:{value:1}},
    vertexShader:[
      'attribute float aPh,aK;attribute vec3 aD;uniform float uT;varying float vK;varying float vZ;',
      'void main(){vK=aK;',
      ' vec3 j=vec3(sin(uT*1.15+aPh)*aD.x,cos(uT*0.97+aPh*1.3)*aD.y,sin(uT*1.31+aPh*0.7)*aD.z)*1.25;',
      ' vec4 mv=modelViewMatrix*vec4(position+j,1.0);',
      ' vZ=-mv.z;',
      ' gl_PointSize=(aK>0.5?4.6:3.4)*(260.0/-mv.z);',
      ' gl_Position=projectionMatrix*mv;}'
    ].join('\n'),
    fragmentShader:[
      'varying float vK,vZ;uniform float uOp;',
      'void main(){vec2 d=gl_PointCoord-0.5;float r=length(d);',
      ' float a=smoothstep(0.5,0.0,r);',
      /* CLAMP alpha: nền giữ dưới 0.5 luminance, không cộng dồn thành trắng */
      ' vec3 c = vK>0.5 ? vec3(1.00,0.06,0.42)*1.7 : vec3(0.06,0.30,0.55)*1.55;',
      ' float fade=smoothstep(95.0,16.0,vZ);',
      ' float al = a*uOp*(vK>0.5?0.92:0.40)*fade;',
      ' gl_FragColor=vec4(c*a, clamp(al,0.0,0.55));}'
    ].join('\n')});
  gSea2.add(new THREE.Points(bg,m));
  gSea2.userData={mat:m};
})();
/* một phân tử sáng được CHỌN (camera khoá vào nó ở cuối S69) */
var chosenMol=buildWater(0.78, COL.iceCyan, COL.dMagenta); gSea2.add(chosenMol);
var chosenKey=new THREE.PointLight(0xFFD2B0,3.8,44); chosenKey.position.set(4,5,6); gSea2.add(chosenKey);
var chosenRim=new THREE.PointLight(0x148CFF,2.4,44); chosenRim.position.set(-5,-3,-5); gSea2.add(chosenRim);
regOp(gSea2);

/* --- S70/S71: HỒI KÝ của một phân tử ------------------------------------
 * Phân tử luôn CỐ ĐỊNH GIỮA KHUNG; THẾ GIỚI quanh nó thay đổi.
 * Phân tử KHÔNG đổi hình dạng, không đổi màu — đó là điểm neo. */
var gMemory=new THREE.Group(); scene.add(gMemory); gMemory.visible=false;
var memBgMat=new THREE.ShaderMaterial({transparent:true,
  uniforms:{uT:{value:0},uOp:{value:1},uScene:{value:0},uMix:{value:0}},
  vertexShader:'varying vec2 vU;void main(){vU=uv;gl_Position=vec4(position.xy,0.999,1.0);}',
  fragmentShader:[
    'varying vec2 vU;uniform float uT,uOp,uScene,uMix;',
    'float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}',
    'float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);',
    ' return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}',
    'float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*vn(p);p*=2.08;a*=.5;}return s;}',
    /* 10 bối cảnh, vẽ TỐI GIẢN, đơn sắc theo tông lạnh (trừ máu và nhựa cây) */
    'vec3 sc(int m, vec2 uv, vec2 q, float tt){',
    ' if(m==0){ /* lòng tiểu hành tinh: đá tối, mạch khoáng */',
    '   float g=fbm(uv*8.0)*0.6+fbm(uv*22.0)*0.3;',
    '   float vein=1.0-smoothstep(0.0,0.05,abs(fbm(uv*5.0)-0.5));',
    '   return vec3(0.030,0.028,0.026)*(0.4+g*1.4)+vec3(0.08,0.55,1.00)*vein*0.055; }',
    ' if(m==1){ /* hành tinh đang cháy: khe nứt EMBER */',
    '   float c=1.0-smoothstep(0.0,0.06,abs(fbm(uv*6.0+vec2(tt*0.04))-0.5));',
    '   return vec3(0.030,0.018,0.014)+vec3(1.00,0.18,0.02)*c*0.60; }',
    ' if(m==2){ /* mây */',
    '   float cl=fbm(uv*3.4+vec2(tt*0.10,0.0));',
    '   return vec3(0.045,0.060,0.090)*(0.4+pow(clamp(cl,0.0,1.0),1.6)*2.2); }',
    ' if(m==3){ /* mưa */',
    '   float rx=uv.x*120.0; float ci=floor(rx);',
    '   float ry=fract(uv.y*2.0+tt*2.4+h21(vec2(ci,1.0))*7.0);',
    '   float st=smoothstep(0.6,0.0,abs(fract(rx)-0.5)*2.0)*smoothstep(0.75,0.97,ry);',
    '   return vec3(0.016,0.024,0.040)+vec3(0.25,0.52,0.88)*st*step(0.4,h21(vec2(ci,3.0)))*0.30; }',
    ' if(m==4){ /* đại dương chưa có sự sống */',
    '   float w=fbm(vec2(uv.x*7.0+tt*0.28, uv.y*16.0));',
    '   float sea=smoothstep(0.54,0.50,uv.y);',
    '   return mix(vec3(0.014,0.020,0.034), vec3(0.010,0.075,0.100)*(0.5+w*1.3), sea); }',
    ' if(m==5){ /* tế bào đầu tiên tự nhân đôi */',
    '   vec2 c1=vec2(-0.10-sin(tt*0.5)*0.08,0.0), c2=vec2(0.10+sin(tt*0.5)*0.08,0.0);',
    '   float d=min(length(q-c1),length(q-c2));',
    '   float mem=smoothstep(0.22,0.20,d)*smoothstep(0.16,0.19,d);',
    '   float body=smoothstep(0.21,0.19,d);',
    '   return vec3(0.014,0.022,0.030)+vec3(0.08,0.55,1.00)*(mem*0.45+body*0.045); }',
    ' if(m==6){ /* máu một con cá — EMBER RẤT TỐI */',
    '   float f=fbm(vec2(uv.x*5.0-tt*0.5,uv.y*13.0));',
    '   float cell=step(0.72,f);',
    '   return vec3(0.055,0.010,0.012)*(0.5+f*1.1)+vec3(1.00,0.18,0.02)*cell*0.075; }',
    ' if(m==7){ /* nhựa một cái cây — GRAPH_GREEN TỐI */',
    '   float v=1.0-smoothstep(0.0,0.035,abs(fract(uv.x*7.0+fbm(uv*3.0)*1.4)-0.5));',
    '   return vec3(0.014,0.028,0.018)+vec3(0.10,1.00,0.42)*v*0.075; }',
    ' if(m==8){ /* băng đỉnh núi — 10 000 năm, GIỮ LÂU NHẤT */',
    '   float g=fbm(uv*9.0)*0.55+fbm(uv*26.0)*0.3;',
    '   float ridge=smoothstep(0.48,0.56,fbm(vec2(uv.x*3.2,uv.y*2.0)));',
    '   return vec3(0.075,0.105,0.150)*(0.42+g*1.3)*(0.5+ridge*0.9); }',
    ' /* m==9: băng TAN, chảy đi tiếp */',
    ' float fl=fbm(vec2(uv.x*6.0-tt*0.9, uv.y*14.0));',
    ' return vec3(0.020,0.036,0.058)*(0.4+fl*1.6)+vec3(0.08,0.55,1.00)*pow(clamp(fl,0.0,1.0),3.0)*0.12;',
    '}',
    'void main(){vec2 uv=vU; vec2 q=(vU-0.5)*vec2(1.777,1.0);',
    ' int m0=int(uScene); int m1=m0+1;',
    ' vec3 col=mix(sc(m0,uv,q,uT), sc(m1,uv,q,uT), uMix);',
    ' vec2 vq=vU-0.5; col*=1.0-dot(vq,vq)*1.0;',
    ' col+=(h21(vU*1024.0+fract(uT))-0.5)/255.0;',
    ' gl_FragColor=vec4(col,uOp);}'
  ].join('\n')});
gMemory.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),memBgMat));
regOp(gMemory);
/* phân tử neo — dùng gMol (cùng model S06/S72/S84) để motif khớp */

/* --- S73: silhouette người, nước chảy XUYÊN QUA, KHÔNG đọng lại -------- */
var gBody=new THREE.Group(); scene.add(gBody); gBody.visible=false;

  var neck=new THREE.Mesh(new THREE.CylinderGeometry(0.72,0.95,1.2,20),mm);
  neck.position.set(0,3.7,0); gBody.add(neck);
  var torso=new THREE.Mesh(new THREE.CylinderGeometry(2.5,2.0,7.4,28),mm);
  torso.position.set(0,-0.6,0); gBody.add(torso);

  shoulder.position.set(0,2.9,0); shoulder.scale.set(1.25,0.6,0.85); gBody.add(shoulder);
  /* dòng nước particle ICE_CYAN: VÀO ĐỈNH, RA ĐÁY, không hạt nào đọng lại */
  var N=700, pr=HFA.mulberry32(737301);
  var pos=new Float32Array(N*3), ph=new Float32Array(N), sw=new Float32Array(N);
  for(var i=0;i<N;i++){
    pos[i*3]=(pr()-0.5)*7.0; pos[i*3+1]=0; pos[i*3+2]=(pr()-0.5)*5.0;
    ph[i]=pr(); sw[i]=pr()*6.2831;
  }
  var bg=new THREE.BufferGeometry();
  bg.setAttribute('position',new THREE.BufferAttribute(pos,3));
  bg.setAttribute('aPh',new THREE.BufferAttribute(ph,1));
  bg.setAttribute('aS',new THREE.BufferAttribute(sw,1));
  var m=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    uniforms:{uT:{value:0},uOp:{value:1}},
    vertexShader:[
      'attribute float aPh,aS;uniform float uT;varying float vA;',
      'void main(){float k=fract(uT*0.17+aPh);',
      ' vec3 p=position;',
      ' p.y=12.0-k*24.0;',
      /* trong thân người thì bị ép vào giữa — nhưng VẪN CHẢY, không dừng */
      ' float inside=smoothstep(8.0,5.0,p.y)*smoothstep(-6.0,-3.0,p.y);',
      ' p.x*=mix(1.0,0.34,inside); p.z*=mix(1.0,0.34,inside);',
      ' p.x+=sin(uT*0.6+aS)*0.35; p.z+=cos(uT*0.5+aS)*0.35;',
      ' vA=smoothstep(0.0,0.06,k)*smoothstep(1.0,0.92,k);',
      ' vec4 mv=modelViewMatrix*vec4(p,1.0);gl_PointSize=2.0*(200.0/-mv.z);',
      ' gl_Position=projectionMatrix*mv;}'
    ].join('\n'),
    fragmentShader:'varying float vA;uniform float uOp;void main(){vec2 d=gl_PointCoord-0.5;float a=smoothstep(0.5,0.0,length(d));gl_FragColor=vec4(vec3(0.08,0.55,1.00)*a*1.3,a*vA*uOp*0.55);}'});
  /* dòng nước vẽ TRƯỚC silhouette để hạt phía sau bị che (đúng chiều sâu) */
  var pts=new THREE.Points(bg,m); pts.renderOrder=-1; gBody.add(pts);
  gBody.userData={mat:m};
  var lb=textPlane('thay mới trong vài tuần',0.46,52,'#8FD6FF',1500,140);
  lb.position.set(7.6,-1.0,0); gBody.add(lb);

/* --- S74/S75: vòng tuần hoàn — bốn nút TƯƠNG ĐƯƠNG NHAU ---------------
 * Con người KHÔNG được ưu tiên hơn cái cây. Sau khi các nút tắt, dòng hạt
 * giữ NGUYÊN quỹ đạo, mật độ và tốc độ — nó không cần các nút. */
var gCycle=new THREE.Group(); scene.add(gCycle); gCycle.visible=false;
var cycleNodes=[];
(function(){
  var R=13.0;
  /* mạch particle liên tục theo vòng khép kín — không có điểm đầu/cuối */
  var N=1100, pr=HFA.mulberry32(747401);
  var off=new Float32Array(N), jit=new Float32Array(N*2), ph=new Float32Array(N);
  for(var i=0;i<N;i++){ off[i]=pr(); jit[i*2]=(pr()-0.5); jit[i*2+1]=(pr()-0.5); ph[i]=pr()*6.2831; }
  var bg=new THREE.BufferGeometry();
  bg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(N*3),3));
  bg.setAttribute('aO',new THREE.BufferAttribute(off,1));
  bg.setAttribute('aJ',new THREE.BufferAttribute(jit,2));
  bg.setAttribute('aPh',new THREE.BufferAttribute(ph,1));
  var m=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    uniforms:{uT:{value:0},uOp:{value:1},uR:{value:R}},
    vertexShader:[
      'attribute float aO,aPh;attribute vec2 aJ;uniform float uT,uR;varying float vA;',
      'void main(){float a=(aO+uT*0.045)*6.28318;',
      ' vec3 p=vec3(cos(a)*uR, sin(a)*uR*0.62, sin(a*2.0)*2.2);',
      ' p.x+=aJ.x*1.5; p.y+=aJ.y*1.5; p.z+=sin(uT*0.5+aPh)*0.9;',
      ' vA=1.0;',
      ' vec4 mv=modelViewMatrix*vec4(p,1.0);gl_PointSize=1.9*(220.0/-mv.z);',
      ' gl_Position=projectionMatrix*mv;}'
    ].join('\n'),
    fragmentShader:'varying float vA;uniform float uOp;void main(){vec2 d=gl_PointCoord-0.5;float a=smoothstep(0.5,0.0,length(d));gl_FragColor=vec4(vec3(0.08,0.55,1.00)*a*1.25,a*uOp*0.50);}'});
  gCycle.add(new THREE.Points(bg,m));
  gCycle.userData={mat:m, R:R};
  /* bốn nút — cùng kích cỡ, cùng độ nhấn */
  var defs=[
    {a:0.25, t:'cái cây',  c:0x1AFF6B},
    {a:0.50, t:'đám mây',  c:0x8FB6DC},
    {a:0.75, t:'con sông', c:0x148CFF},
    {a:0.00, t:'con người',c:0xA8CCE8}
  ];
  for(var i=0;i<4;i++){
    var d=defs[i], a=d.a*6.28318;
    var g=new THREE.Group();
    g.position.set(Math.cos(a)*R, Math.sin(a)*R*0.62, Math.sin(a*2)*2.2);
    var ring=new THREE.Mesh(new THREE.RingGeometry(2.0,2.18,44),
      new THREE.MeshBasicMaterial({color:d.c,transparent:true,opacity:0.56,side:THREE.DoubleSide}));
    g.add(ring);
    var lb=textPlane(d.t,0.52,58,'#'+new THREE.Color(d.c).getHexString().toUpperCase(),900,150);
    lb.position.set(0,-2.9,0); g.add(lb);
    gCycle.add(g); cycleNodes.push(g);
  }
})();
regOp(gCycle);

/* --- S76/S77/S81: mưa đêm → MỘT giọt → macro trên mu bàn tay ----------- */
var gRain=new THREE.Group(); scene.add(gRain); gRain.visible=false;
var rainMat=new THREE.ShaderMaterial({transparent:true,

    'float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);',
    ' return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}',
    'void main(){vec2 uv=vU; vec2 q=(vU-0.5)*vec2(1.777,1.0);',

    ' col+=vec3(0.28,0.52,0.86)*st*msk*0.26*(1.0-blur*0.90);',

    ' dropC+=vec3(0.40,0.66,1.00)*pow(clamp(rr/dsz,0.0,1.0),6.0)*0.42;',

    ' col+=vec3(0.30,0.60,1.00)*dEdge*smoothstep(dsz*0.99,dsz*0.93,rr)*0.30*uFocus;',
    ' vec2 vq=vU-0.5; col*=1.0-dot(vq,vq)*1.0;',

/* --- S77/S81: macro giọt trên MU BÀN TAY ------------------------------

var gHand=new THREE.Group(); scene.add(gHand); gHand.visible=false;
var handMat2=new THREE.ShaderMaterial({transparent:true,
  uniforms:{uT:{value:0},uOp:{value:1},uImpact:{value:0},uSlide:{value:0}},
  vertexShader:'varying vec2 vU;void main(){vU=uv;gl_Position=vec4(position.xy,0.999,1.0);}',

    ' vec2 dc=q-vec2(-0.02+uSlide*0.055, 0.06-uSlide*0.30);',
    /* uImpact: 0 = chưa chạm, 1 = đã ổn định */
    ' float squash=1.0 + 0.55*exp(-pow((uImpact-0.18)*9.0,2.0)) - 0.16*exp(-pow((uImpact-0.42)*9.0,2.0));',
    ' float rr=length(dc*vec2(1.0/max(squash,0.4), squash*1.30));',

];

/* danh sách mọi group cảnh để tắt sạch mỗi frame rồi chỉ bật cái cần */
var ALL_GROUPS=[gRoom,gFlow,gMol,gFlip,gTravel,gLone,gCloud,gMW,gTherm,gDens,gVac,
