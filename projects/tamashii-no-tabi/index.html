{t:230.23,s:"この言葉、もとはサンスクリット語です。"},
{t:233.81,s:"アンタラーバヴァ、といいます。"},
{t:236.63,s:"アンタラーが中間、バヴァが生存の状態。"},
{t:240.21,s:"つまり、中間の生存状態。"},
{t:242.73,s:"インドで生まれた言葉が、"},
{t:245.25,s:"中国を通って、"},
{t:246.71,s:"そのまま日本語の中陰になったわけです。"},
{t:250.70,s:"私はこの言葉を知ったとき、"},
{t:253.23,s:"なんというか、"},
{t:254.60,s:"少し不思議な気持ちになりました。中間、"},
{t:258.31,s:"ということは、"},
{t:259.67,s:"まだ着いていないということです。"},
{t:262.79,s:"もう、ここにはいない。"},
{t:265.01,s:"けれど、次の場所にも、まだ着いていない。"},
{t:269.05,s:"仏教はその、"},
{t:270.26,s:"どちらでもない状態に、"},
{t:272.48,s:"わざわざ名前をつけていたんです。"},
{t:275.71,s:"そして考えてみると、"},
{t:277.74,s:"残された側も、"},
{t:279.16,s:"ちょうどその状態にいます。"},
{t:281.79,s:"もういないことはわかっている。"},
{t:284.83,s:"けれど、いないことにはまだなっていない。"},
{t:288.89,s:"さて、この中陰には期間があります。"},
{t:292.66,s:"七日を七回。"},
{t:293.99,s:"四十九日です。"},
{t:295.54,s:"なぜ七なのか。"},
{t:297.03,s:"ここを調べていて、私はいちばん驚きました。"},
{t:301.52,s:"古い仏教の論書に、"},
{t:303.44,s:"『倶舎論』という有名な本があります。"},
{t:307.28,s:"インドで書かれたものです。"},
{t:310.06,s:"その第九巻に、"},
{t:311.42,s:"中有の期間についての議論が出てきます。"},
{t:315.12,s:"そこでは、"},
{t:316.09,s:"いくつもの説が並べて紹介されていました。"},
{t:319.98,s:"ある先生は、期限は決まっていないと言う。"},
{t:324.03,s:"世友という人は、長くて七日だと言う。"},
{t:327.67,s:"毘婆沙師という人たちは、"},
{t:330.09,s:"もっとずっと短いと言う。"},
{t:332.52,s:"そして、"},
{t:333.42,s:"そのあいだに一行、"},
{t:335.44,s:"こういう書き方で挟まっているんです。有余師、"},
{t:340.39,s:"つまり、"},
{t:341.29,s:"ほかにこう言う先生もいる、と。"},
{t:344.66,s:"その先生の説が、四十九日でした。"},
{t:348.26,s:"四十九日という数字は、"},
{t:350.38,s:"その本のなかでは、"},
{t:352.12,s:"いちばん強い説ではなかったんです。"},
{t:355.39,s:"ほかにこういう説もある、"},
{t:357.71,s:"という書かれ方をした、"},
{t:359.83,s:"いわば少数意見でした。"},
{t:361.95,s:"私はこれを読んで、"},
{t:363.74,s:"少しのあいだ、"},
{t:365.14,s:"手が止まりました。あの一行が、"},
{t:368.13,s:"二千年近くかけて、"},
{t:369.92,s:"私の家のカレンダーになっていたわけです。"},
{t:373.91,s:"インドの論書に並んだいくつもの説のうち、"},
{t:377.89,s:"ひとつが選ばれて、残った。"},
{t:380.48,s:"それが海を渡って、"},
{t:382.28,s:"この国の家々の、"},
{t:383.87,s:"七日ごとの予定になった。"},
{t:386.26,s:"ですから、"},
{t:387.22,s:"なぜ七なのかという問いに、"},
{t:389.73,s:"私は今もはっきりとは答えられません。ただ、"},
{t:393.77,s:"天から降ってきた数字ではないということは、"},
{t:397.82,s:"わかりました。人が選んで、"},
{t:400.32,s:"人が受け継いで、"},
{t:401.87,s:"ここまで来た数字なんです。"},
{t:404.37,s:"死後七日ごとに法要を営んで、"},
{t:407.43,s:"四十九日を満中陰とする。"},
{t:410.05,s:"その習慣が定着したのは、そのあとのことです。"},
{t:414.86,s:"満ちる中陰、と書いて満中陰。"},
{t:418.05,s:"中陰の期間が満ちた、という意味です。"},
{t:422.16,s:"忌明けという言い方も、ここから来ています。"},
{t:426.95,s:"では、その期間に中身を入れたのは誰か。"},
{t:431.24,s:"中国の人たちです。晩唐のころ、中国で、"},
{t:435.52,s:"ひとつの信仰がかたちになりました。"},
{t:439.36,s:"十王信仰といいます。"},
{t:441.66,s:"十人の王が、順番に死者を裁く。"},
{t:445.10,s:"その考え方を記したのが"},
{t:447.63,s:"『十王経』と呼ばれるお経です。"},
{t:451.07,s:"ここは正確に言っておきたいところです。"},
{t:454.51,s:"この『十王経』、"},
{t:455.95,s:"インドから伝わったお経ではありません。"},
{t:459.39,s:"中国で作られたものです。"},
{t:461.56,s:"もともとインドの仏教にも、閻魔はいました。"},
{t:465.83,s:"ですが、"},
{t:466.64,s:"十人の王が順番に取り調べると"},
{t:469.48,s:"いう形はありません。あの、"},
{t:472.12,s:"役所のように並んだ仕組みは、"},
{t:474.97,s:"中国で加わったものなんです。"},
{t:477.81,s:"そして日本には、"},
{t:479.33,s:"平安時代の末ごろ、"},
{t:481.05,s:"この世の終わりが近いと"},
{t:483.15,s:"いう末法の思想と一緒に、"},
{t:485.43,s:"広く入ってきました。"},
{t:487.34,s:"ちなみに、王は十人います。"},
{t:490.50,s:"七人ではありません。"},
{t:492.92,s:"残りの三人は、四十九日より先に出てきます。"},
{t:498.02,s:"百か日、一周忌、三回忌。"},
{t:500.94,s:"法事がそこまで続くのは、これが理由なんです。"},
{t:506.28,s:"では、"},
{t:506.92,s:"その七つの関所では、"},
{t:509.04,s:"何が起きることになっているのか。"},
{t:512.44,s:"私が開いた本には、一つずつ、"},
{t:515.42,s:"名前まで書いてありました。"},
{t:519.67,s:"最初の七日目。初七日です。"},
{t:523.39,s:"ここで会うのは、秦広王という王でした。"},
{t:528.82,s:"初七日の法要という言葉は、"},
{t:531.58,s:"今でもよく聞きます。"},
{t:533.71,s:"最近では葬儀の日にまとめて"},
{t:536.48,s:"しまうことも多いですね。あれは本来、"},
{t:540.30,s:"この最初の関所の日のことなんです。"},
{t:543.92,s:"この最初の七日間に歩くとされているのが、"},
{t:547.91,s:"死出の山という山道です。"},
{t:550.30,s:"死に出ると書きます。"},
{t:552.30,s:"順番を、"},
{t:553.08,s:"ここではっきりさせておきたいと思います。"},
{t:556.98,s:"山が先で、川はそのあとなんです。"},
{t:560.10,s:"なぜそう言えるのか。"},
{t:562.37,s:"二番目の王の名前が、その証拠になっています。"},
{t:567.37,s:"次が十四日目。"},
{t:568.96,s:"二七日といいます。"},
{t:571.00,s:"ここで会うのが、初江王。"},
{t:573.73,s:"初めの江、と書きます。"},
{t:576.40,s:"江というのは、大きな川のことです。"},
{t:580.54,s:"最初の川の王、という名前なんです。"},
{t:584.67,s:"名前のとおり、"},
{t:586.17,s:"この王は川のほとりにいることになっています。"},
{t:590.90,s:"三途の川です。"},
{t:592.40,s:"つまり川は、二週目に出てくる。"},
{t:595.62,s:"一週目ではありません。"},
{t:597.98,s:"この三途という言葉も、"},
{t:600.11,s:"少し誤解されているところがあります。"},
{t:603.58,s:"三つの道、という意味ではないんです。"},
{t:607.06,s:"三途はもともと三悪道のこと。"},
{t:610.64,s:"餓鬼道、畜生道、地獄道。"},
{t:613.72,s:"この三つを指す仏教の言葉で、"},
{t:617.30,s:"『金光明経』にその用例があります。"},
{t:621.65,s:"ですから、"},
{t:622.53,s:"三途の川という呼び方は、"},
{t:624.65,s:"三つの悪い行き先のほうから来た名前なんです。"},
{t:628.53,s:"川に三本の流れがあると"},
{t:630.47,s:"いう意味ではありません。"},
{t:632.59,s:"では、"},
{t:633.27,s:"川に三つの渡り方があるという、"},
{t:636.70,s:"あの話はどこから来たのか。"},
{t:639.66,s:"さきほどの『地蔵十王経』です。"},
{t:643.09,s:"そこにはこう書かれています。"},
{t:646.28,s:"渡る所に三つ有り。"},
{t:648.43,s:"一つは山水瀬、"},
{t:650.10,s:"二つは江深淵、"},
{t:651.77,s:"三つには橋の渡り有り。"},
{t:654.40,s:"善い人は、金銀七宝でできた橋を渡る。"},
{t:658.75,s:"罪の軽い人は、山水瀬という浅瀬を歩いて渡る。"},
{t:664.07,s:"罪の重い人は、"},
{t:665.77,s:"江深淵という難所を渡ることになる。"},
{t:669.88,s:"同じ川なのに、渡る場所が三つある。"},
{t:673.33,s:"橋があるのに、全員が橋を通るわけではない。"},
{t:677.59,s:"そういう書かれ方をしています。"},
{t:680.63,s:"そして川のほとりには、年老いた夫婦がいます。"},
{t:686.17,s:"奪衣婆と懸衣翁。"},
{t:688.19,s:"衣を奪う婆さまと、衣を懸ける翁です。"},
{t:692.72,s:"婆さまが死んだ人の着物を剥ぎ取って、"},
{t:696.43,s:"翁がそれを木の枝に掛ける。"},
{t:699.12,s:"衣領樹という木です。"},
{t:701.18,s:"そして枝の垂れ具合で、"},
{t:703.45,s:"どの瀬を渡るかが決まるとされています。"},
{t:707.37,s:"私はこの場面の話を読んで、"},
{t:709.86,s:"少し考え込みました。"},
{t:711.77,s:"持っているものを全部取られて、"},
{t:714.63,s:"着ていたものまで脱がされる。残るのは、"},
{t:718.27,s:"その人がしてきたことの重さだけなんですね。"},
{t:722.28,s:"この奪衣婆は、"},
{t:723.64,s:"のちに江戸時代の終わりごろ、"},
{t:726.35,s:"人びとの信仰の対象そのものになりました。"},
{t:730.22,s:"お堂が建てられて、"},
{t:731.97,s:"拝まれるようになったんです。"},
{t:734.68,s:"恐ろしい姿の者ほど、"},
{t:736.61,s:"いつのまにか拝まれている。"},
{t:739.13,s:"あの世の話には、そういうところがあります。"},
{t:743.20,s:"ここで、"},
{t:744.13,s:"私はひとつ気になって、"},
{t:746.67,s:"年代を調べてみました。"},
{t:749.22,s:"この川の風景は、"},
{t:751.07,s:"いつからあるものなんだろう、と。"},
{t:754.78,s:"日本で、"},
{t:755.60,s:"あの世の姿をいちばん早くまとめて書いたのは、"},
{t:760.14,s:"源信というお坊さんの『往生要集』です。"},
{t:764.06,s:"西暦九百八十五年、平安時代の本です。"},
{t:767.77,s:"ところがこの本、地獄の話も、六道の話も、"},
{t:771.59,s:"たっぷり書いてあるのに、"},
{t:773.88,s:"三途の川が出てこないんです。"},
{t:776.55,s:"十人の王も出てきません。"},
{t:778.84,s:"では中国の『十王経』のほうにはあるのか。"},
{t:783.27,s:"こちらには、十人の王はいます。"},
{t:786.59,s:"裁きの場面もあります。ですが、"},
{t:789.92,s:"川を渡る場面も、"},
{t:791.69,s:"衣を剥ぐ老夫婦も、鏡も、"},
{t:794.35,s:"見当たりません。"},
{t:796.12,s:"それらが揃って出てくるのは、"},
{t:799.08,s:"十二世紀ごろ、"},
{t:800.57,s:"日本で作られた『地蔵十王経』からです。"},
{t:804.59,s:"三途の川も、奪衣婆も、"},
{t:806.92,s:"浄玻璃の鏡も、"},
{t:808.40,s:"本地の仏の一覧も、"},
{t:810.31,s:"この日本製のお経にあります。"},
{t:813.27,s:"私はこれを、"},
{t:814.38,s:"なんだ後付けか、"},
{t:815.87,s:"というふうには受け取りませんでした。"},
{t:819.20,s:"むしろ逆です。"},
{t:820.50,s:"インドで中有という言葉が生まれ、"},
{t:823.75,s:"中国で十人の王が並び、"},
{t:825.98,s:"日本で川と橋と老夫婦が描き足された。"},
{t:829.64,s:"誰かを見送った人が、"},
{t:831.67,s:"その人の行く先を思って、"},
{t:834.11,s:"少しずつ描き込んでいった地図なんです。"},
{t:837.97,s:"さて、道に戻ります。"},
{t:840.81,s:"三週目、二十一日目。宋帝王。"},
{t:844.79,s:"四週目、二十八日目は、五官王です。"},
{t:849.61,s:"五つの官と書きます。"},
{t:852.45,s:"この王が、罪の重さを秤で量るとされています。"},
{t:858.70,s:"そして、五週目。"},
{t:860.27,s:"三十五日目です。"},
{t:861.84,s:"ここで出てくるのが、"},
{t:863.81,s:"みなさんご存じの、"},
{t:865.58,s:"あの方でした。"},
{t:866.95,s:"閻魔王です。"},
{t:868.35,s:"ここで私は、思わず本を読み返しました。"},
{t:872.88,s:"三十五日目。"},
{t:874.31,s:"三十五日目なんです。"},
{t:876.69,s:"四十九日ではありません。"},
{t:879.55,s:"私はずっと、"},
{t:880.64,s:"四十九日に閻魔さまが出てきて、"},
{t:883.37,s:"最後の判決を下すんだとばかり思っていました。"},
{t:887.36,s:"たぶん、"},
{t:888.09,s:"そう思っている方は多いんじゃないでしょうか。"},
{t:892.09,s:"ですが十王の順番では、閻魔王は五番目。"},
{t:896.63,s:"七つの関所のうちの五つ目です。"},
{t:900.21,s:"まだ先があるわけです。"},
{t:902.84,s:"その閻魔王の宮殿には、"},
{t:905.04,s:"鏡があるとされています。"},
{t:907.44,s:"浄玻璃の鏡といいます。"},
{t:909.64,s:"その人が生きているあいだにしてきたことが、"},
{t:913.85,s:"そのまま映ると書かれています。"},
{t:916.85,s:"六週目、四十二日目は変成王。"},
{t:920.23,s:"そして七週目、四十九日目。"},
{t:923.36,s:"最後の関所に立っているのは、"},
{t:926.74,s:"泰山王という王でした。"},
{t:929.39,s:"ここで、行き先が決まるとされています。"},
{t:933.22,s:"四十九日が満ちる日というのは、"},
{t:936.25,s:"そういう日だったんです。"},
{t:938.67,s:"では、行き先にはどんなものがあるのか。"},
{t:943.17,s:"六つある、とされています。六道です。"},
{t:947.43,s:"地獄道、餓鬼道、畜生道、修羅道、人間道、"},
{t:951.65,s:"天道。"},
{t:952.28,s:"この六つのどこかに、また生まれていく。"},
{t:956.29,s:"さきほどの『往生要集』が細かく描いたのは、"},
{t:960.73,s:"この六つの世界のほうでした。"},
{t:963.68,s:"ここで輪がつながります。"},
{t:965.88,s:"中陰というのは、"},
{t:967.34,s:"この六つのどこかへ戻っていくまでの、"},
{t:970.64,s:"あいだの時間だったわけです。"},
{t:973.20,s:"どこから来てどこへ行くのか。"},
{t:975.76,s:"答えは、同じ輪の上でした。"},
{t:978.14,s:"お棺にお金を入れる風習を、"},
{t:980.64,s:"ご覧になったことがあるかもしれません。"},
{t:984.28,s:"六文銭とか、六道銭と呼ばれるものです。"},
{t:987.93,s:"これはお経に書かれていることではありません。"},
{t:991.67,s:"民間の習わしです。"},
{t:993.20,s:"お金を納める習慣そのも"},
{t:995.06,s:"のは古くからありますが、"},
{t:997.10,s:"六枚と決まったのは、"},
{t:998.80,s:"だいぶあとの江戸時代のことでした。"},
{t:1001.69,s:"何のためなのかも、一つに決まっていません。"},
{t:1006.32,s:"三途の川の渡し賃だという説。"},
{t:1009.40,s:"六道を行くあいだの路銀だという説。"},
{t:1013.15,s:"地蔵菩薩へのお賽銭だという説もあります。"},
{t:1017.56,s:"どれが本当かは、わかりません。ただ、"},
{t:1020.74,s:"どの説をとっても、"},
{t:1022.33,s:"中身は同じことを言っています。"},
{t:1024.98,s:"向こうで困らないように、という気持ちです。"},
{t:1028.69,s:"ここで、"},
{t:1029.40,s:"ひとつお伝えして"},
{t:1030.83,s:"おかなければならないことがあります。"},
{t:1034.04,s:"今お話ししてきた四十九日の旅は、"},
{t:1036.90,s:"日本のすべてのお宅に当て"},
{t:1039.04,s:"はまるものではありません。"},
{t:1041.36,s:"たとえば浄土真宗では、"},
{t:1043.59,s:"亡くなった方は阿弥陀仏の本願力によって、"},
{t:1047.63,s:"臨終と同時に極楽浄土へ往生すると説きます。"},
{t:1051.88,s:"ですから、"},
{t:1052.90,s:"七日ごとに裁かれる中陰と"},
{t:1055.32,s:"いう期間を立てません。"},
{t:1057.55,s:"もっとさかのぼれば、"},
{t:1059.53,s:"上座部仏教では、"},
{t:1061.11,s:"中有という期間があること"},
{t:1063.49,s:"自体を認めていません。"},
{t:1065.67,s:"どれが正しいという話を、"},
{t:1067.89,s:"私はするつもりがありません。ただ、"},
{t:1071.03,s:"同じ仏教のなかでも、"},
{t:1072.87,s:"あの世の見取り図はひとつではない。"},
{t:1076.01,s:"そのことは、"},
{t:1077.12,s:"知っておいてよいことだと思います。"},
{t:1080.26,s:"さて。"},
{t:1080.94,s:"ここまで読んできて、私は正直、"},
{t:1084.36,s:"少し気が重くなっていました。"},
{t:1087.55,s:"七つの関所。秤。鏡。"},
{t:1089.80,s:"衣を剥ぐ老夫婦。"},
{t:1091.60,s:"言ってしまえば、これは取り調べの連続です。"},
{t:1096.32,s:"あの人が、"},
{t:1097.44,s:"そんなところを歩いているのかと思うと、"},
{t:1101.71,s:"あまりいい気持ちはしませんでした。"},
{t:1105.53,s:"ところが、"},
{t:1106.51,s:"本のうしろのほうに、"},
{t:1108.48,s:"一覧表がついていたんです。"},
{t:1111.03,s:"十人の王の名前と、その横に、"},
{t:1113.78,s:"もう一つの名前が並んでいました。"},
{t:1116.92,s:"本地、と書いてあります。"},
{t:1119.43,s:"本の地と書いて、ほんじ。これは、"},
{t:1122.78,s:"その神さまや王の、"},
{t:1124.67,s:"本当の姿とされる仏のことです。この一覧も、"},
{t:1129.06,s:"日本で作られたお経で加わった部分です。"},
{t:1133.04,s:"最初の秦広王の本地は、不動明王。"},
{t:1137.17,s:"二番目の初江王は、釈迦如来。"},
{t:1140.78,s:"三番目の宋帝王は、文殊菩薩。"},
{t:1144.40,s:"四番目の五官王は、普賢菩薩。"},
{t:1148.01,s:"そして、五番目。"},
{t:1149.66,s:"閻魔王のところに、私は目が止まりました。"},
{t:1153.77,s:"地蔵菩薩、と書いてありました。"},
{t:1156.33,s:"お地蔵さんです。"},
{t:1157.88,s:"道ばたに立って、"},
{t:1159.44,s:"前掛けをかけてもらっている、"},
{t:1162.15,s:"あのお地蔵さん。"},
{t:1163.71,s:"日本でいちばん親しまれて"},
{t:1166.03,s:"いる菩薩だと思います。"},
{t:1168.17,s:"いちばん恐れられている王の本当の姿が、"},
{t:1171.59,s:"いちばん親しまれている仏だと"},
{t:1174.11,s:"書かれていたんです。"},
{t:1175.91,s:"私は、しばらくそのページを見ていました。"},
{t:1179.61,s:"これは、どういうことなんだろうと。"},
{t:1182.75,s:"つまり、こういうことになります。"},
{t:1185.78,s:"閻魔王が恐ろしい顔で問いただしているとき、"},
{t:1189.77,s:"その顔の下にいるのは、"},
{t:1191.85,s:"地蔵菩薩なんです。"},
{t:1193.56,s:"裁いている者と、"},
{t:1195.24,s:"救おうとしている者が、"},
{t:1197.55,s:"別人ではない。"},
{t:1199.02,s:"同じ一人だということです。"},
{t:1201.75,s:"思い返せば、"},
{t:1202.97,s:"あのお経の正式な名前も"},
{t:1205.22,s:"『地蔵菩薩発心因縁十王経』でした。"},
{t:1208.68,s:"十王の話なのに、頭に地蔵菩薩がついている。"},
{t:1212.96,s:"はじめから、そういうお経だったわけです。"},
{t:1217.04,s:"七番目の泰山王の本地は、薬師如来。"},
{t:1220.93,s:"病を癒やす仏です。"},
{t:1222.99,s:"そして十番目、"},
{t:1224.59,s:"いちばん最後の五道転輪王の本地は、"},
{t:1228.48,s:"阿弥陀如来でした。"},
{t:1230.54,s:"十人並んだ王たちの列は、"},
{t:1233.12,s:"名前だけ見れば裁く者の列です。"},
{t:1236.34,s:"ですが本地の側から見れば、"},
{t:1239.13,s:"はじめから終わりまで、全部、"},
{t:1242.13,s:"仏の列なんです。"},
{t:1243.85,s:"そしてもう一つ、"},
{t:1245.27,s:"辞典を読んでいて気づいたことがあります。"},
{t:1248.83,s:"中陰について書かれた説明に、"},
{t:1251.32,s:"こんな一節がありました。"},
{t:1253.45,s:"中陰のあいだに、"},
{t:1255.15,s:"残された家族が法要を"},
{t:1257.28,s:"営んで功徳を回し向ければ、"},
{t:1260.05,s:"罪は許される、と。"},
{t:1261.96,s:"これは、順序が大事なところです。"},
{t:1265.35,s:"七日ごとの法要というのは、"},
{t:1268.11,s:"裁判の日程表ではないんです。家族の側が、"},
{t:1272.35,s:"七日ごとに手を出せる、"},
{t:1274.68,s:"その仕組みのほうなんです。"},
{t:1277.44,s:"七回も裁きがあるということは、七回も、"},
{t:1281.08,s:"助けに行ける機会があるということでした。"},
{t:1286.90,s:"気がつくと、ずいぶん時間が経っていました。"},
{t:1290.61,s:"本を閉じて、"},
{t:1292.16,s:"私はもう一度、"},
{t:1293.97,s:"位牌の前に座り直しました。"},
{t:1297.33,s:"同じ座卓、同じ皿。"},
{t:1299.65,s:"ぼたもちは、まだそのままです。"},
{t:1303.53,s:"蝋燭だけが、短くなっていました。"},
{t:1306.92,s:"朝に言われた言葉を、"},
{t:1309.04,s:"私はもう一度思い出していました。"},
{t:1312.43,s:"今日で一区切りですよ、と。"},
{t:1315.18,s:"同じ言葉ですが、聞こえ方が変わっていました。"},
{t:1319.84,s:"じつは、"},
{t:1320.57,s:"この点について、"},
{t:1322.04,s:"はっきりそう書いている宗派があります。"},
{t:1325.52,s:"中陰の期間を立てない、あの浄土真宗です。"},
{t:1329.18,s:"本願寺派の説明に、こういう一文があります。"},
{t:1333.03,s:"中陰の法要は、"},
{t:1334.31,s:"亡くなった人のための追善ではなく、"},
{t:1337.42,s:"むしろ遺族自身が悲しみから立ち直って"},
{t:1340.72,s:"いくための機縁となる法要です、と。"},
{t:1343.83,s:"これは私の思いつきではありません。"},
{t:1347.44,s:"宗派がそう言っているんです。"},
{t:1350.42,s:"あの七日ごとの日程は、"},
{t:1352.75,s:"こちら側のための日程だ、と。"},
{t:1355.73,s:"言われてみると、思い当たることばかりでした。"},
{t:1359.81,s:"この四十九日のあいだ、"},
{t:1361.84,s:"七日ごとに誰かが来て、"},
{t:1363.88,s:"そのたびにお茶を出して、"},
{t:1366.11,s:"同じ話を何度もしました。"},
{t:1368.33,s:"悲しみが、七つに区切ってあったんです。"},
{t:1372.03,s:"一度に全部ではなく、"},
{t:1373.98,s:"次の区切りまで、"},
{t:1375.54,s:"とりあえずここまで。"},
{t:1377.49,s:"そういう歩き方になっていました。"},
{t:1380.61,s:"しかも、その区切りには終わりが宣言されます。"},
{t:1385.28,s:"満中陰。"},
{t:1386.13,s:"今日で忌明けですよ、という、あの言葉です。"},
{t:1390.59,s:"そして、"},
{t:1391.42,s:"そこでぷつりと切れるわけでもありません。"},
{t:1395.60,s:"百か日があり、一周忌があり、三回忌がある。"},
{t:1399.98,s:"間隔が少しずつ広がっていきます。"},
{t:1403.32,s:"急に手を離すのではなく、"},
{t:1405.82,s:"だんだん間を空けていく。"},
{t:1408.33,s:"十人の王が四十九日より先まで並んでいたのは、"},
{t:1412.92,s:"そういう形でもあったわけです。"},
{t:1416.05,s:"もちろん、"},
{t:1416.88,s:"これで悲しみがなくなると"},
{t:1418.86,s:"いう話ではありません。"},
{t:1420.68,s:"法要に出たからといって、"},
{t:1422.67,s:"癒えるとはかぎらない。"},
{t:1424.49,s:"そういうことを言うつもりはありません。"},
{t:1427.63,s:"ただ、"},
{t:1428.24,s:"人を一人きりにしない日程が、"},
{t:1431.10,s:"そこに組んである。"},
{t:1432.94,s:"それだけのことですが、"},
{t:1435.19,s:"それだけのことが、"},
{t:1437.03,s:"あの四十九日のあいだ、"},
{t:1439.28,s:"私を助けていました。"},
{t:1441.32,s:"もうひとつ、思ったことがあります。"},
{t:1444.79,s:"川を渡って向こう岸へ行く、という話は、"},
{t:1448.66,s:"日本だけのものではありません。"},
{t:1451.72,s:"古代の近東にも、"},
{t:1453.35,s:"ギリシアの神話にも、"},
{t:1455.38,s:"よく似た川が出てきます。"},
{t:1457.83,s:"たがいに関係があったかどうかは、"},
{t:1460.80,s:"わかりません。ただ、"},
{t:1462.65,s:"離れた土地の人が、"},
{t:1464.32,s:"それぞれに同じ形を思いついた。"},
{t:1467.10,s:"人が亡くなることを、"},
{t:1468.95,s:"消えてなくなることではなく、"},
{t:1471.55,s:"どこかへ向かう旅のほうだと"},
{t:1473.96,s:"考えてきたわけです。"},
{t:1475.81,s:"その向こう岸に本当に何があるのかを、"},
{t:1479.11,s:"私は知りません。"},
{t:1480.57,s:"お経にはこう書かれている、"},
{t:1482.96,s:"というところまでしか、"},
{t:1484.97,s:"私には言えません。"},
{t:1486.62,s:"ですが、わかったこともあります。"},
{t:1489.69,s:"この道を描いた人たちは、"},

{t:1494.87,s:"そこに書き込んでいました。"},
{t:1497.37,s:"七日ごとに手を合わせる場所を作り、"},
{t:1500.53,s:"いちばん恐ろしい王の下に、"},
{t:1502.95,s:"いちばん優しい仏を置いた。"},
{t:1505.37,s:"私はもう一度、位牌のほうを見ました。"},
{t:1508.82,s:"何も変わってはいません。ただ、"},
{t:1511.70,s:"自分がここに座っている理由が、"},

{t:1518.42,s:"四十九日は、終わりの日と呼ばれています。"},
{t:1522.04,s:"ですがあれは、"},
{t:1523.31,s:"送り出す側が、"},
{t:1524.58,s:"ゆっくり時間をかけて歩けるように"},
{t:1527.47,s:"区切られた道でもあったんです。"},
{t:1530.19,s:"何百年も前から、"},

{t:1539.06,s:"今日も、どこかの家で誰かが座っています。"},
{t:1543.18,s:"蝋燭を消して、私は部屋を出ました。"},
{t:1546.81,s:"ぼたもちの皿は、明日の朝、"},
{t:1549.58,s:"片づけることにしました。"}];

var subEl = document.getElementById('sub');
var chapEl = document.getElementById('chap');
var rootEl = document.getElementById('root');
/* ==========================================================================
 * BỘ RENDER CẢNH — mỗi hàm đặt TRỌN VẸN trạng thái theo thời gian cục bộ u.
 * Không hàm nào đọc trạng thái do hàm khác để lại: scrub tới bất kỳ t nào
 * cũng ra đúng một frame.
 * ========================================================================== */

/* ⭐ GÓC MÁY MỎ NEO — khung CUỐI của S02. S43 CẮT THẲNG vào đúng ma trận này.
 * Ghi ở đây một lần; hai chỗ dùng chung hằng số, không ai gõ lại số. */
/* Điểm nhìn LỆCH TRÁI 仏壇 0.36m: ở 50mm, khoảng cách 2.55m cho nửa bề ngang
 * nhìn thấy 1.09m, nên lệch 1/3 của nửa đó đặt 仏壇 đúng lên đường 1/3 PHẢI.
 * 座卓 + đĩa ぼたもち (x=-0.88, z=1.28) rơi vào góc DƯỚI-TRÁI. Đúng bố cục S02. */
var ANCHOR_CAM = {p:[0.10, 0.75, 2.20], l:[P_BUTSU.x - 0.36, 0.56, P_BUTSU.z], fov:F50};

/** chỉ một nhóm hiện mỗi frame */
function show(name){
  var k;
  for(k in GROUPS) GROUPS[k].visible = (k === name);
}
/** hai nhóm cùng hiện (shot chồng lớp) */
function show2(a, b){
  var k;
  for(k in GROUPS) GROUPS[k].visible = (k === a || k === b);
}

/* ---- đặt phòng về trạng thái chuẩn của một shot -------------------------- */
function setRoom(t, candleH, lit){
  setCandle(candleH, t, lit !== false);
  updateSmoke(t, 1.0);
  CAL.visible = false;
  calLight.intensity = 0;
  SHOJI_MARKS.visible = false;
  HAND.visible = false;
  BOOK.visible = true;
  bookClosedCover.visible = true;
  bookPageL.visible = false; bookPageR.visible = false;
  bookWoodcut.material.opacity = 0;
  BOOK.userData.dust.material.opacity = 0;
  ihaiReflect.material.opacity = 0;
  tableBounce.intensity = 0;          // mặc định TẮT; chỉ shot có sách mới bật
  var i;
  for(i=0; i<shojiGlowPanes.length; i++) shojiGlowPanes[i].material.opacity = 0;
  blowSmoke.material.opacity = 0;
}

/* ===================== 第1章 — 入口 ======================================= */

/* S01 · C01–C02 · 0–19.76s — đen hoàn toàn, một đốm lửa, bóng tối dần có hình.
 * Camera TĨNH TUYỆT ĐỐI. Chủ thể ở giao điểm 1/3 TRÊN-PHẢI. */
function sc_S01(t){
  var u = loc(t, 'S01'), d = SC.S01[1] - SC.S01[0];
  show('ROOM');
  setRoom(t, 0.72, true);
  /* fade-in từ đen 3s là việc của globalFade; ở đây điều khiển tầm với ánh sáng:
   * bóng tối quanh ngọn lửa DẦN CÓ HÌNH — tăng bán kính quầng sáng theo u */
  var reveal = ease(clamp(u/16.0, 0, 1));
  candleLight.distance = lerp(0.55, 4.2, reveal);
  candleLight.intensity = candleLight.intensity*lerp(0.55, 1.0, reveal);
  roomAmb.intensity = 0.30*reveal;
  moonLight.intensity = 0.06*reveal;
  /* đĩa ぼたもち hiện ở 18s, chiếu trống chỗ khách ở 24s (shot 19.76s → nén nhẹ) */
  var i;
  for(i=0; i<4; i++) BOTA.children[i+1].visible = u > d*0.62;
  BOTA.children[0].visible = u > d*0.58;
  /* Camera TĨNH. Ngọn lửa ở giao điểm 1/3 TRÊN-PHẢI ⇒ điểm nhìn đặt lệch
   * XUỐNG-TRÁI ngọn lửa: trừ ngang một phần ba nửa-bề-ngang nhìn thấy,
   * và nhìn thấp hơn ngọn lửa để nó nằm ở hàng 1/3 TRÊN.
   * 2/3 khung bên trái cố ý chừa cho bóng tối. */
  cam(P_CANDLE.x - 0.34, 0.75, P_CANDLE.z + 1.62,
      P_CANDLE.x - 0.72, P_CANDLE.y - 0.20, P_CANDLE.z, F50);
}

/* S02 · C03–C04 · 19.76–37.61s · ⭐ GÓC MÁY MỎ NEO
 * Pan phải 22° rất chậm, tốc độ KHÔNG ĐỔI; dừng ở ANCHOR_CAM.
 * candleHeight = 0.72 (CON SỐ MỎ NEO — S43 dùng 0.28). */
function sc_S02(t){
  var u = loc(t, 'S02'), d = SC.S02[1] - SC.S02[0];
  show('ROOM');
  setRoom(t, 0.72, true);
  var p = clamp(u/d, 0, 1);
  /* pan tốc độ không đổi nhưng có easing ở hai đầu — không bao giờ giật */
  var q = ease(p);
  /* bắt đầu ở ĐÚNG khung cuối S01, kết ở ĐÚNG ANCHOR_CAM — không gõ lại số nào */
  var sx = lerp(P_CANDLE.x - 0.34, ANCHOR_CAM.p[0], q);
  var sz = lerp(P_CANDLE.z + 1.62, ANCHOR_CAM.p[2], q);
  var lx = lerp(P_CANDLE.x - 0.72, ANCHOR_CAM.l[0], q);
  var ly = lerp(P_CANDLE.y - 0.20, ANCHOR_CAM.l[1], q);
  var lz = lerp(P_CANDLE.z,        ANCHOR_CAM.l[2], q);
  cam(sx, ANCHOR_CAM.p[1], sz,  lx, ly, lz, F50);
}

/* S03 · C05–C07 · 37.61–68.19s — cận 位牌, góc thấp hơn, 位牌 ở 1/3 TRÁI.
 * C07 (「何の最後なんでしょうか」): TOÀN KHUNG ĐỨNG IM 3s, ngọn lửa hạ 70% rồi trở lại. */
function sc_S03(t){
  var u = loc(t, 'S03'), d = SC.S03[1] - SC.S03[0];
  show('ROOM');
  setRoom(t, 0.72, true);
  /* nhịp nghỉ ở C07: bắt đầu 24/30.58 của shot */
  var pauseAt = d*0.78;
  var dip = win(u, pauseAt, pauseAt + 4.2, 1.3);
  candleLight.intensity *= lerp(1.0, 0.70, dip);
  candleFlame.scale.y *= lerp(1.0, 0.70, dip);
  candleHalo.material.opacity *= lerp(1.0, 0.68, dip);
  /* dolly-in 8% cực chậm, DỪNG ở nhịp nghỉ.
   * 位牌 ở 1/3 TRÁI khung ⇒ điểm nhìn lệch SANG PHẢI chủ thể.
   * Ở 85mm và khoảng cách ~1.15m, nửa bề ngang nhìn thấy chỉ 0.245m —
   * nên độ lệch là 0.082m, không phải hai ba tấc như cỡ rộng. */
  var p = ease(clamp(u/pauseAt, 0, 1));
  var dist = lerp(1.18, 1.09, p);            // dolly-in 8%
  cam(P_IHAI.x + 0.28, P_IHAI.y - 0.06, P_IHAI.z + dist,
      P_IHAI.x + 0.082, P_IHAI.y, P_IHAI.z, F85);
}

/* S04 · C08–C09 · 68.19–94.81s — crane-up + dolly-back, phòng rộng và trống.
 * Tỉ lệ sáng/tối ≈ 1:4. Chủ thể trôi về 1/4 DƯỚI-PHẢI. */
function sc_S04(t){
  var u = loc(t, 'S04'), d = SC.S04[1] - SC.S04[0];
  show('ROOM');
  setRoom(t, 0.72, true);
  /* crane-up + dolly-back ĐỒNG THỜI, bắt đầu từ ĐÚNG khung cuối S02.
   * Chủ thể (仏壇) trôi dần về 1/4 DƯỚI-PHẢI ⇒ điểm nhìn dịch dần lên-trái. */
  var p = ease(clamp(u/(d*0.92), 0, 1));
  var fov = lerp(F50, F35, p);
  var A = ANCHOR_CAM;
  cam(lerp(A.p[0], -0.16, p), lerp(A.p[1], 1.60, p), lerp(A.p[2], 3.55, p),
      lerp(A.l[0], A.l[0] - 0.42, p), lerp(A.l[1], 0.98, p), lerp(A.l[2], 0.30, p), fov);
}

/* S05 · C10–C12 · 94.81–131.22s — lịch treo tường, BẢY dấu bút đỏ.
 * Ba ô sáng theo thứ tự, mỗi ô giữ 4s rồi hạ xuống 40%; bốn ô còn lại mờ hơn;
 * cuối shot cả bảy cùng sáng một nhịp. */
function sc_S05(t){
  var u = loc(t, 'S05'), d = SC.S05[1] - SC.S05[0];
  show('ROOM');
  setRoom(t, 0.72, true);
  CAL.visible = true;
  var i;
  for(i=0; i<7; i++){
    var c = calCells[i];
    var markOp, litOp;
    if(i < 3){
      var on = 6 + i*6;                          // 6s, 12s, 18s
      var app = ease(clamp((u - on)/1.2, 0, 1));
      var hold = win(u, on, on + 4.0, 0.9);
      markOp = app*lerp(0.42, 1.0, hold);
      litOp  = 0.30*hold;
    } else {
      var app2 = ease(clamp((u - 24)/1.6, 0, 1));
      markOp = app2*0.42;                        // bốn ô còn lại MỜ HƠN (chưa kể tên)
      litOp = 0;
    }
    /* cả bảy cùng sáng MỘT NHỊP ở cuối shot */
    var all = win(u, d - 6.0, d - 1.4, 1.1);
    markOp = Math.max(markOp, all*0.95);
    litOp = Math.max(litOp, all*0.34);
    c.mark.material.opacity = markOp;
    c.lit.material.opacity = litOp;
  }
  for(i=0; i<3; i++){
    calLabels[i].material.opacity = ease(clamp((u - (6.6 + i*6))/1.3, 0, 1))*0.88;
  }
  /* tĩnh 85mm chếch, drift ngang 2% sang trái suốt shot */
  var drift = -0.052*(u/d);
  /* đèn lịch chỉ bật trong shot này, lên dần cùng ô đầu tiên */
  calLight.intensity = 2.10*ease(clamp(u/4.0, 0, 1))*
    (1 + 0.04*Math.sin(t*2*Math.PI/2.1));     // vẫn nhấp nháy theo nhịp nến
  /* Ở 85mm cách 1,3m bề cao nhìn thấy chỉ 0,36m mà tờ lịch cao 0,78m — khung
   * cắt mất cả tháng, chỉ còn một dải lưới. Lùi ra 2,0m để trọn tờ lịch
   * nằm trong khung (bề cao nhìn thấy 0,56m ở khoảng cách này với 50mm). */
  cam(-0.86 + drift, 1.14, 0.86,  -1.72 + drift*0.6, 1.08, -0.575, F50);
}

/* S06 · C13–C14 · 131.22–153.42s — bàn tay kéo quyển sách, mở ra trên 座卓.
 * Trang trong hiện hình vẽ MỘC BẢN: đường núi và BẢY cái cổng. Đây là "地図". */
function sc_S06(t){
  var u = loc(t, 'S06'), d = SC.S06[1] - SC.S06[0];
  show('ROOM');
  setRoom(t, 0.72, true);
  /* 0–6s: bàn tay rút sách (chỉ tới cổ tay, KHÔNG thấy mặt) */
  var grab = clamp(u/6.0, 0, 1);
  HAND.visible = u < 8.6;
  HAND.position.set(-0.84 - 0.30*ease(1-grab), 0.40, 0.96 + 0.22*ease(grab));
  HAND.rotation.set(-0.30, 2.5, 0);
  HAND.scale.setScalar(1.0);
  /* 8s: sách đặt xuống, bụi bay lên bắt sáng nến */
  updateBookDust(t, win(u, 7.0, 15.0, 1.6)*1.5);
  /* ánh dội của nến lên mặt 座卓 — nếu không có, trang giấy ra gần như đen */
  var flk = 1 + 0.038*Math.sin(t*2*Math.PI/2.1) + 0.016*Math.sin(t*2*Math.PI/0.73);
  tableBounce.intensity = 1.85*flk*ease(clamp((u - 5.0)/3.0, 0, 1));
  /* 16s: mở bìa → hai trang */
  var open = ease(clamp((u - 9.5)/3.2, 0, 1));
  bookClosedCover.visible = open < 0.5;
  bookPageL.visible = open >= 0.5; bookPageR.visible = open >= 0.5;
  /* 30s: hình vẽ mộc bản hiện trên trang trái */
  bookWoodcut.material.opacity = ease(clamp((u - 14.0)/3.4, 0, 1))*0.94;
  /* góc cao nhìn xuống 45°; chủ thể ở 1/3 DƯỚI-TRÁI; dolly-in chậm */
  var p = ease(clamp((u - 8)/(d - 9), 0, 1));
  /* góc cao nhìn xuống 45° vào mặt 座卓; sách ở 1/3 DƯỚI-TRÁI khung ⇒
   * điểm nhìn lệch LÊN-PHẢI so với quyển sách. dolly-in chậm vào trang. */
  /* ⚠ Ở F50/1.2m khung chỉ chứa 0.58m cao — cẳng tay 0.3m chiếm nửa khung và
   * đọc ra "một khúc tay bị cắt". Mở ra 35mm/1.75m: thấy cả mặt 座卓, quyển
   * sách, đĩa ぼたもち; bàn tay thành một chi tiết trong cảnh, không phải chủ thể. */
  var bp6 = BOOK.position;
  cam(bp6.x + 0.86, lerp(1.62, 1.34, p), bp6.z + 1.24 - 0.14*p,
      bp6.x + 0.20, 0.36, bp6.z + 0.04, F35);
}

/* S07 · C15 · 153.42–168.67s — trang sách NỞ thành không gian (chuyển chương).
 * dolly-in xuyên qua mặt giấy 85mm → 24mm. Bao cả khoảng lặng gap 1.5s cuối. */
function sc_S07(t){
  var u = loc(t, 'S07'), d = SC.S07[1] - SC.S07[0];
  show('MORPH');
  var p = clamp(u/(d - 1.5), 0, 1);      // 1.5s cuối = khoảng lặng, giữ khung
  var q = ease(p);
  /* thớ giấy phóng to thành địa hình */
  updateMist(MORPH.userData.fibres, t, 0.04);
  MORPH.userData.fibres.material.opacity = lerp(0.18, 0.04, q);
  morphPaper.material.opacity = 1;
  morphPaper.material.transparent = true;
  morphPaper.material.opacity = lerp(1.0, 0.0, ease(clamp((p - 0.28)/0.42, 0, 1)));
  /* nét mực NÂNG khỏi mặt phẳng, có độ sâu */
  var i;
  for(i=0; i<7; i++){
    var s = morphStrokes[i], lift = ease(clamp((p - 0.18 - i*0.035)/0.46, 0, 1));
    s.position.set(lerp(s.userData.flatX, 0, lift),
                   lerp(s.userData.flatY, 0, lift),
                   lerp(s.userData.flatZ, s.userData.deepZ, lift));
    s.scale.setScalar(lerp(1.0, 1.0 + i*0.55, lift));
    var op = 0.88*lerp(1.0, 0.55, lift);
    s.traverse(function(o){ if(o.material) o.material.opacity = op; });
  }
  /* màu chuyển PAPER_SEPIA → MIST_BLUE */
  var cshift = ease(clamp((p - 0.35)/0.45, 0, 1));
  MORPH.userData.key.color.copy(PAPER_SEPIA).lerp(MIST_BLUE, cshift);
  MORPH.userData.key.intensity = lerp(1.00, 0.72, cshift);
  morphRoad.material.opacity = ease(clamp((p - 0.48)/0.40, 0, 1))*0.92;
  morphMist.material.opacity = ease(clamp((p - 0.40)/0.45, 0, 1))*0.13;
  updateMist(morphMist, t, 0.05);
  morphFar.material.opacity = ease(clamp((p - 0.62)/0.34, 0, 1))*0.42;
  /* dolly-in XUYÊN QUA mặt giấy, mở góc = mở không gian */
  var fov = lerp(F85, F24, q);
  cam(0, lerp(0.2, 1.6, q), lerp(6.4, -3.0, q),  0, lerp(0.0, 1.4, q), -40, fov);
}

/* ===================== 第2章 — どこから来たのか =========================== */

/** đặt trọn vẹn vòng 輪廻 tại thời gian t với các tham số hiện/ẩn */
function layoutRing(t, o){
  var spin = ringAngle(t, o.spinT0 == null ? SC.S08[0] + 16 : o.spinT0, o.spd);
  if(o.spinOff) spin = 0;
  ringTorus.rotation.z = -spin;          // torus nằm ngang: quay quanh trục dọc
  ringGapDark.rotation.z = -spin + GAP_A0;
  ringGapDark.material.opacity = o.gapOp || 0;
  var i;
  for(i=0; i<5; i++){
    var a = spin + i*(Math.PI*2/5) + 1.35;
    /* né khe hở: điểm nào rơi vào khe thì đẩy lệch ra */
    var g = ringNodes[i];
    g.position.copy(ringPos(a, 0, 0.02));
    var op = (o.nodeOp == null ? 0 : o.nodeOp);
    /* C18: MỘT điểm TẮT rồi SÁNG LẠI ở vị trí kế tiếp — không biến mất khỏi vòng */
    if(o.blinkIdx === i && o.blinkK != null) op *= o.blinkK;
    g.userData.core.material.opacity = op*0.72;
    g.userData.inner.material.opacity = op;
    g.userData.bead.material.opacity = op*0.96;
  }
  for(i=0; i<2; i++){
    var ga = spin + GAP_A0 + i*(GAP_A1 - GAP_A0);
    ringGapMarks[i].position.copy(ringPos(ga, 0, 0.05));
    ringGapMarks[i].rotation.set(-Math.PI/2, 0, -ga);
    ringGapMarks[i].material.opacity = o.markOp || 0;
  }
  var ro = o.ringOp == null ? 0 : o.ringOp;
  ringTorus.material.opacity = ro;
  /* halo + vết sàn đi theo vành; cung chưa khép thì halo theo cùng cung */
  ringHaze.geometry.dispose();
  ringHaze.geometry = new THREE.TorusGeometry(RING_R, 0.30, 8, 200,
    o.arcLen == null ? Math.PI*2 : o.arcLen);
  ringHaze.rotation.x = Math.PI/2;
  ringHaze.rotation.z = -spin;
  ringHaze.scale.copy(ringTorus.scale);
  ringHaze.material.opacity = ro*(o.hazeK == null ? 0.34 : o.hazeK);
  ringFloorRing.material.opacity = ro*(o.floorK == null ? 0.26 : o.floorK);
  ringFloorRing.scale.setScalar(o.floorScale == null ? 1 : o.floorScale);
  /* sân khấu trống: sàn + sương — luôn có mặt để khung không bị TRƠN */
  ringStage.floor.material.opacity = o.stageK == null ? 0.50 : o.stageK;
  ringStage.mist.material.opacity = o.mistK == null ? 0.085 : o.mistK;
  if(o.t != null) updateMist(ringStage.mist, o.t, 0.05);
}

/* S08 · C16–C18 · 168.67–199.7s · ⭐ vòng 輪廻
 * Đoạn thẳng → uốn cong → vòng kín → quay CHIỀU KIM ĐỒNG HỒ nhìn từ trên.
 * Orbit NGƯỢC chiều quay của vòng để thấy rõ nó đang quay. */
function sc_S08(t){
  var u = loc(t, 'S08'), d = SC.S08[1] - SC.S08[0];
  show('RING');
  /* 0s đoạn thẳng · 4s bắt đầu uốn · 10s KHÉP KÍN rồi quay.
   * ⚠ Mốc cũ (uốn xong ở 12s) để nguyên nửa đầu shot là một cung duỗi mảnh
   * nằm ngoài khung — frame ở 178s ra TRƠN. Khép sớm hơn, và giữ cung TRONG
   * khung suốt lúc uốn. */
  var bend = ease(clamp((u - 3.4)/6.6, 0, 1));
  var appear = ease(clamp(u/2.0, 0, 1));
  var arcLen = lerp(0.62, Math.PI*2, bend);
  ringTorus.geometry.dispose();
  ringTorus.geometry = new THREE.TorusGeometry(RING_R, 0.075, 12, 240, arcLen);
  ringTorus.rotation.x = Math.PI/2;
  /* khi còn là "đoạn thẳng": duỗi theo X nhưng CHỈ 2.6× (cũ 8×, văng khỏi khung) */
  var flat = 1 - bend;
  ringTorus.scale.set(1 + flat*1.6, 1, 1 - flat*0.55);
  /* NĂM điểm sáng cách đều hiện ngay khi vòng khép · blink ở C18 */
  var nodeOp = ease(clamp((u - 11.0)/3.0, 0, 1))*0.95;
  var blinkT = d*0.72;
  var blinkK = 1 - win(u, blinkT, blinkT + 2.6, 0.5)*0.94;
  layoutRing(t, {ringOp:appear*0.98, nodeOp:nodeOp, spd:6.0, t:t,
    arcLen:arcLen, hazeK:lerp(0.52, 0.34, bend),
    floorK:bend*0.30, floorScale:1,
    stageK:ease(clamp(u/4.0, 0, 1))*0.52, mistK:0.085,
    spinT0:SC.S08[0] + 10, spinOff:bend < 0.995, blinkIdx:2, blinkK:blinkK});
  /* chữ 「輪廻」 ở mép DƯỚI-TRÁI: fade vào 1s, giữ ~5s, fade ra */
  ringLabel.position.set(-3.9, -0.85, 3.3);
  ringLabel.rotation.set(-0.52, 0, 0);
  ringLabel.material.opacity = win(u, 11.5, 18.5, 1.2)*0.92;
  gapLabel1.material.opacity = 0; gapLabel2.material.opacity = 0;
  gapLatin.material.opacity = 0; gapLatinA.material.opacity = 0; gapLatinB.material.opacity = 0;
  gapGlossA.material.opacity = 0; gapGlossB.material.opacity = 0;
  RING.userData.divider.material.opacity = 0; RING.userData.link.material.opacity = 0;
  var i; for(i=0; i<3; i++) spreadLabels[i].material.opacity = 0;
  /* từ vị trí hơi cao nhìn xuống 30°, orbit 25° NGƯỢC chiều vòng (vòng CW ⇒ orbit CCW).
   * Bán kính 8.2 → 6.6: vòng Ø6m ở 35mm phải CHIẾM khung, không lọt thỏm. */
  var orb = 0.62 + (u/d)*(25*Math.PI/180);
  /* Ø6m ở 35mm: 10.6m cho vòng chiếm ~60% bề ngang — chừa chỗ thở hai bên và
   * chỗ cho nhãn 「輪廻」 ở dưới-trái. Gần hơn là vành bị CẮT ở hai mép. */
  var R = lerp(11.4, 10.2, ease(clamp(u/d, 0, 1)));
  cam(Math.cos(orb)*R, R*0.52, Math.sin(orb)*R,  0, -0.30, 0, F35);
}

/* S09 · C19–C22 · 199.7–248.7s · ⭐ khe hở 中有
 * Phóng to khoảng trống giữa hai điểm sáng. Khe ở 1/3 TRÁI khung.
 * ⚠ Dấu macron trên ā phải hiện đúng. */
function sc_S09(t){
  var u = loc(t, 'S09'), d = SC.S09[1] - SC.S09[0];
  show('RING');
  ringTorus.geometry.dispose();
  ringTorus.geometry = new THREE.TorusGeometry(RING_R, 0.075, 12, 240);
  ringTorus.rotation.x = Math.PI/2;
  ringTorus.scale.set(1,1,1);
  /* vòng đứng yên để soi khe — khe nằm cố định trong khung */
  layoutRing(t, {ringOp:0.92, nodeOp:0.95, spinOff:true, t:t,
    hazeK:0.34, floorK:0.26, stageK:0.52, mistK:0.085,
    gapOp:ease(clamp(u/4.0, 0, 1))*0.95,
    markOp:ease(clamp((u - 6.0)/2.6, 0, 1))*0.88});
  /* 16s: 「中有」 rồi 「中陰」 hiện lần lượt PHÍA TRÊN KHE, hai chữ KHÔNG chồng nhau
   * ⚠ Hướng nhãn: plane chữ dùng side:DoubleSide, nên quay sai chiều là người
   * xem đọc MẶT SAU — chữ LẬT NGƯỢC. Góc cũ (gapMid + π/2) cho pháp tuyến
   * (0.75, 0, -0.67), quay LƯNG về camera của shot này. Dùng (gapMid - π/2). */
  var gapMid = (GAP_A0 + GAP_A1)/2;
  var gapYaw = gapMid - Math.PI/2;
  var gp = ringPos(gapMid, 0.55, 1.15);
  gapLabel1.position.copy(gp); gapLabel1.position.y = 1.30;
  gapLabel1.rotation.set(-0.30, gapYaw, 0);
  gapLabel1.material.opacity = ease(clamp((u - 11.0)/1.8, 0, 1))*0.94;
  gapLabel2.position.copy(gp); gapLabel2.position.y = 0.62;
  gapLabel2.rotation.copy(gapLabel1.rotation);
  gapLabel2.material.opacity = ease(clamp((u - 15.0)/1.8, 0, 1))*0.94;
  /* 24s (C21): antarābhava hiện, rồi TÁCH thành antarā | bhava */
  var latinT = 22.0;
  var split = ease(clamp((u - latinT - 4.5)/2.6, 0, 1));
  var lp = ringPos(gapMid, 0.55, 0);
  gapLatin.position.set(lp.x, -0.55, lp.z);
  gapLatin.rotation.set(-0.30, gapYaw, 0);
  gapLatin.material.opacity = ease(clamp((u - latinT)/1.8, 0, 1))*0.92*(1 - split);
  var off = 0.62*split;
  gapLatinA.position.set(lp.x - off*0.9, -0.55, lp.z + off*0.9);
  gapLatinA.rotation.copy(gapLatin.rotation);
  gapLatinA.material.opacity = split*0.92;
  gapLatinB.position.set(lp.x + off*0.9, -0.55, lp.z - off*0.9);
  gapLatinB.rotation.copy(gapLatin.rotation);
  gapLatinB.material.opacity = split*0.92;
  gapGlossA.position.set(gapLatinA.position.x, -1.10, gapLatinA.position.z);
  gapGlossA.rotation.copy(gapLatin.rotation);
  gapGlossA.material.opacity = ease(clamp((u - latinT - 7.0)/2.0, 0, 1))*0.82;
  gapGlossB.position.set(gapLatinB.position.x, -1.10, gapLatinB.position.z);
  gapGlossB.rotation.copy(gapLatin.rotation);
  gapGlossB.material.opacity = gapGlossA.material.opacity;
  var div = RING.userData.divider;
  div.position.set(lp.x, -0.55, lp.z);
  div.rotation.copy(gapLatin.rotation);
  div.material.opacity = split*0.70;
  /* 32s: ba nhãn インド → 中国 → 日本 nối nhau, mỗi nhãn sáng khi tới lượt */
  var spreadT = 36.0;
  var i;
  for(i=0; i<3; i++){
    var lb = spreadLabels[i];
    lb.position.set(-2.4 + i*2.4, -2.4, 4.4);
    lb.rotation.set(-0.42, 0, 0);
    lb.material.opacity = ease(clamp((u - spreadT - i*2.4)/1.5, 0, 1))*0.90;
  }
  var lnk = RING.userData.link;
  lnk.position.set(0, -2.66, 4.4); lnk.rotation.set(-0.42, 0, 0);
  lnk.scale.x = ease(clamp((u - spreadT)/6.0, 0, 1));
  lnk.material.opacity = ease(clamp((u - spreadT)/2.0, 0, 1))*0.52;
  ringLabel.material.opacity = 0;
  /* dolly-in dọc cung vòng 35mm → 85mm; giữ khe ở 1/3 TRÁI; cuối shot xoay 15° */
  var p = ease(clamp(u/(d*0.86), 0, 1));
  /* 85mm ở 5.5m cho khung chỉ 1.6m ngang — cung vòng tràn hết, ba nhãn
   * インド/中国/日本 ở y=-2.4 văng khỏi khung. 50mm giữ được cả khe lẫn nhãn. */
  var fov = lerp(F35, F50, p);
  var gx = Math.cos(gapMid)*RING_R, gz = Math.sin(gapMid)*RING_R;
  var camR = lerp(9.6, 6.4, p);
  var ang = gapMid + lerp(0.34, 0.34 + 15*Math.PI/180, p);
  /* nhìn về khe nhưng lệch: khe ở 1/3 trái ⇒ điểm nhìn lệch sang phải khe */
  var lookX = gx + 1.5*(1 - p*0.3), lookZ = gz - 0.7;
  cam(gx + Math.cos(ang)*camR, lerp(4.0, 2.0, p), gz + Math.sin(ang)*camR,
      lookX, lerp(0.4, 0.2, p), lookZ, fov);
}

/* S10 · C23–C25 · 248.7–286.89s — khe hở + căn phòng CÙNG TRONG MỘT KHUNG.
 * Camera TĨNH cả shot: thay đổi đến từ ĐỘ MỜ của hai lớp.
 * 28s: hai vạch ranh giới TRƯỢT SANG PHẢI đến khi ôm cả căn phòng. */
function sc_S10(t){
  var u = loc(t, 'S10'), d = SC.S10[1] - SC.S10[0];
  show2('RING', 'ROOM');
  /* lớp RING ở TRÁI khung */
  ringTorus.geometry.dispose();
  ringTorus.geometry = new THREE.TorusGeometry(RING_R, 0.075, 12, 240);
  ringTorus.rotation.x = Math.PI/2; ringTorus.scale.set(1,1,1);
  var gapMid = (GAP_A0 + GAP_A1)/2;
  layoutRing(t, {ringOp:0.78, nodeOp:0.80, spinOff:true, gapOp:0.95, markOp:0.88,
    t:t, hazeK:0.30, floorK:0.22, stageK:0.34, mistK:0.070});
  gapLabel1.material.opacity = 0; gapLabel2.material.opacity = 0;
  gapLatin.material.opacity = 0; gapLatinA.material.opacity = 0; gapLatinB.material.opacity = 0;
  gapGlossA.material.opacity = 0; gapGlossB.material.opacity = 0;
  RING.userData.divider.material.opacity = 0; RING.userData.link.material.opacity = 0;
  ringLabel.material.opacity = 0;
  var i; for(i=0; i<3; i++) spreadLabels[i].material.opacity = 0;
  /* đặt RING lệch TRÁI trong khung, ROOM lệch PHẢI — hai nhóm cùng trong view */
  RING.position.set(-5.6, 0, 0);
  RING.scale.setScalar(0.62);
  ROOM.position.set(4.6, -0.6, 0);
  ROOM.scale.setScalar(2.35);
  setRoom(t, 0.72, true);
  /* 10s: phòng mờ hiện opacity 0 → 0.35 · 20s (C25): hai lớp CÂN BẰNG 0.5/0.5 */
  var roomOp = ease(clamp((u - 7.0)/9.0, 0, 1))*0.35
             + ease(clamp((u - 17.0)/6.0, 0, 1))*0.15;
  fadeTree(ROOM, roomOp);
  candleLight.intensity *= roomOp/0.5;
  moonLight.intensity = 0.06*roomOp/0.5;
  roomAmb.intensity = 0.30*roomOp/0.5;
  var ringOpK = lerp(1.0, 0.72, ease(clamp((u - 17.0)/6.0, 0, 1)));
  ringTorus.material.opacity *= ringOpK;
  for(i=0; i<5; i++){
    ringNodes[i].userData.core.material.opacity *= ringOpK;
    ringNodes[i].userData.inner.material.opacity *= ringOpK;
    ringNodes[i].userData.bead.material.opacity *= ringOpK;
  }
  /* 28s: hai vạch ranh giới TRƯỢT SANG PHẢI, ôm lấy cả căn phòng */
  var slide = ease(clamp((u - 24.0)/(d - 25.0), 0, 1));
  for(i=0; i<2; i++){
    var mk = ringGapMarks[i];
    var ga = GAP_A0 + i*(GAP_A1 - GAP_A0);
    var base = ringPos(ga, 0, 0.05);
    /* tính vị trí thế giới rồi trượt sang phải (trong hệ RING đã scale) */
    mk.position.set(base.x + slide*(10.0 + i*8.5), 0.05 + slide*0.4, base.z);
    mk.scale.set(1 + slide*9.0, 1 + slide*22.0, 1);
    mk.material.opacity = 0.88*lerp(1.0, 0.56, slide);
  }
  /* TĨNH 50mm — không chuyển động camera cả shot */
  cam(0, 3.4, 12.6,  0, 0.4, 0, F50);
  /* trả nhóm về gốc để shot sau không thừa kế */
  RING.position.set(0,0,0); RING.scale.setScalar(1);
}

/* S11 · C26 · 286.89–296.14s · ⭐ dải bảy vạch
 * Cung vòng DUỖI THẲNG thành dải. BẢY vạch rơi xuống lần lượt, ĐỀU TUYỆT ĐỐI.
 * ⚠ Dải chia thành BẢY đoạn bằng nhau — người xem phải đếm được tới bảy. */
function sc_S11(t){
  var u = loc(t, 'S11'), d = SC.S11[1] - SC.S11[0];
  show('BAR');
  ROOM.position.set(0,0,0); ROOM.scale.setScalar(1);
  fadeTree(ROOM, 1);
  var app = ease(clamp(u/2.4, 0, 1));
  barBase.material.opacity = app*0.55;
  barTrough.material.opacity = app*0.92;
  barPlinth.material.opacity = app*0.86;
  barStage.floor.material.opacity = app*0.44;
  barStage.mist.material.opacity = 0.075;
  updateMist(barStage.mist, t, 0.05);
  barSpill.material.opacity = 0;
  var i;
  /* bảy vạch rơi xuống lần lượt, cách nhau đều trong 70% shot */
  var step = (d*0.72)/7;
  for(i=0; i<7; i++){
    var on = 1.4 + i*step;
    var fall = ease(clamp((u - on)/0.7, 0, 1));
    barTicks[i].material.opacity = fall*0.96;
    barTicks[i].position.y = lerp(0.62, 0.07, fall);
    barFills[i].material.opacity = 0;
    barFillGlows[i].material.opacity = 0;
    barDayLabels[i].material.opacity = 0;
  }
  barLabel49.material.opacity = ease(clamp((u - d*0.80)/1.4, 0, 1))*0.92;
  barLabelMan.material.opacity = 0; barLabelKiake.material.opacity = 0;
  /* tĩnh 35mm chính diện, dải ở 1/3 DƯỚI khung, drift ngang 3% sang trái */
  var drift = -0.24*(u/d);
  BAR.position.set(0, 0, 0);
  cam(drift, 1.44, 8.4,  drift, 1.44, 0, F35);
}

/* S12 · C27–C29 · 296.14–330.52s · ⭐ trang 倶舎論
 * BA thuyết hiện lần lượt: 大德 → 世友 → 毘婆沙師 (ĐÚNG thứ tự lời đọc C29).
 * Chiều cao chữ và độ sáng BẰNG NHAU — chưa thuyết nào nổi bật. */
function sc_S12(t){
  var u = loc(t, 'S12'), d = SC.S12[1] - SC.S12[0];
  show('PAGE');
  PAGE.position.set(0,0,0); PAGE.scale.setScalar(1); PAGE.rotation.set(0,0,0);
  pageTitle.material.opacity = ease(clamp((u - 1.4)/2.0, 0, 1))*0.92;
  /* 8s: ngón tay đặt lên dòng đầu, DÒ XUỐNG với tốc độ ĐỌC THẬT */
  pageFinger.visible = u > 6.0;
  var trace = clamp((u - 7.0)/(d - 9.0), 0, 1);
  pageFinger.position.set(-0.34, lerp(0.86, -0.70, ease(trace)), 0.16);
  var i;
  for(i=0; i<3; i++){
    /* BA thuyết: 14s, 20s, 26s — CÙNG cỡ, CÙNG độ sáng */
    var on = 11.5 + i*5.4;
    var op = ease(clamp((u - on)/1.6, 0, 1))*0.95;
    theoryRows[i].userData.nm.material.opacity = op;
    theoryRows[i].userData.ds.material.opacity = op;
    theoryRows[i].position.y = 0.80 - i*0.62;
  }
  yoshiRow.userData.nm.material.opacity = 0;
  yoshiRow.userData.ds.material.opacity = 0;
  yoshiNote.material.opacity = 0;
  yoshiThread.material.opacity = 0;
  for(i=0; i<3; i++) pageEraLabels[i].material.opacity = 0;
  /* góc cao nhìn xuống 50°, trang chếch 12°, dolly-in 6% chậm */
  var p = ease(clamp(u/d, 0, 1));
  PAGE.rotation.x = -0.21;      // chếch 12° so với mặt phẳng ảnh
  var dist = lerp(5.05, 4.75, p);
  cam(0.30, dist*0.76, dist*0.62,  0.20, 0.10, 0.0, F85);
}

/* S13 · C30–C32 · 330.52–371.91s · ⭐⭐ CAO TRÀO 1 — 有餘師
 * Dòng thứ tư CHEN VÀO GIỮA: nhỏ hơn 15%, sáng chỉ 60% → rồi ĐẢO NGƯỢC THỨ BẬC.
 * C32「手が止まりました」: camera DỪNG HẲN, toàn khung đứng im.
 * ⚠ Không có chữ 「嘘」「間違い」, không dấu X đỏ ở bất kỳ đâu. */
function sc_S13(t){
  var u = loc(t, 'S13'), d = SC.S13[1] - SC.S13[0];
  show('PAGE');
  PAGE.position.set(0,0,0); PAGE.scale.setScalar(1);
  PAGE.rotation.set(-0.21, 0, 0);
  pageTitle.material.opacity = 0.92;
  /* 0s: dòng thứ tư TRỒI LÊN giữa ba dòng kia */
  var rise = ease(clamp(u/2.6, 0, 1));
  yoshiRow.position.y = lerp(-0.90, -0.62, rise);
  var i;
  /* 14s: ba dòng kia mờ xuống 20%, dòng 有餘師 sáng lên 100% — CÚ LẬT */
  var flip = ease(clamp((u - 11.0)/4.2, 0, 1));
  for(i=0; i<3; i++){
    var op = lerp(0.95, 0.20, flip);
    theoryRows[i].userData.nm.material.opacity = op;
    theoryRows[i].userData.ds.material.opacity = op;
    theoryRows[i].position.y = 0.80 - i*0.62;
  }
  var yop = rise*lerp(0.60, 1.00, flip);     // 60% → 100%
  yoshiRow.userData.nm.material.opacity = yop;
  yoshiRow.userData.ds.material.opacity = yop;
  /* 8s: chú thích nhỏ 「ほかにこう言う先生もいる」 */
  yoshiNote.material.opacity = ease(clamp((u - 6.0)/2.0, 0, 1))*0.80*lerp(1.0, 0.35, flip);
  /* 20s: camera DỪNG — toàn khung đứng im, chỉ ánh nến ngoài khung hắt sáng dao động */
  var stopA = 16.0, stopB = 21.5;
  pageFinger.visible = u < stopA + 1.5;
  pageFinger.position.set(-0.34, -0.62, 0.16);
  /* 26s: dòng chữ KÉO DÀI thành sợi sáng mảnh chạy SANG PHẢI — đi NGANG */
  var pull = ease(clamp((u - stopB)/(d - stopB - 3.0), 0, 1));
  yoshiThread.scale.x = lerp(0.02, 9.0, pull);
  yoshiThread.position.set(1.5 + lerp(0, 4.2, pull), -0.62, 0.02);
  yoshiThread.material.opacity = pull*0.88;
  /* 34s: pull-back — sợi sáng băng qua trục インド → 中国 → 日本, kết ở TỜ LỊCH của S05 */
  for(i=0; i<3; i++){
    pageEraLabels[i].material.opacity = ease(clamp((pull - 0.28 - i*0.16)/0.20, 0, 1))*0.84;
  }
  /* dolly-in tới cận dòng 有餘師 → dừng → pull-back rộng */
  var zin = ease(clamp(u/stopA, 0, 1));
  var zout = ease(clamp((u - stopB)/(d - stopB), 0, 1));
  var fov = lerp(lerp(F85, F135, zin), F35, zout);
  var dist = lerp(lerp(4.6, 3.5, zin), 7.6, zout);
  var ty = lerp(lerp(0.10, -0.62, zin), -0.35, zout);
  /* nến ngoài khung HẮT SÁNG DAO ĐỘNG trên giấy trong lúc camera dừng */
  var pflick = 1 + 0.045*Math.sin(t*2*Math.PI/2.1) + 0.02*Math.sin(t*2*Math.PI/0.73);
  var still = win(u, stopA, stopB, 0.7);
  PAGE.children[0].material.emissive = PAGE.children[0].material.emissive || new THREE.Color();
  var lit = lerp(1.0, pflick, still);
  PAGE.children[0].material.color.setRGB(0.738*lit, 0.672*lit, 0.547*lit);
  cam(0.30 + lerp(0, 3.2, zout), dist*0.76, dist*0.62,
      0.20 + lerp(0, 2.6, zout), ty, 0.0, fov);
  /* tờ lịch của S05 hiện ở cuối sợi sáng — CÙNG hình, CÙNG bảy dấu bút đỏ */
  if(pull > 0.55){
    GROUPS.ROOM.visible = true;
    ROOM.position.set(9.6, -0.4, -1.2); ROOM.scale.setScalar(2.0);
    setRoom(t, 0.72, true);
    CAL.visible = true;
    var k;
    for(k=0; k<7; k++){ calCells[k].mark.material.opacity = 0.95; calCells[k].lit.material.opacity = 0.18; }
    for(k=0; k<3; k++) calLabels[k].material.opacity = 0.80;
    fadeTree(ROOM, ease(clamp((pull - 0.55)/0.30, 0, 1))*0.78);
    candleLight.intensity = 0; moonLight.intensity = 0; roomAmb.intensity = 0.9;
  }
}

/* S14 · C33–C34 · 371.91–402.37s — bản đồ lan truyền.
 * ⚠ Sợi sáng đi NGANG, KHÔNG BAO GIỜ rơi từ trên xuống 「天から降ってきた数字ではない」. */
function sc_S14(t){
  var u = loc(t, 'S14'), d = SC.S14[1] - SC.S14[0];
  show('SPREAD');
  ROOM.position.set(0,0,0); ROOM.scale.setScalar(1); fadeTree(ROOM, 1);
  PAGE.children[0].material.color.setRGB(0.738, 0.672, 0.547);
  var i;
  for(i=0; i<3; i++){
    landMasses[i].material.opacity = ease(clamp((u - i*7.5)/3.0, 0, 1))*0.88;
    spreadNames[i].material.opacity = ease(clamp((u - 1.0 - i*7.5)/2.0, 0, 1))*0.84;
  }
  /* NHIỀU sợi cùng xuất phát từ Ấn Độ → LẦN LƯỢT TẮT DẦN → còn MỘT ở Trung Quốc */
  var head = lerp(SPREAD_X[0], SPREAD_X[2] + 0.4, ease(clamp(u/(d*0.86), 0, 1)));
  for(i=0; i<5; i++){
    var th = spreadThreads[i];
    var L = head - SPREAD_X[0];
    th.scale.x = Math.max(0.01, L);
    th.position.set(SPREAD_X[0] + L/2, th.userData.lane*lerp(1.0, 0.06, clamp((head - SPREAD_X[0])/9.0, 0, 1)), 0.1);
    /* sợi giữa (i=2) là sợi SỐNG SÓT; các sợi khác tắt dần trước khi tới Trung Quốc */
    var die = (i === 2) ? 0 : ease(clamp((head - (SPREAD_X[0] + 1.6 + Math.abs(i-2)*1.5))/2.0, 0, 1));
    th.material.opacity = ease(clamp(u/1.6, 0, 1))*(i===2 ? 0.94 : 0.62)*(1 - die);
  }
  /* 34s: sợi chạm đất Nhật và TOẢ RA thành nhiều nhánh, mỗi nhánh một NGÔI NHÀ */
  var arrive = ease(clamp((u - d*0.78)/(d*0.20), 0, 1));
  for(i=0; i<9; i++){
    var dd = spreadHomes[i];
    var k2 = ease(clamp((arrive - i*0.055)/0.28, 0, 1));
    dd.material.opacity = k2*0.90;
    dd.userData.branch.material.opacity = k2*0.50;
  }
  /* travelling NGANG từ trái sang phải, đi cùng đầu sợi sáng.
   * Sợi luôn ở 1/3 TRÁI khung ⇒ camera nhìn về điểm lệch phải đầu sợi. */
  cam(head + 3.2, 0.4, 11.4,  head + 3.2, 0.2, 0, F50);
}

/* S15 · C35–C36 · 402.37–424.95s — dải bảy đoạn ĐƯỢC LÀM ĐẦY từ trái sang phải.
 * Dải ở 1/3 TRÊN khung lần này (đổi vị trí so với S11 — tránh rập khuôn). */
function sc_S15(t){
  var u = loc(t, 'S15'), d = SC.S15[1] - SC.S15[0];
  show('BAR');
  barBase.material.opacity = 0.55;
  barTrough.material.opacity = 0.94;
  barPlinth.material.opacity = 0.88;
  barStage.floor.material.opacity = 0.46;
  barStage.mist.material.opacity = 0.075;
  updateMist(barStage.mist, t, 0.05);
  var i, step = (d*0.68)/7, filled = 0;
  for(i=0; i<7; i++){
    barTicks[i].material.opacity = 0.90;
    barTicks[i].position.y = 0.07;
    /* mỗi đoạn được RÓT ĐẦY bằng ánh sáng ấm, ĐỀU TUYỆT ĐỐI */
    var fill = ease(clamp((u - 1.0 - i*step)/(step*0.88), 0, 1));
    barFills[i].scale.x = Math.max(0.001, fill);
    barFills[i].position.x = -BAR_W/2 + i*BAR_SEG + BAR_SEG*fill/2;
    barFills[i].material.opacity = fill*0.88;
    /* quầng ấm: rõ ở đoạn ĐANG rót, dịu lại khi đoạn đã đầy hẳn */
    /* quầng vừa phải: 0.30+0.34 làm bảy đoạn cháy TRẮNG, mất hẳn màu ấm
     * CANDLE_WARM — mà "rót ánh nến vào bảy tuần" là cả ý nghĩa của shot. */
    barFillGlows[i].material.opacity = fill*(0.15 + 0.20*(1 - fill));
    barFillGlows[i].position.x = -BAR_W/2 + i*BAR_SEG + BAR_SEG*fill;
    /* nhãn 「◯七日」 sáng lên khi đoạn của nó đầy — bảy lần 法要, đếm được */
    barDayLabels[i].material.opacity = ease(clamp((fill - 0.62)/0.34, 0, 1))*0.80;
    filled += fill;
  }
  /* vệt ấm đổ xuống bệ theo lượng đã rót — ánh sáng có hệ quả */
  barSpill.material.opacity = (filled/7)*0.30;
  /* mép phải chạm đích → 「満中陰」, dưới nhỏ hơn 「忌明け」 */
  var done = ease(clamp((u - 1.0 - 6*step - step*0.88)/1.6, 0, 1));
  barLabelMan.material.opacity = done*0.95;
  barLabelKiake.material.opacity = ease(clamp((u - 1.8 - 7*step)/1.8, 0, 1))*0.82;
  barLabel49.material.opacity = 0;
  /* tĩnh 35mm, dải ở 1/3 TRÊN khung ⇒ camera CAO HƠN dải và nhìn hơi xuống.
   * Mốc cũ nhìn xuống -1.55 đẩy dải lên sát mép trên, chừa 2/3 khung TRỐNG. */
  var settle = ease(clamp((u - d*0.88)/(d*0.11), 0, 1));
  BAR.position.set(0, 0, 0);
  cam(0, 2.05, lerp(8.6, 8.2, settle),  0, -0.62, 0, F35);
}

/* S16 · C37–C40 · 424.95–475.81s · ⭐ MƯỜI vị vua — tượng gỗ ngồi sau án thư.
 * 32s (C40): MỘT hình ở giữa sáng riêng (閻魔 — vị duy nhất gốc Ấn Độ),
 * rồi chín hình còn lại sáng theo sau, MUỘN HƠN 1,5s. */
function sc_S16(t){
  var u = loc(t, 'S16'), d = SC.S16[1] - SC.S16[0];
  show('KINGS');
  var i;
  var pull = ease(clamp(u/(d*0.80), 0, 1));
  for(i=0; i<10; i++){
    /* dolly lùi LẦN LƯỢT lộ thêm vua phía sau; ba hình cuối còn CHÌM TRONG SƯƠNG */
    var reveal = ease(clamp((u - 1.0 - i*3.4)/2.6, 0, 1));
    /* C40: 閻魔 (i=4) sáng TRƯỚC, chín hình kia sáng MUỘN HƠN 1.5s */
    var lightT = d*0.66;
    var enmaK = (i === 4) ? ease(clamp((u - lightT)/1.4, 0, 1))
                          : ease(clamp((u - lightT - 1.5)/1.8, 0, 1));
    var op = reveal*lerp(0.70, 1.0, enmaK);
    /* ba hình cuối mờ hơn — sương */
    if(i >= 7) op *= lerp(0.34, 0.62, clamp((u - 30)/12, 0, 1));
    kingFigs[i].traverse(function(o){
      if(o.material && o.material.type !== 'MeshBasicMaterial'){
        o.material.transparent = true; o.material.opacity = op;
      } else if(o.material){ o.material.opacity = op*0.94; }
    });
    kingFigs[i].visible = op > 0.01;
  }
  /* 24s (C39): nhãn 『十王経』— 中国で成立 + khối đất Trung Quốc mờ phía sau */
  kingsBookLabel.material.opacity = ease(clamp((u - d*0.44)/2.2, 0, 1))*0.90;
  kingsLandCN.material.opacity = ease(clamp((u - d*0.44)/4.0, 0, 1))*0.42;
  /* từ vị trí THẤP nhìn LÊN 15° (góc người đứng trước công đường), dolly-back chậm */
  cam(-4.6 - pull*3.2, 0.55, 7.4 + pull*11.0,
      -1.0 - pull*1.4, 2.3, -6.0 - pull*5.0, F35);
}

/* S17 · C41–C43 · 475.81–517.67s · ⭐ KHUNG THUMBNAIL
 * Con đường vào sương, BẢY vệt sáng xa dần. Điểm tụ ở 1/3 TRÊN-PHẢI,
 * đường chạy từ mép DƯỚI-TRÁI — đây mới là bố cục bìa đã duyệt.
 * Bao cả gap 1.5s cuối: camera giữ TĨNH. */
function sc_S17(t){
  var u = loc(t, 'S17'), d = SC.S17[1] - SC.S17[0];
  show('ROAD');
  roadMtn.visible = false;
  SCALE.visible = false;
  ROAD.userData.hint.visible = false;
  updateMist(roadMist, t, 0.05);
  roadMist.material.opacity = lerp(0.24, 0.115, ease(clamp(u/10.0, 0, 1)));
  var i;
  /* mặt đường hiện ra ở 8s (đất nện, vết chân ĐI VỀ PHÍA TRƯỚC) */
  roadSurface.material.opacity = 1;
  roadSurface.material.transparent = true;
  roadSurface.material.opacity = ease(clamp((u - 5.0)/5.0, 0, 1));
  for(i=0; i<7; i++){
    /* vệt 1 rõ dần ở 14s; các vệt sau mờ hơn theo HÀM MŨ của khoảng cách */
    var on = 9.0 + i*2.6;
    var k = ease(clamp((u - on)/3.0, 0, 1));
    var falloff = Math.exp(-i*0.46);
    roadGates[i].userData.glow.material.opacity = k*0.42*falloff + k*0.10;
    roadGates[i].visible = k > 0.02;
    roadGates[i].traverse(function(o){
      if(o.material && o.isMesh){ o.material.transparent = true; o.material.opacity = k*falloff*1.5; }
    });
    roadGateLabels[i].material.opacity = 0;
    roadKingLabels[i].material.opacity = 0;
    roadKingStatues[i].visible = false;
  }
  /* 32s (C42): BA đốm nữa NGOÀI RÌA SƯƠNG, xa hơn hẳn bảy đốm kia */
  for(i=0; i<3; i++){
    var k2 = ease(clamp((u - 26.0 - i*2.2)/3.0, 0, 1));
    roadFarDots[i].material.opacity = k2*0.34;
    roadFarLabels[i].material.opacity = k2*0.70;
  }
  /* TĨNH 50mm ở độ cao người đứng 1.6m. Đường chạy từ mép DƯỚI-TRÁI vào
   * điểm tụ ở 1/3 TRÊN-PHẢI ⇒ camera lệch TRÁI đường và nhìn chếch sang PHẢI. */
  cam(-2.35, 1.60, 8.0,  1.15, 2.62, -120, F50);
}
/* ===================== 第3章 — どこへ行くのか ============================ */

/** trạng thái chung của cảnh ĐƯỜNG: cổng nào hiện, tượng nào hiện, nhãn nào */
function roadCommon(t, u, opt){
  show('ROAD');
  updateMist(roadMist, t, 0.05);
  roadMist.material.opacity = opt.mist == null ? 0.115 : opt.mist;
  roadSurface.material.transparent = true;
  roadSurface.material.opacity = 1;
  roadMtn.visible = !!opt.mtn;
  SCALE.visible = !!opt.scale;
  ROAD.userData.hint.visible = !!opt.hint;
  var i;
  for(i=0; i<7; i++){
    var vis = opt.gates && opt.gates.indexOf(i) >= 0;
    roadGates[i].visible = vis;
    if(vis) roadGates[i].traverse(function(o){
      if(o.material && o.isMesh){ o.material.transparent = true; o.material.opacity = 1; }
    });
    if(vis) roadGates[i].userData.glow.material.opacity = 0.30;
    roadGateLabels[i].material.opacity = 0;
    roadKingLabels[i].material.opacity = 0;
    roadKingStatues[i].visible = false;
  }
  for(i=0; i<3; i++){
    roadFarDots[i].material.opacity = 0;
    roadFarLabels[i].material.opacity = 0;
  }
}

/* S18 · C44–C47 · 517.67–558.1s · ⭐ 死出の山
 * Travelling tiến với tốc độ đi bộ ~0.9 m/s ảo, camera cao 1.6m, MƯỢT TUYỆT ĐỐI.
 * Qua cổng 1 → đường dốc lên → sườn núi đá phiến XÁM-LAM.
 * ⚠ Không xương, không người ngã bên đường. */
function sc_S18(t){
  var u = loc(t, 'S18'), d = SC.S18[1] - SC.S18[0];
  roadCommon(t, u, {gates:[0], mtn:u > 26.0, mist:lerp(0.15, 0.10, clamp((u-28)/8, 0, 1)),
    hint:u > d*0.86});
  /* nhãn 「初七日」 nhỏ dưới chân cổng; tượng 秦広王 ngồi SAU cổng, KHÔNG quay đầu */
  roadGateLabels[0].material.opacity = ease(clamp((u - 1.0)/2.2, 0, 1))*0.88*(1 - ease(clamp((u - 18)/4, 0, 1)));
  roadKingStatues[0].visible = u > 5.0 && u < 22.0;
  roadKingLabels[0].material.opacity = win(u, 6.5, 19.0, 1.8)*0.86;
  /* chỉ dẫn núi-trước-sông ở góc DƯỚI-PHẢI (C47) */
  var hint = ROAD.userData.hint;
  var hk = ease(clamp((u - d*0.86)/2.2, 0, 1))*0.88;
  hint.traverse(function(o){ if(o.material) o.material.opacity = hk*(o.userData.baseOp || 0.78); });
  /* camera đi TIẾN đều; mặt đường nghiêng dần lên 0° → 14° trong 10s từ 24s */
  var walk = u*0.9;                       // 0.9 m/s ảo
  var z = 6.0 - walk;
  var slope = ease(clamp((u - 22.0)/11.0, 0, 1))*(14*Math.PI/180);
  var rise = Math.max(0, (walk - 20.0))*Math.tan(slope);
  hint.position.set(4.2, 1.35 + rise, z - 7.0);
  hint.rotation.y = 0.0;
  cam(0.30, 1.60 + rise, z,  0.05, 1.60 + rise + Math.sin(slope)*24, z - 24, F50);
}

/* S19 · C48–C50 · 558.1–595.98s — từ mỏm núi TILT-DOWN xuống thung lũng sương.
 * Dải nước ở 1/3 DƯỚI. Hai chữ 「初」「江」 TÁCH RỜI, dưới 江 hiện 「大きな川」. */
function sc_S19(t){
  var u = loc(t, 'S19'), d = SC.S19[1] - SC.S19[0];
  roadCommon(t, u, {gates:[1], mtn:true, mist:0.13});
  roadKingStatues[1].visible = u > 20.0;
  roadGateLabels[1].material.opacity = ease(clamp((u - 20.0)/2.4, 0, 1))*0.88;
  roadKingLabels[1].material.opacity = ease(clamp((u - 22.0)/2.4, 0, 1))*0.88;
  /* 32s: hai chữ 「初」「江」 TÁCH RỜI, phóng to nhẹ, rồi TRƯỢT VỀ CHỖ CŨ */
  var splitT = d*0.74;
  var sp = win(u, splitT, d - 1.5, 2.2);
  var kl = roadKingLabels[1];
  kl.scale.setScalar(lerp(1.0, 1.55, sp));
  kl.position.set(1.5 + lerp(0, -1.4, sp), 2.34 + lerp(0, 1.5, sp), GATE_Z[1] - 3.0);
  /* chú thích 「大きな川」 dưới chữ 江 */
  var gloss = ROAD.userData.gloss;
  if(!gloss){
    gloss = textPlane('大きな川', 0.44, CSS_DIM, 0);
    ROAD.add(gloss); ROAD.userData.gloss = gloss;
  }
  gloss.position.set(2.5, 2.4, GATE_Z[1] - 3.0);
  gloss.material.opacity = sp*0.84;
  /* dải nước ở xa: một vệt sáng chuyển động NGANG — dùng linkBand tạm của RIVER? Không.
   * Dựng riêng một dải mảnh trong ROAD để không bật hai nhóm. */
  var wb = ROAD.userData.waterBand;
  if(!wb){
    wb = new THREE.Mesh(new THREE.PlaneGeometry(260, 16),
      new THREE.MeshStandardMaterial({color:0x35505E, roughness:0.16, metalness:0.34,
        normalMap:riverNormal, normalScale:new THREE.Vector2(0.5,0.5),
        transparent:true, opacity:0}));
    wb.rotation.x = -Math.PI/2; wb.position.set(0, -13.5, -120);
    ROAD.add(wb); ROAD.userData.waterBand = wb;
  }
  wb.material.opacity = ease(clamp((u - 13.0)/6.0, 0, 1))*0.92;
  /* chảy TỪ TRÁI SANG PHẢI — offset texture theo t */
  riverNormal.offset.x = -(t*0.014) % 1.0;
  /* tilt-down chậm từ đường chân trời xuống thung lũng, kết ở chếch xuống 35° */
  var p = ease(clamp((u - 4.0)/(d*0.62), 0, 1));
  var lookY = lerp(6.5, -12.0, p);
  cam(0.30, 8.6, -16.0,  0.10, lookY, -16.0 - 40, F35);
}

/* S20 · C51–C53 · 595.98–630.59s — đứng ở bờ sông. 「三途」 rồi được SỬA LẠI.
 * ⚠ Cách hiểu cũ MỜ ĐI, KHÔNG bị gạch chéo, không dấu ✗ đỏ. */
function sc_S20(t){
  var u = loc(t, 'S20'), d = SC.S20[1] - SC.S20[0];
  show('RIVER');
  bridgeG.visible = false; shallowG.visible = false; deepG.visible = false;
  var i;
  for(i=0; i<3; i++) crossLabels[i].material.opacity = 0;
  sutraQuote.material.opacity = 0; sutraSrc.material.opacity = 0;
  linkBand.material.opacity = 0;
  updateMist(RIVER.userData.mist, t, 0.05);
  /* mặt nước CHẢY TỪ TRÁI SANG PHẢI với vận tốc đều — nhất quán suốt tập */
  riverNormal.offset.x = -(t*0.014) % 1.0;
  riverNormal.offset.y = (t*0.004) % 1.0;
  /* 8s: chữ 「三途」 hiện + phản chiếu ngược xuống nước */
  var ap = ease(clamp((u - 6.0)/2.4, 0, 1));
  var fade = ease(clamp((u - 16.0)/3.0, 0, 1));
  sanzuLabel.material.opacity = ap*0.94*(1 - fade*0.75);
  RIVER.userData.refl.material.opacity = ap*0.32*(1 - fade*0.75);
  /* 14s: ba vạch (cách hiểu sai) rồi MỜ ĐI */
  for(i=0; i<3; i++){
    wrongMarks[i].material.opacity = ease(clamp((u - 10.0 - i*0.7)/1.4, 0, 1))*0.66*(1 - fade);
  }
  /* 20s: ba nhãn xếp dọc + nhãn gộp 三悪道 */
  for(i=0; i<3; i++){
    sanAkuLabels[i].material.opacity = ease(clamp((u - 16.5 - i*1.8)/1.8, 0, 1))*0.92;
  }
  sanAkuHead.material.opacity = ease(clamp((u - 22.5)/2.0, 0, 1))*0.95;
  sanzuSrc.material.opacity = ease(clamp((u - d*0.82)/2.0, 0, 1))*0.72;
  /* tĩnh 35mm ở 1.6m, bờ nước ở 1/3 DƯỚI, drift ngang 2% sang PHẢI theo dòng chảy */
  var drift = 0.34*(u/d);
  cam(drift, 1.60, 14.0,  drift, 3.10, -30, F35);
}

/* S21 · C54–C57 · 630.59–678.63s · ⭐⭐ CAO TRÀO 2 — BA LỐI QUA CÙNG MỘT KHUNG
 * Crane-up 1.6m → 12m. Ba lối xếp CHÉO từ trên-trái xuống dưới-phải
 * (vector camera của 来迎図). ⚠ Vực: KHÔNG rồng, KHÔNG người chìm, KHÔNG bàn tay. */
function sc_S21(t){
  var u = loc(t, 'S21'), d = SC.S21[1] - SC.S21[0];
  show('RIVER');
  updateMist(RIVER.userData.mist, t, 0.05);
  riverNormal.offset.x = -(t*0.014) % 1.0;
  riverNormal.offset.y = (t*0.004) % 1.0;
  sanzuLabel.material.opacity = 0; RIVER.userData.refl.material.opacity = 0;
  sanAkuHead.material.opacity = 0; sanzuSrc.material.opacity = 0;
  var i;
  for(i=0; i<3; i++){ wrongMarks[i].material.opacity = 0; sanAkuLabels[i].material.opacity = 0; }
  /* 14s: NGUYÊN VĂN kinh, chữ DỌC, bên PHẢI khung + nhãn nguồn */
  sutraQuote.material.opacity = ease(clamp((u - 11.0)/2.6, 0, 1))*0.92;
  sutraSrc.material.opacity = ease(clamp((u - 13.5)/2.2, 0, 1))*0.72;
  /* 20s lối 1 橋渡 · 26s lối 2 山水瀬 · 32s lối 3 江深淵 */
  var k1 = ease(clamp((u - 17.0)/3.2, 0, 1));
  var k2 = ease(clamp((u - 23.0)/3.2, 0, 1));
  var k3 = ease(clamp((u - 29.0)/3.2, 0, 1));
  bridgeG.visible = k1 > 0.01; shallowG.visible = k2 > 0.01; deepG.visible = k3 > 0.01;
  bridgeG.traverse(function(o){ if(o.material){ o.material.transparent = true;
    o.material.opacity = (o.userData.baseOp == null ? 1 : o.userData.baseOp)*k1; } });
  bridgeG.children[bridgeG.children.length-1].material.opacity = k1*0.24;
  shallowG.traverse(function(o){ if(o.material){ o.material.transparent = true;
    o.material.opacity = (o === shallowG.userData.thin ? 0.44 :
      (o === shallowG.userData.foam ? 0.30 : 1))*k2; } });
  updateMist(shallowG.userData.foam, t, 0.10);
  deepG.traverse(function(o){ if(o.material){ o.material.transparent = true; } });
  deepG.children[0].material.opacity = k3;
  /* xoáy CHẬM — quay theo t, hàm thuần */
  for(i=0; i<deepG.userData.swirls.length; i++){
    var sw = deepG.userData.swirls[i];
    sw.rotation.z = t*0.06*(1 + i*0.22);
    sw.material.opacity = (0.30 - i*0.04)*k3;
  }
  /* 42s: ba nhãn hiện CÙNG LÚC dưới ba lối */
  var kl = ease(clamp((u - 35.0)/2.4, 0, 1))*0.92;
  for(i=0; i<3; i++) crossLabels[i].material.opacity = kl;
  /* 50s (C57): dải sáng nối ba lối — CÙNG MỘT CON SÔNG */
  linkBand.material.opacity = ease(clamp((u - d*0.86)/2.4, 0, 1))*0.36;
  /* crane-up từ 1.6m lên 12m rồi GIỮ; 35mm → 24mm; chếch xuống 40° */
  var p = ease(clamp(u/(d*0.46), 0, 1));
  var fov = lerp(F35, F24, p);
  var cy = lerp(1.60, 12.0, p);
  cam(6.0, cy, lerp(26.0, 48.0, p),  -2.0, lerp(3.0, -2.0, p), -26, fov);
}

/* S22 · C58–C59 · 678.63–705.37s · ⭐ 衣領樹
 * Cây ở 1/3 PHẢI, hai tượng ở gốc trái. ĐỘ TRĨU ba cành KHÁC NHAU RÕ RỆT,
 * mỗi cành chỉ về một lối qua sông. ⚠ Tượng mặt HIỀN, không dữ tợn. */
function sc_S22(t){
  var u = loc(t, 'S22'), d = SC.S22[1] - SC.S22[0];
  show('TREE');
  shrineG.visible = false;
  shrineLabel.material.opacity = 0;
  updateMist(TREE.userData.mist, t, 0.05);
  var i;
  /* 8s: hai tượng + nhãn */
  for(i=0; i<2; i++) treeLabels[i].material.opacity = ease(clamp((u - 7.0 - i*1.4)/2.0, 0, 1))*0.88;
  /* 22s: ba tấm VẢI trên cành — chỉ là vải, không có hình người */
  for(i=0; i<3; i++){
    var cl = treeBranchCloths[i];
    cl.material.opacity = ease(clamp((u - 17.0 - i*1.2)/2.0, 0, 1))*0.88;
    /* đung đưa RẤT CHẬM, hàm thuần của t */
    cl.rotation.z = 0.10*Math.sin(t*2*Math.PI/4.2 + i*1.1);
    cl.position.y = cl.userData.baseY + 0.03*Math.sin(t*2*Math.PI/4.2 + i*1.1);
    /* 28s: đường sáng nối cành với ba lối qua sông ở hậu cảnh */
    var th = treeThreads[i];
    var k = ease(clamp((u - 22.0 - i*0.9)/2.2, 0, 1));
    var tx = [-16, -4, 12][i], tz = [-30, -24, -16][i];
    var dx = tx - cl.position.x, dz = tz - cl.position.z;
    var L = Math.sqrt(dx*dx + dz*dz);
    th.geometry.dispose();
    th.geometry = new THREE.PlaneGeometry(L, 0.05);
    th.position.set(cl.position.x + dx/2, cl.position.y + 0.3, cl.position.z + dz/2);
    th.rotation.set(-Math.PI/2, 0, -Math.atan2(dz, dx));
    th.material.opacity = k*0.42;
  }
  treeName.material.opacity = ease(clamp((u - d*0.82)/2.2, 0, 1))*0.90;
  /* ⚠ Khung cũ: 85mm ở 11.2m ngắm x=-0.9 — hai pho tượng ở tiền cảnh chắn hết,
   * cây (trục x=2.6, cao 6.2m, tán tới x=6.3) hoàn toàn ngoài khung.
   * Khung mới: 50mm ở 15m, ngắm điểm LỆCH TRÁI trục cây ⇒ cây rơi vào 1/3 PHẢI
   * và vẫn thấy gốc + hai pho. TILT-UP theo cành trĩu như storyboard yêu cầu.
   * 6.2m cao ở 50mm cần ~13m: đủ chứa cả cây trong khung dọc. */
  var p = ease(clamp(u/d, 0, 1));
  var tilt = ease(clamp((u - d*0.40)/(d*0.52), 0, 1));
  /* Cây: trục x=2.6, cao 6.2m, tán trải x∈[-0.1, 6.3], z∈[-4, 0].
   * Ngắm vào x≈1.5 (LỆCH TRÁI trục cây) ⇒ cây rơi vào 1/3 PHẢI, hai pho tượng
   * ở gốc vẫn trong khung dưới. pan trái 10° = điểm ngắm trượt 0.8m, KHÔNG hơn:
   * pan rộng hơn là cây trượt ra khỏi mép phải (lỗi của lần trước).
   * 24mm ở 17m cho nửa bề ngang 10m — đủ chứa cả tán. */
  var lx = 1.90 - p*0.80;
  cam(0.30, 2.60, lerp(17.6, 15.4, p),
      lx, lerp(2.60, 4.30, tilt), -1.4, F35);
}

/* S23 · C60–C61 · 705.37–741.2s — cận tấm vải → lùi ra → MIẾU 奪衣婆 ĐƯỢC THỜ.
 * Điểm hình: THỨ ĐÁNG SỢ LẠI ĐƯỢC THỜ. Ấm áp đến từ ÁNH SÁNG, không từ chú thích. */
function sc_S23(t){
  var u = loc(t, 'S23'), d = SC.S23[1] - SC.S23[0];
  show('TREE');
  updateMist(TREE.userData.mist, t, 0.05);
  var i;
  for(i=0; i<2; i++) treeLabels[i].material.opacity = 0;
  treeName.material.opacity = 0;
  for(i=0; i<3; i++){
    treeThreads[i].material.opacity = 0;
    var cl = treeBranchCloths[i];
    cl.material.opacity = 0.88;
    /* 8s: VẢI DỪNG LẠI — trọng lượng ổn định, cành ngừng trĩu thêm */
    var stop = ease(clamp((u - 6.0)/3.0, 0, 1));
    var sway = (1 - stop)*0.10*Math.sin(t*2*Math.PI/4.2 + i*1.1);
    cl.rotation.z = sway;
    cl.position.y = cl.userData.baseY + (1 - stop)*0.03*Math.sin(t*2*Math.PI/4.2 + i*1.1);
  }
  /* 24s: pan sang phải, MIẾU hiện ra */
  var shrineK = ease(clamp((u - 18.0)/5.0, 0, 1));
  shrineG.visible = shrineK > 0.01;
  shrineG.traverse(function(o){
    if(o.material){ o.material.transparent = true;
      o.material.opacity = (o.userData.baseOp == null ? 1 : o.userData.baseOp)*shrineK; }
  });
  /* ngọn nến nhỏ — NGUỒN SÁNG ẤM DUY NHẤT của cả 第3章 cho tới đây */
  var flick = 1 + 0.035*Math.sin(t*2*Math.PI/2.1) + 0.015*Math.sin(t*2*Math.PI/0.73);
  shrineG.userData.light.intensity = 2.4*flick*shrineK;
  shrineG.userData.flame.material.opacity = 0.9*flick*shrineK;
  shrineG.userData.flame.scale.set(0.34*flick, 0.34*flick, 1);
  shrineLabel.material.opacity = ease(clamp((u - d*0.82)/2.4, 0, 1))*0.86;
  /* cận 135mm vào tấm vải → dolly-back + pan phải sang miếu, 135mm → 50mm */
  var p = ease(clamp((u - 10.0)/(d - 12.0), 0, 1));
  var fov = lerp(F135, F50, p);
  var clp = treeBranchCloths[1].position;
  cam(lerp(clp.x + 1.6, 2.6, p), lerp(clp.y + 0.1, 2.2, p), lerp(clp.z + 3.4, 15.5, p),
      lerp(clp.x, 7.4, p), lerp(clp.y, 1.5, p), lerp(clp.z, 2.6, p), fov);
}

/* S24 · C62–C66 · 741.2–811.27s · ⭐ trục niên đại BA MỐC
 * Mỗi mốc: cái nó CÓ và cái nó KHÔNG CÓ. Nhãn KHÔNG CÓ sáng thấp hơn + viền ĐỨT.
 * ⚠ Ba mốc cách nhau theo TỈ LỆ NĂM THẬT, không chia đều. */
function sc_S24(t){
  var u = loc(t, 'S24'), d = SC.S24[1] - SC.S24[0];
  show('CHRONO');
  updateMist(CHRONO.userData.mist, t, 0.04);
  chronoAxis.material.opacity = ease(clamp(u/4.0, 0, 1))*0.52;
  /* travelling DỌC TỪ DƯỚI LÊN theo trục thời gian: mốc 晩唐 → 往生要集 → 地蔵十王経.
   * Thứ tự trên trục theo NĂM; thứ tự KỂ theo lời đọc là 往生要集 trước (C63). */
  var ORDER = [1, 0, 2];       // index trong chronoMarks theo thứ tự lời đọc
  var i, k;
  for(i=0; i<3; i++){
    var mi = ORDER[i];
    var g = chronoMarks[mi];
    var on = 5.0 + i*18.5;
    var ap = ease(clamp((u - on)/2.6, 0, 1));
    g.userData.title.material.opacity = ap*0.92;
    g.userData.book.traverse(function(o){ if(o.material){ o.material.transparent = true;
      o.material.opacity = (o.userData.baseOp == null ? 1 : o.userData.baseOp)*ap; } });
    for(k=0; k<g.userData.has.length; k++)
      g.userData.has[k].material.opacity = ease(clamp((u - on - 2.5 - k*1.5)/1.5, 0, 1))*0.92;
    for(k=0; k<g.userData.no.length; k++){
      /* độ sáng THẤP HƠN + viền ĐỨT, KHÔNG gạch đỏ */
      var nk = ease(clamp((u - on - 7.0 - k*1.4)/1.5, 0, 1));
      g.userData.no[k].traverse(function(o){
        if(o.material) o.material.opacity = nk*(o.geometry && o.geometry.type === 'PlaneGeometry' &&
          o.material.map ? 0.58 : 0.42);
      });
    }
  }
  /* camera đi từ mốc thấp nhất (晩唐 y nhỏ) lên mốc cao nhất; nhưng KỂ theo lời đọc,
   * nên bám vị trí y của mốc đang kể. */
  var idx = clamp((u - 5.0)/18.5, 0, 2.999);
  var iA = Math.floor(idx), frac = ease(idx - iA);
  var yA = chronoMarks[ORDER[Math.min(iA,2)]].position.y;
  var yB = chronoMarks[ORDER[Math.min(iA+1,2)]].position.y;
  var cy = lerp(yA, yB, frac);
  /* trục ở 1/3 TRÁI khung ⇒ camera nhìn về điểm lệch phải trục */
  cam(1.2, cy + 1.0, 17.0,  3.6, cy + 0.2, 0, F50);
}

/* S25 · C67–C68 · 811.27–835.97s · ⭐ tấm bản đồ ĐƯỢC VẼ THÊM
 * Góc DUY NHẤT của cả tập nhìn thẳng xuống 90° — dùng một lần cho hiệu quả.
 * Ba đợt nét, BA MÀU MỰC phân biệt được. ⚠ Không 「偽経」「作り話」. */
function sc_S25(t){
  var u = loc(t, 'S25'), d = SC.S25[1] - SC.S25[0];
  show('MAP');
  var i, k;
  var ON = [4.0, 10.0, 16.0];
  for(i=0; i<3; i++){
    var kk = ease(clamp((u - ON[i])/3.4, 0, 1));
    mapLayers[i].traverse(function(o){
      if(o.material) o.material.opacity = kk*(i === 0 ? 0.72 : (i === 1 ? 0.84 : 0.90));
    });
  }
  /* 44s → cuối shot: nhiều BÀN TAY MỜ hiện quanh mép giấy rồi RÚT ĐI */
  var handK = win(u, d*0.72, d - 1.0, 1.8);
  for(k=0; k<mapHands.length; k++){
    var hk = handK*ease(clamp((u - d*0.72 - k*0.5)/1.2, 0, 1));
    mapHands[k].traverse(function(o){ if(o.material) o.material.opacity = hk*0.26; });
    mapHands[k].visible = hk > 0.01;
  }
  /* nhìn THẲNG XUỐNG 90°, xoay chậm 8° quanh trục thẳng đứng */
  MAP.rotation.y = -0.07 + (u/d)*(8*Math.PI/180);
  cam(0, 11.0, 0.001,  0, 0, 0, F50);
}

/* S26 · C69 · 835.97–856.7s — cổng 3 và 4, CÁI CÂN hai đĩa dưới xà ngang.
 * ⚠ HAI ĐĨA RỖNG SUỐT SHOT. Camera hạ xuống 1.2m (đổi cỡ, tránh rập khuôn). */
function sc_S26(t){
  var u = loc(t, 'S26'), d = SC.S26[1] - SC.S26[0];
  roadCommon(t, u, {gates:[2,3], scale:u > 15.0, mist:0.12});
  MAP.rotation.y = 0;
  roadGateLabels[2].material.opacity = win(u, 1.0, 12.0, 1.8)*0.88;
  roadGateLabels[3].material.opacity = ease(clamp((u - 12.0)/2.2, 0, 1))*0.88;
  roadKingStatues[3].visible = u > 14.0;
  roadKingLabels[3].material.opacity = 0;
  /* cái cân: hai đĩa LỆCH NHẸ rồi trở về THĂNG BẰNG — con lắc TẮT DẦN, hàm thuần của t */
  var sk = ease(clamp((u - 15.0)/2.6, 0, 1));
  SCALE.traverse(function(o){ if(o.material && o.isMesh){ o.material.transparent = true;
    o.material.opacity = (o.userData.baseOp == null ? 1 : o.userData.baseOp)*sk; } });
  var sw = (u - 15.0);
  scaleBeam.rotation.z = sk*0.16*Math.exp(-Math.max(0, sw)*0.24)*Math.sin(Math.max(0, sw)*2.3);
  /* chữ 「五官」 TÁCH thành NĂM nét sáng rồi HỢP LẠI */
  var five = win(u, d*0.66, d - 0.8, 1.6);
  var i;
  for(i=0; i<5; i++){
    var s = scaleGokanChars[i];
    var spread = five*(1 - ease(clamp((u - d*0.82)/(d*0.16), 0, 1)));
    s.position.set(lerp(0, -1.1 + i*0.55, spread), 4.3 + lerp(0, (i%2?0.35:-0.35), spread),
      GATE_Z[3] + 0.5);
    s.rotation.z = spread*(i - 2)*0.22;
    s.material.opacity = five*0.72;
  }
  SCALE.userData.label.material.opacity = ease(clamp((u - d*0.66)/2.0, 0, 1))*0.90*
    (1 - 0.5*win(u, d*0.70, d*0.82, 1.0));
  var walk = u*0.82;
  var z = GATE_Z[2] + 16.0 - walk;
  cam(0.24, 1.20, z,  0.05, 2.00, z - 24, F50);
}

/* S27 · C70 · 856.7–864.95s — đường TỐI HẲN, cổng thứ NĂM to hơn 1.8 lần.
 * Shot CHUẨN BỊ: cố ý CHƯA cho thấy chủ thể. Ánh sáng ấm hơn một chút
 * nhưng KHÔNG ĐỎ, KHÔNG LỬA. */
function sc_S27(t){
  var u = loc(t, 'S27'), d = SC.S27[1] - SC.S27[0];
  roadCommon(t, u, {gates:[4], mist:0.16});
  var i;
  for(i=0; i<5; i++) scaleGokanChars[i].material.opacity = 0;
  SCALE.userData.label.material.opacity = 0;
  roadGateLabels[4].material.opacity = ease(clamp((u - d*0.66)/1.8, 0, 1))*0.90;
  roadGates[4].userData.glow.material.opacity = lerp(0.20, 0.52, ease(clamp(u/d, 0, 1)));
  /* ánh sáng chuyển hơi ấm hơn — KHÔNG đỏ */
  var warmK = ease(clamp(u/d, 0, 1))*0.32;
  roadGates[4].userData.glow.material.color.copy(MIST_BLUE).lerp(PAPER_SEPIA, warmK);
  /* travelling CHẬM LẠI 0.9 → 0.45 m/s; tilt-up nhẹ theo chiều cao cổng */
  var p = clamp(u/d, 0, 1);
  var walk = u*lerp(0.90, 0.45, ease(p));
  var z = GATE_Z[4] + 26.0 - walk;
  var tilt = ease(p)*1.9;
  cam(0.20, 1.55, z,  0.05, 2.0 + tilt, z - 22, F50);
}

/* S28 · C71 · 864.95–874.95s · ⭐ 閻魔王 — shot ĐỐI XỨNG DUY NHẤT của cả tập.
 * Camera TĨNH TUYỆT ĐỐI, chính diện. Kéo dài tới 10s (luật nhịp ≥8s).
 * ⚠ Mặt NGHIÊM (lông mày hạ + miệng khép), KHÔNG dữ tợn: không há miệng,
 *   không răng nanh, không mắt đỏ, không lửa sau lưng. */
function sc_S28(t){
  var u = loc(t, 'S28'), d = SC.S28[1] - SC.S28[0];
  show('OVERLAY');
  roadGates[4].userData.glow.material.color.copy(MIST_BLUE);
  /* chỉ 閻魔王, 地蔵 chưa xuất hiện */
  ovEnma.visible = true;
  ovEnma.traverse(function(o){ if(o.material){ o.material.transparent = true;
    o.material.opacity = (o.userData.baseOp == null ? 1 : o.userData.baseOp); } });
  ovJizo.visible = false;
  ovOutline.material.opacity = 0;
  /* MỘT HẠT BỤI trôi qua trước mặt tượng bắt sáng — chuyển động DUY NHẤT trong khung */
  var dust = OVERLAY.userData.dust;
  if(!dust){
    dust = glow(0xE6D8B8, 0.10, 0); OVERLAY.add(dust); OVERLAY.userData.dust = dust;
  }
  var dk = win(u, 4.0, 9.0, 1.2);
  dust.position.set(lerp(-1.2, 1.3, clamp((u - 4.0)/5.0, 0, 1)), 1.55 + 0.12*Math.sin(u*0.9), 1.9);
  dust.material.opacity = dk*0.85;
  /* TĨNH TUYỆT ĐỐI 85mm chính diện đối xứng, tượng ở GIỮA khung */
  cam(0, 1.55, 5.35,  0, 1.50, 0, F85);
}

/* S29 · C72–C74 · 874.95–900.84s — hàng bảy cổng nhìn từ BÊN HÔNG.
 * 閻魔王 ở vị trí thứ NĂM; 「三十五日目」 và 「四十九日」 cùng trong khung,
 * KHOẢNG CÁCH giữa chúng NHÌN THẤY ĐƯỢC.
 * ⚠ Để người xem TỰ THẤY. Không dấu chấm than, không hiệu ứng nhấn mạnh. */
function sc_S29(t){
  var u = loc(t, 'S29'), d = SC.S29[1] - SC.S29[0];
  show('EKO');
  var i;
  /* hàng bảy cổng ĐỨNG TRÊN ĐẤT, nhìn ngang — cảnh thật, không sơ đồ.
   * ⚠ Lần dựng đầu: cổng lơ lửng y=1.4, quay nghiêng 90° (chỉ thấy hai cột),
   * bốn cổng đầu opacity 0.58 trên nền đen = vô hình, và camera mở ở 85mm cách
   * cổng 5 sáu mét ⇒ frame 900s chỉ còn MỘT khối chữ T. Sửa cả bốn thứ. */
  updateMist(EKO.userData.mist, t, 0.05);
  var gnd = EKO.userData.ground, rd = EKO.userData.road, hz = EKO.userData.haze;
  gnd.visible = true; rd.visible = true; hz.visible = true;
  var app = ease(clamp(u/3.0, 0, 1));
  gnd.material.opacity = app;
  rd.material.opacity = app*0.92;
  hz.material.opacity = app*0.46;
  /* cổng 5 (閻魔王) hiện trước, rồi lan sang hai bên — người xem thấy nó ở GIỮA hàng */
  var reveal = ease(clamp(u/(d*0.46), 0, 1));
  for(i=0; i<7; i++){
    var vis = (i === 4) ? app : app*ease(clamp((reveal - 0.14 - Math.abs(i-4)*0.12)/0.24, 0, 1));
    ekoGates[i].position.y = 0;                      // ĐỨNG TRÊN ĐẤT
    ekoGates[i].visible = vis > 0.02;
    /* cổng đã qua mờ hơn nhưng KHÔNG dưới 0.62 — thấp hơn nữa là mất hẳn */
    var op = vis*(i < 4 ? 0.70 : 1.0);
    ekoGates[i].traverse(function(o){
      if(o.material && o.isMesh){ o.material.transparent = true; o.material.opacity = op; }
    });
    /* quầng chân cổng: cổng 5 sáng nhất (nó là chủ thể), cổng 7 sáng nhì */
    var gk = (i === 4) ? 0.38 : (i === 6 ? 0.26 : (i < 4 ? 0.10 : 0.16));
    ekoGates[i].userData.glow.material.color.copy(MIST_BLUE);
    ekoGates[i].userData.glow.material.opacity = vis*gk;
    EKO.userData.gateNames[i].material.opacity = vis*(i === 4 ? 0.90 : 0.58);
    ekoHomes[i].material.opacity = 0;
    ekoThreads[i].material.opacity = 0;
  }
  ekoQuote.material.opacity = 0; ekoQuoteSrc.material.opacity = 0;
  ekoDict.material.opacity = 0; ekoLabel.material.opacity = 0;
  /* 「三十五日目」 LỚN trên cổng 5; 「四十九日」 NHỎ HƠN ở cổng 7 phía xa bên phải */
  var n35 = EKO.userData.n35, n49 = EKO.userData.n49, joinL = EKO.userData.join;
  n35.material.opacity = ease(clamp((u - d*0.40)/2.2, 0, 1))*0.94;
  n49.material.opacity = ease(clamp((u - d*0.54)/2.2, 0, 1))*0.88;
  /* đường nối từ cổng 5 tới cổng 7 sáng lên — 「まだ先があります」.
   * Hình để người xem TỰ ĐO khoảng cách; không mũi tên, không dấu nhấn. */
  var jk = ease(clamp((u - d*0.68)/(d*0.22), 0, 1));
  joinL.scale.x = Math.max(0.01, jk);
  joinL.material.opacity = jk*0.62;
  /* dolly-back từ cỡ trung của cổng 5 ra toàn hàng. Mở ở 50mm (không 85mm:
   * 85mm ở 6m chỉ chứa 1.4m ngang — một cây cột). Kết ở 35mm, 24m: cả 19.2m
   * hàng cổng trong khung, cổng 5 hơi LỆCH TRÁI tâm để cổng 6–7 có chỗ. */
  var p = ease(clamp(u/(d*0.66), 0, 1));
  var fov = lerp(F50, F35, p);
  /* Hàng cổng: tâm cột ngoài cùng ở x = ±9.6, cộng nửa bề ngang cổng 0.8m
   * ⇒ cần thấy ĐỦ 20.8m. Ở 35mm (nửa góc ngang 31.2°) cần ≥17.2m; lấy 19m cho
   * lề hai bên. Camera ngắm x=0 để bảy cổng cân giữa — lệch sang phải như trước
   * làm CỔNG THỨ NHẤT bị cắt ở mép trái (đếm ra sáu, không phải bảy). */
  cam(lerp(-9.6 + 4*3.2, 0.0, p), lerp(1.55, 3.00, p), lerp(9.0, 19.0, p),
      lerp(-9.6 + 4*3.2, 0.0, p), lerp(1.45, 1.60, p), 0, fov);
}

/* S30 · C75 · 900.84–914.85s · ⭐ 浄玻璃の鏡
 * Trong gương: NHỮNG NGÀY BÌNH THƯỜNG, không phải tội lỗi. Không bạo lực,
 * không đau khổ, không lửa. Camera KHÔNG BAO GIỜ vào thẳng trục gương. */
function sc_S30(t){
  var u = loc(t, 'S30'), d = SC.S30[1] - SC.S30[0];
  show('MIRROR');
  updateMist(MIRROR.userData.mist, t, 0.05);
  /* 8s: mặt gương sáng dần TỪ TÂM RA */
  var lit = ease(clamp((u - 3.0)/4.5, 0, 1));
  mirrorFace.material.emissiveIntensity = lit*0.55;
  /* 14s: ba hình BÌNH THƯỜNG hoà tan vào nhau, mỗi hình giữ ~4s */
  var i;
  for(i=0; i<3; i++){
    var on = 6.0 + i*3.2;
    mirrorScenes[i].material.opacity = win(u, on, on + 4.6, 1.5)*0.42*lit;
  }
  mirrorLabel.material.opacity = ease(clamp((u - d*0.72)/2.0, 0, 1))*0.90;
  mirrorSrc.material.opacity = ease(clamp((u - d*0.80)/2.0, 0, 1))*0.70;
  /* dolly-in chậm 50mm → 85mm; gương ở 1/3 PHẢI; camera LỆCH TRỤC */
  var p = ease(clamp(u/d, 0, 1));
  var fov = lerp(F50, F85, p);
  cam(lerp(-5.4, -3.4, p), 2.5, lerp(11.0, 7.6, p),  lerp(-1.2, -0.7, p), 2.3, 0, fov);
}

/* S31 · C76–C77 · 914.85–936.67s — cổng 6 và 7, SƯƠNG TAN, không gian MỞ.
 * SÁU lối toả ra theo sáu hướng. ⚠ Sáu, đếm được. Không năm, không bảy. */
function sc_S31(t){
  var u = loc(t, 'S31'), d = SC.S31[1] - SC.S31[0];
  var openT = d*0.52;
  if(u < openT){
    roadCommon(t, u, {gates:[5,6], mist:0.17});
    roadGateLabels[5].material.opacity = win(u, 1.0, 9.0, 1.6)*0.88;
    roadGateLabels[6].material.opacity = ease(clamp((u - 9.0)/2.2, 0, 1))*0.88;
    var walk = u*0.85;
    var z = GATE_Z[5] + 18.0 - walk;
    /* 50mm → 24mm khi qua cổng thứ bảy (mở góc = mở không gian) */
    var fov = lerp(F50, F24, ease(clamp((u - openT*0.72)/(openT*0.28), 0, 1)));
    cam(0.20, 1.60, z,  0.05, 2.1, z - 22, fov);
  } else {
    /* sương TAN ĐỘT NGỘT NHƯNG MƯỢT trong 4s; sáu lối toả ra, chưa rõ đầu kia */
    show('ROKU');
    var p = ease(clamp((u - openT)/4.0, 0, 1));
    var i;
    ROKU.userData.floor.material.opacity = p*0.85;
    for(i=0; i<6; i++){
      rokuPaths[i].material.opacity = p*0.82;
      rokuPaths[i].rotation.z = (i - 2.5)*0.30;
      rokuPaths[i].position.set((i - 2.5)*4.4, 0.01, -11);
      rokuArcs[i].userData.seg.material.opacity = 0;
      rokuArcs[i].children.forEach(function(o, ci){
        if(ci > 0 && o.material) o.material.opacity = 0;
      });
      rokuLabels[i].material.opacity = 0;
    }
    rokuSrc.material.opacity = 0;
    rokuGapNode.material.opacity = 0;
    for(i=0; i<2; i++) rokuGapMarks[i].material.opacity = 0;
    /* tilt-up khi sương tan; trần cao vô hạn */
    cam(0, lerp(1.6, 3.2, p), lerp(11.0, 15.0, p),  0, lerp(1.6, 2.2, p), -14, F24);
  }
}

/* S32 · C78–C79 · 936.67–961.68s · ⭐ 六道 — SÁU cung, mỗi cung 60°.
 * ⚠ 地獄道 = ĐẤT NỨT + BÓNG TỐI, tuyệt đối KHÔNG LỬA, không người bị hành hạ.
 * Thứ tự theo lời đọc C79, đi CHIỀU KIM ĐỒNG HỒ TỪ ĐÁY VÒNG. */
function sc_S32(t){
  var u = loc(t, 'S32'), d = SC.S32[1] - SC.S32[0];
  show('ROKU');
  ROKU.userData.floor.material.opacity = 0.85;
  /* sáu lối UỐN CONG, hai đầu gặp nhau thành vòng (morph LIÊN TỤC).
   * Khép NGAY TỪ ĐẦU shot (0 → 4.2s) chứ không chờ tới 4s rồi khép 6s: lời đọc
   * mở shot bằng 「では、行き先にはどんなものがあるのか」 rồi 4,5s sau đã nói
   * 「六つある」. Nhịp cũ để suốt 4s đầu chỉ có mấy dải phẳng nghiêng nằm trên
   * nền — đúng cái thấy ở frame 940. */
  /* ⚠ curl phải QUA NỬA ngay trong ~1,2s đầu: S31 đã cho xem sáu lối phẳng đủ
   * lâu rồi, sang S32 là lúc chúng khép thành vòng. Đường cong pow 0.62 làm
   * đoạn đầu chạy nhanh (u=1.3 → curl 0.62) rồi chậm lại khi sắp khép, nên
   * frame nào của shot cũng đã đọc ra DÁNG VÒNG chứ không phải mấy dải phẳng. */
  var curl = Math.pow(clamp(u/1.9, 0, 1), 0.55);
  var i;
  for(i=0; i<6; i++){
    /* lối phẳng TAN NHANH HƠN vòng hiện (mũ 2.2): để nó tắt tuyến tính theo
     * curl thì suốt lúc khép, sáu tấm mờ còn nằm đè lên vòng đang thành hình,
     * ra một đống phiến chồng chéo (frame 940 bản cũ). */
    rokuPaths[i].material.opacity = 0.82*Math.pow(1 - curl, 2.2);
    var mid = -Math.PI/2 - (i + 0.5)*Math.PI/3;
    rokuPaths[i].position.set(lerp((i - 2.5)*4.4, Math.cos(mid)*ROKU_R, curl), 0.01,
                              lerp(-11, Math.sin(mid)*ROKU_R, curl));
    rokuPaths[i].rotation.z = lerp((i - 2.5)*0.30, -mid, curl);
