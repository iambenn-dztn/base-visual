    /* sáu cung NHẬN MÀU VÀ CHẤT LIỆU ĐÚNG LÚC ĐỌC TÊN.
     * Lời đọc điểm tên sáu cõi ở u=8.76 → 12.98, tức mỗi cõi cách nhau ~0.72s.
     * Nhịp cũ (on = 9.0 + i*1.9) kéo tới u=18.5 mới xong cung thứ sáu — hình
     * trễ lời tới 5.5s, và nhãn còn trễ thêm 2.4s. Đó là lý do frame 940 chỉ
     * thấy mấy dải phẳng chưa có màu, chưa có nhãn. */
    var on = 8.55 + i*0.72;
    var k = ease(clamp((u - on)/0.9, 0, 1));
    /* cung có MẶT SẴN mờ ngay khi vòng khép (theo curl), rồi nhận màu đầy khi
     * tới tên nó. Nếu chờ hẳn tới lượt đọc thì nửa đầu shot là vòng RỖNG. */
    var seg = Math.max(curl*0.34, k);
    rokuArcs[i].userData.seg.material.opacity = seg*0.92;
    rokuArcs[i].children.forEach(function(o, ci){
      if(ci > 0 && o.material){ o.material.transparent = true;
        o.material.opacity = k*(o.userData.baseOp == null ? 0.8 : o.userData.baseOp); }
    });
    /* nhãn ở VÀNH NGOÀI — theo SÁT cung, chỉ trễ 0.35s (không 2.4s).
     * Chỉ hiện khi vòng đã khép: lúc còn là sáu lối phẳng, nhãn treo lơ lửng
     * không dính vào gì cả. */
    rokuLabels[i].material.opacity = curl*ease(clamp((u - on - 0.35)/0.8, 0, 1))*0.92;
  }
  /* 42s: vòng quay CHẬM 5°/giây, CHIỀU KIM ĐỒNG HỒ nhìn từ trên */
  var spinK = ease(clamp((u - d*0.70)/3.0, 0, 1));
  ROKU.rotation.y = spinK*(u - d*0.70)*(5*Math.PI/180);
  rokuSrc.material.opacity = ease(clamp((u - d*0.86)/2.0, 0, 1))*0.72;
  for(i=0; i<2; i++) rokuGapMarks[i].material.opacity = 0;
  rokuGapNode.material.opacity = 0;
  /* Góc nhìn: HẠ XUỐNG ~28° so với mặt vòng (trước là y=12.6 ở R=15.5 → 39°,
   * gần thượng đỉnh: sáu cung dẹt thành mấy dải màu phẳng, mất hẳn dáng VÒNG).
   * 28° cho thấy vòng là một cái vòng, vẫn đọc được cả sáu cung.
   * Crane hạ nhẹ 31° → 26° trong shot; orbit 30° NGƯỢC chiều vòng quay. */
  var p = ease(clamp(u/d, 0, 1));
  var orb = -0.9 + p*(30*Math.PI/180);
  /* Rh=15 thì vành gần máy phình ra sát hai mép khung và ba nhãn ngoài vành
   * (bán kính 9.0) rơi ra ngoài hình. 19.5 giữ trọn cả vòng lẫn nhãn. */
  var Rh = 19.5;                                  // khoảng cách NGANG tới tâm vòng
  var elev = lerp(31, 26, p)*Math.PI/180;
  var cpx = Math.cos(orb)*Rh, cpy = Rh*Math.tan(elev), cpz = Math.sin(orb)*Rh;
  cam(cpx, cpy, cpz,  0, 0.15, 0, F35);
  /* BILLBOARD nhãn — đặt SAU cam() và sau khi đã biết ROKU.rotation.y.
   * Quay mỗi nhãn quanh trục Y cho mặt chữ hướng về máy; nhãn là con của ROKU
   * (đang tự quay) nên phải TRỪ ĐI góc quay của nhóm, không thì nhãn ở nửa xa
   * đọc ngược. Tất định: chỉ là hàm của vị trí nhãn + vị trí máy, cả hai theo t. */
  for(i=0; i<6; i++){
    var lbl = rokuLabels[i];
    var wx = lbl.position.x*Math.cos(ROKU.rotation.y) + lbl.position.z*Math.sin(ROKU.rotation.y);
    var wz = -lbl.position.x*Math.sin(ROKU.rotation.y) + lbl.position.z*Math.cos(ROKU.rotation.y);
    lbl.rotation.set(0, Math.atan2(cpx - wx, cpz - wz) - ROKU.rotation.y, 0);
  }
}

/* S33 · C80 · 961.68–976.14s · ⭐ VÒNG KHÉP — đây CHÍNH LÀ vòng 輪廻 của S08.
 * Camera về ĐÚNG GÓC NHÌN của S08 (cao 30°, cùng hướng nghiêng).
 * Khe hở 中有 hiện trở lại trên vành, CÙNG vị trí tương đối như S09. */
function sc_S33(t){
  var u = loc(t, 'S33'), d = SC.S33[1] - SC.S33[0];
  show('ROKU');
  ROKU.userData.floor.material.opacity = lerp(0.85, 0.30, ease(clamp(u/d, 0, 1)));
  var i;
  for(i=0; i<6; i++){
    rokuPaths[i].material.opacity = 0;
    rokuArcs[i].userData.seg.material.opacity = 0.92;
    rokuArcs[i].children.forEach(function(o, ci){
      if(ci > 0 && o.material) o.material.opacity = (o.userData.baseOp == null ? 0.8 : o.userData.baseOp);
    });
    rokuLabels[i].material.opacity = lerp(0.90, 0.42, ease(clamp(u/d, 0, 1)));
    /* S32 quay nhãn về phía máy (billboard); shot này lùi xa nên nhãn về lại
     * hướng gốc — phải ĐẶT LẠI tường minh, không để thừa hưởng frame trước. */
    rokuLabels[i].rotation.set(0, 0, 0);
  }
  rokuSrc.material.opacity = 0.72*(1 - ease(clamp((u - d*0.5)/(d*0.4), 0, 1)));
  /* vòng quay tiếp, CHIỀU KIM ĐỒNG HỒ — không bao giờ đổi chiều */
  var spinBase = (SC.S32[1] - SC.S32[0] - (SC.S32[1]-SC.S32[0])*0.70);
  ROKU.rotation.y = (spinBase + u)*(5*Math.PI/180);
  /* 18s: KHE HỞ 中有 hiện trở lại trên vành — cùng hai vạch, cùng vị trí tương đối */
  var gk = ease(clamp((u - d*0.42)/3.0, 0, 1));
  for(i=0; i<2; i++) rokuGapMarks[i].material.opacity = gk*0.88;
  /* 26s: một điểm sáng chạy TỪ KHE HỞ VÀO một cung, rồi vòng quay tiếp */
  var run = ease(clamp((u - d*0.64)/(d*0.26), 0, 1));
  var a0 = (GAP_A0 + GAP_A1)/2, a1 = a0 - Math.PI/2.2;
  var aa = lerp(a0, a1, run);
  rokuGapNode.position.set(Math.cos(aa)*ROKU_R, 0.5, Math.sin(aa)*ROKU_R);
  rokuGapNode.material.opacity = gk*win(u, d*0.60, d - 0.6, 1.2)*0.92;
  /* dolly-back MẠNH: vòng từ 90% khung xuống 45%; orbit 20° về ĐÚNG góc S08 */
  var p = ease(clamp(u/(d*0.90), 0, 1));
  /* góc S08 cuối: orb = 0.62 + 25°; cao 4.6 ở R 8.2 với vòng bán kính 3.0
   * ⇒ tỉ lệ: cao/R = 0.561, góc nhìn xuống ~30°. Giữ đúng tỉ lệ đó ở đây. */
  var orbEnd = 0.62 + (25*Math.PI/180);
  var orb = lerp(orbEnd - (20*Math.PI/180), orbEnd, p);
  var Rk = lerp(15.5, 34.0, p);           // vòng ROKU bán kính 6.4 ≈ 2.13× vòng RING
  cam(Math.cos(orb)*Rk, Rk*0.561, Math.sin(orb)*Rk,  0, 0, 0, F35);
}
/* S34 · C81–C84 · 976.14–1026.69s · ⭐ 六文銭 — SÁU đồng, đếm được.
 * Chất liệu: GIẤY IN hình đồng tiền + MỘT đồng thật để so sánh.
 * BA nhãn thuyết CÙNG ĐỘ SÁNG — kịch bản không chọn thuyết nào.
 * ⚠ Không quan tài, chỉ có tiền và giấy. */
function sc_S34(t){
  var u = loc(t, 'S34'), d = SC.S34[1] - SC.S34[0];
  show('COINS');
  ROKU.rotation.y = 0;
  var i;
  for(i=0; i<6; i++) coinPapers[i].material.opacity = ease(clamp((u - i*0.4)/1.6, 0, 1));
  /* 16s: một đồng tiền đồng THẬT hiện bên cạnh để so sánh chất liệu */
  var realK = ease(clamp((u - 13.0)/3.0, 0, 1));
  coinReal.scale.setScalar(realK);
  coinNote.material.opacity = ease(clamp((u - 19.0)/2.2, 0, 1))*0.88;
  /* 28s: ba nhãn lần lượt — CÙNG độ sáng, không nhãn nào nổi hơn */
  for(i=0; i<3; i++)
    coinTheories[i].material.opacity = ease(clamp((u - 25.0 - i*3.4)/2.0, 0, 1))*0.88;
  coinEra.material.opacity = ease(clamp((u - d*0.80)/2.2, 0, 1))*0.80;
  /* góc cao nhìn xuống 60°, 135mm; sáu đồng ở 1/3 DƯỚI-TRÁI; pan phải RẤT CHẬM */
  var pan = 0.42*(u/d);
  cam(-0.30 + pan, 2.35, 1.50,  0.42 + pan, 0, 0.30, F135);
}

/* S35 · C85–C88 · 1026.69–1078.26s — BA NHÁNH tông phái.
 * ⚠⚠ Shot TRUNG LẬP BẮT BUỘC: độ sáng BẰNG NHAU TUYỆT ĐỐI, không nhánh nào
 *   rộng hơn, dài hơn, sáng hơn. Một hằng số SECT_OP cho cả ba. */
function sc_S35(t){
  var u = loc(t, 'S35'), d = SC.S35[1] - SC.S35[0];
  show('SECTS');
  var i;
  /* 0s: con đường bảy cổng, quen thuộc */
  var k0 = ease(clamp(u/2.6, 0, 1));
  sectMain.children[0].material.opacity = k0*SECT_OP;
  for(i=0; i<7; i++) sectGateDots[i].material.opacity = k0*SECT_OP;
  /* 10s: nhánh 2 浄土真宗 — KHÔNG cổng nào, chạy thẳng tới vùng sáng ấm */
  var k1 = ease(clamp((u - 8.0)/3.4, 0, 1));
  sectBranch2.children[0].material.opacity = k1*SECT_OP;
  sectBranch2.userData.warm.material.opacity = k1*0.42;
  /* 24s: nhánh 3 上座部仏教 — RẤT NGẮN, DỪNG NGAY */
  var k2 = ease(clamp((u - 20.0)/3.4, 0, 1));
  sectBranch3.children[0].material.opacity = k2*SECT_OP;
  var K = [k0, k1, k2];
  for(i=0; i<3; i++){
    /* nhãn: CÙNG cỡ, CÙNG màu, CÙNG hệ số — không nhánh nào được ưu ái */
    sectLabels[i].material.opacity = K[i]*ease(clamp((u - 2.0 - i*10.0)/2.0, 0, 1))*0.92;
    sectSubs[i].material.opacity = K[i]*ease(clamp((u - 4.0 - i*10.0)/2.0, 0, 1))*0.78;
  }
  sectHead.material.opacity = ease(clamp((u - d*0.74)/2.6, 0, 1))*0.92;
  /* góc cao nhìn xuống 60°, TĨNH; đường chính ở 1/3 TRÁI; drift ngang 2% sang PHẢI */
  var drift = 0.46*(u/d);
  cam(0.4 + drift, 17.5, 11.0,  0.4 + drift, 0, -1.0, F35);
}

/* S36 · C89–C91 · 1078.26–1114.92s — về phòng đêm RẤT NGẮN: tay lật trang.
 * candleHeight = 0.40 (đã cháy một lúc). C89「気が重くなっていました」:
 * ĐỔI ÁNH SÁNG, KHÔNG đổi cảnh — nến hạ một nhịp rồi trở lại. */
function sc_S36(t){
  var u = loc(t, 'S36'), d = SC.S36[1] - SC.S36[0];
  show('ROOM');
  ROOM.position.set(0,0,0); ROOM.scale.setScalar(1); fadeTree(ROOM, 1);
  setRoom(t, 0.40, true);
  bookClosedCover.visible = false;
  bookPageL.visible = true; bookPageR.visible = true;
  bookWoodcut.material.opacity = 0;
  updateBookDust(t, win(u, 0.5, 14.0, 2.0)*1.5);
  /* tay lật trang — đi qua mặt trang, KHÔNG che trang suốt shot */
  HAND.visible = u < 8.4;
  var flip = clamp(u/6.6, 0, 1);
  HAND.position.set(-1.40 + 0.34*ease(flip), 0.40 + 0.07*Math.sin(ease(flip)*Math.PI),
                    1.36 - 0.22*ease(flip));
  HAND.rotation.set(-0.42 - 0.5*Math.sin(ease(flip)*Math.PI), 2.9, 0);
  /* ⭐ trang sách phải ĐỌC ĐƯỢC: bật ánh dội của nến lên mặt 座卓.
   * Nhấp nháy CÙNG PHA với ngọn nến (cùng hai tần số) nên vẫn là "một nguồn sáng". */
  var flick = 1 + 0.038*Math.sin(t*2*Math.PI/2.1) + 0.016*Math.sin(t*2*Math.PI/0.73);
  /* 10s (C89 「気が重くなっていました」): ánh nến HẠ MỘT NHỊP rồi trở lại —
   * ĐỔI ÁNH SÁNG, KHÔNG đổi cảnh. Ánh dội hạ theo cùng nhịp. */
  var dip = win(u, 8.0, 15.0, 1.8);
  var dimK = lerp(1.0, 0.58, dip);
  tableBounce.intensity = 2.05*flick*dimK;
  candleLight.intensity *= dimK;
  candleHalo.material.opacity *= lerp(1.0, 0.60, dip);
  candleFlame.scale.y *= lerp(1.0, 0.66, dip);
  /* góc cao nhìn xuống ~50°, 50mm (không 85mm: ở 1.1m nó chỉ chứa 0.32m, trang
   * sách sâu 0.40m đã tràn); trang ở 1/3 DƯỚI ⇒ điểm ngắm dưới tâm khung.
   * dolly-in 10% chậm. Camera ở nửa PHẢI để đĩa ぼたもち rơi ra mép phải khung,
   * không chắn trang — đĩa vẫn trong khung, vẫn nguyên bốn viên. */
  var p = ease(clamp((u - 8.0)/(d - 9.0), 0, 1));
  var bp = BOOK.position;
  cam(bp.x + 0.50, lerp(1.10, 1.00, p), bp.z + 0.72 - 0.06*p,
      bp.x + 0.02, bp.y + 0.05, bp.z - 0.02, F50);
}

/* S37 · C92–C93 · 1114.92–1146.01s — bảng hai cột, BỐN dòng đầu được điền.
 * Dòng 5 VẪN TRỐNG — khoảng trống rõ ràng ở giữa bảng.
 * ⚠ Bám đúng bảng SOURCES mục 1. Không tự điền dòng 6–10 ở shot này. */
function sc_S37(t){
  var u = loc(t, 'S37'), d = SC.S37[1] - SC.S37[0];
  show('TABLE');
  TABLE.userData.cover.g.visible = false;
  TABLE.position.set(0,0,0); TABLE.rotation.set(0, 0, 0);
  TABLE.rotation.y = -0.175;               // bảng chếch 10°
  tableHeadL.material.opacity = ease(clamp(u/2.0, 0, 1))*0.92;
  tableHeadR.material.opacity = ease(clamp((u - 3.0)/2.2, 0, 1))*0.92;
  /* 8s: giải nghĩa 「本地 ― 本当の姿とされる仏」 */
  tableGloss.material.opacity = ease(clamp((u - 5.5)/2.2, 0, 1))*0.84;
  tableFooter.material.opacity = 0;
  var i;
  for(i=0; i<10; i++){
    var r = tableRows[i];
    /* cột TRÁI (mười vị vua) hiện sẵn cho bốn dòng đầu + dòng 5 */
    var lk = (i < 5) ? ease(clamp((u - 2.0 - i*1.0)/1.4, 0, 1)) : 0;
    r.userData.L.material.opacity = lk*0.94;
    /* cột PHẢI: bốn dòng đầu điền lần lượt; DÒNG 5 VẪN TRỐNG */
    var rk = (i < 4) ? ease(clamp((u - 11.0 - i*5.6)/2.0, 0, 1)) : 0;
    r.userData.R.material.opacity = rk*0.94;
    r.userData.ar.material.opacity = rk*0.46;
    if(r.userData.sub) r.userData.sub.material.opacity = 0;
  }
  /* tĩnh 85mm; travelling XUỐNG dọc theo bảng theo tốc độ lời đọc, dừng ở dòng 5 */
  var scrollTo = lerp(3.30, 3.30 - 4*0.72, ease(clamp((u - 8.0)/(d - 9.0), 0, 1)));
  cam(1.9, scrollTo + 0.15, 7.4,  0.1, scrollTo, 0, F85);
}

/* S38 · C94–C96 · 1146.01–1166.17s · ⭐⭐⭐ CAO TRÀO 3 — CÚ LẬT CỦA TẬP
 * Dòng 5: bên trái 閻魔王, bên phải Ô TRỐNG — GIỮ TRỐNG, rồi 地蔵菩薩 hiện ra
 * TỪ TỪ, nét này sau nét kia. Camera DỪNG HẲN ở C95.
 * ⚠ Chuyển chồng phải MƯỢT VÀ CHẬM, không nhấp nháy. Một frame trông ma quái
 *   là hỏng cả luật 4d. */
function sc_S38(t){
  var u = loc(t, 'S38'), d = SC.S38[1] - SC.S38[0];
  /* mergeT 8.0s (KHÔNG d*0.66 = 13.3s): lời đọc chuyển sang tả pho tượng ven
   * đường từ u=7.9 (「道ばたに立って」「前掛けをかけてもらっている」). Giữ bảng
   * tới 13.3s thì suốt đoạn tả tượng khung vẫn là tờ giấy — hình trễ lời 5s. */
  var mergeT = 8.0;
  if(u < mergeT){
    show('TABLE');
    TABLE.userData.cover.g.visible = false;
    TABLE.position.set(0,0,0); TABLE.rotation.set(0, -0.175, 0);
    tableHeadL.material.opacity = 0.92; tableHeadR.material.opacity = 0.92;
    tableGloss.material.opacity = 0.84; tableFooter.material.opacity = 0;
    /* ⚠ CHÁY TRẮNG: đèn điểm của TABLE là 2.6 ở (-3,3,5.5), mà dolly-in của shot
     * này đưa máy tới z=5.6 — tức NGAY CẠNH đèn, với tờ giấy 0xBEAE8E chiếm cả
     * khung ở FOV135. Cảnh vẽ HDR tuyến tính nên luminance vọt quá ngưỡng bloom
     * 1.0 trên gần hết khung: ra một vệt kem, chữ bị bloom xoá sạch.
     * Hạ đèn theo tiến độ dolly-in để độ sáng tờ giấy giữ nguyên khi máy áp sát. */
    var i;
    for(i=0; i<10; i++){
      var r = tableRows[i];
      r.userData.L.material.opacity = (i < 5) ? 0.94 : 0;
      r.userData.R.material.opacity = (i < 4) ? 0.60 : 0;
      r.userData.ar.material.opacity = (i < 4) ? 0.30 : 0;
      if(r.userData.sub) r.userData.sub.material.opacity = 0;
    }
    /* dòng 5: 閻魔王 SÁNG; ô phải GIỮ TRỐNG — khoảng lặng thị giác */
    tableRows[4].userData.L.material.opacity = 0.98;
    /* 「地蔵菩薩」 hiện ra TỪ TỪ, nét này sau nét kia — không pop-in.
     * Xong ở u≈6.3, đúng lúc lời đọc nói 「お地蔵さんです」. */
    var reveal = ease(clamp((u - 2.6)/3.4, 0, 1));
    tableRows[4].userData.R.material.opacity = reveal*reveal*0.98;
    tableRows[4].userData.ar.material.opacity = reveal*0.50;
    /* dolly-in tới dòng 5, DỪNG HẲN ở C95 (giữ tĩnh tuyệt đối).
     * Khung cuối phải chứa CẢ HAI cột (x = ±1.85 + nửa bề chữ ≈ 2.35): ở F50
     * (hfov 46°) cần đứng xa ≈ 5.6. Dolly tới z=3.05 như trước thì nửa khung chỉ
     * còn 1.3 → cột phải nằm NGOÀI khung, đúng như frame 1155 cho thấy. */
    var stopAt = 5.0;
    var p = ease(clamp(u/stopAt, 0, 1));
    var fov = F50;
    var y5 = 3.30 - 4*0.72;
    /* đèn LÙI RA XA và hạ cường độ: 2.6 ở cách 2-3m là quầng cháy trắng giữa
     * tờ giấy (thấy rõ ở frame 1150). 0.70 ở xa hơn cho tờ giấy đều màu. */
    tablePL.intensity = lerp(1.25, 0.70, p);
    tablePL.position.set(lerp(-4.2, -5.2, p), lerp(4.4, 5.0, p), lerp(9.0, 10.5, p));
    /* z cuối 6.75: bảng nghiêng -0.175 rad đẩy mép chữ cột phải ra x=2.49,z=0.47
     * → cần nửa khung ≥2.55 ở mặt phẳng đó. z=5.62 chỉ cho 2.20, chữ 地蔵菩薩
     * bị cắt mất chữ cuối. Lệch tâm +0.06 bù độ nghiêng của bảng. */
    cam(lerp(0.85, 0.06, p), lerp(y5 + 1.25, y5, p), lerp(9.4, 6.75, p),
        lerp(0.30, 0.06, p), lerp(y5 + 0.55, y5, p), 0, fov);
  } else {
    /* ══ CÚ LẬT CỦA TẬP ════════════════════════════════════════════════════
     * 閻魔王 và 地蔵菩薩 chồng lên nhau trong CÙNG MỘT HÌNH BÓNG. Spec (S38,
     * 34s) đòi đúng một thứ: "hai pho, dáng khác nhau, nhưng ĐƯỜNG VIỀN NGOÀI
     * TRÙNG KHỚP". Người xem phải thấy MỘT dáng trước, rồi mới nhận ra trong
     * đó có hai pho.
     *
     * ⚠ Bản trước hỏng vì chồng NGUYÊN CẢ hai pho: án thư, hai chân bàn, ghế
     *   và tựa lưng của 閻魔 cắt ngang thân 地蔵 thành từng khúc, nên khung đọc
     *   ra HAI VẬT THỂ RIÊNG xếp đè nhau — đúng cái "hiệu ứng ma quái" mà spec
     *   cảnh báo là hỏng cả luật 4d.
     *
     * Bản này chia làm BA giai đoạn, nối liền, không giật:
     *   q1 (0 → 3.2s)  ĐỒ ĐẠC TAN TRƯỚC. 閻魔 vẫn đặc, chỉ án thư/chân bàn/ghế
     *                  /tựa lưng mờ dần về 0. Còn lại một PHO TƯỢNG NGỒI, viền
     *                  ngoài sạch — chưa có gì lạ xảy ra, chỉ là khung giản đi.
     *   q2 (2.4 → 8.0s) 地蔵 dâng lên TRONG LÒNG hình bóng đó, hai đầu trùng
     *                  tâm. Chồng chéo với q1 1.2s nên không có mốc nào "cắt".
     *   q3 (6.0 → 11s)  cân bằng về 0.60/0.66 rồi ĐỨNG YÊN.
     * Toàn bộ dùng ease() (smootherstep, đạo hàm hai đầu = 0) nên không frame
     * nào nhảy — kể cả khi scrub từng frame.
     * ═════════════════════════════════════════════════════════════════════ */
    show('OVERLAY');
    var ud = u - mergeT;
    /* NHỊP: S38 kết ở u=20.16 nên chỉ có 12.16s cho cả cú lật. Chia sao cho
     * hình CHỒNG XONG quanh u≈14 (giây cảnh ≈1160) — đó là chỗ lời đọc đã nói
     * hết 「前掛けをかけてもらっている」 và đang bước sang 「あのお地蔵さん」.
     * Chồng xong muộn hơn thì hình trễ lời, mà trễ ở đúng cú lật là mất cú lật.
     * Ba pha vẫn chồng mép nhau nên không có mốc nào "cắt". */
    var qFurn = ease(clamp(ud/2.6, 0, 1));          // đồ đạc tan  (u 8.0→10.6)
    var qJz   = ease(clamp((ud - 1.6)/4.6, 0, 1));  // 地蔵 dâng lên (u 9.6→14.2)
    var qBal  = ease(clamp((ud - 4.4)/6.0, 0, 1));  // cân bằng     (u 12.4→18.4)
    ovEnma.visible = true; ovJizo.visible = true;

    /* 閻魔 nhường chỗ: 1.0 → 0.42. Phải xuống THẤP HƠN 地蔵, vì 閻魔 là pho
     * ĐẶC nằm phía sau mà thân áo bào lại RỘNG HƠN — để hai bên ngang nhau
     * thì áo bào 閻魔 trùm kín 地蔵 và khung chỉ còn MỘT pho (đúng lỗi thấy ở
     * frame 1160 bản trước: 地蔵 gần như biến mất, cả yếm đỏ cũng mất). */
    var ke = lerp(1.0, 0.52, qJz*0.66 + qBal*0.34);
    /* 地蔵 lên tới 0.80 — pho ĐANG hiện ra là chủ thể của cú lật, nó phải đọc
     * rõ hơn pho đang lui đi. */
    var kj = lerp(0.0, 0.74, qJz);
    /* ĐỒ ĐẠC: hệ số riêng, tan gần hết TRƯỚC khi 地蔵 kịp hiện rõ.
     * Giữ 0.05 thay vì 0 tuyệt đối — mất sạch thì pho tượng "ngồi trên không",
     * còn một vệt rất mờ thì mắt vẫn đọc ra là tượng ngồi. */
    var kf = lerp(1.0, 0.03, qFurn);
    /* ⚠ THỨ TỰ VẼ, chỗ dễ sai nhất của cảnh này.
     *   Hai pho đều bán trong suốt và LỒNG VÀO NHAU, nên depth buffer không
     *   giải quyết được: pho nào ghi depth trước là pho kia biến mất, bất kể
     *   opacity. Bản trước để 閻魔 ghi depth khi ke>0.5 ⇒ nó khoá luôn vùng
     *   thân và 地蔵 (cùng tấm yếm đỏ) bị xén sạch.
     *   Cách đúng: TẮT depthWrite cả hai trong lúc chồng, và ép thứ tự vẽ
     *   bằng renderOrder — 閻魔 (sau) vẽ trước, 地蔵 (trước) vẽ sau. Alpha-blend
     *   khi đó ra đúng thứ tự từ xa tới gần. */
    ovEnma.traverse(function(o){
      if(!o.material) return;
      o.material.transparent = true;
      o.material.depthWrite = false;
      o.renderOrder = 1;
      var b = (o.userData.baseOp == null ? 1 : o.userData.baseOp);
      /* chữ 王 trên mũ: vàng sáng, lại rơi đúng đỉnh đầu 地蔵 khi hai tâm đầu
       * trùng nhau — để nguyên thì nó là thứ SÁNG NHẤT khung và hút hết mắt
       * khỏi chỗ cần nhìn. Hạ riêng xuống 0.30 (không tắt hẳn: nó là dấu duy
       * nhất nói pho đang mờ đi kia là 閻魔). */
      var kMark = o.userData.isCrownMark ? lerp(1.0, 0.30, qJz) : 1;
      o.material.opacity = b*ke*(o.userData.isFurn ? kf : 1)*kMark;
    });
    ovJizo.traverse(function(o){
      if(!o.material) return;
      o.material.transparent = true;
      o.material.depthWrite = false;
      o.renderOrder = o.userData.isBib ? 3 : 2;
      /* yếm đỏ được nâng: kj kéo lên phía 0.96 theo hệ số 0.45, NHƯNG vẫn
       * nhân qJz để nó khởi hành từ 0 đúng lúc cả pho khởi hành — nếu chỉ
       * dùng (1−(1−kj)·0.45) thì ở kj=0 tấm yếm đã hiện sẵn 0.55 và đỏ POP
       * ra trước khi có pho tượng nào.  qJz=1 ⇒ kj=0.80 ⇒ kb=0.87. */
      var kb = o.userData.isBib ? qJz*(kj + (0.96 - kj)*0.45) : kj;
      o.material.opacity = (o.userData.baseOp == null ? 1 : o.userData.baseOp)*kb;
    });

    /* ĐẦU CHỒNG ĐẦU — chỗ cú lật thật sự đọc ra.
     * 閻魔 ngồi: tâm đầu y = 1.34·1.35 − 0.3 = 1.509.
     * 地蔵 đứng: tâm đầu y = 1.905·1.12 − 0.3 = 1.833.
     * Nâng 閻魔 đúng 0.324 cho hai tâm đầu trùng nhau. KHÔNG lệch ngang —
     * lệch ngang là thứ đẩy hai đầu tách ra và phá đúng cái cần thấy. */
    /* ── KHỚP CỠ, rồi mới khớp chỗ ─────────────────────────────────────
     * Chỉ trùng TÂM ĐẦU là chưa đủ: 閻魔 ở scale 1.35 có đầu bán kính
     * 0.155·1.35 = 0.209, còn 地蔵 ở 1.12 có 0.285·1.12 = 0.319 — đầu 地蔵 to
     * hơn RƯỠI. Hai vầng đầu lệch cỡ như vậy thì mắt đọc ngay ra "hai pho
     * chồng lên nhau", không bao giờ ra "một hình bóng".
     * Kéo hai cỡ về gặp nhau TRONG LÚC chồng (không nhảy cỡ ở mốc nào):
     *   閻魔 1.35 → 1.52  (đầu 0.236, thân rộng ra)
     *   地蔵 1.12 → 1.03  (đầu 0.294)
     * còn chênh 0.058 — đủ gần để hai vầng đầu chỉ còn là MỘT đường viền hơi
     * dày, đúng cái spec gọi là "đường viền ngoài trùng khớp". */
    var sE = lerp(1.35, 1.52, qJz), sJ = lerp(1.12, 1.03, qJz);
    ovEnma.scale.setScalar(sE); ovJizo.scale.setScalar(sJ);
    /* tâm đầu: 地蔵 ở 1.905·sJ, 閻魔 ở 1.34·sE (đều tính từ gốc nhóm).
     * Đặt gốc 地蔵 ở -0.3 rồi nâng 閻魔 đúng phần chênh — tính LẠI mỗi frame
     * theo sE/sJ hiện hành, không hằng số chết. */
    var hJ = 1.905*sJ, hE = 1.340*sE;
    ovJizo.position.set(0, -0.3, 0.16);
    ovEnma.position.set(0, -0.3 + (hJ - hE), 0);
    ovOutline.material.opacity = 0;
    if(OVERLAY.userData.dust) OVERLAY.userData.dust.material.opacity = 0;
    /* ── BỆ CHUNG: CẤT ĐI trong S38 ──────────────────────────────────────
     * Phiến bệ 5.2×1.7 nằm ở y=-0.41; mặt TRÊN của nó hứng trọn đèn hướng
     * 0.62 từ (-3,6,7) nên dù màu nền chỉ 0x15140F nó vẫn sáng lên thành một
     * PHIẾN XÁM vắt ngang đáy khung — đúng vào dải mà phụ đề phải nằm.
     * S38 là cảnh duy nhất lấy khung đủ rộng để thấy nó (S39 quay ở F85
     * lookAt 1.45, đáy khung y=0.52, bệ đã ngoài khung). Nên cất riêng ở đây,
     * không đụng tới hình học dùng chung. */
    if(ovPed) ovPed.visible = false;

    /* ── KHUNG: nâng lên, chừa hẳn dải dưới cho phụ đề ───────────────────
     * #sub nằm ở bottom 8.2% với cỡ chữ 58px/line-height 1.35 → chiếm dải
     * 84.5%–92% chiều cao khung. Bản trước lookAt y=1.42 ở z=4.85 kéo cả
     * chân bệ xuống đè lên đúng dải đó.
     * F50 ⇒ vfov 27.0°, nửa khung = z·tan(13.5°) = z·0.2401.
     * z = 7.05 ⇒ nửa khung 1.693. lookAt y = 0.84 ⇒ khung phủ −0.85 … 2.53:
     *   · đỉnh 錫杖 (2.53) vừa lọt mép trên,
     *   · hai đầu trùng nhau (1.83) nằm ở 20% từ trên — trọng tâm đúng chỗ,
     *   · chân bệ (−0.25) rơi ở 82% — NGAY TRÊN dải phụ đề, không chạm.
     * Push rất chậm 7.45 → 7.05 rồi DỪNG HẲN: có nhịp thở, không có "cú máy". */
    var pz = lerp(7.45, 7.05, qBal);
    cam(0.05, 1.20, pz,  0.05, 0.84, 0, F50);
  }
}

/* S39 · C97–C101 · 1166.17–1215.04s — hai pho TÁCH trở lại, CÙNG ánh sáng,
 * CÙNG độ sáng, CÙNG một bệ. C100「同じ一人だ」: một đường viền sáng ÔM CẢ HAI
 * thành MỘT hình duy nhất. Rồi bìa kinh: 地蔵菩薩 ở ĐẦU tên sáng TRƯỚC. */
function sc_S39(t){
  var u = loc(t, 'S39'), d = SC.S39[1] - SC.S39[0];
  var coverT = d*0.58;
  if(u < coverT){
    show('OVERLAY');
    /* 0s: hai pho TÁCH RA — không pho nào tối hơn */
    var sep = ease(clamp(u/5.0, 0, 1));
    ovEnma.visible = true; ovJizo.visible = true;
    /* S38 kết ở trạng thái đã KHỚP CỠ (閻魔 1.52 / 地蔵 1.03) và 閻魔 được nâng
     * cho hai đầu trùng tâm. Trả cả hai về cỡ gốc (1.35 / 1.12) và hạ 閻魔 về
     * bệ chung ĐỒNG THỜI với lúc hai pho tách ra — chỗ nối S38→S39 là CUT liên
     * tục nên mọi giá trị phải khởi hành đúng từ trạng thái S38 để lại. */
    var s39E = lerp(1.52, 1.35, sep), s39J = lerp(1.03, 1.12, sep);
    ovEnma.scale.setScalar(s39E); ovJizo.scale.setScalar(s39J);
    var lift39 = 1.905*s39J - 1.340*s39E;
    ovEnma.position.set(lerp(0, -1.45, sep), -0.3 + lift39*(1 - sep), 0);
    ovJizo.position.set(lerp(0, 1.45, sep), -0.3, lerp(0.16, 0.15, sep));
    /* S38 để lại 閻魔 ở 0.60 và 地蔵 ở 0.66; khởi hành ĐÚNG từ đó rồi cùng lên
     * 1.0, nếu không chỗ CUT S38→S39 sẽ nháy một cái. */
    var opE = lerp(0.60, 1.0, sep), opJ = lerp(0.66, 1.0, sep);
    /* ĐỒ ĐẠC của 閻魔 (án thư, ghế) bị S38 hạ về 0.05 để hai pho khớp viền.
     * Trả lại DẦN trong lúc tách — án thư hiện lại đúng lúc 閻魔 rời sang
     * trái, nên nó đọc ra là "pho tượng lui về chỗ ngồi của mình". */
    var fBack = ease(clamp((u - 1.2)/4.2, 0, 1));
    var kfB = lerp(0.05, 1.0, fBack);
    /* đầu S39 hai pho vẫn còn lồng vào nhau (sep≈0) nên giữ nguyên cách vẽ
     * của S38: tắt depthWrite, ép thứ tự xa→gần. Tách ra rồi (sep>0.55) thì
     * trả về vẽ đặc bình thường — lúc đó không còn gì chồng nhau nữa. */
    var solid39 = sep > 0.55;
    ovEnma.traverse(function(o){ if(o.material){ o.material.transparent = true;
      o.material.depthWrite = solid39; o.renderOrder = solid39 ? 0 : 1;
      var bE = (o.userData.baseOp == null ? 1 : o.userData.baseOp);
      o.material.opacity = bE*opE*(o.userData.isFurn ? kfB : 1); } });
    ovJizo.traverse(function(o){ if(o.material){ o.material.transparent = true;
      o.material.depthWrite = solid39; o.renderOrder = solid39 ? 0 : 2;
      o.material.opacity = (o.userData.baseOp == null ? 1 : o.userData.baseOp)*opJ; } });
    if(OVERLAY.userData.dust) OVERLAY.userData.dust.material.opacity = 0;
    /* 20s (C100): đường viền sáng CHẠY VÒNG ôm cả hai pho thành MỘT hình */
    var ring = ease(clamp((u - 16.0)/5.0, 0, 1));
    ovOutline.material.opacity = ring*0.50;
    ovOutline.scale.set(lerp(1.0, 1.72, ring), 1.35, 1.0);
    /* orbit chậm 25° quanh hai pho, 85mm */
    var orb = -Math.PI/2 + ease(clamp(u/coverT, 0, 1))*(25*Math.PI/180);
    var R = 6.6;
    cam(Math.cos(orb)*R, 1.85, -Math.sin(orb)*R,  0, 1.45, 0, F85);
  } else {
    /* dolly-back sang BÌA SÁCH, 85mm → 50mm */
    show('TABLE');
    TABLE.position.set(0,0,0); TABLE.rotation.set(0,0,0);
    tableHeadL.material.opacity = 0; tableHeadR.material.opacity = 0;
    tableGloss.material.opacity = 0; tableFooter.material.opacity = 0;
    var i;
    for(i=0; i<10; i++){
      tableRows[i].userData.L.material.opacity = 0;
      tableRows[i].userData.R.material.opacity = 0;
      tableRows[i].userData.ar.material.opacity = 0;
      if(tableRows[i].userData.sub) tableRows[i].userData.sub.material.opacity = 0;
    }
    var cv = TABLE.userData.cover;
    cv.g.visible = true;
    var q = ease(clamp((u - coverT)/5.0, 0, 1));
    cv.g.children[0].material.transparent = true;
    cv.g.children[0].material.opacity = q;
    /* BỐN chữ 「地蔵菩薩」 sáng TRƯỚC, rồi 「発心因縁十王経」 theo sau */
    cv.t1.material.opacity = ease(clamp((u - coverT - 3.0)/2.4, 0, 1))*0.96;
    cv.t2.material.opacity = ease(clamp((u - coverT - 8.0)/2.6, 0, 1))*0.82;
    cv.t3.material.opacity = ease(clamp((u - coverT - 13.0)/2.4, 0, 1))*0.70;
    var fov = lerp(F85, F50, q);
    cam(0.5, 0.2, lerp(22.0, 25.5, q),  0, 0, 14, fov);
  }
}

/* S40 · C102–C103 · 1215.04–1241.85s — bảng MƯỜI DÒNG hoàn chỉnh.
 * Rồi CỘT TRÁI hạ xuống 20%, cột phải giữ 100% — mười tên Phật thành MỘT CỘT LIỀN.
 * ⚠ dòng 6 = 弥勒菩薩, dòng 7 = 薬師如来. Không nhầm. */
function sc_S40(t){
  var u = loc(t, 'S40'), d = SC.S40[1] - SC.S40[0];
  show('TABLE');
  TABLE.userData.cover.g.visible = false;
  TABLE.position.set(0,0,0); TABLE.rotation.set(0, -0.175, 0);
  tableHeadL.material.opacity = 0.92; tableHeadR.material.opacity = 0.92;
  tableGloss.material.opacity = 0.62;
  /* 44s: cột TRÁI hạ xuống 20%, cột PHẢI giữ 100% */
  var dim = ease(clamp((u - d*0.72)/(d*0.22), 0, 1));
  var i;
  for(i=0; i<10; i++){
    var r = tableRows[i];
    var fill = (i < 5) ? 1 : ease(clamp((u - 4.0 - (i-5)*3.4)/2.0, 0, 1));
    r.userData.L.material.opacity = fill*lerp(0.94, 0.20, dim);
    r.userData.R.material.opacity = fill*0.94;
    r.userData.ar.material.opacity = fill*lerp(0.46, 0.10, dim);
    if(r.userData.sub) r.userData.sub.material.opacity = fill*ease(clamp((u - 12.0)/2.0, 0, 1))*0.76;
  }
  tableFooter.material.opacity = ease(clamp((u - d*0.82)/2.2, 0, 1))*0.92;
  /* pull-back từ cận dòng 5 ra TOÀN BẢNG, 135mm → 50mm; bảng ở 1/3 PHẢI */
  var p = ease(clamp(u/(d*0.86), 0, 1));
  var fov = lerp(F135, F50, p);
  var y5 = 3.30 - 4*0.72;
  cam(lerp(1.2, -3.4, p), lerp(y5 + 0.10, 0.1, p), lerp(5.6, 13.2, p),
      lerp(0.0, -1.6, p), lerp(y5, 0, p), 0, fov);
}

/* S41 · C104–C107 · 1241.85–1282.92s · ⭐ ĐẢO CHIỀU MŨI TÊN
 * Bảy sợi sáng đi TỪ DƯỚI LÊN: từ NHÀ ra ĐƯỜNG, không phải từ cõi kia về.
 * ⚠ Chiều chuyển động là TOÀN BỘ ý nghĩa shot. Kiểm kỹ.
 * Cuối: fade sang đen 2s — LẦN DUY NHẤT của tập cắt về đen. */
function sc_S41(t){
  var u = loc(t, 'S41'), d = SC.S41[1] - SC.S41[0];
  show('EKO');
  updateMist(EKO.userData.mist, t, 0.05);
  var i;
  for(i=0; i<7; i++){
    ekoGates[i].visible = true;
    ekoGates[i].traverse(function(o){
      if(o.material && o.isMesh){ o.material.transparent = true; o.material.opacity = 0.92; }
    });
    ekoGates[i].userData.glow.material.opacity = 0.24;
  }
  if(EKO.userData.n35){ EKO.userData.n35.material.opacity = 0;
    EKO.userData.n49.material.opacity = 0; EKO.userData.join.material.opacity = 0; }
  /* 8s: trang từ điển hiện MỜ chồng lên, một dòng sáng 「功徳を回し向ければ」 */
  var dk = win(u, 5.0, 17.0, 2.2);
  ekoDict.material.opacity = dk*0.30;
  ekoQuote.material.opacity = dk*0.90;
  ekoQuoteSrc.material.opacity = dk*0.66;
  /* 18s: BẢY đốm sáng ẤM ở mép DƯỚI, thẳng hàng, mỗi đốm dóng ĐÚNG một cổng */
  var homeK = ease(clamp((u - 15.0)/3.0, 0, 1));
  for(i=0; i<7; i++) ekoHomes[i].material.opacity = homeK*0.88;
  /* 28s: từ mỗi đốm ấm BỐC LÊN một sợi sáng ĐI LÊN tới cổng — cách nhau 2s */
  for(i=0; i<7; i++){
    var on = 22.0 + i*2.0;
    var grow = ease(clamp((u - on)/2.2, 0, 1));
    ekoThreads[i].scale.y = Math.max(0.001, grow);   // gốc ở ĐÁY → mọc LÊN TRÊN
    ekoThreads[i].material.opacity = grow*0.80;
    /* 40s: màu ấm chạm màu lạnh và LÀM ẤM CHÂN mỗi cổng */
    var warm = ease(clamp((u - on - 2.2)/3.0, 0, 1));
    ekoGates[i].userData.glow.material.color.copy(MIST_BLUE).lerp(CANDLE_WARM, warm*0.55);
  }
  ekoLabel.material.opacity = ease(clamp((u - d*0.88)/2.2, 0, 1))*0.92;
  /* S41 là SƠ ĐỒ (cổng treo, nhà ở dưới) — đất/đường của S29 phải TẮT */
  EKO.userData.ground.visible = false;
  EKO.userData.road.visible = false;
  EKO.userData.haze.visible = false;
  for(i=0; i<7; i++) ekoGates[i].position.y = 1.4;
  /* TĨNH 35mm nhìn ngang hàng cổng; hàng cổng ở 1/3 TRÊN, đốm ấm ở mép dưới */
  cam(0, -0.4, 21.0,  0, -0.4, 0, F35);
}

/* ===================== 第4章 — 帰り道 ==================================== */

/* S43 (gộp S42) · C108–C111 · 1282.92–1317.84s · ⭐⭐ CAO TRÀO 4 — VÒNG KHÉP
 * Fade-in từ đen (phần S42 cũ), rồi CẮT THẲNG vào ANCHOR_CAM — đúng ma trận
 * khung cuối S02. Bố cục trùng khít. THỨ DUY NHẤT ĐỔI: chiều cao nến 0.72 → 0.28
 * và các hệ quả ánh sáng của nó. */
function sc_S43(t){
  var u = loc(t, 'S43'), d = SC.S43[1] - SC.S43[0];
  show('ROOM');
  ROOM.position.set(0,0,0); ROOM.scale.setScalar(1); fadeTree(ROOM, 1);
  /* 0–5.7s = phần S42 cũ: từ đen, ngọn nến hiện trở lại, quyển sách ĐÓNG LẠI */
  var intro = 5.69;
  if(u < intro){
    setRoom(t, 0.40, true);
    bookClosedCover.visible = false;
    bookPageL.visible = true; bookPageR.visible = true;
    /* bàn tay đặt lên bìa rồi rút đi → sách đóng */
    var cl = ease(clamp((u - 1.6)/2.6, 0, 1));
    HAND.visible = u > 1.0 && u < 4.6;
    HAND.position.set(-1.14, 0.40 + 0.05*(1-cl), 1.24);
    HAND.rotation.set(-0.5, 2.9, 0);
    bookClosedCover.visible = cl > 0.5;
    bookPageL.visible = cl <= 0.5; bookPageR.visible = cl <= 0.5;
    /* 85mm, cao 0.6m, ngọn nến ở 1/3 DƯỚI-TRÁI, TĨNH */
    cam(0.96, 0.60, 1.42,  0.42, 0.44, 0.10, F85);
    return;
  }
  /* CẮT THẲNG vào ANCHOR_CAM — không pan lại, không dựng lại chuyển động */
  var v = u - intro, vd = d - intro;
  setRoom(t, 0.28, true);              // ⚠ CON SỐ CỦA CÚ KẾT
  /* 20s: dolly-in 6% CỰC CHẬM vào 位牌 */
  var p = ease(clamp((v - 14.0)/(vd - 14.0), 0, 1));
  var A = ANCHOR_CAM;
  cam(lerp(A.p[0], A.p[0]*0.94 + 0.06, p),
      lerp(A.p[1], A.p[1] - 0.02, p),
      lerp(A.p[2], A.p[2]*0.94, p),
      A.l[0], A.l[1], A.l[2], A.fov);
}

/* S44 · C112–C117 · 1317.84–1388.59s — pan sang vách 障子.
 * Dải BẢY VẠCH của S11/S15 quay lại, nhưng lần này Ở TRONG PHÒNG,
 * mỗi vạch dóng ĐÚNG MỘT Ô khung 障子.
 * ⚠ Chữ trên giấy phải NHẠT HƠN ánh nến, không sáng hơn chủ thể. */
function sc_S44(t){
  var u = loc(t, 'S44'), d = SC.S44[1] - SC.S44[0];
  show('ROOM');
  ROOM.position.set(0,0,0); ROOM.scale.setScalar(1); fadeTree(ROOM, 1);
  setRoom(t, 0.28, true);
  SHOJI_MARKS.visible = true;
  /* 16s (C113): trích 本願寺派 hiện RẤT NHẠT trên mặt giấy, chữ dọc */
  var qk = win(u, 12.0, 27.0, 2.6);
  shojiQuote.material.opacity = qk*0.34;       // NHẠT HƠN ánh nến
  shojiQuoteSrc.material.opacity = qk*0.26;
  /* 28s: bảy vạch hiện thay vào */
  var i;
  for(i=0; i<7; i++){
    var on = 26.0 + i*2.6;
    var bk = ease(clamp((u - on)/1.8, 0, 1));
    shojiBars[i].material.opacity = bk*0.30;
    /* 38s: mỗi vạch có một đốm sáng ẤM nhỏ ở chân — bảy lần có người đến nhà */
    shojiDots[i].material.opacity = ease(clamp((u - on - 5.0)/2.0, 0, 1))*0.44;
  }
  /* 48s (C117): vạch thứ bảy có thêm GẠCH NGANG KHÉP LẠI + 「満中陰」 */
  var ck = ease(clamp((u - d*0.80)/2.4, 0, 1));
  shojiClose.material.opacity = ck*0.34;
  shojiManLabel.material.opacity = ck*0.74;
  /* pan trái 18° chậm từ 位牌 sang vách; vách chiếm 2/3 PHẢI, 位牌 mờ ở rìa trái */
  var p = ease(clamp(u/(d*0.46), 0, 1));
  var A = ANCHOR_CAM;
  cam(lerp(A.p[0], 0.26, p), lerp(A.p[1], 0.86, p), lerp(A.p[2], 1.94, p),
      lerp(A.l[0], -0.42, p), lerp(A.l[1], 0.96, p), lerp(A.l[2], -0.58, p), F50);
}

/* S45 · C118–C121 · 1388.59–1439.32s · ⭐ NHỊP GIÃN DẦN
 * MƯỜI vạch, khoảng cách TĂNG THEO CẤP SỐ: 49 ngày → 100 ngày → 1 năm → 3 năm.
 * Camera đi CHẬM DẦN theo khoảng cách (đi chậm lại = thời gian giãn ra).
 * ⚠ Không chữ 「グリーフケア」 hay thuật ngữ tâm lý nào. */
function sc_S45(t){
  var u = loc(t, 'S45'), d = SC.S45[1] - SC.S45[0];
  show('SPAN');
  var sg = SPAN.userData.stage;
  var i;
  /* --- đường đi của máy tính TRƯỚC, vì bối cảnh phải đi theo nó -------------
   * travelling NGANG sang phải, tốc độ GIẢM DẦN theo khoảng cách giữa các vạch.
   * Dùng đường cong mũ: đi nhanh ở đoạn dày, chậm dần ở đoạn thưa. */
  var p = clamp(u/(d*0.90), 0, 1);
  var q = 1 - Math.pow(1 - p, 2.4);        // chậm dần về cuối
  var x = lerp(SPAN_X[0] - 1.5, SPAN_X[9] + 2.5, q);
  /* camera lùi dần ra để cuối shot NHÌN LẠI TOÀN DÒNG: mười vạch, dày → thưa */
  var back = ease(clamp((u - d*0.86)/(d*0.14), 0, 1));
  /* ⚠ LÙI THEO ĐỘ THƯA, không chỉ lùi ở cuối shot. Bản trước giữ cz=9.5 suốt
   * đoạn travelling: ở F50 khung chỉ rộng ~9 đơn vị, mà từ vạch 8 trở đi
   * khoảng cách giữa hai mốc là 6 → 18 đơn vị ⇒ khung chứa đúng MỘT vạch và
   * không còn gì khác (đúng frame 1420 bản cũ). Mà chính "thấy được tỉ lệ
   * khoảng cách bằng mắt" mới là lý do cảnh này tồn tại.
   * Nên: máy lùi ra đúng theo bề rộng khoảng đang đi qua — đi tới chỗ thưa
   * thì ống kính mở ra, giữ được cả mốc VỪA QUA lẫn mốc ĐANG TỚI trong khung.
   * Vẫn tất định: gapAt là hàm thuần của x. */
  var gapAt = (function(xx){
    var j, gp = SPAN_X[1] - SPAN_X[0];
    for(j=0; j<9; j++){
      if(xx >= SPAN_X[j] && xx <= SPAN_X[j+1]){
        var f2 = (xx - SPAN_X[j])/(SPAN_X[j+1] - SPAN_X[j]);
        var g0 = SPAN_X[j+1] - SPAN_X[j];
        var g1 = (j < 8) ? (SPAN_X[j+2] - SPAN_X[j+1]) : g0;
        return lerp(g0, g1, f2);          // nội suy sang khoảng KẾ TIẾP
      }
    }
    return xx < SPAN_X[0] ? gp : (SPAN_X[9] - SPAN_X[8]);
  })(x);
  /* khung phải ôm được khoảng hiện tại + chút lề. Ở F50 (fov dọc 27°, khung
   * 16:9 ⇒ fov ngang ~46°) bề rộng nhìn thấy ≈ 0.85·z. */
  var wantW = clamp(gapAt*1.55 + 9.0, 13.0, 34.0);
  var travZ = wantW/0.85;
  var cz = lerp(travZ, 46.0, back);
  /* máy đi hơi TRỄ so với điểm ngắm ở đoạn thưa: mốc vừa qua còn nán lại mép
   * trái khung thay vì biến mất ngay — đó là "mốc đã qua" mà bố cục cần. */
  var lagx = x - clamp(gapAt*0.46, 0.6, 9.0);
  var cx2 = lerp(lagx, (SPAN_X[0] + SPAN_X[9])/2, back);
  /* ⚠ BỐI CẢNH ĐI THEO MÁY. Sàn là plane 90x90 với gradient RADIAL tâm ở GỐC
   * toạ độ, sương spread 80 cũng quanh gốc. Nhưng vạch thứ mười nằm ở x=29 và
   * máy chạy ra tận đó — nơi gradient đã tắt hẳn → khung còn đúng một vạch
   * trắng trên nền đen (đúng frame 1420 bản cũ). Dán tâm sàn + tâm sương vào
   * x của máy để mọi mốc trên dòng đều có sàn và sương đỡ bên dưới.
   * Vẫn tất định: cx2 là hàm thuần của u. */
  sg.floor.position.x = cx2;
  sg.mist.position.x = cx2;
  /* sàn ĐẬM hơn (0.40 → 0.52) và sương dày hơn: shot này nhìn gần như cạnh
   * mặt sàn nên gradient bị nén, cần biên độ lớn hơn mới thành "chỗ đứng". */
  var fadeIn = ease(clamp(u/3.0, 0, 1));
  sg.floor.material.opacity = fadeIn*0.52;
  sg.mist.material.opacity = 0.20;
  updateMist(sg.mist, t, 0.04);
  /* sợi trục hiện sớm và ở SUỐT shot: nó là thứ nói "còn mốc phía trước" */
  spanRail.material.opacity = fadeIn*0.26;
  for(i=0; i<10; i++){
    /* Lời đọc điểm CẢ BA mốc ở u=3.01 (「百か日があり、一周忌があり、三回忌が
     * ある」) rồi u=7.39 mới nói 「間隔が少しずつ広がっていきます」. Nhịp cũ
     * (on = 7.0 + (i-7)*10) để vạch thứ mười tới u=27 mới hiện — hình trễ lời
     * 24s, và ở frame 1420 nhãn 三回忌 mới mờ mờ 0.08. Ba mốc xa hiện ngay sau
     * khi được đọc tên, cách nhau 1.2s cho mắt kịp bắt. */
    var on = (i < 7) ? 0.6 : (3.2 + (i - 7)*1.2);
    var k = ease(clamp((u - on)/1.5, 0, 1));
    spanBars[i].material.opacity = k*0.80;
    /* quầng dọc + vũng chân đi kèm vạch. Mốc ĐÃ QUA (nằm sau máy trên trục x)
     * giữ nguyên độ sáng — dòng thời gian không xoá cái đã đi qua; nhưng vạch
     * ở RẤT xa phía trước thì mờ hơn để khung có lớp gần/lớp xa, tức chiều sâu.
     * dfar là hàm thuần của cx2 (mà cx2 là hàm thuần của u). */
    var dfar = clamp((SPAN_X[i] - cx2)/26.0, 0, 1);
    var depth = 1 - dfar*0.45;
    spanHaze[i].material.opacity = k*0.16*depth;
    spanPools[i].material.opacity = k*0.30*depth;
    /* 54s (C121): một đốm sáng ẤM ở mỗi vạch cùng sáng lên MỘT LƯỢT */
    var all = ease(clamp((u - d*0.88)/2.4, 0, 1));
    spanDots[i].material.opacity = Math.max(k*0.30*ease(clamp((u - on - 2.0)/1.6, 0, 1)), all*0.80);
  }
  for(i=0; i<3; i++)
    spanLabels[i].material.opacity = ease(clamp((u - 4.0 - i*1.2)/1.4, 0, 1))*0.90;
  /* camera hơi CAO hơn dòng vạch: ở y=0.2 ngắm y=0 thì sàn nằm gần như cạnh
   * nhìn, gradient sàn vô hình và khung lại về "vạch trắng trong hư không".
   * Nâng lên và ngắm thấp hơn: thấy được MẶT sàn chạy về phía chân trời,
   * nên cái vạch có chỗ để đứng. Lên cao dần khi máy lùi ra, cho đoạn thưa
   * nhìn xuống trục rõ hơn.
   * ⚠ Điểm ngắm lệch SANG PHẢI máy (về phía các mốc đang tới) nên trục chạy
   * CHÉO trong khung thay vì cắt ngang giữa: chéo mới ra phối cảnh, mà phối
   * cảnh mới ra chiều sâu. Đây là chỗ khung cũ phẳng nhất. */
  /* ⚠ Điểm ngắm lệch SANG TRÁI máy (về phía các mốc ĐÃ QUA). Bản thử trước
   * lệch sang PHẢI và đẩy vạch thứ chín ra đúng ngoài mép (ndcX -1.07) — khung
   * lại còn một vạch. Lệch trái thì mốc vừa đi qua nằm trong khung, mốc đang
   * tới ở mép phải: đó mới là "đã qua và đang tới" cùng lúc. */
  var hi = lerp(1.75, 5.2, clamp((cz - 13.0)/24.0, 0, 1));
  cam(cx2, hi, cz,  cx2 - gapAt*0.10, -0.35, -1.6, lerp(F50, F35, back));
}

/* S46 · C122–C124 · 1439.32–1484.62s — SÔNG CHUNG, góc rộng nhất của tập.
 * ⚠⚠ LUẬT CỨNG: BỜ BÊN KIA KHÔNG BAO GIỜ HIỆN RA. Sương ở nửa trên khung
 *   giữ NGUYÊN độ dày, không loãng đi một chút nào. */
function sc_S46(t){
  var u = loc(t, 'S46'), d = SC.S46[1] - SC.S46[0];
  show('FARRIVER');
  updateMist(farMistFar, t, 0.03);
  updateMist(FARRIVER.userData.near, t, 0.04);
  /* sương DÀY GIỮ NGUYÊN — hằng số, không giảm theo u ở bất kỳ đâu */
  farMistFar.material.opacity = 0.17;
  riverNormal.offset.x = -(t*0.010) % 1.0;
  var i;
  /* 10s: BA đốm sáng nhỏ dọc hai bờ, khoảng cách RẤT XA nhau. Không nhãn, không cờ */
  for(i=0; i<3; i++){
    var k = ease(clamp((u - 7.0 - i*2.4)/3.0, 0, 1));
    farDots[i].material.opacity = k*0.62;
    /* 20s: mỗi đốm phát một VÒNG SÓNG lan; ba vòng GẶP NHAU ở giữa sông */
    var rt = clamp((u - 16.0 - i*0.8)/12.0, 0, 1);
    var r = farRings[i];
    r.scale.setScalar(1 + rt*72);
    /* 32s (C123): các vòng sóng TAN, mặt nước PHẲNG LẠI */
    r.material.opacity = win(u, 16.0 + i*0.8, 30.0, 3.0)*0.26*(1 - rt*0.5);
  }
  /* góc cao nhìn xuống 40°, 24mm (góc RỘNG NHẤT của tập), drift rất chậm sang TRÁI */
  var drift = -6.0*(u/d);
  cam(30.0 + drift, 42.0, 74.0,  -6.0 + drift, 2.0, -46.0, F24);
}

/* S47 · C125–C127 · 1484.62–1516.42s — khói hương trong phòng.
 * Que hương cháy TỪ TRÊN XUỐNG. C126: tượng 地蔵 mờ hiện MỘT LẦN NỮA, RẤT NHẠT,
 * phản chiếu trên mặt sơn mài 位牌.
 * ⚠ Nhạt tới mức gần như không chắc mình có thấy không. Rõ quá thành ma quái. */
function sc_S47(t){
  var u = loc(t, 'S47'), d = SC.S47[1] - SC.S47[0];
  show('ROOM');
  ROOM.position.set(0,0,0); ROOM.scale.setScalar(1); fadeTree(ROOM, 1);
  setRoom(t, 0.28, true);
  updateSmoke(t, 1.0);
  /* 34s (C126): phản chiếu 地蔵 trên 位牌 — giữ 4s rồi tan */
  var rk = win(u, d*0.62, d*0.62 + 6.0, 1.8);
  ihaiReflect.material.opacity = rk*0.12;     // RẤT NHẠT
  /* tilt-down chậm theo sợi khói → pan phải 8° sang 位牌 → kết ở BỐ CỤC S43 */
  var p1 = ease(clamp(u/(d*0.52), 0, 1));       // tilt xuống theo khói
  var p2 = ease(clamp((u - d*0.52)/(d*0.44), 0, 1)); // pan sang 位牌 + về bố cục S43
  var A = ANCHOR_CAM;
  var px = lerp(lerp(0.10, 0.18, p1), A.p[0], p2);
  var py = lerp(lerp(1.28, 0.82, p1), A.p[1], p2);
  var pz = lerp(lerp(1.30, 1.36, p1), A.p[2], p2);
  var lx = lerp(lerp(-0.10, -0.06, p1), A.l[0], p2);
  var ly = lerp(lerp(1.10, 0.48, p1), A.l[1], p2);
  var lz = lerp(lerp(-0.20, -0.22, p1), A.l[2], p2);
  cam(px, py, pz, lx, ly, lz, lerp(F85, A.fov, p2));
}

/* S48 · C128–C130 · 1516.42–1550.14s · ⭐ KẾT
 * Bố cục S43 → lùi ra RẤT CHẬM (chuyển động chậm nhất của cả tập, 0.04 m/s).
 * C129: các ô 障子 sáng yếu lên theo thứ tự NGẪU-NHIÊN-SEEDED — như cửa sổ nhà
 * người khác ở xa. Tối đa BA ô sáng cùng lúc.
 * C130: nến TẮT — ngọn lửa thu nhỏ 0.8s rồi mất, một sợi khói trắng bốc lên thẳng.
 * Còn lại: mép 仏壇, dáng 位牌 VẪN ĐỨNG, và đĩa ぼたもち. */
function sc_S48(t){
  var u = loc(t, 'S48'), d = SC.S48[1] - SC.S48[0];
  show('ROOM');
  ROOM.position.set(0,0,0); ROOM.scale.setScalar(1); fadeTree(ROOM, 1);
  /* C130 「蝋燭を消して」 — nến tắt ở ~76% shot */
  var blowT = d*0.74;
  var lit = u < blowT;
  var shrink = clamp((u - blowT)/0.8, 0, 1);     // thu nhỏ trong 0.8s rồi mất
  setRoom(t, 0.28, lit || shrink < 1);
  if(lit){
    /* bình thường */
  } else if(shrink < 1){
    candleFlame.scale.set(1 - shrink, (1 - shrink)*1.0, 1 - shrink);
    candleLight.intensity *= (1 - shrink);
    candleHalo.material.opacity *= (1 - shrink);
    candleHaloIn.material.opacity *= (1 - shrink);
  }
  if(u >= blowT + 0.8){
    setCandle(0.28, t, false);
    /* MỘT SỢI KHÓI TRẮNG MẢNH bốc lên THẲNG, rồi TAN */
    var sm = clamp((u - blowT - 0.8)/9.0, 0, 1);
    var g = blowSmoke.geometry, pa = g.attributes.position.array;
    var sd = g.attributes.aSeed.array, i2;
    for(i2=0; i2<sd.length; i2++){
      var uu = sd[i2];
      pa[i2*3]   = 0.004*Math.sin(uu*9.0 + t*0.4)*uu;   // gần như THẲNG
      pa[i2*3+1] = 0.026 + uu*0.34*sm;
      pa[i2*3+2] = 0.004*Math.cos(uu*7.0 + t*0.3)*uu;
    }
    g.attributes.position.needsUpdate = true;
    blowSmoke.position.set(0, 0.020 + 0.28*CANDLE_FULL + 0.02, 0);
    blowSmoke.material.opacity = win(u, blowT + 0.8, blowT + 10.0, 2.2)*0.36;
    /* quầng sáng ấm BIẾN MẤT HOÀN TOÀN → khung chuyển sang tông LAM RẤT TỐI */
    candleLight.intensity = 0;
    moonLight.intensity = 0.06;
    roomAmb.intensity = 0.16;
  }
  /* C129: ô 障子 sáng yếu lên theo thứ tự NGẪU-NHIÊN-SEEDED, tối đa BA ô cùng lúc */
  var winT = d*0.40;
  var i;
  var prw = HFA.mulberry32(9090);
  for(i=0; i<shojiGlowPanes.length; i++){
    var on = winT + prw()*11.0, dur = 4.0 + prw()*3.5;
    shojiGlowPanes[i].material.opacity = win(u, on, on + dur, 1.6)*0.26;
  }
  /* dolly-back + crane-up CỰC CHẬM — chuyển động chậm nhất của cả tập */
  var p = ease(clamp(u/(d*0.92), 0, 1));
  var A = ANCHOR_CAM;
  cam(lerp(A.p[0], 0.22, p), lerp(A.p[1], 1.40, p), lerp(A.p[2], 3.55, p),
      lerp(A.l[0], 0.34, p), lerp(A.l[1], 0.48, p), lerp(A.l[2], -0.15, p),
      lerp(F50, F35, p));
}

/* ==========================================================================
 * DRIVER — renderAtTime(t): hàm THUẦN, đặt TRỌN VẸN mọi thứ theo t rồi render.
 * ========================================================================== */
var SCENE_FN = {
  S01:sc_S01, S02:sc_S02, S03:sc_S03, S04:sc_S04, S05:sc_S05, S06:sc_S06, S07:sc_S07,
  S08:sc_S08, S09:sc_S09, S10:sc_S10, S11:sc_S11, S12:sc_S12, S13:sc_S13, S14:sc_S14,
  S15:sc_S15, S16:sc_S16, S17:sc_S17, S18:sc_S18, S19:sc_S19, S20:sc_S20, S21:sc_S21,
  S22:sc_S22, S23:sc_S23, S24:sc_S24, S25:sc_S25, S26:sc_S26, S27:sc_S27, S28:sc_S28,
  S29:sc_S29, S30:sc_S30, S31:sc_S31, S32:sc_S32, S33:sc_S33, S34:sc_S34, S35:sc_S35,
  S36:sc_S36, S37:sc_S37, S38:sc_S38, S39:sc_S39, S40:sc_S40, S41:sc_S41, S43:sc_S43,
  S44:sc_S44, S45:sc_S45, S46:sc_S46, S47:sc_S47, S48:sc_S48
};
var SCENE_KEYS = Object.keys(SC);

/** tìm cảnh chứa t (tuyến tính trên 47 phần tử — rẻ, và tất định) */
function sceneAt(t){
  var i;
  for(i=0; i<SCENE_KEYS.length; i++){
    var k = SCENE_KEYS[i];
    if(t >= SC[k][0] && t < SC[k][1]) return k;
  }
  return t < SC.S01[0] ? 'S01' : 'S48';
}

function renderAtTime(t){
  /* LEADTAIL:APPLIED — dịch timeline sang phải 2s cho intro lặng.
     Cảnh vẫn dùng mốc gốc của timing.json; chỉ tới muộn hơn 2s. */
  var _tReal = t;                    /* thời gian THẬT của video, cho phụ đề */
  t = Math.max(0, t - 2);   /* thời gian CẢNH, đã trừ intro */

  t = clamp(t, 0, TOTAL);
  /* đèn điểm TABLE về mặc định TRƯỚC khi gọi cảnh — sc_S38 hạ nó xuống khi
   * dolly-in, các cảnh TABLE khác (S37/S39/S43) phải nhận lại giá trị gốc.
   * Đặt ở đây nên vẫn là hàm thuần của t, không tích luỹ giữa các frame. */
  tablePL.intensity = 2.6;
  tablePL.position.set(-3.0, 3.0, 5.5);
  /* bệ chung của OVERLAY cũng về mặc định: sc_S38 cất nó đi (phiến sáng đè lên
   * dải phụ đề), S39/S47 phải nhận lại. Vẫn là hàm thuần của t. */
  if(ovPed) ovPed.visible = true;
  /* cỡ hai pho cũng về mặc định: sc_S38 kéo chúng về gặp nhau (1.52/1.03) để
   * khớp đường viền, S39/S47 phải nhận lại 1.35/1.12. */
  if(ovEnma) ovEnma.scale.setScalar(1.35);
  if(ovJizo) ovJizo.scale.setScalar(1.12);
  /* depthWrite + renderOrder cũng về mặc định. sc_S38 tắt depthWrite và ép
   * renderOrder 1/2 để hai pho chồng mờ đúng thứ tự xa→gần; HyperFrames SCRUB
   * tới mốc bất kỳ chứ không chạy tuyến tính, nên nếu không đặt lại ở đây thì
   * một frame S28/S39 render ngay sau một frame S38 sẽ ra hình khác. */
  if(ovEnma) ovEnma.traverse(function(o){
    if(o.material){ o.material.depthWrite = true; o.renderOrder = 0; } });
  if(ovJizo) ovJizo.traverse(function(o){
    if(o.material){ o.material.depthWrite = true; o.renderOrder = 0; } });
  var key = sceneAt(t);
  SCENE_FN[key](t);

  /* phụ đề + nhãn chương — đọc theo thời gian THẬT */
  HFA.applySubtitle(subEl, CUES, _tReal);
  /* LEADTAIL:APPLIED — màn hình đen 5s cuối: nhạc chạy tiếp, hình tắt dần. */
  (function(){
    var ob = document.getElementById('outro-black');
    if(!ob) return;
    var f = (_tReal - 1552.18) / 1.2;         /* 1.2s chuyển sang đen */
    ob.style.opacity = String(Math.max(0, Math.min(1, f)));
  })();
  HFA.applyChapter(chapEl, CHAPTERS, _tReal, 6.5);
  /* fade vào/ra toàn cục + LẦN DUY NHẤT cắt về đen: cuối S41 (gap 2.0s) */
  /* LEADTAIL: fade tính theo THỜI GIAN CẢNH và ĐỘ DÀI CẢNH (đã trừ intro/outro).
     Dùng TOTAL mới (1557.18) sẽ làm fade-out lệch 7s và fade-in bị đẩy sau lead. */
  var _SCENE_DUR = TOTAL - 2 - 5;
  var fade = HFA.globalFade(t, _SCENE_DUR, 1.2, 2.0);
  var blackout = 1 - win(t, SC.S41[1] - 2.0, SC.S43[0] + 3.0, 1.0);
  var k = fade*Math.max(blackout, 0);
  rootEl.style.opacity = k.toFixed(4);

  composer.render();
}

/* ⚠ Dòng đăng ký phải nằm NGUYÊN DẠNG trong file này — StaticGuard quét VĂN BẢN.
 * Khoá trùng ĐÚNG data-composition-id của div gốc. */
window.__timelines = window.__timelines || {};
window.__timelines["tamashii-no-tabi"] = HFA.makeTimeline("tamashii-no-tabi", TOTAL, renderAtTime);

</script>
