<script>
/* ===== HFA:BEGIN — sinh tự động bởi scripts/inject-lib.mjs, ĐỪNG SỬA TAY ===== */
/* ============================================================================
 * hf-astro.js — bộ khung dùng chung cho composition Du Mục Vũ Trụ
 *
 * Trích từ các tập ĐÃ RENDER VÀ VERIFY (01–07). Trước khi có file này, mỗi tập
 * tự dựng lại cùng một đoạn code (mulberry32, ACESFilmic, composer+bloom, lens
 * pass, starfield, tra phụ đề, driver timeline) — nên bug đã sửa ở tập này lại
 * tái xuất ở tập sau. Dùng file này thay vì chép tay.
 *
 * CÁCH DÙNG: KHÔNG nạp bằng thẻ script ngoài. Preview/render server của HyperFrames
 *      không phục vụ file .js tuỳ ý trong project — nó trả về SPA shell HTML cho
 *      đường dẫn đó, browser parse "doctype html" thành lỗi cú pháp và tập chết
 *      (đã kiểm chứng: curl -D- trả về 200 text/html, 593 byte). Composition phải
 *      TỰ CHỨA. Nhúng bằng:
 *
 *          node scripts/inject-lib.mjs --html index.html
 *
 *      Lệnh này dán nội dung file này vào đầu khối code của tập, giữa hai mốc
 *      HFA:BEGIN / HFA:END. Chạy lại được nhiều lần. Định nghĩa một global: HFA.
 *      Yêu cầu three.min.js + EffectComposer/RenderPass/ShaderPass/UnrealBloomPass
 *      đã nạp trước đó.
 *
 * LUẬT TẤT ĐỊNH: file này không dùng Date.now / performance.now / Math.random /
 * requestAnimationFrame / setTimeout. Mọi thứ là hàm thuần của t hoặc của seed.
 * ========================================================================== */
(function (global) {
  'use strict';

  var HFA = {};

  /* ---- PRNG có seed ------------------------------------------------------
   * Math.random() bị cấm (render phải tất định). Mỗi cụm vật thể dùng MỘT
   * seed riêng — dùng chung một chuỗi cho hai cụm thì thêm/bớt hạt ở cụm này
   * sẽ xê dịch layout cụm kia.
   */
  HFA.mulberry32 = function (a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  /* ---- helper toán -------------------------------------------------------- */
  HFA.clamp = function (x, a, b) { return Math.min(b, Math.max(a, x)); };

  HFA.smooth = function (x) { x = HFA.clamp(x, 0, 1); return x * x * (3 - 2 * x); };

  /** Bao lồi mềm: 0 ngoài [a,b], lên/xuống mượt trong dải f giây ở hai mép.
   *
   * Hoà chéo đặt ĐỐI XỨNG quanh mốc cảnh: cảnh chỉ nhú lên từ a-f/2 và tắt hẳn
   * ở b+f/2, nên hai cảnh liền nhau chồng đúng f giây và tổng trọng số luôn = 1
   * (không chớp đen). Bản cũ dùng a-f .. a+f với mẫu số 2f: cảnh mới hiện sớm
   * cả f giây trước mốc và cảnh cũ nán lại thêm f giây sau mốc, tổng thời gian
   * dính hình là 2f — chuyển cảnh nhoè, hình cue trước còn đọng khi lời đã sang
   * ý mới. Xem tập mat-trang t=167,33s (Trái Đất + Sao Hoả + Mặt Trăng chồng nhau).
   */
  HFA.band = function (t, a, b, f) {
    f = f || 0.8;
    var h = f * 0.5;
    if (t < a - h || t > b + h) return 0;
    var up = HFA.smooth((t - (a - h)) / f);
    var dn = HFA.smooth(((b + h) - t) / f);
    return Math.min(1, Math.min(up, dn));
  };

  /* ---- cửa sổ cảnh --------------------------------------------------------
   * SC = {A:[start,end], B:[...], ...} theo GIÂY THẬT (lấy từ timing.json cue.start).
   * Trả về loc(t,k) ∈ [0,1] (tiến độ trong cảnh) và inSc(t,k).
   */
  HFA.scenes = function (SC) {
    return {
      SC: SC,
      loc: function (t, k) {
        var w = SC[k];
        return Math.min(1, Math.max(0, (t - w[0]) / (w[1] - w[0])));
      },
      inSc: function (t, k) { var w = SC[k]; return t >= w[0] && t < w[1]; }
    };
  };

  /* ---- shader lens — PASS CUỐI, kiêm luôn tone mapping + mã hoá sRGB --------
   *
   * ⚠ VÌ SAO PASS NÀY PHẢI TỰ TONE MAP:
   * three.js chỉ chèn ACES + sRGB vào shader của VẬT LIỆU nó tự dựng. Một
   * ShaderMaterial thô trong ShaderPass KHÔNG được chèn — nên khi pass cuối ghi
   * ra màn hình, ảnh chưa hề được mã hoá sRGB.
   * Đo thật (xám #808080, r128): vẽ thẳng = 197, qua EffectComposer = 143.
   * Sai lệch đó là lý do các tập 01–07 ra tối hơn và sai gamma.
   *
   * Vì vậy chuỗi mới là: cảnh vẽ TUYẾN TÍNH vào target HDR (không tone map)
   * → bloom ăn giá trị HDR thật → pass này mới ACES + sRGB ở bước cuối.
   * Bloom đứng TRƯỚC tone mapping mới đúng thứ tự điện ảnh: vùng cực sáng
   * (quang cầu, đĩa bồi tụ) chưa bị nén ngọn nên quầng sáng nở tự nhiên.
   *
   * Thứ tự trong shader: CA → vignette → fade (đều ở TUYẾN TÍNH, vì chúng là
   * phơi sáng) → ACES → sRGB → grain + flash (ở không gian hiển thị, vì grain
   * phim và chớp trắng là hiện tượng của bản in, không phải của ánh sáng).
   * Grain seed theo t, KHÔNG theo đồng hồ — cùng t phải cho cùng frame.
   */
  HFA.LensShader = {
    uniforms: {
      tDiffuse: { value: null }, uT: { value: 0 }, uVig: { value: 0.34 },
      uCA: { value: 0.0015 }, uGrain: { value: 0.045 },
      uFade: { value: 1.0 }, uFlash: { value: 0.0 },
      uExposure: { value: 1.02 }, uToneMap: { value: 1.0 }
    },
    vertexShader:
      'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader: [
      'varying vec2 vUv;uniform sampler2D tDiffuse;',
      'uniform float uT,uVig,uCA,uGrain,uFade,uFlash,uExposure,uToneMap;',
      'float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}',
      // ACES — SAO CHÉP ĐÚNG bản three.js r128 dùng cho ACESFilmicToneMapping
      // (ma trận vào/ra + RRTAndODTFit + tiền tỉ lệ /0.6). KHÔNG dùng xấp xỉ
      // Narkowicz: nó sáng hơn ~4% ở vùng trung, đo được (206 vs 197 trên xám
      // giữa) và sẽ lệch với mọi tài liệu/preset tính theo three.js.
      'vec3 rrt(vec3 v){vec3 a=v*(v+0.0245786)-0.000090537;',
      '  vec3 b=v*(0.983729*v+0.4329510)+0.238081;return a/b;}',
      'vec3 aces(vec3 color){',
      '  const mat3 mIn=mat3(0.59719,0.07600,0.02840, 0.35458,0.90834,0.13383, 0.04823,0.01566,0.83777);',
      '  const mat3 mOut=mat3(1.60475,-0.10208,-0.00327, -0.53108,1.10813,-0.07276, -0.07367,-0.00605,1.07602);',
      '  color/=0.6;',
      '  color=mIn*color; color=rrt(color); color=mOut*color;',
      '  return clamp(color,0.0,1.0);}',
      // tuyến tính → sRGB, đúng công thức chuẩn (không phải pow(1/2.2) cho nhanh)
      'vec3 toSRGB(vec3 c){c=max(c,vec3(0.0));',
      '  return mix(c*12.92,1.055*pow(c,vec3(1.0/2.4))-0.055,step(vec3(0.0031308),c));}',
      'void main(){',
      '  vec2 d=vUv-0.5;float r=dot(d,d);',
      '  vec2 off=d*uCA*(1.0+r*2.2);',
      '  vec3 col;',
      '  col.r=texture2D(tDiffuse,vUv+off).r;',
      '  col.g=texture2D(tDiffuse,vUv).g;',
      '  col.b=texture2D(tDiffuse,vUv-off).b;',
      // --- còn ở TUYẾN TÍNH: vignette + fade là phơi sáng ---
      '  float vig=smoothstep(1.02,uVig,r*2.0);',
      '  col*=mix(1.0,vig,0.85);',
      '  col*=uFade;',
      // --- tone map + mã hoá hiển thị ---
      '  col=mix(col*uExposure,aces(col*uExposure),uToneMap);',
      '  col=toSRGB(col);',
      // --- không gian hiển thị: grain + chớp trắng ---
      '  float g=h(vUv*vec2(1920.0,1080.0)+fract(uT)*97.3)-0.5;',
      '  col+=g*uGrain;',
      '  col=mix(col,vec3(1.0,0.98,0.94),uFlash);',
      '  gl_FragColor=vec4(clamp(col,0.0,1.0),1.0);',
      '}'
    ].join('\n')
  };

  /* ---- dựng sân khấu ------------------------------------------------------
   * Trả về {renderer, scene, camera, composer, bloom, lens, W, H, loadTex}.
   * Ánh sáng mặc định (amb/key/rim) tắt được bằng opt.lights=false.
   */
  HFA.createStage = function (opt) {
    opt = opt || {};
    var W = opt.width || 1920, H = opt.height || 1080;
    var canvas = typeof opt.canvas === 'string'
      ? document.getElementById(opt.canvas)
      : (opt.canvas || document.getElementById('c'));

    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(1);
    renderer.setSize(W, H);
    renderer.setClearColor(opt.clearColor != null ? opt.clearColor : 0x08080a, 1);

    // Tone mapping + sRGB CỐ Ý tắt ở đây: cả hai được làm ở pass lens cuối cùng.
    // Bật ở đây thì cảnh bị nén dải TRƯỚC khi bloom nhìn thấy (quầng sáng bẹt),
    // rồi lại không được mã hoá sRGB lúc ghi ra màn hình (xem chú thích LensShader).
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.outputEncoding = THREE.LinearEncoding;

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(
      opt.fov || 46, W / H, opt.near || 0.05, opt.far || 60000);
    camera.position.set(0, 0, 60);

    if (opt.lights !== false) {
      var amb = new THREE.AmbientLight(0x232838, 0.85); scene.add(amb);
      var key = new THREE.DirectionalLight(0xffe8d2, 1.05); key.position.set(6, 4, 8); scene.add(key);
      var rim = new THREE.DirectionalLight(0x6f9cff, 0.4); rim.position.set(-8, -3, -6); scene.add(rim);
      scene.userData.lights = { amb: amb, key: key, rim: rim };
    }

    /* --- render target: MSAA + HDR -------------------------------------------
     * `antialias:true` ở trên CHỈ tác dụng lên framebuffer mặc định. Đi qua
     * EffectComposer là vẽ vào target offscreen, và target đó KHÔNG multisample
     * theo mặc định — nên cờ antialias thành vô nghĩa và mọi rìa bị răng cưa.
     * WebGLMultisampleRenderTarget (có từ r111) khôi phục MSAA thật.
     * HalfFloat giữ giá trị >1.0 để bloom ăn được highlight HDR thật.
     */
    var samples = opt.msaa != null ? opt.msaa : 4;
    var rtOpts = {
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat,
      type: opt.hdr === false ? THREE.UnsignedByteType : THREE.HalfFloatType
    };
    var rt;
    if (samples > 0 && typeof THREE.WebGLMultisampleRenderTarget === 'function') {
      rt = new THREE.WebGLMultisampleRenderTarget(W, H, rtOpts);
      rt.samples = samples;
    } else {
      rt = new THREE.WebGLRenderTarget(W, H, rtOpts);
      if (samples > 0) console.warn('[hf-astro] không có WebGLMultisampleRenderTarget — chạy không MSAA.');
    }

    var composer = new THREE.EffectComposer(renderer, rt);
    composer.addPass(new THREE.RenderPass(scene, camera));

    /* Ngưỡng bloom: cảnh giờ là HDR TUYẾN TÍNH, không còn bị nén về [0,1] như
     * trước. Highlight thật nằm TRÊN 1.0, nên ngưỡng cũ 0.62 (chỉnh cho ảnh đã
     * tone map) sẽ làm cả những vùng sáng vừa cũng loé. Mặc định nâng lên 1.0. */
    var bloom = new THREE.UnrealBloomPass(
      new THREE.Vector2(W, H),
      opt.bloomStrength != null ? opt.bloomStrength : 0.78,
      opt.bloomRadius != null ? opt.bloomRadius : 0.7,
      opt.bloomThreshold != null ? opt.bloomThreshold : (opt.hdr === false ? 0.62 : 1.0));
    composer.addPass(bloom);

    // Bản sao uniforms để hai stage không dùng chung state.
    var lensDef = {
      uniforms: THREE.UniformsUtils.clone(HFA.LensShader.uniforms),
      vertexShader: HFA.LensShader.vertexShader,
      fragmentShader: HFA.LensShader.fragmentShader
    };
    var lens = new THREE.ShaderPass(lensDef);
    lens.renderToScreen = true;
    lens.uniforms.uExposure.value = opt.exposure != null ? opt.exposure : 1.02;
    composer.addPass(lens);

    var texLoader = new THREE.TextureLoader();
    texLoader.setCrossOrigin('anonymous');
    function loadTex(path, enc) {
      var tx = texLoader.load(path);
      if (enc) tx.encoding = enc;
      tx.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return tx;
    }

    var stage = {
      renderer: renderer, scene: scene, camera: camera,
      composer: composer, bloom: bloom, lens: lens, rt: rt,
      W: W, H: H, loadTex: loadTex,
      clearColor: opt.clearColor != null ? opt.clearColor : 0x08080a
    };

    /* --- environment map (IBL) ----------------------------------------------
     * MeshStandardMaterial là vật liệu PBR: nó phản xạ MÔI TRƯỜNG. Không có
     * envMap thì kim loại và bề mặt bóng mất gần hết thông tin phản xạ, chỉ còn
     * highlight từ đèn → ra chất nhựa sơn. (Tập "Vàng" là ví dụ rõ nhất.)
     * Dựng một bầu trời tối có vài đốm sáng, nướng qua PMREM MỘT LẦN lúc khởi
     * tạo → tất định, không phụ thuộc t, mọi MeshStandardMaterial hưởng ngay
     * qua scene.environment mà không phải sửa từng vật liệu.
     */
    if (opt.environment !== false) {
      stage.environment = HFA.buildEnvironment(renderer, scene, opt.environmentSeed || 4242);
    }

    return stage;
  };

  /** Bầu trời sao mờ nướng thành envMap PMREM. Trả về texture (đã gán scene.environment). */
  HFA.buildEnvironment = function (renderer, scene, seed) {
    var pr = HFA.mulberry32(seed);
    var cv = document.createElement('canvas');
    cv.width = 512; cv.height = 256;
    var cx = cv.getContext('2d');

    // nền: gradient rất tối, hơi lạnh ở dưới, ấm nhạt ở trên (ánh sáng thiên hà)
    var gr = cx.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, '#0a0d16'); gr.addColorStop(0.5, '#070910'); gr.addColorStop(1, '#05060b');
    cx.fillStyle = gr; cx.fillRect(0, 0, 512, 256);

    // dải Ngân Hà mờ vắt ngang → cho phản xạ có hướng, tránh env phẳng lì
    var bandGr = cx.createLinearGradient(0, 96, 0, 160);
    bandGr.addColorStop(0, 'rgba(70,80,110,0)');
    bandGr.addColorStop(0.5, 'rgba(120,130,165,0.30)');
    bandGr.addColorStop(1, 'rgba(70,80,110,0)');
    cx.fillStyle = bandGr; cx.fillRect(0, 96, 512, 64);

    // vài nguồn sáng nhỏ để kim loại có điểm loé
    for (var i = 0; i < 220; i++) {
      var x = pr() * 512, y = pr() * 256, s = pr() < 0.06 ? 2.2 : 1.0;
      var b = 0.35 + pr() * 0.65;
      cx.fillStyle = 'rgba(255,252,245,' + b.toFixed(3) + ')';
      cx.fillRect(x, y, s, s);
    }

    var tex = new THREE.CanvasTexture(cv);
    tex.mapping = THREE.EquirectangularReflectionMapping;
    tex.encoding = THREE.sRGBEncoding;

    var pmrem = new THREE.PMREMGenerator(renderer);
    pmrem.compileEquirectangularShader();
    var env = pmrem.fromEquirectangular(tex).texture;
    pmrem.dispose();
    tex.dispose();

    scene.environment = env;   // KHÔNG gán scene.background — nền do starfield lo
    return env;
  };

  /* ---- CHỌN MÀU SAO CHO SỐNG SÓT QUA ACES ---------------------------------
   * Bài học đo được ở tập 08, tốn 3 vòng sửa mới ra. Đọc trước khi chọn bảng màu.
   *
   * ACES nén mạnh vùng sáng. Càng đẩy độ sáng lên, sắc càng bị kéo về trắng/xám.
   * Nên SẮC PHẢI ĐẾN TỪ TỈ LỆ GIỮA CÁC KÊNH, không đến từ độ sáng.
   *
   * Đo thật (bão hoà còn lại sau khi qua chuỗi ACES của three.js r128):
   *   (0.42, 0.60, 1.05)  → còn 11–25%  → ra XÁM BÊ TÔNG. Đừng dùng.
   *   (0.10, 0.32, 1.00)  → còn 37–67%  → ra LAM THẬT.
   *
   * Quy tắc rút ra:
   *   - Kênh yếu nên ≤ 0.2× kênh mạnh. Nâng kênh yếu lên là giết sắc.
   *   - Kênh mạnh giữ quanh 1.0, đừng hơn.
   *   - Muốn SÁNG hơn thì tăng emissive (vượt ngưỡng bloom), ĐỪNG nâng kênh yếu.
   *
   * Hệ quả cho chữ và sơ đồ: bloom làm NHOÈ MẤT NÉT CHỮ. Nét biểu đồ và typo phải
   * để DƯỚI ngưỡng bloom (<1.0). Muốn chữ rõ hơn thì tăng độ dày nét, không tăng
   * emissive.
   *
   * Chống cháy trắng: giữ diện tích có luminance >0.85 (sau tonemap) dưới ~12%
   * khung. Cần một vùng sáng rộng thì đẩy bằng SỐ LƯỢNG hạt nhỏ, đừng đẩy bằng
   * độ sáng của hạt lớn.
   */
  HFA.saturationAfterACES = function (r, g, b) {
    // Ước lượng nhanh xem một màu tuyến tính có giữ được sắc sau ACES không.
    // Trả về {before, after} ∈ [0,1]. after < 0.3 nghĩa là sẽ ra xám.
    function aces(v) {
      // xấp xỉ đủ dùng để SO SÁNH các màu với nhau (không phải bản đầy đủ)
      return Math.max(0, Math.min(1, (v * (2.51 * v + 0.03)) / (v * (2.43 * v + 0.59) + 0.14)));
    }
    function sat(x, y, z) {
      var mx = Math.max(x, y, z), mn = Math.min(x, y, z);
      return mx <= 0 ? 0 : (mx - mn) / mx;
    }
    return { before: sat(r, g, b), after: sat(aces(r), aces(g), aces(b)) };
  };

  /* ---- sprite hạt tròn mềm (tránh hạt vuông) ------------------------------ */
  HFA.dotTex = function (rr, gg, bb) {
    var cv = document.createElement('canvas');
    cv.width = cv.height = 64;
    var cx = cv.getContext('2d');
    var gr = cx.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(' + rr + ',' + gg + ',' + bb + ',1)');
    gr.addColorStop(0.4, 'rgba(' + rr + ',' + gg + ',' + bb + ',0.55)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    cx.fillStyle = gr; cx.fillRect(0, 0, 64, 64);
    var tx = new THREE.CanvasTexture(cv);
    tx.encoding = THREE.sRGBEncoding;
    return tx;
  };

  /* ---- BỐN LỖI ĐÃ LÀM CHẾT HÀNG CHỤC CẢNH — đọc trước khi dựng tập mới -----
   *
   * Cả bốn đều KHÔNG bị `hyperframes validate` bắt, vì validate chỉ lấy vài mẫu
   * thời gian. Chúng chỉ lộ ra khi render ảnh và NHÌN. Rút từ tập 09–12.
   *
   * 1. BIẾN BỊ CHE (shadowing).
   *    Tập "nước": một mesh tên `grain` bị che bởi `var grain = 0.040` (lượng
   *    grain của lens) khai báo ngay trong renderAtTime → mọi cảnh từ S19 trở đi
   *    chết. Đặt tên mesh khác hẳn tên biến cục bộ; đối chiếu danh sách biến
   *    top-level với biến trong renderAtTime trước khi giao.
   *
   * 2. GỌI UNIFORM KHÔNG TỒN TẠI.
   *    Tập "photon": gọi `.uniforms.uEm` trên kết quả của HFA.buildStars — hàm
   *    đó CHỈ có `uOp`. Ném TypeError, 17 cảnh liên tiếp đứng hình. Kiểm API
   *    thư viện trước khi gọi, đừng đoán tên uniform.
   *
   * 3. SAI TỈ LỆ SÂN KHẤU.
   *    Tập "nước": nguyên tử r=1.30 đặt trên mặt cầu r=140 với camera cách 2.7
   *    → hai quả cầu phủ kín khung, ống liên kết thành tấm phẳng. Tính trước
   *    tỉ lệ vật thể so với khoảng cách camera, đừng chỉnh mò sau.
   *
   * 4. CHỮ QUÁ NHỎ KHÔNG ĐỌC NỔI.
   *    Tập "nước": chữ cao 0.42 world ở khoảng cách camera 28 → ra dưới 18px
   *    trên 1080p. Cần ≥26px. Với mỗi shot có chữ, tính trước
   *    `px ≈ (h_world / (2 * d * tan(fov/2))) * 1080` rồi mới chốt camera.
   *    Muốn chữ rõ hơn thì TĂNG ĐỘ DÀY NÉT, đừng tăng emissive — bloom làm
   *    nhoè mất nét chữ. Giữ chữ và sơ đồ DƯỚI ngưỡng bloom 1.0.
   */

  /* ---- CHỮ TIẾNG VIỆT TRÊN CANVAS: CANVAS PHẢI ĐỦ CAO CHO DẤU ------------
   *
   * Lỗi hệ thống, đo được ở tập quasar: 72/121 nhãn bị CẮT MẤT DẤU.
   *
   * Cơ chế: canvas 2D đặt `textBaseline='middle'` canh em-box vào giữa chiều
   * cao canvas. Nhưng dấu tiếng Việt nhô RA NGOÀI em-box — mũ/sắc/huyền/ngã/hỏi
   * nhô lên trên cap-height (chồng hai tầng như `ế`, `ộ`), dấu nặng thụt xuống
   * dưới baseline. Canvas chật thì chữ cái vẫn vẽ, dấu rơi ra ngoài vùng vẽ.
   * Triệu chứng: "vài chục nghìn ly" render ra "vai chuc nghin ly" dù mã nguồn
   * viết đúng dấu.
   *
   * Ngưỡng an toàn đo được: `hpx >= fpx * 2.4 * số_dòng`.
   * ⚠ Ngưỡng 2.0 KHÔNG đủ — một nhãn ở tỉ lệ 2.09 vẫn bị cắt.
   *
   * Nới canvas kéo theo HAI hệ quả phải xử cùng lúc, nếu không sẽ hỏng kiểu khác:
   *   1. Tỉ lệ khung của plane phải tính theo chiều cao THẬT sau khi nở, không
   *      theo `hpx` gốc — nếu không mọi chữ bị KÉO GIÃN NGANG.
   *   2. Trần bù `glyphFrac` phải chia cho hệ số nở — canvas cao hơn làm
   *      glyphFrac tụt, trần giữ nguyên thì chữ NHỎ ĐI THẬT (đo được 32px → 21px).
   *
   * Dùng `HFA.canvasHeightForText` khi tự dựng nhãn canvas.
   *
   * ---- CHỮ NHẬT (kanji/kana) THÌ KHÁC ------------------------------------
   * Kanji KHÔNG có dấu nhô ra ngoài em-box: chữ nằm gọn trong hộp vuông.
   * Đo thật ngày 2026-09-21 (BIZ UDPGothic 700, headless Chrome, "位牌と仏壇"):
   *   ascent 27.7px + descent 27.3px = 55.0px ở font 56px → tỉ lệ ~0.98.
   * Tức hệ số 2.4 của tiếng Việt CẤP DƯ hơn gấp đôi. Không gây cắt chữ, nhưng
   * canvas cao gấp đôi làm `glyphFrac` tụt một nửa → chữ NHỎ ĐI THẬT trên màn
   * hình (đúng cơ chế đã ghi ở hệ quả 2 bên trên). Vì thế tách hệ số theo chữ.
   * Vẫn để dư 1.45 cho phần nhô của 〜 ー ゛ ゜ và chữ Latin lẫn trong câu Nhật.
   */
  var CJK_RE = /[぀-ヿ㐀-䶿一-鿿＀-￯]/;

  /** true nếu chuỗi có chữ Nhật (kana/kanji/toàn角). */
  HFA.isCJK = function (s) { return CJK_RE.test(String(s || '')); };

  /**
   * Chiều cao canvas tối thiểu cho nhãn chữ.
   * @param fontPx cỡ chữ px
   * @param lines  số dòng
   * @param requestedHpx chiều cao mong muốn (lấy max)
   * @param text   (tuỳ chọn) chữ sẽ vẽ — có chữ Nhật thì dùng hệ số 1.45 thay vì 2.4.
   *               Bỏ trống = giữ nguyên hành vi cũ (2.4) cho các tập tiếng Việt.
   */
  HFA.canvasHeightForText = function (fontPx, lines, requestedHpx, text) {
    var k = (text != null && HFA.isCJK(text)) ? 1.45 : 2.4;
    var need = Math.ceil(fontPx * k * (lines || 1));
    return Math.max(requestedHpx || 0, need);
  };

  /** px ước tính của một vật cao `hWorld` ở khoảng cách `dist`, camera fov độ.
   *
   * ⚠ HÀM NÀY ĐO PLANE, KHÔNG ĐO CHỮ. Với nhãn vẽ bằng canvas texture, chữ dài
   * làm font bị thu nhỏ cho vừa canvas trong khi plane vẫn giữ nguyên kích
   * thước → glyph thật chỉ chiếm 55–62% chiều cao plane. Đo được ở tập quasar:
   * hàm báo 49px trong khi chữ trên frame render chỉ **4px**.
   *
   * Với nhãn canvas, truyền `glyphFrac` (tỉ lệ chiều cao glyph / chiều cao
   * plane, thường 0.55–0.68) làm tham số thứ 5, hoặc tốt hơn: cho `textTex`
   * trả về glyphFrac thật rồi chia hWorld cho nó khi dựng plane.
   *
   * Cách đáng tin duy nhất vẫn là ĐO TRÊN FRAME ĐÃ RENDER. Ngưỡng đọc được:
   * ≥26px @1080p.
   */
  HFA.estimatePx = function (hWorld, dist, fovDeg, screenH, glyphFrac) {
    var f = (fovDeg || 46) * Math.PI / 180;
    var px = (hWorld / (2 * dist * Math.tan(f / 2))) * (screenH || 1080);
    return px * (glyphFrac == null ? 1 : glyphFrac);
  };

  /* ---- starfield màu theo nhiệt độ ----------------------------------------
   * ⚠ BÁN KÍNH: radius PHẢI lớn hơn khoảng cách camera XA NHẤT trong cả timeline.
   * Camera bay ra ngoài quả cầu sao → nhìn thấy "quả bóng vũ trụ" bo tròn. Đây là
   * lỗi đã xảy ra thật. Truyền opt.maxCamDist để bật cảnh báo tự động.
   * Hằng số trong gl_PointSize phải BẰNG ĐÚNG radius, nếu không sao đổi độ to khi
   * đổi bán kính — nên nó được nội suy vào shader ngay dưới đây.
   */
  HFA.buildStars = function (opt) {
    opt = opt || {};
    var R = opt.radius || 9000;
    var N = opt.count || 3600;
    var pr = HFA.mulberry32(opt.seed || 20260808);

    if (opt.maxCamDist && R <= opt.maxCamDist * 1.5) {
      console.warn('[hf-astro] starfield radius ' + R + ' quá nhỏ so với camera xa nhất ' +
        opt.maxCamDist + ' — sẽ lộ "quả bóng vũ trụ". Tăng radius lên >' +
        Math.ceil(opt.maxCamDist * 2) + ' (và giữ < camera.far).');
    }

    var pos = new Float32Array(N * 3), col = new Float32Array(N * 3), siz = new Float32Array(N);
    var tmp = new THREE.Vector3();
    for (var i = 0; i < N; i++) {
      var u = pr(), v = pr();
      var theta = Math.acos(2 * u - 1), phi = 2 * Math.PI * v;
      tmp.set(Math.sin(theta) * Math.cos(phi), Math.cos(theta) * 0.8, Math.sin(theta) * Math.sin(phi))
        .normalize().multiplyScalar(R);
      pos[i * 3] = tmp.x; pos[i * 3 + 1] = tmp.y; pos[i * 3 + 2] = tmp.z;

      // màu theo nhiệt độ: xanh nóng → trắng → vàng nhạt
      var tt = pr(), c = new THREE.Color();
      if (tt < 0.14) c.setRGB(0.6, 0.72, 1.0);
      else if (tt < 0.5) c.setRGB(0.85, 0.9, 1.0);
      else if (tt < 0.8) c.setRGB(0.9, 0.92, 1.0);
      else c.setRGB(0.8, 0.82, 0.95);
      c.multiplyScalar(0.3 + pr() * 0.5);
      col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;

      siz[i] = (pr() < 0.05 ? 2.6 : 1.0) * (0.8 + pr() * 1.4);
    }

    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    g.setAttribute('aS', new THREE.BufferAttribute(siz, 1));

    var m = new THREE.ShaderMaterial({
      uniforms: { uOp: { value: 1 } },
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      vertexShader:
        'attribute float aS;attribute vec3 color;varying vec3 vC;' +
        'void main(){vC=color;vec4 mv=modelViewMatrix*vec4(position,1.0);' +
        'gl_PointSize=aS*(' + R.toFixed(1) + '/-mv.z);gl_Position=projectionMatrix*mv;}',
      fragmentShader:
        'varying vec3 vC;uniform float uOp;' +
        'void main(){vec2 d=gl_PointCoord-0.5;float r=length(d);' +
        'float a=smoothstep(0.5,0.0,r);gl_FragColor=vec4(vC,a*uOp);}'
    });

    var pts = new THREE.Points(g, m);
    pts.userData.radius = R;
    return pts;
  };

  /* ---- TÍCH LUỸ ĐA MẪU: khử răng cưa + motion blur thật -------------------
   *
   * Chỉ làm được vì renderAtTime(t) là HÀM THUẦN, không trạng thái: gọi lại với
   * t nào cũng cho đúng kết quả của t đó. Render offline nên được phép trả giá
   * bằng thời gian để đổi lấy chất lượng — đây là thứ engine realtime không có.
   *
   * Mỗi frame xuất ra lấy N mẫu:
   *   - t rải đều trong khoảng 1/fps      → MOTION BLUR thật theo quỹ đạo
   *   - camera lệch dưới-một-pixel        → SUPERSAMPLING, khử cả răng cưa
   *     shader/specular mà MSAA không xử lý được
   * rồi cộng trung bình.
   *
   * Giá: thời gian capture ×N. Nháp để samples=1, bản giao hàng đặt 4.
   *
   * CÁCH DÙNG — trong file tập:
   *   HFA.enableAccumulation(stage, {samples:4, fps:30});
   *   ... window.__time""lines[id] = HFA.makeTimeline(id, TOTAL, renderAtTime);
   * makeTimeline tự phát hiện stage đã bật tích luỹ nếu bạn truyền stage:
   *   HFA.makeTimeline(id, TOTAL, renderAtTime, stage)
   */
  HFA.enableAccumulation = function (stage, o) {
    o = o || {};
    var N = Math.max(1, o.samples || 1);
    if (N === 1) {
      // tắt tích luỹ → PHẢI trả composer về chế độ vẽ thẳng ra màn hình,
      // nếu không màn hình đen (không pass nào ghi ra nữa).
      stage.accum = null;
      stage.composer.renderToScreen = true;
      return stage;
    }

    /* Chuyển hướng đầu ra composer vào texture thay vì màn hình.
     * ⚠ PHẢI đặt trên COMPOSER, không phải trên pass: EffectComposer.render()
     * gán lại pass.renderToScreen mỗi frame theo công thức
     *   pass.renderToScreen = composer.renderToScreen && làPassCuốiCùng
     * nên mọi thiết lập trực tiếp lên lens.renderToScreen đều bị xoá. (Đo được:
     * đặt trên pass thì cả read/write buffer đều chứa dữ liệu TRƯỚC lens.) */
    stage.composer.renderToScreen = false;

    var rtOpts = {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat, type: THREE.HalfFloatType
    };
    var accumRT = new THREE.WebGLRenderTarget(stage.W, stage.H, rtOpts);

    // quad toàn màn hình dùng để cộng dồn rồi để xuất ra
    var quadScene = new THREE.Scene();
    var quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    var quadMat = new THREE.ShaderMaterial({
      uniforms: { tSrc: { value: null }, uWeight: { value: 1 / N } },
      transparent: true, depthTest: false, depthWrite: false,
      blending: THREE.CustomBlending,
      blendEquation: THREE.AddEquation,
      blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,   // cộng thuần
      vertexShader: 'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}',
      fragmentShader: 'varying vec2 vUv;uniform sampler2D tSrc;uniform float uWeight;' +
        'void main(){gl_FragColor=vec4(texture2D(tSrc,vUv).rgb*uWeight,1.0);}'
    });
    quadScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), quadMat));

    var outMat = new THREE.ShaderMaterial({
      uniforms: { tSrc: { value: accumRT.texture } },
      depthTest: false, depthWrite: false,
      vertexShader: 'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}',
      fragmentShader: 'varying vec2 vUv;uniform sampler2D tSrc;' +
        'void main(){gl_FragColor=vec4(texture2D(tSrc,vUv).rgb,1.0);}'
    });
    var outScene = new THREE.Scene();
    outScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), outMat));

    stage.accum = {
      samples: N, fps: o.fps || 30,
      rt: accumRT, quadScene: quadScene, quadCam: quadCam,
      quadMat: quadMat, outScene: outScene
    };
    return stage;
  };

  /* Vị trí lệch subpixel — chuỗi Halton (2,3): phân bố đều hơn ngẫu nhiên,
   * và tất định tuyệt đối (không đụng tới PRNG chung). */
  function halton(i, b) {
    var f = 1, r = 0;
    while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); }
    return r;
  }

  /** Vẽ MỘT frame tại t. Tự dùng tích luỹ nếu stage đã bật, không thì vẽ thẳng. */
  HFA.renderFrame = function (stage, renderAtTime, t) {
    var acc = stage && stage.accum;
    if (!acc) { renderAtTime(t); return; }   // renderAtTime tự gọi composer.render()

    var r = stage.renderer, cam = stage.camera, N = acc.samples;
    var dt = 1 / acc.fps;
    var prevAutoClear = r.autoClear;

    // xoá bộ tích luỹ ĐÚNG MỘT LẦN, trước vòng lặp
    r.setRenderTarget(acc.rt);
    r.setClearColor(0x000000, 1);
    r.clear(true, true, true);
    r.setRenderTarget(null);

    for (var i = 0; i < N; i++) {
      // lệch dưới-một-pixel (Halton, tất định)
      var jx = halton(i + 1, 2) - 0.5, jy = halton(i + 1, 3) - 0.5;
      cam.setViewOffset(stage.W, stage.H, jx, jy, stage.W, stage.H);

      // trải t trong đúng một frame → motion blur
      var tt = t + ((i + 0.5) / N - 0.5) * dt;
      r.setClearColor(stage.clearColor, 1);   // trả màu nền cho RenderPass
      renderAtTime(tt < 0 ? 0 : tt);

      /* ⚠ autoClear PHẢI tắt ở đây.
       * renderer.autoClear mặc định TRUE → mỗi r.render() xoá sạch target trước
       * khi vẽ. Cộng dồn mà không tắt thì 3 mẫu đầu bị xoá, chỉ mẫu cuối sống
       * sót và nó mang trọng số 1/N → ảnh tối đúng N lần. (Đã dính lỗi này:
       * ảnh ra tối bằng 1/4 với N=4.) */
      // pass cuối có needsSwap=true nên sau render(), kết quả nằm ở readBuffer
      acc.quadMat.uniforms.tSrc.value = stage.composer.readBuffer.texture;
      r.autoClear = false;
      r.setRenderTarget(acc.rt);
      r.render(acc.quadScene, acc.quadCam);
      r.setRenderTarget(null);
      r.autoClear = prevAutoClear;
    }

    cam.clearViewOffset();
    r.setClearColor(stage.clearColor, 1);
    r.render(acc.outScene, acc.quadCam);   // xuất ra màn hình
  };

  /* ---- phụ đề -------------------------------------------------------------
   * CUES = [{t, s}] do scripts/gen-captions.mjs sinh, đã cắt sẵn MỘT DÒNG:
   * ≤42 ký tự với tiếng Việt, ≤22 ký tự toàn角 với tiếng Nhật (chữ Nhật rộng gấp đôi).
   * Đừng cắt tay và đừng đổi mảng này bằng tay.
   */
  HFA.subtitleAt = function (CUES, t) {

    for (var i = 0; i < CUES.length; i++) {

/**
 * Đặt trạng thái nến theo chiều cao h (0..1) và thời gian t.
 * lit=false → tắt hẳn (S48 cuối).
 */
var CANDLE_FULL = 0.175;   // chiều cao thân nến ở 100%
function setCandle(h, t, lit){
  var hh = Math.max(0.02, h) * CANDLE_FULL;
  candleBody.scale.set(1, hh, 1);
  candleBody.position.y = 0.020 + hh/2;
  var topY = 0.020 + hh;
  /* gờ sáp chảy: rõ dần khi nến ngắn lại */
  var waxK = clamp((0.62 - h)/0.40, 0, 1);
  candleWax.material.opacity = waxK*0.95;
  candleWax.scale.set(1, 0.5 + waxK, 1);
  /* bấc dài hơn + nghiêng hơn khi nến ngắn */
  candleWick.position.set(0, topY + 0.0055 + waxK*0.004, 0);
  candleWick.rotation.z = waxK*0.30;
  candleWick.scale.set(1, 1 + waxK*0.8, 1);
  var flameY = topY + 0.013 + waxK*0.006;
  /* dao động biên độ 3%, chu kỳ 2.1s + nhịp phụ 0.73s — HÀM THUẦN CỦA t */
  var flick = 1 + 0.030*Math.sin(t*2*Math.PI/2.1) + 0.014*Math.sin(t*2*Math.PI/0.73 + 1.7);
  if(!lit){
    candleFlame.visible = false; candleHalo.material.opacity = 0; candleHaloIn.material.opacity = 0;
    candleLight.intensity = 0;
    return;
  }
  candleFlame.visible = true;
  candleFlame.position.set(0, flameY, 0);
  candleFlame.scale.set(1, flick, 1);
  candleFlame.rotation.z = 0.05*Math.sin(t*2*Math.PI/3.3);
  /* quầng sáng CO LẠI khi nến thấp: 1.4m → 1.0m */
  var reach = lerp(1.0, 1.4, clamp((h-0.28)/0.44, 0, 1));
  candleLight.position.set(CANDLE.position.x, CANDLE.position.y + flameY, CANDLE.position.z);
  BUTSU.localToWorld(candleLight.position);
  candleLight.distance = reach*3.0;
  candleLight.intensity = 2.55*flick*(0.86 + 0.14*reach/1.4);
  candleHaloIn.position.set(0, flameY, 0);
  candleHalo.position.set(0, flameY, 0);
  candleHaloIn.scale.set(0.10*flick, 0.10*flick, 1);
  candleHalo.scale.set(0.44*flick*reach/1.4, 0.44*flick*reach/1.4, 1);
  candleHaloIn.material.opacity = 0.92*flick;
  candleHalo.material.opacity = 0.32*flick;
  blowSmoke.material.opacity = 0;
}

/** noise 2D nhẹ, tất định — dùng cho khói, sương, sóng */
function n2(x, y){
  return Math.sin(x*1.7 + Math.sin(y*2.3)*1.4) * Math.cos(y*1.9 - Math.sin(x*1.1)*1.2);
}
function updateSmoke(t, amp){
  var g = smokePts.geometry, n = g.userData.n, s = g.userData.seed;
  var p = g.attributes.position.array, i;
  for(i=0; i<n; i++){
    var u = (s[i] + t*0.055) % 1.0;             // dâng lên, vòng lại — hàm thuần của t
    var y = u*0.30;                              // tan ở độ cao 30cm
    var sway = (0.004 + u*0.040) * n2(u*3.4 + t*0.22, s[i]*9.0);
    var sway2 = (0.002 + u*0.026) * n2(u*2.1 - t*0.17 + 4.0, s[i]*5.0);
    p[i*3]   = sway;
    p[i*3+1] = y;
    p[i*3+2] = sway2;
  }
  g.attributes.position.needsUpdate = true;
  smokePts.material.opacity = 0.30*(amp==null?1:amp);
}

function updateBookDust(t, amp){
  var d = BOOK.userData.dust, g = d.geometry, n = g.userData.n, sd = g.userData.sd;
  var p = g.attributes.position.array, i;
  for(i=0; i<n; i++){
    var u = (sd[i*3+1] + t*0.030) % 1.0;
    p[i*3]   = sd[i*3]   + 0.030*n2(u*2.2 + i*0.31, t*0.16);
    p[i*3+1] = 0.03 + u*0.34;
    p[i*3+2] = sd[i*3+2] + 0.026*n2(u*1.8 - i*0.23, t*0.12 + 3.0);
  }
  g.attributes.position.needsUpdate = true;
  d.material.opacity = 0.42*(amp==null?1:amp)*(1 - 0.3*Math.sin(t*0.4));
}

(function(){
  var skin = new THREE.MeshStandardMaterial({color:0x8A6B55, roughness:0.86, metalness:0.0});

  palm.scale.set(0.82, 0.30, 1.05); palm.position.set(0, 0, 0.012); HAND.add(palm);
  var i;
  /* Ngon tay: BA DOT co khop, do dai khac nhau (giua dai nhat), hoi cong xuong.
   * Lan render dau dung mot hinh tru thang cho ca ngon → doc ra nhu que cui. */
  var FLEN = [0.030, 0.034, 0.032, 0.026];      // dot 1 theo tung ngon
  var FROT = [0.30, 0.22, 0.26, 0.34];          // do cong tong the
  for(i=0; i<4; i++){
    var fg = new THREE.Group();
    var seg, zc = 0.0, bend = 0;
    for(seg=0; seg<3; seg++){
      var L = FLEN[i]*(1 - seg*0.22), r0 = 0.0092 - i*0.0004 - seg*0.0016;
      var jo = new THREE.Mesh(new THREE.CylinderGeometry(r0, r0*0.90, L, 8), skin);
      bend += FROT[i]*(seg === 0 ? 0.5 : 0.9);
      jo.rotation.x = Math.PI/2 + bend;
      jo.position.set(0, -Math.sin(bend)*L*0.5 - seg*0.004, zc + Math.cos(bend)*L*0.5);
      zc += Math.cos(bend)*L;
      fg.add(jo);
      /* khop: mot cau nho noi hai dot, de ngon tay khong gay khuc */
      var kn = new THREE.Mesh(new THREE.SphereGeometry(r0*1.05, 8, 6), skin);
      kn.position.set(0, -Math.sin(bend)*L - seg*0.004, zc); fg.add(kn);
    }
    fg.position.set(-0.031 + i*0.021, 0.001, 0.048);
    fg.rotation.y = (i - 1.5)*0.075;             // ngon toa nhe ra hai ben

  var tk = new THREE.Mesh(new THREE.SphereGeometry(0.0112, 8, 6), skin);
  tk.position.set(-0.030, -0.004, 0.027); tg.add(tk);
  HAND.add(tg);
  var wr = new THREE.Mesh(new THREE.CylinderGeometry(0.030,0.032,0.16,12), skin);
  wr.rotation.x = Math.PI/2; wr.position.set(0, 0, -0.114); HAND.add(wr);

  var sleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.052,0.048,0.10,14),

(function(){
  var paper = new THREE.Mesh(new THREE.PlaneGeometry(0.60, 0.78),
    new THREE.MeshStandardMaterial({color:0xC6BCA6, roughness:0.97}));
  CAL.add(paper);
  /* lưới 7 cột × 5 hàng */
  var cols = 7, rows = 5, cw = 0.60/cols, ch = 0.60/rows, i, j;
  var gridMat = flatMat(0x4A443A, 0.30);
  for(i=0; i<=cols; i++){
    var v = new THREE.Mesh(new THREE.PlaneGeometry(0.0022, 0.60), gridMat);
    v.position.set(-0.30 + i*cw, -0.09, 0.002); CAL.add(v);
  }
  for(j=0; j<=rows; j++){
    var hb = new THREE.Mesh(new THREE.PlaneGeometry(0.60, 0.0022), gridMat);
    hb.position.set(0, 0.21 - j*ch, 0.002); CAL.add(hb);
  }
  /* BẢY dấu tròn bút đỏ vẽ TAY: nét không đều, có chỗ đè hai lần.
   * Cách nhau ĐÚNG 7 ô lịch — người 60+ sẽ đếm. */
  var pr = HFA.mulberry32(4949), k;
  for(k=0; k<7; k++){
    var idx = 2 + k*7;                       // bắt đầu ô thứ 3, mỗi tuần một ô
    var cx2 = idx % cols, cy2 = Math.floor(idx/cols);
    var px = -0.30 + (cx2+0.5)*cw, py = 0.21 - (cy2+0.5)*ch;
    var cv = document.createElement('canvas'); cv.width = cv.height = 96;
    var c2 = cv.getContext('2d'); c2.clearRect(0,0,96,96);
    c2.strokeStyle = 'rgba(178,38,30,0.86)'; c2.lineCap = 'round';
    var pass;
    for(pass=0; pass<(pr()>0.5?2:1); pass++){
      c2.lineWidth = 4.0 + pr()*2.0;
      c2.beginPath();
      var a0 = pr()*0.7, seg;
      for(seg=0; seg<=30; seg++){
        var ang = a0 + seg/30*Math.PI*2.06;
        var rr = 32 + Math.sin(ang*3 + pr()*0.2)*2.6 + pass*1.4;
        var xx = 48 + Math.cos(ang)*rr, yy = 48 + Math.sin(ang)*rr*0.90;
        if(seg===0) c2.moveTo(xx,yy); else c2.lineTo(xx,yy);
      }
      c2.stroke();
    }
    var tx = new THREE.CanvasTexture(cv); tx.encoding = THREE.sRGBEncoding;
    var mk = new THREE.Mesh(new THREE.PlaneGeometry(cw*0.94, ch*0.94),
      new THREE.MeshBasicMaterial({map:tx, transparent:true, opacity:0, depthWrite:false}));
    mk.position.set(px, py, 0.004); CAL.add(mk);
    /* quầng sáng nhẹ khi ô "sáng lên" */
    var lit = new THREE.Mesh(new THREE.PlaneGeometry(cw*0.96, ch*0.96),
      flatMat(0xFFD79A, 0));
    lit.material.blending = THREE.AdditiveBlending;
    lit.position.set(px, py, 0.003); CAL.add(lit);
    calCells.push({mark:mk, lit:lit, x:px, y:py});
  }
  /* CHỈ ba nhãn: 初七日 / 二七日 / 三七日. Không nhãn tiếng Anh. */
  var names = ['初七日','二七日','三七日'];
  for(k=0; k<3; k++){
    var lb = textPlane(names[k], 0.030, CSS_PAPER, 0);
    lb.position.set(calCells[k].x, calCells[k].y - ch*0.60, 0.006);
    CAL.add(lb); calLabels.push(lb);

/* --- ⭐ SÂN KHẤU TRỐNG dùng chung cho các cảnh trừu tượng -------------------
 * Bài học từ lần render đầu: một vòng/dải phát sáng đặt trong hư không tuyệt đối
 * ra frame gần như TRƠN — không có gì cho mắt neo vào, không có chiều sâu, và
 * chủ thể mảnh (ống bán kính 3cm) biến mất trong nén màu. Sân khấu này cho mọi
 * cảnh ý niệm của 第2章 ba thứ tối thiểu:
 *   1. MẶT SÀN mờ có gradient tâm → chủ thể có chỗ "đứng", có bóng, có tỉ lệ.
 *   2. SƯƠNG hạt → chiều sâu khí quyển, cùng chất liệu với 第3章 (nhất quán kênh).
 *   3. ÁNH SÁNG riêng của nhóm → vật liệu PBR mới bắt sáng (RING/BAR trước đây
 *      KHÔNG có đèn nào, khác mọi nhóm khác trong file — đó là lỗi gốc).
 * Tất cả tất định: sương chạy bằng updateMist(t), gradient là texture tĩnh.
 */
function voidFloorTex(seed){
  var cv = document.createElement('canvas'); cv.width = cv.height = 512;
  var cx = cv.getContext('2d');
  var g = cx.createRadialGradient(256, 256, 0, 256, 256, 256);
  g.addColorStop(0.00, 'rgba(78,96,118,0.92)');
  g.addColorStop(0.38, 'rgba(50,64,84,0.58)');
  g.addColorStop(0.72, 'rgba(26,34,48,0.22)');
  g.addColorStop(1.00, 'rgba(10,13,20,0.0)');
  cx.fillStyle = g; cx.fillRect(0, 0, 512, 512);
  /* thớ rất mảnh cho sàn khỏi "nhựa" — seeded, vẽ một lần, không đổi theo t */
  var pr = HFA.mulberry32(seed || 707), i;
  cx.globalCompositeOperation = 'lighter';
  for(i=0; i<900; i++){
    var a = pr()*Math.PI*2, r = Math.sqrt(pr())*250;
    cx.fillStyle = 'rgba(120,142,170,' + (0.012 + pr()*0.030).toFixed(3) + ')';
    cx.fillRect(256 + Math.cos(a)*r, 256 + Math.sin(a)*r, 1 + pr()*2.4, 1);
  }
  var tx = new THREE.CanvasTexture(cv);
  tx.encoding = THREE.sRGBEncoding; tx.anisotropy = MAXANI;
  return tx;
}
/** gắn sàn + sương + đèn vào một nhóm ý niệm. Trả về {floor, mist} để cảnh điều khiển. */
function addVoidStage(grp, o){
  o = o || {};
  var size = o.size || 46;
  var floor = new THREE.Mesh(new THREE.PlaneGeometry(size, size),
    new THREE.MeshBasicMaterial({map:voidFloorTex(o.seed), transparent:true,
      opacity:0, depthWrite:false, blending:THREE.AdditiveBlending}));
  floor.rotation.x = -Math.PI/2;
  floor.position.y = o.y == null ? -0.02 : o.y;
  floor.renderOrder = -2;
  grp.add(floor);
  var mist = makeMist(o.mistN || 900, o.mistSpread || 40, o.mistH || 11,
    o.seed || 707, 0x5E7488, o.mistSize || 2.8, 0.10, o.mistFade || 9.0);
  mist.position.set(0, o.mistY == null ? -1.0 : o.mistY, 0);
  grp.add(mist);
  var dl = new THREE.DirectionalLight(0xA2B8CE, o.dl == null ? 0.78 : o.dl);
  dl.position.set(-4, 9, 7); grp.add(dl);
  var rim = new THREE.DirectionalLight(0x6F90C0, 0.34);
  rim.position.set(6, -2, -5); grp.add(rim);
  grp.add(new THREE.AmbientLight(0x1C2431, o.amb == null ? 0.66 : o.amb));
  return {floor:floor, mist:mist};
}

/* ==========================================================================
 * 第3章 — con đường, bảy cổng, núi, sông ba lối, cây áo, gương, vòng sáu cõi
 * ⚠ Đường LUÔN TRỐNG: camera LÀ người đi. Không có nhân vật trong khung,
 *   không bóng lưng đi phía trước (GHI CHÚ mục 9.2).

/* sương: lớp hạt lớn mờ, vị trí = hàm thuần của t */
function makeMist(count, spread, height, seed, col, size, op, fadeNear){
  var g = new THREE.BufferGeometry(), a = new Float32Array(count*3);
  var sd = new Float32Array(count*3), pr = HFA.mulberry32(seed), i;
  for(i=0; i<count; i++){
    sd[i*3]   = (pr()-0.5)*spread;
    sd[i*3+1] = pr();
    sd[i*3+2] = (pr()-0.5)*spread;
    a[i*3]=sd[i*3]; a[i*3+1]=sd[i*3+1]*height; a[i*3+2]=sd[i*3+2];
  }
  g.setAttribute('position', new THREE.BufferAttribute(a,3));
  g.userData = {sd:sd, n:count, spread:spread, height:height};
  /* ⚠ PointsMaterial nhân size theo 1/khoảng-cách KHÔNG CÓ TRẦN. Camera của các
   * cảnh ý niệm nằm NGAY TRONG khối sương (spread 40–48m), nên vài hạt cách máy
   * 0.5m nở thành đốm chiếm 1/4 khung — đó là "màn trắng mờ" nuốt cả chủ thể ở
   * frame 900s. Shader riêng để KẸP TRẦN kích thước theo pixel, và làm mờ dần
   * hạt ở quá gần (dưới uFade mét) để chúng tan đi thay vì loè ra.
   * Vẫn tất định: mọi thứ là hàm của vị trí hạt (do updateMist đặt theo t). */
  var mat = new THREE.ShaderMaterial({
    uniforms: {
      uMap:  {value: dotTex()},
      uCol:  {value: new THREE.Color(col == null ? 0x6E8296 : col)},
      uOp:   {value: (op == null ? 0.14 : op)},
      uSize: {value: (size == null ? 3.2 : size)},
      uMaxPx:{value: 30.0},          // trần: không hạt nào quá 30px trên khung 1080
      /* dưới uFade mét thì mờ dần về 0 — camera của cảnh ý niệm nằm TRONG khối
       * sương. Bọt nước (S20–S21) nằm sát máy nên truyền fadeNear nhỏ. */
      uFade: {value: (fadeNear == null ? 7.0 : fadeNear)}
    },
    vertexShader:
      'uniform float uSize; uniform float uMaxPx; uniform float uFade;\n' +
      'varying float vK;\n' +
      'void main(){\n' +
      '  vec4 mv = modelViewMatrix * vec4(position, 1.0);\n' +
      '  float dist = -mv.z;\n' +
      '  float px = uSize * 300.0 / max(dist, 0.001);\n' +
      '  gl_PointSize = min(px, uMaxPx);\n' +
      '  vK = smoothstep(0.0, uFade, dist);\n' +
      '  gl_Position = projectionMatrix * mv;\n' +
      '}',
    fragmentShader:
      'uniform sampler2D uMap; uniform vec3 uCol; uniform float uOp;\n' +
      'varying float vK;\n' +
      'void main(){\n' +
      '  vec4 tx = texture2D(uMap, gl_PointCoord);\n' +
      '  gl_FragColor = vec4(uCol, 1.0) * tx.a * uOp * vK;\n' +
      '}',
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  });
  /* giữ API cũ: mọi cảnh đang viết `mist.material.opacity = ...` */
  Object.defineProperty(mat, 'opacity', {
    get: function(){ return mat.uniforms.uOp.value; },
    set: function(v){ mat.uniforms.uOp.value = v; }
  });
  var p = new THREE.Points(g, mat);
  p.frustumCulled = false;
  return p;
}
function updateMist(pts, t, spd){
  var g = pts.geometry, n = g.userData.n, sd = g.userData.sd, sp = g.userData.spread;
  var p = g.attributes.position.array, i, v = (spd==null?0.05:spd);
  for(i=0; i<n; i++){
    var dx = ((sd[i*3]/sp + 0.5 + t*v*0.12) % 1.0) - 0.5;
    p[i*3]   = dx*sp;
    p[i*3+1] = sd[i*3+1]*g.userData.height + 0.6*Math.sin(t*0.13 + sd[i*3+2]*0.7);
    p[i*3+2] = sd[i*3+2] + 1.4*Math.sin(t*0.09 + sd[i*3]*0.5);
  }
  g.attributes.position.needsUpdate = true;
}

/** 門 kiểu chùa: HAI CỘT + MỘT XÀ NGANG. KHÔNG dùng 鳥居. */
function makeGate(scale){
  var g = new THREE.Group();
  /* gỗ SẪM nhưng không đen kịt: 0x2A2C30 cũ chỉ phản 16% nên trên nền lam tối
   * cổng biến thành lỗ trống. 0x4A4640 vẫn là gỗ cũ trong sương, nhưng có hình. */
  var wood = new THREE.MeshStandardMaterial({color:0x4A4640, roughness:0.88, metalness:0.04});
  var h = 3.2*scale, w = 2.6*scale, th = 0.20*scale;
  var c1 = new THREE.Mesh(new THREE.BoxGeometry(th, h, th), wood);
  c1.position.set(-w/2, h/2, 0); g.add(c1);
  var c2 = c1.clone(); c2.position.x = w/2; g.add(c2);
  var beam = new THREE.Mesh(new THREE.BoxGeometry(w + th*3.0, th*1.15, th*1.15), wood);
  beam.position.set(0, h, 0); g.add(beam);
  /* xà phụ thấp hơn — cho ra dáng 門 chùa, không phải 鳥居 (không cong hai đầu) */
  var beam2 = new THREE.Mesh(new THREE.BoxGeometry(w + th*0.6, th*0.62, th*0.70), wood);
  beam2.position.set(0, h*0.80, 0); g.add(beam2);
  /* bậc đá dưới chân */
  var st = new THREE.Mesh(new THREE.BoxGeometry(w + th*3.4, 0.14*scale, 1.0*scale),
    new THREE.MeshStandardMaterial({color:0x3A3E44, roughness:0.96}));
  st.position.set(0, 0.07*scale, 0); g.add(st);
  /* quầng sáng mờ của cổng — nhìn từ xa chỉ thấy vệt này */
  var gl = glow(0xA8C0D8, 3.0*scale, 0.26);
  gl.position.set(0, h*0.55, 0); g.add(gl);
  g.userData.glow = gl; g.userData.h = h;
  return g;
}

/* --- 地蔵菩薩 + 閻魔王 chồng hình (S38–S39, S47) ------------------------
 * 地蔵: tượng ĐÁ VEN ĐƯỜNG, đầu TRÒN KHÔNG TÓC, mắt KHÉP, mặt HIỀN,
 * tay phải cầm 錫杖, tay trái ôm 宝珠, có 前掛け ĐỎ ai đó đã buộc cho.
 * Yếm đỏ là chi tiết BẮT BUỘC — người Nhật nhận ra ngay lập tức.
 *
 * ⚠ Bản trước là "khối cầu + hộp": thân hình trụ trơn, yếm là một HÌNH CHỮ
 *   NHẬT ĐỎ PHẲNG dán trước ngực. Cả hai đọc ra là đồ hoạ tạm, không phải
 *   pho tượng đá ven đường. Bản này:
 *   - thân dựng bằng LatheGeometry (vai XUÔI, eo thắt nhẹ, gấu áo loe) nên
 *     có đường bóng liên tục thay vì hai mặt trụ song song;
 *   - đá granit PHONG HOÁ: vertex color lốm đốm + roughness 0.99, metalness 0
 *     (đá ướt mưa vẫn là đá nhám, KHÔNG bóng);
 *   - 前掛け là TẤM VẢI cong ôm ngực, bo góc dưới, có nếp gấp dọc và viền gấu,
 *     buộc bằng dây vòng sau cổ. Đỏ ĐÃ BẠC vì mưa nắng (0xA84C44), không đỏ tươi.
 */
/** màu đá có lốm đốm phong hoá — gán vào attribute color, tất định theo seed */
function stoneMottle(geo, seed, amp){
  var pos = geo.attributes.position, n = pos.count;
  var col = new Float32Array(n*3), pr = HFA.mulberry32(seed), i;
  for(i=0; i<n; i++){
    var x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    /* nhiễu giả 3 tần số — hàm thuần của toạ độ, không phụ thuộc thứ tự duyệt */
    var v = Math.sin(x*11.3 + y*7.1) * Math.sin(z*9.7 - y*5.3)
          + 0.55*Math.sin(x*23.9 - z*19.1 + y*13.7);
    var k = 1 + (v*0.36 + (pr()-0.5)*0.5) * (amp == null ? 0.085 : amp);
    /* rêu/ố nước đọng ở phần dưới: ngả xanh-xám rất nhẹ */
    var damp = clamp(1.0 - y*0.8, 0, 1);
    col[i*3]   = k * (1 - damp*0.045);
    col[i*3+1] = k * (1 - damp*0.012);
    col[i*3+2] = k * (1 - damp*0.030);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return geo;
}
function makeJizo(){
  var g = new THREE.Group();
  /* granit đã phong hoá: NHÁM (0.99), không kim loại, có lốm đốm vertex-color */
  /* ⚠ Cảnh vẽ HDR tuyến tính, ngưỡng bloom 1.0, và hai đèn hướng của OVERLAY
   * là 0.62 + 0.30. Đá 0x757269 (~0.46 tuyến tính) nhân 0.92 tổng chiếu sáng
   * vẫn an toàn, nhưng vertex-color đẩy lên tới 1.09 ở chỗ sáng nhất làm chỏm
   * đầu chớm cháy. Hạ nền đá một nấc: granit ven đường vốn xám sẫm, không
   * phải cẩm thạch. */
  var stone = new THREE.MeshStandardMaterial({color:0x66635B, roughness:0.99,
    metalness:0.0, vertexColors:true, flatShading:false});
  var stoneP = new THREE.MeshStandardMaterial({color:0x66635B, roughness:0.99,
    metalness:0.0});   // bản không vertex-color, cho chi tiết nhỏ
  var i, a;

  /* --- bệ đá vuông đã lún, mép sứt ------------------------------------- */
  var base = stoneMottle(new THREE.CylinderGeometry(0.44, 0.52, 0.22, 20), 771, 0.10);
  var baseM = new THREE.Mesh(base, stone);
  baseM.position.y = 0.11; g.add(baseM);
  var plinth = stoneMottle(new THREE.CylinderGeometry(0.335, 0.40, 0.11, 20), 772, 0.09);
  var plM = new THREE.Mesh(plinth, stone);
  plM.position.y = 0.275; g.add(plM);

  /* --- THÂN: lathe, VAI XUÔI rồi loe xuống gấu áo ----------------------
   * Hồ sơ (bán kính, cao): cổ 0.145 → vai xuôi 0.305 → ngực 0.315 →
   * eo 0.295 → gấu loe 0.415. Vai xuôi là nét đặc trưng của tượng 地蔵. */
  /* ⚠ GỜ GẤU ÁO nắn THẲNG VÀO HỒ SƠ LATHE, không đắp torus riêng.
   * Bản torus trước bị bỏ vì mặt cong đều của nó bắt trọn đèn hướng thành một
   * ĐƯỜNG SÁNG LIÊN TỤC vòng quanh thân ⇒ mắt đọc ra "vòng đai lơ lửng".
   * Nắn vào hồ sơ thì gờ là chính bề mặt thân, liền khối, không có đường cắt.
   * Nét tạo ra mép vải là chỗ ĐỔI HƯỚNG ĐỘT NGỘT của đường sinh, không phải
   * chỗ phình: bán kính nở ra tới đỉnh gấu (0.432 ở y=0.392) rồi THÓT LẠI
   * nhanh xuống 0.404 ở y=0.452 — cái undercut đó mới cho bóng đổ dưới mép,
   * và bóng mới là thứ đọc ra "vải dày đè lên đá". Dưới đỉnh gấu là một đoạn
   * gần thẳng đứng (0.412→0.428, y 0.336→0.372) = thành gấu.
   * Bậc y thưa hơn 0.02 để lathe (40 nan) không làm tròn mất nếp gãy. */
  var prof = [
    [0.000, 0.330],[0.392, 0.334],[0.412, 0.338],[0.428, 0.372],
    [0.432, 0.392],[0.421, 0.424],[0.404, 0.452],[0.400, 0.520],
    [0.396, 0.600],[0.386, 0.760],[0.352, 0.980],[0.328, 1.160],
    [0.316, 1.310],[0.309, 1.440],[0.300, 1.545],[0.272, 1.628],
    [0.222, 1.690],[0.156, 1.726],[0.140, 1.748]
  ];
  var pts = [];
  for(i=0; i<prof.length; i++) pts.push(new THREE.Vector2(prof[i][0], prof[i][1]));
  var bodyG = stoneMottle(new THREE.LatheGeometry(pts, 40), 773, 0.075);
  var body = new THREE.Mesh(bodyG, stone);
  g.add(body);

  var foldMat = new THREE.MeshStandardMaterial({color:0x585449, roughness:1.0,
    metalness:0.0});
  foldMat.envMapIntensity = 0.30;
  /* bán kính thân tại độ cao y — nội suy tuyến tính trên hồ sơ lathe */
  function bodyR(yy){
    var k;
    if(yy <= prof[0][1]) return prof[0][0];
    for(k=0; k<prof.length-1; k++){
      if(yy >= prof[k][1] && yy <= prof[k+1][1]){
        var f = (yy - prof[k][1])/(prof[k+1][1] - prof[k][1]);
        return prof[k][0] + (prof[k+1][0] - prof[k][0])*f;
      }
    }
    return prof[prof.length-1][0];
  }
  /* NẾP GẤP ÁO DỌC — gờ LIỀN MẠCH chạy dọc thân, không phải chuỗi hạt.
   * ⚠ Bản trước ghép 7 quả cầu dẹt cho mỗi nếp: ở cận cảnh chúng đọc ra là
   *   DÃY VẢY/HẠT CƯỜM dính trên áo, không phải nếp vải. Dùng TubeGeometry
   *   bám theo bán kính thân nên gờ liên tục, thon dần về hai đầu, và hơi
   *   lượn ngang (vải rủ thì nếp không chạy thẳng đứng tuyệt đối). */
  function robeFold(ang, y0, y1, w){
    var seg = 12, cp = [], s2;
    for(s2=0; s2<=seg; s2++){
      var fs = s2/seg, yy = y0 + (y1-y0)*fs;
      /* nếp lệch nhẹ sang ngang khi chảy xuống — vải rủ theo trọng lực */
      var aa = ang + Math.sin(fs*Math.PI)*0.035*(ang < 0 ? -1 : 1);
      var rr = bodyR(yy)*0.995;
      cp.push(new THREE.Vector3(Math.sin(aa)*rr, yy, Math.cos(aa)*rr));
    }
    var cv2 = new THREE.CatmullRomCurve3(cp);
    /* bán kính gờ thon về hai đầu: nếp vải nhoè dần chứ không cụt ngang */
    var tg = new THREE.TubeGeometry(cv2, seg*2, w, 5, false);
    var tp = tg.attributes.position, ti;
    for(ti=0; ti<tp.count; ti++){
      var fy = clamp((tp.getY(ti) - y0)/(y1 - y0), 0, 1);
      var taper = Math.sin(Math.PI*Math.pow(fy, 0.80));
      taper = 0.20 + 0.80*taper;
      var cx2 = Math.sin(ang)*bodyR(tp.getY(ti))*0.995;
      var cz2 = Math.cos(ang)*bodyR(tp.getY(ti))*0.995;
      tp.setX(ti, cx2 + (tp.getX(ti) - cx2)*taper);
      tp.setZ(ti, cz2 + (tp.getZ(ti) - cz2)*taper);
    }
    tg.computeVertexNormals();
    /* ⚠ Gờ nếp là ống TRÒN, đỉnh ống luôn quay về đèn ⇒ mỗi nếp bắt một vệt
     * highlight chạy dọc, và tám nếp thành TÁM SỌC TRẮNG trên áo (thấy rõ ở
     * frame 1162 bản trước). Vật liệu riêng, sẫm hơn thân một nấc và nhám
     * tối đa, để nếp đọc ra bằng BÓNG chứ không bằng vệt sáng. */
    return new THREE.Mesh(tg, foldMat);
  }
  /* nếp chính chảy xuống từ hai vai, thưa dần ra sau lưng */
  var foldAng = [-1.30, -0.92, -0.55, -0.19, 0.19, 0.55, 0.92, 1.30];
  for(i=0; i<foldAng.length; i++){
    var top = 1.47 - Math.abs(foldAng[i])*0.085;
    g.add(robeFold(foldAng[i], 0.405, top, 0.0138));
  }
  /* vài nếp NGẮN chỉ ở gấu — vải dồn lại chỗ chạm bệ */
  var hemAng = [-1.10, -0.74, -0.37, 0, 0.37, 0.74, 1.10];
  for(i=0; i<hemAng.length; i++){
    g.add(robeFold(hemAng[i] + 0.19, 0.42, 0.78, 0.0102));
  }
  /* gấu áo: gờ tròn khép đáy thân, cho chân đế đọc ra là VẢI đè lên ĐÁ */
  /* ⚠ ĐÃ BỎ cái torus gấu áo. Dù thu nhỏ tới mức chỉ nhô 0.004, nó vẫn là một
   * bề mặt cong đều bắt trọn đèn hướng thành MỘT ĐƯỜNG SÁNG LIÊN TỤC vòng
   * quanh thân — mắt đọc ngay ra "cái vòng đai treo lơ lửng", không đọc ra
   * "mép vải". Hồ sơ lathe đã loe sẵn ở gấu (0.418 ở y=0.372, thu về 0.398 ở
   * y=0.560), tự nó cho mép gấu rồi; thêm gờ là thừa.
   * Giữ biến hemM = thân, để nhóm silhouette bên dưới khỏi tham chiếu rỗng. */
  var hemM = body;

  /* --- ĐẦU tròn, KHÔNG TÓC, hơi cúi ------------------------------------ */
  var headG = stoneMottle(new THREE.SphereGeometry(0.285, 30, 24), 775, 0.055);
  var head = new THREE.Mesh(headG, stone);
  head.scale.set(0.97, 1.05, 0.98);
  head.position.set(0, 1.905, 0.012);
  head.rotation.x = 0.055;          // hơi CÚI = hiền, không nhìn thẳng vào người xem
  g.add(head);
  /* 肉髻: chỏm đầu tượng Phật (KHÔNG phải tóc). ⚠ Bản trước là quả cầu dẹt
   * scale 0.44 đặt CAO hơn mặt cầu đầu ⇒ ra một CÁI ĐĨA dán trên đỉnh, thấy
   * rõ đường cắt. Hạ xuống cho chìm vào đầu và bớt dẹt: chỏm phải liền khối. */
  /* ⚠ ĐÃ BỎ 肉髻 (bướu đỉnh đầu).
   * Hai quả cầu giao nhau thì chỗ giao luôn là một ĐƯỜNG CẮT sắc, không phải
   * chỗ chuyển mượt: đặt thấp thì vành dưới cắt ngang trán thành cái lõm hình
   * cung, đặt cao thì nó tách ra thành QUẢ TRỨNG ĐẶT TRÊN ĐẦU — đã thử cả hai
   * và soi trên crop cận cảnh. Muốn liền khối phải nắn vào chính hồ sơ của
   * đầu, mà đầu ở đây là SphereGeometry dùng chung.
   * Tượng 地蔵 ven đường phần lớn tạc đầu TRÒN TRƠN — đó mới là dáng người ta
   * quen mắt. Bỏ hẳn cho sạch, và cũng khớp viền với đầu 閻魔 tốt hơn.
   * Giữ biến ush = head để nhóm silhouette bên dưới khỏi tham chiếu rỗng. */
  var ush = head;
  /* cổ ngắn nối đầu với vai — bỏ thì đầu "lơ lửng" trên thân */
  var neck = new THREE.Mesh(new THREE.CylinderGeometry(0.128, 0.150, 0.14, 16), stoneP);
  neck.position.set(0, 1.688, 0.010); g.add(neck);
  /* tai dài — ÔM SÁT đầu. ⚠ Bán kính đầu là 0.285 nhưng scale.x 0.97 ⇒ mặt

  var mo = new THREE.Mesh(new THREE.TorusGeometry(0.086, 0.0058, 6, 20, 0.58), dark);

  /* --- TAY ÁO + BÀN TAY -------------------------------------------------

   *   ra là hai đoạn ống nhựa gắn ngoài thân. Tượng đá 地蔵 thật thì cánh tay

  function sleeve(sgn, sx, sy, sz, rotZ){

     *   LOE nằm ở DƯỚI (miệng tay áo), thót dần lên vai. */
    var sp = [
      [0.000, 0.000],[0.048, 0.004],[0.074, 0.018],[0.082, 0.052],
      [0.079, 0.112],[0.073, 0.180],[0.070, 0.250],[0.072, 0.320],

  }
  /* tay áo PHẢI: miệng tay áo ở y≈1.16, vai ở y≈1.62.
   * ⚠ Ở x=±0.30 với góc nghiêng 0.20 thì ống tay đứng TÁCH hẳn khỏi thân
   *   (bán kính thân chỗ ngực chỉ 0.31, mà tâm ống đã ở 0.30 + bán kính ống
   *   0.08) ⇒ hai cái ống trôi cạnh tượng. Kéo vào 0.252 cho ống CHÌM một
   *   phần vào thân, và giảm góc nghiêng. */
  g.add(sleeve(1, 0.252, 1.168, 0.108, -0.155));
  /* bàn tay phải NẮM cán 錫杖 — ống ngắn ôm cán, có gờ ngón vòng quanh */
  var handR = new THREE.Mesh(new THREE.CylinderGeometry(0.058, 0.053, 0.130, 14), stoneP);
  handR.position.set(0.397, 1.132, 0.163); handR.rotation.z = -0.06; g.add(handR);
  /* ba gờ đốt ngón vòng quanh cán — đủ đọc ra "bàn tay nắm", không có đầu
   * ống nào chĩa ra ngoài */
  for(i=0; i<3; i++){

    kn.rotation.x = Math.PI/2; kn.rotation.z = -0.06;

  /* --- 宝珠 tay TRÁI: ÔM trước ngực, không cầm hờ ra rìa khung ----------
   * ⚠ Bản trước để viên ngọc ở (-0.30, 1.16) với emissive 0x2A3230 và
   *   roughness 0.32 — trong cảnh HDR nó thành QUẢ CẦU TRẮNG lơ lửng ở đáy
   *   khung, và cùng chỗ với bàn tay phải của 閻魔, thành "hai quả cầu lạ".
   *   Đưa viên ngọc vào SÁT NGỰC (cao hơn, gần trục hơn), bỏ emissive, và
   *   dựng bàn tay ÔM lấy nó. */
  /* 宝珠 dựng bằng LATHE thành giọt HÀNH — chỏm nhọn LIỀN với bầu.
   * ⚠ Bản trước ghép cầu + nón chồng lên nhau: thấy rõ đường cắt ngang, đọc
   *   ra "củ tỏi". Một hồ sơ quay tròn duy nhất thì bầu và chỏm liền khối. */
  /* ⚠ Bán kính 0.108 cao 0.334 trên pho cao 2.2 ⇒ viên ngọc to bằng nửa cái
   * đầu, ra một GIỌT NƯỚC TRẮNG khổng lồ. 宝珠 thật chỉ bằng nắm tay. */
  var jp = [

    [0.018, 0.190],[0.007, 0.210],[0.000, 0.220]
  ];
  var jpts = [], jk;
  for(jk=0; jk<jp.length; jk++) jpts.push(new THREE.Vector2(jp[jk][0], jp[jk][1]));
  /* cùng chất đá với thân, chỉ nhẵn hơn chút — 宝珠 trên tượng đá ven đường
   * cũng là ĐÁ, không phải pha lê. Để sáng hơn thân là nó hút hết mắt. */
  var jewel = new THREE.Mesh(new THREE.LatheGeometry(jpts, 24),
    new THREE.MeshStandardMaterial({color:0x6C695F, roughness:0.82, metalness:0.02}));
  /* gốc lathe = ĐÁY viên ngọc; đặt đáy ngay trên lòng bàn tay (y=1.278) */
  jewel.position.set(-0.176, 1.292, 0.244); g.add(jewel);
  /* bàn tay trái NGỬA đỡ ngọc: lòng bàn tay lõm + gờ ngón khum quanh mép.
   * ⚠ Bản trước cắm 3 ống trụ làm ngón ⇒ ba cái que chĩa ra trước mặt tượng.
   *   Một vành TORUS cắt cung quanh mép lòng bàn tay đọc ra "ngón khum" mà
   *   không có đầu ống nào lộ ra. */
  /* lòng bàn tay: chỏm cầu DƯỚI (phi từ 0.44π tới π) úp ngược làm cái bát */
  var palmL = new THREE.Mesh(new THREE.SphereGeometry(0.076, 16, 12,
    0, Math.PI*2, Math.PI*0.46, Math.PI*0.54), stoneP);
  palmL.scale.set(1.10, 0.62, 1.04);
  palmL.position.set(-0.176, 1.298, 0.244); g.add(palmL);
  /* gờ ngón khum quanh mép bát — cung torus, KHÔNG phải mấy ống trụ chĩa ra */
  var fingers = new THREE.Mesh(new THREE.TorusGeometry(0.071, 0.0122, 7, 20, 2.20), stoneP);
  fingers.position.set(-0.176, 1.292, 0.244);
  fingers.rotation.set(Math.PI*0.5 - 0.24, 0, 0);
  g.add(fingers);
  /* tay áo TRÁI gập vào trong, cùng kiểu ống tay áo với bên phải */
  g.add(sleeve(-1, -0.246, 1.272, 0.106, 0.185));

  /* ══ 前掛け ĐỎ — TẤM VẢI CÓ NẾP, không phải hình chữ nhật đỏ phẳng ═════
   * Đây là chi tiết người Nhật nhận ra ngay: yếm đỏ = có người ra buộc cho.
   * Dựng bằng lưới tham số (u vòng quanh ngực, v từ cổ xuống gấu):
   *  - mặt cắt ngang là CUNG ôm theo bán kính thân (không phẳng, không dán),
   *  - hình dáng: THÓT ở cổ → rộng nhất ở ngực → hơi thu ở gấu, BO TRÒN hai
   *    góc dưới (yếm thật cắt tròn, không vuông góc),
   *  - nếp vải: gợn dọc cos(u·n) sâu dần xuống dưới + nhăn nhỏ theo seed,
   *  - mép dưới VÉNH nhẹ ra ngoài — vải phơi mưa nắng thì cứng, không dính sát,
   *  - viền gấu khâu tay chạy theo mép dưới, màu sẫm hơn thân yếm.
   *
   * MÀU: 0x7E332D. Đỏ ĐÃ BẠC vì mưa nắng, KHÔNG đỏ tươi.
   * ⚠ Cảnh vẽ HDR tuyến tính rồi mới ACES ở pass cuối, ngưỡng bloom 1.0.
   *   Bản trước dùng 0xA84C44 cộng vertex-color tới 1.3 ⇒ luminance vọt lên
   *   và tấm yếm ra HỒNG CHÓI chiếm hết ngực, hút mắt khỏi khuôn mặt. Hạ nền
   *   màu và kẹp biên độ vertex-color trong khoảng 0.80–1.06.
   * KÍCH THƯỚC: yếm thật chỉ che NGỰC, không phải cái tạp dề dài tới gối.
   *   Rút bibBot 1.038 → 1.168 và thu góc ôm lại cho gọn. */
  var bibTop = 1.556, bibBot = 1.120;
  var NU = 30, NV = 22;
  var bg = new THREE.BufferGeometry();
  var vp = new Float32Array((NU+1)*(NV+1)*3);
  var vc = new Float32Array((NU+1)*(NV+1)*3);
  var idx = [];
  var bibPr = HFA.mulberry32(4471);
  var jitter = [];
  for(i=0; i<(NU+1)*(NV+1); i++) jitter.push(bibPr()-0.5);
  var uu, vv;
  for(vv=0; vv<=NV; vv++){
    var fv = vv/NV;                       // 0 ở cổ, 1 ở gấu
    var yy = bibTop + (bibBot - bibTop)*fv;
    /* nửa góc ôm quanh thân: hẹp ở cổ (0.42), rộng nhất quanh ngực (~0.92) */
    /* ⚠ sin(π·f^0.58) đạt đỉnh ở giữa rồi TỤT về 0 ở gấu ⇒ tấm yếm ra hình
     * GIỌT NƯỚC / quả bóng, không phải cái yếm. Yếm thật là hình thang bo góc:
     * rộng dần từ cổ xuống, giữ gần như nguyên bề rộng ở gấu, chỉ BO hai góc.
     * Dùng hàm tăng đơn điệu rồi mới bo góc riêng. */
    var half = 0.32 + 0.56*Math.pow(fv, 0.52);
    /* bo TRÒN hai góc dưới: 16% cuối thu góc theo cung tròn */
    if(fv > 0.84){
      var fc = (fv - 0.84)/0.16;
      half *= Math.sqrt(Math.max(0, 1 - fc*fc*0.72));
    }
    var rb = bodyR(yy) + 0.022 + 0.030*Math.pow(fv, 2.2);   // gấu vénh ra
    for(uu=0; uu<=NU; uu++){
      var fu = uu/NU*2 - 1;                      // -1..1 quanh trục trước ngực
      var ang2 = fu*half;
      /* NẾP VẢI: gợn dọc, sâu dần khi xuống gấu (trên cùng bị dây buộc kéo căng) */
      var wave = Math.cos(fu*Math.PI*2.6)*0.0140 + Math.cos(fu*Math.PI*5.8)*0.0058;
      var r2 = rb + wave*(0.22 + 1.05*fv);
      r2 += jitter[vv*(NU+1)+uu]*0.0038;         // nhăn nhỏ, tất định theo seed
      /* gấu VÕNG xuống ở giữa: vải nặng hơn ở chỗ không có gì đỡ */
      var yb = yy - (1 - Math.abs(fu))*0.014*fv*fv;   // gấu võng RẤT khẽ
      var o = (vv*(NU+1)+uu)*3;
      vp[o]   = Math.sin(ang2)*r2;
      vp[o+1] = yb;
      vp[o+2] = Math.cos(ang2)*r2;
      /* bạc màu KHÔNG ĐỀU — nhạt dần xuống gấu và ra hai mép (mưa nắng ăn
       * nhiều nhất ở đó). Biên độ kẹp hẹp để không vượt ngưỡng bloom. */
      var fade = 0.92 + 0.10*fv + 0.045*Math.abs(fu) + jitter[vv*(NU+1)+uu]*0.070;
      var sh   = 1.0 - 0.16*fu*fu;               // hai mép quay đi, tối hơn
      var kk   = clamp(fade*sh, 0.74, 1.00);   // trần 1.0: không đẩy quá nền màu
      vc[o] = kk; vc[o+1] = kk*(1 - 0.045*fv); vc[o+2] = kk*(1 - 0.030*fv);
    }
  }
  for(vv=0; vv<NV; vv++) for(uu=0; uu<NU; uu++){
    var A = vv*(NU+1)+uu, B = A+1, C = A+(NU+1), D = C+1;
    idx.push(A,C,B, B,C,D);
  }
  bg.setAttribute('position', new THREE.BufferAttribute(vp,3));
  bg.setAttribute('color', new THREE.BufferAttribute(vc,3));
  bg.setIndex(idx); bg.computeVertexNormals();
  /* 0x9E4A42 — đỏ ĐÃ BẠC vì mưa nắng (khoảng anh chốt: 0x9E4A42–0xB5564C).
   * ⚠ Đừng hạ sẫm hơn nữa để "an toàn bloom": yếm đỏ là chi tiết người Nhật
   *   nhận ra NGAY, mà lời đọc ở đúng mốc này đang nói 「前掛けをかけてもらって
   *   いる」 — yếm không đọc ra màu thì câu đó mất hình. Chỗ chống cháy nằm ở
   *   biên độ vertex-color (kẹp ≤1.0 bên dưới), không phải ở nền màu. */
  /* ⚠ MÀU RA HỒNG chứ không ra đỏ — đã đo trên frame 1166 bản trước.
   * Ba thứ cộng lại: (a) cảnh vẽ HDR tuyến tính, (b) scene.environment (PMREM)
   * nên MeshStandard nhận thêm ánh sáng môi trường khắp bề mặt, (c) ACES ở pass
   * cuối kéo vùng sáng về phía trắng. Kết quả: 0x9E4A42 nở thành hồng phấn.
   * ĐO THẬT trên frame 1162: nền 0x8A3A33 (138,58,51) render ra (156,107,101)
   * — kênh đỏ đúng, nhưng lục/lam bị cộng thêm ~49/50 bởi AmbientLight 0x1E222A

   * một không gian, đúng cùng chất liệu với 第3章. */

    mistSpread:80, mistH:14, mistY:-3.6, y:-1.6, dl:0.40, amb:0.40, mistFade:5.0});
})();

/* --- SÔNG CHUNG (S46) ---------------------------------------------------
 * ⚠⚠ LUẬT CỨNG: KHÔNG BAO GIỜ cho thấy BỜ BÊN KIA. Sương ở nửa trên khung
 *   giữ NGUYÊN độ dày, không loãng đi một chút nào. Không hứa điều mình không biết.
 */
var FARRIVER = mkGroup('FARRIVER');
var farSurf, farDots = [], farRings = [], farMistFar;
(function(){
  farSurf = new THREE.Mesh(new THREE.PlaneGeometry(600, 300, 64, 32),
    new THREE.MeshStandardMaterial({color:0x27333C, roughness:0.18, metalness:0.30,
      normalMap:riverNormal, normalScale:new THREE.Vector2(0.45,0.45)}));
  farSurf.rotation.x = -Math.PI/2;
  farSurf.rotation.z = 0.46;             // sông chạy CHÉO từ dưới-trái lên trên-phải
  farSurf.position.set(0, 0, -90);
  FARRIVER.add(farSurf);
  /* BA đốm sáng nhỏ rải rác dọc hai bờ, khoảng cách RẤT XA nhau.
   * KHÔNG nhãn tên nước, KHÔNG bản đồ, KHÔNG cờ. */
  var P = [[-92, -46], [58, -124], [-24, -196]], i;
  for(i=0; i<3; i++){
    var d = glow(0xD6C49A, 3.4, 0);
    d.position.set(P[i][0], 1.6, P[i][1]);
    FARRIVER.add(d); farDots.push(d);
    /* vòng sóng lan trên mặt nước, ba vòng GẶP NHAU ở giữa sông */
    var r = new THREE.Mesh(new THREE.RingGeometry(1.0, 1.4, 64), flatMat(0xA8C0D4, 0));
    r.rotation.x = -Math.PI/2; r.position.set(P[i][0], 0.20, P[i][1]);
    FARRIVER.add(r); farRings.push(r);
  }
  /* SƯƠNG DÀY ở NỬA TRÊN — che bờ bên kia vĩnh viễn */
  farMistFar = makeMist(3200, 640, 60, 1313, 0x64798E, 14.0, 0.17);
  farMistFar.position.set(0, 20, -300);
  FARRIVER.add(farMistFar);
  var near = makeMist(1400, 420, 18, 4747, 0x5A7084, 8.0, 0.10);
  near.position.set(0, 3, -110);
  FARRIVER.add(near); FARRIVER.userData.near = near;
  var dl = new THREE.DirectionalLight(0x8EA4BA, 0.62); dl.position.set(-6, 10, 8); FARRIVER.add(dl);
  FARRIVER.add(new THREE.AmbientLight(0x1A222C, 0.66));
})();
/* --- S07: trang sách nở thành không gian (chuyển 第1章 → 第2章) ----------
 * Nét mực TÁCH khỏi mặt giấy và trở thành không gian ba chiều.
 * Màu chuyển PAPER_SEPIA → MIST_BLUE.
 */
var MORPH = mkGroup('MORPH');
var morphPaper, morphStrokes = [], morphRoad, morphMist, morphFar;
(function(){
  morphPaper = new THREE.Mesh(new THREE.PlaneGeometry(26, 18),
    new THREE.MeshStandardMaterial({color:0x8A7A5E, roughness:0.98}));
  morphPaper.position.set(0, 0, -6);
  MORPH.add(morphPaper);
  /* thớ giấy phóng to thành ĐỊA HÌNH (sợi giấy → sương) */
  var fibres = makeMist(2000, 30, 10, 8282, 0xB6A386, 4.0, 0.16, 1.2);
  fibres.position.set(0, 0, -4);
  MORPH.add(fibres); MORPH.userData.fibres = fibres;
  /* các NÉT MỰC nâng khỏi mặt phẳng, có ĐỘ SÂU: bảy cổng của hình mộc bản */
  var i;
  for(i=0; i<7; i++){
    var u = i/6;
    var g = new THREE.Group();
    var wood = flatMat(0x2A2216, 0.88);
    var hh = 2.4 - u*1.6, ww = 2.0 - u*1.35, th = 0.10;
    var c1 = new THREE.Mesh(new THREE.PlaneGeometry(th, hh), wood);
    c1.position.set(-ww/2, hh/2, 0); g.add(c1);
    var c2 = new THREE.Mesh(new THREE.PlaneGeometry(th, hh), wood);
    c2.position.set(ww/2, hh/2, 0); g.add(c2);
    var bm = new THREE.Mesh(new THREE.PlaneGeometry(ww + th*3, th), wood);
    bm.position.set(0, hh, 0); g.add(bm);
    g.userData.flatZ = -5.9;
    g.userData.deepZ = -8 - i*13;
    g.userData.flatX = -1.6 + u*3.2;
    g.userData.flatY = -3.0 + u*5.0;
    MORPH.add(g); morphStrokes.push(g);
  }
  /* con đường mờ chạy về phía xa */
  morphRoad = new THREE.Mesh(new THREE.PlaneGeometry(7.0, 200),
    new THREE.MeshStandardMaterial({color:0x3A3D42, roughness:0.98, transparent:true, opacity:0}));
  morphRoad.rotation.x = -Math.PI/2; morphRoad.position.set(0, -1.6, -90);
  MORPH.add(morphRoad);
  morphMist = makeMist(1800, 120, 24, 9393, 0x5E7286, 6.0, 0.0);
  morphMist.position.set(0, 2, -70);
  MORPH.add(morphMist);
  morphFar = glow(0xAFC6DC, 16, 0); morphFar.position.set(1.8, 2.2, -140);
  MORPH.add(morphFar);
  /* Anh sang cua canh chuyen: GIU TOI. Lan render dau de 1.00 lam ca khung
   * trang bech, bay cai cong doc ra nhu gian giao trang thay vi net muc tren giay. */
  var dl = new THREE.DirectionalLight(0xC6B79A, 0.52); dl.position.set(-2, 5, 8); MORPH.add(dl);
  MORPH.userData.key = dl;
  MORPH.add(new THREE.AmbientLight(0x1A1814, 0.55));
  MORPH.userData.amb = MORPH.children[MORPH.children.length-1];
})();

{t:133.22,s:"その夜、"},

{t:145.31,s:"この四十九日という数字には、"},

{t:163.55,s:"今日は、"},
{t:164.38,s:"その道を最初から一緒に"},

{t:173.30,s:"仏教の考え方では、人の一生は、"},

{t:193.31,s:"この考え方では、"},

{t:212.06,s:"その、"},

{t:218.21,s:"中有、あるいは中陰といいます。"},
{t:222.21,s:"中くらいの中に、有る無しの有。"},
