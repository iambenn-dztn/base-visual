// ---- seeded PRNG (mulberry32) ----
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// ---- scene boundaries (real time = cue.start) ----
const SC={
  A:[0,26.87], B:[26.87,75.81], C:[75.81,121.5], D:[121.5,152.8],
  E:[152.8,232.28], F:[232.28,305.04], G:[305.04,340.98], H:[340.98,378.19],
  I:[378.19,398.14], J:[398.14,435.54], K:[435.54,492.03], L:[492.03,588.26],
  M:[588.26,617.73], N:[617.73,650.76], O:[650.76,691.06], P:[691.06,792.3]
};
function loc(t,k){const w=SC[k];return Math.min(1,Math.max(0,(t-w[0])/(w[1]-w[0])));}
function inSc(t,k){const w=SC[k];return t>=w[0]&&t<w[1];}
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=(x)=>{x=clamp(x,0,1);return x*x*(3-2*x);};
function band(t,a,b,f){f=f||0.8;if(t<a-f||t>b+f)return 0;let up=smooth((t-(a-f))/(2*f));let dn=smooth(((b+f)-t)/(2*f));return Math.min(1,Math.min(up,dn));}
// heartbeat pulse (deterministic) — ~1 beat / 0.92s
function heart(t){const ph=(t/0.92)%1;const a=Math.exp(-ph*ph*40)*1.0+Math.exp(-(ph-0.16)*(ph-0.16)*30)*0.55;return Math.min(1,a);}

  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
   varying vec2 vUv;uniform sampler2D tDiffuse;uniform float uT,uVig,uCA,uGrain,uFade,uFlash;
   float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
   void main(){
     vec2 d=vUv-0.5;float r=dot(d,d);
     vec2 off=d*uCA*(1.0+r*2.2);
     vec3 col;
     col.r=texture2D(tDiffuse,vUv+off).r;
     col.g=texture2D(tDiffuse,vUv).g;
     col.b=texture2D(tDiffuse,vUv-off).b;
     float vig=smoothstep(1.02,uVig,r*2.0);
     col*=mix(1.0,vig,0.85);
     float g=h(vUv*vec2(1920.0,1080.0)+fract(uT)*97.3)-0.5;
     col+=g*uGrain;
     col=mix(col,vec3(0.95,0.98,1.0),uFlash);
     col*=uFade;
     gl_FragColor=vec4(col,1.0);
   }`
};

//  SHARED: starfield (temperature-colored) + Milky Way band
// ============================================================
const STAR_R=14000;
function buildStars(){
  const N=5200,pr=mulberry32(20260808);
  const pos=new Float32Array(N*3),col=new Float32Array(N*3),siz=new Float32Array(N);
  const tmp=new THREE.Vector3();
  for(let i=0;i<N;i++){
    let u=pr(),v=pr();
    let theta=Math.acos(2*u-1),phi=2*Math.PI*v;
    let bnd=pr();if(bnd<0.42){theta=Math.PI*0.5+(pr()-0.5)*0.5;}
    tmp.set(Math.sin(theta)*Math.cos(phi),Math.cos(theta)*0.7,Math.sin(theta)*Math.sin(phi)).normalize().multiplyScalar(STAR_R);
    pos[i*3]=tmp.x;pos[i*3+1]=tmp.y;pos[i*3+2]=tmp.z;
    let tt=pr();let c=new THREE.Color();
    if(tt<0.12)c.setRGB(0.62,0.72,1.0);
    else if(tt<0.34)c.setRGB(0.9,0.94,1.0);
    else if(tt<0.66)c.setRGB(1.0,0.96,0.82);
    else if(tt<0.86)c.setRGB(1.0,0.82,0.56);
    else c.setRGB(1.0,0.62,0.44);
    let br=0.4+pr()*0.6;c.multiplyScalar(br);
    col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
    siz[i]=(pr()<0.06?3.4:1.0)*(0.9+pr()*1.7);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  g.setAttribute('aS',new THREE.BufferAttribute(siz,1));
  const m=new THREE.ShaderMaterial({
    uniforms:{uOp:{value:1}},transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    vertexShader:`attribute float aS;attribute vec3 color;varying vec3 vC;
      void main(){vC=color;vec4 mv=modelViewMatrix*vec4(position,1.0);
      gl_PointSize=aS*(${STAR_R.toFixed(1)}/-mv.z);gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`varying vec3 vC;uniform float uOp;
      void main(){vec2 d=gl_PointCoord-0.5;float r=length(d);
      float a=smoothstep(0.5,0.0,r);gl_FragColor=vec4(vC,a*uOp);}`
  });
  return new THREE.Points(g,m);
}

// ============================================================
//  Photosphere star (shader) — reusable, deterministic by uT
// ============================================================
function makeStar(radius,c1,c2,c3){
  const grp=new THREE.Group();
  const photoMat=new THREE.ShaderMaterial({
    uniforms:{uT:{value:0},uCol1:{value:new THREE.Color(c1||0x8a2400)},uCol2:{value:new THREE.Color(c2||0xff9628)},uCol3:{value:new THREE.Color(c3||0xffeeb8)},uBright:{value:1.4}},
    vertexShader:`varying vec3 vP;varying vec3 vN;void main(){vP=normalize(position);vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`
      varying vec3 vP;varying vec3 vN;uniform float uT,uBright;uniform vec3 uCol1,uCol2,uCol3;
      vec3 hash3(vec3 p){p=vec3(dot(p,vec3(127.1,311.7,74.7)),dot(p,vec3(269.5,183.3,246.1)),dot(p,vec3(113.5,271.9,124.6)));return -1.0+2.0*fract(sin(p)*43758.5453);}
      float snoise(vec3 p){vec3 i=floor(p);vec3 f=fract(p);vec3 u=f*f*(3.0-2.0*f);
        return mix(mix(mix(dot(hash3(i+vec3(0,0,0)),f-vec3(0,0,0)),dot(hash3(i+vec3(1,0,0)),f-vec3(1,0,0)),u.x),
                       mix(dot(hash3(i+vec3(0,1,0)),f-vec3(0,1,0)),dot(hash3(i+vec3(1,1,0)),f-vec3(1,1,0)),u.x),u.y),
                   mix(mix(dot(hash3(i+vec3(0,0,1)),f-vec3(0,0,1)),dot(hash3(i+vec3(1,0,1)),f-vec3(1,0,1)),u.x),
                       mix(dot(hash3(i+vec3(0,1,1)),f-vec3(0,1,1)),dot(hash3(i+vec3(1,1,1)),f-vec3(1,1,1)),u.x),u.y),u.z);}
      float fbm(vec3 p){float s=0.0,a=0.5;for(int i=0;i<5;i++){s+=a*snoise(p);p*=2.02;a*=0.5;}return s;}
      void main(){
        vec3 d=normalize(vP);
        float conv=fbm(d*7.0+vec3(0.0,0.0,uT*0.02));
        float fine=fbm(d*22.0+vec3(uT*0.05));
        float n=0.6*conv+0.4*fine;
        float spot=smoothstep(0.56,0.78,fbm(d*1.7+11.0));
        vec3 col=mix(uCol1,uCol2,smoothstep(-0.3,0.4,n));
        col=mix(col,uCol3,smoothstep(0.35,0.85,n));
        col*=mix(1.0,0.35,spot);
        float mu=clamp(dot(normalize(vN),vec3(0.0,0.0,1.0)),0.0,1.0);
        col*=0.30+0.70*pow(mu,0.6);
        gl_FragColor=vec4(col*uBright,1.0);
      }`});
  const core=new THREE.Mesh(new THREE.SphereGeometry(radius,64,64),photoMat);grp.add(core);
  const chromo=new THREE.Mesh(new THREE.SphereGeometry(radius*1.028,48,48),new THREE.ShaderMaterial({
    transparent:true,depthWrite:false,side:THREE.BackSide,blending:THREE.AdditiveBlending,
    uniforms:{uCr:{value:new THREE.Color(c2||0xff6a28)}},
    vertexShader:`varying vec3 vN;varying vec3 vP;void main(){vN=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.0);vP=mv.xyz;gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`varying vec3 vN;varying vec3 vP;uniform vec3 uCr;void main(){float f=pow(1.0-abs(dot(normalize(vN),normalize(-vP))),3.2);gl_FragColor=vec4(uCr*f,f);}`}));
  grp.add(chromo);
  const cpr=mulberry32(99);
  function coronaTex(cr,cg,cb){
    const cv=document.createElement('canvas');cv.width=cv.height=512;const cx=cv.getContext('2d');
    const gr=cx.createRadialGradient(256,256,20,256,256,256);
    gr.addColorStop(0,`rgba(${cr},${cg},${cb},0.9)`);gr.addColorStop(0.25,`rgba(${cr},${Math.round(cg*0.6)},${Math.round(cb*0.4)},0.35)`);gr.addColorStop(1,'rgba(0,0,0,0)');
    cx.fillStyle=gr;cx.fillRect(0,0,512,512);
    cx.globalCompositeOperation='lighter';
    for(let i=0;i<26;i++){const a=cpr()*6.283,len=140+cpr()*130;cx.save();cx.translate(256,256);cx.rotate(a);
      const lg=cx.createLinearGradient(0,0,len,0);lg.addColorStop(0,`rgba(${cr},${Math.round(cg*0.75)},${Math.round(cb*0.5)},0.5)`);lg.addColorStop(1,'rgba(0,0,0,0)');
      cx.fillStyle=lg;cx.beginPath();cx.moveTo(30,-6);cx.lineTo(len,0);cx.lineTo(30,6);cx.closePath();cx.fill();cx.restore();}
    const tx=new THREE.CanvasTexture(cv);tx.encoding=THREE.sRGBEncoding;return tx;
  }
  const cor=new THREE.Sprite(new THREE.SpriteMaterial({map:coronaTex(255,176,96),color:0xffb060,transparent:true,opacity:0.85,depthWrite:false,blending:THREE.AdditiveBlending}));
  cor.scale.setScalar(radius*5.5);grp.add(cor);
  return {grp,core,photoMat,chromo,cor,radius};
}

// blood vessel builder (tube of red cells + oxy + iron sparks)
function bloodDots(count,seed,spanZ,rMax,tex,color,size,op){
  const pr=mulberry32(seed);const N=count;
  const pos=new Float32Array(N*3),base=new Float32Array(N*4);
  for(let i=0;i<N;i++){const z=(pr()-0.5)*spanZ,a=pr()*6.283,rr=(0.3+pr()*0.7)*rMax;
    base[i*4]=z;base[i*4+1]=a;base[i*4+2]=rr;base[i*4+3]=0.3+pr()*0.6;
    pos[i*3]=Math.cos(a)*rr;pos[i*3+1]=Math.sin(a)*rr;pos[i*3+2]=z;}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const pts=new THREE.Points(g,new THREE.PointsMaterial({map:tex,size:size,transparent:true,depthWrite:false,blending:THREE.NormalBlending,color:color,opacity:op}));
  return {pts,base,N,spanZ};
}

    setCam(Math.sin(t*0.04)*2,0.3,13-smooth(clamp((t-588)/29,0,1))*3,0,0,0,48);
  }

  // ---------------- N: geodynamo / magnetosphere ----------------
  if(gN.visible){
    const d=gN.userData;
    d.grp.rotation.y=t*0.05;
    d.inner.rotation.y=t*0.3;
    d.outer.material.opacity=0.5*(0.75+0.25*Math.sin(t*0.8));
    const fieldOn=smooth(clamp((t-636)/4,0,1));d.field.visible=fieldOn>0.05;
    d.loops.forEach((l,i)=>l.material.opacity=0.55*fieldOn*(0.7+0.3*Math.sin(t*0.6+i)));
    d.lblIn.material.opacity=0.85*smooth(clamp((t-620)/2,0,1))*smooth(clamp((636-t)/2,0,1));
    d.lblOut.material.opacity=0.85*smooth(clamp((t-625)/2,0,1))*smooth(clamp((636-t)/2,0,1));
    d.lblMag.material.opacity=0.9*smooth(clamp((t-645)/2,0,1));
    if(t<636)setCam(Math.sin(t*0.05)*2,0.3,11-smooth(clamp((t-617)/18,0,1))*2,0,0,0,46);
    else setCam(Math.sin(t*0.04)*2.5,0.8,12+smooth(clamp((t-636)/14,0,1))*2,0,0,0,50);
  }

  // ---------------- O: solar wind shield + aurora ----------------
  if(gO.visible){
    const d=gO.userData;
    d.earth.rotation.y=t*0.06;d.cloud.rotation.y=t*0.075;
    d.mag.material.opacity=1;
    const arr=d.wind.geometry.attributes.position.array;
    for(let i=0;i<d.N;i++){const y0=d.base[i*4+1],ph=d.base[i*4+3],sp=d.base[i*4+2];
      const life=((t*(0.4+sp*0.5)+ph)%1);
      let x=9-life*18;
      const bend=Math.exp(-x*x*0.12);const yb=y0+Math.sign(y0||1)*bend*2.2;
      arr[i*3]=x;arr[i*3+1]=yb;arr[i*3+2]=d.base[i*4+1]*0.3;}
    d.wind.geometry.attributes.position.needsUpdate=true;
    d.wind.material.opacity=0.8*smooth(clamp((t-651)/2,0,1));
    const aurOn=smooth(clamp((t-669)/3,0,1))*(0.6+0.4*Math.sin(t*1.5));
    d.aurN.material.opacity=0.8*aurOn;d.aurS.material.opacity=0.8*aurOn;
    d.aurN.scale.setScalar(1+0.15*Math.sin(t*2));d.aurS.scale.setScalar(1+0.15*Math.cos(t*2));
    d.lblWind.material.opacity=0.85*smooth(clamp((t-653)/2,0,1))*smooth(clamp((668-t)/2,0,1));
    d.lblAur.material.opacity=0.85*smooth(clamp((t-670)/2,0,1));
    setCam(4-smooth(clamp((t-650.76)/40,0,1))*3,0.5,11,0,0,0,48);
  }

  // ---------------- P: closing ----------------
  if(gP.visible){
    const d=gP.userData;const hb=heart(t);
    const cmpOn=smooth(clamp((t-691)/2,0,1))*smooth(clamp((707-t)/2,0,1));
    d.feDeath.visible=cmpOn>0.02;d.feDeath.rotation.y=t*0.15;
    d.deathFire.visible=cmpOn>0.02;d.deathFire.material.opacity=0.35*cmpOn*(0.8+0.2*Math.sin(t*0.7));
    d.earthLife.visible=cmpOn>0.02;d.earthLife.rotation.y=t*0.08;
    d.lifeMag.visible=cmpOn>0.02;d.lifeMag.material.opacity=0.3*cmpOn;
    d.lblSame.material.opacity=0.9*smooth(clamp((t-694)/2,0,1))*smooth(clamp((707-t)/2,0,1));
    const chestOn=smooth(clamp((t-707.61)/2,0,1));
    d.glow.material.opacity=(0.25+0.55*hb)*chestOn;d.glow.scale.setScalar(8+hb*2.2);
    const hemoOn=smooth(clamp((t-718)/3,0,1))*smooth(clamp((740-t)/3,0,1));
    d.hemo.visible=hemoOn>0.05;d.hemo.rotation.y=t*0.15;d.hemo.scale.setScalar(0.6+hemoOn*0.5);
    const cyc=(Math.sin(t*0.5)*0.5+0.5);
    d.ox.material.emissiveIntensity=1.0+0.5*cyc;
    const arr=d.link.geometry.attributes.position.array;
    for(let i=0;i<d.N;i++){const x0=d.base[i*4],y0=d.base[i*4+1],z0=d.base[i*4+2],ph=d.base[i*4+3];
      arr[i*3]=x0+Math.sin(t*0.1+ph)*0.5;arr[i*3+1]=y0+Math.cos(t*0.08+ph)*0.4;arr[i*3+2]=z0+Math.sin(t*0.07+ph)*0.4;}
    d.link.geometry.attributes.position.needsUpdate=true;
    d.link.material.opacity=0.5*smooth(clamp((t-724)/3,0,1));
    d.novaFar.material.opacity=0.5*smooth(clamp((t-724)/3,0,1))*(0.7+0.3*Math.sin(t*0.5));
    if(t<707.61)setCam(0,0,16,0,0,0,48);
    else if(t<769)setCam(Math.sin(t*0.04)*2,Math.sin(t*0.03)*1,10-smooth(clamp((t-707.61)/40,0,1))*2,0,0,0,46);
    else setCam(Math.sin(t*0.04)*2,1.0,10+smooth(clamp((t-769)/20,0,1))*3,0,0,0,48);
  }
  }catch(err){var ed=document.getElementById('err');if(ed){ed.style.display='block';ed.textContent='SCENE ERR @t='+t.toFixed(1)+': '+(err&&err.message||err);}}

  // ---------------- global fades ----------------
  let fade=1.0;
  fade*=smooth(clamp(t/3.5,0,1));
  fade*=smooth(clamp((TOTAL-t)/4.5,0,1));

  lens.uniforms.uT.value=t;
  lens.uniforms.uFade.value=fade;
  lens.uniforms.uFlash.value=flash;
  const fiery=inSc(t,'D')||inSc(t,'E')||inSc(t,'G')||inSc(t,'I')||inSc(t,'K')||(inSc(t,'M')&&t<610);
  bloom.strength=fiery?1.15:(fieryScene?1.2:0.85);

  updateText(t);
  composer.render();
}

// subtitle / chapter lookup
let _lastSub=-1,_lastChap='';
function updateText(t){
  let idx=0;for(let i=0;i<CUES.length;i++){if(CUES[i].t<=t+1e-6)idx=i;else break;}
  const cur=CUES[idx];
  if(idx!==_lastSub){document.getElementById('sub').textContent=cur?cur.s:'';_lastSub=idx;}
  let chT=-1,chS='';for(const c of CUES){if(c.ch&&c.t<=t){chT=c.t;chS=c.ch;}}
  const chapEl=document.getElementById('chap');
  if(chS!==_lastChap){chapEl.textContent=chS;_lastChap=chS;}
  const op=chT>=0?smooth(clamp((t-chT)/0.8,0,1))*smooth(clamp((chT+4.5-t)/1.2,0,1)):0;
  chapEl.style.opacity=op;
  document.getElementById('sub').style.opacity=1;
}

// ============================================================
//  GSAP timeline (paused) — deterministic driver
// ============================================================
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});
const clk={t:0};
tl.to(clk,{t:TOTAL,duration:TOTAL,ease:"none",onUpdate:()=>renderAtTime(clk.t)},0);
window.__timelines["nguyen-to-sat"]=tl;

// initial render
renderAtTime(0);
</script>
