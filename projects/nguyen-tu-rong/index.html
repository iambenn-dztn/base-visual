// ---- seeded PRNG (mulberry32) ----
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// ---- scene boundaries (real time = cue.start) ----
const SC={
  A:[0,39.77], B:[39.77,95.27], C:[95.27,138.97], D:[138.97,206.87],
  E:[206.87,298.89], F:[298.89,323.21], G:[323.21,414.99], H:[414.99,479.22],
  I:[479.22,556.19], J:[556.19,641.07], K:[641.07,745.49]
};
function loc(t,k){const w=SC[k];return Math.min(1,Math.max(0,(t-w[0])/(w[1]-w[0])));}
function inSc(t,k){const w=SC[k];return t>=w[0]&&t<w[1];}
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=(x)=>{x=clamp(x,0,1);return x*x*(3-2*x);};
function band(t,a,b,f){f=f||0.8;if(t<a-f||t>b+f)return 0;let up=smooth((t-(a-f))/(2*f));let dn=smooth(((b+f)-t)/(2*f));return Math.min(1,Math.min(up,dn));}

  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
   varying vec2 vUv;uniform sampler2D tDiffuse;uniform float uT,uVig,uCA,uGrain,uFade,uFlash;
   float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
   void main(){
     vec2 d=vUv-0.5;float r=dot(d,d);
     vec2 off=d*uCA*(1.0+r*2.2);
     vec3 col;
     col.r=texture2D(tDiffuse,vUv+off).r;
     col.g=texture2D(tDiffuse,vUv).g;
     col.b=texture2D(tDiffuse,vUv-off).b;
     float vig=smoothstep(1.02,uVig,r*2.0);
     col*=mix(1.0,vig,0.85);
     float g=h(vUv*vec2(1920.0,1080.0)+fract(uT)*97.3)-0.5;
     col+=g*uGrain;
     col=mix(col,vec3(1.0,0.98,0.94),uFlash);
     col*=uFade;
     gl_FragColor=vec4(col,1.0);
   }`
};

function dotTex(rr,gg,bb){
  const cv=document.createElement('canvas');cv.width=cv.height=64;const cx=cv.getContext('2d');
  const gr=cx.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,`rgba(${rr},${gg},${bb},1)`);gr.addColorStop(0.4,`rgba(${rr},${gg},${bb},0.55)`);gr.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=gr;cx.fillRect(0,0,64,64);const tx=new THREE.CanvasTexture(cv);tx.encoding=THREE.sRGBEncoding;return tx;
}

function softDisc(inner,outer,r,g,b){
  const cv=document.createElement('canvas');cv.width=cv.height=256;const cx=cv.getContext('2d');
  const gr=cx.createRadialGradient(128,128,inner,128,128,outer);
  gr.addColorStop(0,`rgba(${r},${g},${b},0.9)`);gr.addColorStop(0.5,`rgba(${r},${g},${b},0.28)`);gr.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=gr;cx.fillRect(0,0,256,256);

}

// ============================================================
//  starfield (dim, temperature-colored) — background depth
//  STAR_R must exceed max camera distance across timeline (cameras stay <120)
// ============================================================
const STAR_R=9000;
function buildStars(){
  const N=3600,pr=mulberry32(20260808);
  const pos=new Float32Array(N*3),col=new Float32Array(N*3),siz=new Float32Array(N);
  const tmp=new THREE.Vector3();
  for(let i=0;i<N;i++){
    let u=pr(),v=pr();
    let theta=Math.acos(2*u-1),phi=2*Math.PI*v;
    tmp.set(Math.sin(theta)*Math.cos(phi),Math.cos(theta)*0.8,Math.sin(theta)*Math.sin(phi)).normalize().multiplyScalar(STAR_R);
    pos[i*3]=tmp.x;pos[i*3+1]=tmp.y;pos[i*3+2]=tmp.z;
    let tt=pr();let c=new THREE.Color();
    if(tt<0.14)c.setRGB(0.6,0.72,1.0);
    else if(tt<0.5)c.setRGB(0.85,0.9,1.0);
    else if(tt<0.8)c.setRGB(0.9,0.92,1.0);
    else c.setRGB(0.8,0.82,0.95);
    let br=0.3+pr()*0.5;c.multiplyScalar(br);
    col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
    siz[i]=(pr()<0.05?2.6:1.0)*(0.8+pr()*1.4);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  g.setAttribute('aS',new THREE.BufferAttribute(siz,1));
  const m=new THREE.ShaderMaterial({
    uniforms:{uOp:{value:1}},transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    vertexShader:`attribute float aS;attribute vec3 color;varying vec3 vC;
      void main(){vC=color;vec4 mv=modelViewMatrix*vec4(position,1.0);
      gl_PointSize=aS*(${STAR_R.toFixed(1)}/-mv.z);gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`varying vec3 vC;uniform float uOp;
      void main(){vec2 d=gl_PointCoord-0.5;float r=length(d);
      float a=smoothstep(0.5,0.0,r);gl_FragColor=vec4(vC,a*uOp);}`
  });
  return new THREE.Points(g,m);
}
const stars=buildStars();scene.add(stars);

function makeNucleus(radius){
  const grp=new THREE.Group();
  const pr=mulberry32(707);
  const nGeo=new THREE.SphereGeometry(radius*0.22,14,14);
  const pMat=new THREE.MeshStandardMaterial({color:0xff6a2b,emissive:0xd23a00,emissiveIntensity:1.1,roughness:0.4,metalness:0.2});
  const nMat=new THREE.MeshStandardMaterial({color:0xffb070,emissive:0xa04000,emissiveIntensity:0.8,roughness:0.5,metalness:0.2});
  const nucleons=[];
  for(let i=0;i<30;i++){const a=pr()*6.283,b=Math.acos(2*pr()-1),rr=radius*0.75*Math.pow(pr(),0.4);
    const m=new THREE.Mesh(nGeo,i%2===0?pMat:nMat);
    m.userData={a,b,rr};m.position.set(rr*Math.sin(b)*Math.cos(a),rr*Math.sin(b)*Math.sin(a),rr*Math.cos(b));
    grp.add(m);nucleons.push(m);}
  const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:softDisc(0,128,255,140,70),color:0xff8a3a,transparent:true,opacity:0.85,depthWrite:false,blending:THREE.AdditiveBlending}));
  glow.scale.setScalar(radius*5.0);grp.add(glow);
  return {grp,nucleons,glow,radius};
}

// ============================================================
//  Electron probability CLOUD — deterministic point cloud
//  dense near nucleus, thinning outward. NO orbits, NO balls.
// ============================================================
function makeCloud(N,rInner,rOuter,seed,color){
  const pr=mulberry32(seed||55);
  const base=new Float32Array(N*3),ph=new Float32Array(N),rad=new Float32Array(N);
  for(let i=0;i<N;i++){
    const a=pr()*6.283,b=Math.acos(2*pr()-1);
    const r=rInner+(rOuter-rInner)*Math.pow(pr(),1.7);
    base[i*3]=r*Math.sin(b)*Math.cos(a);base[i*3+1]=r*Math.sin(b)*Math.sin(a);base[i*3+2]=r*Math.cos(b);
    ph[i]=pr()*6.283;rad[i]=r;
  }
  const pos=new Float32Array(base);
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const pts=new THREE.Points(g,new THREE.PointsMaterial({map:TDOT.elec,size:0.34,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,color:color||0x5fc8e8,opacity:0.5}));
  return {pts,base,ph,rad,N};
}
function animCloud(cl,t,swirl,jitter){
  const arr=cl.pts.geometry.attributes.position.array,base=cl.base,ph=cl.ph;
  for(let i=0;i<cl.N;i++){
    const x0=base[i*3],y0=base[i*3+1],z0=base[i*3+2];
    const ang=t*swirl*(0.3+0.7/(1+cl.rad[i]*0.2));
    const ca=Math.cos(ang),sa=Math.sin(ang);
    arr[i*3]=x0*ca-z0*sa+Math.sin(t*0.6+ph[i])*jitter;
    arr[i*3+1]=y0+Math.cos(t*0.5+ph[i])*jitter;
    arr[i*3+2]=x0*sa+z0*ca+Math.sin(t*0.55+ph[i]*1.3)*jitter;
  }
  cl.pts.geometry.attributes.position.needsUpdate=true;
}

// ============================================================
//  Neutron star (hot blue photosphere) — reused E/I
// ============================================================
function makeNeutronStar(radius){
  const grp=new THREE.Group();
  const mat=new THREE.ShaderMaterial({
    uniforms:{uT:{value:0},uBright:{value:2.1}},
    vertexShader:`varying vec3 vP;varying vec3 vN;void main(){vP=normalize(position);vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`
      varying vec3 vP;varying vec3 vN;uniform float uT,uBright;
      vec3 hash3(vec3 p){p=vec3(dot(p,vec3(127.1,311.7,74.7)),dot(p,vec3(269.5,183.3,246.1)),dot(p,vec3(113.5,271.9,124.6)));return -1.0+2.0*fract(sin(p)*43758.5453);}
      float snoise(vec3 p){vec3 i=floor(p);vec3 f=fract(p);vec3 u=f*f*(3.0-2.0*f);
        return mix(mix(mix(dot(hash3(i+vec3(0,0,0)),f-vec3(0,0,0)),dot(hash3(i+vec3(1,0,0)),f-vec3(1,0,0)),u.x),
                       mix(dot(hash3(i+vec3(0,1,0)),f-vec3(0,1,0)),dot(hash3(i+vec3(1,1,0)),f-vec3(1,1,0)),u.x),u.y),
                   mix(mix(dot(hash3(i+vec3(0,0,1)),f-vec3(0,0,1)),dot(hash3(i+vec3(1,0,1)),f-vec3(1,0,1)),u.x),
                       mix(dot(hash3(i+vec3(0,1,1)),f-vec3(0,1,1)),dot(hash3(i+vec3(1,1,1)),f-vec3(1,1,1)),u.x),u.y),u.z);}
      float fbm(vec3 p){float s=0.0,a=0.5;for(int i=0;i<4;i++){s+=a*snoise(p);p*=2.02;a*=0.5;}return s;}
      void main(){
        vec3 d=normalize(vP);
        float n=fbm(d*10.0+vec3(0.0,0.0,uT*0.4));
        vec3 c1=vec3(0.30,0.55,1.0);vec3 c2=vec3(0.75,0.9,1.0);vec3 c3=vec3(1.0,1.0,1.0);
        vec3 col=mix(c1,c2,smoothstep(-0.2,0.4,n));
        col=mix(col,c3,smoothstep(0.4,0.9,n));
        float mu=clamp(dot(normalize(vN),vec3(0.0,0.0,1.0)),0.0,1.0);
        col*=0.5+0.5*pow(mu,0.5);
        gl_FragColor=vec4(col*uBright,1.0);
      }`});
  const core=new THREE.Mesh(new THREE.SphereGeometry(radius,48,48),mat);grp.add(core);
  const halo=new THREE.Mesh(new THREE.SphereGeometry(radius*1.5,32,32),new THREE.ShaderMaterial({
    transparent:true,depthWrite:false,side:THREE.BackSide,blending:THREE.AdditiveBlending,
    vertexShader:`varying vec3 vN;varying vec3 vP;void main(){vN=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.0);vP=mv.xyz;gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`varying vec3 vN;varying vec3 vP;void main(){float f=pow(1.0-abs(dot(normalize(vN),normalize(-vP))),2.6);gl_FragColor=vec4(vec3(0.55,0.75,1.0)*f,f*0.9);}`}));
  grp.add(halo);
  return {grp,core,mat,halo,radius};
}

      d.gapGlow.material.opacity=0.4+0.2*Math.sin(t*2.2);
      key.intensity=0.7;
      setCam(0,0,7,0,0,0,44);
    }else if(handP){
      key.intensity=0.8;
      setCam(0,1.2,7-((t-721.24)/24)*1.0,0,-1.2,0,42);
    }else{
      const warmA=smooth((t-668.72)/6)*(t<701.63?1:0.6)+smooth((t-701.63)/6)*0.4;
      d.warm.material.opacity=0.35*Math.min(1,warmA);
      key.intensity=0.75+0.15*Math.min(1,warmA);
      const cz=9-smooth((t-641.07)/8)*0.5;
      setCam(Math.sin(t*0.03)*1.5,0.6,cz,0,0.3,0,46);
    }
  }

  }catch(err){var eb=document.getElementById('err');if(eb){eb.style.display='block';eb.textContent='renderAtTime@'+t.toFixed(2)+': '+err.message;}}

  // ---- subtitles ----
  let s='';
  for(let i=0;i<CUES.length;i++){if(CUES[i].t<=t+0.001){s=CUES[i].s;}else break;}
  const subEl=document.getElementById('sub');if(subEl.textContent!==s)subEl.textContent=s;

  // ---- chapter overlay (5s after each chapter cue) ----
  const chEl=document.getElementById('chap');
  let chShow=0,chTxt='';
  const chMarks=[{t:0,x:'CHƯƠNG 1'},{t:95.27,x:'CHƯƠNG 2'},{t:323.21,x:'CHƯƠNG 3'},{t:556.19,x:'CHƯƠNG 4'}];
  for(const m of chMarks){if(t>=m.t&&t<m.t+5.5){chShow=band(t,m.t+0.3,m.t+4.8,0.6);chTxt=m.x;}}
  if(chEl.textContent!==chTxt)chEl.textContent=chTxt;
  chEl.style.opacity=chShow.toFixed(3);

  // ---- global fade in/out ----
  let fade=1.0;
  fade*=smooth(t/1.5);
  fade*=smooth((TOTAL-t)/3.0);
  lens.uniforms.uFade.value=fade;
  lens.uniforms.uFlash.value=flash;
  lens.uniforms.uT.value=t;

  composer.render();
}

// ============================================================
//  Timeline (paused, registered)
// ============================================================
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});
const clk={t:0};
tl.to(clk,{t:TOTAL,duration:TOTAL,ease:"none",onUpdate:()=>renderAtTime(clk.t)},0);
window.__timelines["nguyen-tu-rong"]=tl;

// initial paint
renderAtTime(0);
</script>
