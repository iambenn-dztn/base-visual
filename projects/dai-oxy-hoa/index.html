<script>
/* ===== HFA:BEGIN — sinh tự động bởi scripts/inject-lib.mjs, ĐỪNG SỬA TAY ===== */
/* ============================================================================
 * hf-astro.js — bộ khung dùng chung cho composition Du Mục Vũ Trụ
 *
 * Trích từ các tập ĐÃ RENDER VÀ VERIFY (01–07). Trước khi có file này, mỗi tập
 * tự dựng lại cùng một đoạn code (mulberry32, ACESFilmic, composer+bloom, lens
 * pass, starfield, tra phụ đề, driver timeline) — nên bug đã sửa ở tập này lại
 * tái xuất ở tập sau. Dùng file này thay vì chép tay.
 *
 * CÁCH DÙNG: KHÔNG nạp bằng thẻ script ngoài. Preview/render server của HyperFrames
 *      không phục vụ file .js tuỳ ý trong project — nó trả về SPA shell HTML cho
 *      đường dẫn đó, browser parse "doctype html" thành lỗi cú pháp và tập chết
 *      (đã kiểm chứng: curl -D- trả về 200 text/html, 593 byte). Composition phải
 *      TỰ CHỨA. Nhúng bằng:
 *
 *          node scripts/inject-lib.mjs --html index.html
 *
 *      Lệnh này dán nội dung file này vào đầu khối code của tập, giữa hai mốc
 *      HFA:BEGIN / HFA:END. Chạy lại được nhiều lần. Định nghĩa một global: HFA.
 *      Yêu cầu three.min.js + EffectComposer/RenderPass/ShaderPass/UnrealBloomPass
 *      đã nạp trước đó.
 *
 * LUẬT TẤT ĐỊNH: file này không dùng Date.now / performance.now / Math.random /
 * requestAnimationFrame / setTimeout. Mọi thứ là hàm thuần của t hoặc của seed.
 * ========================================================================== */
(function (global) {
  'use strict';

  var HFA = {};

  /* ---- PRNG có seed ------------------------------------------------------
   * Math.random() bị cấm (render phải tất định). Mỗi cụm vật thể dùng MỘT
   * seed riêng — dùng chung một chuỗi cho hai cụm thì thêm/bớt hạt ở cụm này
   * sẽ xê dịch layout cụm kia.
   */
  HFA.mulberry32 = function (a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  /* ---- helper toán -------------------------------------------------------- */
  HFA.clamp = function (x, a, b) { return Math.min(b, Math.max(a, x)); };

  HFA.smooth = function (x) { x = HFA.clamp(x, 0, 1); return x * x * (3 - 2 * x); };

  /** Bao lồi mềm: 0 ngoài [a,b], lên/xuống mượt trong dải f giây ở hai mép. */
  HFA.band = function (t, a, b, f) {
    f = f || 0.8;
    if (t < a - f || t > b + f) return 0;
    var up = HFA.smooth((t - (a - f)) / (2 * f));
    var dn = HFA.smooth(((b + f) - t) / (2 * f));
    return Math.min(1, Math.min(up, dn));
  };

  /* ---- cửa sổ cảnh --------------------------------------------------------
   * SC = {A:[start,end], B:[...], ...} theo GIÂY THẬT (lấy từ timing.json cue.start).
   * Trả về loc(t,k) ∈ [0,1] (tiến độ trong cảnh) và inSc(t,k).
   */
  HFA.scenes = function (SC) {
    return {
      SC: SC,
      loc: function (t, k) {
        var w = SC[k];
        return Math.min(1, Math.max(0, (t - w[0]) / (w[1] - w[0])));
      },
      inSc: function (t, k) { var w = SC[k]; return t >= w[0] && t < w[1]; }
    };
  };

  /* ---- shader lens — PASS CUỐI, kiêm luôn tone mapping + mã hoá sRGB --------
   *
   * ⚠ VÌ SAO PASS NÀY PHẢI TỰ TONE MAP:
   * three.js chỉ chèn ACES + sRGB vào shader của VẬT LIỆU nó tự dựng. Một
   * ShaderMaterial thô trong ShaderPass KHÔNG được chèn — nên khi pass cuối ghi
   * ra màn hình, ảnh chưa hề được mã hoá sRGB.
   * Đo thật (xám #808080, r128): vẽ thẳng = 197, qua EffectComposer = 143.
   * Sai lệch đó là lý do các tập 01–07 ra tối hơn và sai gamma.
   *
   * Vì vậy chuỗi mới là: cảnh vẽ TUYẾN TÍNH vào target HDR (không tone map)
   * → bloom ăn giá trị HDR thật → pass này mới ACES + sRGB ở bước cuối.
   * Bloom đứng TRƯỚC tone mapping mới đúng thứ tự điện ảnh: vùng cực sáng
   * (quang cầu, đĩa bồi tụ) chưa bị nén ngọn nên quầng sáng nở tự nhiên.
   *
   * Thứ tự trong shader: CA → vignette → fade (đều ở TUYẾN TÍNH, vì chúng là
   * phơi sáng) → ACES → sRGB → grain + flash (ở không gian hiển thị, vì grain
   * phim và chớp trắng là hiện tượng của bản in, không phải của ánh sáng).
   * Grain seed theo t, KHÔNG theo đồng hồ — cùng t phải cho cùng frame.
   */
  HFA.LensShader = {
    uniforms: {
      tDiffuse: { value: null }, uT: { value: 0 }, uVig: { value: 0.34 },
      uCA: { value: 0.0015 }, uGrain: { value: 0.045 },
      uFade: { value: 1.0 }, uFlash: { value: 0.0 },
      uExposure: { value: 1.02 }, uToneMap: { value: 1.0 }
    },
    vertexShader:
      'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader: [
      'varying vec2 vUv;uniform sampler2D tDiffuse;',
      'uniform float uT,uVig,uCA,uGrain,uFade,uFlash,uExposure,uToneMap;',
      'float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}',
      // ACES — SAO CHÉP ĐÚNG bản three.js r128 dùng cho ACESFilmicToneMapping
      // (ma trận vào/ra + RRTAndODTFit + tiền tỉ lệ /0.6). KHÔNG dùng xấp xỉ
      // Narkowicz: nó sáng hơn ~4% ở vùng trung, đo được (206 vs 197 trên xám
      // giữa) và sẽ lệch với mọi tài liệu/preset tính theo three.js.
      'vec3 rrt(vec3 v){vec3 a=v*(v+0.0245786)-0.000090537;',
      '  vec3 b=v*(0.983729*v+0.4329510)+0.238081;return a/b;}',
      'vec3 aces(vec3 color){',
      '  const mat3 mIn=mat3(0.59719,0.07600,0.02840, 0.35458,0.90834,0.13383, 0.04823,0.01566,0.83777);',
      '  const mat3 mOut=mat3(1.60475,-0.10208,-0.00327, -0.53108,1.10813,-0.07276, -0.07367,-0.00605,1.07602);',
      '  color/=0.6;',
      '  color=mIn*color; color=rrt(color); color=mOut*color;',
      '  return clamp(color,0.0,1.0);}',
      // tuyến tính → sRGB, đúng công thức chuẩn (không phải pow(1/2.2) cho nhanh)
      'vec3 toSRGB(vec3 c){c=max(c,vec3(0.0));',
      '  return mix(c*12.92,1.055*pow(c,vec3(1.0/2.4))-0.055,step(vec3(0.0031308),c));}',
      'void main(){',
      '  vec2 d=vUv-0.5;float r=dot(d,d);',
      '  vec2 off=d*uCA*(1.0+r*2.2);',
      '  vec3 col;',
      '  col.r=texture2D(tDiffuse,vUv+off).r;',
      '  col.g=texture2D(tDiffuse,vUv).g;',
      '  col.b=texture2D(tDiffuse,vUv-off).b;',
      // --- còn ở TUYẾN TÍNH: vignette + fade là phơi sáng ---
      '  float vig=smoothstep(1.02,uVig,r*2.0);',
      '  col*=mix(1.0,vig,0.85);',
      '  col*=uFade;',
      // --- tone map + mã hoá hiển thị ---
      '  col=mix(col*uExposure,aces(col*uExposure),uToneMap);',
      '  col=toSRGB(col);',
      // --- không gian hiển thị: grain + chớp trắng ---
      '  float g=h(vUv*vec2(1920.0,1080.0)+fract(uT)*97.3)-0.5;',
      '  col+=g*uGrain;',
      '  col=mix(col,vec3(1.0,0.98,0.94),uFlash);',
      '  gl_FragColor=vec4(clamp(col,0.0,1.0),1.0);',
      '}'
    ].join('\n')
  };

  /* ---- dựng sân khấu ------------------------------------------------------
   * Trả về {renderer, scene, camera, composer, bloom, lens, W, H, loadTex}.
   * Ánh sáng mặc định (amb/key/rim) tắt được bằng opt.lights=false.
   */
  HFA.createStage = function (opt) {
    opt = opt || {};
    var W = opt.width || 1920, H = opt.height || 1080;
    var canvas = typeof opt.canvas === 'string'
      ? document.getElementById(opt.canvas)
      : (opt.canvas || document.getElementById('c'));

    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(1);
    renderer.setSize(W, H);
    renderer.setClearColor(opt.clearColor != null ? opt.clearColor : 0x08080a, 1);

    // Tone mapping + sRGB CỐ Ý tắt ở đây: cả hai được làm ở pass lens cuối cùng.
    // Bật ở đây thì cảnh bị nén dải TRƯỚC khi bloom nhìn thấy (quầng sáng bẹt),
    // rồi lại không được mã hoá sRGB lúc ghi ra màn hình (xem chú thích LensShader).
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.outputEncoding = THREE.LinearEncoding;

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(
      opt.fov || 46, W / H, opt.near || 0.05, opt.far || 60000);
    camera.position.set(0, 0, 60);

    if (opt.lights !== false) {
      var amb = new THREE.AmbientLight(0x232838, 0.85); scene.add(amb);
      var key = new THREE.DirectionalLight(0xffe8d2, 1.05); key.position.set(6, 4, 8); scene.add(key);
      var rim = new THREE.DirectionalLight(0x6f9cff, 0.4); rim.position.set(-8, -3, -6); scene.add(rim);
      scene.userData.lights = { amb: amb, key: key, rim: rim };
    }

    /* --- render target: MSAA + HDR -------------------------------------------
     * `antialias:true` ở trên CHỈ tác dụng lên framebuffer mặc định. Đi qua
     * EffectComposer là vẽ vào target offscreen, và target đó KHÔNG multisample
     * theo mặc định — nên cờ antialias thành vô nghĩa và mọi rìa bị răng cưa.
     * WebGLMultisampleRenderTarget (có từ r111) khôi phục MSAA thật.
     * HalfFloat giữ giá trị >1.0 để bloom ăn được highlight HDR thật.
     */
    var samples = opt.msaa != null ? opt.msaa : 4;
    var rtOpts = {
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat,
      type: opt.hdr === false ? THREE.UnsignedByteType : THREE.HalfFloatType
    };
    var rt;
    if (samples > 0 && typeof THREE.WebGLMultisampleRenderTarget === 'function') {
      rt = new THREE.WebGLMultisampleRenderTarget(W, H, rtOpts);
      rt.samples = samples;
    } else {
      rt = new THREE.WebGLRenderTarget(W, H, rtOpts);
      if (samples > 0) console.warn('[hf-astro] không có WebGLMultisampleRenderTarget — chạy không MSAA.');
    }

    var composer = new THREE.EffectComposer(renderer, rt);
    composer.addPass(new THREE.RenderPass(scene, camera));

    /* Ngưỡng bloom: cảnh giờ là HDR TUYẾN TÍNH, không còn bị nén về [0,1] như
     * trước. Highlight thật nằm TRÊN 1.0, nên ngưỡng cũ 0.62 (chỉnh cho ảnh đã
     * tone map) sẽ làm cả những vùng sáng vừa cũng loé. Mặc định nâng lên 1.0. */
    var bloom = new THREE.UnrealBloomPass(
      new THREE.Vector2(W, H),
      opt.bloomStrength != null ? opt.bloomStrength : 0.78,
      opt.bloomRadius != null ? opt.bloomRadius : 0.7,
      opt.bloomThreshold != null ? opt.bloomThreshold : (opt.hdr === false ? 0.62 : 1.0));
    composer.addPass(bloom);

    // Bản sao uniforms để hai stage không dùng chung state.
    var lensDef = {
      uniforms: THREE.UniformsUtils.clone(HFA.LensShader.uniforms),
      vertexShader: HFA.LensShader.vertexShader,
      fragmentShader: HFA.LensShader.fragmentShader
    };
    var lens = new THREE.ShaderPass(lensDef);
    lens.renderToScreen = true;
    lens.uniforms.uExposure.value = opt.exposure != null ? opt.exposure : 1.02;
    composer.addPass(lens);

    var texLoader = new THREE.TextureLoader();
    texLoader.setCrossOrigin('anonymous');
    function loadTex(path, enc) {
      var tx = texLoader.load(path);
      if (enc) tx.encoding = enc;
      tx.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return tx;
    }

    var stage = {
      renderer: renderer, scene: scene, camera: camera,
      composer: composer, bloom: bloom, lens: lens, rt: rt,
      W: W, H: H, loadTex: loadTex,
      clearColor: opt.clearColor != null ? opt.clearColor : 0x08080a
    };

    /* --- environment map (IBL) ----------------------------------------------
     * MeshStandardMaterial là vật liệu PBR: nó phản xạ MÔI TRƯỜNG. Không có
     * envMap thì kim loại và bề mặt bóng mất gần hết thông tin phản xạ, chỉ còn
     * highlight từ đèn → ra chất nhựa sơn. (Tập "Vàng" là ví dụ rõ nhất.)
     * Dựng một bầu trời tối có vài đốm sáng, nướng qua PMREM MỘT LẦN lúc khởi
     * tạo → tất định, không phụ thuộc t, mọi MeshStandardMaterial hưởng ngay
     * qua scene.environment mà không phải sửa từng vật liệu.
     */
    if (opt.environment !== false) {
      stage.environment = HFA.buildEnvironment(renderer, scene, opt.environmentSeed || 4242);
    }

    return stage;
  };

  /** Bầu trời sao mờ nướng thành envMap PMREM. Trả về texture (đã gán scene.environment). */
  HFA.buildEnvironment = function (renderer, scene, seed) {
    var pr = HFA.mulberry32(seed);
    var cv = document.createElement('canvas');
    cv.width = 512; cv.height = 256;
    var cx = cv.getContext('2d');

    // nền: gradient rất tối, hơi lạnh ở dưới, ấm nhạt ở trên (ánh sáng thiên hà)
    var gr = cx.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, '#0a0d16'); gr.addColorStop(0.5, '#070910'); gr.addColorStop(1, '#05060b');
    cx.fillStyle = gr; cx.fillRect(0, 0, 512, 256);

    // dải Ngân Hà mờ vắt ngang → cho phản xạ có hướng, tránh env phẳng lì
    var bandGr = cx.createLinearGradient(0, 96, 0, 160);
    bandGr.addColorStop(0, 'rgba(70,80,110,0)');
    bandGr.addColorStop(0.5, 'rgba(120,130,165,0.30)');
    bandGr.addColorStop(1, 'rgba(70,80,110,0)');
    cx.fillStyle = bandGr; cx.fillRect(0, 96, 512, 64);

    // vài nguồn sáng nhỏ để kim loại có điểm loé
    for (var i = 0; i < 220; i++) {
      var x = pr() * 512, y = pr() * 256, s = pr() < 0.06 ? 2.2 : 1.0;
      var b = 0.35 + pr() * 0.65;
      cx.fillStyle = 'rgba(255,252,245,' + b.toFixed(3) + ')';
      cx.fillRect(x, y, s, s);
    }

    var tex = new THREE.CanvasTexture(cv);
    tex.mapping = THREE.EquirectangularReflectionMapping;
    tex.encoding = THREE.sRGBEncoding;

    var pmrem = new THREE.PMREMGenerator(renderer);
    pmrem.compileEquirectangularShader();
    var env = pmrem.fromEquirectangular(tex).texture;
    pmrem.dispose();
    tex.dispose();

    scene.environment = env;   // KHÔNG gán scene.background — nền do starfield lo
    return env;
  };

  /* ---- CHỌN MÀU SAO CHO SỐNG SÓT QUA ACES ---------------------------------
   * Bài học đo được ở tập 08, tốn 3 vòng sửa mới ra. Đọc trước khi chọn bảng màu.
   *
   * ACES nén mạnh vùng sáng. Càng đẩy độ sáng lên, sắc càng bị kéo về trắng/xám.
   * Nên SẮC PHẢI ĐẾN TỪ TỈ LỆ GIỮA CÁC KÊNH, không đến từ độ sáng.
   *
   * Đo thật (bão hoà còn lại sau khi qua chuỗi ACES của three.js r128):
   *   (0.42, 0.60, 1.05)  → còn 11–25%  → ra XÁM BÊ TÔNG. Đừng dùng.
   *   (0.10, 0.32, 1.00)  → còn 37–67%  → ra LAM THẬT.
   *
   * Quy tắc rút ra:
   *   - Kênh yếu nên ≤ 0.2× kênh mạnh. Nâng kênh yếu lên là giết sắc.
   *   - Kênh mạnh giữ quanh 1.0, đừng hơn.
   *   - Muốn SÁNG hơn thì tăng emissive (vượt ngưỡng bloom), ĐỪNG nâng kênh yếu.
   *
   * Hệ quả cho chữ và sơ đồ: bloom làm NHOÈ MẤT NÉT CHỮ. Nét biểu đồ và typo phải
   * để DƯỚI ngưỡng bloom (<1.0). Muốn chữ rõ hơn thì tăng độ dày nét, không tăng
   * emissive.
   *
   * Chống cháy trắng: giữ diện tích có luminance >0.85 (sau tonemap) dưới ~12%

  /* ---- starfield màu theo nhiệt độ ----------------------------------------

   * lỗi đã xảy ra thật. Truyền opt.maxCamDist để bật cảnh báo tự động.
   * Hằng số trong gl_PointSize phải BẰNG ĐÚNG radius, nếu không sao đổi độ to khi

  HFA.buildStars = function (opt) {
    opt = opt || {};

    var N = opt.count || 3600;
    var pr = HFA.mulberry32(opt.seed || 20260808);

    if (opt.maxCamDist && R <= opt.maxCamDist * 1.5) {
      console.warn('[hf-astro] starfield radius ' + R + ' quá nhỏ so với camera xa nhất ' +
        opt.maxCamDist + ' — sẽ lộ "quả bóng vũ trụ". Tăng radius lên >' +
        Math.ceil(opt.maxCamDist * 2) + ' (và giữ < camera.far).');
    }

    var pos = new Float32Array(N * 3), col = new Float32Array(N * 3), siz = new Float32Array(N);
    var tmp = new THREE.Vector3();
    for (var i = 0; i < N; i++) {
      var u = pr(), v = pr();
      var theta = Math.acos(2 * u - 1), phi = 2 * Math.PI * v;
      tmp.set(Math.sin(theta) * Math.cos(phi), Math.cos(theta) * 0.8, Math.sin(theta) * Math.sin(phi))

      pos[i * 3] = tmp.x; pos[i * 3 + 1] = tmp.y; pos[i * 3 + 2] = tmp.z;

      // màu theo nhiệt độ: xanh nóng → trắng → vàng nhạt
      var tt = pr(), c = new THREE.Color();
      if (tt < 0.14) c.setRGB(0.6, 0.72, 1.0);
      else if (tt < 0.5) c.setRGB(0.85, 0.9, 1.0);
      else if (tt < 0.8) c.setRGB(0.9, 0.92, 1.0);
      else c.setRGB(0.8, 0.82, 0.95);

      col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;

    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    g.setAttribute('aS', new THREE.BufferAttribute(siz, 1));

    var m = new THREE.ShaderMaterial({
      uniforms: { uOp: { value: 1 } },
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      vertexShader:
        'attribute float aS;attribute vec3 color;varying vec3 vC;' +
        'void main(){vC=color;vec4 mv=modelViewMatrix*vec4(position,1.0);' +
        'gl_PointSize=aS*(' + R.toFixed(1) + '/-mv.z);gl_Position=projectionMatrix*mv;}',

        'void main(){vec2 d=gl_PointCoord-0.5;float r=length(d);' +
        'float a=smoothstep(0.5,0.0,r);gl_FragColor=vec4(vC,a*uOp);}'
    });

  /* ---- TÍCH LUỸ ĐA MẪU: khử răng cưa + motion blur thật -------------------
   *
   * Chỉ làm được vì renderAtTime(t) là HÀM THUẦN, không trạng thái: gọi lại với

   * bằng thời gian để đổi lấy chất lượng — đây là thứ engine realtime không có.

      // nếu không màn hình đen (không pass nào ghi ra nữa).
      stage.accum = null;
      stage.composer.renderToScreen = true;
      return stage;

     * ⚠ PHẢI đặt trên COMPOSER, không phải trên pass: EffectComposer.render()
     * gán lại pass.renderToScreen mỗi frame theo công thức
     *   pass.renderToScreen = composer.renderToScreen && làPassCuốiCùng
     * nên mọi thiết lập trực tiếp lên lens.renderToScreen đều bị xoá. (Đo được:
     * đặt trên pass thì cả read/write buffer đều chứa dữ liệu TRƯỚC lens.) */

      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,

    };

    var quadScene = new THREE.Scene();
    var quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    var quadMat = new THREE.ShaderMaterial({
      uniforms: { tSrc: { value: null }, uWeight: { value: 1 / N } },
      transparent: true, depthTest: false, depthWrite: false,

      blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,   // cộng thuần
      vertexShader: 'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}',
      fragmentShader: 'varying vec2 vUv;uniform sampler2D tSrc;uniform float uWeight;' +
        'void main(){gl_FragColor=vec4(texture2D(tSrc,vUv).rgb*uWeight,1.0);}'
    });
    quadScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), quadMat));

    var outMat = new THREE.ShaderMaterial({
      uniforms: { tSrc: { value: accumRT.texture } },
      depthTest: false, depthWrite: false,
      vertexShader: 'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}',
      fragmentShader: 'varying vec2 vUv;uniform sampler2D tSrc;' +
        'void main(){gl_FragColor=vec4(texture2D(tSrc,vUv).rgb,1.0);}'
    });

    outScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), outMat));

    stage.accum = {
      samples: N, fps: o.fps || 30,
      rt: accumRT, quadScene: quadScene, quadCam: quadCam,
      quadMat: quadMat, outScene: outScene

  };

  /* Vị trí lệch subpixel — chuỗi Halton (2,3): phân bố đều hơn ngẫu nhiên,
   * và tất định tuyệt đối (không đụng tới PRNG chung). */
  function halton(i, b) {
    var f = 1, r = 0;
    while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); }
    return r;
  }

  /** Vẽ MỘT frame tại t. Tự dùng tích luỹ nếu stage đã bật, không thì vẽ thẳng. */
  HFA.renderFrame = function (stage, renderAtTime, t) {
    var acc = stage && stage.accum;
    if (!acc) { renderAtTime(t); return; }   // renderAtTime tự gọi composer.render()

    var r = stage.renderer, cam = stage.camera, N = acc.samples;
    var dt = 1 / acc.fps;
    var prevAutoClear = r.autoClear;

    // xoá bộ tích luỹ ĐÚNG MỘT LẦN, trước vòng lặp
    r.setRenderTarget(acc.rt);
    r.setClearColor(0x000000, 1);
    r.clear(true, true, true);
    r.setRenderTarget(null);

    for (var i = 0; i < N; i++) {
      // lệch dưới-một-pixel (Halton, tất định)
      var jx = halton(i + 1, 2) - 0.5, jy = halton(i + 1, 3) - 0.5;
      cam.setViewOffset(stage.W, stage.H, jx, jy, stage.W, stage.H);

      // trải t trong đúng một frame → motion blur
      var tt = t + ((i + 0.5) / N - 0.5) * dt;
      r.setClearColor(stage.clearColor, 1);   // trả màu nền cho RenderPass
      renderAtTime(tt < 0 ? 0 : tt);

      /* ⚠ autoClear PHẢI tắt ở đây.
       * renderer.autoClear mặc định TRUE → mỗi r.render() xoá sạch target trước
       * khi vẽ. Cộng dồn mà không tắt thì 3 mẫu đầu bị xoá, chỉ mẫu cuối sống
       * sót và nó mang trọng số 1/N → ảnh tối đúng N lần. (Đã dính lỗi này:
       * ảnh ra tối bằng 1/4 với N=4.) */
      // pass cuối có needsSwap=true nên sau render(), kết quả nằm ở readBuffer
      acc.quadMat.uniforms.tSrc.value = stage.composer.readBuffer.texture;
      r.autoClear = false;
      r.setRenderTarget(acc.rt);
      r.render(acc.quadScene, acc.quadCam);
      r.setRenderTarget(null);
      r.autoClear = prevAutoClear;
    }

    cam.clearViewOffset();
    r.setClearColor(stage.clearColor, 1);
    r.render(acc.outScene, acc.quadCam);   // xuất ra màn hình
  };

 {t:215.57,s:"Electron thì dùng."},
 {t:217.36,s:"Còn oxy thì sao?"},

 {t:705.27,s:"đi."},
 {t:705.53,s:"Nhiệt độ toàn cầu bắt đầu rơi."},
 {t:707.49,s:"Băng hình thành ở hai cực, lan xuống."},
 {t:710.88,s:"Và băng thì trắng, mà trắng thì hắt ánh"},
 {t:713.81,s:"nắng ngược lại vũ trụ."},
 {t:715.47,s:"Càng nhiều băng, càng ít nhiệt được giữ."},
 {t:718.42,s:"Càng ít nhiệt, càng nhiều băng."},
 {t:721.26,s:"Cái vòng đó không có phanh."},
 {t:723.28,s:"Kỷ băng hà Huronian."},
 {t:725.56,s:"Kéo dài khoảng ba trăm triệu năm."},
 {t:727.89,s:"Một trong những đợt lạnh dài nhất và"},
 {t:730.11,s:"nghiêm trọng nhất hành tinh từng trải qua."},
 {t:732.69,s:"Có bằng chứng cho thấy băng đã lan xuống"},
 {t:735.52,s:"tới tận vùng gần xích đạo."},
 {t:737.36,s:"Tôi đứng trên lớp băng đang dày lên dưới"},
 {t:739.89,s:"chân, trên đúng cái vùng biển ấm nơi tôi"},
 {t:742.42,s:"vừa nhặt mảnh thảm xanh lên tay, và tôi"},
 {t:744.88,s:"nghĩ về chuỗi sự việc vừa xảy ra."},
 {t:746.97,s:"Một sinh vật học được cách tách nước."},
 {t:749.35,s:"Nó thải ra rác."},
 {t:750.89,s:"Rác đó giết phần lớn sự sống đang có."},
 {t:754.33,s:"Rác đó ăn hết sắt trong đại dương."},
 {t:756.95,s:"Rác đó đốt thủng lớp chăn giữ ấm."},
 {t:759.67,s:"Và hành tinh đóng băng."},
 {t:761.95,s:"Sự sống suýt tự xoá sổ mình bằng chính thứ"},
 {t:765.46,s:"nó vứt đi."},
 {t:768.79,s:"Nhưng nó không xoá xong."},
 {t:770.45,s:"Núi lửa vẫn phun, khí cacbonic vẫn tích"},
 {t:773.76,s:"lại dưới lớp băng, và qua hàng triệu năm,"},
 {t:777.24,s:"hiệu ứng nhà kính quay lại đủ để phá tan"},
 {t:780.64,s:"lớp vỏ trắng."},
 {t:781.74,s:"Băng rút."},
 {t:782.78,s:"Nước chảy."},
 {t:783.9,s:"Biển mở ra lần nữa."},
 {t:785.91,s:"Và những gì bò ra khỏi thảm hoạ đó đã"},
 {t:788.79,s:"khác."},
 {t:789.18,s:"Rất khác."},
 {t:792.65,s:"Có một điều tôi chưa nói, và nó là lý do"},
 {t:796.3,s:"tôi và bạn đang tồn tại."},
 {t:798.49,s:"Oxy phá mạnh, vì nó giật electron mạnh."},
 {t:801.73,s:"Nhưng chính cái đặc tính khiến nó là chất"},
 {t:804.69,s:"độc cũng khiến nó là thứ tốt nhất để lấy"},
 {t:807.58,s:"năng lượng."},
 {t:808.37,s:"Trước Đại Oxy hoá, sự sống lấy năng lượng"},
 {t:811.33,s:"bằng lên men."},
 {t:812.27,s:"Bẻ một phân tử đường ra, lấy được hai đơn"},
 {t:814.86,s:"vị năng lượng."},
 {t:815.74,s:"Hai."},
 {t:816.7,s:"Rồi vứt phần còn lại đi, vì không có cách"},
 {t:819.94,s:"nào bẻ tiếp."},
 {t:820.89,s:"Một tế bào biết dùng oxy bẻ cùng phân tử"},
 {t:823.8,s:"đường đó, đốt nó tới tận cùng, và thu về"},
 {t:826.72,s:"khoảng ba mươi đơn vị."},
 {t:828.32,s:"Gấp mười lăm lần."},
 {t:829.87,s:"Từ cùng một miếng ăn."},
 {t:831.82,s:"Đó là khoản chênh lệch quyết định mọi thứ"},
 {t:834.1,s:"đến sau."},
 {t:834.54,s:"Vì một tế bào chỉ có hai đơn vị năng lượng"},
 {t:837.1,s:"thì không nuôi nổi bộ máy phức tạp."},
 {t:839.24,s:"Nó không xây được cơ."},
 {t:841.13,s:"Không xây được thần kinh."},
 {t:842.81,s:"Không đủ để làm gì lớn hơn chính nó."},
 {t:845.61,s:"Cái giá của sự phức tạp là năng lượng."},
 {t:847.8,s:"Và trong hơn một tỉ năm, sự sống không đủ"},
 {t:851.18,s:"tiền trả."},
 {t:853.42,s:"Một số vi khuẩn không chết trong cuộc"},
 {t:855.41,s:"khủng hoảng."},
 {t:856.05,s:"Chúng làm điều ngược lại: chúng học cách"},
 {t:858.76,s:"xử lý chất độc."},
 {t:859.78,s:"Rồi học cách dùng nó."},
 {t:861.51,s:"Rồi trở nên giỏi dùng nó tới mức đó thành"},
 {t:864.2,s:"nghề của chúng."},
 {t:865.19,s:"Và rồi một tế bào lớn hơn nuốt một trong"},
 {t:867.76,s:"những con vi khuẩn đó vào bụng."},
 {t:869.75,s:"Vì lý do nào đó, nó không tiêu hoá con"},
 {t:872.69,s:"mồi."},
 {t:873,s:"Nó giữ lại."},
 {t:874.32,s:"Con vi khuẩn sống tiếp bên trong, tiếp tục"},
 {t:877.56,s:"đốt oxy, và chia phần năng lượng cho chủ"},
 {t:880.65,s:"nhà."},
 {t:880.96,s:"Cuộc thương lượng đó chưa bao giờ kết"},
 {t:883.22,s:"thúc."},
 {t:883.53,s:"Nó vẫn đang diễn ra ngay lúc này, trong"},
 {t:887.13,s:"bạn."},
 {t:887.5,s:"Mỗi tế bào trong cơ thể bạn chứa hàng trăm"},
 {t:889.9,s:"tới hàng nghìn ty thể."},
 {t:891.16,s:"Chúng có màng riêng."},
 {t:893.06,s:"Chúng có bộ gen riêng, tách biệt với bộ"},
 {t:895.79,s:"gen trong nhân tế bào bạn."},
 {t:897.61,s:"Chúng tự nhân đôi theo lịch của riêng"},
 {t:900.17,s:"chúng."},
 {t:900.58,s:"Chúng là hậu duệ của những con vi khuẩn"},
 {t:902.59,s:"từng bị nuốt vào hai tỉ năm trước."},
 {t:904.34,s:"Bạn không chỉ có một dòng dõi."},
 {t:906.68,s:"Bạn đang chở theo một dòng dõi khác bên"},
 {t:909.29,s:"trong mình, và nó đang làm việc."},
 {t:913.44,s:"Tôi quay về."},
 {t:914.5,s:"Không còn băng, không còn bầu trời cam,"},
 {t:917.56,s:"không còn biển nông ấm."},
 {t:919.37,s:"Tôi đang ngồi ở một nơi có ghế và có tường"},
 {t:922.49,s:"và có người khác thở cùng phòng."},
 {t:924.87,s:"Và tôi hít vào."},
 {t:928.34,s:"Cái tôi vừa kéo vào ngực không phải là"},
 {t:930.66,s:"không khí trong lành."},
 {t:931.94,s:"Nó là chất thải."},
 {t:933.44,s:"Là phần bỏ đi của một phản ứng xảy ra"},
 {t:935.98,s:"trong những sinh vật đơn bào không có ý"},
 {t:938.67,s:"định gì với tôi, không biết tôi tồn tại,"},
 {t:941.42,s:"và đã chết cách đây hai tỉ năm."},
 {t:943.55,s:"Chất thải đó từng là vũ khí giết người"},
 {t:945.65,s:"hàng loạt lớn nhất mà hành tinh này từng"},
 {t:947.85,s:"chứng kiến."},
 {t:948.46,s:"Nó xoá sổ phần lớn sự sống đương thời."},
 {t:951.32,s:"Nó rút cạn cả một đại dương sắt."},
 {t:953.82,s:"Nó đóng băng cả thế giới."},
 {t:956.46,s:"Và nó cũng là thứ duy nhất đủ mạnh để trả"},
 {t:959.36,s:"giá cho một bộ não."},
 {t:962.21,s:"Tôi từng nghĩ lịch sử sự sống có thảm hoạ"},
 {t:964.72,s:"và có bước tiến, và hai thứ đó là hai loại"},
 {t:967.3,s:"sự kiện khác nhau."},
 {t:968.4,s:"Đại Oxy hoá dạy tôi rằng đôi khi chúng là"},
 {t:971.25,s:"cùng một sự kiện, chỉ khác chỗ bạn đứng"},
 {t:973.96,s:"trên trục thời gian mà nhìn."},
 {t:975.9,s:"Nếu tôi đứng ở năm hai tỉ tư trăm triệu"},
 {t:978.61,s:"năm trước, đó là tận thế."},
 {t:980.34,s:"Nếu tôi đứng ở đây, hôm nay, với hai lá"},
 {t:983.26,s:"phổi đang làm việc, đó là điều tốt nhất"},
 {t:986.19,s:"từng xảy ra với sự sống trên Trái Đất."},
 {t:989.04,s:"Không aai chọn được."},
 {t:990.26,s:"Không có aai ngồi cân nhắc."},
 {t:992.05,s:"Chỉ có một sinh vật nhỏ xíu làm việc của"},
 {t:994.78,s:"nó quá giỏi, và một hành tinh phải sống"},
 {t:997.45,s:"với hậu quả."},
 {t:1000.27,s:"Vi khuẩn lam vẫn còn đó, bằng cách này hay"},
 {t:1003.02,s:"cách khác."},
 {t:1003.68,s:"Chúng vẫn nở rộ trong các hồ nước ấm mỗi"},
 {t:1006.42,s:"mùa hè, thành những vệt xanh lục mà chúng"},
 {t:1009.23,s:"ta lấy que gạt đi và gọi là tảo bẩn."},
 {t:1011.7,s:"Và những mảnh của chúng, bị nuốt vào rồi ở"},
 {t:1014.55,s:"lại, đang nằm trong từng chiếc lá xanh"},
 {t:1017.14,s:"ngoài cửa sổ bạn, vẫn tách nước, vẫn thải"},
 {t:1019.92,s:"oxy, vẫn làm đúng cái việc đã suýt kết"},
 {t:1022.51,s:"liễu mọi thứ."},
 {t:1025.39,s:"Lần tới khi bạn thở sâu, và cảm thấy cái"},
 {t:1028.04,s:"nhẹ nhõm quen thuộc khi lồng ngực đầy lên,"},
 {t:1030.82,s:"tôi muốn bạn giữ lại một ý này trong"},
 {t:1033.2,s:"khoảng ba giây."},
 {t:1034.19,s:"Thứ đang nuôi bạn từng là thứ đã giết gần"},
 {t:1036.78,s:"hết họ hàng xa của bạn."},
 {t:1038.23,s:"Không có gì trong hai tỉ năm qua làm nó"},
 {t:1040.52,s:"bớt độc đi."},
 {t:1041.16,s:"Nó vẫn gỉ sắt, vẫn đốt gỗ, vẫn làm hỏng tế"},
 {t:1044.15,s:"bào của bạn từng chút một mỗi ngày."},
 {t:1046.64,s:"Cái thay đổi không phải là oxy."},
 {t:1048.6,s:"Cái thay đổi là bạn."},
 {t:1050.27,s:"Cơ thể bạn được xây từ đầu tới cuối như"},
 {t:1053.18,s:"một cỗ máy chịu đựng chất độc đó, khai"},
 {t:1056.02,s:"thác nó, và sống bằng nó."},
 {t:1059.89,s:"Hít vào."},
 {t:1063.03,s:"Đó là hai tỉ năm đàm phán giữa sự sống và"},
 {t:1066.3,s:"thứ nó từng ném đi."},
 {t:1070.32,s:"Và bạn vừa thắng thêm một hiệp nữa."}
];

/* --- CHỮ: canvas texture → plane basic. KHÔNG nhận sáng, giữ nét tuyệt đối.
 * ⚠ Chữ phải ĐỌC ĐƯỢC: hệ số phóng chung KTEXT bù cho khoảng cách camera.
 * Đo ở tập trước: dưới hệ số này chữ ra <18px trên khung 1080. */
var KTEXT = 1.70;
function textTex(txt, px, colr, wpx, hpx, align, weight){
  var cv=document.createElement('canvas');
  cv.width = wpx||1024; cv.height = hpx||256;
  var cx=cv.getContext('2d');
  cx.clearRect(0,0,cv.width,cv.height);
  /* ⚠ TỰ THU NHỎ cho vừa canvas: chữ dài hơn bề ngang canvas bị CẮT CỤT
   * (đo bằng snapshot 618s: "...CÔNG NGHI"). Đo bề rộng rồi hạ cỡ. */
  var fpx = px||120;
  cx.font=(weight||'700')+' '+fpx+'px "Segoe UI",Arial,sans-serif';
  var maxW = cv.width - 40;
  var lns = String(txt).split(String.fromCharCode(10));
  var widest = 0;
  for(var li=0; li<lns.length; li++) widest = Math.max(widest, cx.measureText(lns[li]).width);
  if(widest > maxW){
    fpx = Math.max(18, Math.floor(fpx * maxW / widest));
    cx.font=(weight||'700')+' '+fpx+'px "Segoe UI",Arial,sans-serif';
  }
  px = fpx;
  cx.textBaseline='middle';
  cx.textAlign= align||'center';
  cx.fillStyle=colr||COL.TEXT;
  var x = align==='left' ? 12 : (align==='right' ? cv.width-12 : cv.width/2);
  var lines=String(txt).split('\n');
  var lh=(px||120)*1.16;
  var y0=cv.height/2 - lh*(lines.length-1)/2;
  for(var i=0;i<lines.length;i++) cx.fillText(lines[i], x, y0+i*lh);
  var tx=new THREE.CanvasTexture(cv);
  tx.encoding=THREE.sRGBEncoding; tx.minFilter=THREE.LinearFilter;
  tx.anisotropy=renderer.capabilities.getMaxAnisotropy();
  return tx;
}
/* hWorld = chiều cao chữ mong muốn (world). opBase 0.80 → emissive hiệu dụng
 * dưới ngưỡng bloom 1.0 (GHI CHÚ mục 2). */
function textPlane(txt, hWorld, px, colr, wpx, hpx, align){
  hWorld = hWorld*KTEXT;
  var tx=textTex(txt,px,colr,wpx,hpx,align);
  var w=(wpx||1024)/(hpx||256);
  var m=new THREE.MeshBasicMaterial({map:tx,transparent:true,depthWrite:false,
    opacity:0.86, blending:THREE.NormalBlending});
  var p=new THREE.Mesh(new THREE.PlaneGeometry(hWorld*w,hWorld),m);
  p.userData.baseOp=0.86;
  return p;
}
/* nét dày (sơ đồ, mũi tên, trục) — box mỏng, kiểm soát được độ dày */
function lineBox(len, thick, col, op){
  var m=new THREE.Mesh(new THREE.BoxGeometry(len, thick, thick*0.6),
    flatMat(col, op==null?0.80:op));
  m.material.blending=THREE.NormalBlending;
  return m;
}
/* mũi tên 2D: thân + đầu tam giác */
function arrow2D(len, thick, col, op){
  var g=new THREE.Group();
  var body=lineBox(len, thick, col, op); body.position.x=len/2; g.add(body);
  var headGeo=new THREE.ConeGeometry(thick*2.2, thick*4.2, 14);
  var head=new THREE.Mesh(headGeo, flatMat(col, op==null?0.80:op));
  head.material.blending=THREE.NormalBlending;
  head.rotation.z=-Math.PI/2; head.position.x=len+thick*2.1; g.add(head);
  return g;
}

/* đặt độ mờ cho cả nhánh (nhân với baseOp của từng vật liệu) */
function setGroupOp(g, k){
  g.visible = k>0.004;
  if(!g.visible) return;
  g.traverse(function(o){
    if(o.material && o.material.transparent){
      var b = (o.userData && o.userData.baseOp!=null) ? o.userData.baseOp
            : (o.material.userData && o.material.userData.baseOp!=null ? o.material.userData.baseOp : 1);
      o.material.opacity = b*k;
    }
    if(o.material && o.material.uniforms && o.material.uniforms.uOpacity)
      o.material.uniforms.uOpacity.value = k;
  });
}
/* ghi nhớ baseOp hiện tại của mọi vật liệu trong nhánh (gọi 1 lần lúc dựng) */
function regOp(g){
  g.traverse(function(o){
    if(o.material && o.material.transparent){
      o.userData.baseOp = (o.userData.baseOp!=null) ? o.userData.baseOp : o.material.opacity;
    }
  });
}

var GLSL_NOISE = [

'vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}',

'float snoise(vec3 v){',
' const vec2 Cc=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);',
' vec3 i=floor(v+dot(v,Cc.yyy)); vec3 x0=v-i+dot(i,Cc.xxx);',
' vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);',
' vec3 x1=x0-i1+Cc.xxx; vec3 x2=x0-i2+Cc.yyy; vec3 x3=x0-D.yyy;',
' i=mod289(i);',
' vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));',
' float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;',
' vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);',
' vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);',
' vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);',
' vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));',
' vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;',
' vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);',
' vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));',
' p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;',
' vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;',
' return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));}',
'float fbm(vec3 p){float s=0.0,a=0.5;for(int i=0;i<5;i++){s+=a*snoise(p);p*=2.02;a*=0.5;}return s;}',
'float fbm3(vec3 p){float s=0.0,a=0.5;for(int i=0;i<3;i++){s+=a*snoise(p);p*=2.05;a*=0.5;}return s;}'
].join('\n');

/* ==========================================================================
 * TRỤC MÀU KHÍ QUYỂN — xương sống hình của cả tập.
 * Nấc 1 cam đục (C01–C59) → 2 cam nhạt (C60–C63) → 3 trắng Huronian (C64–C70)
 * → 4 xanh hiện đại (C71–C101). Nội suy TUYẾN TÍNH (linear), CẤM nhảy ngược.
 * Chuyển nấc: 1→2 suốt S56–S57 · 2→3 suốt S61–S64 · 3→4 suốt S68.
 * ========================================================================== */
var _skyTmp = new THREE.Color();
function skyColor(t){
  var a, b, k;
  if(t < SC.S56[0]){ a=COL.SKY1; b=COL.SKY1; k=0; }
  else if(t < SC.S57[1]){ a=COL.SKY1; b=COL.SKY2; k=eInOut(pr01(t, SC.S56[0], SC.S57[1])); }
  else if(t < SC.S61[0]){ a=COL.SKY2; b=COL.SKY2; k=0; }
  else if(t < SC.S64[1]){ a=COL.SKY2; b=COL.SKY3; k=eInOut(pr01(t, SC.S61[0], SC.S64[1])); }
  else if(t < SC.S68[0]){ a=COL.SKY3; b=COL.SKY3; k=0; }
  else if(t < SC.S68[1]){ a=COL.SKY3; b=COL.SKY4; k=eInOut(pr01(t, SC.S68[0], SC.S68[1])); }
  else { a=COL.SKY4; b=COL.SKY4; k=0; }
  _skyTmp.copy(a).lerp(b,k);
  return _skyTmp;
}
/* độ đục của khí quyển (metan): 1 ở nấc 1, giảm dần về 0.15 ở nấc 4 */
function skyHaze(t){
  if(t < SC.S56[0]) return 1.0;
  if(t < SC.S57[1]) return lerp(1.0,0.72, eInOut(pr01(t,SC.S56[0],SC.S57[1])));
  if(t < SC.S61[0]) return 0.72;
  if(t < SC.S64[1]) return lerp(0.72,0.30, eInOut(pr01(t,SC.S61[0],SC.S64[1])));
  if(t < SC.S68[0]) return 0.30;
  if(t < SC.S68[1]) return lerp(0.30,0.15, eInOut(pr01(t,SC.S68[0],SC.S68[1])));
  return 0.15;
}

/* cập nhật bong bóng — vị trí là HÀM THUẦN của t (không tích luỹ) */
function updateBubbles(t, rate, ampY){
  var p = bubGeo.attributes.position.array;
  for(var i=0;i<NBUB;i++){
    var ph = bubSeed[i*3+2];
    var spd = 0.30 + bubSize[i]*7.5;          /* hạt to nổi nhanh hơn */
    var cyc = fract01(ph + t*spd*rate*0.10);
    var y = -2.15 + cyc*(2.15+ampY);
    var sw = Math.sin((ph*31.0) + t*1.7 + cyc*9.0)*0.055*(1.0-cyc*0.4);
    p[i*3]   = bubSeed[i*3] + sw;
    p[i*3+1] = y;
    p[i*3+2] = bubSeed[i*3+1] + Math.cos((ph*17.0)+t*1.3)*0.05;
  }
  bubGeo.attributes.position.needsUpdate = true;
}

function atomMesh(r, col, rough, emisK){
  var m = new THREE.MeshStandardMaterial({ color:col, roughness:(rough==null?0.36:rough),
    metalness:0.12, transparent:true, opacity:1.0 });
  if(emisK){ m.emissive = col.clone(); m.emissiveIntensity = emisK; }
  return new THREE.Mesh(new THREE.SphereGeometry(r, 34, 24), m);
}
function bondMesh(a, b, r, col, op){
  var g = new THREE.Group();
  var d = new THREE.Vector3().subVectors(b,a);
  var len = d.length();
  var cy = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 14),
    new THREE.MeshStandardMaterial({color:col, roughness:0.5, metalness:0.1,
      transparent:true, opacity:(op==null?0.95:op)}));
  cy.position.copy(a).add(b).multiplyScalar(0.5);
  cy.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d.clone().normalize());
  g.add(cy);
  return g;
}

function makeO2(scaleK){
  var g = new THREE.Group();
  var s = scaleK||1;
  var L = 0.62*s;
  var a = new THREE.Vector3(-L,0,0), b = new THREE.Vector3(L,0,0);
  var A = atomMesh(0.44*s, COL.OXY.clone(), 0.30, 0.30); A.position.copy(a);
  var B = atomMesh(0.44*s, COL.OXY.clone(), 0.30, 0.30); B.position.copy(b);
  g.add(A); g.add(B);
  /* liên kết ĐÔI: hai ống song song lệch trục */
  for(var k=-1;k<=1;k+=2){
    var o = new THREE.Vector3(0, k*0.14*s, 0);
    g.add(bondMesh(a.clone().add(o), b.clone().add(o), 0.062*s, C3(0.40,0.62,0.86)));
  }
  /* hai electron độc thân ở hai cực (triplet) */
  var e1 = new THREE.Mesh(new THREE.SphereGeometry(0.10*s,14,10), emisMat(C3(0.55,0.85,1.0),0.9));
  e1.position.set(-L-0.40*s, 0.30*s, 0.10*s);
  var e2 = new THREE.Mesh(new THREE.SphereGeometry(0.10*s,14,10), emisMat(C3(0.55,0.85,1.0),0.9));
  e2.position.set( L+0.40*s,-0.30*s,-0.10*s);
  g.add(e1); g.add(e2);
  g.userData.elec = [e1,e2];
  g.userData.atoms = [A,B];
  return g;
}

/* ==========================================================================
 * S15 / S89 — CỤM Mn4CaO5 "GHẾ MÉO". Hình học ở S89 phải KHỚP CHÍNH XÁC S15.
 * 3 Mn + 1 Ca tạo cubane, Mn thứ tư treo ngoài qua cầu oxy.
 * ========================================================================== */
function buildMn4Ca(){
  var g = new THREE.Group();
  var d = 0.62;                        /* nửa cạnh cubane */
  /* 4 đỉnh kim loại của cubane: Mn1 Mn2 Mn3 + Ca */
  var mPos = [
    new THREE.Vector3(-d, d, -d),      /* Mn1 */
    new THREE.Vector3( d, d,  d),      /* Mn2 */
    new THREE.Vector3( d,-d, -d),      /* Mn3 */
  ];
  var caPos = new THREE.Vector3(-d,-d, d);
  /* 4 đỉnh oxy xen kẽ — khối méo (distorted chair) */
  var oPos = [
    new THREE.Vector3( d*0.92, d*0.86,-d*0.92),
    new THREE.Vector3(-d*0.92, d*0.90, d*0.88),
    new THREE.Vector3(-d*0.88,-d*0.92,-d*0.86),
    new THREE.Vector3( d*0.86,-d*0.88, d*0.94)
  ];
  var mnMeshes=[];
  for(var i=0;i<3;i++){
    var mn = atomMesh(0.34, COL.MANGAN.clone(), 0.30, 0.16);
    mn.position.copy(mPos[i]); g.add(mn); mnMeshes.push(mn);
  }
  var ca = atomMesh(0.38, C3(1.00,0.92,0.70), 0.34, 0.12);
  ca.position.copy(caPos); g.add(ca);
  var oMeshes=[];
  for(var i=0;i<4;i++){
    var ox = atomMesh(0.21, C3(0.90,0.16,0.10), 0.34, 0.10);
    ox.position.copy(oPos[i]); g.add(ox); oMeshes.push(ox);
  }
  /* cầu nối trong cubane */
  var metal = mPos.concat([caPos]);
  for(var i=0;i<metal.length;i++){
    for(var j=0;j<oPos.length;j++){
      if(metal[i].distanceTo(oPos[j]) < d*2.05)
        g.add(bondMesh(metal[i], oPos[j], 0.045, C3(0.50,0.44,0.60), 0.85));
    }
  }
  /* Mn thứ tư TREO NGOÀI qua cầu oxy — đặc trưng của "ghế méo" */
  var oBridge = new THREE.Vector3(-d*1.60, d*0.28, -d*1.30);
  var ob = atomMesh(0.21, C3(0.90,0.16,0.10), 0.34, 0.10); ob.position.copy(oBridge); g.add(ob);
  var mn4Pos = new THREE.Vector3(-d*2.55, d*0.05, -d*1.85);
  var mn4 = atomMesh(0.34, COL.MANGAN.clone(), 0.30, 0.16); mn4.position.copy(mn4Pos);
  g.add(mn4); mnMeshes.push(mn4);
  g.add(bondMesh(mPos[0], oBridge, 0.045, C3(0.50,0.44,0.60), 0.85));
  g.add(bondMesh(oBridge, mn4Pos, 0.045, C3(0.50,0.44,0.60), 0.85));
  g.userData.mn = mnMeshes;
  g.userData.ca = ca;
  g.userData.ox = oMeshes;
  return g;
}

  for(var x=-1;x<=1;x+=2) for(var y=-1;y<=1;y+=2) for(var z=-1;z<=1;z+=2){
    verts.push(new THREE.Vector3(x*d*(0.94+0.10*rndMisc()), y*d*(0.94+0.10*rndMisc()), z*d*(0.94+0.10*rndMisc())));
    kinds.push(((x*y*z)>0)?0:1);   /* 0=Fe, 1=S — xen kẽ hoàn hảo */
  }
  for(var i=0;i<8;i++){
    var isFe = kinds[i]===0;
    var at = atomMesh(isFe?0.32:0.36, (isFe?COL.FEFE:COL.FES).clone(), 0.32, isFe?0.30:0.24);
    at.position.copy(verts[i]);
    at.userData.home = verts[i].clone();
    at.userData.isFe = isFe;
    feCluster.add(at);
    if(isFe) feAtoms.push(at); else sAtoms.push(at);
  }
  for(var i=0;i<8;i++) for(var j=i+1;j<8;j++){
    if(kinds[i]!==kinds[j] && verts[i].distanceTo(verts[j]) < d*2.3){
      var bd = bondMesh(verts[i], verts[j], 0.050, C3(0.62,0.44,0.20), 0.88);
      feCluster.add(bd); feBonds.push(bd);
    }
  }
  /* cầu cysteine-S nối mỗi Fe ra khung protein */
  for(var i=0;i<feAtoms.length;i++){
    var p = feAtoms[i].position;
    var out = p.clone().multiplyScalar(2.15);
    feCluster.add(bondMesh(p, out, 0.036, C3(0.80,0.70,0.22), 0.65));
    var cys = atomMesh(0.15, COL.FES.clone(), 0.42, 0.10);

function buildFilament(nCells, seedFn){
  var g = new THREE.Group();

  var R=0.46, Lc=0.74;
  for(var i=0;i<nCells;i++){
    var cg = new THREE.Group();
    /* vỏ tế bào hình trụ, hơi trong */
    var body = new THREE.Mesh(new THREE.CylinderGeometry(R, R, Lc*0.92, 26, 1, false),
      new THREE.MeshStandardMaterial({color:C3(0.05,0.55,0.42), roughness:0.42, metalness:0.0,
        transparent:true, opacity:0.62}));
    body.rotation.z=Math.PI/2; cg.add(body);

    var sep = new THREE.Mesh(new THREE.CylinderGeometry(R*1.04, R*1.04, 0.045, 26),
      new THREE.MeshStandardMaterial({color:C3(0.02,0.30,0.26), roughness:0.6,
        transparent:true, opacity:0.90}));
    sep.rotation.z=Math.PI/2; sep.position.x=Lc*0.46; cg.add(sep);
    /* thylakoid: phiến đồng tâm ÁP SÁT MÀNG */
    for(var k=0;k<3;k++){
      var rr=R*(0.92-k*0.13);
      var th=new THREE.Mesh(new THREE.TorusGeometry(rr, 0.022, 8, 40),
        new THREE.MeshStandardMaterial({color:COL.CYANO, roughness:0.30, metalness:0.0,
          emissive:COL.CYANO.clone(), emissiveIntensity:0.30,
          transparent:true, opacity:0.85}));
      th.rotation.y=Math.PI/2; th.position.x=(k-1)*0.20; cg.add(th);
    }
    /* carboxysome đa diện rải rác */
    for(var k=0;k<3;k++){
      var cb=new THREE.Mesh(new THREE.IcosahedronGeometry(0.075,0),
        new THREE.MeshStandardMaterial({color:C3(0.72,0.86,0.52), roughness:0.55,
          transparent:true, opacity:0.80}));
      cb.position.set((seedFn()-0.5)*Lc*0.7,(seedFn()-0.5)*R*0.9,(seedFn()-0.5)*R*0.9);
      cg.add(cb);
    }
    cg.position.x = (i - (nCells-1)/2)*Lc;
    cg.userData.idx=i;
    g.add(cg); cells.push(cg);
  }
  g.userData.cells=cells;
  return g;
}

 * S32 — BA NGHI PHẠM BỊ PHỦ ĐỊNH. Vẽ MỜ, xám hoá, viền ĐỨT NÉT.
 * Kết ở khung TRỐNG — khung trống chính là câu trả lời.
 * ========================================================================== */
var gSusp = G();
var suspects=[];
(function(){
  var titles=['THIÊN THẠCH','SIÊU NÚI LỬA','TIA VŨ TRỤ'];
  for(var i=0;i<3;i++){
    var pg=new THREE.Group();
    /* viền ĐỨT NÉT */
    var w=7.6,h=5.2;
    for(var s=-1;s<=1;s+=2){
      for(var k=0;k<11;k++){
        var seg=lineBox(w/15, 0.040, C3(0.40,0.42,0.46), 0.42);
        seg.position.set(-w/2 + (k+0.5)*(w/11), s*h/2, 0); pg.add(seg);
        var seg2=lineBox(h/8, 0.040, C3(0.40,0.42,0.46), 0.42);
        seg2.rotation.z=Math.PI/2;
        if(k<8) seg2.position.set(s*w/2, -h/2+(k+0.5)*(h/8), 0);
        if(k<8) pg.add(seg2);
      }
    }
    /* nội dung nghi phạm — XÁM HOÁ, không hấp dẫn hơn phần còn lại */
    var body=new THREE.Group();
    if(i===0){
      var rockGeo=new THREE.DodecahedronGeometry(0.85,0);
      var rp=rockGeo.attributes.position;
      for(var v=0;v<rp.count;v++) rp.setXYZ(v, rp.getX(v)*(0.7+rndMisc()*0.6), rp.getY(v)*(0.7+rndMisc()*0.6), rp.getZ(v)*(0.7+rndMisc()*0.6));
      rockGeo.computeVertexNormals();
      var mrock=new THREE.Mesh(rockGeo, new THREE.MeshStandardMaterial({color:C3(0.16,0.15,0.15),
        roughness:0.95, transparent:true, opacity:0.55}));
      body.add(mrock);
      var trail=new THREE.Mesh(new THREE.ConeGeometry(0.34,2.6,14),
        flatMat(C3(0.35,0.32,0.30),0.24));
      trail.rotation.z=Math.PI/2; trail.position.x=1.6; body.add(trail);
    } else if(i===1){
      for(var k=0;k<22;k++){
        var pf=new THREE.Mesh(new THREE.SphereGeometry(0.22+rndMisc()*0.30,10,8),
          flatMat(C3(0.22,0.21,0.20), 0.22));
        pf.position.set((rndMisc()-0.5)*1.9, -1.4+k*0.145+rndMisc()*0.2, (rndMisc()-0.5)*1.2);
        pf.userData.i=k; body.add(pf);
      }
    } else {
      for(var k=0;k<9;k++){
        var ray=lineBox(3.4, 0.045, C3(0.42,0.44,0.50), 0.30);
        ray.rotation.z=Math.PI/2 + (k-4)*0.055;
        ray.position.set((k-4)*0.42, 0.4, 0); ray.userData.i=k; body.add(ray);
      }

    pg.add(body); pg.userData.body=body;
    /* dấu gạch chéo */
    var x1=lineBox(9.0, 0.075, C3(0.72,0.74,0.78), 0.55); x1.rotation.z= 0.60;
    var x2=lineBox(9.0, 0.075, C3(0.72,0.74,0.78), 0.55); x2.rotation.z=-0.60;
    var cross=new THREE.Group(); cross.add(x1); cross.add(x2); cross.position.z=0.3;
    pg.add(cross); pg.userData.cross=cross;
    var tl=textPlane(titles[i], 0.40, 76, '#9AA4B0', 900, 150);
    tl.position.set(0, -h/2-0.62, 0); pg.add(tl);
    body.scale.setScalar(1.75);
    pg.position.set((i-1)*8.4, 0.8, 0);
    gSusp.add(pg); suspects.push(pg);
  }
})();

/* ==========================================================================
 * S33 — SƠ ĐỒ VÒNG BỐN NÚT KHÉP KÍN.
 * ⚠ KHÔNG mũi tên nào đi vào từ ngoài vòng — phải đọc được bằng mắt.
 * ========================================================================== */
var gLoop = G();
var loopNodes=[], loopArrows=[];
(function(){
  var R=4.3;
  var labels=['SỰ SỐNG','LÀM RA CHẤT THẢI','CHẤT THẢI TÍCH LẠI','GIẾT CHÍNH CÁI NỀN'];
  var cols=[COL.CYANO, COL.OXY, COL.OXY, C3(0.72,0.24,0.20)];
  for(var i=0;i<4;i++){
    var th = Math.PI/2 - i*Math.PI/2;
    var ng=new THREE.Group();
    var disc=new THREE.Mesh(new THREE.CircleGeometry(1.15, 40),
      flatMat(cols[i].clone().multiplyScalar(0.30), 0.80));
    disc.material.blending=THREE.NormalBlending;
    ng.add(disc);
    var ring=new THREE.Mesh(new THREE.RingGeometry(1.14,1.24,44),
      flatMat(cols[i], 0.85));
    ring.material.blending=THREE.NormalBlending;
    ng.add(ring);
    /* biểu tượng trong nút */
    if(i===0){
      for(var k=0;k<4;k++){
        var cy=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,0.30,14),
          flatMat(COL.CYANO,0.90));
        cy.material.blending=THREE.NormalBlending;
        cy.rotation.z=Math.PI/2; cy.position.x=(k-1.5)*0.34; ng.add(cy);
      }
    } else if(i===1 || i===2){
      var nb = i===1?4:10;
      for(var k=0;k<nb;k++){
        var bb=new THREE.Mesh(new THREE.CircleGeometry(i===1?0.13:0.10, 16),
          flatMat(COL.OXY, 0.85));
        bb.material.blending=THREE.NormalBlending;
        var aa=k/nb*6.283;
        bb.position.set(Math.cos(aa)*(i===1?0.44:0.52), Math.sin(aa)*(i===1?0.44:0.52), 0.02);
        ng.add(bb);
      }
    } else {
      var sk=lineBox(1.1, 0.065, C3(0.85,0.36,0.28), 0.85); sk.rotation.z=0.72; ng.add(sk);
      var sk2=lineBox(1.1, 0.065, C3(0.85,0.36,0.28), 0.85); sk2.rotation.z=-0.72; ng.add(sk2);
    }
    ng.position.set(Math.cos(th)*R, Math.sin(th)*R, 0);
    var lb=textPlane(labels[i], 0.34, 62, COL.TEXT, 900, 140);
    lb.position.set(0, -1.62, 0.05); ng.add(lb);
    ng.userData.disc=disc; ng.userData.ring=ring;
    gLoop.add(ng); loopNodes.push(ng);
  }
  /* 4 mũi tên cong nối vòng — mũi thứ tư QUAY NGƯỢC VỀ NÚT 1 */
  for(var i=0;i<4;i++){
    var a0 = Math.PI/2 - i*Math.PI/2;
    var a1 = Math.PI/2 - (i+1)*Math.PI/2;
    var ag = new THREE.Group();
    var NS=16;
    for(var k=0;k<NS;k++){
      var u=k/(NS-1);
      var th=a0+(a1-a0)*(0.17+u*0.66);
      var seg=new THREE.Mesh(new THREE.CircleGeometry(0.085, 12),
        flatMat(i===3?C3(0.85,0.30,0.22):C3(0.62,0.78,0.92), 0.82));
      seg.material.blending=THREE.NormalBlending;
      seg.position.set(Math.cos(th)*R, Math.sin(th)*R, 0);
      seg.userData.u=u;
      ag.add(seg);
    }
    /* đầu mũi tên */
    var thE=a0+(a1-a0)*0.84;
    var hd=new THREE.Mesh(new THREE.ConeGeometry(0.20,0.46,14),
      flatMat(i===3?C3(0.85,0.30,0.22):C3(0.62,0.78,0.92), 0.86));
    hd.material.blending=THREE.NormalBlending;
    hd.position.set(Math.cos(thE)*R, Math.sin(thE)*R, 0);
    hd.rotation.z = thE - Math.PI/2 - (a0<a1?0:Math.PI);
    ag.add(hd); ag.userData.head=hd;
    gLoop.add(ag); loopArrows.push(ag);
  }
  var note=textPlane('không một mũi tên nào đi vào từ bên ngoài', 0.32, 58, '#9FB4C8', 1280, 130);
  note.position.set(0,-7.0,0); gLoop.add(note);
})();

function buildMito(sc){
  var g=new THREE.Group();

  var outer=new THREE.Mesh(new THREE.SphereGeometry(1.0,42,28),
    new THREE.MeshStandardMaterial({color:COL.MITO, roughness:0.42, metalness:0.0,
      emissive:COL.MITO.clone(), emissiveIntensity:0.30,
      transparent:true, opacity:0.62, side:THREE.DoubleSide}));
  outer.scale.set(2.2*s, 1.0*s, 1.0*s);
  g.add(outer);
  /* màng TRONG (tách rời màng ngoài — màng kép) */
  var inner=new THREE.Mesh(new THREE.SphereGeometry(0.90,36,24),
    new THREE.MeshStandardMaterial({color:COL.MITO, roughness:0.48,
      transparent:true, opacity:0.30, side:THREE.DoubleSide}));
  inner.scale.set(2.05*s, 0.90*s, 0.90*s);
  g.add(inner);
  /* CRISTAE: phiến gấp nếp dày như răng lược */
  var cristae=[];
  for(var i=0;i<13;i++){
    var u=(i/12-0.5);
    var cr=new THREE.Mesh(new THREE.TorusGeometry(0.72*s, 0.035*s, 6, 26, Math.PI*1.25),
      new THREE.MeshStandardMaterial({color:COL.MITOCR, roughness:0.38,
        emissive:COL.MITOCR.clone(), emissiveIntensity:0.34,
        transparent:true, opacity:0.90}));
    cr.position.x = u*3.6*s;
    cr.scale.y = (0.86 - Math.abs(u)*0.75);
    cr.rotation.y = Math.PI/2;
    cr.rotation.z = (i%2? 0.28 : -0.28);
    g.add(cr); cristae.push(cr);
  }
  /* ADN VÒNG riêng — vòng khép kín, KHÔNG phải sợi thẳng */
  var dnaRing=new THREE.Mesh(new THREE.TorusGeometry(0.40*s, 0.030*s, 8, 46),

  dnaRing.rotation.set(0.6,0.4,0.25);
  dnaRing.position.set(-0.75*s, 0.12*s, 0);
  g.add(dnaRing);
  g.userData.outer=outer; g.userData.inner=inner;
  g.userData.cristae=cristae; g.userData.dna=dnaRing;
  return g;
}

function renderAtTime(t){
  var i,k,w,u,p,q,ph,a,r,d,s,x,y,z;

  for(i=0;i<ALL_GROUPS.length;i++) ALL_GROUPS[i].visible=false;

  var lensVig=0.34, lensGrain=0.042, lensCA=0.0015, lensFlash=0.0, lensExpo=1.04;
  var vigCss=1.0;

  /* trục màu khí quyển — cập nhật mọi shader dùng màu trời */
  var sky = skyColor(t);
  var haze = skyHaze(t);
  skyMat.uniforms.uSky.value.copy(sky);
  skyMat.uniforms.uHaze.value = haze;
  waterMat.uniforms.uSky.value.copy(sky);
  bigBubMat.uniforms.uSky.value.copy(sky);
  bifMat.uniforms.uSky.value.copy(sky);
  bifGroundMat.uniforms.uSky.value.copy(sky);
  snowBg.material.uniforms.uSky.value.copy(sky);
  xsecMat.uniforms.uSky.value.copy(sky);
  earthMat.uniforms.uSkyC.value.copy(sky);
  earthMat.uniforms.uHaze.value = haze;
  earthAtm.material.uniforms.uSkyC.value.copy(sky);
  earthAtm.material.uniforms.uHaze.value = haze;
  handWaterMat.uniforms.uSky.value.copy(sky);
  iceGroundMat.uniforms.uSkyC.value.copy(sky);
  thawMat.uniforms.uSky.value.copy(sky);

  /* =====================================================================
   * SÂN KHẤU BIỂN — S01–S04, S07, S18–S20, S36, S44 (chuyển lên bờ), S55–S57
   * ===================================================================== */
  var wSea = Math.max(
      WR(t,'S01','S04',0.5), WR(t,'S07','S07',0.5),
      WR(t,'S18','S20',0.5), WR(t,'S36','S36',0.5),
      WR(t,'S55','S57',0.5));
  if(wSea>0.004){
    setGroupOp(gSea, wSea);
    ambL.intensity=0.42; keyL.intensity=0.55; rimL.intensity=0.14;

    matFloorMat.uniforms.uT.value=t;

    waterMat.uniforms.uTurb.value=0.0;
    matFloorMat.uniforms.uCover.value=1.0;
    matFloorMat.uniforms.uLight.value=1.0;
    /* nước biển: đục dần khi có hạt gỉ (không dùng ở đây, giữ 0) */

    var camY=0.55, camTarget=new THREE.Vector3(0,0.35,-60), fovS=44;
    var bubRate=1.0, bubAmp=0.30;

    if(inSc(t,'S01')){
      /* camera ĐỨNG YÊN TUYỆT ĐỐI — sự bất động là nội dung */
      u=loc(t,'S01');
      camera.position.set(0, camY, 3.2);
      camTarget.set(0, 0.30, -80);
      bubRate=0.0;
    } else if(inSc(t,'S02')){
      /* pan ngang 40 độ trái→phải, dừng, pan ngược một nửa rồi đứng im */
      u=loc(t,'S02');
      var pan;
      if(u<0.42) pan = -0.35 + eInOut(u/0.42)*0.70;
      else if(u<0.58) pan = 0.35;
      else if(u<0.82) pan = 0.35 - eInOut((u-0.58)/0.24)*0.35;
      else pan = 0.0;
      camera.position.set(0, camY, 3.2);
      camTarget.set(Math.sin(pan)*70, 0.25, -70*Math.cos(pan));
      bubRate=0.15;
    } else if(inSc(t,'S03')){
      /* tilt-down từ chân trời xuống mặt nước ngay dưới chân */

      camera.position.set(0, lerp(camY,0.95,u), lerp(3.2,1.4,u));
      camTarget.set(0, lerp(0.30,-1.6,u), lerp(-70,-0.6,u));
      bubRate=1.0; bubAmp=0.22;

    } else if(inSc(t,'S04')){
      /* tilt-up nhanh lên zenith, 24mm góc rộng */

      camTarget.set(0, lerp(0.0, 42.0, u), lerp(-40, -6.0, u));

    } else if(inSc(t,'S07')){
      /* tilt-down + dolly-in xuyên qua mặt phân cách khí-nước */
      u=eInOut(loc(t,'S07'));
      camera.position.set(0, lerp(1.30,-0.55,u), lerp(3.6,0.9,u));
      camTarget.set(0, lerp(1.0,-2.15,u), lerp(-30,-1.6,u));
      fovS=lerp(46,40,u);
      bubRate=0.85; bubAmp=0.25;
    } else if(inSc(t,'S18')){
      /* timelapse dưới nước nhìn lên, tua nhanh chu kỳ ngày-đêm */
      u=loc(t,'S18');
      camera.position.set(0.4, -1.30, 2.0);

      /* nhịp ngày-đêm nhanh dần — hàm thuần của t */

      u=eInOut(loc(t,'S19'));

      u=eInOut(loc(t,'S20'));

      fovS=lerp(44,30,u);
      bubRate=0.35; bubAmp=0.35;
      vigCss=1.0; lensVig=lerp(0.34,1.32,u);
      lensExpo=lerp(1.04,0.72,u);
      matFloorMat.uniforms.uLight.value = lerp(1.0,0.18,u);
    } else if(inSc(t,'S36')){
      /* tilt-up lên bầu trời cam VẪN NGUYÊN ĐỘ ĐỤC như S04 */
      u=eInOut(loc(t,'S36'));
      camera.position.set(0, camY, 2.8);
      camTarget.set(0, lerp(-0.4, 28.0, u), lerp(-30,-8.0,u));

    } else if(inSc(t,'S55')){
      /* CÚ MÁY CHỮ KÝ 2: theo một bong bóng từ đáy, xuyên mặt nước, ra không khí */
      u=loc(t,'S55');
      var bz = lerp(-2.05, 2.6, eInOut(u));
      camera.position.set(0.30, bz + 0.25, 1.85);

    } else if(inSc(t,'S56')){

    } else if(inSc(t,'S57')){
      /* ngửa mặt lên: trời cam đục ĐANG NHẠT ĐI (nấc 1→2) */
      u=eInOut(loc(t,'S57'));
      camera.position.set(0, camY+0.2, 2.6);
      camTarget.set(0, lerp(8.0, 34.0, u), lerp(-24,-8,u));

    camera.fov=fovS;
    camera.lookAt(camTarget);
    updateBubbles(t, bubRate, bubAmp);
    bubMat.uniforms.uOpacity.value = wSea*(bubRate>0.02?1.0:0.0);
    gRocks.visible = inSc(t,'S02') || inSc(t,'S01');
    /* ⚠ Camera TRÊN mặt nước thì KHÔNG được thấy đáy biển: waterMat có
     * depthWrite:false nên thảm đáy xuyên qua mặt nước thành mảng lục neon
     * kèm đường chân trời đen gãy (đo bằng snapshot 258s/432s).
     * Đáy chỉ hiện khi mắt chìm dưới mặt nước. */
    /* S20 là cú push-in vào MỘT bong bóng, tối dần từ rìa — thấy cả thảm đáy
     * sáng là sai (snapshot 258s). S03/S07 nhìn xuống nước thì cần đáy. */
    var eyeUnder = (camera.position.y < -0.06 && !inSc(t,'S20'))
                || inSc(t,'S18') || inSc(t,'S19') || inSc(t,'S55')
                || inSc(t,'S03') || inSc(t,'S07');
    matFloor.visible = eyeUnder;
    if(!eyeUnder) bubMat.uniforms.uOpacity.value *= 0.55;
  }

  /* =====================================================================
   * S05 / S06 — SƠ ĐỒ THANH KHÍ QUYỂN
   * ===================================================================== */
  var wAtm = WR(t,'S05','S06',0.55);
  if(wAtm>0.004){
    setGroupOp(gAtmBar, wAtm);
    ambL.intensity=0.85; keyL.intensity=0.20; keyL.color.setRGB(1,1,1);
    camera.position.set(0,0.2,17.5); camera.lookAt(0,0.2,0); camera.fov=44;
    /* morph: S05 = cổ đại; S06 = sang hiện đại rồi ĐẢO NGƯỢC trong 0.8s */
    var mk = 0;
    if(inSc(t,'S06')){
      var tl6 = ts(t,'S06');
      var d6 = SC.S06[1]-SC.S06[0];
      if(tl6 < d6*0.52) mk = eInOut(pr01(tl6, d6*0.10, d6*0.50));
      else mk = 1.0 - eInOut(pr01(tl6, d6*0.62, d6*0.62+0.8));
    }
    var xcur = -barW/2;
    for(i=0;i<barSegs.length;i++){
      var sg=barSegs[i];
      var frac = lerp(sg.def.anc, sg.def.mod, mk);
      var wSeg = Math.max(0.020, frac*barW);
      sg.mesh.scale.x = wSeg;
      sg.mesh.position.set(xcur + wSeg/2, 0, 0);
      sg.label.position.set(xcur + wSeg/2, barH/2+0.62, 0.1);
      sg.label.visible = wSeg > 0.55;
      xcur += wSeg;
    }
    /* khung phụ phóng to ô O2 — chỉ ở S05 */
    setGroupOp(gZoomO2, inSc(t,'S05') ? wAtm*smooth(pr01(loc(t,'S05'),0.28,0.60)) : 0);
    /* nền trời nháy từ xanh về cam khi đảo ngược */
    lensExpo = 1.04;
  }

  /* =====================================================================
   * S08 / S09 — BÀN TAY CHẠM THẢM + MẢNH THẢM PHÂN TẦNG

  var wSlab = WR(t,'S08','S09',0.50);
  if(wSlab>0.004){
    setGroupOp(gMatSlab, wSlab);
    /* ⚠ key thấp + rim lạnh: ở 1.05 mảng trên của thảm cháy thành lục neon
     * phẳng (đo bằng snapshot 98s). Sắc đến từ tương phản tầng, không từ đèn. */
    ambL.intensity=0.30; ambL.color.setRGB(0.05,0.09,0.10);
    keyL.intensity=0.62; keyL.color.copy(sky);
    keyL.position.set(-6,7,5); rimL.intensity=0.42; rimL.color.setRGB(0.20,0.48,0.80);

    if(inSc(t,'S08')){
      /* ấn xuống thảm, thảm LÕM rồi đàn hồi (nhớt-đàn hồi) */
      u=loc(t,'S08');
      var press = Math.max(0, Math.sin(clamp((u-0.18)/0.42,0,1)*Math.PI));
      matSlab.position.set(0, -0.24 - press*0.30, 0);
      matSlab.scale.set(1.0+press*0.03, 1.0-press*0.16, 1.0+press*0.03);
      matSlab.rotation.set(-0.30, 0.16+u*0.10, 0.04);

      camera.lookAt(0,-0.35,0);
      camera.fov=lerp(48,40,eInOut(u));
    } else {
      /* tilt-up theo tay nâng mảnh thảm lên khỏi mặt nước */

      } else {
        sb.position.copy(sb.userData.home);
        sb.position.y += Math.sin(t*1.6+ph*13)*0.012;
      }
    }
  }

  /* =====================================================================
   * S10 — MACRO MỘT BONG BÓNG
   * ===================================================================== */
  var wBig = WR(t,'S10','S10',0.50);
  if(wBig>0.004){

    camera.position.set(0, lerp(0.1,0.0,u), lerp(9.0,4.1,u));

    bigBubble.position.set(Math.sin(t*1.25)*0.035, -0.4 + rise*rise*2.4 + Math.sin(t*2.4)*0.02, 0);
    bigBubble.scale.setScalar(1.0 + Math.sin(t*3.1)*0.018);

      io.position.set(Math.sin(t*0.5+ph*10)*0.72, bigBubble.position.y+Math.cos(t*0.42+ph*7)*0.60,
                      Math.sin(t*0.36+ph*13)*0.55);
      io.rotation.set(t*0.22+ph*4, t*0.30+ph*6, 0);
    }
  }

  /* =====================================================================
   * S11 / S35 — SỢI VI KHUẨN LAM
   * ===================================================================== */
  var wFil = Math.max(WR(t,'S11','S11',0.50), WR(t,'S35','S35',0.55));
  if(wFil>0.004){
    setGroupOp(gFil, wFil);
    if(inSc(t,'S35')){
      /* ⚠ PHẢN-TRỰC-GIÁC: ánh sáng ẤM, MỀM, gần như dịu dàng.

      ambL.intensity=0.62; ambL.color.setRGB(0.16,0.14,0.10);
      keyL.intensity=1.05; keyL.color.setRGB(1.00,0.74,0.46); keyL.position.set(-5,4,7);
      rimL.intensity=0.22; rimL.color.setRGB(0.30,0.72,0.58);
    } else {
      ambL.intensity=0.50; ambL.color.setRGB(0.08,0.14,0.13);
      keyL.intensity=0.80; keyL.color.setRGB(0.90,0.95,0.80); keyL.position.set(-3,6,8);
      rimL.intensity=0.35; rimL.color.setRGB(0.20,0.70,0.60);

    if(inSc(t,'S11')){
      u=eInOut(loc(t,'S11'));
      camera.position.set(lerp(-1.2,0.4,u), lerp(1.6,0.30,u), lerp(11.0,4.6,u));
      camera.lookAt(0,0,0); camera.fov=lerp(48,40,u);

    } else {

    var cells=filMain.userData.cells;
    for(i=0;i<cells.length;i++){
      var cg=cells[i];
      var div = 0.5+0.5*Math.sin(t*0.42 + i*0.85);
      cg.scale.set(1.0+div*0.06, 1.0, 1.0);
      cg.position.y = Math.sin(t*0.30 + i*0.55)*0.035;

    filMain.position.y = Math.sin(t*0.22)*0.10;
    /* các sợi khác trượt qua nhau (gliding motility) */
    for(i=0;i<filOthers.length;i++){
      var fo=filOthers[i]; ph=fo.userData.ph;
      fo.position.x = (ph-0.5)*7 + Math.sin(t*0.12+ph*9)*1.6;

    }
    /* bong bóng thoát ra ĐỀU ĐẶN, HIỀN LÀNH */
    for(i=0;i<filBubs.length;i++){
      var fb=filBubs[i]; ph=fb.userData.ph;
      var cy=fract01(ph + t*0.085);
      fb.position.set(fb.userData.x0 + Math.sin(ph*23+t*1.1)*0.10,
                      -0.5 + cy*4.6, Math.cos(ph*17+t*0.8)*0.35);

    }
  }

  /* =====================================================================
   * S12 — PHÂN TỬ NƯỚC ĐƠN ĐỘC (tĩnh tuyệt đối)
   * ===================================================================== */
  var wH2O = WR(t,'S12','S12',0.45);
  if(wH2O>0.004){

    keyL.intensity=0.95; keyL.color.setRGB(0.92,0.94,1.0); keyL.position.set(-4,4,7);

    camera.position.set(0,0,5.4); camera.lookAt(0,0,0); camera.fov=40;

  /* =====================================================================
   * S13 — BA TRẠM NGUỒN ELECTRON CŨ (pan ngang, mỗi trạm dừng ~1s)
   * ===================================================================== */
  var wOld = WR(t,'S13','S13',0.50);
  if(wOld>0.004){
    setGroupOp(gOldSrc, wOld);
    ambL.intensity=0.72; ambL.color.setRGB(0.10,0.17,0.16);
    keyL.intensity=1.05; keyL.color.setRGB(0.70,0.90,0.82); keyL.position.set(0,9,6);
    rimL.intensity=0.45; rimL.color.setRGB(0.70,0.90,0.35);
    u=loc(t,'S13');
    /* pan ngang qua ba trạm, chuyển động ĐỀU như duyệt qua một dãy */
    var panX;
    if(u<0.24) panX = -7.2;
    else if(u<0.38) panX = lerp(-7.2, 0, eInOut((u-0.24)/0.14));
    else if(u<0.60) panX = 0;
    else if(u<0.74) panX = lerp(0, 7.2, eInOut((u-0.60)/0.14));
    else panX = 7.2;
    camera.position.set(panX, 0.4, 8.6);
    camera.lookAt(panX, 0, 0); camera.fov=46;
    /* khói đen cuộn lên ở trạm 1 */
    var st1=oldStations[0];
    for(i=0;i<st1.children.length;i++){
      var ch=st1.children[i];
      if(ch.userData.k!=null && ch.geometry && ch.geometry.type==='SphereGeometry' && ch.material.color.r<0.12){
        ph=ch.userData.ph;
        var cy=fract01(ph + t*0.10);
        ch.position.set(Math.sin(ph*30+cy*6.0)*(0.30+cy*1.3), 0.6+cy*5.2, Math.cos(ph*22+cy*5.0)*(0.25+cy*1.0));

      }
    }
    /* trạm 2: vi khuẩn bơi đuổi theo vệt Fe2+ đậm */
    var st2=oldStations[1];
    for(i=0;i<st2.children.length;i++){
      var ch2=st2.children[i];
      if(ch2.userData.k!=null){
        ph=ch2.userData.ph; k=ch2.userData.k;
        ch2.position.set(Math.sin(t*0.42+k*1.1)*1.9, Math.cos(t*0.33+k*0.8)*1.3, Math.sin(t*0.27+k*1.7)*0.9);
      } else if(ch2.userData.home){
        ph=ch2.userData.ph;
        ch2.position.copy(ch2.userData.home);
        ch2.position.x += Math.sin(t*0.30+ph*21)*0.14;
        ch2.position.y += Math.cos(t*0.25+ph*17)*0.12;
      }
    }
    /* trạm 3: lờ đờ */
    var st3=oldStations[2];
    for(i=0;i<st3.children.length;i++){
      var ch3=st3.children[i];
      if(ch3.userData.home){
        ph=ch3.userData.ph;
        ch3.position.copy(ch3.userData.home);
        ch3.position.x += Math.sin(t*0.09+ph*11)*0.08;
        ch3.position.y += Math.cos(t*0.07+ph*8)*0.06;
      }
    }
  }

  /* =====================================================================
   * S14 — PULL-BACK từ phân tử ra toàn đại dương (hướng 1 trong 4)
   * ===================================================================== */
  var wPull = WR(t,'S14','S14',0.45);
  if(wPull>0.004){
    u=eInOut(loc(t,'S14'));
    /* nửa đầu: phân tử; nửa sau: biển */
    /* chồng lấn RỘNG: nếu phân tử tắt trước khi biển hiện thì có khung chết
     * (đo bằng snapshot ở 172s — khung gần như trống) */
    var kMol = 1.0-smooth(pr01(u,0.42,0.86));
    var kSea = smooth(pr01(u,0.16,0.52));
    if(kMol>0.004){
      setGroupOp(gH2O, wPull*kMol);
      ambL.intensity=0.45; keyL.intensity=0.85; keyL.color.setRGB(0.92,0.94,1.0);
      rimL.intensity=0.50; rimL.color.setRGB(0.24,0.52,0.92);
      h2oCore.rotation.y=t*0.30; h2oCore.rotation.x=0.12;
      h2oCore.scale.setScalar(lerp(1.0, 0.16, smooth(pr01(u,0.10,0.90))));
      h2oHalo.material.opacity = 0.75*wPull*kMol*(1.0-u);
    } else { h2oCore.scale.setScalar(1.0); }
    if(kSea>0.004){
      setGroupOp(gSea, wPull*kSea);
      ambL.intensity=0.42; keyL.intensity=0.55; keyL.color.copy(sky); keyL.position.set(6,9,-14);
      skyMat.uniforms.uT.value=t; waterMat.uniforms.uT.value=t; matFloorMat.uniforms.uT.value=t;
      waterMat.uniforms.uTurb.value=0.0;
      matFloorMat.uniforms.uCover.value=1.0; matFloorMat.uniforms.uLight.value=1.0;
      updateBubbles(t, 0.8, 0.4);
      bubMat.uniforms.uOpacity.value=wPull*kSea;
