    camera.lookAt(0, lerp(0.0,0.6,u), lerp(0,-52,u));
    camera.fov = lerp(36, 62, u);
  }

  /* =====================================================================
   * S15 — CAO TRÀO: CỤM Mn4Ca TÁCH NƯỚC (chu trình 4 nấc S0→S4)
   * ===================================================================== */
  var wMn = WR(t,'S15','S15',0.50);
  if(wMn>0.004){
    setGroupOp(gMn, wMn);
    ambL.intensity=0.40; ambL.color.setRGB(0.09,0.08,0.14);
    keyL.intensity=0.95; keyL.color.setRGB(0.90,0.88,1.0); keyL.position.set(-5,5,7);
    rimL.intensity=0.55; rimL.color.setRGB(0.40,0.30,0.85); rimL.position.set(6,-2,-5);
    u=loc(t,'S15');
    /* dolly-in + xoay quanh cụm 180 độ */
    var orb = eInOut(u)*Math.PI;
    var dist = lerp(9.2, 4.2, eInOut(clamp(u*1.15,0,1)));
    camera.position.set(Math.sin(orb)*dist, lerp(2.2,0.55,eInOut(u)), Math.cos(orb)*dist);
    camera.lookAt(0,0,0); camera.fov=lerp(46,36,eInOut(u));
    /* CHU TRÌNH 4 NẤC: mỗi nấc một photon, O2 bật ra ở nấc cuối */
    var cycT = u*4.35;                     /* 0→4 nấc rồi tới lúc bật O2 */
    var stepN = Math.min(4, Math.floor(cycT));
    var stepF = clamp(cycT-stepN, 0, 1);
    var mnArr = mnCluster.userData.mn;
    for(i=0;i<mnArr.length;i++){
      /* màu Mn sáng dần qua 4 nấc; emissive 0.90 ở đỉnh nấc S4 */
      var lvl = clamp((stepN + stepF)/4, 0, 1);
      var em = 0.16 + lvl*0.74;
      mnArr[i].material.emissiveIntensity = em;
      mnArr[i].material.color.copy(COL.MANGAN).lerp(C3(1.0,0.72,1.0), lvl*0.42);
    }
    /* photon lam bắn vào ở mỗi nấc */
    var pf = stepF;
    mnPhoton.visible = stepN<4 && pf<0.55;
    var pin = clamp(pf/0.55,0,1);
    mnPhoton.position.set(lerp(-7.5,-0.55,eOut(pin)), lerp(4.2,0.35,eOut(pin)), lerp(3.0,0.0,eOut(pin)));
    mnPhoton.material.opacity = wMn*(1.0-pin*0.3);
    /* hai phân tử nước bị kẹp vào ở nấc cuối */
    var wIn = smooth(pr01(cycT, 2.6, 3.9));
    mnW1.visible = wIn>0.02; mnW2.visible = wIn>0.02;
    mnW1.position.set(lerp(3.6,1.05,wIn), lerp(1.6,0.42,wIn), lerp(2.2,0.55,wIn));
    mnW2.position.set(lerp(4.0,1.15,wIn), lerp(-1.8,-0.48,wIn), lerp(-2.0,-0.42,wIn));
    mnW1.rotation.set(t*0.25, t*0.32, 0); mnW2.rotation.set(-t*0.22, t*0.28, 0.4);
    var wOp = 0.9*wMn*wIn*(1.0-smooth(pr01(cycT,4.02,4.20)));
    mnW1.traverse(function(o){ if(o.material&&o.material.transparent) o.material.opacity=wOp; });
    mnW2.traverse(function(o){ if(o.material&&o.material.transparent) o.material.opacity=wOp; });
    /* O2 BẬT RA ở nấc thứ tư */
    var o2K = smooth(pr01(cycT, 4.05, 4.35));
    mnO2Out.visible = o2K>0.01;
    mnO2Out.position.set(lerp(0.9,4.4,o2K), lerp(0.1,2.3,o2K), lerp(0.2,2.0,o2K));
    mnO2Out.rotation.set(t*0.5, t*0.7, 0);
    mnO2Out.traverse(function(o){ if(o.material&&o.material.transparent) o.material.opacity=0.95*wMn*o2K; });
    /* 4 H+ và 4 e- tách theo HAI ĐƯỜNG KHÁC NHAU */
    for(i=0;i<4;i++){
      var kk = smooth(pr01(cycT, 1.0+i*0.75, 2.2+i*0.75));
      mnHplus[i].visible = kk>0.01;
      mnHplus[i].position.set(lerp(0.2,-1.2,kk), lerp(0.0,-3.4-i*0.3,kk), lerp(0.0,1.2,kk));
      mnHplus[i].material.opacity = 0.85*wMn*kk*(1.0-kk*0.45);
      mnElec[i].visible = kk>0.01;
      mnElec[i].position.set(lerp(0.2,4.2+i*0.25,kk), lerp(0.0,1.8,kk), lerp(0.0,-2.4,kk));
      mnElec[i].material.opacity = 0.9*wMn*kk*(1.0-kk*0.45);
    }
    /* flash rất khẽ đúng khoảnh khắc liên kết đứt */
    lensFlash = pulse(cycT, 4.02, 4.22)*0.18;
  }

  /* =====================================================================
   * S16 — NHÂN BẢN CỤM Mn → LÁ XANH (hướng 2: xuyên thời gian ra chiếc lá)
   * S89 — NGƯỢC LẠI: từ tán lá vào tới cụm (hướng 3)
   * ===================================================================== */
  var wLeaf = Math.max(WR(t,'S16','S16',0.50), WR(t,'S89','S89',0.50));
  if(wLeaf>0.004){
    setGroupOp(gLeaf, wLeaf);
    ambL.intensity=0.60; ambL.color.setRGB(0.10,0.16,0.10);
    keyL.intensity=0.95; keyL.color.setRGB(1.0,0.96,0.80); keyL.position.set(-3,6,9);
    rimL.intensity=0.40; rimL.color.setRGB(0.30,0.85,0.35);
    leafMat.uniforms.uT.value=t;
    var isBack = inSc(t,'S89');
    u = isBack ? (1.0-eInOut(loc(t,'S89'))) : eInOut(loc(t,'S16'));
    /* u: 0 = cụm Mn đơn lẻ, 1 = chiếc lá đầy khung */
    leafMn.visible = u<0.78;
    leafMn.scale.setScalar(lerp(1.0, 0.035, smooth(pr01(u,0.0,0.55))));
    leafMn.rotation.set(0.2, t*0.22, 0);
    leafMn.position.set(0,0,lerp(0.9,0.42,u));
    /* nhân bản theo HÀM MŨ THUẦN của u — mọi bản sao giữ ĐÚNG hình học */
    var nShow = Math.pow(2, u*9.4);
    for(i=0;i<hexCopies.length;i++){
      var hx=hexCopies[i];
      var show = (i < nShow) ? 1 : 0;
      hx.visible = show>0 && u>0.10 && u<0.58;
      if(hx.visible){
        var appear = smooth(clamp((nShow-i)/3.0,0,1));
        hx.material.opacity = 0.80*wLeaf*appear*(1.0-smooth(pr01(u,0.40,0.56)));
        hx.scale.setScalar(lerp(0.35,1.0,appear));
        hx.rotation.z = Math.PI/6 + Math.sin(t*0.2+i)*0.03;
      }
    }
    gHexGrid.scale.setScalar(lerp(0.28, 1.35, u));
    leafMat.uniforms.uK.value=u;
    leafMesh.visible = u>0.40;
    leafMesh.material.opacity = 1.0*wLeaf*smooth(pr01(u,0.40,0.66));
    leafMesh.scale.setScalar(lerp(0.62,1.0,smooth(pr01(u,0.40,1.0))));
    camera.position.set(0, 0, lerp(6.2, 12.6, u));
    camera.lookAt(0,0,0); camera.fov=lerp(36,50,u);
  }

  /* =====================================================================
   * S17 — BA LUỒNG SẢN PHẨM: H+ và e- có đích, O2 KHÔNG
   * ===================================================================== */
  var wOut = WR(t,'S17','S17',0.45);
  if(wOut>0.004){
    setGroupOp(gMn, wOut);
    ambL.intensity=0.38; ambL.color.setRGB(0.08,0.08,0.12);
    keyL.intensity=0.80; keyL.color.setRGB(0.88,0.88,1.0); keyL.position.set(-4,4,7);
    rimL.intensity=0.45; rimL.color.setRGB(0.35,0.28,0.80);
    /* TĨNH HOÀN TOÀN — giữ bất động suốt câu */
    camera.position.set(0.8, 0.6, 5.6); camera.lookAt(0,0,0); camera.fov=38;
    u=loc(t,'S17');
    var mnArr2=mnCluster.userData.mn;
    for(i=0;i<mnArr2.length;i++){ mnArr2[i].material.emissiveIntensity=0.30;
      mnArr2[i].material.color.copy(COL.MANGAN); }
    mnPhoton.visible=false; mnW1.visible=false; mnW2.visible=false;
    /* H+ đi VÀO gradient (sáng lên); e- đi VÀO chuỗi vận chuyển (sáng lên) */
    for(i=0;i<4;i++){
      var kk=smooth(pr01(u, 0.10+i*0.055, 0.42+i*0.055));
      mnHplus[i].visible=true;
      mnHplus[i].position.set(lerp(0.2,-2.6,kk), lerp(0.0,-1.4-i*0.22,kk), lerp(0.0,0.9,kk));
      mnHplus[i].material.opacity=0.85*wOut*(0.35+0.65*kk);
      mnElec[i].visible=true;
      mnElec[i].position.set(lerp(0.2,3.0,kk), lerp(0.0,1.3+i*0.2,kk), lerp(0.0,-1.0,kk));
      mnElec[i].material.opacity=0.9*wOut*(0.35+0.65*kk);
    }
    /* O2 — KHÔNG có đường nào đón, trôi ra ngoài khung, MỜ DẦN */
    var o2k=smooth(pr01(u,0.20,1.0));
    mnO2Out.visible=true;
    mnO2Out.position.set(lerp(0.9,0.6,o2k), lerp(0.2,5.6,o2k), lerp(0.2,2.4,o2k));
    mnO2Out.rotation.set(t*0.30,t*0.42,0);
    mnO2Out.traverse(function(o){ if(o.material&&o.material.transparent)
      o.material.opacity=0.95*wOut*(1.0-smooth(pr01(o2k,0.45,1.0))); });
  }

  /* =====================================================================
   * CHƯƠNG 2 — S21: O2 ĐƠN ĐỘC, trạng thái triplet
   * ===================================================================== */
  var wO2 = WR(t,'S21','S21',0.50);
  if(wO2>0.004){
    setGroupOp(gO2, wO2);
    ambL.intensity=0.32; ambL.color.setRGB(0.06,0.08,0.12);
    keyL.intensity=0.70; keyL.color.setRGB(0.80,0.88,1.0); keyL.position.set(-5,3,6);
    rimL.intensity=0.70; rimL.color.setRGB(0.30,0.45,0.95); rimL.position.set(5,-2,-4);
    camera.position.set(0,0,6.4); camera.lookAt(0,0,0); camera.fov=38;
    o2Solo.rotation.set(0.18, t*0.28, 0);
    o2Aura.material.uniforms.uT.value=t;
    o2Aura.rotation.set(t*0.10, -t*0.08, 0);
    /* hai electron độc thân NHẤP NHÁY ở hai cực */
    var el=o2Solo.userData.elec;
    for(i=0;i<el.length;i++){
      var bl = 0.5+0.5*Math.sin(t*4.2 + i*2.1);
      el[i].material.opacity = wO2*(0.35+0.62*bl);
      el[i].scale.setScalar(0.85+bl*0.42);
    }
    lensVig=0.52;
  }

  /* =====================================================================
   * S22 / S24 — BA BẰNG CHỨNG · THANH TỐC ĐỘ
   * ===================================================================== */
  var wThree = WR(t,'S22','S22',0.50);
  var wSpeed = WR(t,'S24','S24',0.50);
  if(wThree>0.004 || wSpeed>0.004){
    var wTot=Math.max(wThree,wSpeed);
    setGroupOp(gThree, wTot);
    ambL.intensity=0.85; ambL.color.setRGB(0.14,0.13,0.13);
    keyL.intensity=0.0; rimL.intensity=0.0;
    panRust.material.uniforms.uT.value=t;
    panFire.material.uniforms.uT.value=t;
    panApple.material.uniforms.uT.value=t;
    if(wThree>=wSpeed){
      /* ba khung chạy CÙNG LÚC, tốc độ rất khác nhau */
      u=loc(t,'S22');
      panRust.material.uniforms.uK.value = smooth(pr01(u,0.10,0.95));
      panFire.material.uniforms.uK.value = smooth(fract01(ts(t,'S22')*0.32));
      panApple.material.uniforms.uK.value= smooth(pr01(u,0.16,0.88));
      panRust.position.x=-6.4; panFire.position.x=0; panApple.position.x=6.4;
      lbSpd1.visible=lbSpd2.visible=lbSpd3.visible=true;
      camera.position.set(0,-0.5,14.2); camera.lookAt(0,-0.5,0); camera.fov=50;
    } else {
      /* S24: split đôi ngang + con trượt tốc độ; hai cảnh HOÁN ĐỔI VAI TRÒ */
      u=loc(t,'S24');
      var sl=eInOut(pr01(u,0.18,0.86));
      /* táo TĂNG TỐC hoá nâu cho tới khi bốc cháy; lửa GIẢM TỐC còn vệt sẫm */
      panApple.material.uniforms.uK.value = clamp(0.20+sl*0.95,0,1.2);
      panFire.material.uniforms.uK.value  = clamp(0.92-sl*0.86,0,1);
      panFire.position.set(0, 4.3, 0); panFire.scale.setScalar(0.82);
      panApple.position.set(0,-4.3, 0); panApple.scale.setScalar(0.82);
      panRust.position.set(0,0,-4); panRust.visible=false;
      lbFire.position.set(-7.0, 4.3, 0.2);
      lbApple.position.set(-7.0,-4.3, 0.2);
      lbRust.visible=false; lbSpd1.visible=false; lbSpd2.visible=false; lbSpd3.visible=false;
      camera.position.set(0,0,15.0); camera.lookAt(0,0,0); camera.fov=48;
    }
  } else {
    panRust.visible=true; panRust.scale.setScalar(1); panFire.scale.setScalar(1);
    panApple.scale.setScalar(1); lbRust.visible=true;
    panFire.position.set(0,0,0); panApple.position.set(6.4,0,0);
    lbFire.position.set(0,-4.95,0.2); lbApple.position.set(6.4,-4.95,0.2);
  }

  /* =====================================================================
   * S23 — CƠ CHẾ CHUNG: electron bị GIẬT về phía oxy, lặp ba lần
   * ===================================================================== */
  var wSteal = WR(t,'S23','S23',0.45);
  if(wSteal>0.004){
    setGroupOp(gSteal, wSteal);
    ambL.intensity=0.55; ambL.color.setRGB(0.10,0.09,0.09);
    keyL.intensity=0.85; keyL.color.setRGB(1.0,0.86,0.70); keyL.position.set(-5,4,7);
    rimL.intensity=0.40; rimL.color.setRGB(0.30,0.60,0.95);
    stealBg.material.uniforms.uT.value=t;
    u=loc(t,'S23');
    camera.position.set(0, 0.4, lerp(15.0, 9.2, eInOut(u)));
    camera.lookAt(0,0.3,0); camera.fov=lerp(48,38,eInOut(u));
    /* ba đối tác khác nhau, CÙNG MỘT ĐỘNG TÁC */
    var rep = u*3.0;
    var ri = Math.min(2, Math.floor(rep));
    var rf = clamp(rep-ri,0,1);
    var pcol=[C3(0.62,0.66,0.72), C3(0.34,0.26,0.16), C3(0.72,0.62,0.40)][ri];
    stealPartner.material.color.copy(pcol);
    /* nguyên tử mất electron: SẪM LẠI, mất ánh kim */
    var lost = smooth(pr01(rf,0.42,0.72));
    stealPartner.material.color.lerp(C3(0.20,0.16,0.14), lost*0.80);
    stealPartner.material.emissive.copy(stealPartner.material.color);
    stealPartner.material.emissiveIntensity = 0.16*(1.0-lost*0.85);
    stealPartner.material.roughness = lerp(0.34,0.92,lost);
    /* electron bay theo QUỸ ĐẠO CONG DỨT KHOÁT, luôn VỀ PHÍA oxy */
    var ek = smooth(pr01(rf,0.20,0.62));
    stealE.visible = rf>0.16 && rf<0.80;
    var ex = lerp(-2.05, 2.15, ek);
    stealE.position.set(ex, Math.sin(ek*Math.PI)*1.35, Math.sin(ek*Math.PI)*0.35);
    stealE.material.opacity = 0.95*wSteal*Math.sin(clamp(rf,0,1)*Math.PI);
    stealO.material.emissiveIntensity = 0.28 + lost*0.30;
    stealO.rotation.y = t*0.4;
    stealArrow.children[0].scale.x = 1.0;
    setGroupOp(stealArrow, wSteal*smooth(pr01(rf,0.15,0.35)));
  }

  /* =====================================================================
   * S25 — TẾ BÀO KỴ KHÍ: cụm Fe-S PHƠI RA khắp nơi
   * ===================================================================== */
  var wAnae = WR(t,'S25','S25',0.50);
  if(wAnae>0.004){
    setGroupOp(gAnae, wAnae);
    ambL.intensity=0.42; ambL.color.setRGB(0.07,0.09,0.14);
    keyL.intensity=0.65; keyL.color.setRGB(0.70,0.80,1.0); keyL.position.set(-6,5,8);
    rimL.intensity=0.35; rimL.color.setRGB(0.95,0.55,0.20);
    anaeCytoMat.uniforms.uT.value=t;
    u=eInOut(loc(t,'S25'));
    /* dolly-in từ ngoài, XUYÊN MÀNG, vào bào tương */
    camera.position.set(lerp(0,1.2,u), lerp(1.0,0.4,u), lerp(21.0, 2.2, u));
    camera.lookAt(0,0,0); camera.fov=lerp(46,52,u);
    anaeMembrane.material.opacity = 0.20*wAnae*(1.0-smooth(pr01(u,0.55,0.85))*0.75);
    /* HIGHLIGHT TUẦN TỰ vài chục cụm — điểm yếu TRẢI KHẮP */
    var hl = u*anaeEnzymes.length*1.3;
    for(i=0;i<anaeEnzymes.length;i++){
      var eg=anaeEnzymes[i]; ph=eg.userData.ph;
      eg.rotation.y = ph*6.28 + t*0.06;
      eg.position.y += Math.sin(t*0.22+ph*11)*0.0;   /* giữ nguyên vị trí */
      var on = clamp((hl-i)/2.5, 0, 1);
      eg.userData.fes.material.emissiveIntensity = 0.45 + on*0.42*(0.6+0.4*Math.sin(t*2.0+i));
    }
  }

  /* =====================================================================
   * S26 / S27 — CAO TRÀO: CỤM [4Fe-4S] BỊ OXY GIẬT
   * ⚠ S27 giữ NGUYÊN KHUNG S26 tuyệt đối — cú giật là thứ duy nhất chuyển động
   * ===================================================================== */
  var wFeS = WR(t,'S26','S27',0.50);
  if(wFeS>0.004){
    setGroupOp(gFeS, wFeS);
    ambL.intensity=0.36; ambL.color.setRGB(0.07,0.08,0.12);
    keyL.intensity=0.90; keyL.color.setRGB(1.0,0.86,0.66); keyL.position.set(-5,4,7);
    rimL.intensity=0.45; rimL.color.setRGB(0.35,0.55,0.95); rimL.position.set(6,-2,-5);
    var inS26 = inSc(t,'S26');
    if(inS26){
      /* push-in macro + xoay 120 độ cho thấy HÌNH HỌC KHỐI */
      u=eInOut(loc(t,'S26'));
      var orb2 = -0.55 + u*(120*Math.PI/180);
      var dist2 = lerp(11.5, 5.0, u);
      camera.position.set(Math.sin(orb2)*dist2, lerp(2.4,0.75,u), Math.cos(orb2)*dist2);
      camera.lookAt(0,0,0); camera.fov=lerp(46,34,u);
      /* lưu khung cuối để S27 GIỮ NGUYÊN */
      feCluster.userData.lastCam = camera.position.clone();
      feCluster.userData.lastFov = camera.fov;
    } else {
      /* S27: KHÔNG ĐỔI GÓC */
      var lc = feCluster.userData.lastCam;
      if(lc) camera.position.copy(lc); else camera.position.set(4.3,0.75,2.5);
      camera.lookAt(0,0,0);
      camera.fov = feCluster.userData.lastFov || 34;
    }
    /* cụm RUNG NHẸ + luồng electron chạy qua liên tục (nó đang chạy tốt) */
    var broken = inS26 ? 0 : smooth(pr01(loc(t,'S27'), 0.40, 0.58));
    feCluster.rotation.set(Math.sin(t*1.6)*0.010, Math.sin(t*1.2)*0.012, Math.sin(t*1.9)*0.009);
    for(i=0;i<feFlow.length;i++){
      var ff=feFlow[i];
      var fu = fract01(i/feFlow.length + t*0.28);
      /* luồng ĐỨT GÃY giữa chừng khi bị giật */
      var cut = broken>0.5 && fu>0.46;
      ff.visible = !cut;
      var ang2 = fu*6.283;
      ff.position.set(Math.cos(ang2)*1.35, Math.sin(ang2*2.0)*0.55, Math.sin(ang2)*1.35);
      ff.material.opacity = 0.9*wFeS*(1.0-broken*0.92);
    }
    /* MỘT electron bị giật khỏi Fe theo ĐƯỜNG THẲNG DỨT KHOÁT */
    var atk = inS26 ? 0 : loc(t,'S27');
    feO2.visible = !inS26;
    var appr = smooth(pr01(atk, 0.06, 0.44));
    feO2.position.set(lerp(6.5,1.35,appr), lerp(1.2,0.32,appr), lerp(2.6,0.55,appr));
    feO2.rotation.set(t*0.3, t*0.4, 0);
    feO2.traverse(function(o){ if(o.material&&o.material.transparent) o.material.opacity=0.95*wFeS; });
    /* O2 → superoxide O2-, màu TÍM NHẠT */
    var sup = smooth(pr01(atk,0.48,0.66));
    var o2at = feO2.userData.atoms;
    for(i=0;i<o2at.length;i++){
      o2at[i].material.color.copy(COL.OXY).lerp(C3(0.62,0.34,0.92), sup);
      o2at[i].material.emissiveIntensity = 0.30 + sup*0.22;
    }
    var stk = smooth(pr01(atk,0.44,0.60));
    feStolenE.visible = atk>0.40 && atk<0.72;
    feStolenE.position.set(lerp(0.58,1.20,stk), lerp(0.55,0.34,stk), lerp(0.58,0.50,stk));
    feStolenE.material.opacity = 1.0*wFeS*Math.sin(clamp((atk-0.40)/0.32,0,1)*Math.PI);
    /* Fe bị giật đổi từ FE-S cam sang NÂU XỈN; cụm MẤT ĐỐI XỨNG, MỘT ĐỈNH SẬP */
    for(i=0;i<feAtoms.length;i++){
      var fa=feAtoms[i];
      if(i===0){
        fa.material.color.copy(COL.FEFE).lerp(COL.BROWNOX, broken);
        fa.material.emissive.copy(COL.FEFE).lerp(COL.BROWNOX, broken);
        fa.material.emissiveIntensity = 0.30*(1.0-broken*0.88);
        fa.position.copy(fa.userData.home).multiplyScalar(1.0 - broken*0.52);
        fa.position.y -= broken*0.34;
      } else {
        fa.material.color.copy(COL.FEFE);
        fa.material.emissiveIntensity = 0.30*(1.0-broken*0.30);
        fa.position.copy(fa.userData.home);
        fa.position.x += broken*Math.sin(i*2.1)*0.10;
        fa.position.z += broken*Math.cos(i*1.7)*0.10;
      }
    }
    for(i=0;i<sAtoms.length;i++){
      sAtoms[i].position.copy(sAtoms[i].userData.home);
      sAtoms[i].position.multiplyScalar(1.0 + broken*0.09*Math.sin(i*1.9));
      sAtoms[i].material.emissiveIntensity=0.24*(1.0-broken*0.35);
    }
    lensFlash = inS26 ? 0 : pulse(atk, 0.44, 0.58)*0.14;
  }

  /* =====================================================================
   * S28 — ENZYME GÃY: pull-back, hàng loạt enzyme khác sụp theo DÂY CHUYỀN
   * ===================================================================== */
  var wBreak = WR(t,'S28','S28',0.45);
  if(wBreak>0.004){
    u=eInOut(loc(t,'S28'));
    /* nửa đầu vẫn là cụm hỏng, nửa sau là toàn tế bào */
    var kFeS = 1.0-smooth(pr01(u,0.26,0.56));
    var kCell = smooth(pr01(u,0.34,0.70));
    ambL.intensity=0.38; ambL.color.setRGB(0.07,0.08,0.12);
    keyL.intensity=0.72; keyL.color.setRGB(0.90,0.76,0.62); keyL.position.set(-5,5,7);
    rimL.intensity=0.35; rimL.color.setRGB(0.40,0.55,0.90);
    if(kFeS>0.004){
      setGroupOp(gFeS, wBreak*kFeS);
      feO2.visible=false; feStolenE.visible=false;
      for(i=0;i<feFlow.length;i++) feFlow[i].visible=false;
      /* cụm vỡ, nguyên tử Fe RỜI RA trôi tự do */
      var bo = smooth(pr01(u,0.0,0.45));
      for(i=0;i<feAtoms.length;i++){
        var fa2=feAtoms[i];
        fa2.material.color.copy(COL.BROWNOX);

    redoxBg.material.uniforms.uT.value=t;

    camera.position.set(0, 0.2, lerp(11.5, 15.5, eInOut(u)));
    camera.lookAt(0,-0.6,0); camera.fov=lerp(38,48,eInOut(u));
    for(i=0;i<redoxFe.length;i++){
      var rf2=redoxFe[i]; ph=rf2.userData.ph;
      /* mỗi hạt có mốc phản ứng riêng */
      var t0f = 0.10 + (i/redoxFe.length)*0.52;
      var react = smooth(pr01(u, t0f, t0f+0.12));
      var sink  = smooth(pr01(u, t0f+0.10, t0f+0.55));
      /* Fe2+ LAO VÀO O2 rồi ĐỔI MÀU sang RUST */
      rf2.material.color.copy(COL.FE2).lerp(COL.RUST, react);
      /* emissive PHAI doi mau theo: atomMesh dat emissive = mau luc dung,
       * neu chi doi .color thi emissive xam-luc cu tron vao -> ra beige
       * (do bang snapshot 478s). */
      rf2.material.emissive.copy(COL.FE2).lerp(COL.RUST, react);
      rf2.material.emissiveIntensity = 0.55 + react*0.55;
      /* chuyển từ khuếch tán Brown sang RƠI CÓ HƯỚNG; kết tụ → to hơn */
      var bx = (ph-0.5)*13.0, by = 3.4 - (ph*2.3);
      var brown = (1.0-react);
      rf2.position.set(
        bx + Math.sin(t*0.55+ph*19)*0.30*brown + react*Math.sin(ph*7)*0.4,
        by + Math.cos(t*0.48+ph*13)*0.26*brown - sink*sink*9.5,
        Math.sin(t*0.36+ph*11)*0.22*brown);
      rf2.scale.setScalar(1.0 + react*0.55 + sink*0.30);
      rf2.material.opacity = wRedox*(1.0 - smooth(pr01(sink,0.85,1.0)));
    }
    for(i=0;i<redoxO2.length;i++){
      var ro=redoxO2[i];
      var t0o = 0.10 + (i/redoxO2.length)*0.52;
      var used = smooth(pr01(u, t0o, t0o+0.12));
      /* bong bóng O2 đang nổi lên BỊ CHẶN GIỮA ĐƯỜNG */
      ro.position.set((i/redoxO2.length-0.5)*11.5, -3.6 + (1.0-used)*(u*5.0), 0.6);
      ro.rotation.set(t*0.3, t*0.4, 0);
      ro.traverse(function(o){ if(o.material&&o.material.transparent)
        o.material.opacity=0.95*wRedox*(1.0-used); });
    }
  }

  /* =====================================================================
   * S41 / S42 — TRẬN TUYẾT SẮT · MẶT CẮT ĐẠI DƯƠNG
   * ===================================================================== */
  var wSnow = WR(t,'S41','S41',0.45);
  if(wSnow>0.004){
    setGroupOp(gSnow, wSnow);
    ambL.intensity=0.36; ambL.color.setRGB(0.09,0.06,0.05);
    keyL.intensity=0.45; keyL.color.copy(sky); keyL.position.set(2,14,4);
    rimL.intensity=0.16; rimL.color.setRGB(0.40,0.45,0.50);
    snowBg.material.uniforms.uT.value=t;
    u=loc(t,'S41');
    /* độ trong của nước GIẢM THẤY RÕ suốt shot */
    var turb = smooth(pr01(u,0.05,0.95));
    snowBg.material.uniforms.uTurb.value=turb;
    /* rơi theo LUẬT STOKES: hạt to rơi nhanh hơn */
    var sp=snowGeo.attributes.position.array;
    for(i=0;i<NSNOW;i++){
      var sph=snowSeed[i*3+1];
      var vfall = 0.06 + snowSz[i]*3.6;
      var cy3 = fract01(sph + t*vfall*0.10);
      sp[i*3]   = snowSeed[i*3] + Math.sin(sph*37 + t*0.9 + cy3*5.0)*0.30;
      sp[i*3+1] = 13.0 - cy3*26.0;
      sp[i*3+2] = snowSeed[i*3+2] + Math.cos(sph*29 + t*0.7)*0.26;
    }
    snowGeo.attributes.position.needsUpdate=true;
    snowMat.uniforms.uOpacity.value = wSnow*(0.25+0.75*turb);
    /* nhìn xuống chân rồi tilt-up chậm nhìn ngang qua cột nước */
    var tilt=eInOut(u);
    /* nhìn xuống chân (nhưng KHÔNG đâm vào lớp trầm tích) rồi tilt-up ngang
     * qua cột nước — chỗ MÀN HẠT dày nhất (snapshot 495s: khung trước bị
     * khối trầm tích đỏ chiếm nửa dưới) */
    camera.position.set(0.3, lerp(-2.2, 1.0, tilt), lerp(5.5, 13.0, tilt));
    camera.lookAt(0, lerp(-7.0, 0.5, tilt), lerp(-3.0, -9.0, tilt));
    camera.fov=lerp(50,46,tilt);
    sedLayer.visible=true;
  }
  var wXsec = WR(t,'S42','S42',0.45);
  if(wXsec>0.004){
    setGroupOp(gXsec, wXsec);
    ambL.intensity=0.75; ambL.color.setRGB(0.12,0.11,0.10);
    keyL.intensity=0.20; rimL.intensity=0.0;
    xsecMat.uniforms.uT.value=t;
    u=loc(t,'S42');
    xsecMat.uniforms.uK.value = smooth(pr01(u,0.06,0.94));
    camera.position.set(0, 0, lerp(21.0, 26.5, eInOut(u)));
    camera.lookAt(0,0,0); camera.fov=lerp(48,54,eInOut(u));
    /* mũi tên lam BỊ CHẶN và ĐỔI MÀU thành đỏ TRƯỚC KHI tới mặt */
    for(i=0;i<xsecArrows.length;i++){
      var ar2=xsecArrows[i];
      var ph2=(i/xsecArrows.length);
      var cy4=fract01(ph2 + t*0.09);
      ar2.position.y = -9.0 + cy4*9.5;
      var blocked = smooth(pr01(cy4, 0.42, 0.62));
      ar2.traverse(function(o){
        if(o.material){
          o.material.color.copy(COL.OXY).lerp(COL.RUST, blocked);
          o.material.opacity = 0.80*wXsec*(1.0 - smooth(pr01(cy4,0.62,0.80)));
        }
      });
      ar2.scale.setScalar(1.0 - blocked*0.35);
    }
    /* đồ thị O2 khí quyển VẪN NẰM BẸP */
    for(i=0;i<o2GraphSegs.length;i++){
      var og=o2GraphSegs[i];
      og.position.set(og.userData.u*5.9, 0.04, 0.05);
      og.material.opacity=0.85*wXsec;
    }
    gO2Graph.visible=true;
  }

  /* =====================================================================
   * S43 — THÙNG RÁC CÓ ĐÁY: trầm tích ngưng, một bong bóng thoát được
   * ===================================================================== */
  var wEsc = WR(t,'S43','S43',0.45);
  if(wEsc>0.004){
    setGroupOp(gEscape, wEsc);
    ambL.intensity=0.42; ambL.color.setRGB(0.07,0.09,0.09);
    keyL.intensity=0.40; keyL.color.setRGB(0.70,0.72,0.75); keyL.position.set(-3,8,6);
    rimL.intensity=0.30; rimL.color.setRGB(0.30,0.60,0.95);
    escapeBg.material.uniforms.uT.value=t;
    u=loc(t,'S43');
    /* trầm tích dày lên CHẬM DẦN rồi NGƯNG */
    escapeBg.material.uniforms.uSed.value = smooth(pr01(u,0.0,0.42));
    /* chấm Fe2+ THƯA HẲN, gần như hết */
    escapeBg.material.uniforms.uFe.value = 1.0 - smooth(pr01(u,0.10,0.66))*0.90;
    /* một bong bóng O2 trôi qua mà KHÔNG BỊ GÌ TÓM LẤY — lần đầu tiên */
    var esc3 = smooth(pr01(u,0.46,1.0));
    escapeBub.visible = u>0.42;
    escapeBub.position.set(lerp(-1.2, 0.8, esc3), lerp(-7.5, 11.0, esc3), 0.5);
    escapeBub.material.opacity = 0.75*wEsc;
    camera.position.set(0,0,13.5); camera.lookAt(0,0,0); camera.fov=42;
  }

  /* =====================================================================
   * CHƯƠNG 3 — S44–S49, S51–S53: VÁCH BIF
   * ⚠ Mọi mỏm đá, mọi bờ biển chương 1–3 TRƠ TRỤI TUYỆT ĐỐI: không rêu,
   *   không địa y, không một mảng xanh nào trên cạn.
   * ===================================================================== */
  var wBIF = Math.max(WR(t,'S44','S49',0.50), WR(t,'S51','S51',0.50));
  if(wBIF>0.004){
    setGroupOp(gBIF, wBIF);
    ambL.intensity=0.44; ambL.color.setRGB(0.12,0.09,0.07);
    keyL.intensity=1.05; keyL.color.copy(sky); keyL.position.set(-26,22,20);
    rimL.intensity=0.20; rimL.color.setRGB(0.35,0.45,0.60);
    bifMat.uniforms.uT.value=t;
    bifGroundMat.uniforms.uT.value=t;
    bifMat.uniforms.uCursor.value=-99.0;
    bifHand.visible=false;
    bifPerson.visible=true;

    if(inSc(t,'S44')){
      /* bước lên bờ: camera đung đưa theo bước chân (hàm sin thuần của t) */
      u=loc(t,'S44');
      var step = Math.sin(ts(t,'S44')*3.0);
      var step2= Math.sin(ts(t,'S44')*6.0);
      /* tilt-down nhìn mặt đất rồi tilt-up ra trước mặt */
      var look = u<0.50 ? lerp(-9.0, -3.0, eInOut(u/0.50)) : lerp(-3.0, 2.6, eInOut((u-0.50)/0.50));
      camera.position.set(step*0.16, 1.72 + step2*0.055, lerp(28.0, 17.0, eInOut(u)));
      camera.lookAt(step*0.35, look, lerp(14.0, -12.0, eInOut(u)));
      camera.fov=48;
      bifPerson.visible=false;
      /* bụi mịn cuốn ngang mặt đất — bằng grain lens nhẹ hơn */
      lensGrain=0.052;
    } else if(inSc(t,'S45')){
      /* tilt-up chậm từ chân vách lên đỉnh, rồi pull-back chứa trọn thung lũng */
      u=loc(t,'S45');
      var ph1 = clamp(u/0.52,0,1), ph2 = clamp((u-0.52)/0.48,0,1);
      camera.position.set(lerp(-3.0,-6.5,eInOut(ph2)), lerp(1.7, 6.5, eInOut(ph2)),
                          lerp(14.0, 46.0, eInOut(ph2)));
      camera.lookAt(lerp(-4.0,0.0,eInOut(ph2)),
                    lerp(1.5, 26.0, eInOut(ph1))*(1.0-ph2*0.55) + ph2*10.0,
                    -26);
      camera.fov=lerp(58,62,ph2);
    } else if(inSc(t,'S46')){
      /* ⭐ CÚ MÁY CHỮ KÝ 1: dolly-in sát mặt vách rồi TILT-UP LIÊN TỤC
       * dọc theo các lớp, chạy từ chân lên đỉnh KHÔNG CẮT */
      u=loc(t,'S46');
      var din = eInOut(clamp(u/0.22,0,1));
      var climb = eInOut(clamp((u-0.18)/0.82,0,1));
      camera.position.set(lerp(-3.0,-0.9,din), lerp(2.2, 1.6+climb*27.0, din*0.35+0.65*climb),
                          lerp(16.0, 4.2, din));
      camera.lookAt(-0.6, lerp(1.6, 30.0, climb), -24.0);
      camera.fov=lerp(56,42,din);
      bifPerson.visible = u<0.20;
    } else if(inSc(t,'S47')){
      /* bàn tay áp lên vách, camera trượt ngang chậm theo tay */
      u=loc(t,'S47');
      bifHand.visible=false;   /* ban tay 3D ra hinh la - de vach da tu noi */
      var slide = lerp(-1.6, 1.6, eInOut(u));
      bifHand.position.set(slide, 8.5 + Math.sin(u*3.0)*0.10, -23.0);
      bifHand.rotation.set(0.05, 0.0, Math.sin(u*2.0)*0.05);
      bifHand.scale.setScalar(1.0);
      camera.position.set(slide*0.85, 8.6, -19.2);
      camera.lookAt(slide, 8.5, -23.0);
      camera.fov=34;
      bifPerson.visible=false;
    } else if(inSc(t,'S49')){
      /* ⭐ pull-back rất dài: macro sọc trên lòng bàn tay → toàn vách → lên cao
       * (hướng 2 trong 4 hướng kéo tỉ lệ: LÊN VÁCH ĐÁ) */
      u=eInOut(loc(t,'S49'));
      bifHand.visible = false;
      bifHand.position.set(0.0, 8.5, -23.0);
      bifHand.scale.setScalar(1.0);
      camera.position.set(lerp(0.0,-8.0,u), lerp(8.55, 34.0, u), lerp(-21.6, 52.0, u));
      camera.lookAt(lerp(0.0,-2.0,u), lerp(8.5, 13.0, u), -25.0);
      camera.fov=lerp(30,62,u);
      bifPerson.visible = u>0.30;
    } else if(inSc(t,'S51')){
      /* dolly ngang qua vách — chuẩn bị cho bản đồ 4 vùng */
      u=eInOut(loc(t,'S51'));
      camera.position.set(lerp(-16.0, 16.0, u), 9.0, 22.0);
      camera.lookAt(lerp(-14.0,14.0,u), 11.0, -25.0);
      camera.fov=56;
    }
    bifMat.uniforms.uCam.value.copy(camera.position);
  }

  /* S48 — SPLIT: trái vách, phải cảnh biển hai pha luân phiên */
  var wCyc = WR(t,'S48','S48',0.45);
  if(wCyc>0.004){
    setGroupOp(gBIF, wCyc);
    setGroupOp(gCycle, wCyc);
    ambL.intensity=0.44; keyL.intensity=1.00; keyL.color.copy(sky);
    keyL.position.set(-26,22,20); rimL.intensity=0.16;
    bifMat.uniforms.uT.value=t;
    bifGroundMat.uniforms.uT.value=t;
    cycleMat.uniforms.uT.value=t;
    bifPerson.visible=false; bifHand.visible=false;
    u=loc(t,'S48');
    /* con trỏ TRƯỢT LÊN dọc vách; mỗi cặp lớp kích hoạt một chu kỳ ở khung phải */
    var cursorY = lerp(5.0, 22.0, u);
    bifMat.uniforms.uCursor.value = cursorY;
    /* hai pha lặp 5–6 lần, THỜI LƯỢNG MỖI PHA HƠI KHÁC NHAU */
    var cyc5 = u*5.6;
    var ci = Math.floor(cyc5);
    var cf = cyc5-ci;
    /* độ dài pha A khác nhau theo ci — đúng với lớp không đều */
    var splitA = 0.42 + 0.16*Math.sin(ci*2.3);
    var phase = cf < splitA ? smooth(pr01(cf, 0, splitA*0.35))
                            : 1.0 - smooth(pr01(cf, splitA, splitA+0.22));
    cycleMat.uniforms.uPhase.value = phase;
    cycleLabA.material.opacity = 0.86*wCyc*phase;
    cycleLabB.material.opacity = 0.86*wCyc*(1.0-phase);
    /* bố cục split: vách bên trái, biển bên phải */
    camera.position.set(-5.0, cursorY-1.0, 13.5);
    camera.lookAt(-5.0, cursorY-1.0, -10.0);
    camera.fov=54;
    gCycle.position.set(-1.0, cursorY-1.0, 2.0);
    gCycle.scale.setScalar(0.62);
    cycleArrow.rotation.z = 0;
    bifMat.uniforms.uCam.value.copy(camera.position);
  } else { gCycle.position.set(0,0,0); gCycle.scale.setScalar(1); }

  /* =====================================================================
   * S50 — NHỊP DỪNG NẶNG NỀ: "và giờ là phần khiến tôi lặng người"
   * ===================================================================== */
  var wPause = WR(t,'S50','S50',0.45);
  if(wPause>0.004){
    setGroupOp(gBIF, wPause);
    ambL.intensity=0.30; ambL.color.setRGB(0.09,0.07,0.06);
    keyL.intensity=0.55; keyL.color.copy(sky); keyL.position.set(-26,18,18);
    rimL.intensity=0.10;
    bifMat.uniforms.uT.value=t; bifGroundMat.uniforms.uT.value=t;
    bifPerson.visible=true; bifHand.visible=false;
    /* gần như tĩnh — shot thở */
    u=loc(t,'S50');
    camera.position.set(-5.5, 5.4+Math.sin(t*0.16)*0.06, 34.0);
    camera.lookAt(-2.0, 9.5, -26.0); camera.fov=54;
    bifMat.uniforms.uCam.value.copy(camera.position);
    lensVig=0.62; lensExpo=0.94;
  }

  /* =====================================================================
   * S52 / S53 — QUẶNG BIF → ĐỒ VẬT THÉP → LUẬN ĐIỂM
   * ===================================================================== */
  var wOre = WR(t,'S52','S52',0.45);
  if(wOre>0.004){
    setGroupOp(gOre, wOre);
    ambL.intensity=0.55; ambL.color.setRGB(0.12,0.12,0.14);
    keyL.intensity=1.00; keyL.color.setRGB(1.0,0.90,0.78); keyL.position.set(-8,9,12);
    rimL.intensity=0.55; rimL.color.setRGB(0.45,0.60,0.90); rimL.position.set(8,-3,-6);
    u=loc(t,'S52');
    /* nửa đầu: bốn vùng quặng; nửa sau: sáu đồ vật thép */
    var kOre = 1.0-smooth(pr01(u,0.30,0.48));
    var kSteel = smooth(pr01(u,0.32,0.54));
    for(i=0;i<oreItems.length;i++){
      var oi=oreItems[i];
      var ap=smooth(pr01(u, 0.03+i*0.05, 0.13+i*0.05));
      setGroupOp(oi, wOre*kOre*ap);
      oi.rotation.y = Math.sin(t*0.22+i)*0.30;
    }
    for(i=0;i<steelItems.length;i++){
      var si=steelItems[i];
      var ap2=smooth(pr01(u, 0.36+i*0.055, 0.46+i*0.055));
      setGroupOp(si, wOre*kSteel*ap2);
      si.rotation.y = Math.sin(t*0.18+i*1.3)*0.34;
      si.rotation.x = Math.sin(t*0.13+i*0.9)*0.10;
      si.scale.setScalar(lerp(1.16,1.45,ap2));
    }
    camera.position.set(0, lerp(2.0,-1.0,eInOut(u)), lerp(20.0, 17.0, eInOut(u)));
    camera.lookAt(0, lerp(1.6,-1.2,eInOut(u)), 0); camera.fov=48;
  }
  var wCiv = WR(t,'S53','S53',0.50);
  if(wCiv>0.004){
    setGroupOp(gCiv, wCiv);
    ambL.intensity=0.80; keyL.intensity=0.0; rimL.intensity=0.0;
    camera.position.set(0,0.6,14.5); camera.lookAt(0,0.6,0); camera.fov=44;
    u=loc(t,'S53');
    var items=gCiv.userData.items;
    for(i=0;i<items.length;i++){
      var ap3=smooth(pr01(u, 0.06+i*0.15, 0.22+i*0.15));
      items[i].material.opacity = 0.86*wCiv*ap3;
      items[i].position.y = items[i].position.y;
      items[i].scale.setScalar(lerp(0.94,1.0,ap3));
    }
    lensVig=0.52;
  }

  /* =====================================================================
   * S54 — SẮT BỊ DÙNG HẾT, từng nguyên tử một
   * ===================================================================== */
  var wDeplete = WR(t,'S54','S54',0.45);
  if(wDeplete>0.004){
    setGroupOp(gEscape, wDeplete);
    ambL.intensity=0.42; ambL.color.setRGB(0.07,0.09,0.09);
    keyL.intensity=0.36; keyL.color.setRGB(0.66,0.70,0.74); keyL.position.set(-3,8,6);
    rimL.intensity=0.20; rimL.color.setRGB(0.30,0.55,0.80);
    escapeBg.material.uniforms.uT.value=t;
    u=loc(t,'S54');
    escapeBg.material.uniforms.uSed.value = 0.42 + smooth(pr01(u,0.0,0.9))*0.30;
    /* từng nguyên tử một, nó BỊ DÙNG HẾT */
    escapeBg.material.uniforms.uFe.value = 1.0 - smooth(pr01(u,0.05,0.95))*0.96;
    escapeBub.visible=false;
    camera.position.set(0,0,lerp(12.5,15.0,eInOut(u)));
    camera.lookAt(0,0,0); camera.fov=lerp(40,46,eInOut(u));
  }

  /* =====================================================================
   * S56 — HÀNG TỈ TỈ: dòng bong bóng dồn lên trời + đồ thị DỐC LÊN
   * ===================================================================== */
  var wFlood = WR(t,'S56','S56',0.45);
  if(wFlood>0.004){
    setGroupOp(gFlood, wFlood);
    /* chồng lên sân khấu biển (wSea đã bật ở trên) */
    u=loc(t,'S56');
    /* "rồi một, rồi một nghìn, rồi hàng tỉ tỉ" — số hạt hiện tăng theo hàm mũ */
    var nVis = Math.floor(Math.pow(u,2.4)*NFL);
    var fp=flGeo.attributes.position.array;
    for(i=0;i<NFL;i++){
      if(i>=nVis){ fp[i*3+1] = -999; continue; }
      var fph=flSeed[i*3+1];
      var fcy=fract01(fph + t*(0.055+flSz[i]*1.8));
      fp[i*3]   = flSeed[i*3] + Math.sin(fph*41+t*0.9)*0.35;
      fp[i*3+1] = -2.0 + fcy*16.0;
      fp[i*3+2] = flSeed[i*3+2] + Math.cos(fph*33+t*0.7)*0.30;
    }
    flGeo.attributes.position.needsUpdate=true;
    floodMat.uniforms.uOpacity.value=wFlood;
    /* đồ thị O2 BẮT ĐẦU DỐC LÊN */
    var gk=smooth(pr01(u,0.22,0.98));
    for(i=0;i<riseSegs.length;i++){
      var rs=riseSegs[i];

  /* S63 — "Cái vòng đó không có phanh" (sơ đồ vòng albedo) */

  var wEn = WR(t,'S72','S73',0.48);

    sugarR.rotation.set(-0.2, -t*0.20, 0);

    for(i=0;i<atpResp.length;i++){

  var wLake = WR(t,'S88','S88',0.45);
  if(wLake>0.004){
    setGroupOp(gBloom, wLake);
    ambL.intensity=0.58; ambL.color.setRGB(0.14,0.16,0.12);
    keyL.intensity=0.70; keyL.color.setRGB(1.0,0.96,0.80); keyL.position.set(-5,9,7);
    rimL.intensity=0.20; rimL.color.setRGB(0.30,0.70,0.60);
    bloomLakeMat.uniforms.uT.value=t;
    u=eInOut(loc(t,'S88'));
    camera.position.set(lerp(-2.0,2.0,u), lerp(6.5,3.6,u), lerp(16.0,11.0,u));
    camera.lookAt(0,0,-2.0); camera.fov=lerp(52,46,u);
  }

  /* S90 — hơi thở sâu, cảm giác nhẹ nhõm */
  var wDeep = WR(t,'S90','S90',0.48);
  if(wDeep>0.004){
    setGroupOp(gTwoViews, wDeep*0.0);
    setGroupOp(gRoom, wDeep);
    ambL.intensity=0.34; ambL.color.setRGB(0.10,0.09,0.09);
    keyL.intensity=0.88; keyL.color.setRGB(1.0,0.80,0.58); keyL.position.set(-9,7,8);
    rimL.intensity=0.26; rimL.color.setRGB(0.32,0.52,0.85);
    roomWall.material.uniforms.uT.value=t;
    u=loc(t,'S90');
    var bph = Math.sin(ts(t,'S90')*0.38);
    var bkk = 0.5+0.5*bph;
    roomPerson.userData.torso.scale.set(1.0+bkk*0.085, 1.0+bkk*0.04, 1.0+bkk*0.085);
    var bp3=brGeo.attributes.position.array;
    for(i=0;i<NBR;i++){
      var c1=brSeed[i*3], c2=brSeed[i*3+1], c3=brSeed[i*3+2];
      var flw=fract01(c1 + t*(0.048+brSz[i]*1.0)*(bph>0?1.0:-1.0)+(bph>0?0:0.5));
      var spr=0.35+flw*2.2;
      bp3[i*3]  = -5.4 + (1.0-flw)*7.0 + Math.sin(c2*29+t*0.7)*spr*0.30;
      bp3[i*3+1]=  0.9 + Math.sin(c3*23+t*0.55)*spr*0.34 - flw*0.45;
      bp3[i*3+2]= -3.4 + flw*7.0 + Math.cos(c2*17+t*0.45)*spr*0.26;
    }
    brGeo.attributes.position.needsUpdate=true;
    breathMat.uniforms.uOpacity.value = wDeep*(0.30+0.70*Math.abs(bph));
    camera.position.set(0.3, -0.1, lerp(9.4, 7.8, eInOut(u)));
    camera.lookAt(-5.2,-0.4,-4.0); camera.fov=44;
    lensVig=0.54;
  }

  /* S91 — "Thứ đang nuôi bạn từng là thứ đã giết..." */
  var wFK = WR(t,'S91','S91',0.45);
  if(wFK>0.004){
    setGroupOp(gFeedKill, wFK);
    ambL.intensity=0.76; keyL.intensity=0.0; rimL.intensity=0.0;
    u=loc(t,'S91');
    var fi2=gFeedKill.userData.items;
    for(i=0;i<fi2.length;i++){
      var apB=smooth(pr01(u, 0.08+i*0.22, 0.32+i*0.22));
      fi2[i].material.opacity=0.86*wFK*apB;
    }
    camera.position.set(0,0.4,13.4); camera.lookAt(0,0.4,0); camera.fov=44;
    lensVig=0.50;
  }

  /* S92 — "vẫn gỉ sắt, vẫn đốt gỗ, vẫn làm hỏng tế bào" */
  var wStill = WR(t,'S92','S92',0.45);
  if(wStill>0.004){
    setGroupOp(gStill, wStill);
    ambL.intensity=0.80; ambL.color.setRGB(0.13,0.12,0.12);
    keyL.intensity=0.0; rimL.intensity=0.0;
    u=loc(t,'S92');
    for(i=0;i<stillPanels.length;i++){
      var sp3=stillPanels[i];
      sp3.userData.pn.material.uniforms.uT.value=t;
      sp3.userData.pn.material.uniforms.uK.value = smooth(pr01(u, 0.05+i*0.10, 0.85));
      var apC=smooth(pr01(u, 0.03+i*0.12, 0.20+i*0.12));
      setGroupOp(sp3, wStill*apC);
    }
    camera.position.set(0,0.2,17.5); camera.lookAt(0,0.2,0); camera.fov=48;
  }

  /* S93 — "Cái thay đổi không phải là oxy. Cái thay đổi là BẠN." */
  var wChg = WR(t,'S93','S93',0.45);
  if(wChg>0.004){
    setGroupOp(gChanged, wChg);
    ambL.intensity=0.78; keyL.intensity=0.0; rimL.intensity=0.0;
    u=loc(t,'S93');
    var gi=gChanged.userData.items;
    for(i=0;i<gi.length;i++){
      var apD=smooth(pr01(u, 0.10+i*0.26, 0.34+i*0.26));
      gi[i].material.opacity=0.86*wChg*apD;
      gi[i].scale.setScalar(lerp(0.93,1.0,apD));
    }
    camera.position.set(0,0.2,13.0); camera.lookAt(0,0.2,0); camera.fov=44;
    lensVig=0.48;
  }

  /* S96 — "Và bạn vừa thắng thêm một hiệp nữa." */
  var wWin = WR(t,'S96','S96',0.50);
  if(wWin>0.004){
    setGroupOp(gWin, wWin*0.96);
    u=loc(t,'S96');
    var wi=gWin.userData.items;
    for(i=0;i<wi.length;i++){
      var apE=smooth(pr01(u, 0.10+i*0.24, 0.40+i*0.24));
      wi[i].material.opacity=0.86*wWin*apE;
    }
    /* đặt chữ trước camera của căn phòng */
    gWin.position.copy(camera.position);
    gWin.quaternion.copy(camera.quaternion);
    gWin.translateZ(-10.0);
    lensVig=0.56;
  } else { gWin.position.set(0,0,0); gWin.quaternion.identity(); }

  /* =====================================================================
   * PHỤ ĐỀ · NHÃN CHƯƠNG · HẬU KỲ
   * ===================================================================== */
  HFA.applySubtitle(elSub, CUES, t);
  if(t > 1071.8) elSub.textContent='';
  HFA.applyChapter(elChap, CHAPS, t, 5.5);

  var fadeK = HFA.globalFade(t, TOTAL, 2.0, 3.4);
  lens.uniforms.uT.value = t;
  lens.uniforms.uFade.value = fadeK;
  lens.uniforms.uExposure.value = lensExpo;
  lens.uniforms.uVig.value = lensVig;
  lens.uniforms.uGrain.value = lensGrain;
  lens.uniforms.uCA.value = lensCA;
  lens.uniforms.uFlash.value = lensFlash;
  if(elVig) elVig.style.opacity = lensVig>0.70 ? '0' : '1';

  camera.updateProjectionMatrix();
  composer.render();
}

/* ---- ĐĂNG KÝ TIMELINE ---------------------------------------------------
 * Dòng dưới phải nằm NGUYÊN DẠNG trong file này: StaticGuard quét VĂN BẢN.
 * Khoá phải trùng ĐÚNG data-composition-id của div gốc.
 */
window.__timelines = window.__timelines || {};
window.__timelines["dai-oxy-hoa"] = HFA.makeTimeline("dai-oxy-hoa", TOTAL, renderAtTime);

</script>
