<script>
/* ===== HFA:BEGIN — sinh tự động bởi scripts/inject-lib.mjs, ĐỪNG SỬA TAY ===== */
/* ============================================================================
 * hf-astro.js — bộ khung dùng chung cho composition Du Mục Vũ Trụ
 *
 * Trích từ các tập ĐÃ RENDER VÀ VERIFY (01–07). Trước khi có file này, mỗi tập
 * tự dựng lại cùng một đoạn code (mulberry32, ACESFilmic, composer+bloom, lens
 * pass, starfield, tra phụ đề, driver timeline) — nên bug đã sửa ở tập này lại
 * tái xuất ở tập sau. Dùng file này thay vì chép tay.
 *
 * CÁCH DÙNG: KHÔNG nạp bằng thẻ script ngoài. Preview/render server của HyperFrames
 *      không phục vụ file .js tuỳ ý trong project — nó trả về SPA shell HTML cho
 *      đường dẫn đó, browser parse "doctype html" thành lỗi cú pháp và tập chết
 *      (đã kiểm chứng: curl -D- trả về 200 text/html, 593 byte). Composition phải
 *      TỰ CHỨA. Nhúng bằng:
 *
 *          node scripts/inject-lib.mjs --html index.html
 *
 *      Lệnh này dán nội dung file này vào đầu khối code của tập, giữa hai mốc
 *      HFA:BEGIN / HFA:END. Chạy lại được nhiều lần. Định nghĩa một global: HFA.
 *      Yêu cầu three.min.js + EffectComposer/RenderPass/ShaderPass/UnrealBloomPass
 *      đã nạp trước đó.
 *
 * LUẬT TẤT ĐỊNH: file này không dùng Date.now / performance.now / Math.random /
 * requestAnimationFrame / setTimeout. Mọi thứ là hàm thuần của t hoặc của seed.
 * ========================================================================== */
(function (global) {
  'use strict';

  var HFA = {};

  /* ---- PRNG có seed ------------------------------------------------------
   * Math.random() bị cấm (render phải tất định). Mỗi cụm vật thể dùng MỘT
   * seed riêng — dùng chung một chuỗi cho hai cụm thì thêm/bớt hạt ở cụm này
   * sẽ xê dịch layout cụm kia.
   */
  HFA.mulberry32 = function (a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  /* ---- helper toán -------------------------------------------------------- */
  HFA.clamp = function (x, a, b) { return Math.min(b, Math.max(a, x)); };

  HFA.smooth = function (x) { x = HFA.clamp(x, 0, 1); return x * x * (3 - 2 * x); };

  /** Bao lồi mềm: 0 ngoài [a,b], lên/xuống mượt trong dải f giây ở hai mép. */
  HFA.band = function (t, a, b, f) {
    f = f || 0.8;
    if (t < a - f || t > b + f) return 0;
    var up = HFA.smooth((t - (a - f)) / (2 * f));
    var dn = HFA.smooth(((b + f) - t) / (2 * f));
    return Math.min(1, Math.min(up, dn));
  };

  /* ---- cửa sổ cảnh --------------------------------------------------------
   * SC = {A:[start,end], B:[...], ...} theo GIÂY THẬT (lấy từ timing.json cue.start).
   * Trả về loc(t,k) ∈ [0,1] (tiến độ trong cảnh) và inSc(t,k).
   */
  HFA.scenes = function (SC) {
    return {
      SC: SC,
      loc: function (t, k) {
        var w = SC[k];
        return Math.min(1, Math.max(0, (t - w[0]) / (w[1] - w[0])));
      },
      inSc: function (t, k) { var w = SC[k]; return t >= w[0] && t < w[1]; }
    };
  };

  /* ---- shader lens — PASS CUỐI, kiêm luôn tone mapping + mã hoá sRGB --------
   *
   * ⚠ VÌ SAO PASS NÀY PHẢI TỰ TONE MAP:
   * three.js chỉ chèn ACES + sRGB vào shader của VẬT LIỆU nó tự dựng. Một
   * ShaderMaterial thô trong ShaderPass KHÔNG được chèn — nên khi pass cuối ghi
   * ra màn hình, ảnh chưa hề được mã hoá sRGB.
   * Đo thật (xám #808080, r128): vẽ thẳng = 197, qua EffectComposer = 143.
   * Sai lệch đó là lý do các tập 01–07 ra tối hơn và sai gamma.
   *
   * Vì vậy chuỗi mới là: cảnh vẽ TUYẾN TÍNH vào target HDR (không tone map)
   * → bloom ăn giá trị HDR thật → pass này mới ACES + sRGB ở bước cuối.
   * Bloom đứng TRƯỚC tone mapping mới đúng thứ tự điện ảnh: vùng cực sáng
   * (quang cầu, đĩa bồi tụ) chưa bị nén ngọn nên quầng sáng nở tự nhiên.
   *
   * Thứ tự trong shader: CA → vignette → fade (đều ở TUYẾN TÍNH, vì chúng là
   * phơi sáng) → ACES → sRGB → grain + flash (ở không gian hiển thị, vì grain
   * phim và chớp trắng là hiện tượng của bản in, không phải của ánh sáng).
   * Grain seed theo t, KHÔNG theo đồng hồ — cùng t phải cho cùng frame.
   */
  HFA.LensShader = {
    uniforms: {
      tDiffuse: { value: null }, uT: { value: 0 }, uVig: { value: 0.34 },
      uCA: { value: 0.0015 }, uGrain: { value: 0.045 },
      uFade: { value: 1.0 }, uFlash: { value: 0.0 },
      uExposure: { value: 1.02 }, uToneMap: { value: 1.0 }
    },
    vertexShader:
      'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader: [
      'varying vec2 vUv;uniform sampler2D tDiffuse;',
      'uniform float uT,uVig,uCA,uGrain,uFade,uFlash,uExposure,uToneMap;',
      'float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}',
      // ACES — SAO CHÉP ĐÚNG bản three.js r128 dùng cho ACESFilmicToneMapping
      // (ma trận vào/ra + RRTAndODTFit + tiền tỉ lệ /0.6). KHÔNG dùng xấp xỉ
      // Narkowicz: nó sáng hơn ~4% ở vùng trung, đo được (206 vs 197 trên xám
      // giữa) và sẽ lệch với mọi tài liệu/preset tính theo three.js.
      'vec3 rrt(vec3 v){vec3 a=v*(v+0.0245786)-0.000090537;',
      '  vec3 b=v*(0.983729*v+0.4329510)+0.238081;return a/b;}',
      'vec3 aces(vec3 color){',
      '  const mat3 mIn=mat3(0.59719,0.07600,0.02840, 0.35458,0.90834,0.13383, 0.04823,0.01566,0.83777);',
      '  const mat3 mOut=mat3(1.60475,-0.10208,-0.00327, -0.53108,1.10813,-0.07276, -0.07367,-0.00605,1.07602);',
      '  color/=0.6;',
      '  color=mIn*color; color=rrt(color); color=mOut*color;',
      '  return clamp(color,0.0,1.0);}',
      // tuyến tính → sRGB, đúng công thức chuẩn (không phải pow(1/2.2) cho nhanh)
      'vec3 toSRGB(vec3 c){c=max(c,vec3(0.0));',
      '  return mix(c*12.92,1.055*pow(c,vec3(1.0/2.4))-0.055,step(vec3(0.0031308),c));}',
      'void main(){',
      '  vec2 d=vUv-0.5;float r=dot(d,d);',
      '  vec2 off=d*uCA*(1.0+r*2.2);',
      '  vec3 col;',
      '  col.r=texture2D(tDiffuse,vUv+off).r;',
      '  col.g=texture2D(tDiffuse,vUv).g;',
      '  col.b=texture2D(tDiffuse,vUv-off).b;',
      // --- còn ở TUYẾN TÍNH: vignette + fade là phơi sáng ---
      '  float vig=smoothstep(1.02,uVig,r*2.0);',
      '  col*=mix(1.0,vig,0.85);',
      '  col*=uFade;',
      // --- tone map + mã hoá hiển thị ---
      '  col=mix(col*uExposure,aces(col*uExposure),uToneMap);',
      '  col=toSRGB(col);',
      // --- không gian hiển thị: grain + chớp trắng ---
      '  float g=h(vUv*vec2(1920.0,1080.0)+fract(uT)*97.3)-0.5;',
      '  col+=g*uGrain;',
      '  col=mix(col,vec3(1.0,0.98,0.94),uFlash);',
      '  gl_FragColor=vec4(clamp(col,0.0,1.0),1.0);',
      '}'
    ].join('\n')
  };

  /* ---- dựng sân khấu ------------------------------------------------------
   * Trả về {renderer, scene, camera, composer, bloom, lens, W, H, loadTex}.
   * Ánh sáng mặc định (amb/key/rim) tắt được bằng opt.lights=false.
   */
  HFA.createStage = function (opt) {
    opt = opt || {};
    var W = opt.width || 1920, H = opt.height || 1080;
    var canvas = typeof opt.canvas === 'string'
      ? document.getElementById(opt.canvas)
      : (opt.canvas || document.getElementById('c'));

    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(1);
    renderer.setSize(W, H);
    renderer.setClearColor(opt.clearColor != null ? opt.clearColor : 0x08080a, 1);

    // Tone mapping + sRGB CỐ Ý tắt ở đây: cả hai được làm ở pass lens cuối cùng.
    // Bật ở đây thì cảnh bị nén dải TRƯỚC khi bloom nhìn thấy (quầng sáng bẹt),
    // rồi lại không được mã hoá sRGB lúc ghi ra màn hình (xem chú thích LensShader).
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.outputEncoding = THREE.LinearEncoding;

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(
      opt.fov || 46, W / H, opt.near || 0.05, opt.far || 60000);
    camera.position.set(0, 0, 60);

    if (opt.lights !== false) {
      var amb = new THREE.AmbientLight(0x232838, 0.85); scene.add(amb);
      var key = new THREE.DirectionalLight(0xffe8d2, 1.05); key.position.set(6, 4, 8); scene.add(key);
      var rim = new THREE.DirectionalLight(0x6f9cff, 0.4); rim.position.set(-8, -3, -6); scene.add(rim);
      scene.userData.lights = { amb: amb, key: key, rim: rim };
    }

    /* --- render target: MSAA + HDR -------------------------------------------
     * `antialias:true` ở trên CHỈ tác dụng lên framebuffer mặc định. Đi qua
     * EffectComposer là vẽ vào target offscreen, và target đó KHÔNG multisample
     * theo mặc định — nên cờ antialias thành vô nghĩa và mọi rìa bị răng cưa.
     * WebGLMultisampleRenderTarget (có từ r111) khôi phục MSAA thật.
     * HalfFloat giữ giá trị >1.0 để bloom ăn được highlight HDR thật.
     */
    var samples = opt.msaa != null ? opt.msaa : 4;
    var rtOpts = {
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat,
      type: opt.hdr === false ? THREE.UnsignedByteType : THREE.HalfFloatType
    };
    var rt;
    if (samples > 0 && typeof THREE.WebGLMultisampleRenderTarget === 'function') {
      rt = new THREE.WebGLMultisampleRenderTarget(W, H, rtOpts);
      rt.samples = samples;
    } else {
      rt = new THREE.WebGLRenderTarget(W, H, rtOpts);
      if (samples > 0) console.warn('[hf-astro] không có WebGLMultisampleRenderTarget — chạy không MSAA.');
    }

    var composer = new THREE.EffectComposer(renderer, rt);
    composer.addPass(new THREE.RenderPass(scene, camera));

    /* Ngưỡng bloom: cảnh giờ là HDR TUYẾN TÍNH, không còn bị nén về [0,1] như
     * trước. Highlight thật nằm TRÊN 1.0, nên ngưỡng cũ 0.62 (chỉnh cho ảnh đã
     * tone map) sẽ làm cả những vùng sáng vừa cũng loé. Mặc định nâng lên 1.0. */
    var bloom = new THREE.UnrealBloomPass(
      new THREE.Vector2(W, H),
      opt.bloomStrength != null ? opt.bloomStrength : 0.78,
      opt.bloomRadius != null ? opt.bloomRadius : 0.7,
      opt.bloomThreshold != null ? opt.bloomThreshold : (opt.hdr === false ? 0.62 : 1.0));
    composer.addPass(bloom);

    // Bản sao uniforms để hai stage không dùng chung state.
    var lensDef = {
      uniforms: THREE.UniformsUtils.clone(HFA.LensShader.uniforms),
      vertexShader: HFA.LensShader.vertexShader,
      fragmentShader: HFA.LensShader.fragmentShader
    };
    var lens = new THREE.ShaderPass(lensDef);
    lens.renderToScreen = true;
    lens.uniforms.uExposure.value = opt.exposure != null ? opt.exposure : 1.02;
    composer.addPass(lens);

    var texLoader = new THREE.TextureLoader();
    texLoader.setCrossOrigin('anonymous');
    function loadTex(path, enc) {
      var tx = texLoader.load(path);
      if (enc) tx.encoding = enc;
      tx.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return tx;
    }

    var stage = {
      renderer: renderer, scene: scene, camera: camera,
      composer: composer, bloom: bloom, lens: lens, rt: rt,
      W: W, H: H, loadTex: loadTex,
      clearColor: opt.clearColor != null ? opt.clearColor : 0x08080a
    };

    /* --- environment map (IBL) ----------------------------------------------
     * MeshStandardMaterial là vật liệu PBR: nó phản xạ MÔI TRƯỜNG. Không có
     * envMap thì kim loại và bề mặt bóng mất gần hết thông tin phản xạ, chỉ còn
     * highlight từ đèn → ra chất nhựa sơn. (Tập "Vàng" là ví dụ rõ nhất.)
     * Dựng một bầu trời tối có vài đốm sáng, nướng qua PMREM MỘT LẦN lúc khởi
     * tạo → tất định, không phụ thuộc t, mọi MeshStandardMaterial hưởng ngay
     * qua scene.environment mà không phải sửa từng vật liệu.
     */
    if (opt.environment !== false) {
      stage.environment = HFA.buildEnvironment(renderer, scene, opt.environmentSeed || 4242);
    }

    return stage;
  };

  /** Bầu trời sao mờ nướng thành envMap PMREM. Trả về texture (đã gán scene.environment). */
  HFA.buildEnvironment = function (renderer, scene, seed) {
    var pr = HFA.mulberry32(seed);
    var cv = document.createElement('canvas');
    cv.width = 512; cv.height = 256;
    var cx = cv.getContext('2d');

    // nền: gradient rất tối, hơi lạnh ở dưới, ấm nhạt ở trên (ánh sáng thiên hà)
    var gr = cx.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, '#0a0d16'); gr.addColorStop(0.5, '#070910'); gr.addColorStop(1, '#05060b');
    cx.fillStyle = gr; cx.fillRect(0, 0, 512, 256);

    // dải Ngân Hà mờ vắt ngang → cho phản xạ có hướng, tránh env phẳng lì
    var bandGr = cx.createLinearGradient(0, 96, 0, 160);
    bandGr.addColorStop(0, 'rgba(70,80,110,0)');
    bandGr.addColorStop(0.5, 'rgba(120,130,165,0.30)');
    bandGr.addColorStop(1, 'rgba(70,80,110,0)');
    cx.fillStyle = bandGr; cx.fillRect(0, 96, 512, 64);

    // vài nguồn sáng nhỏ để kim loại có điểm loé
    for (var i = 0; i < 220; i++) {
      var x = pr() * 512, y = pr() * 256, s = pr() < 0.06 ? 2.2 : 1.0;
      var b = 0.35 + pr() * 0.65;
      cx.fillStyle = 'rgba(255,252,245,' + b.toFixed(3) + ')';
      cx.fillRect(x, y, s, s);
    }

    var tex = new THREE.CanvasTexture(cv);
    tex.mapping = THREE.EquirectangularReflectionMapping;
    tex.encoding = THREE.sRGBEncoding;

    var pmrem = new THREE.PMREMGenerator(renderer);
    pmrem.compileEquirectangularShader();
    var env = pmrem.fromEquirectangular(tex).texture;
    pmrem.dispose();
    tex.dispose();

    scene.environment = env;   // KHÔNG gán scene.background — nền do starfield lo
    return env;
  };

  /* ---- CHỌN MÀU SAO CHO SỐNG SÓT QUA ACES ---------------------------------
   * Bài học đo được ở tập 08, tốn 3 vòng sửa mới ra. Đọc trước khi chọn bảng màu.
   *
   * ACES nén mạnh vùng sáng. Càng đẩy độ sáng lên, sắc càng bị kéo về trắng/xám.
   * Nên SẮC PHẢI ĐẾN TỪ TỈ LỆ GIỮA CÁC KÊNH, không đến từ độ sáng.
   *
   * Đo thật (bão hoà còn lại sau khi qua chuỗi ACES của three.js r128):
   *   (0.42, 0.60, 1.05)  → còn 11–25%  → ra XÁM BÊ TÔNG. Đừng dùng.
   *   (0.10, 0.32, 1.00)  → còn 37–67%  → ra LAM THẬT.
   *
   * Quy tắc rút ra:
   *   - Kênh yếu nên ≤ 0.2× kênh mạnh. Nâng kênh yếu lên là giết sắc.
   *   - Kênh mạnh giữ quanh 1.0, đừng hơn.
   *   - Muốn SÁNG hơn thì tăng emissive (vượt ngưỡng bloom), ĐỪNG nâng kênh yếu.
   *
   * Hệ quả cho chữ và sơ đồ: bloom làm NHOÈ MẤT NÉT CHỮ. Nét biểu đồ và typo phải
   * để DƯỚI ngưỡng bloom (<1.0). Muốn chữ rõ hơn thì tăng độ dày nét, không tăng
   * emissive.
   *
   * Chống cháy trắng: giữ diện tích có luminance >0.85 (sau tonemap) dưới ~12%
   * khung. Cần một vùng sáng rộng thì đẩy bằng SỐ LƯỢNG hạt nhỏ, đừng đẩy bằng

/* Trường hạt phát sáng, kích thước theo phối cảnh, màu per-vertex.
 * uEm áp bảng emissive của storyboard: >1.0 mới loé qua bloom (ngưỡng 1.0). */
function pointMat(tex, emissive, sizeScale){
  return new THREE.ShaderMaterial({
    uniforms:{ uTex:{value:tex}, uEm:{value:emissive}, uOp:{value:1.0},
               uS:{value:sizeScale==null?1.0:sizeScale} },
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    vertexShader:[
      'attribute float aS; attribute float aA; attribute vec3 color;',
      'varying vec3 vC; varying float vA; uniform float uS;',
      'void main(){ vC=color; vA=aA;',
      '  vec4 mv=modelViewMatrix*vec4(position,1.0);',
      '  gl_PointSize=aS*uS*(300.0/max(0.001,-mv.z));',
      '  gl_Position=projectionMatrix*mv; }'
    ].join('\n'),
    fragmentShader:[
      'varying vec3 vC; varying float vA; uniform sampler2D uTex;',
      'uniform float uEm,uOp;',
      'void main(){ vec4 tc=texture2D(uTex,gl_PointCoord);',
      '  gl_FragColor=vec4(vC*uEm,tc.a*vA*uOp); }'
    ].join('\n')
  });
}
function makePoints(N, tex, emissive, sizeScale, fill){
  var pos=new Float32Array(N*3), col=new Float32Array(N*3),
      siz=new Float32Array(N), alp=new Float32Array(N);
  var p={x:0,y:0,z:0}, c=new THREE.Color();
  for (var i=0;i<N;i++){
    var s=1,a=1; c.setRGB(1,1,1); p.x=p.y=p.z=0;
    var r=fill(i,p,c);
    if (r){ if(r.s!=null)s=r.s; if(r.a!=null)a=r.a; }
    pos[i*3]=p.x; pos[i*3+1]=p.y; pos[i*3+2]=p.z;
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
    siz[i]=s; alp[i]=a;
  }
  var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  g.setAttribute('aS',new THREE.BufferAttribute(siz,1));
  g.setAttribute('aA',new THREE.BufferAttribute(alp,1));
  var pts=new THREE.Points(g, pointMat(tex,emissive,sizeScale));
  pts.frustumCulled=false; return pts;
}

/* ---- nét / đường trong không gian ---------------------------------------
 * MỌI nét sơ đồ và chữ giữ DƯỚI ngưỡng bloom 1.0. Muốn rõ thì tăng ĐỘ DÀY
 * (vẽ thành quad, hoặc vẽ nhiều line song song), không tăng emissive. */
function lineMat(hex, op){
  return new THREE.LineBasicMaterial({ color:hex, transparent:true,
    opacity:op==null?1:op, depthWrite:false, blending:THREE.AdditiveBlending });
}
function polyline(pts, hex, op){
  var g=new THREE.BufferGeometry().setFromPoints(pts);
  var l=new THREE.Line(g, lineMat(hex,op)); l.frustumCulled=false; return l;
}
function segments(pts, hex, op){
  var g=new THREE.BufferGeometry().setFromPoints(pts);
  var l=new THREE.LineSegments(g, lineMat(hex,op)); l.frustumCulled=false; return l;
}
function dashedSeg(x0,y0,x1,y1,z,n,hex,op){
  var v=[]; n=Math.max(2,Math.floor(n));
  for (var i=0;i<n;i++){
    var a=i/n, b=a+0.55/n;
    v.push(new THREE.Vector3(x0+(x1-x0)*a,y0+(y1-y0)*a,z));
    v.push(new THREE.Vector3(x0+(x1-x0)*b,y0+(y1-y0)*b,z));
  }
  return segments(v,hex,op);
}
/* Quad phát sáng phẳng. */
function glowQuad(w,h,hex,op){
  var m=new THREE.MeshBasicMaterial({ color:hex, transparent:true, opacity:op==null?1:op,
    depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide });
  return new THREE.Mesh(new THREE.PlaneGeometry(w,h), m);
}
/* Nét DÀY: quad mỏng thay cho Line — cách làm sơ đồ rõ mà KHÔNG nâng emissive
 * (bloom sẽ nhoè mất nét). Đây là quy tắc số 1 về chữ của tập này. */
function thickLine(x0,y0,x1,y1,w,hex,op){
  var dx=x1-x0, dy=y1-y0, L=Math.sqrt(dx*dx+dy*dy);
  var m=glowQuad(L||0.001,w,hex,op);
  m.position.set((x0+x1)/2,(y0+y1)/2,0);
  m.rotation.z=Math.atan2(dy,dx);
  return m;
}
function ringLine(r,hex,op,seg){
  var pts=[]; seg=seg||120;
  for (var i=0;i<=seg;i++){ var a=i/seg*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(a)*r,Math.sin(a)*r,0)); }
  return polyline(pts,hex,op);
}
/* Vòng tròn NÉT DÀY — ghép từ các quad ngắn. Dùng cho số 0, vòng khoá. */
function ringThick(r,w,hex,op,seg){
  var g=new THREE.Group(); seg=seg||72;
  for (var i=0;i<seg;i++){
    var a0=i/seg*Math.PI*2, a1=(i+1)/seg*Math.PI*2;
    g.add(thickLine(Math.cos(a0)*r,Math.sin(a0)*r,Math.cos(a1)*r,Math.sin(a1)*r,w,hex,op));
  }
  return g;
}

/* ---- nhãn chữ trong không gian (sprite canvas) --------------------------
 * Chữ dùng màu ngà (0.95,0.93,0.88) — cố ý gần trắng. Sprite là texture đã
 * mã hoá sRGB, không nhân emissive, nên luôn nằm dưới ngưỡng bloom 1.0. */
function labelSprite(txt, hex, px, weight){
  var cv=document.createElement('canvas');

  var mcx=cv.getContext('2d'); mcx.font=f;
  var w=Math.ceil(mcx.measureText(txt).width)+30, h=Math.ceil((px||64)*1.5);
  cv.width=Math.max(8,w); cv.height=h;
  var cx=cv.getContext('2d');
  cx.font=f; cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillStyle='#'+('000000'+hex.toString(16)).slice(-6);
  cx.fillText(txt, cv.width/2, cv.height/2);
  var tx=new THREE.CanvasTexture(cv); tx.encoding=THREE.sRGBEncoding;
  var sp=new THREE.Sprite(new THREE.SpriteMaterial({ map:tx, transparent:true,
    depthWrite:false, depthTest:false, opacity:1 }));
  sp.userData.aspect=cv.width/cv.height;
  sp.scale.set(sp.userData.aspect,1,1);
  return sp;
}
function sizeLabel(sp,h){ sp.scale.set(h*sp.userData.aspect,h,1); }
function mkLabel(txt,hex,h,x,y,z,px){
  var sp=labelSprite(txt,hex||COL.ivory,px||64,600);
  sizeLabel(sp,h); sp.position.set(x,y,z||0); return sp;
}
/* Nhãn số ĐỔI NỘI DUNG theo t (đồng hồ, bộ đếm). Vẫn tất định: nội dung chỉ
 * phụ thuộc t; canvas chỉ vẽ lại khi chuỗi đổi. */
function dynLabel(hex,px,weight,maxW){
  var cv=document.createElement('canvas');
  cv.width=maxW||640; cv.height=Math.ceil((px||64)*1.6);
  var cx=cv.getContext('2d');
  var tx=new THREE.CanvasTexture(cv); tx.encoding=THREE.sRGBEncoding;
  var sp=new THREE.Sprite(new THREE.SpriteMaterial({ map:tx, transparent:true,
    depthWrite:false, depthTest:false }));
  sp.userData={cv:cv,cx:cx,tx:tx,last:null,
    font:(weight||600)+' '+(px||64)+'px "Segoe UI",Roboto,sans-serif',
    fill:'#'+('000000'+(hex||COL.ivory).toString(16)).slice(-6), aspect:cv.width/cv.height};
  sp.scale.set(sp.userData.aspect,1,1);
  sp.userData.set=function(s){
    var u=sp.userData;
    if (u.last===s) return;
    u.last=s; u.cx.clearRect(0,0,u.cv.width,u.cv.height);
    u.cx.font=u.font; u.cx.textAlign='center'; u.cx.textBaseline='middle';
    u.cx.fillStyle=u.fill; u.cx.fillText(s,u.cv.width/2,u.cv.height/2);
    u.tx.needsUpdate=true;
  };
  sp.userData.size=function(h){ sp.scale.set(h*sp.userData.aspect,h,1); };
  return sp;
}

/* ---- PHOTON: sprite mềm. Diện tích cực nhỏ nên được phép emissive cao

function photonDot(em, colHex, r){

/* Quầng nhiễu xạ 6 tia (3 quad chéo nhau) — KHÔNG phải lens flare hoạt hình:

/* ---- TRAIL của photon: polyline mảnh, đuôi mờ dần theo bình phương ------ */
function trailLine(N, hex){
  var pos=new Float32Array(N*3), alp=new Float32Array(N);
  for (var i=0;i<N;i++){ alp[i]=1-i/(N-1); }
  var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('aA',new THREE.BufferAttribute(alp,1));
  var m=new THREE.ShaderMaterial({
    uniforms:{ uCol:{value:C3(hex||COL.photon)}, uOp:{value:1}, uEm:{value:1.1} },
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    vertexShader:'attribute float aA; varying float vA;'+
      'void main(){ vA=aA; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader:'varying float vA; uniform vec3 uCol; uniform float uOp,uEm;'+
      'void main(){ gl_FragColor=vec4(uCol*uEm,vA*vA*uOp); }'
  });
  var l=new THREE.Line(g,m); l.frustumCulled=false;
  l.userData={pos:pos,attr:g.attributes.position,N:N,mat:m};
  /* fn(k) trả {x,y,z} cho k trong [0,1] (0 = đầu, 1 = đuôi) — hàm thuần của t. */
  l.userData.setPath=function(fn){
    for (var i=0;i<N;i++){
      var p=fn(i/(N-1));
      pos[i*3]=p.x; pos[i*3+1]=p.y; pos[i*3+2]=p.z;
    }
    l.userData.attr.needsUpdate=true;
  };
  return l;
}

/* ---- MÓNG MẮT procedural (S02, S86) -------------------------------------
 * 220 sợi cơ hướng tâm, seeded. Đồng tử co theo t. emissive giữ 0.45–0.95
 * (bảng storyboard: bề mặt sinh học), KHÔNG loé. */
var IRIS_FS = [
  'uniform float uT,uPupil,uOp,uEm; uniform vec3 uIris,uDark;',
  'varying vec2 vUv;',
  'float hsh(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }',
  'void main(){',
  '  vec2 d=vUv*2.0-1.0; float r=length(d);',
  '  if(r>1.0) discard;',
  '  float a=atan(d.y,d.x);',
  '  float pup=uPupil;',
  '  if(r<pup){ gl_FragColor=vec4(vec3(0.004,0.003,0.004),uOp); return; }',
  '  float k=(r-pup)/max(0.001,1.0-pup);',
  // sợi cơ hướng tâm: 220 sợi, biên độ theo bán kính
  // Sợi cơ: biên độ phải GIẢM dần ra rìa và bị cắt ngẫu nhiên, nếu không
  // sẽ ra "bánh xe gỗ" nan đều tăm tắp — đã dính lỗi đó một lần.
  '  float fib=sin(a*126.0+hsh(vec2(floor(a*40.0),3.0))*6.28)*0.5+0.5;',
  '  float fib2=sin(a*57.0+hsh(vec2(floor(a*19.0),7.0))*6.28)*0.5+0.5;',
  '  float fine=mix(fib,fib2,0.42);',
  '  float cut=hsh(vec2(floor(a*40.0),1.0));',
  '  fine*=mix(0.30,1.0,cut);',
  '  fine*=1.0-0.62*smoothstep(0.30,1.0,k);',
  '  float crypt=smoothstep(0.34,0.62,hsh(vec2(floor(a*26.0),floor(k*7.0))));',
  '  vec3 col=mix(uDark,uIris,0.16+0.58*fine);',
  '  col=mix(col,uDark,crypt*0.42*(1.0-k*0.5));',
  // vành collarette + LIMBUS: rìa ngoài phải tối hẳn, đây là thứ làm con
  // mắt ra hình cầu thay vì cái đĩa phẳng
  '  col*=0.48+0.52*smoothstep(0.0,0.30,k);',
  '  col*=1.0-0.92*smoothstep(0.62,0.98,r);',
  // vành sáng quanh đồng tử — DƯỚI ngưỡng bloom
  '  float ring=exp(-pow((k-0.05)/0.07,2.0));',
  '  col+=uIris*ring*0.34;',
  // highlight phản chiếu nhỏ ở góc trên-trái (giác mạc ướt)
  '  float spec=exp(-pow(length(d-vec2(-0.30,0.34))/0.085,2.0));',
  '  col+=vec3(1.0,0.94,0.86)*spec*0.55;',
  '  gl_FragColor=vec4(col*uEm,uOp);',
  '}'
].join('\n');
function irisDisc(){
  var m=new THREE.ShaderMaterial({
    uniforms:{ uT:{value:0}, uPupil:{value:0.30}, uOp:{value:1}, uEm:{value:0.9},
               uIris:{value:C3(COL.amber)}, uDark:{value:C3(0x2A1206)} },
    vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader:IRIS_FS, transparent:true, depthWrite:false
  });
  var mesh=new THREE.Mesh(new THREE.PlaneGeometry(2,2), m);
  mesh.userData.mat=m; return mesh;
}

/* ---- DA người macro (S08, S32, S76, S85) --------------------------------
 * FBM lỗ chân lông + mao mạch dưới da (SSS giả). Tông trầm, KHÔNG lên trắng. */
var SKIN_FS = [
  'uniform float uT,uOp,uEm,uLight,uWet; uniform vec3 uSkin,uVein;',
  'varying vec2 vUv;',
  'float hsh(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }',
  'float nz(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);',
  '  return mix(mix(hsh(i),hsh(i+vec2(1,0)),f.x),mix(hsh(i+vec2(0,1)),hsh(i+vec2(1,1)),f.x),f.y); }',
  'float fbm(vec2 p){ float s=0.0,a=0.5; for(int i=0;i<5;i++){ s+=a*nz(p); p*=2.07; a*=0.5; } return s; }',
  'void main(){',
  '  vec2 uv=vUv;',
  '  float pore=fbm(uv*46.0);',
  '  float macro=fbm(uv*5.0+vec2(2.3,1.1));',
  '  float vein=smoothstep(0.52,0.30,abs(fbm(uv*2.6+vec2(7.0,3.0))-0.5)*2.0);',
  '  vec3 col=uSkin*(0.62+0.50*macro);',
  '  col=mix(col,uVein,vein*0.30);',
  '  col*=0.72+0.46*pore;',
  // ánh sáng chéo 40 độ
  '  float lit=clamp(dot(normalize(vec2(0.64,0.77)),normalize(uv-0.5))*0.5+0.62,0.0,1.4);',
  '  col*=mix(1.0,lit,uLight);',
  // độ ẩm: highlight rất nhỏ, không phải specular lớn
  '  float wet=pow(smoothstep(0.66,0.98,pore),3.0)*uWet;',
  '  col+=vec3(1.0,0.86,0.70)*wet*0.20;',
  '  gl_FragColor=vec4(col*uEm,uOp);',
  '}'
].join('\n');
function skinPlane(w,h,seg){

               uWet:{value:0.6}, uSkin:{value:C3(0x8C4A22)}, uVein:{value:C3(COL.redVein)} },
    vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader:SKIN_FS, transparent:true, depthWrite:false

/* ---- CHẤM SÁNG TĨNH sau va chạm (motif lặp: S07, S08, S76, S86, S88) ----
 * Luôn cùng cách dựng: mỗi photon chạm để lại một chấm KHÔNG tan, emissive
 * 0.80, chỉ ~3% chấm được nâng 1.5 để có lấp lánh. Tổng sáng mới là thứ nguy
 * hiểm, không phải từng chấm. */
function impactDots(N, seed, place){
  var pr=HFA.mulberry32(seed);
  var order=new Float32Array(N), boost=new Float32Array(N);
  var pts=makePoints(N, dotPh, 1.0, 1.0, function(i,p,c){
    var r=place(i,pr,p);
    order[i]=pr();
    var hot=pr()<0.03;
    boost[i]=hot?1.5:0.80;
    c.setHex(COL.photon).multiplyScalar(boost[i]);
    return { s:(r&&r.s)||(hot?2.0:1.35), a:0 };
  });
  var aAttr=pts.geometry.attributes.aA;
  pts.userData.order=order;
  /* k in [0,1]: tỉ lệ chấm ĐÃ hạ cánh. Chấm đã hiện thì KHÔNG bao giờ tắt. */
  pts.userData.reveal=function(k, glob){
    var arr=aAttr.array;
    for (var i=0;i<N;i++){ arr[i]= order[i]<=k ? (glob==null?1:glob) : 0; }
    aAttr.needsUpdate=true;
  };
  return pts;
}

/* ---- RANDOM WALK dùng chung (motif 2: S22/S23, S26, S63, S83) -----------
 * CÙNG SEED ở mọi nơi — đây là điểm nối trực quan có chủ đích của tập.
 * Bán kính khối nở theo CĂN BẬC HAI số bước: tính sẵn đường đi rồi vẽ dần,
 * nên tính chất sqrt(N) tự nhiên đúng, không phải giả lập.
 */
var WALK_SEED = 7310411;
function buildWalk(nSteps, seed, stepLen){
  var pr=HFA.mulberry32(seed==null?WALK_SEED:seed);
  var pts=[], x=0,y=0,z=0;
  pts.push(new THREE.Vector3(0,0,0));
  for (var i=0;i<nSteps;i++){
    var u=pr()*2-1, ph=pr()*Math.PI*2, s=Math.sqrt(1-u*u);
    var L=(stepLen||1)*(0.55+pr()*0.9);
    x+=s*Math.cos(ph)*L; y+=u*L; z+=s*Math.sin(ph)*L;
    pts.push(new THREE.Vector3(x,y,z));
  }
  return pts;
}
/* Polyline vẽ DẦN theo t: chỉ dời các đỉnh chưa tới về đỉnh hiện tại
 * (không đổi số đỉnh → không tái cấp phát buffer). */
function growLine(ptsArr, hex, op){
  var N=ptsArr.length;
  var pos=new Float32Array(N*3);
  var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  var l=new THREE.Line(g, lineMat(hex,op)); l.frustumCulled=false;
  l.userData.grow=function(k){
    var m=clamp(k,0,1)*(N-1);
    var mi=Math.floor(m), fr=m-mi;
    for (var i=0;i<N;i++){
      var j=Math.min(i,mi);
      var p=ptsArr[j];
      if (i===mi+1 && mi+1<N){
        var a=ptsArr[mi], b=ptsArr[mi+1];
        pos[i*3]=a.x+(b.x-a.x)*fr; pos[i*3+1]=a.y+(b.y-a.y)*fr; pos[i*3+2]=a.z+(b.z-a.z)*fr;
        continue;
      }
      if (i>mi+1){
        var a2=ptsArr[mi], b2=ptsArr[Math.min(mi+1,N-1)];
        pos[i*3]=a2.x+(b2.x-a2.x)*fr; pos[i*3+1]=a2.y+(b2.y-a2.y)*fr; pos[i*3+2]=a2.z+(b2.z-a2.z)*fr;
        continue;
      }
      pos[i*3]=p.x; pos[i*3+1]=p.y; pos[i*3+2]=p.z;
    }
    g.attributes.position.needsUpdate=true;
  };
  l.userData.at=function(k){
    var m=clamp(k,0,1)*(N-1), mi=Math.floor(m), fr=m-mi;
    var a=ptsArr[mi], b=ptsArr[Math.min(mi+1,N-1)];
    return new THREE.Vector3(a.x+(b.x-a.x)*fr,a.y+(b.y-a.y)*fr,a.z+(b.z-a.z)*fr);
  };
  return l;
}

/* ---- PHOTOSPHERE / bề mặt sao (S15, S25, S35, S56, S82) -----------------
 * Granulation thật: ô đối lưu tâm sáng / biên tối, vòng đời ô ~8 phút quy
 * đổi (uCellLife), sunspot noise tần số thấp, LIMB DARKENING bắt buộc.
 * emissive 1.10–1.25 (rìa 0.75) theo bảng storyboard. */
var SUN_FS = [
  'uniform float uT,uEm,uOp,uSpot,uCell,uLife,uRim; uniform vec3 uHot,uMid,uDark;',
  'varying vec3 vP; varying vec3 vN; varying vec3 vV;',
  'vec3 hash3(vec3 p){ p=vec3(dot(p,vec3(127.1,311.7,74.7)),dot(p,vec3(269.5,183.3,246.1)),dot(p,vec3(113.5,271.9,124.6)));',
  '  return fract(sin(p)*43758.5453)*2.0-1.0; }',
  'float snz(vec3 p){ vec3 i=floor(p),f=fract(p); vec3 u=f*f*(3.0-2.0*f);',
  '  return mix(mix(mix(dot(hash3(i+vec3(0,0,0)),f-vec3(0,0,0)),dot(hash3(i+vec3(1,0,0)),f-vec3(1,0,0)),u.x),',
  '    mix(dot(hash3(i+vec3(0,1,0)),f-vec3(0,1,0)),dot(hash3(i+vec3(1,1,0)),f-vec3(1,1,0)),u.x),u.y),',
  '   mix(mix(dot(hash3(i+vec3(0,0,1)),f-vec3(0,0,1)),dot(hash3(i+vec3(1,0,1)),f-vec3(1,0,1)),u.x),',
  '    mix(dot(hash3(i+vec3(0,1,1)),f-vec3(0,1,1)),dot(hash3(i+vec3(1,1,1)),f-vec3(1,1,1)),u.x),u.y),u.z)*0.5+0.5; }',
  'float fbm(vec3 p){ float s=0.0,a=0.5; for(int i=0;i<5;i++){ s+=a*snz(p); p*=2.03; a*=0.5; } return s; }',
  'void main(){',
  '  vec3 d=normalize(vP);',
  '  vec3 N=normalize(vN), V=normalize(vV);',
  // ô đối lưu: tâm sáng, biên tối. uLife = nhịp sinh/tan của ô
  '  float g1=fbm(d*uCell + vec3(0.0,0.0,uT*uLife));',
  '  float g2=fbm(d*(uCell*3.1) - vec3(uT*uLife*1.9,0.0,0.0));',
  '  float gran=mix(g1,g2,0.38);',
  '  float edge=smoothstep(0.34,0.62,gran);',
  // vết đen (umbra/penumbra) — noise tần số thấp
  '  float sp=smoothstep(0.58,0.78,fbm(d*1.55+vec3(11.0,3.0,5.0)));',
  '  vec3 col=mix(uDark,uMid,edge);',
  '  col=mix(col,uHot,pow(edge,2.6)*0.85);',
  '  col=mix(col,uDark*0.22,sp*uSpot);',
  // LIMB DARKENING — không có cái này thì ra đĩa trắng bẹt
  '  float mu=clamp(dot(N,V),0.0,1.0);',
  '  col*=mix(1.0,0.30+0.70*pow(mu,0.62),uRim);',
  '  gl_FragColor=vec4(col*uEm,uOp);',
  '}'
].join('\n');
function sunSphere(r, seg){
  var m=new THREE.ShaderMaterial({
    uniforms:{ uT:{value:0}, uEm:{value:1.15}, uOp:{value:1}, uSpot:{value:1.0},
               uCell:{value:9.0}, uLife:{value:0.05}, uRim:{value:1.0},
               uHot:{value:C3(0xFFE0A8)}, uMid:{value:C3(COL.goldPhot)}, uDark:{value:C3(0xB03606)} },
    vertexShader:[
      'varying vec3 vP; varying vec3 vN; varying vec3 vV;',
      'void main(){ vP=position; vN=normalize(normalMatrix*normal);',
      '  vec4 mv=modelViewMatrix*vec4(position,1.0); vV=-mv.xyz;',
      '  gl_Position=projectionMatrix*mv; }'
    ].join('\n'),
    fragmentShader:SUN_FS, transparent:true, depthWrite:true
  });
  var mesh=new THREE.Mesh(new THREE.SphereGeometry(r,seg||64,seg||48), m);
  mesh.userData.mat=m; return mesh;
}
/* Granulation PHẲNG — cho cảnh nhìn sát bề mặt (S15, S82). */
function sunPlane(w,h){

    vertexShader:[

      '  vec4 mv=modelViewMatrix*vec4(position,1.0); vV=-mv.xyz;',
      '  gl_Position=projectionMatrix*mv; }'
    ].join('\n'),

/* ---- Thiên hà point-cloud (S10, S30, S52, S59, S70) ---------------------
 * KHÔNG billboard phẳng (cấm trong storyboard mục 5). Lõi phình VÀNG ẤM,
 * nhánh XANH-TRẮNG, dải bụi tối, đốm HII hồng. */
function galaxyCloud(N, seed, R, arms, opt){
  opt=opt||{};
  var pr=HFA.mulberry32(seed);
  return makePoints(N, dotW, opt.em==null?1.0:opt.em, opt.size==null?1.0:opt.size, function(i,p,c){
    var bulge = pr()<(opt.bulge==null?0.22:opt.bulge);
    var rr, th;
    if (bulge){
      rr=Math.pow(pr(),2.0)*R*0.20;
      th=pr()*Math.PI*2;
      p.x=Math.cos(th)*rr; p.z=Math.sin(th)*rr;
      p.y=(pr()-0.5)*R*0.12*Math.exp(-rr/(R*0.14));
      c.setHex(0xFFD9A0).multiplyScalar(0.55+pr()*0.55);
    } else {
      var arm=Math.floor(pr()*arms);
      rr=(0.14+Math.pow(pr(),0.62)*0.86)*R;
      var wind=(opt.wind==null?2.4:opt.wind);
      th=arm*(Math.PI*2/arms) + (rr/R)*wind + (pr()-0.5)*0.52;
      var jit=(pr()-0.5)*R*0.055*(0.4+rr/R);
      p.x=Math.cos(th)*rr+jit; p.z=Math.sin(th)*rr+jit*0.8;
      p.y=(pr()-0.5)*R*0.035;
      var hii=pr()<0.045;
      if (hii) c.setHex(0xFF4A78).multiplyScalar(0.7+pr()*0.6);
      else c.setHex(0xBFD4FF).multiplyScalar(0.35+pr()*0.55);
    }
    /* dải bụi tối: bỏ bớt hạt ở một số dải bán kính → thành vệt tối thật */
    var dust=Math.sin(th*arms*0.5 + rr/R*5.5);
    var a=(dust>0.72)?0.10:1.0;
    return { s:(bulge?1.0:0.85)*(0.6+pr()*0.9), a:a*(0.45+pr()*0.55) };
  });
}

var gDark = grp('dark');

    transparent:true, depthWrite:false,
    vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader:[
      'uniform float uT,uOp,uBreath,uEm; varying vec2 vUv;',
      'float hsh(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }',
      'float nz(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);',
      '  return mix(mix(hsh(i),hsh(i+vec2(1,0)),f.x),mix(hsh(i+vec2(0,1)),hsh(i+vec2(1,1)),f.x),f.y); }',
      'float fbm(vec2 p){ float s=0.0,a=0.5; for(int i=0;i<5;i++){ s+=a*nz(p); p*=2.11; a*=0.5; } return s; }',

})();

var gRain = grp('rain');

      seedArr[pair*4+2]=pr()*Math.PI*2; seedArr[pair*4+3]=0.7+pr()*1.6;
    }
    p.x=seedArr[pair*4]; p.y=seedArr[pair*4+1]; p.z=-4-pr()*20;
    c.setHex(isE?COL.blueHot:0xFF8C33).multiplyScalar(0.7+pr()*0.4);

var walkManyLines = (function(){
  /* vẽ bằng LineSegments: mỗi walker là một chuỗi đoạn. Dựng sẵn toàn bộ
   * đỉnh, rồi "nở" bằng cách scale theo sqrt — đúng vật lý và rẻ. */
  var pr=HFA.mulberry32(230023);
  var V=[], C=[];
  var col=new THREE.Color(COL.photon);
  for (var w=0;w<WM_N;w++){
    var x=0,y=0,z=0, px=0,py=0,pz=0;
    var seg=Math.floor(6+pr()*10);
    for (var s=0;s<seg;s++){
      px=x;py=y;pz=z;
      var u=pr()*2-1, ph=pr()*Math.PI*2, sn=Math.sqrt(1-u*u);
      var L=0.9+pr()*1.5;
      x+=sn*Math.cos(ph)*L; y+=u*L; z+=sn*Math.sin(ph)*L;
      V.push(px,py,pz, x,y,z);
      var f=0.55+pr()*0.5;
      C.push(col.r*f,col.g*f,col.b*f, col.r*f,col.g*f,col.b*f);

  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(V),3));

})();

/* ---- S49: CAO TRÀO — lưới Lorentz sụp thành đường 45° --------------
 * TUYỆT ĐỐI KHÔNG vẽ cảnh "ngồi trên lưng photon nhìn ra" (C61 bác bỏ
 * đúng hình đó). Thay vào: một lưới toạ độ thời-không bị boost, các ô dẹt
 * lại đúng biến đổi Lorentz, và ở v→c toàn lưới sụp thành MỘT đường 45°. */
var gLorentz = grp('lorentz');
var lorGrid = (function(){
  var V=[], N=9, S=5.2;
  for (var i=-N;i<=N;i++){
    var u=i/N*S;
    V.push(u,-S,0, u,S,0);       /* đường t = const (nghiêng khi boost) */
    V.push(-S,u,0, S,u,0);
  }
  var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(V),3));
  var base=new Float32Array(V);
  var m=new THREE.LineBasicMaterial({ color:COL.blueDeep, transparent:true,
    opacity:0.50, depthWrite:false, blending:THREE.AdditiveBlending });
  var l=new THREE.LineSegments(g,m); l.frustumCulled=false;
  l.userData.base=base; l.userData.attr=g.attributes.position;
  /* Biến đổi Lorentz thật: x' = γ(x − βt), t' = γ(t − βx).
   * Ở β→1 mọi điểm dồn về đường ánh sáng x=t → lưới sụp thành 45°. */
  l.userData.boost=function(beta){
    var a=l.userData.attr.array, b=base;
    var bb=clamp(beta,0,0.99995);
    /* dùng toạ độ nón ánh sáng: u=t+x, v=t−x; boost là u*=k, v/=k */
    var k=Math.sqrt((1+bb)/(1-bb));
    for (var i=0;i<a.length;i+=3){
      var x=b[i], tt=b[i+1];
      var u=(tt+x)*k, v=(tt-x)/k;
      a[i]=(u-v)*0.5; a[i+1]=(u+v)*0.5; a[i+2]=b[i+2];
    }
    l.userData.attr.needsUpdate=true;
  };
  return l;
})();

    var u=pr()*2-1, ph=pr()*Math.PI*2, sn=Math.sqrt(1-u*u);
    dir[i*3]=sn*Math.cos(ph); dir[i*3+1]=u; dir[i*3+2]=sn*Math.sin(ph);
    p.x=x; p.y=y; p.z=z;
    c.setHex(COL.oranPlas).lerp(new THREE.Color(0xFFE2C0),pr()*0.55);
    return { s:0.7+pr()*0.9, a:0.30 };
  });
  pts.userData.dir=dir; pts.userData.org=org;
  pts.userData.attr=pts.geometry.attributes.position;

  'float snz(vec3 p){ vec3 i=floor(p),f=fract(p); vec3 u=f*f*(3.0-2.0*f);',
  '  return mix(mix(mix(dot(hash3(i),f),dot(hash3(i+vec3(1,0,0)),f-vec3(1,0,0)),u.x),',
  '    mix(dot(hash3(i+vec3(0,1,0)),f-vec3(0,1,0)),dot(hash3(i+vec3(1,1,0)),f-vec3(1,1,0)),u.x),u.y),',
  '   mix(mix(dot(hash3(i+vec3(0,0,1)),f-vec3(0,0,1)),dot(hash3(i+vec3(1,0,1)),f-vec3(1,0,1)),u.x),',

  '  float lon=d.x*3.14159, lat=d.y*1.5708;',

  {t:461.56,s:"một dòng chảy chung cho tất cả."},
  {t:463.64,s:"Vật càng đi nhanh so với bạn, đồng hồ của"},
  {t:466.68,s:"nó chạy càng chậm dưới mắt bạn."},
  {t:468.97,s:"Chuyện này đã được đo."},
  {t:470.35,s:"Người ta mang đồng hồ nguyên tử bay vòng"},
  {t:472.64,s:"quanh Trái Đất, rồi đem xuống so với đồng"},
  {t:474.99,s:"hồ để ở mặt đất."},
  {t:475.91,s:"Chúng lệch nhau, đúng bằng lượng mà phép"},
  {t:478.96,s:"tính dự đoán."},
  {t:479.95,s:"Định vị vệ tinh trong điện thoại bạn cũng"},
  {t:482.23,s:"phải chỉnh theo hiệu ứng này mỗi ngày."},
  {t:484.34,s:"Không chỉnh thì trong một ngày, bản đồ sẽ"},
  {t:487.26,s:"lệch khoảng mười cây số."},
  {t:488.97,s:"Nên đây không phải triết học."},
  {t:490.56,s:"Đây là kỹ thuật."},
  {t:493.86,s:"Bây giờ đẩy nó tới cùng."},
  {t:495.95,s:"Một con tàu đi bằng chín mươi chín phần"},
  {t:498.52,s:"trăm tốc độ ánh sáng, đồng hồ trên đó chạy"},
  {t:501.29,s:"chậm hơn đồng hồ của tôi khoảng bảy lần."},
  {t:503.92,s:"Chín mươi chín phẩy chín chín phần trăm"},
  {t:506.66,s:"thì chậm hơn bảy mươi lần."},
  {t:508.49,s:"Càng tiến sát tốc độ ánh sáng, con số đó"},
  {t:511.50,s:"càng lao lên."},
  {t:512.48,s:"Và ngay tại đúng tốc độ ánh sáng, nó không"},
  {t:515.41,s:"lớn nữa."},
  {t:515.97,s:"Nó rơi ra ngoài mọi giới hạn."},
  {t:518.24,s:"Cái đại lượng mà vật lý dùng để đo quãng"},
  {t:520.89,s:"thời gian một vật thật sự trải qua dọc"},
  {t:523.41,s:"theo đường đi của nó, người ta gọi là thời"},
  {t:526.20,s:"gian riêng."},
  {t:526.93,s:"Đồng hồ đeo tay của chính nó."},
  {t:529.63,s:"Dọc theo đường đi của một hạt ánh sáng,"},
  {t:532.25,s:"thời gian riêng bằng không."},
  {t:536.07,s:"Tôi cần cẩn thận ở đây, vì đây là chỗ dễ"},
  {t:539.31,s:"nói sai nhất."},
  {t:540.36,s:"Vật lý không cho phép tôi ngồi lên lưng"},
  {t:543.23,s:"một photon và nhìn ra."},
  {t:544.85,s:"Không tồn tại hệ quy chiếu gắn với ánh"},
  {t:547.33,s:"sáng — thử dựng một cái là các phương"},
  {t:549.75,s:"trình sụp ngay."},
  {t:550.73,s:"Photon không phải một người quan sát."},
  {t:553.28,s:"Nên khi tôi nói với nó thì không có thời"},
  {t:555.79,s:"gian, tôi không mô tả một trải nghiệm."},
  {t:558.17,s:"Tôi mô tả một con số."},
  {t:560.20,s:"Và con số ấy hoàn toàn xác định."},
  {t:562.12,s:"Mọi người quan sát trong vũ trụ, dù bay"},
  {t:564.83,s:"theo hướng nào, đều tính ra cùng một giá"},
  {t:567.60,s:"trị."},
  {t:567.88,s:"Đó là khoảng cách thời-không giữa hai đầu"},
  {t:570.86,s:"đường đi của nó."},
  {t:572.02,s:"Giữa điểm ánh sáng được phát ra và điểm nó"},
  {t:574.67,s:"bị hấp thụ, khoảng cách ấy bằng không."},
  {t:577.07,s:"Với mọi thứ khác, hai sự kiện đó cách"},
  {t:580.04,s:"nhau."},
  {t:580.44,s:"Bằng không gian, bằng thời gian, hoặc cả"},
  {t:583.79,s:"hai."},
  {t:584.13,s:"Với một đường đi của ánh sáng, chúng không"},
  {t:586.81,s:"cách nhau chút nào."},
  {t:588.02,s:"Chúng chạm vào nhau."},
  {t:589.91,s:"Nơi photon sinh ra và nơi photon chết là"},
  {t:592.68,s:"cùng một điểm trong cấu trúc của"},
  {t:594.89,s:"thời-không."},
  {t:595.65,s:"Cái vòng cung mười ba tỉ năm nằm giữa —"},
  {t:598.31,s:"cái vòng cung mà tôi đo được, mà tôi thấy"},
  {t:601.12,s:"là dài khủng khiếp — trên chính sợi chỉ ấy"},
  {t:603.99,s:"có độ dài bằng không."},
  {t:607.42,s:"Tôi thử hình dung nó thế này."},
  {t:609.02,s:"Vũ trụ có một hệ thống bưu chính."},
  {t:611.51,s:"Có những kiện hàng đi ba mươi nghìn năm,"},
  {t:614.31,s:"có kiện đi mười ba tỉ năm."},
  {t:616.13,s:"Nhưng con tem nào cũng ghi đúng một ngày."},
  {t:618.61,s:"Ngày gửi và ngày nhận trùng khít."},
  {t:620.70,s:"Mọi bưu kiện ánh sáng trong lịch sử vũ trụ"},
  {t:623.37,s:"đều được giao ngay lập tức."},
  {t:625.08,s:"Chỉ có người nhận là phải chờ."},
  {t:629.08,s:"Và người nhận thì chờ rất lâu."},
  {t:631.26,s:"Chuyện này xảy ra mỗi đêm, trên đầu chúng"},
  {t:634.09,s:"ta, và ta gọi nó bằng cái tên bình thường"},
  {t:636.91,s:"đến mức quên mất nó lạ thế nào."},
  {t:639.05,s:"Khi tôi nhìn Mặt Trời, tôi không nhìn thấy"},
  {t:641.69,s:"Mặt Trời."},
  {t:642.25,s:"Tôi thấy Mặt Trời của tám phút hai mươi"},
  {t:644.68,s:"giây trước."},
  {t:645.36,s:"Nếu ngay lúc này nó tắt, tôi sẽ không hay"},
  {t:648.01,s:"biết gì suốt tám phút."},
  {t:649.43,s:"Vẫn thấy nắng."},
  {t:650.77,s:"Vẫn thấy trời xanh."},
  {t:652.64,s:"Ngôi sao gần nhất ngoài Mặt Trời là"},
  {t:655.58,s:"Proxima Centauri."},
  {t:657.01,s:"Ánh sáng của nó mất hơn bốn năm để tới"},
  {t:660.03,s:"đây."},
  {t:660.35,s:"Nhìn nó là nhìn một đêm cách đây bốn năm."},
  {t:663.83,s:"Sao Bắc Đẩu mà bao thế hệ thủy thủ dùng để"},
  {t:666.74,s:"tìm đường — ánh sáng của nó rời khỏi đó từ"},
  {t:669.64,s:"nhiều thế kỷ trước, trước cả khi ông tổ"},
  {t:672.34,s:"năm đời của bạn ra đời."},
  {t:673.93,s:"Thiên hà Tiên Nữ, cái vệt mờ mắt thường"},
  {t:676.60,s:"vẫn thấy được ở nơi trời thật tối: hai"},
  {t:679.19,s:"triệu rưỡi năm."},
  {t:680.22,s:"Ánh sáng đó lên đường khi trên Trái Đất"},
  {t:682.84,s:"chưa aai biết dùng lửa."},
  {t:684.39,s:"Bầu trời đêm không phải một bức ảnh chụp."},
  {t:687.89,s:"Nó là một tấm ghép của hàng nghìn thời"},
  {t:690.26,s:"điểm khác nhau, dán cạnh nhau, và mắt bạn"},
  {t:692.81,s:"nhìn tất cả cùng một lúc."},
  {t:694.37,s:"Ngôi sao bên trái là của năm ngoái."},
  {t:697.43,s:"Ngôi bên phải là của thời trung cổ."},
  {t:700.06,s:"Cái chấm mờ ở giữa là của thời chưa có con"},
  {t:703.49,s:"người."},
  {t:703.98,s:"Và không có gì báo cho bạn biết chúng cách"},
  {t:706.60,s:"nhau bao lâu."},
  {t:707.41,s:"Không có cái gọi là bầu trời ngay bây giờ."},
  {t:710.00,s:"Chưa bao giờ có."},
  {t:711.53,s:"Nhìn xa luôn luôn là nhìn về quá khứ, và"},
  {t:714.15,s:"không cách nào tránh được, bởi vì không có"},
  {t:716.91,s:"tin tức nào chạy nhanh hơn ánh sáng."},
  {t:721.27,s:"Và nếu tôi đi tới tận cùng của trò này,"},
  {t:724.04,s:"tới thứ ánh sáng cũ nhất còn có thể bắt"},
  {t:726.81,s:"được, tôi tới một thứ đang bao quanh chúng"},
  {t:729.80,s:"ta ngay lúc này mà ta không thấy."},
  {t:732.14,s:"Trong gần bốn trăm nghìn năm đầu, vũ trụ"},
  {t:734.64,s:"nóng tới mức toàn bộ nó là một khối plasma"},
  {t:737.27,s:"mờ đục."},
  {t:737.71,s:"Ánh sáng không đi được đâu cả."},
  {t:739.67,s:"Nó bị nhồi y hệt trong lõi Mặt Trời, chỉ"},
  {t:742.52,s:"khác là bị nhồi ở khắp mọi nơi cùng lúc."},
  {t:745.37,s:"Rồi vũ trụ nguội xuống đủ để các electron"},
  {t:748.45,s:"bám vào hạt nhân."},
  {t:749.73,s:"Sương mù tan."},
  {t:751.18,s:"Và toàn bộ ánh sáng bị giam giữ suốt bốn"},
  {t:753.86,s:"trăm nghìn năm ấy được thả ra cùng một"},
  {t:756.41,s:"lúc, ở mọi điểm trong không gian."},
  {t:758.62,s:"Ánh sáng đó chưa bao giờ dừng."},
  {t:760.40,s:"Nó vẫn đang bay."},
  {t:762.40,s:"Không gian giãn ra và kéo giãn nó theo, từ"},
  {t:765.25,s:"chói lòa thành vi sóng lạnh chỉ còn cách"},
  {t:767.96,s:"độ không tuyệt đối chưa tới ba độ."},
  {t:770.26,s:"Nó đang đi qua căn phòng bạn ngồi, ngay"},
  {t:773.27,s:"lúc này, từ mọi hướng."},
  {t:774.97,s:"Cái tivi analog ngày xưa mất sóng và hiện"},
  {t:778.06,s:"ra màn hình đầy hạt nhiễu — một phần nhỏ"},
  {t:781.08,s:"của đám lấm tấm đó chính là thứ ánh sáng"},
  {t:784.09,s:"ấy, tới đích sau mười ba tỉ năm và chết"},
  {t:787.03,s:"trong cái ăng-ten."},
  {t:788.39,s:"Người ta tìm ra nó vì hai kỹ sư không sao"},
  {t:790.97,s:"dọn sạch được tiếng rè trong một cái"},
  {t:793.24,s:"ăng-ten khổng lồ."},
  {t:794.31,s:"Họ đuổi cả chim bồ câu làm tổ trong đó."},
  {t:797.92,s:"Tiếng rè vẫn còn, đều nhau ở mọi hướng."},
  {t:801.24,s:"Vì nó không đến từ hướng nào cả."},
  {t:803.90,s:"Với chúng, khoảng thời gian giữa buổi bình"},
  {t:806.59,s:"minh đó và cái ăng-ten cũ kỹ kia cũng bằng"},
  {t:809.29,s:"không."},
  {t:811.67,s:"Tôi quay lại căn phòng tối lúc đầu."},
  {t:814.04,s:"Tôi đã nghĩ suốt một thời gian dài rằng vũ"},
  {t:817.10,s:"trụ rất rộng, và đó là lý do khiến nó"},
  {t:819.80,s:"buồn."},
  {t:820.16,s:"Rộng nghĩa là xa."},
  {t:821.77,s:"Xa nghĩa là không chạm tới được."},
  {t:824.07,s:"Mười ba tỉ năm ánh sáng là một bản án."},
  {t:827.28,s:"Nhưng cái khoảng cách đó chỉ tồn tại với"},
  {t:829.37,s:"những thứ có khối lượng."},
  {t:830.63,s:"Với chúng tôi, những thứ nặng nề, bị buộc"},
  {t:833.24,s:"phải đi chậm hơn ánh sáng — với chúng tôi"},
  {t:835.85,s:"thì vũ trụ mới mênh mông."},
  {t:837.44,s:"Với ánh sáng thì không có khoảng cách nào"},
  {t:839.61,s:"cả."},
  {t:839.77,s:"Không có mười ba tỉ năm."},
  {t:841.46,s:"Không có một trăm bảy mươi nghìn năm trong"},
  {t:843.95,s:"lòng Mặt Trời."},
  {t:844.78,s:"Không có tám phút hai mươi giây."},
  {t:847.25,s:"Cái vũ trụ mà chúng ta thấy là bao la, với"},
  {t:850.29,s:"ánh sáng thì nó là một điểm."},
  {t:854.32,s:"Có một hệ quả nhỏ mà tôi mãi mới nhận ra."},
  {t:857.16,s:"Photon không già đi, cho nên nó cũng không"},
  {t:860.40,s:"có tuổi."},
  {t:861.02,s:"Nó không mòn."},
  {t:862.27,s:"Không phân rã."},
  {t:863.60,s:"Không rệu rã theo năm tháng."},
  {t:865.86,s:"Mọi thứ khác đều có một cách để hỏng dần."},
  {t:868.32,s:"Sắt gỉ."},
  {t:869.50,s:"Sao cạn nhiên liệu."},
  {t:870.95,s:"Nguyên tử phóng xạ rã ra."},
  {t:872.97,s:"Còn ánh sáng, theo mọi phép đo ta có, thì"},
  {t:876.76,s:"không."},
  {t:877.31,s:"Một hạt ánh sáng có thể bay tới tận cùng"},
  {t:879.79,s:"thời gian mà vẫn nguyên vẹn như giây nó"},
  {t:882.21,s:"sinh ra."},
  {t:882.71,s:"Chỉ có một cách để nó kết thúc."},
  {t:884.85,s:"Nó phải đâm vào thứ gì đó."},
  {t:887.20,s:"Nó phải gặp một nguyên tử, và bị nuốt"},
  {t:889.88,s:"trọn."},
  {t:890.24,s:"Không có cái chết vì tuổi già cho ánh"},
  {t:892.98,s:"sáng."},
  {t:893.35,s:"Chỉ có va chạm."},
  {t:895.35,s:"Và điều đó biến mắt bạn thành một thứ rất"},
  {t:897.80,s:"lạ."},
  {t:897.98,s:"Mắt bạn là nơi các cuộc đời kết thúc."},
  {t:900.85,s:"Không phải nơi chúng đi ngang qua."},
  {t:902.88,s:"Nơi chúng dừng."},
  {t:904.53,s:"Một hạt ánh sáng đi mười ba tỉ năm, băng"},
  {t:907.27,s:"qua những khoảng trống mà không gì khác"},
  {t:909.94,s:"từng đi qua, không va vào một hạt bụi nào,"},
  {t:912.82,s:"không lệch một lần nào."},
  {t:914.39,s:"Rồi nó tới đây, và dừng lại ở một tế bào"},
  {t:917.31,s:"ẩm ướt sau con ngươi của một sinh vật trên"},
  {t:920.38,s:"một hành tinh đá."},
  {t:921.62,s:"Cả chuyến đi đó chỉ để làm một việc duy"},
  {t:924.52,s:"nhất: bẻ cong một phân tử."},
  {t:926.46,s:"Một phân tử nhỏ xíu trong võng mạc đổi"},
  {t:929.18,s:"hình dạng."},
  {t:929.90,s:"Chỉ vậy thôi."},
  {t:931.25,s:"Rồi tế bào phát ra một xung điện, và bạn"},
  {t:934.49,s:"thấy một chấm sáng."},
  {t:936.03,s:"Một phân tử đổi hình."},
  {t:937.48,s:"Đó là toàn bộ cái giá mà vũ trụ trả để bạn"},
  {t:940.67,s:"biết rằng ngoài kia có gì."},
  {t:944.15,s:"Tôi nghĩ đây là chỗ duy nhất trong vật lý"},
  {t:946.54,s:"mà chữ gặp gỡ dùng đúng nghĩa đen."},
  {t:948.53,s:"Bởi vì với phía bên kia, không hề có"},
  {t:951.14,s:"chuyến đi nào."},
  {t:952.16,s:"Ngôi sao phát ra nó và mắt bạn nhận nó là"},
  {t:955.16,s:"cùng một khoảnh khắc, trên cùng một sợi"},
  {t:958.02,s:"chỉ."},
  {t:958.31,s:"Cái khoảng giữa là chuyện của chúng ta,"},
  {t:960.95,s:"không phải chuyện của nó."},
  {t:962.64,s:"Ngôi sao có thể đã tắt từ lâu."},
  {t:964.78,s:"Đã nổ, đã co lại, đã nguội thành một cục"},
  {t:967.74,s:"than không aai thấy nữa."},
  {t:969.52,s:"Điều đó không thay đổi được gì."},
  {t:971.51,s:"Trên sợi chỉ đó, ngôi sao vẫn đang cháy ở"},
  {t:974.32,s:"đúng cái đầu kia, ngay lúc đầu này chạm"},
  {t:976.99,s:"vào bạn."},
  {t:979.54,s:"Nên tối nay, nếu bạn ra ngoài, hãy làm một"},
  {t:982.85,s:"việc rất nhỏ."},
  {t:983.88,s:"Nhắm mắt lại mười giây."},
  {t:985.33,s:"Đứng yên."},
  {t:986.42,s:"Rồi mở mắt và chọn một ngôi sao."},
  {t:989.49,s:"Đừng chọn ngôi sáng nhất, chọn một ngôi"},
  {t:992.30,s:"mờ, loại phải nhìn hơi lệch đi mới thấy"},
  {t:995.11,s:"rõ."},
  {t:995.33,s:"Ngôi sao đó có thể cách bạn vài trăm năm"},
