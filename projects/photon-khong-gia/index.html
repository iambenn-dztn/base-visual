/* ==========================================================================
 * TIỆN ÍCH ĐIỀU KHIỂN CẢNH
 * ========================================================================== */
/* Đặt opacity cho mọi vật liệu trong một nhóm theo hệ số chung. */
function fadeGroup(g, v, mapFn){
  g.traverse(function(o){
    if (o.material && o.material.transparent !== false){
      var base = o.userData.baseOp;
      if (base == null){ base = (o.material.opacity != null ? o.material.opacity : 1); o.userData.baseOp = base; }
      o.material.opacity = (mapFn?mapFn(base):base) * v;
    }
    if (o.material && o.material.uniforms && o.material.uniforms.uOp){
      var b2 = o.userData.baseUOp;
      if (b2 == null){ b2 = o.material.uniforms.uOp.value; o.userData.baseUOp = b2; }
      o.material.uniforms.uOp.value = b2 * v;
    }
  });
}
/* Đặt trực tiếp opacity một sprite/mesh (không đụng baseOp). */
function op(o, v){ if (o && o.material) o.material.opacity = v; }
/* Đặt độ dài + góc cho một quad dùng làm nét nối hai điểm. */
function setLine(m, x0,y0,x1,y1, w){
  var dx=x1-x0, dy=y1-y0, L=Math.max(0.0001,Math.sqrt(dx*dx+dy*dy));
  m.scale.set(L, w==null?1:w, 1);
  m.position.set((x0+x1)/2,(y0+y1)/2,m.position.z);
  m.rotation.z=Math.atan2(dy,dx);
}
/* Camera: đặt vị trí + hướng nhìn. */
function cam(x,y,z, tx,ty,tz, fov){
  camera.position.set(x,y,z);
  camera.lookAt(tx||0,ty||0,tz||0);
  if (fov && camera.fov!==fov){ camera.fov=fov; camera.updateProjectionMatrix(); }
}
var TMP = new THREE.Vector3();

/* Trail thẳng: đuôi kéo dài L phía sau đầu theo hướng dir. */
function straightTrail(tl, hx,hy,hz, dx,dy,dz, L){
  tl.userData.setPath(function(k){
    return { x:hx-dx*L*k, y:hy-dy*L*k, z:hz-dz*L*k };
  });
}

/* ==========================================================================
 * CHƯƠNG 1 (S01–S15)
 * ========================================================================== */
function renderCH1(t){
  /* ---- S01 + S69: căn phòng tối (motif 3 — cùng khung, khác một chi tiết) */
  var vDark = Math.max(W(t,'S01',0.35), W(t,'S69',0.35));
  if (show(gDark, vDark)){
    var breath = 0.5+0.5*Math.sin(t*(Math.PI*2/4.5));   /* nhịp thở 4.5s */
    darkFbm.userData.mat.uniforms.uT.value = t;
    darkFbm.userData.mat.uniforms.uBreath.value = breath;
    darkFbm.userData.mat.uniforms.uOp.value = vDark;
    /* drift 2% gần như không thấy */
    var dr = Math.sin(t*0.09)*0.02;
    cam(dr*0.6, 0.02+dr, 2.6, 0,0,0, 30);
    /* di sản của S08 chỉ hiện ở S69 */
    var leg = W(t,'S69',0.35);
    darkLegacy.material.uniforms.uEm.value = 0.45;
    darkLegacy.material.uniforms.uOp.value = leg*0.85;
    darkLegacy.userData.reveal(1.0, 1.0);
    darkLegacy.visible = leg>0.01;
  }

  /* ---- S02: mở mắt — khe sáng mở, đồng tử co 7mm → 3mm ---------------- */
  var vIris2 = W(t,'S02',0.25);
  var vIris86 = W(t,'S86',0.5);
  var vIris = Math.max(vIris2, vIris86);
  if (show(gIris, vIris)){
    var um = irisMesh.userData.mat.uniforms;
    if (vIris2 >= vIris86){
      var k = ts(t,'S02');
      /* khe mở theo ease-out 0.9s */
      var open = smooth(clamp(k/0.9,0,1));
      lidTop.material.opacity = 1; lidBot.material.opacity = 1;
      lidTop.position.y = 1.5 + open*2.1;
      lidBot.position.y = -1.5 - open*2.1;
      /* đồng tử co 7mm → 3mm trong 1.2s SAU khi mở hết */
      /* đồng tử 7mm -> 3mm trên mống mắt ~12mm => bán kính tương đối
       * 0.58 -> 0.25. Trước đây dừng ở 0.32 nên con ngươi chiếm gần hết
       * khung, đọc thành "bánh xe" chứ không phải con mắt. */
      var shrink = smooth(clamp((k-0.9)/1.2,0,1));
      um.uPupil.value = 0.58 - shrink*0.33;
      um.uEm.value = 0.90;
      /* rack focus: mờ → nét, giả bằng scale + CA của lens (xử lý ở ngoài) */
      irisMesh.scale.setScalar(3.5 + (1-open)*0.35);
      irisMesh.position.set(0,0,0);
      op(irisStarRefl,0); op(irisPhoton,0);
      cam(0,0,7.4, 0,0,0, 30);
    } else {
      /* S86: cực cận con ngươi, tĩnh tuyệt đối. Mống mắt <= 0.6 */
      lidTop.material.opacity=0; lidBot.material.opacity=0;
      um.uPupil.value = 0.27; um.uEm.value = 0.58;
      irisMesh.scale.setScalar(3.1); irisMesh.position.set(0,0,0);
      /* phản chiếu MỘT mảnh ngôi sao (không phải cả bầu trời) */
      var ki = loc(t,'S86');
      op(irisStarRefl, 0.55*smooth(clamp(ki*3,0,1)));
      irisStarRefl.scale.set(1,1,1);
      /* chấm sáng nằm im, KHÔNG nhấp nháy, KHÔNG tan (motif 1) */
      irisPhoton.userData.setEm(1.9);
      op(irisPhoton, smooth(clamp(ki*4,0,1)));
      cam(0,0,9.4, 0,0,0, 30);
    }
    um.uOp.value = vIris;
  }

  /* ---- S03: mưa photon — 40.000 hạt lao vào và TẮT khi chạm ---------- */
  var vRain = W(t,'S03',0.28);
  if (show(gRain, vRain)){
    var kr = loc(t,'S03');
    /* mật độ va chạm TĂNG ĐỘT NGỘT tại cue */
    var dens = 0.14 + smooth(clamp((kr-0.10)/0.18,0,1))*0.86;
    rainPts.userData.step(t, 0.55, dens);
    rainPts.material.uniforms.uOp.value = vRain;
    /* camera đặt NGAY TẠI vị trí mắt, tĩnh */
    cam(0,0,0.5, 0,0,-30, 52);
  }

  /* ---- S04: slow-mo, theo một hạt tới bề mặt võng mạc ---------------- */
  var vCell = W(t,'S04',0.3);
  if (show(gCell, vCell)){
    var kc = loc(t,'S04');
    var hitK = 0.44;     /* khoảnh khắc chạm */
    var appr = clamp(kc/hitK,0,1);
    /* hạt chủ thể: điểm loé DUY NHẤT trong khung */
    cellPhoton.position.set(2.4-appr*2.4, 1.6-appr*1.9, 6.0-appr*10.6);
    cellPhoton.userData.setEm(2.4);
    op(cellPhoton, kc<hitK ? vCell : 0);
    /* xung điện lam chạy dọc sợi thần kinh, tốc độ 1/3 photon */
    var pk = clamp((kc-hitK)/0.50,0,1);
    nerveLine.userData.grow(pk);
    nerveLine.material.opacity = (kc>hitK?1:0)*vCell*0.75;
    var np = nerveLine.userData.at(pk);
    nervePulse.position.copy(np);
    op(nervePulse, (kc>hitK?1:0)*vCell*(1-pk*0.4));
    cellSurf.userData.mat.uniforms.uT.value = t;
    cellSurf.userData.mat.uniforms.uOp.value = vCell;
    cellSurf.userData.mat.uniforms.uEm.value = 0.52;
    /* dolly-in 35mm → 100mm */
    var f = 52 - appr*30;
    cam(0.4, 0.3, 7.2-appr*5.4, 0,0,-6, f);
  }

  /* ---- S05: card định danh — shot DUY NHẤT của CH1 được loé hết cỡ --- */
  var vCard = W(t,'S05',0.25);
  if (show(gCard, vCard)){
    var kd = loc(t,'S05');
    cardPhoton.userData.setEm(3.0);
    op(cardPhoton, vCard);
    /* quầng nhiễu xạ 6 tia, biên độ dao động theo sin(3t) */
    var sp = 1.7 + Math.sin(t*3.0)*0.22;
    cardSpikes.scale.set(sp,sp,1);
    fadeGroup(cardSpikes, vCard*smooth(clamp(kd*3,0,1)));
    op(cardName, vCard*smooth(clamp((kd-0.12)*4,0,1)));
    op(cardSub,  vCard*smooth(clamp((kd-0.34)*4,0,1))*0.72);
    cam(0,0,9.0, 0,0,0, 36);
  }

  /* ---- S06: CAO TRÀO — hình cũ bị GẠCH BỎ --------------------------- */
  var vGhost = WH(t,'S06') ? 1 : 0;
  if (show(gGhost, vGhost)){
    var kg = loc(t,'S06');
    /* hạt ma bay XUYÊN QUA, quỹ đạo KHÔNG đổi hướng */
    var gx = -9.5 + clamp(kg/0.42,0,1)*19.0;
    ghostP.position.set(gx, 0.6, 0.3);
    straightTrail(ghostTrail, gx,0.6,0.3, 1,0,0, 3.4);
    ghostTrail.userData.mat.uniforms.uOp.value = 0.8;
    op(ghostP, 1);
    /* sau 1.2s (tính từ lúc xuyên xong) → xám + gạch chéo đỏ */
    var strikeK = clamp((kg-0.50)/0.16,0,1);
    ghostGrey.material.opacity = smooth(strikeK)*0.72;     /* desaturate 85% */
    var sw = smooth(clamp((kg-0.56)/0.14,0,1));
    strikeMark.scale.set(sw,1,1);
    op(strikeMark, sw*0.9);
    ghostBody.material.opacity = 0.42*(1-smooth(strikeK)*0.6);
    ghostRim.material.opacity  = 0.20*(1-smooth(strikeK)*0.6);
    cam(0,0,15.5, 0,0,0, 46);
  }

  /* ---- S07: CAO TRÀO — photon ĐÂM vào và DỪNG LẠI ------------------- */
  var vHit = WH(t,'S07') ? 1 : 0;
  if (show(gHit, vHit)){
    var kh = loc(t,'S07');
    var impact = 0.52;
    var kk = clamp(kh/impact,0,1);
    var ease = kk*kk;     /* lao NHANH dần theo hạt */
    var px = -70 + ease*73.4, py = 6.0 - ease*5.25, pz = -40 + ease*40.3;
    if (kh < impact){
      hitPhoton.position.set(px,py,pz);
      straightTrail(hitTrail, px,py,pz, 0.86,-0.06,0.47, 26);
      hitTrail.userData.mat.uniforms.uOp.value = 0.85;
      op(hitPhoton,1); op(hitMark,0);
    } else {
      /* DỪNG LẠI VÀ Ở LẠI — chấm sáng tĩnh trên da, giữ tới hết cue */
      op(hitPhoton,0);
      hitTrail.userData.mat.uniforms.uOp.value = 0;
      hitMark.userData.setEm(1.6);
      op(hitMark,1);
    }
    /* camera lao theo hạt rồi DỪNG KHỰNG cùng lúc hạt dừng */
    var cz = 46 - ease*36, cx = -22 + ease*23;
    cam(cx, 1.4, cz, 3.6, 0.4, 0, 46 - ease*8);
    hitStars.material.uniforms.uOp.value = 0.62;
  }

  /* ---- S08: CAO TRÀO — hàng chục nghìn chấm dừng lại --------------- */
  var vFace = W(t,'S08',0.5);
  if (show(gFace, vFace)){
    var kf = loc(t,'S08');
    /* mật độ chấm tăng theo t đến hàng chục nghìn */
    faceDots.userData.reveal(smooth(clamp(kf*1.25,0,1)));
    /* emissive 0.80 theo bảng storyboard (impactDots đã nâng ~3% chấm lên
     * 1.5). uEm ở đây là BỘI SỐ chung — để 1.0 là nhân đôi lần nữa. */
    faceDots.material.uniforms.uEm.value = 0.62;
    faceDots.material.uniforms.uOp.value = vFace*0.70;
    faceMesh.material.opacity = vFace;
    faceSkin.material.uniforms.uOp.value = vFace;
    faceSkin.material.uniforms.uT.value = t;
    /* pull-back chậm từ chấm sáng ra toàn khuôn mặt nghiêng */
    var z = 2.2 + smooth(kf)*16.0;
    cam(3.2-smooth(kf)*2.8, 0.9-smooth(kf)*0.6, z, 0.6,0.2,0, 42);
  }

  /* ---- S09: photon tĩnh + đồng hồ KHÔNG quay ---------------------- */
  var vClock = W(t,'S09',0.4);
  if (show(gClock, vClock)){
    var kc2 = loc(t,'S09');
    clockPhoton.userData.setEm(1.9);
    fadeGroup(gClock, vClock);
    /* kim ĐỨNG IM tuyệt đối */
    clockHand.rotation.z = 0; clockHand2.rotation.z = 0;
    /* các vòng đếm khác VẪN quay để tương phản */
    clockOuter1.rotation.z = t*0.32;
    clockOuter2.rotation.z = -t*0.17;
    op(clockLbl2, vClock*smooth(clamp((kc2-0.50)*3.4,0,1)));
    cam(-0.4,0,14.5, -0.4,0,0, 46);
  }

  /* ---- S10: thang 13 tỉ năm ---------------------------------------- */
  var vT13 = W(t,'S10',0.4);
  if (show(gTime13, vT13)){
    var k10 = loc(t,'S10');
    fadeGroup(gTime13, vT13);
    t13Gal.rotation.y = 0.4 + t*0.012;
    t13Gal2.rotation.y = -0.8 - t*0.009;
    /* photon bay dọc dải, trail LIÊN TỤC không đứt */
    var tx = -21.0 + k10*42.0;
    t13Photon.position.set(tx, -1.4+Math.sin(k10*2.2)*0.5, 0.4);
    t13Trail.userData.setPath(function(kk){
      var xx = tx - kk*16.0;
      return { x:xx, y:-1.4+Math.sin(((xx+21)/42)*2.2)*0.5, z:0.4 };
    });
    t13Trail.userData.mat.uniforms.uOp.value = vT13*0.9;
    for (var li=0;li<t13Labels.length;li++){
      var mx = T13_MARKS[li][0];
      op(t13Labels[li], vT13*smooth(clamp((tx-mx+3.0)/2.2,0,1))*0.85);
    }
    /* truck ngang trái → phải, tốc độ đều */
    cam(-19.0+k10*40.0, -0.6, 15.5, -19.0+k10*40.0, -1.4, 0, 40);
  }

  /* ---- S11: ba dòng phủ định, kết ở số 0 --------------------------- */
  var vZero = W(t,'S11',0.22);
  if (show(gZero, vZero)){
    var k11 = loc(t,'S11');
    var a1 = smooth(clamp(k11*5,0,1)), a2 = smooth(clamp((k11-0.22)*5,0,1));
    var a3 = smooth(clamp((k11-0.46)*5,0,1));
    /* hai dòng đầu mờ còn 20% khi dòng ba lên */
    var dim = 1 - a3*0.80;
    op(zLine1, vZero*a1*dim); op(zLine2, vZero*a2*dim); op(zLine3, vZero*a3);
    /* số 0 = vòng tròn hoàn hảo, nét ĐỀU */
    var a4 = smooth(clamp((k11-0.62)*4,0,1));
    fadeGroup(zeroRing, vZero*a4*0.88);
    /* zoom-in cực chậm 3% */
    cam(0,0,11.0-k11*0.33, 0,0,0, 40);
  }

  /* ---- S12: ds² = c²dt² − dx² -------------------------------------- */
  var vEq = W(t,'S12',0.35);
  if (show(gEq, vEq)){
    var k12 = loc(t,'S12');
    var sk = smooth(clamp(k12/0.34,0,1));
    op(eqL, vEq*sk*0.92);
    /* stroke chạy dần dưới công thức */
    eqStroke.scale.set(sk*9.6, 1, 1);
    eqStroke.position.x = -4.8 + sk*4.8;
    op(eqStroke, vEq*sk*0.45*(1-smooth(clamp((k12-0.44)*5,0,1))));
    /* vế phải triệt tiêu: hai số hạng TRƯỢT vào nhau rồi tắt */
    var mg = smooth(clamp((k12-0.46)/0.26,0,1));
    eqA.position.x = -2.0 + mg*2.0; eqB.position.x = 2.0 - mg*2.0;
    var fadeAB = 1 - smooth(clamp((k12-0.68)*5,0,1));
    op(eqA, vEq*smooth(clamp((k12-0.44)*5,0,1))*fadeAB*0.85);
    op(eqB, vEq*smooth(clamp((k12-0.44)*5,0,1))*fadeAB*0.85);
    op(eqZ, vEq*smooth(clamp((k12-0.72)*5,0,1))*0.95);
    /* hơi nghiêng 2° cho có hơi người */
    camera.rotation.z = 0;
    cam(0,-0.35,10.8, 0,-0.35,0, 42);
    camera.rotation.z = 2*Math.PI/180;
  } else { camera.rotation.z = 0; }

  /* ---- S13: bóng đèn ----------------------------------------------- */
  var vLamp = W(t,'S13',0.45);
  if (show(gLamp, vLamp)){
    var k13 = loc(t,'S13');
    /* camera quay 180° bỏ mặc đồ vật, đi tới đúng sợi tóc */
    var turn = smooth(clamp((k13-0.16)/0.52,0,1));
    var dist = 15.0 - turn*13.2;
    var ang = -0.35 + turn*Math.PI*0.92;
    cam(Math.sin(ang)*dist, 0.9-turn*0.9, Math.cos(ang)*dist, 0,0,0, 46-turn*12);
    /* đồ vật giảm dần sáng về silhouette */
    lampObjs.traverse(function(o){
      if (o.material && o.material.emissiveIntensity!=null){
        o.material.emissiveIntensity = 0.5*(1-turn*0.95);
        o.material.opacity = vLamp;
        o.material.transparent = true;
      }
    });
    /* sợi tóc: emissive đỉnh 2.2 CHỈ trên vùng sợi mảnh */
    for (var fi=0; fi<filamentMats.length; fi++){
      filamentMats[fi].opacity = vLamp*(0.35+turn*0.65);
    }
    bulbGlass.material.opacity = vLamp*0.05*(0.3+turn*0.7);
    lampDust.material.uniforms.uOp.value = vLamp*(0.25+turn*0.75);
    lampDust.material.uniforms.uEm.value = 0.55;
  }

  /* ---- S14: chọn một hạt -------------------------------------------- */
  var vPick = W(t,'S14',0.3);
  if (show(gPick, vPick)){
    var k14 = loc(t,'S14');
    pickPlasma.userData.mat.uniforms.uT.value = t;
    pickPlasma.userData.mat.uniforms.uOp.value = vPick;
    /* snap-zoom nhanh MỘT nhịp vào hạt chủ thể */
    var snap = smooth(clamp((k14-0.14)/0.10,0,1));
    /* các hạt khác giảm sáng 70% khi khoá */
    pickSwarm.material.uniforms.uOp.value = vPick*(1-snap*0.70);
    pickSwarm.material.uniforms.uEm.value = 1.0;
    pickHero.position.set(0.6, 0.2, 2.0);
    pickHero.userData.setEm(2.0);
    op(pickHero, vPick);
    /* vòng khoá mảnh — không HUD sci-fi, chỉ nét tròn mờ */
    pickRing.position.copy(pickHero.position);
    var rs = 1.0 + (1-snap)*1.4;
    pickRing.scale.setScalar(rs);
    fadeGroup(pickRing, vPick*snap*0.34);
    cam(0.6*snap, 0.2*snap, 24.0-snap*18.0, 0.6*snap,0.2*snap,0, 46-snap*14);
  }

  /* ---- S15: lao ngược vào chiều sâu Mặt Trời ----------------------- */
  var vDive = W(t,'S15',0.5);
  if (show(gDive, vDive)){
    var k15 = loc(t,'S15');
    /* tốc độ tăng dần: dolly-in dài, xuyên qua từng lớp */
    var depth = k15*k15;
    var z = 72 - depth*70;
    cam(0, 0, z, 0,0,0, 56);
    for (var di=0; di<diveLayers.length; di++){
      var L = diveLayers[di];
      /* lớp ở phía trước camera thì hiện, đã qua thì tắt */
      var infront = clamp((z - 2) / 60, 0, 1);
      L.mat.opacity = vDive*0.13*L.em*(0.35+infront*0.9);
    }
    divePlasma.material.uniforms.uOp.value = vDive;
    divePlasma.material.uniforms.uEm.value = 0.88;
    diveConv.material.uniforms.uOp.value = vDive*(1-depth*0.8);
    diveConv.rotation.y = t*0.03;
  }
}


/* ==========================================================================
 * CHƯƠNG 2 (S16–S40)
 * ========================================================================== */
function renderCH2(t){
  /* ---- S16: tâm Mặt Trời — nén, rung ------------------------------- */
  var vCore = W(t,'S16',0.45);
  if (show(gCore, vCore)){
    var k16 = loc(t,'S16');
    /* chuyển động NHIỆT nhanh nhưng KHÔNG đi xa — dao động quanh vị trí */
    corePlasma.userData.jiggle(t, 0.42);
    corePlasma.material.uniforms.uOp.value = vCore;
    corePlasma.material.uniforms.uEm.value = 1.30;
    op(coreStat1, vCore*smooth(clamp((k16-0.18)*3.2,0,1))*0.80);
    op(coreStat2, vCore*smooth(clamp((k16-0.46)*3.2,0,1))*0.80);
    /* rung tần số thấp biên độ nhỏ (áp suất) */
    var sh = Math.sin(t*9.4)*0.045 + Math.sin(t*5.1)*0.03;
    cam(sh, sh*0.6, 21.0, 0,0,0, 30);
  }

  /* ---- S17: nguyên tử hydro bị xé ---------------------------------- */
  var vRip = W(t,'S17',0.4);
  if (show(gRip, vRip)){
    var k17 = loc(t,'S17');
    var pullback = smooth(clamp((k17-0.44)/0.40,0,1));
    /* nhiệt độ tăng = biên độ rung tăng */
    var heat = clamp(k17/0.36,0,1);
    var jig = heat*0.30;
    ripNuc.position.set(Math.sin(t*7.1)*jig, Math.cos(t*6.3)*jig, 0);
    /* electron bứt ra theo quỹ đạo MỞ */
    var esc = smooth(clamp((k17-0.30)/0.16,0,1));
    var orbR = 2.4 + esc*esc*16.0;
    var oa = t*1.6;
    ripEle.position.set(Math.cos(oa)*orbR, Math.sin(oa)*orbR*0.8, 0);
    op(ripNuc, vRip*(1-pullback*0.85));
    op(ripEle, vRip*(1-pullback*0.85));
    fadeGroup(ripOrbit, vRip*(1-esc)*(1-pullback)*0.26);
    ripField.userData.step(esc, 1);
    ripField.material.uniforms.uOp.value = vRip*pullback*0.85;
    ripField.material.uniforms.uEm.value = 1.15;
    op(ripLbl, vRip*smooth(clamp((k17-0.70)*4,0,1))*0.85);
    cam(0,0, 9.0 + pullback*44.0, 0,0,0, 40);
  }

  /* ---- S18: không phải lửa — split đôi ----------------------------- */
  var vFire = W(t,'S18',0.35);
  if (show(gFire, vFire)){
    var k18 = loc(t,'S18');
    /* nửa "lửa" tắt, plasma TRÀN sang với ease chậm, nặng */
    var flood = smooth(clamp((k18-0.52)/0.40,0,1));
    var fl = vFire*(1-flood);
    flamePts.material.uniforms.uOp.value = fl;
    smokePts.material.uniforms.uOp.value = fl*0.7;
    /* lửa có HƯỚNG LÊN: dịch theo t */
    flamePts.position.y = (t*1.4)%2.0 - 1.0;
    smokePts.position.y = (t*0.7)%3.0;
    plasmaBlock.material.uniforms.uOp.value = vFire;
    plasmaBlock.material.uniforms.uEm.value = 0.95;
    /* plasma tràn kín khung khi lửa tắt */
    plasmaBlock.scale.set(1+flood*1.35, 1+flood*0.35, 1);
    plasmaBlock.position.x = -flood*6.8;
    op(fireL1, vFire*(1-flood)*smooth(clamp(k18*3,0,1))*0.80);
    op(fireL2, vFire*smooth(clamp(k18*3,0,1))*0.80);
    fireSplit.material.opacity = vFire*(1-flood)*0.14;
    cam(0,0,17.0, 0,0,0, 46);
  }

  /* ---- S19: ra đời --------------------------------------------------- */
  var vBirth = W(t,'S19',0.3);
  if (show(gBirth, vBirth)){
    var k19 = loc(t,'S19');
    var fuse = 0.42;
    var app = smooth(clamp(k19/fuse,0,1));
    bProtonA.position.set(-4.6+app*4.4, 0.5-app*0.5, 0);
    bProtonB.position.set( 4.6-app*4.4,-0.5+app*0.5, 0);
    op(bProtonA, vBirth*(k19<fuse?1:0.0));
    op(bProtonB, vBirth*(k19<fuse?1:0.0));
    /* photon sinh ra: emissive 2.6 trong ~4 frame rồi hạ về 1.6 */
    var born = clamp((k19-fuse)/0.02,0,1);
    var flashOff = clamp((k19-fuse-0.03)/0.05,0,1);
    bPhoton.userData.setEm(2.6 - flashOff*1.0);
    op(bPhoton, vBirth*born);
    bPhoton.position.set(0,0,0.2);
    /* sản phẩm phụ: positron + neutrino bay ra hai hướng (nhắc tập cũ) */
    var side = clamp((k19-fuse)/0.30,0,1);
    bPositron.position.set(side*7.0, side*2.4, 0);
    op(bPositron, vBirth*born*(1-side)*0.85);
    var nx = side*16.0;
    straightTrail(bNeutrino, -nx,-side*3.0,0, -1,-0.19,0, 5.0);
    bNeutrino.userData.mat.uniforms.uOp.value = vBirth*born*(1-clamp(side*2.4,0,1))*0.6;
    /* vòng sóng áp suất lan ra MỘT lần rồi tắt */
    var wv = clamp((k19-fuse)/0.34,0,1);
    bWave.scale.setScalar(0.3+wv*5.4);
    fadeGroup(bWave, vBirth*born*(1-wv)*0.55);
    op(birthLbl, vBirth*smooth(clamp((k19-0.62)*4,0,1))*0.80);
    /* nhích nhẹ LÙI ở khoảnh khắc sinh */
    cam(0,0, 11.0 + born*1.8, 0,0,0, 40);
  }

  /* ---- S20: tốc độ duy nhất --------------------------------------- */
  var vSpeed = W(t,'S20',0.3);
  if (show(gSpeed, vSpeed)){
    var k20 = loc(t,'S20');
    var x = -9.5 + k20*19.0;
    spPhoton.position.set(x, 1.2, 0);
    straightTrail(spTrail, x,1.2,0, 1,0,0, 2.6);
    spTrail.userData.mat.uniforms.uOp.value = vSpeed*0.85;
    spPhoton.userData.setEm(1.8);
    op(spPhoton, vSpeed);
    spAxis.material.opacity = vSpeed*0.36;
    spTick.material.opacity = vSpeed*0.60;
    op(spLbl,  vSpeed*smooth(clamp((k20-0.22)*4,0,1))*0.85);
    op(spLbl2, vSpeed*smooth(clamp((k20-0.58)*4,0,1))*0.62);
    /* tracking ngang, tốc độ khớp TUYỆT ĐỐI */
    cam(x, 0, 13.0, x, 0, 0, 46);
  }

  /* ---- S21: va chạm đầu tiên (hard cut từ S20) --------------------- */
  var vColl = WH(t,'S21') ? 1 : 0;
  if (show(gColl, vColl)){
    var k21 = loc(t,'S21');
    var hit = 0.40;
    var kk = clamp(k21/hit,0,1);
    var px = -6.0 + kk*8.6;
    coPhoton.position.set(px, 0.4, 0);
    straightTrail(coTrail, px,0.4,0, 1,0,0, 2.0);
    coTrail.userData.mat.uniforms.uOp.value = (k21<hit?1:0)*0.85;
    op(coPhoton, k21<hit ? 1 : 0);
    /* electron hiện ra ĐỘT NGỘT từ trong bóng tối plasma */
    op(coElectron, clamp((k21-0.24)*9,0,1));
    /* tại va chạm: electron sáng gấp đôi trong ~3 frame */
    var flash = clamp(1-(k21-hit)/0.045,0,1)*(k21>=hit?1:0);
    coElectron.userData.setEm(1.1 + flash*1.1);
    coRule.material.opacity = 0.55; coRuleA.material.opacity=0.55; coRuleB.material.opacity=0.55;
    op(coLbl, smooth(clamp((k21-0.18)*4,0,1))*0.80);
    coDark.material.uniforms.uOp.value = 0.85;
    /* camera GIẬT NHẸ 1 frame lúc va */
    var jolt = (k21>=hit && k21<hit+0.012) ? 0.30 : 0;
    cam(jolt*0.8, jolt, 12.5, 0,0,0, 46);
  }

  /* ---- S22 + S23: random walk (không cắt giữa hai shot) ----------- */
  var vWalk = W(t,'S22',0.3);
  if (show(gWalk, vWalk)){
    var k22 = loc(t,'S22');
    /* tăng tốc liên tục: đi được nhiều bước dần */
    var prog = k22*k22*0.55;
    walkLine.userData.grow(prog);
    walkLine.material.opacity = vWalk*0.90;
    var hp = walkLine.userData.at(prog);
    walkHead.position.copy(hp);
    walkHead.userData.setEm(1.8);
    op(walkHead, vWalk);
    /* số đếm va chạm chạy ở góc */
    walkCount.userData.set(Math.floor(prog*(WALK_PTS.length-1)).toLocaleString('vi-VN')+' va chạm');
    op(walkCount, vWalk*smooth(clamp(k22*4,0,1))*0.80);
    op(walkLbl, vWalk*smooth(clamp((k22-0.14)*3,0,1))*0.75);
    /* mỗi va chạm zoom-out 3% để dồn nhiều va chạm vào khung */
    var zo = 16.0 + prog*46.0;
    cam(hp.x*0.28, hp.y*0.28, zo, hp.x*0.35, hp.y*0.35, hp.z*0.35, 46);
  }

  var vWM = W(t,'S23',0.35);
  if (show(gWalkMany, vWM)){
    var k23 = loc(t,'S23');
    /* QUAN TRỌNG: bán kính tổng nở theo √(số bước), KHÔNG tuyến tính.
     * Phải NHÌN THẤY nó nở rất chậm dần. */
    var steps = clamp(k23,0,1);
    var sc = 0.22 + Math.sqrt(steps)*0.62;
    walkManyLines.scale.setScalar(sc);
    walkManyLines.material.opacity = vWM*0.55;
    walkManyLines.rotation.y = t*0.045;
    op(wmLbl, vWM*smooth(clamp((k23-0.42)*3.4,0,1))*0.78);
    /* pull-back tăng tốc */
    cam(0, 0, 22.0 + k23*k23*40.0, 0,0,0, 46);
  }

  /* ---- S24: người thừa kế ------------------------------------------ */
  var vHeir = W(t,'S24',0.35);
  if (show(gHeir, vHeir)){
    var k24 = loc(t,'S24');
    for (var hi=0;hi<heirDots.length;hi++){
      var appear = smooth(clamp((k24*1.18 - hi*0.070)*8,0,1));
      op(heirDots[hi], vHeir*appear);
      heirDots[hi].userData.setEm(1.5);
    }
    for (var ai=0;ai<heirAtoms.length;ai++){
      /* nguyên tử nuốt-rồi-nhả: phình lên rồi xẹp */
      var ap = clamp((k24*1.18 - ai*0.070 - 0.035)*10,0,1);
      var swell = Math.sin(clamp(ap,0,1)*Math.PI);
      heirAtoms[ai].scale.setScalar(1+swell*0.55);
      fadeGroup(heirAtoms[ai], vHeir*clamp(ap*2,0,1)*0.26);
    }
    /* dải năng lượng — thứ DUY NHẤT không đổi */
    heirBand.material.opacity = vHeir*smooth(clamp((k24-0.48)*3,0,1))*0.62;
    op(heirLbl, vHeir*smooth(clamp((k24-0.58)*3,0,1))*0.80);
    /* truck ngang chậm dọc chuỗi */
    var cx = -8.0 + k24*16.0;
    cam(cx, -0.4, 14.5, cx, -0.4, 0, 46);
  }

  /* ---- S25: năng lượng ngấm dần ra ngoài --------------------------- */
  var vSlice = W(t,'S25',0.4);
  if (show(gSlice, vSlice)){
    var k25 = loc(t,'S25');
    var u = sliceDisc.userData.mat.uniforms;
    u.uT.value = t; u.uOp.value = vSlice; u.uDark.value = 0;
    /* front đi được 6% bán kính trong CẢ shot — cực chậm */
    u.uFront.value = 0.10 + k25*0.06;
    u.uEm.value = 0.95;
    op(sliceLbl, vSlice*smooth(clamp((k25-0.30)*3,0,1))*0.80);
    cam(0,0, 17.0 + k25*3.4, 0,0,0, 46);
  }

  /* ---- S26: bước đi của người say ---------------------------------- */
  var vDrunk = W(t,'S26',0.35);
  if (show(gDrunk, vDrunk)){
    var k26 = loc(t,'S26');
    fadeGroup(gDrunk, vDrunk);
    var prog2 = clamp(k26*1.05,0,1);
    drunkLine.userData.grow(prog2*0.55);
    drunkLine.material.opacity = vDrunk*0.72;
    var dp = drunkLine.userData.at(prog2*0.55);
    drunkMan.position.set(dp.x, dp.y+0.85, 0.1);
    /* vòng tròn "vài mét" bao trọn toàn bộ vệt, hiện ở CUỐI shot */
    var rv = smooth(clamp((k26-0.68)*3.4,0,1));
    fadeGroup(drunkRing, vDrunk*rv*0.55);
    op(drunkLbl, vDrunk*rv*0.82);
    /* top-down phẳng, cuối shot tilt lên 20° để nối sang thang toán học */
    var tilt = smooth(clamp((k26-0.82)/0.18,0,1))*(20*Math.PI/180);
    cam(0, -1.0+Math.sin(tilt)*13.0, Math.cos(tilt)*13.0, 0,-1.0,0, 46);
  }

  /* ---- S27: quy luật √N ------------------------------------------- */
  var vSq = W(t,'S27',0.35);
  if (show(gSqrt, vSq)){
    var k27 = loc(t,'S27');
    var grow = smooth(clamp(k27/0.50,0,1));
    /* cột vỡ thành hạt ở C32 (nửa sau shot) */
    var burst = smooth(clamp((k27-0.62)/0.22,0,1));
    for (var bi=0;bi<sqBars.length;bi++){
      var B = sqBars[bi];
      var gg = clamp(grow*3 - Math.floor(bi/2)*0.85, 0, 1);
      var h = B.h*gg;
      B.m.scale.set(1, Math.max(0.001,h), 1);
      B.m.position.y = -5.25 + h/2;
      B.m.material.opacity = vSq*0.70*(1-burst);
    }
    for (var si=0;si<sqLabels.length;si++){
      op(sqLabels[si], vSq*clamp(grow*3-Math.floor(si/2)*0.85,0,1)*(1-burst)*0.82);
    }
    sqCurve.userData.grow(grow);
    sqCurve.material.opacity = vSq*grow*0.75*(1-burst*0.6);
    sqAxisX.material.opacity = vSq*0.32; sqAxisY.material.opacity = vSq*0.32;
    op(sqLbl, vSq*smooth(clamp((k27-0.60)*4,0,1))*0.85);
    /* hạt tán loạn */
    sqShards.material.uniforms.uOp.value = vSq*burst*(1-burst*0.35)*0.7;
    sqShards.position.y = burst*burst*3.2;
    sqShards.scale.set(1+burst*0.8, 1+burst*0.5, 1);
    /* camera pan nhẹ theo cột tăng */
    cam(1.4, -0.6 + grow*1.8, 17.5, 1.4, -0.6+grow*1.4, 0, 46);
  }

  /* ---- S28: đường thẳng lý tưởng — 2,5 giây THẬT ------------------- */
  var vIdeal = W(t,'S28',0.35);
  if (show(gIdeal, vIdeal)){
    var k28 = ts(t,'S28');
    /* đúng 2,5s thời gian thực để khán giả CẢM nhận sự ngắn */
    var r = clamp((k28-0.8)/2.5,0,1);
    setLine(idealRay, 0,0, Math.cos(0.42)*5.6*r, Math.sin(0.42)*5.6*r, 1);
    idealRay.scale.y = 1;
    op(idealRay, vIdeal*(r>0?1:0)*0.95);
    idealRay.material.opacity = vIdeal*(r>0.001?0.95:0);
    fadeGroup(idealDisc, vIdeal*0.30);
    idealFill.material.opacity = vIdeal*0.24;
    idealClock.userData.set(((k28-0.8)<0?0:Math.min(2.5,k28-0.8)).toFixed(1)+' s');
    op(idealClock, vIdeal*clamp((k28-0.6)*3,0,1)*0.85);
    op(idealLbl, vIdeal*smooth(clamp(k28*0.5,0,1))*0.82);
    cam(0,0,16.5, 0,0,0, 46);
  }

  /* ---- S29: CAO TRÀO — 170.000 NĂM -------------------------------- */
  var vBig = W(t,'S29',0.22);
  if (show(gBig, vBig)){
    var k29 = loc(t,'S29');
    op(bigNum, vBig*smooth(clamp(k29*3.5,0,1))*0.95);
    /* random walk của S23 chạy phía sau ở ~8% — gần như không thấy.
     * Ở 0.045 cụm sợi vẫn dồn thành quầng sáng ngay sau chữ và nuốt mất
     * nét. Hạ tiếp + TRẢI RỘNG để nó thành nền chứ không thành đèn. */
    bigWalkBg.material.opacity = vBig*0.022;
    bigWalkBg.rotation.y = t*0.045;
    bigWalkBg.scale.setScalar(1.55);
    cam(0,0,13.0, 0,0,0, 46);
  }

  /* ---- S30: CAO TRÀO — thang so sánh đọc trong 3 giây ------------- */
  var vCmp = W(t,'S30',0.35);
  if (show(gCmp, vCmp)){
    var k30 = loc(t,'S30');
    /* thanh trên dài 1200% khung, phải pan mới lộ đuôi */
    var grow2 = smooth(clamp(k30/0.34,0,1));
    var LONG = 132.0;
    cmpBarLong.scale.set(LONG*grow2, 1, 1);
    cmpBarLong.position.set(-9.6 + LONG*grow2/2, 2.2, 0);
    cmpBarLong.material.opacity = vCmp*0.80;
    cmpBarShort.material.opacity = vCmp*0.80*smooth(clamp((k30-0.30)*4,0,1));
    op(cmpLblLong1,  vCmp*smooth(clamp(k30*4,0,1))*0.85);
    op(cmpLblLong2,  vCmp*smooth(clamp((k30-0.10)*4,0,1))*0.90);
    op(cmpLblShort1, vCmp*smooth(clamp((k30-0.32)*4,0,1))*0.85);
    op(cmpLblShort2, vCmp*smooth(clamp((k30-0.40)*4,0,1))*0.90);
    op(cmpRatio,     vCmp*smooth(clamp((k30-0.54)*4,0,1))*0.85);
    /* quãng đường THẬT (sợi rối) so với Ngân Hà */
    var tg = smooth(clamp((k30-0.58)*3,0,1));
    cmpTangle.material.opacity = vCmp*tg*0.30;
    cmpTangle.rotation.y = t*0.05;
    cmpGal.material.uniforms.uOp.value = vCmp*tg;
    cmpGal.rotation.y = t*0.012;
    op(cmpGalLbl, vCmp*tg*0.75);
    /* pan phải rất chậm để lộ đuôi thanh dài */
    var pan = smooth(clamp((k30-0.14)/0.80,0,1));
    cam(-0.6 + pan*7.2, 0, 18.0, -0.6+pan*7.2, 0, 0, 46);
  }

  /* ---- S31: savanna châu Phi --------------------------------------- */
  var vSav = W(t,'S31',0.4);
  if (show(gSav, vSav)){
    var k31 = loc(t,'S31');
    fadeGroup(gSav, vSav);
    savStars.material.uniforms.uOp.value = vSav*0.85;
    savStars.rotation.y = t*0.004;
    op(savLbl, vSav*smooth(clamp((k31-0.18)*3,0,1))*0.85);
    /* drift rất chậm */
    cam(Math.sin(t*0.05)*0.7, -1.4, 13.0, 0,-1.2,0, 50);
  }

  /* ---- S32: nắng trên mu bàn tay ------------------------------------ */
  var vHand = W(t,'S32',0.35);
  if (show(gHand, vHand)){
    var k32 = loc(t,'S32');
    var uh = handSkin.userData.mat.uniforms;
    uh.uT.value = t; uh.uOp.value = vHand; uh.uEm.value = 0.70;  /* KHÔNG cho cháy */
    handDust.material.uniforms.uOp.value = vHand*0.75;
    handDust.position.y = (t*0.30)%4.0 - 2.0;
    handRays.children.forEach(function(q){ q.material.opacity = vHand*0.045; });
    /* vài photon-trail rất mảnh đáp xuống da rồi tắt */
    var lk = (t*0.55)%1.0;
    straightTrail(handPhotons, -6+lk*14, 7-lk*13, 2.6-lk*2.4, 0.72,-0.68,-0.12, 3.0);
    handPhotons.userData.mat.uniforms.uOp.value = vHand*(1-lk)*0.55;
    handDots.userData.reveal(smooth(clamp(k32*1.4,0,1)), 0.55);
    handDots.material.uniforms.uEm.value = 0.9;
    handDots.material.uniforms.uOp.value = vHand*0.55;
    cam(0,0, 13.5, 0,0,0, 40);
  }

  /* ---- S33: nếu lõi tắt ngóm --------------------------------------- */
  var vOff = W(t,'S33',0.4);
  if (show(gOff, vOff)){
    var k33 = loc(t,'S33');
    var uo = offDisc.material.uniforms;
    uo.uT.value = t; uo.uOp.value = vOff; uo.uEm.value = 0.95;
    /* lõi chuyển sáng → đen trong 0.4s; bề mặt KHÔNG đổi */
    uo.uDark.value = smooth(clamp((ts(t,'S33')-1.2)/0.4,0,1));
    /* mặt sóng tối lan CỰC chậm — đi ~4% bán kính suốt shot */
    uo.uFront.value = 0.06 + clamp((k33-0.22)/0.78,0,1)*0.04;
    /* đồng hồ phụ: các thế hệ người xuất hiện rồi biến mất */
    for (var gi=0; gi<offGenDots.length; gi++){
      var ph = (k33*3.4 - gi*0.16);
      var vis = Math.sin(clamp(ph,0,1)*Math.PI);
      offGenDots[gi].material.opacity = vOff*clamp(vis,0,1)*0.42;
    }
    op(offLbl, vOff*smooth(clamp((k33-0.44)*3,0,1))*0.80);
    cam(0,0.9,17.0, 0,0.9,0, 46);
  }

  /* ---- S34: plasma loãng ra ---------------------------------------- */
  var vThin = W(t,'S34',0.4);
  if (show(gThin, vThin)){
    var k34 = loc(t,'S34');
    thinField.material.uniforms.uOp.value = vThin*(1-k34*0.55);
    thinField.material.uniforms.uEm.value = 0.85;
    var pg = clamp(k34*1.05,0,1);
    thinLine.userData.grow(pg);
    thinLine.material.opacity = vThin*0.82;
    var tp = thinLine.userData.at(pg);
    thinHead.position.copy(tp);
    thinHead.userData.setEm(1.7);
    op(thinHead, vThin);
    /* dolly-out tốc độ tăng dần — cảm giác nổi lên mặt nước */
    var z = tp.z + 22.0 - k34*k34*6.0;
    cam(tp.x*0.4, tp.y*0.4, z, tp.x*0.5, tp.y*0.5, tp.z, 50);
  }

  /* ---- S35: photosphere -------------------------------------------- */
  var vPhoto = W(t,'S35',0.4);
  if (show(gPhoto, vPhoto)){
    var k35 = loc(t,'S35');
    /* lật từ "nhìn từ dưới lớp lên" thành "nhìn từ ngoài vào toàn đĩa" */
    var flip = smooth(clamp((k35-0.38)/0.42,0,1));
    var up = photoPlane.userData.mat.uniforms;
    up.uT.value = t; up.uEm.value = 1.10; up.uOp.value = vPhoto*(1-flip);
    var us = photoSphere.userData.mat.uniforms;
    us.uT.value = t; us.uEm.value = 1.18; us.uOp.value = vPhoto*flip;
    photoSphere.material.opacity = vPhoto*flip;
    photoSphere.rotation.y = t*0.020;
    photoProm.material.opacity = vPhoto*flip*smooth(clamp((k35-0.62)*4,0,1))*0.55;
    op(photoLbl, vPhoto*smooth(clamp((k35-0.50)*3,0,1))*0.82);
    cam(0, 0, 16.0 - (1-flip)*2.0 + flip*7.0, 0,0,0, 46);
  }

  /* ---- S36: "Và nó ra." (1.34s — cú đấm) --------------------------- */
  var vOut = W(t,'S36',0.18);
  if (show(gOut, vOut)){
    var k36 = loc(t,'S36');
    var uu = outPlane.userData.mat.uniforms;
    uu.uT.value = t; uu.uEm.value = 0.95*(1-k36*0.55); uu.uOp.value = vOut;
    /* lớp plasma cuối cùng TUỘT lại phía sau */
    outPlane.position.z = -26 - k36*34;
    /* ra ngoài: mọi nhiễu động DỪNG, trail thành đường KHÔNG cong một pixel */
    var px = -3.0 + k36*9.0;
    outPhoton.position.set(px, 0.4, 3.0);
    straightTrail(outTrail, px,0.4,3.0, 1,0,0, 8.0);
    outTrail.userData.mat.uniforms.uOp.value = vOut*0.9;
    outPhoton.userData.setEm(2.2);
    op(outPhoton, vOut);
    cam(px*0.4, 0.2, 13.0, px*0.5, 0.3, 0, 46);
  }

  /* ---- S37: chân không — phản cao trào ----------------------------- */
  var vVoid = W(t,'S37',0.4);
  if (show(gVoid, vVoid)){
    var k37 = loc(t,'S37');
    voidStars.material.uniforms.uOp.value = vVoid*0.70;
    var uv2 = voidSun.userData.mat.uniforms;
    uv2.uT.value = t; uv2.uEm.value = 1.60; uv2.uOp.value = vVoid;
    voidSun.material.opacity = vVoid;
    /* hạt đi thẳng, đều, không đổi. KHÔNG flash, KHÔNG sóng */
    var px2 = -8.0 + k37*16.0;
    voidPhoton.position.set(px2, -0.6, 0);
    straightTrail(voidTrail, px2,-0.6,0, 1,0,0, 5.0);
    voidTrail.userData.mat.uniforms.uOp.value = vVoid*0.8;
    voidPhoton.userData.setEm(1.8);
    op(voidPhoton, vVoid);
    cam(0,0,15.0, 0,0,0, 46);      /* tĩnh TUYỆT ĐỐI */
  }

  /* ---- S38: 150 triệu km trống rỗng -------------------------------- */
  var vCross = W(t,'S38',0.35);
  if (show(gCross, vCross)){
    var k38 = loc(t,'S38');
    crossStars.material.uniforms.uOp.value = vCross*0.55;
    var uc = crossSun.userData.mat.uniforms;
    uc.uT.value = t; uc.uEm.value = 1.50; uc.uOp.value = vCross;
    crossSun.material.opacity = vCross;
    crossSun.position.set(-8.0,1.4,-190 + k38*0);
    /* Trái Đất: trục 23,4°, tự quay NGƯỢC kim đồng hồ nhìn từ cực Bắc */
    earthGroup.position.set(6.4,-1.2,-16);
    earthMesh.rotation.y = t*0.10;
    earthClouds.rotation.y = t*0.118;
    earthMesh.material.opacity = vCross; earthMesh.material.transparent = true;
    earthClouds.material.opacity = vCross*0.62;
    /* truck ngang rất dài từ Mặt Trời tới Trái Đất, tốc độ ĐỀU */
    var cx2 = -120 + k38*126;
    cam(cx2, 0.6, 26.0, cx2+6, 0.0, -14, 44);
    solarWind.material.uniforms.uOp.value = vCross*0.5;
    solarWind.position.x = cx2;
    var px3 = cx2 + 5.0;
    crossPhoton.position.set(px3, 1.0, -2);
    straightTrail(crossTrail, px3,1.0,-2, 1,0,0, 7.0);
    crossTrail.userData.mat.uniforms.uOp.value = vCross*0.8;
    op(crossPhoton, vCross);
    /* đồng hồ 0:00 → 8:20 */
    var sec = Math.floor(k38*500);
    crossClock.userData.set(Math.floor(sec/60)+':'+('0'+(sec%60)).slice(-2));
    crossClock.position.set(cx2+8.5, -7.4, 8);
    op(crossClock, vCross*0.85);
  }

  /* ---- S39: phân bổ thời gian — zoom 1000× vào đuôi thanh --------- */
  var vAlloc = W(t,'S39',0.35);
  if (show(gAlloc, vAlloc)){
    var k39 = loc(t,'S39');
    allocBar.material.opacity = vAlloc*0.80;
    op(allocL1, vAlloc*smooth(clamp(k39*4,0,1))*0.85);
    /* camera PHÓNG vào đuôi thanh — vạch lam mới hiện ra */
    var zm = smooth(clamp((k39-0.42)/0.44,0,1));
    var scaleF = 1 + zm*zm*80;
    var fov = 46/(1+zm*zm*7.5);
    cam(9.98*zm, 0, 26.0, 9.98*zm, 0, 0, Math.max(3.2,fov));
    allocTail.scale.set(1,1,1);
    allocTail.material.opacity = vAlloc*zm*0.90;
    op(allocL2, vAlloc*smooth(clamp((k39-0.62)*4,0,1))*0.85);
    allocL2.position.set(9.98, -1.6/Math.max(1,zm*5), 0);
    sizeLabel(allocL2, 0.40/Math.max(1,zm*6.5));
    op(allocZoom, vAlloc*zm*0.62);
    allocZoom.position.set(9.98+0.4/Math.max(1,zm*4), 1.4/Math.max(1,zm*4),0);
    sizeLabel(allocZoom, 0.34/Math.max(1,zm*6.5));
  }

  /* ---- S40: "đó là đồng hồ của TÔI" ------------------------------- */
  var vMine = W(t,'S40',0.45);
  if (show(gMine, vMine)){
    var k40 = loc(t,'S40');
    fadeGroup(gMine, vMine);
    /* đồng hồ của người: kim nhích ĐỀU */
    mineHand.rotation.z = -t*(Math.PI*2/12);
    /* đồng hồ phía photon: MỜ DẦN rồi tan thành KHÔNG CÓ GÌ (không phải "0") */
    var vanish = smooth(clamp((k40-0.46)/0.40,0,1));
    mineGhostClock.traverse(function(o){
      if (o.material) o.material.opacity = (o.material.userData_base==null
        ? (o.userData.baseOp!=null?o.userData.baseOp:0.45) : 0.45)*vMine*(1-vanish);
    });
    mineGhostClock.scale.setScalar(1 - vanish*0.12);
    mineGhostHand.rotation.z = 0;
    op(mineLbl1, vMine*smooth(clamp((k40-0.14)*3.4,0,1))*0.80);
    op(mineLbl2, vMine*smooth(clamp((k40-0.30)*3.4,0,1))*0.80);
    cam(0,0,17.0, 0,0,0, 46);
  }
}


/* ==========================================================================
 * CHƯƠNG 3 (S41–S68)
 * ========================================================================== */
function renderCH3(t){
  /* ---- S41: cân — photon không làm đĩa nhúc nhích --------------- */
  var vSc = W(t,'S41',0.35);
  if (show(gScale, vSc)){
    var k41 = loc(t,'S41');
    fadeGroup(gScale, vSc);
    /* lần lượt: hạt bụi (lệch), electron (lệch nhẹ), proton (lệch), photon (0) */
    var stg = Math.min(3, Math.floor(k41*4.2));
    var names = ['hạt bụi','electron','proton','photon'];
    var tilts = [-0.16,-0.035,-0.10, 0.0];
    scaleName.userData.set(names[stg]);
    op(scaleName, vSc*0.82);
    /* chuyển mượt giữa các bậc, KHÔNG nhúc nhích một pixel ở bậc photon */
    var sub = clamp(k41*4.2 - stg, 0, 1);
    var prevT = stg>0 ? tilts[stg-1] : 0;
    scalePivot.rotation.z = prevT + (tilts[stg]-prevT)*smooth(clamp(sub*2.5,0,1));
    var isPhoton = stg===3;
    scaleItem.userData.setEm(isPhoton?1.9:1.1);
    scaleItem.scale.setScalar(isPhoton?0.34:(0.30+stg*0.10));
    op(scaleZero, vSc*(isPhoton?smooth(clamp(sub*2.4,0,1)):0)*0.88);
    cam(0,0.4,13.5, 0,0.4,0, 42);
  }

  /* ---- S42 / S43 / S47: biểu đồ γ (ba shot dùng CHUNG) ---------- */
  var v42 = W(t,'S42',0.35), v43 = W(t,'S43',0.35), v47 = W(t,'S47',0.35);
  var vGm = Math.max(v42, Math.max(v43, v47));
  if (show(gGamma, vGm)){
    fadeGroup(gGamma, vGm);
    var draw, zoomK=0, photonK=0, holeK=0;
    if (v47 >= Math.max(v42,v43)){
      draw = 1; zoomK = smooth(clamp(loc(t,'S47')/0.52,0,1));
      holeK = smooth(clamp((loc(t,'S47')-0.50)*3.4,0,1));
      photonK = 0;
    } else if (v43 >= v42){
      draw = 1; photonK = 1;
    } else {
      draw = smooth(clamp(loc(t,'S42')/0.52,0,1));
    }
    gmCurve.userData.grow(draw);
    gmCurve.material.opacity = vGm*0.80;
    op(gmLblC, vGm*0.82); op(gmLblV, vGm*0.62); op(gmLblE, vGm*0.62);
    /* ba chấm ví dụ — cả ba gần như TRÙNG nhau */
    for (var gi=0;gi<3;gi++){
      var a = v42>=Math.max(v43,v47) ? smooth(clamp((loc(t,'S42')-0.52-gi*0.10)*4,0,1)) : 1;
      op(gmDots[gi], vGm*a*(v47>=Math.max(v42,v43)?0:1));
      op(gmDotLabels[gi], vGm*a*0.68*(v47>=Math.max(v42,v43)?0:1));
    }
    /* S43: photon nằm CHÍNH TRÊN tiệm cận; kéo ra thì BẬT LẠI, 3 lần,
     * biên độ giảm dần theo hàm thuần của t */
    if (photonK>0){
      var k43 = loc(t,'S43');
      var amp = Math.exp(-k43*4.2)*1.9;
      var wob = Math.sin(k43*Math.PI*6.0)*amp*smooth(clamp((k43-0.14)*4,0,1));
      gmPhoton.position.set(7.4 + wob, 0.4, 0.3);
      gmPhoton.userData.setEm(1.9);
      op(gmPhoton, vGm);
      op(gmOnly, vGm*smooth(clamp((k43-0.52)*3.2,0,1))*0.85);
      /* zoom-in vào đúng vị trí c */
      var zi = smooth(clamp(k43/0.34,0,1));
      cam(7.4*zi*0.62, 0.4*zi, 22.0-zi*9.0, 7.4*zi*0.62, 0.4*zi, 0, 46-zi*10);
      /* các phần khác của trục tắt đi trừ điểm tại c */
      gmAxisX.material.opacity = vGm*0.40*(1-zi*0.7);
      gmAxisY.material.opacity = vGm*0.40*(1-zi*0.7);
    } else {
      op(gmPhoton, 0); op(gmOnly, 0);
      gmAxisX.material.opacity = vGm*0.40; gmAxisY.material.opacity = vGm*0.40;
    }
    /* S47: zoom tăng tốc vào tiệm cận rồi DỪNG KHỰNG; điểm khuyết */
    if (holeK>=0 && v47>=Math.max(v42,v43)){
      fadeGroup(gmHole, vGm*holeK*0.88);
      op(gmUndef, vGm*smooth(clamp((loc(t,'S47')-0.62)*3.4,0,1))*0.85);
      var zz = zoomK*zoomK;
      cam(7.4*zz*0.85, (2.0+4.4*zz)*zz*0.7, 24.0-zz*13.0, 7.4*zz*0.85, (2.0+4.4*zz)*zz*0.7, 0, 46-zz*16);
    } else {
      fadeGroup(gmHole, 0); op(gmUndef, 0);
      if (photonK===0) cam(0,0.4,22.0, 0,0.4,0, 46);
    }
  }

  /* ---- S44: hai đồng hồ ------------------------------------------- */
  var vDl = W(t,'S44',0.35);
  if (show(gDilate, vDl)){
    var k44 = loc(t,'S44');
    fadeGroup(gDilate, vDl);
    /* A đứng yên, kim ĐỀU */
    dlHandA.rotation.z = -t*(Math.PI*2/8);
    /* B trên vật bay ngang khung; γ cho v=0.87c → chậm 2× */
    var bx = -11.0 + ((t*3.4)%22.0);
    dlB.position.set(bx, 0.4, 0);
    dlHandB.rotation.z = -t*(Math.PI*2/8)/2.0;
    /* vệt chuyển động kéo dài nhẹ */
    setLine(dlShipTrail, bx-4.2, 0.4, bx-1.9, 0.4, 1);
    dlShipTrail.material.opacity = vDl*0.30;
    op(dlLblA, vDl*smooth(clamp(k44*3,0,1))*0.80);
    op(dlLblB, vDl*smooth(clamp((k44-0.24)*3,0,1))*0.80);
    /* dolly nhẹ theo đồng hồ chuyển động */
    cam(bx*0.14, 0.2, 16.0, bx*0.14, 0.2, 0, 46);
  }

  /* ---- S45: GPS ---------------------------------------------------- */
  var vGps = W(t,'S45',0.4);
  if (show(gGPS, vGps)){
    var k45 = loc(t,'S45');
    gpsMesh.rotation.y = t*0.08;      /* prograde */
    gpsClouds.rotation.y = t*0.094;
    gpsMesh.material.opacity = vGps; gpsMesh.material.transparent = true;
    gpsClouds.material.opacity = vGps*0.55;
    /* máy bay bay VÒNG theo đường vĩ độ, sát bề mặt */
    var pa = t*0.42;
    gpsPlane.position.set(Math.cos(pa)*4.42, Math.sin(pa)*4.42*Math.sin(0.62)+1.0,
                          Math.sin(pa)*4.42*Math.cos(0.62));
    op(gpsPlane, vGps*smooth(clamp(k45*3,0,1)));
    gpsPlaneOrbit.material.opacity = vGps*0.22;
    /* chòm GPS: CAO hơn hẳn máy bay (đúng bậc độ cao ~20.200 km) */
    var showSat = smooth(clamp((k45-0.42)/0.22,0,1));
    for (var si=0;si<gpsSats.length;si++){
      var S = gpsSats[si];
      var aa = t*0.16 + S.idx*(Math.PI/2) + S.plane*0.5;
      var pl = S.plane/6*Math.PI;
      var xx = Math.cos(aa)*17.5, zz = Math.sin(aa)*17.5;
      S.d.position.set(xx*Math.cos(pl) - zz*0.0, Math.sin(aa)*17.5*Math.sin(0.95),
                       xx*Math.sin(pl) + zz*Math.cos(pl)*0.3);
      op(S.d, vGps*showSat*0.85);
    }
    gpsOrbits.children.forEach(function(o){ o.material.opacity = vGps*showSat*0.16; });
    /* điểm định vị trôi lệch dần tới ~10 km trong 1 ngày */
    var km = clamp((k45-0.62)/0.34,0,1)*10;
    gpsDrift.userData.set('lệch ' + km.toFixed(1) + ' km');
    op(gpsDrift, vGps*smooth(clamp((k45-0.62)*3.4,0,1))*0.82);
    op(gpsLbl,   vGps*smooth(clamp((k45-0.74)*3.4,0,1))*0.80);
    /* từ quỹ đạo thấp nhìn xuống, pan theo đường bay rồi lùi ra */
    var back = smooth(clamp((k45-0.40)/0.36,0,1));
    cam(Math.sin(t*0.05)*2.0, 2.0, 15.0 + back*26.0, 0,0,0, 46);
  }

  /* ---- S46: bảng số γ --------------------------------------------- */
  var vTb = W(t,'S46',0.35);
  if (show(gTable, vTb)){
    var k46 = loc(t,'S46');
    for (var ri=0;ri<tabRows.length;ri++){
      var a2 = smooth(clamp((k46*1.15 - ri*0.155)*6,0,1));
      op(tabRows[ri][0], vTb*a2*0.88);
      op(tabRows[ri][1], vTb*a2*0.88);
    }
    /* dải sáng chạy dốc lên theo cùng nhịp */
    tabRamp.material.opacity = vTb*smooth(clamp(k46*2.2,0,1))*0.22;
    tabRamp.rotation.z = 0.26;
    tabRamp.position.set(0, -4.0 + k46*6.0, -1);
    /* camera tilt lên khi dòng cuối vượt khung */
    var tilt = smooth(clamp((k46-0.46)/0.50,0,1));
    cam(0, -1.0 + tilt*7.4, 18.0, 0, -1.0+tilt*7.4, 0, 46);
  }

  /* ---- S48: thời gian riêng ---------------------------------------- */
  var vPr = W(t,'S48',0.4);
  if (show(gProper, vPr)){
    var k48 = loc(t,'S48');
    fadeGroup(gProper, vPr);
    prMassive.userData.grow(smooth(clamp(k48/0.30,0,1)));
    prMassive.material.opacity = vPr*0.55;
    var lk = smooth(clamp((k48-0.24)/0.26,0,1));
    prLight.userData.grow(lk);
    prLight.material.opacity = vPr*lk*0.65;
    prLightThick.scale.set(lk,1,1);
    prLightThick.position.set(-5.4+(6.4-(-5.4))*lk/2 - (6.4-(-5.4))*(1-lk)/2*0,
                              -5.4+(6.4-(-5.4))*lk/2, 0.16);
    setLine(prLightThick, -5.4,-5.4, -5.4+11.8*lk, -5.4+11.8*lk, 1);
    prLightThick.material.opacity = vPr*lk*0.72;
    /* hai đầu mút TRƯỢT VÀO NHAU — độ dài bằng 0 */
    var slide = smooth(clamp((k48-0.52)/0.28,0,1));
    var ax=-5.4+11.8*0.18, ay=-5.4+11.8*0.18;
    var bx2=-5.4+11.8*0.82, by=-5.4+11.8*0.82;
    var mx=(ax+bx2)/2, my=(ay+by)/2;
    prEndA.position.set(ax+(mx-ax)*slide, ay+(my-ay)*slide, 0.25);
    prEndB.position.set(bx2+(mx-bx2)*slide, by+(my-by)*slide, 0.25);
    op(prEndA, vPr*lk); op(prEndB, vPr*lk);
    op(prZero, vPr*smooth(clamp((k48-0.72)*4,0,1))*0.92);
    op(prTau, vPr*smooth(clamp((k48-0.10)*3,0,1))*0.80);
    /* zoom-in 2% cực chậm */
    cam(0.4,0.4, 17.0 - k48*0.34, 0.4,0.4,0, 46);
  }

  /* ---- S49: CAO TRÀO — lưới Lorentz sụp thành đường 45° --------- */
  var vLor = W(t,'S49',0.4);
  if (show(gLorentz, vLor)){
    var k49 = loc(t,'S49');

    var align = smooth(clamp((k52-0.34)/0.46,0,1));

    var k65 = loc(t,'S65');
    /* mọi ô nở ĐỀU — camera không đứng ở "tâm vũ trụ" */
    var expand = 1 + k65*1.9;
    redGrid.scale.setScalar(expand);
    redGrid.material.opacity = vRed*0.30;
    /* bước sóng GIÃN đúng theo hệ số nở */
    var lam = 0.42*expand;
    redWave.userData.set(lam, 1.5);
    redWave.scale.setScalar(1);
    /* màu đi theo bước sóng: trắng-lam → vàng → cam → đỏ sẫm → tắt */
    var c = new THREE.Color();
    if (k65<0.24) c.setRGB(0.72,0.82,1.00);
    else if (k65<0.44) c.setRGB(1.00,0.88,0.40).lerp(new THREE.Color(0.72,0.82,1.00), clamp((0.44-k65)/0.20,0,1));
    else if (k65<0.66) c.setRGB(1.00,0.46,0.10);
    else c.setRGB(0.62,0.06,0.03);
    redWave.userData.mat.color.copy(c);
    /* cuối shot emissive hạ xuống 0.3 — CMB phải TỐI */
    redWave.userData.mat.opacity = vRed*(1-smooth(clamp((k65-0.74)/0.26,0,1))*0.72)*0.90;
    var K = 3000 - clamp(k65/0.92,0,1)*(3000-2.725);
    redTemp.userData.set(K>100 ? Math.round(K)+' K' : K.toFixed(3)+' K');
    op(redTemp, vRed*smooth(clamp(k65*3,0,1))*0.80);
    op(redLbl, vRed*smooth(clamp((k65-0.10)*3,0,1))*0.80);
    /* tracking theo mặt sóng trong khi lưới nở quanh nó */
    cam(k65*1.4, 0, 17.0+k65*3.0, k65*1.4, 0, 0, 46);
  }

  /* ---- S66: tivi analog mất sóng ------------------------------- */
  var vTV = W(t,'S66',0.35);
  if (show(gTV, vTV)){
    var k66 = loc(t,'S66');
    var utv = tvScreen.userData.mat.uniforms;
    utv.uT.value = t; utv.uOp.value = vTV;
    tvBezel.traverse(function(o){
      if (o.material){ o.material.transparent=true; o.material.opacity=vTV; }
    });
    /* vài hạt nhiễu HIGHLIGHT, kéo trail ngược ra ngoài màn hình, xuyên
     * tường, về tận mặt cầu tán xạ cuối */
    var tk = smooth(clamp((k66-0.40)/0.42,0,1));
    for (var vi=0;vi<tvTrails.length;vi++){
      var TL = tvTrails[vi];
      var sx = TL.userData.sx, sy = TL.userData.sy;
      var dirx = sx*0.09, diry = sy*0.09, dirz = -1;
      var ln = Math.sqrt(dirx*dirx+diry*diry+1);
      TL.userData.setPath(function(kk){
        var d = kk*tk*58;
        return { x:sx + dirx/ln*d, y:sy + diry/ln*d, z:0.4 + dirz/ln*d };
      });
      TL.userData.mat.uniforms.uOp.value = vTV*tk*0.60;
      TL.userData.mat.uniforms.uCol.value.setHex(0x8A6CFF);
    }
    var hl = tvHighlights.geometry.attributes;
    for (var hi2=0;hi2<5;hi2++){
      hl.position.array[hi2*3]   = tvTrails[hi2].userData.sx;
      hl.position.array[hi2*3+1] = tvTrails[hi2].userData.sy;
      hl.aA.array[hi2] = tk;
    }
    hl.position.needsUpdate=true; hl.aA.needsUpdate=true;
    tvHighlights.material.uniforms.uOp.value = vTV;
    tvHighlights.material.uniforms.uEm.value = 1.30;
    /* hơi quay quanh ở cuối shot */
    var orb = smooth(clamp((k66-0.66)/0.34,0,1))*0.58;
    cam(Math.sin(orb)*16.0, 0.6, Math.cos(orb)*16.0, 0,0,0, 46);
  }

  /* ---- S67: ăng-ten Holmdel ------------------------------------ */
  var vHorn = W(t,'S67',0.35);
  if (show(gHorn, vHorn)){
    var k67 = loc(t,'S67');
    hornGroup.traverse(function(o){
      if (o.material){ o.material.transparent=true; o.material.opacity=vHorn; }
    });
    hornHill.material.opacity = vHorn;
    hornSky.material.uniforms.uOp.value = vHorn*0.50;
    /* vài con bồ câu bay ra */
    var bk = clamp((k67-0.22)/0.18,0,1);
    var ba = hornBirds.geometry.attributes;
    for (var bi2=0;bi2<14;bi2++){
      var pr2 = ((bi2*37)%14)/14;
      ba.position.array[bi2*3]   = -1 + bk*(6+pr2*9);
      ba.position.array[bi2*3+1] = 1 + bk*(3+pr2*7) - bk*bk*1.5;
      ba.position.array[bi2*3+2] = 3 + pr2*2;
      ba.aA.array[bi2] = clamp(bk*3,0,1)*(1-clamp((bk-0.7)/0.3,0,1))*0.5;
    }
    ba.position.needsUpdate=true; ba.aA.needsUpdate=true;
    hornBirds.material.uniforms.uOp.value = vHorn;
    /* mức nhiễu ĐỀU TĂM TẮP mọi hướng — điểm khoa học của shot */
    var iso = smooth(clamp((k67-0.46)/0.26,0,1));
    fadeGroup(hornIso, vHorn*iso*0.45);
    hornIsoTicks.children.forEach(function(o){ o.material.opacity = vHorn*iso*0.42; });
    op(hornLbl, vHorn*smooth(clamp((k67-0.66)*3.4,0,1))*0.85);
    /* camera quay ăng-ten 360° — mức nhiễu KHÔNG đổi */
    var ha = k67*Math.PI*2*0.85;
    /* từ ngoài, rồi vào trong lòng sừng nhìn ra trời */
    var inside = smooth(clamp((k67-0.74)/0.26,0,1));
    var R3 = 24.0 - inside*20.0;
    cam(Math.sin(ha)*R3, 3.4-inside*2.4, Math.cos(ha)*R3, 0,-0.5,0, 46+inside*16);
  }

  /* ---- S68: bản đồ CMB ----------------------------------------- */
  var vCMB = W(t,'S68',0.35);
  if (show(gCMB, vCMB)){
    var k68 = loc(t,'S68');
    /* bản đồ Mollweide mở ra toàn khung, rồi cuộn thành mặt cầu */
    var wrap = smooth(clamp((k68-0.50)/0.42,0,1));
    var ucm = cmbMap.userData.mat.uniforms;
    ucm.uT.value = t; ucm.uOp.value = vCMB*(1-wrap); ucm.uEm.value = 0.55;
    var ucs = cmbSphere.userData.mat.uniforms;
    ucs.uT.value = t; ucs.uOp.value = vCMB*wrap; ucs.uEm.value = 0.55;
    cmbSphere.visible = wrap>0.01;
    cmbMap.visible = wrap<0.99;
    var openK = smooth(clamp(k68/0.30,0,1));
    cmbMap.scale.set(openK,openK,1);
    op(cmbZero, vCMB*smooth(clamp((k68-0.62)*3.4,0,1))*0.85*(1-wrap*0.4));
    op(cmbLbl,  vCMB*smooth(clamp((k68-0.20)*3.4,0,1))*0.70*(1-wrap));
    cmbSphere.rotation.y = t*0.02;
    cam(0,0, 14.0 - wrap*13.6, 0,0, -wrap*30, 46+wrap*18);
  }
}


/* ==========================================================================
 * CHƯƠNG 4 (S69–S88)
 * S69 dùng LẠI gDark (xử lý trong renderCH1 — motif 3).
 * ========================================================================== */
function renderCH4(t){
  /* ---- S70: pull-back cực dài — người → nhóm thiên hà ----------- */
  var vZo = W(t,'S70',0.4);
  if (show(gZoomOut, vZo)){
    var k70 = loc(t,'S70');
    /* 5 bậc thang, mỗi bậc thu nhỏ theo ĐÚNG bậc độ lớn */
    var s = k70*5.0;                       /* 0..5 */
    zoStars.material.uniforms.uOp.value = vZo*clamp((s-0.5)/1.2,0,1)*0.85;
    zoMan.material.opacity = vZo*clamp(1-s*1.4,0,1);
    zoManRim.material.opacity = vZo*clamp(1-s*1.4,0,1)*0.55;
    zoEarth.material.transparent = true;
    zoEarth.material.opacity = vZo*clamp(s*1.3,0,1)*clamp(1-(s-1.6)*1.3,0,1);
    zoEarth.rotation.y = t*0.05;
    zoSystem.visible = s>1.3 && s<3.4;
    if (zoSystem.visible){
      for (var pi=0;pi<zoPlanets.length;pi++){
        var P = zoPlanets[pi];
        /* prograde: góc TĂNG theo t (ngược kim đồng hồ nhìn từ cực Bắc) */
        var a = P.ph + t*P.spd;
        P.d.position.set(Math.cos(a)*P.r, 0, -Math.sin(a)*P.r);
        op(P.d, vZo*clamp((s-1.3)*1.5,0,1)*clamp(1-(s-3.0)*1.4,0,1));
      }
      zoSystem.children.forEach(function(o){
        if (o.material && o.type==='Line') o.material.opacity = vZo*clamp((s-1.3)*1.5,0,1)*clamp(1-(s-3.0)*1.4,0,1)*0.34;
      });
    }
    zoGalaxy.visible = s>2.8;
    if (zoGalaxy.visible){
      zoGalaxy.material.uniforms.uOp.value = vZo*clamp((s-2.8)*1.4,0,1)*clamp(1-(s-4.4)*1.4,0,1);
      zoGalaxy.material.uniforms.uEm.value = 0.85;
      zoGalaxy.rotation.y = t*0.006;
    }
    zoGroup.visible = s>4.0;
    if (zoGroup.visible){
      zoGroup.children.forEach(function(g0){
        g0.material.uniforms.uOp.value = vZo*clamp((s-4.0)*1.6,0,1)*0.75;
      });
    }
    /* thang khoảng cách hiện bên cạnh */
    var scl = ['1 mét','12.700 km','9 tỉ km','100.000 năm ánh sáng','10 triệu năm ánh sáng'];
    zoScale.userData.set(scl[clamp(Math.floor(s),0,4)]);
    var zdist = Math.pow(10, 0.6 + s*0.72);
    zoScale.userData.size(zdist*0.055);
    zoScale.position.set(0, -zdist*0.30, zdist*0.5);
    op(zoScale, vZo*0.70);
    /* tông LẠNH, độ sáng thấp — cô lập đến từ TỐI, không từ sáng */
    cam(0, zdist*0.10, zdist, 0, 0, 0, 46);
  }

  /* ---- S71: hai lớp bản đồ chồng nhau ---------------------------- */
  var vTm = W(t,'S71',0.4);
  if (show(gTwoMap, vTm)){
    var k71 = loc(t,'S71');
    /* lớp trên TRƯỢT ĐI để lộ lớp dưới */
    var slide = smooth(clamp((k71-0.34)/0.34,0,1));
    tmUpper.position.y = slide*16.0;
    tmUpper.traverse(function(o){
      if (o.material){
        var b=o.userData.baseOp; if(b==null){ b=o.material.opacity; o.userData.baseOp=b; }
        o.material.opacity = b*vTm*(1-slide*0.9);
      }
    });
    /* ba con số bị GẠCH lần lượt theo lời đọc */
    for (var ni=0;ni<tmNums.length;ni++){
      var sk = clamp((k71*1.5 - 0.22 - ni*0.20)*6,0,1);
      tmNums[ni].s.scale.set(sk,1,1);
      tmNums[ni].s.material.opacity = vTm*sk*(1-slide*0.9)*0.9;
    }
    /* MỌI con số và thước biến mất; các thiên thể TRƯỢT VÀO NHAU */
    for (var bi=0;bi<tmBodies.length;bi++){
      var B = tmBodies[bi];
      B.position.set(B.userData.x0*(1-slide*0.88), B.userData.y0*(1-slide*0.88), 0);
      op(B, vTm*0.90);
    }
    cam(0,0,17.0, 0,0,0, 46);
  }

  /* ---- S72: CAO TRÀO — vũ trụ co về MỘT điểm ------------------ */
  var vPt = W(t,'S72',0.3);
  if (show(gPoint, vPt)){
    var k72 = loc(t,'S72');
    /* ease-in dài, co về đúng MỘT điểm. Không nổ, không sóng. */
    var col = smooth(clamp((k72-0.10)/0.62,0,1));
    col = col*col;
    ptCloud.userData.collapse(col);
    ptCloud.material.uniforms.uOp.value = vPt*(1-clamp((col-0.86)/0.14,0,1));
    ptCloud.material.uniforms.uEm.value = 1.30;
    /* điểm cuối: emissive 3.2, diện tích 2px */
    ptFinal.userData.setEm(3.2);
    op(ptFinal, vPt*smooth(clamp((col-0.80)/0.16,0,1)));
    cam(0,0,42.0, 0,0,0, 46);
  }

  /* ---- S73: bốn ô "vật thể đang hỏng" ------------------------- */
  var vDc = W(t,'S73',0.4);
  if (show(gDecay, vDc)){
    var k73 = loc(t,'S73');
    fadeGroup(gDecay, vDc);
    /* (1) sắt gỉ LAN DẦN */
    var rust = clamp((k73*1.5-0.05),0,1);
    dcRust.scale.set(rust,1,1);
    dcRust.position.x = -1.5 + rust*1.5;
    dcRust.material.opacity = vDc*rust*0.85;
    /* (2) sao: cạn nhiên liệu → phồng khổng lồ đỏ → co thành lùn trắng */
    var sk2 = clamp(k73*1.5-0.10,0,1);
    var swell = Math.sin(clamp(sk2,0,1)*Math.PI*0.72);
    var uds = dcStar.userData.mat.uniforms;
    uds.uT.value = t;
    dcStar.scale.setScalar(1 + swell*1.5 - clamp((sk2-0.72)/0.28,0,1)*1.9);
    uds.uMid.value.setHex(sk2<0.7 ? COL.redM : 0xCFE0FF);
    uds.uEm.value = 1.20 - clamp((sk2-0.72)/0.28,0,1)*0.45;
    uds.uOp.value = vDc;
    dcStar.material.opacity = vDc;
    /* (3) hạt nhân phân rã, phát alpha */
    var ak = ((k73*2.6)%1.0);
    dcAlpha.position.set(Math.cos(ak*5.0)*ak*3.4, Math.sin(ak*5.0)*ak*2.4, 0.2);
    op(dcAlpha, vDc*clamp(k73*3,0,1)*(1-ak)*0.85);
    dcNuc.scale.setScalar(0.55*(1+Math.sin(t*6.0)*0.06));
    /* (4) photon: KHÔNG đổi MỘT PIXEL nào suốt cả shot */
    dcPhoton.position.set(0,0,0.2);
    dcPhoton.scale.setScalar(0.30);
    dcPhoton.userData.setEm(1.70);
    op(dcPhoton, vDc);
    for (var li=0;li<dcLabels.length;li++)
      op(dcLabels[li], vDc*smooth(clamp((k73*1.6 - li*0.14)*4,0,1))*0.72);
    /* truck ngang qua dãy, kết ở ô photon */
    var cx = -8.4 + smooth(clamp(k73/0.88,0,1))*17.0;
    cam(cx, 0.4, 15.0, cx, 0.4, 0, 46);
  }

  /* ---- S74: vũ trụ già đi và tối dần -------------------------- */
  var vEnd = W(t,'S74',0.35);
  if (show(gEnd, vEnd)){
    var k74 = loc(t,'S74');
    /* sao tắt dần, thiên hà thưa ra, nền chuyển sang đen */
    var dim = smooth(clamp(k74/0.82,0,1));
    endStars.material.uniforms.uOp.value = vEnd*(1-dim*0.94);
    endGalaxies.children.forEach(function(g0){
      g0.material.uniforms.uOp.value = vEnd*(1-dim*0.96)*0.65;
    });
    /* photon giữ NGUYÊN HOÀN TOÀN: kích thước, màu, cường độ bất biến */
    var px = -6.0 + k74*11.0;
    endPhoton.position.set(px, 0.2, 0);
    endPhoton.scale.setScalar(0.26);
    endPhoton.userData.setEm(1.90);
    op(endPhoton, vEnd);
    straightTrail(endTrail, px,0.2,0, 1,0,0, 6.0);
    endTrail.userData.mat.uniforms.uOp.value = vEnd*0.75;
    /* cuối shot một nguyên tử đơn độc hiện ra phía trước trên đường bay */
    var at = smooth(clamp((k74-0.66)/0.30,0,1));
    endAtom.position.set(6.4, 0.2, 0);
    fadeGroup(endAtom, vEnd*at*0.55);
    endAtomNuc.userData.setEm(1.0);
    op(endAtomNuc, vEnd*at*0.85);
    cam(px*0.5, 0, 15.0, px*0.5+2, 0, 0, 46);
  }

  /* ---- S75: bị nuốt trọn (hard cut từ S74) -------------------- */
  var vAb = WH(t,'S75') ? 1 : 0;
  if (show(gAbsorb, vAb)){
    var k75 = loc(t,'S75');
    fadeGroup(gAbsorb, vAb);
    var hit = 0.40;
    var kk = clamp(k75/hit,0,1);
    /* electron ở mức năng lượng THẤP */
    var lvl = (k75>=hit) ? 1 : 0;
    var r = lvl ? 4.4 : 1.9;
    var ea = t*1.1;
    abElectron.position.set(Math.cos(ea)*r, Math.sin(ea)*r*0.82, 0.2);
    abElectron.userData.setEm(1.2);
    /* photon: emissive 2.0 trước, 0 sau — TẮT trong 1 frame, không mảnh vỡ */
    var ppx = -9.0 + kk*9.0;
    abPhoton.position.set(ppx, 0.6, 0.3);
    abPhoton.userData.setEm(2.0);
    op(abPhoton, (k75<hit) ? vAb : 0);
    straightTrail(abTrail, ppx,0.6,0.3, 1,0,0, 3.4);
    abTrail.userData.mat.uniforms.uOp.value = (k75<hit ? vAb : 0)*0.8;
    /* mức năng lượng được nhấn khi electron NHẢY BẬC (không trượt) */
    for (var ai=0;ai<abLevels.length;ai++){
      var hl = (ai===(lvl?2:0)) ? 0.60 : 0.26;
      fadeGroup(abLevels[ai], vAb*hl);
    }
    op(abLbl, vAb*smooth(clamp((k75-0.56)*3.4,0,1))*0.85);
    /* 1 frame giật lúc hấp thụ */
    var j = (k75>=hit && k75<hit+0.012) ? 0.26 : 0;
    cam(j, j*0.5, 14.0, 0,0,0, 42);
  }

  /* ---- S76: CAO TRÀO — võng mạc (đóng vòng với S08) ----------- */
  var vRt = W(t,'S76',0.35);
  if (show(gRetina, vRt)){
    var k76 = loc(t,'S76');
    retinaBg.userData.mat.uniforms.uT.value = t;
    retinaBg.userData.mat.uniforms.uOp.value = vRt*0.80;
    retinaCells.material.uniforms.uOp.value = vRt*0.85;
    retinaCells.material.uniforms.uEm.value = 0.60;
    /* cơ chế Y HỆT S08: chấm emissive 0.8, ~3% nâng 1.5 */
    retinaDots.userData.reveal(smooth(clamp(k76*1.20,0,1)));
    retinaDots.material.uniforms.uEm.value = 0.62;
    retinaDots.material.uniforms.uOp.value = vRt*0.72;
    /* photon đáp xuống liên tục */
    var ra = retinaRain.geometry.attributes;
    for (var ri2=0;ri2<600;ri2++){
      var ph = ((ri2*0.0017 + t*0.30)%1.0);
      ra.position.array[ri2*3+2] = 14 - ph*14;
      ra.aA.array[ri2] = ph>0.985 ? 0 : 0.85;
    }
    ra.position.needsUpdate=true; ra.aA.needsUpdate=true;
    retinaRain.material.uniforms.uOp.value = vRt*0.42;
    /* pull-back từ nguyên tử → võng mạc → mắt → khuôn mặt */
    var z = 4.0 + smooth(k76)*26.0;
    cam(0,0,z, 0,0,-4, 46);
  }

  /* ---- S77: dolly liền mạch — vũ trụ → một tế bào ------------- */
  var vJ = W(t,'S77',0.4);
  if (show(gJourney, vJ)){
    var k77 = loc(t,'S77');
    /* thang liên tục, tỉ lệ mỗi bậc đúng bậc độ lớn */
    jStars.material.uniforms.uOp.value = vJ*clamp(1-(k77-0.30)*2.4,0,1)*0.85;
    jGalaxies.children.forEach(function(g0){
      g0.material.uniforms.uOp.value = vJ*clamp(1-(k77-0.20)*2.6,0,1)*0.70;
    });
    var uj = jSun.userData.mat.uniforms;
    uj.uT.value=t; uj.uEm.value=1.45;
    uj.uOp.value = vJ*clamp((k77-0.14)*4,0,1)*clamp(1-(k77-0.46)*3.2,0,1);
    jSun.material.opacity = uj.uOp.value;
    var eo = vJ*clamp((k77-0.30)*3.4,0,1)*clamp(1-(k77-0.62)*3.2,0,1);
    jEarthMesh.material.transparent=true; jEarthMesh.material.opacity = eo;
    jEarthClouds.material.opacity = eo*0.58;
    jEarthMesh.rotation.y = t*0.07;      /* prograde, trục 23,4° */
    jEarthClouds.rotation.y = t*0.082;
    jFace.material.opacity = vJ*clamp((k77-0.56)*3.4,0,1)*clamp(1-(k77-0.80)*4.4,0,1);
    jIris.userData.mat.uniforms.uOp.value = vJ*clamp((k77-0.68)*3.8,0,1)*clamp(1-(k77-0.88)*5.4,0,1);
    jIris.userData.mat.uniforms.uT.value=t;
    jIris.userData.mat.uniforms.uEm.value=0.62;
    jCell.material.opacity = vJ*clamp((k77-0.84)*4.4,0,1)*0.50;
    /* photon chủ thể GIỮ NGUYÊN độ sáng suốt hành trình — neo thị giác */
    jPhoton.userData.setEm(2.0);
    op(jPhoton, vJ);
    /* một cú dolly liền mạch, KHÔNG cắt */
    var d = Math.pow(10, 3.05 - k77*3.05);   /* từ ~1120 xuống ~1 */
    jPhoton.position.set(0.20*d*0.02, 0.10*d*0.02, -30 + d*0.30);
    jPhoton.scale.setScalar(clamp(d*0.0026,0.12,0.9));
    straightTrail(jTrail, jPhoton.position.x, jPhoton.position.y, jPhoton.position.z,
                  0,0,1, d*0.09);
    jTrail.userData.mat.uniforms.uOp.value = vJ*0.65;
    cam(0, 0, -30 + d*0.30 + Math.max(2.0, d*0.06), 0, 0, -32, 46);
  }

  /* ---- S78: bẻ cong MỘT phân tử ------------------------------- */
  var vMl = W(t,'S78',0.35);
  if (show(gMol, vMl)){
    var k78 = loc(t,'S78');
    var hit = 0.34;
    /* cis → trans: xoay ~180° tại ĐÚNG một liên kết */
    var bend = smooth(clamp((k78-hit)/0.16,0,1))*Math.PI;
    var pts=[];
    var ang0 = 0, x=-5.6, y=0.0;
    for (var i=0;i<MOL_N;i++){
      pts.push({x:x,y:y});
      var zig = (i%2===0)? 0.62 : -0.62;
      var seg = 1.12;
      var a = (i<MOL_KINK) ? 0 : bend;
      /* chỉ phần SAU điểm gấp bị xoay — không biến dạng toàn phân tử */
      var dx = seg*Math.cos(a), dy = zig*Math.cos(a) + seg*Math.sin(a)*0.55;
      x += dx; y += dy;
    }
    for (var j=0;j<MOL_N;j++){
      molAtoms[j].position.set(pts[j].x, pts[j].y, 0.2);
      op(molAtoms[j], vMl*0.85);
    }
    var bi2=0;
    for (var b=0;b<MOL_N-1;b++){
      setLine(molBonds[bi2], pts[b].x,pts[b].y, pts[b+1].x,pts[b+1].y, 1);
      molBonds[bi2].material.opacity = vMl*0.70; bi2++;
      if (b===MOL_KINK-1){
        setLine(molBonds[bi2], pts[b].x,pts[b].y+0.13, pts[b+1].x,pts[b+1].y+0.13, 1);
        molBonds[bi2].material.opacity = vMl*0.70; bi2++;
      }
    }
    /* liên kết bị bẻ LOÉ 1.6 trong ~3 frame */
    var fl = clamp(1-(k78-hit)/0.030,0,1)*(k78>=hit?1:0);
    molKinkGlow.position.set(pts[MOL_KINK-1].x, pts[MOL_KINK-1].y, 0.4);
    molKinkGlow.userData.setEm(1.6);
    op(molKinkGlow, vMl*fl);
    /* photon chạm rồi biến mất */
    var ppx2 = -11.0 + clamp(k78/hit,0,1)*5.2;
    molPhoton.position.set(ppx2, 1.6-clamp(k78/hit,0,1)*1.6, 0.4);
    molPhoton.userData.setEm(2.0);
    op(molPhoton, (k78<hit)?vMl:0);
    /* xung điện lam chạy dọc sợi thần kinh RA KHỎI khung */
    var nk = clamp((k78-hit-0.06)/0.34,0,1);
    molNerve.userData.grow(nk);
    molNerve.material.opacity = vMl*(nk>0?1:0)*0.70;
    var np2 = molNerve.userData.at(nk);
    molPulse.position.copy(np2);
    op(molPulse, vMl*(nk>0&&nk<0.99?1:0)*0.85);
    op(molLbl1, vMl*smooth(clamp(k78*4,0,1))*(1-smooth(clamp((k78-hit)*6,0,1)))*0.72);
    op(molLbl2, vMl*smooth(clamp((k78-hit-0.06)*5,0,1))*0.72);
    /* cuối shot: MỘT chấm sáng đơn trên nền đen */
    var fin = smooth(clamp((k78-0.78)/0.16,0,1));
    molFinalDot.position.set(0,0,1.0);
    molFinalDot.userData.setEm(2.2);
    op(molFinalDot, vMl*fin);
    fadeGroup(gMol, 1);   /* giữ nguyên, các opacity đã đặt riêng */
    /* làm mờ toàn bộ phân tử khi vào khoảnh khắc "một chấm sáng" */
    if (fin>0.02){
      for (var mj=0;mj<molAtoms.length;mj++) op(molAtoms[mj], vMl*0.85*(1-fin));
      for (var mb=0;mb<molBonds.length;mb++) molBonds[mb].material.opacity = vMl*0.70*(1-fin);
      molNerve.material.opacity *= (1-fin);
      op(molPulse, 0);
      op(molLbl1,0); op(molLbl2, vMl*0.72*(1-fin));
    }
    cam(0.4, 0, 12.5 + fin*2.0, 0.4, 0, 0, 44);
  }

  /* ---- S79: sợi chỉ — hai đầu sáng lên ĐỒNG THỜI -------------- */
  var vYn = W(t,'S79',0.4);
  if (show(gYarn, vYn)){
    var k79 = loc(t,'S79');
    yarnStars.material.uniforms.uOp.value = vYn*0.45;
    yarnLine.material.opacity = vYn*smooth(clamp(k79*3,0,1))*0.88;
    var uy = yarnStar.userData.mat.uniforms;
    uy.uT.value=t; uy.uEm.value=1.40; uy.uOp.value=vYn;
    yarnStar.material.opacity = vYn;
    fadeGroup(yarnEye, vYn*0.60);
    /* hai đầu sợi cùng sáng lên ĐỒNG THỜI, không lệch một frame */
    var sync = smooth(clamp((k79-0.52)/0.16,0,1));
    yarnStar.scale.setScalar(1+sync*0.24);
    yarnEyeDot.userData.setEm(1.4+sync*0.5);
    /* mốc thời gian nằm NGOÀI sợi chỉ — "chuyện của chúng ta", ở lề mờ */
    for (var yi=0;yi<yarnMarks.length;yi++)
      op(yarnMarks[yi], vYn*smooth(clamp((k79*1.4 - yi*0.12)*4,0,1))*0.42);
    op(yarnLbl, vYn*smooth(clamp((k79-0.66)*3.4,0,1))*0.85);
    /* camera TRƯỢT DỌC sợi chỉ từ đầu này sang đầu kia */
    var sl = smooth(clamp(k79/0.80,0,1));
    cam(-7.0+13.2*sl, 7.4-14.8*sl, 14.0, -7.0+13.2*sl, 7.4-14.8*sl, 0, 44);
  }

  /* ---- S80: ngôi sao có thể đã tắt ---------------------------- */
  var vSs = W(t,'S80',0.4);
  if (show(gSplitStar, vSs)){
    var k80 = loc(t,'S80');
    /* NỬA TRÊN: tàn dư nguội, tông xám lạnh, emissive <= 0.5 */
    ssNebula.material.uniforms.uOp.value = vSs*smooth(clamp(k80*3,0,1))*0.85;
    ssNebula.material.uniforms.uEm.value = 0.48;
    ssNebula.scale.setScalar(1 + k80*0.24);      /* tinh vân tàn dư mở rộng */
    ssNebula.rotation.y = t*0.012;
    ssCore.userData.setEm(0.50);
    op(ssCore, vSs*smooth(clamp(k80*3,0,1))*0.85);
    /* NỬA DƯỚI: cùng ngôi sao đó VẪN cháy đầy đủ, ấm */
    var ua = ssAlive.userData.mat.uniforms;
    ua.uT.value=t; ua.uEm.value=2.00;
    ua.uOp.value = vSs*smooth(clamp((k80-0.24)*3,0,1));
    ssAlive.material.opacity = ua.uOp.value;
    ssAlive.rotation.y = t*0.02;
    ssYarn.material.opacity = vSs*smooth(clamp((k80-0.40)*3,0,1))*0.70;
    op(ssLbl1, vSs*smooth(clamp((k80-0.12)*3.4,0,1))*0.78);
    op(ssLbl2, vSs*smooth(clamp((k80-0.34)*3.4,0,1))*0.78);
    ssSplit.material.opacity = vSs*0.14;
    cam(0,0,19.0, 0,0,0, 46);
  }

  /* ---- S81: lời mời — averted vision -------------------------- */
  var vIv = W(t,'S81',0.35);
  if (show(gInvite, vIv)){
    var k81 = ts(t,'S81');
    var dur = SC.S81[1]-SC.S81[0];
    /* nhắm mắt: khung TỐI 10 giây có nhịp thở (lặp lại nhịp S01) */
    var closed = clamp(1 - (k81-1.0)/0.8, 0, 1) * (k81<1.0?1:1);
    var lidOff = smooth(clamp((k81-5.2)/1.2,0,1));
    invLid.material.opacity = vIv*(1-lidOff)*(0.94+0.06*Math.sin(k81*(Math.PI*2/4.5)));
    /* mở ra: mắt thích nghi tối — sao SÁNG hiện trước, sao mờ hiện sau */
    var adapt = smooth(clamp((k81-5.6)/(dur-6.4),0,1));
    invStars.userData.adapt(adapt);
    invStars.material.uniforms.uOp.value = vIv;
    invStars.material.uniforms.uEm.value = 1.40;
    invHorizon.material.opacity = vIv*lidOff;
    /* một sao MỜ được đánh dấu; NHÌN THẲNG vào thì nó MỜ ĐI (averted vision) */
    var mark = smooth(clamp((k81-(dur-4.2))/1.4,0,1));
    fadeGroup(invCircle, vIv*mark*0.30);
    /* camera hướng thẳng vào sao dần → sao mờ đi */
    var direct = smooth(clamp((k81-(dur-2.8))/2.2,0,1));
    invFaint.userData.setEm(1.1);
    op(invFaint, vIv*adapt*(1-direct*0.72)*0.80);
    cam(3.6*direct*0.28, 4.4*direct*0.22, 0.2, 3.6*direct, 4.4*direct, -21, 52);
  }

  /* ---- S82: bề mặt ngôi sao xa (đóng vòng với S35/S36) -------- */
  var vFs = W(t,'S82',0.35);
  if (show(gFarStar, vFs)){
    var k82 = loc(t,'S82');
    var uf = fsPlane.userData.mat.uniforms;
    uf.uT.value=t; uf.uEm.value=1.00; uf.uOp.value=vFs;
    /* zoom tiếp từ chấm mờ tới bề mặt ngôi sao */
    var zi4 = smooth(clamp(k82/0.46,0,1));
    fsPlane.position.z = -70 + zi4*46;
    /* một photon rời lớp cuối — chuyển động Y HỆT S36 (đóng vòng) */
    var rel = clamp((k82-0.48)/0.44,0,1);
    var px3 = -3.0 + rel*9.0;
    fsPhoton.position.set(px3, 0.6, 3.0);
    straightTrail(fsTrail, px3,0.6,3.0, 1,0,0, 8.0);
    fsTrail.userData.mat.uniforms.uOp.value = vFs*(rel>0?1:0)*0.85;
    fsPhoton.userData.setEm(2.0);
    op(fsPhoton, vFs*(rel>0?1:0));
    op(fsLbl, vFs*smooth(clamp((k82-0.14)*3.4,0,1))*0.85);
    cam(px3*0.3, 0.2, 13.0, px3*0.4, 0.3, 0, 46);
  }

  /* ---- S83: phần khó nhất đã đi xong từ lâu ------------------- */
  var vHd = W(t,'S83',0.35);
  if (show(gHardest, vHd)){
    var k83 = loc(t,'S83');
    /* bên TRÁI: CHÍNH random walk của S23 (cùng seed), nén thời gian */
    hdWalk.material.opacity = vHd*smooth(clamp(k83*3,0,1))*0.42;
    hdWalk.scale.setScalar(0.10 + Math.sqrt(clamp(k83/0.42,0,1))*0.16);
    hdWalk.rotation.y = t*0.10;
    /* bên PHẢI: đường thẳng mảnh kéo dài RA KHỎI khung */
    var sk3 = smooth(clamp((k83-0.40)/0.44,0,1));
    hdStraight.userData.grow(sk3);
    hdStraight.material.opacity = vHd*sk3*0.85;
    setLine(hdStraightThick, 1.4,0.6, 1.4+13.0*sk3, 0.6, 1);
    hdStraightThick.material.opacity = vHd*sk3*0.75;
    hdSplit.material.opacity = vHd*0.14;
    op(hdLbl1, vHd*smooth(clamp((k83-0.16)*3.4,0,1))*0.80);
    op(hdLbl2, vHd*smooth(clamp((k83-0.50)*3.4,0,1))*0.80);
    /* gia phả người bắt đầu SAU khi phần trái đã xong */
    for (var gi2=0;gi2<hdGens.length;gi2++){
      hdGens[gi2].material.opacity = vHd*clamp((k83-0.46)*3.0 - gi2*0.08,0,1)*0.22;
    }
    cam(0.6,0.2,17.0, 0.6,0.2,0, 46);
  }

  /* ---- S84: lịch sử chạy nhanh bên dưới đường bay ------------- */
  var vHs = W(t,'S84',0.35);
  if (show(gHistory, vHs)){
    var k84 = loc(t,'S84');
    /* tầng TRÊN: photon đi thẳng, tốc độ tuyệt đối ĐỀU, KHÔNG đổi gì */
    var px4 = -12.0 + k84*24.0;
    hsPhoton.position.set(px4, 4.4, 0);
    hsPhoton.scale.setScalar(0.26);
    hsPhoton.userData.setEm(1.80);
    op(hsPhoton, vHs);
    straightTrail(hsTrail, px4,4.4,0, 1,0,0, 9.0);
    hsTrail.userData.mat.uniforms.uOp.value = vHs*0.70;
    hsLine.material.opacity = vHs*0.18;
    /* tầng DƯỚI: đế chế mọc lên rồi SẬP, rất nhanh */
    for (var ei=0;ei<hsEmpires.length;ei++){
      var E = hsEmpires[ei];
      var ph3 = (k84 - E.rise*0.55) / E.dur;
      var life = clamp(ph3,0,2);
      var h = (life<1) ? smooth(life)*E.h : E.h*(1-smooth(clamp(life-1,0,1)));
      E.m.scale.set(1, Math.max(0.001,h), 1);
      E.m.position.y = h/2;
      E.m.material.opacity = vHs*clamp(h/E.h*2,0,1)*0.85;
    }
    /* khói chiến tranh */
    hsSmoke.material.uniforms.uOp.value = vHs*clamp(Math.sin(k84*Math.PI*3.2)*0.5+0.35,0,1)*0.42;
    hsSmoke.position.y = (t*0.42)%3.0;
    for (var hg=0;hg<hsGens.length;hg++){
      var ph4 = k84*3.8 - hg*0.20;
      hsGens[hg].material.opacity = vHs*clamp(Math.sin(clamp(ph4,0,1)*Math.PI),0,1)*0.26;
    }
    hsGround.material.opacity = vHs*0.18;
    /* truck ngang ĐỀU theo photon */
    cam(px4*0.72, 0, 17.5, px4*0.72, 0, 0, 46);
  }

  /* ---- S85: tìm thấy hai centimet vuông ẩm ướt --------------- */
  var vAr = W(t,'S85',0.35);
  if (show(gArrive, vAr)){
    var k85 = loc(t,'S85');
    var arrive = 0.78;
    var kk2 = clamp(k85/arrive,0,1);
    /* khuôn mặt hiện dần TỪ BÓNG TỐI */
    var fz = smooth(clamp((k85-0.24)/0.48,0,1));
    arFace.material.opacity = vAr*fz;
    arSkin.material.uniforms.uOp.value = vAr*fz*0.85;
    arSkin.material.uniforms.uT.value = t;
    /* đường bay KHÔNG cong một pixel cho tới điểm cuối */
    var px5 = -22.0 + kk2*23.4, pz5 = 26.0 - kk2*24.6;
    if (k85 < arrive){
      arPhoton.position.set(px5, 1.2-kk2*0.7, pz5);
      straightTrail(arTrail, px5,1.2-kk2*0.7,pz5, 0.69,-0.02,-0.72, 22.0);
      arTrail.userData.mat.uniforms.uOp.value = vAr*0.80;
      arPhoton.userData.setEm(1.90);
      op(arPhoton, vAr); op(arMark, 0);
    } else {
      /* DỪNG và Ở LẠI — chấm sáng tĩnh trên võng mạc (motif 1) */
      op(arPhoton, 0);
      arTrail.userData.mat.uniforms.uOp.value = 0;
      arMark.position.set(1.4, 0.5, 1.4);
      arMark.userData.setEm(1.90);
      op(arMark, vAr);
    }
    /* camera bám photon, chuyển truck ngang thành dolly-in thẳng vào con
     * ngươi, rồi DỪNG KHỰNG cùng frame với photon */
    var ck = Math.min(kk2, 1);
    cam(px5*0.55, 0.6-ck*0.4, pz5+9.0-ck*2.0, 1.4, 0.4, 0, 46-ck*8);
  }

  /* S86 xử lý trong renderCH1 (dùng lại gIris — đóng vòng với S02) */

  /* ---- S87 + S88: đường thời gian co về 0 -------------------- */
  var v87 = W(t,'S87',0.25), v88 = W(t,'S88',0.25);
  var vFn = Math.max(v87, v88);
  if (show(gFinal, vFn)){
    var uf2 = fnIris.userData.mat.uniforms;
    uf2.uT.value = t; uf2.uOp.value = vFn; uf2.uEm.value = 0.55;
    fnPhoton.userData.setEm(2.6);
    /* S88: đường thời gian CO LẠI theo ease-in cho tới khi hai đầu chạm nhau */
    var shrink = (v88>=v87) ? smooth(clamp(loc(t,'S88')/0.62,0,1)) : 0;
    shrink = shrink*shrink;
    /* đường thời gian bắt đầu ngay PHẢI con ngươi và chạy hết khung */
    var X0 = -1.8;
    var L = 12.6*(1-shrink);
    setLine(fnTimeline, X0, 0.0, X0+L, 0.0, 1);
    fnTimeline.material.opacity = vFn*0.60*(1-shrink*0.55);
    for (var fi=0;fi<fnTicks.length;fi++){
      var kx = fi/(fnTicks.length-1);
      fnTicks[fi].position.set(X0 + L*kx, 0, 0.1);
      fnTicks[fi].material.opacity = vFn*0.50*(1-shrink*0.8);
    }
    op(fnLbl, v87*smooth(clamp(loc(t,'S87')*3.4,0,1))*0.85*(1-shrink));
    fnLbl.position.set(X0+L*0.5, 1.5, 0);
    op(fnLbl0, vFn*smooth(clamp((shrink-0.72)*5,0,1))*0.90);
    fnLbl0.position.set(X0+0.3, 1.5, 0);
    /* toàn khung tối dần trừ MỘT chấm sáng duy nhất trong con ngươi */
    var darkOut = (v88>=v87) ? smooth(clamp((loc(t,'S88')-0.42)/0.44,0,1)) : 0;
    uf2.uEm.value = 0.55*(1-darkOut*0.92);
    op(fnPhoton, vFn);
    cam(0.2,0,17.5, 0.2,0,0, 44);
  }
}


/* ==========================================================================
 * renderAtTime — HÀM THUẦN của t. Mọi thứ trong đây được đặt LẠI theo t,
 * không có trạng thái tích luỹ. Gọi với t bất kỳ, theo thứ tự bất kỳ, đều
 * cho đúng frame của t đó.
 * ========================================================================== */
var ALL_GROUPS = null;
function renderAtTime(t){
  if (!ALL_GROUPS){
    ALL_GROUPS = [];
    for (var k in G) if (G.hasOwnProperty(k)) ALL_GROUPS.push(G[k]);
  }
  /* tắt hết trước, các renderCH* sẽ bật lại nhóm của mình theo cửa sổ shot.
   * Đây là cách "cắt cảnh" tất định: bật layer này, tắt layer kia theo t. */
  for (var i=0;i<ALL_GROUPS.length;i++) ALL_GROUPS[i].visible = false;
  camera.rotation.z = 0;

  renderCH1(t);
  renderCH2(t);
  renderCH3(t);
  renderCH4(t);

  /* ---- phụ đề + nhãn chương ---------------------------------------- */
  HFA.applySubtitle(elSub, CUES, t);
  HFA.applyChapter(elChap, CHAPTERS, t, 6.0);

  /* ---- hậu kỳ ------------------------------------------------------- */
  lens.uniforms.uT.value = t;
  /* fade vào/ra: S01 mở từ ĐEN TUYỆT ĐỐI; S88 fade-out 3s (storyboard) */
  var fade = HFA.globalFade(t, TOTAL, 1.5, 3.0);

  /* CHỐNG CHÁY TRẮNG (ghi chú dựng hình mục 3):
   *  - giảm exposure 15% cho TOÀN CHƯƠNG 2 (lõi Mặt Trời, plasma dày)
   *  - giảm 25% riêng S64 (sương mù tan — cảnh sáng nhất tập)
   *  - giảm thêm ở S03 (mưa 40.000 hạt) và S35 (photosphere) */
  var expo = 1.02;
  if (t >= SC.S16[0] && t < SC.S41[0]) expo *= 0.85;            /* CH2 */
  if (inSc(t,'S64')) expo *= 0.75;                               /* S64 */
  if (inSc(t,'S03')) expo *= 0.86;
  if (inSc(t,'S35')) expo *= 0.90;
  if (inSc(t,'S55') || inSc(t,'S60')) expo *= 0.94;
  lens.uniforms.uExposure.value = expo;
  lens.uniforms.uFade.value = fade;

  /* chớp trắng rất ngắn (2 frame, cường độ 0.35) ở cuối S04 → S05 */
  var flashK = 0;
  var fT = SC.S05[0];
  if (t > fT-0.07 && t < fT+0.01) flashK = 0.35*clamp(1-Math.abs(t-fT)/0.07,0,1);
  lens.uniforms.uFlash.value = flashK;

  /* grain nhẹ hơn ở các shot lặng để chúng "thở" */
  var calm = inSc(t,'S01')||inSc(t,'S05')||inSc(t,'S11')||inSc(t,'S29')||
             inSc(t,'S37')||inSc(t,'S48')||inSc(t,'S69')||inSc(t,'S86')||
             inSc(t,'S87')||inSc(t,'S88');
  lens.uniforms.uGrain.value = calm ? 0.026 : 0.044;

  /* S02 rack focus: CA mạnh hơn trong 0.9s đầu rồi về bình thường */
  var ca = 0.0015;
  if (inSc(t,'S02')) ca = 0.0015 + 0.0060*(1-smooth(clamp(ts(t,'S02')/0.9,0,1)));
  lens.uniforms.uCA.value = ca;

  /* Vignette: cảnh MÔI TRƯỜNG tràn kín mép (đang ở BÊN TRONG plasma) cần
   * vignette mạnh của lens, và phải TẮT vignette CSS — hai lớp chồng nhau
   * sẽ khoét ra một oval sáng giữa khung tối, đọc thành "sương mù trong
   * khung" chứ không phải "đang ở bên trong lò". */
  var inside = inSc(t,'S15')||inSc(t,'S16')||inSc(t,'S63')||inSc(t,'S64');
  lens.uniforms.uVig.value = inside ? 1.22 : 0.34;
  if (elVig) elVig.style.opacity = inside ? '0' : '1';

  composer.render();
}

 * Khoá phải trùng ĐÚNG data-composition-id của div gốc.
 */
window.__timelines = window.__timelines || {};
window.__timelines["photon-khong-gia"] = HFA.makeTimeline("photon-khong-gia", TOTAL, renderAtTime);

</script>
