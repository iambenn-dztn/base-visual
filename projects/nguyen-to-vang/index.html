// ---- seeded PRNG (mulberry32) ----
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// ---- scene boundaries (real time = cue.start) ----
const SC={
  A:[0,36.43], B:[36.43,91.2], C:[91.2,124.48], D:[124.48,187.03],
  E:[187.03,274], F:[274,315.4], G:[315.4,356.69], H:[356.69,404.35],
  I:[404.35,446.63], J:[446.63,495.79], K:[495.79,526.11], L:[526.11,570.32],
  M:[570.32,627.52], N:[627.52,715.4]
};
function loc(t,k){const w=SC[k];return Math.min(1,Math.max(0,(t-w[0])/(w[1]-w[0])));}
function inSc(t,k){const w=SC[k];return t>=w[0]&&t<w[1];}
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=(x)=>{x=clamp(x,0,1);return x*x*(3-2*x);};
function band(t,a,b,f){f=f||0.8;if(t<a-f||t>b+f)return 0;let up=smooth((t-(a-f))/(2*f));let dn=smooth(((b+f)-t)/(2*f));return Math.min(1,Math.min(up,dn));}

   void main(){

//  SHARED: starfield (temperature-colored) + Milky Way band

const STAR_R=14000;
function buildStars(){
  const N=5200,pr=mulberry32(20260808);
  const pos=new Float32Array(N*3),col=new Float32Array(N*3),siz=new Float32Array(N);
  const tmp=new THREE.Vector3();
  for(let i=0;i<N;i++){
    let u=pr(),v=pr();
    let theta=Math.acos(2*u-1),phi=2*Math.PI*v;
    let bnd=pr();if(bnd<0.42){theta=Math.PI*0.5+(pr()-0.5)*0.5;}
    tmp.set(Math.sin(theta)*Math.cos(phi),Math.cos(theta)*0.7,Math.sin(theta)*Math.sin(phi)).normalize().multiplyScalar(STAR_R);
    pos[i*3]=tmp.x;pos[i*3+1]=tmp.y;pos[i*3+2]=tmp.z;
    let tt=pr();let c=new THREE.Color();
    if(tt<0.12)c.setRGB(0.62,0.72,1.0);
    else if(tt<0.34)c.setRGB(0.9,0.94,1.0);
    else if(tt<0.66)c.setRGB(1.0,0.96,0.82);
    else if(tt<0.86)c.setRGB(1.0,0.82,0.56);
    else c.setRGB(1.0,0.62,0.44);
    let br=0.4+pr()*0.6;c.multiplyScalar(br);
    col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
    siz[i]=(pr()<0.06?3.4:1.0)*(0.9+pr()*1.7);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  g.setAttribute('aS',new THREE.BufferAttribute(siz,1));
  const m=new THREE.ShaderMaterial({
    uniforms:{uOp:{value:1}},transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    vertexShader:`attribute float aS;attribute vec3 color;varying vec3 vC;
      void main(){vC=color;vec4 mv=modelViewMatrix*vec4(position,1.0);
      gl_PointSize=aS*(${STAR_R.toFixed(1)}/-mv.z);gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`varying vec3 vC;uniform float uOp;
      void main(){vec2 d=gl_PointCoord-0.5;float r=length(d);
      float a=smoothstep(0.5,0.0,r);gl_FragColor=vec4(vC,a*uOp);}`
  });
  return new THREE.Points(g,m);
}
const stars=buildStars();scene.add(stars);

// ============================================================
//  Photosphere star (shader) — reusable, deterministic by uT
// ============================================================
function makeStar(radius,c1,c2,c3){
  const grp=new THREE.Group();
  const photoMat=new THREE.ShaderMaterial({
    uniforms:{uT:{value:0},uCol1:{value:new THREE.Color(c1||0x8a2400)},uCol2:{value:new THREE.Color(c2||0xff9628)},uCol3:{value:new THREE.Color(c3||0xffeeb8)},uBright:{value:1.4}},
    vertexShader:`varying vec3 vP;varying vec3 vN;void main(){vP=normalize(position);vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`
      varying vec3 vP;varying vec3 vN;uniform float uT,uBright;uniform vec3 uCol1,uCol2,uCol3;
      vec3 hash3(vec3 p){p=vec3(dot(p,vec3(127.1,311.7,74.7)),dot(p,vec3(269.5,183.3,246.1)),dot(p,vec3(113.5,271.9,124.6)));return -1.0+2.0*fract(sin(p)*43758.5453);}
      float snoise(vec3 p){vec3 i=floor(p);vec3 f=fract(p);vec3 u=f*f*(3.0-2.0*f);
        return mix(mix(mix(dot(hash3(i+vec3(0,0,0)),f-vec3(0,0,0)),dot(hash3(i+vec3(1,0,0)),f-vec3(1,0,0)),u.x),
                       mix(dot(hash3(i+vec3(0,1,0)),f-vec3(0,1,0)),dot(hash3(i+vec3(1,1,0)),f-vec3(1,1,0)),u.x),u.y),
                   mix(mix(dot(hash3(i+vec3(0,0,1)),f-vec3(0,0,1)),dot(hash3(i+vec3(1,0,1)),f-vec3(1,0,1)),u.x),
                       mix(dot(hash3(i+vec3(0,1,1)),f-vec3(0,1,1)),dot(hash3(i+vec3(1,1,1)),f-vec3(1,1,1)),u.x),u.y),u.z);}
      float fbm(vec3 p){float s=0.0,a=0.5;for(int i=0;i<5;i++){s+=a*snoise(p);p*=2.02;a*=0.5;}return s;}
      void main(){
        vec3 d=normalize(vP);
        float conv=fbm(d*7.0+vec3(0.0,0.0,uT*0.02));
        float fine=fbm(d*22.0+vec3(uT*0.05));
        float n=0.6*conv+0.4*fine;
        float spot=smoothstep(0.56,0.78,fbm(d*1.7+11.0));
        vec3 col=mix(uCol1,uCol2,smoothstep(-0.3,0.4,n));
        col=mix(col,uCol3,smoothstep(0.35,0.85,n));
        col*=mix(1.0,0.35,spot);
        float mu=clamp(dot(normalize(vN),vec3(0.0,0.0,1.0)),0.0,1.0);
        col*=0.30+0.70*pow(mu,0.6);

// ============================================================
//  Neutron star (hot blue photosphere + pulsar beams)
// ============================================================
function makeNeutronStar(radius){
  const grp=new THREE.Group();
  const mat=new THREE.ShaderMaterial({
    uniforms:{uT:{value:0},uBright:{value:2.2}},
    vertexShader:`varying vec3 vP;varying vec3 vN;void main(){vP=normalize(position);vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`
      varying vec3 vP;varying vec3 vN;uniform float uT,uBright;
      vec3 hash3(vec3 p){p=vec3(dot(p,vec3(127.1,311.7,74.7)),dot(p,vec3(269.5,183.3,246.1)),dot(p,vec3(113.5,271.9,124.6)));return -1.0+2.0*fract(sin(p)*43758.5453);}
      float snoise(vec3 p){vec3 i=floor(p);vec3 f=fract(p);vec3 u=f*f*(3.0-2.0*f);
        return mix(mix(mix(dot(hash3(i+vec3(0,0,0)),f-vec3(0,0,0)),dot(hash3(i+vec3(1,0,0)),f-vec3(1,0,0)),u.x),
                       mix(dot(hash3(i+vec3(0,1,0)),f-vec3(0,1,0)),dot(hash3(i+vec3(1,1,0)),f-vec3(1,1,0)),u.x),u.y),
                   mix(mix(dot(hash3(i+vec3(0,0,1)),f-vec3(0,0,1)),dot(hash3(i+vec3(1,0,1)),f-vec3(1,0,1)),u.x),
                       mix(dot(hash3(i+vec3(0,1,1)),f-vec3(0,1,1)),dot(hash3(i+vec3(1,1,1)),f-vec3(1,1,1)),u.x),u.y),u.z);}
      float fbm(vec3 p){float s=0.0,a=0.5;for(int i=0;i<4;i++){s+=a*snoise(p);p*=2.02;a*=0.5;}return s;}
      void main(){
        vec3 d=normalize(vP);
        float n=fbm(d*10.0+vec3(0.0,0.0,uT*0.4));
        vec3 c1=vec3(0.30,0.55,1.0);vec3 c2=vec3(0.75,0.9,1.0);vec3 c3=vec3(1.0,1.0,1.0);
        vec3 col=mix(c1,c2,smoothstep(-0.2,0.4,n));
        col=mix(col,c3,smoothstep(0.4,0.9,n));
        float mu=clamp(dot(normalize(vN),vec3(0.0,0.0,1.0)),0.0,1.0);
        col*=0.5+0.5*pow(mu,0.5);
        gl_FragColor=vec4(col*uBright,1.0);
      }`});
  const core=new THREE.Mesh(new THREE.SphereGeometry(radius,48,48),mat);grp.add(core);
  const halo=new THREE.Mesh(new THREE.SphereGeometry(radius*1.5,32,32),new THREE.ShaderMaterial({
    transparent:true,depthWrite:false,side:THREE.BackSide,blending:THREE.AdditiveBlending,
    vertexShader:`varying vec3 vN;varying vec3 vP;void main(){vN=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.0);vP=mv.xyz;gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`varying vec3 vN;varying vec3 vP;void main(){float f=pow(1.0-abs(dot(normalize(vN),normalize(-vP))),2.6);gl_FragColor=vec4(vec3(0.55,0.75,1.0)*f,f*0.9);}`}));
  grp.add(halo);
  const beamMat=new THREE.MeshBasicMaterial({color:0xbfe0ff,transparent:true,opacity:0.35,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide});
  const beams=new THREE.Group();
  for(let s=-1;s<=1;s+=2){
    const cone=new THREE.Mesh(new THREE.ConeGeometry(radius*2.2,radius*11,20,1,true),beamMat);
    cone.position.set(0,s*radius*5.5,0);if(s<0)cone.rotation.z=Math.PI;beams.add(cone);
  }
  beams.rotation.z=0.42;grp.add(beams);
  return {grp,core,mat,halo,beams,radius};
}

// ============================================================

// ============================================================
function makeCurve(color){
  const pts=[];const N=80;
  for(let i=0;i<N;i++){const x=i/(N-1);
    let y=1.0-Math.exp(-x*6.0);y-=0.35*smooth((x-0.42)/0.55)*(x>0.42?1:0);
    pts.push(new THREE.Vector3(-6+x*12,-1.5+y*4.0,0));}
  const g=new THREE.BufferGeometry().setFromPoints(pts);
  return new THREE.Line(g,new THREE.LineBasicMaterial({color:color||0xffd65a,transparent:true,opacity:0.9}));
}

// ============================================================
//  MAIN renderAtTime(t) — deterministic
// ============================================================
function renderAtTime(t){
  gA.visible=inSc(t,'A');gB.visible=inSc(t,'B');gC.visible=inSc(t,'C');gD.visible=inSc(t,'D');
  gE.visible=inSc(t,'E');gF.visible=inSc(t,'F');gG.visible=inSc(t,'G');gH.visible=inSc(t,'H');
  gI.visible=inSc(t,'I');gJ.visible=inSc(t,'J');gK.visible=inSc(t,'K');gL.visible=inSc(t,'L');
  gM.visible=inSc(t,'M');gN.visible=inSc(t,'N');

  stars.rotation.y=t*0.0016;stars.rotation.x=Math.sin(t*0.02)*0.02;
  const starOp=inSc(t,'A')||inSc(t,'N')?0.5:(inSc(t,'H')||inSc(t,'G')?0.85:0.9);
  stars.material.uniforms.uOp.value=starOp;
  mwSprite.material.opacity=0.16*starOp;

  let flash=0.0;
  key.intensity=1.15;

  try{
  // ---------------- A: gold ring ----------------
  if(gA.visible){
    const d=gA.userData;
    d.ring.grp.rotation.y=t*0.18;d.ring.grp.rotation.x=0.5+Math.sin(t*0.1)*0.15;
    d.ring.mat.emissiveIntensity=0.35+0.2*Math.sin(t*0.5);
    const arr=d.dust.geometry.attributes.position.array,base=d.base;
    for(let i=0;i<d.N;i++){arr[i*3]=base[i*3]+Math.sin(t*0.3+d.ph[i])*0.4;arr[i*3+1]=base[i*3+1]+Math.cos(t*0.25+d.ph[i])*0.4;arr[i*3+2]=base[i*3+2]+Math.sin(t*0.2+d.ph[i])*0.4;}
    d.dust.geometry.attributes.position.needsUpdate=true;
    d.dust.material.opacity=0.35+0.4*smooth(loc(t,'A'));
    const hv=band(t,18.5,35.5,1.5);
    d.crown.material.opacity=0.8*hv;d.coin.grp.visible=hv>0.02;
    d.coin.grp.children.forEach(c=>{if(c.material){c.material.transparent=true;c.material.opacity=hv;}});
    d.coin.grp.rotation.z=t*0.2;
    const p=loc(t,'A');
    setCam(Math.sin(t*0.06)*2.5,1.2-p*0.6,10-p*1.5,0,0,0,42);
  }

  // ---------------- B: origin ----------------
  if(gB.visible){
    const d=gB.userData;
    const earthP=t<42.12;const starP=t>=42.12&&t<54.66;const blastP=t>=54.66&&t<63.58;const bloodP=t>=63.58;
    d.earth.visible=earthP;d.cloud.visible=earthP;d.atmo.visible=earthP;
    d.star.grp.visible=starP;d.blast.visible=blastP;d.goldAtom.visible=blastP;d.blood.visible=bloodP;
    if(earthP){
      d.earth.rotation.y=t*0.05;d.cloud.rotation.y=t*0.06;
      key.intensity=0.55;
      d.cloud.material.opacity=0.5*band(t,36.43,42.12,0.8);d.atmo.material.opacity=band(t,36.43,42.12,0.8);
      setCam(0,0,11+(t-36.43)*0.2,0,0,0,44);
    }
    if(starP){
      d.star.photoMat.uniforms.uT.value=t;d.star.core.rotation.y=t*0.03;
      const sc=0.9+0.1*Math.sin(t*0.5);d.star.grp.scale.setScalar(sc);
      d.star.cor.material.opacity=0.7;
      setCam(0,0,13-smooth((t-42.12)/12)*3,0,0,0,44);
    }
    if(blastP){
      const bp=smooth((t-54.66)/8.9);
      d.blast.material.opacity=0.9*(0.3+0.7*Math.sin(bp*Math.PI));
      d.blast.scale.setScalar(6+bp*10);
      d.goldAtom.position.set(Math.cos(t*0.8)*(1+bp*4),Math.sin(t*0.6)*bp*2,0);
      d.goldAtom.rotation.y=t*2;
      setCam(0,0,14,0,0,-4,46);
    }
    if(bloodP){
      const fly=(t-63.58)*2.0;
      d.cells.forEach(m=>{let z=((m.userData.z0+fly)%28+28)%28-14;
        m.position.set(Math.cos(m.userData.a)*m.userData.rr,Math.sin(m.userData.a)*m.userData.rr,z);
        m.rotation.z=t*m.userData.sp;});
      d.goldSpk.forEach(m=>{let z=((m.userData.z0+fly)%28+28)%28-14;
        m.position.set(Math.cos(m.userData.a+t*0.3)*m.userData.rr,Math.sin(m.userData.a+t*0.3)*m.userData.rr,z);});
      key.intensity=0.9;
      setCam(0,0,6,0,0,-2,52);
    }
  }

  // ---------------- C: stardust / forge ----------------
  if(gC.visible){
    const d=gC.userData;
    const forgeP=t>=97.67;
    d.star.grp.visible=forgeP;
    const arr=d.ash.geometry.attributes.position.array,base=d.base;
    for(let i=0;i<d.N;i++){arr[i*3]=base[i*3]+Math.sin(t*0.12+d.ph[i])*0.8;arr[i*3+1]=base[i*3+1]+Math.cos(t*0.1+d.ph[i])*0.8;arr[i*3+2]=base[i*3+2]+Math.sin(t*0.08+d.ph[i])*0.6;}
    d.ash.geometry.attributes.position.needsUpdate=true;
    d.ash.material.opacity=0.7*band(t,91.2,124.48,1.5);
    if(forgeP){
      d.star.photoMat.uniforms.uT.value=t;d.star.core.rotation.y=t*0.02;
      d.star.grp.scale.setScalar(0.9+0.1*Math.sin(t*0.4));d.star.cor.material.opacity=0.7;
    }
    if(t<97.67)setCam(Math.sin(t*0.04)*4,0,24-loc(t,'C')*6,0,0,0,50);
    else setCam(0,0,15-smooth((t-97.67)/18)*5,0,0,0,44);
  }

  // ---------------- D: iron wall ----------------
  if(gD.visible){
    const d=gD.userData;
    const chainP=t<142.72;const curveP=t>=142.72&&t<157.78;const coreP=t>=157.78&&t<173.84;const tableP=t>=173.84;
    d.chain.visible=chainP;
    d.curve.visible=curveP;d.feMark.visible=curveP;d.feLabel.visible=curveP;
    d.ironCore.visible=coreP;d.shell.visible=coreP;d.table.visible=tableP;
    if(chainP){
      // reveal chain elements progressively, each glows when reached
      const walk=smooth((t-124.48)/16)*5;
      d.chainItems.forEach((it,i)=>{const on=walk>i-0.5?1:0.15;
        it.m.material.emissiveIntensity=0.4+0.6*on*(0.7+0.3*Math.sin(t*1.5+i));
        it.m.scale.setScalar(0.85+0.15*on);
        it.lb.material.opacity=0.4+0.6*on;});
      d.chain.rotation.y=Math.sin(t*0.1)*0.06;
      setCam(0,0.2,10,0,0,0,48);
    }
    if(curveP){
      const fx=-6+0.42*12;const fy=-1.5+(1.0-Math.exp(-0.42*6.0))*4.0;
      d.feMark.position.set(fx,fy,0.05);
      d.feLabel.position.set(fx,fy+0.7,0.1);
      d.feLabel.material.opacity=band(t,142.72,157.78,1.0);
      d.curve.material.opacity=0.9;d.curve.material.color.setHex(0xff7a4a);
      setCam(0,0.3,10,0,0.3,0,46);
    }
    if(coreP){
      const cp=smooth((t-157.78)/16);
      d.ironCore.scale.setScalar(0.8+cp*1.2);
      d.ironCore.rotation.y=t*0.15;
      d.shell.material.opacity=0.5*(1-cp*0.7);
      d.shell.scale.setScalar(1.4-cp*0.3);
      setCam(0,0,9-cp*2,0,0,0,44);
    }
    if(tableP){
      const tp=smooth((t-173.84)/13);
      d.table.rotation.y=Math.sin(t*0.1)*0.08;
      Object.values(d.heavy).forEach(m=>{m.material.opacity=0.7+0.3*Math.sin(t*1.2);});
      setCam(0,0,12-tp*3,0,0,0,50);
    }
  }

  // ---------------- E: r-process ----------------
  if(gE.visible){
    const d=gE.userData;
    const rprocP=t<237.51;const superP=t>=237.51;
    d.nucleus.visible=rprocP;d.rain.visible=rprocP;d.goldGlow.visible=rprocP;d.auLabel.visible=t>=217.23&&t<237.51;
    d.snova.visible=superP;d.shock.visible=superP;
    if(rprocP){
      const intensity=t<199.29?smooth((t-187.03)/12):1.0;
      const arr=d.rain.geometry.attributes.position.array;
      for(let i=0;i<d.NR;i++){
        const life=((t*0.35*intensity+d.rph[i])%1);
        const r=6.5*(1-life);
        arr[i*3]=d.rdir[i*3]*r;arr[i*3+1]=d.rdir[i*3+1]*r;arr[i*3+2]=d.rdir[i*3+2]*r;
      }
      d.rain.geometry.attributes.position.needsUpdate=true;
      d.rain.material.opacity=0.9*intensity;
      const grow=t>=217.23?smooth((t-217.23)/16):0.3+0.2*smooth((t-199.29)/18);
      d.nucleus.scale.setScalar(0.9+grow*0.9);
      d.nucleus.rotation.y=t*0.4;d.nucleus.rotation.x=Math.sin(t*0.3)*0.4;
      const gf=band(t,229,237.51,1.2);
      d.goldGlow.material.opacity=0.9*gf;d.goldGlow.scale.setScalar(4+gf*4);
      if(d.auLabel.visible){d.auLabel.material.opacity=gf;}
      const shake=t>=199.29&&t<217.23?Math.sin(t*30)*0.06:0;
      setCam(shake,0,8-smooth((t-187.03)/12)*1.5,0,0,0,44);
    }
    if(superP){
      const sp=smooth((t-237.51)/9);
      d.snova.material.opacity=0.9*(0.4+0.6*Math.sin(clamp((t-237.51)/16,0,1)*Math.PI));
      d.snova.scale.setScalar(10+sp*8);
      const arr=d.shock.geometry.attributes.position.array;
      const exp=8+((t-237.51)%18)*1.2;
      for(let i=0;i<d.SW;i++){arr[i*3]=d.swBase[i*3]*exp;arr[i*3+1]=d.swBase[i*3+1]*exp;arr[i*3+2]=d.swBase[i*3+2]*exp;}
      d.shock.geometry.attributes.position.needsUpdate=true;
      d.shock.material.opacity=0.7*band(t,237.51,274,2.0);
      if(t<256.7)setCam(0,0,18,0,0,-4,50);
      else setCam(0,0,20-smooth((t-256.7)/17)*4,0,0,-4,50);
    }
  }

  // ---------------- F: neutron star ----------------
  if(gF.visible){
    const d=gF.userData;
    const revealP=t<282.76;const crushP=t>=282.76&&t<297.47;const scaleP=t>=297.47;
    d.ns.mat.uniforms.uT.value=t;
    d.ns.core.rotation.y=t*3.5;
    d.ns.beams.rotation.y=t*3.5;
    d.crush.visible=crushP;d.city.visible=scaleP;
    if(revealP){
      d.ns.grp.position.set(0,0,0);d.ns.grp.scale.setScalar(1.0);
      setCam(0,0,10-smooth((t-274)/8)*4,0,0,0,42);
    }
    if(crushP){
      d.ns.grp.position.set(0,0,0);d.ns.grp.scale.setScalar(1.0);
      const arr=d.crush.geometry.attributes.position.array;
      for(let i=0;i<d.CR;i++){const life=((t*0.4+d.crph[i])%1);const r=7*(1-life);
        arr[i*3]=d.crBase[i*3]*r;arr[i*3+1]=d.crBase[i*3+1]*r;arr[i*3+2]=d.crBase[i*3+2]*r;}
      d.crush.geometry.attributes.position.needsUpdate=true;
      d.crush.material.opacity=0.8;
      setCam(Math.sin(t*8)*0.05,0,7,0,0,0,42);
    }
    if(scaleP){
      d.ns.grp.position.set(-3,0.5,0);
      d.ns.grp.scale.setScalar(0.9);
      d.city.position.x=3;
      setCam(0,0.5,12-smooth((t-297.47)/17)*2,0,0,0,48);
    }
  }

  // ---------------- G: inspiral + collision ----------------
  if(gG.visible){
    const d=gG.userData;
    d.nsA.mat.uniforms.uT.value=t;d.nsB.mat.uniforms.uT.value=t;
    const collideT=345.8;
    const binaryP=t<collideT;
    d.nsA.grp.visible=binaryP;d.nsB.grp.visible=binaryP;
    if(binaryP){
      const prog=clamp((t-315.4)/(collideT-315.4),0,1);
      const rad=Math.max(0.4,3.4*(1-prog)+0.2);
      const a=t*(0.6+Math.pow(prog,2.5)*10.0);
      d.nsA.grp.position.set(Math.cos(a)*rad,0,Math.sin(a)*rad);
      d.nsB.grp.position.set(-Math.cos(a)*rad,0,-Math.sin(a)*rad);
      const sc=0.9-prog*0.2;d.nsA.grp.scale.setScalar(sc);d.nsB.grp.scale.setScalar(sc);
      d.rings.children.forEach((r,i)=>{const rl=((t*0.4+i*0.25)%1);r.scale.setScalar(1+rl*10);
        r.material.opacity=0.4*(1-rl)*smooth(prog+0.2);});
      const shake=prog>0.7?Math.sin(t*40)*0.15*(prog-0.7)/0.3:0;
      setCam(shake,2-prog*1.2,9-prog*4,0,0,0,46);
      d.flash.material.opacity=0;
    } else {
      const ft=t-collideT;
      const fl=Math.max(0,1-ft/0.6);
      d.flash.material.opacity=fl;
      d.flash.scale.setScalar(20+ft*20);
      flash=Math.max(flash,fl*0.9);
      setCam(0,0,10,0,0,0,46);
      d.rings.children.forEach(r=>{r.material.opacity=0;});
    }
  }

  // ---------------- H: kilonova ----------------
  if(gH.visible){
    const d=gH.userData;
    const t0=356.69;const tt=t-t0;
    const arr=d.flood.geometry.attributes.position.array,col=d.flood.geometry.attributes.color.array;
    const goldPhase=smooth(clamp((t-371.55)/12,0,1));
    for(let i=0;i<d.N;i++){
      const life=((tt*0.09*d.spd[i]+d.ph[i])%1);
      const r=life*30;
      arr[i*3]=d.dir[i*3]*r;arr[i*3+1]=d.dir[i*3+1]*r;arr[i*3+2]=d.dir[i*3+2]*r;
      let cr,cg,cb;
      if(d.typ[i]<0.6){cr=0.3+goldPhase*0.7;cg=0.4+goldPhase*0.45;cb=1.0-goldPhase*0.65;}
      else {cr=0.4+goldPhase*0.4;cg=0.4-goldPhase*0.2;cb=1.0;}
      const fade=1-life;
      col[i*3]=cr*fade;col[i*3+1]=cg*fade;col[i*3+2]=cb*fade;
    }
    d.flood.geometry.attributes.position.needsUpdate=true;
    d.flood.geometry.attributes.color.needsUpdate=true;
    d.flood.material.uniforms.uOp.value=0.9;
    const fire=band(t,371.55,404.35,2.0);
    d.fire.material.opacity=0.95*fire;d.fire.scale.setScalar(6+goldPhase*10);
    d.violetHalo.material.opacity=0.5*band(t,386.62,404.35,2.0);
    d.violetHalo.scale.setScalar(16+smooth((t-386.62)/17)*12);
    d.jets.children.forEach(j=>{j.material.opacity=0.4*band(t,371.55,392,1.5);});
    d.jets.rotation.y=t*0.3;
    if(t<386.62)setCam(0,0,14+smooth((t-356.69)/15)*3,0,0,0,50);
    else setCam(Math.sin(t*0.05)*3,2,26+smooth((t-386.62)/17)*8,0,0,0,52);
  }

  // ---------------- I: detection ----------------
  if(gI.visible){
    const d=gI.userData;
    const hypoP=t<419.03;
    d.grid.material.uniforms.uT.value=t;
    d.grid.material.uniforms.uAmp.value=hypoP?0.15:0.9*band(t,419.03,446.63,1.5);
    const arr=d.chirp.geometry.attributes.position.array;
    const drawn=hypoP?0:smooth((t-419.03)/14);
    for(let i=0;i<d.NC;i++){
      const xN=i/(d.NC-1);
      const x=-6+xN*12;
      const env=xN<0.85?1:Math.max(0,1-(xN-0.85)/0.15);
      const freq=2+Math.pow(xN,2.5)*40;
      const amp=(0.3+xN*0.8)*env;
      const y=(xN<=drawn)?Math.sin(xN*freq)*amp:0;
      arr[i*3]=x;arr[i*3+1]=y;arr[i*3+2]=0;
    }
    d.chirp.geometry.attributes.position.needsUpdate=true;
    d.chirp.material.opacity=hypoP?0.2:0.95;
    const showSrc=t>=432.25;
    d.srcA.visible=showSrc;d.srcB.visible=showSrc;
    if(showSrc){const a=t*6;const r=0.8*(1-smooth((t-432.25)/14)*0.6);
      d.srcA.position.set(Math.cos(a)*r,3+Math.sin(t*0.5)*0.2,-4+Math.sin(a)*r);
      d.srcB.position.set(-Math.cos(a)*r,3+Math.sin(t*0.5)*0.2,-4-Math.sin(a)*r);}
    setCam(Math.sin(t*0.05)*2,2.5,15-smooth(loc(t,'I'))*3,0,0.5,0,50);
  }

  // ---------------- J: observed ----------------
  if(gJ.visible){
    const d=gJ.userData;
    const gammaP=t<464.56;const kiloP=t>=446.63&&t<489.6;const ringP=t>=482.73;
    d.gamma.visible=gammaP;d.gjets.visible=gammaP;
    d.tel.visible=t>=451&&t<466;
    d.kilo.visible=kiloP;d.ring.grp.visible=ringP;
    if(gammaP){
      const gf=band(t,446.63,455,1.0);
      d.gamma.material.opacity=0.9*gf;d.gamma.scale.setScalar(8+smooth((t-446.63)/6)*6);
      d.gjets.children.forEach(j=>{j.material.opacity=0.5*gf;});
      d.gjets.rotation.y=t*0.5;
    }
    if(d.tel.visible){
      const tf=band(t,451,466,1.0);
      d.tel.children.forEach((ln,i)=>{ln.material.opacity=0.5*tf*(0.5+0.5*Math.sin(t*2+i));});
    }
    if(kiloP){
      const kf=band(t,449,489,3.0);
      d.kilo.material.opacity=0.85*kf;d.kilo.scale.setScalar(7+smooth((t-449)/17)*4);
    }
    if(ringP){
      const rf=smooth((t-482.73)/6);
      d.ring.grp.rotation.y=t*0.2;d.ring.grp.rotation.x=0.5;
      d.ring.grp.children.forEach(c=>{if(c.material){c.material.transparent=true;c.material.opacity=rf;}});
      d.ring.grp.scale.setScalar(0.6+rf*0.4);
    }
    if(t<464.56)setCam(0,0,14,0,0,-3,48);
    else if(t<482.73)setCam(Math.sin(t*0.05)*2,1,16,0,0,0,50);
    else setCam(0,0,10-smooth((t-482.73)/13)*2,0,0,0,44);
  }

  // ---------------- K: journey ----------------
  if(gK.visible){
    const d=gK.userData;
    const collapseP=t>=504.45;
    const arr=d.dust.geometry.attributes.position.array,base=d.base;
    const collapse=collapseP?smooth((t-504.45)/14):0;
    for(let i=0;i<d.N;i++){const cf=1-collapse*0.85;
      arr[i*3]=base[i*3]*cf+Math.sin(t*0.15+d.ph[i])*0.6;
      arr[i*3+1]=base[i*3+1]*cf+Math.cos(t*0.12+d.ph[i])*0.6;
      arr[i*3+2]=base[i*3+2]*cf+Math.sin(t*0.1+d.ph[i])*0.6;}
    d.dust.geometry.attributes.position.needsUpdate=true;
    d.dust.material.opacity=0.7*(1-collapse*0.5);
    const ign=collapseP?smooth((t-510)/10):0;
    d.sun.grp.visible=ign>0.02;
    if(d.sun.grp.visible){d.sun.photoMat.uniforms.uT.value=t;d.sun.grp.scale.setScalar(0.3+ign);d.sun.cor.material.opacity=0.8*ign;}
    d.disk.visible=collapse>0.3;
    if(d.disk.visible){const arr2=d.disk.geometry.attributes.position.array;
      for(let i=0;i<d.DN;i++){const a=d.da[i]+t*0.15;arr2[i*3]=Math.cos(a)*d.dr[i];arr2[i*3+1]=d.dy[i];arr2[i*3+2]=Math.sin(a)*d.dr[i];}
      d.disk.geometry.attributes.position.needsUpdate=true;
      d.disk.material.opacity=0.7*smooth((t-510)/10);}
    const ef=band(t,516,526.11,1.0);d.earth.visible=ef>0.02;
    if(d.earth.visible){const ea=t*0.4;d.earth.position.set(Math.cos(ea)*8,0,Math.sin(ea)*8);d.earth.rotation.y=t*0.3;
      d.earth.material.opacity=ef;}
    if(t<504.45)setCam(Math.sin(t*0.06)*3,0,20-loc(t,'K')*4,0,0,0,52);
    else setCam(0,6-smooth((t-504.45)/16)*3,24-smooth((t-504.45)/16)*6,0,0,0,50);
  }

  // ---------------- L: molten earth / gold sinks ----------------
  if(gL.visible){
    const d=gL.userData;
    const moltenP=t<540.51;const xsecP=t>=540.51;
    d.molten.visible=moltenP;d.goldGrp.visible=moltenP;d.xsec.visible=xsecP;
    d.molten.material.uniforms.uT.value=t;d.molten.rotation.y=t*0.06;
    if(moltenP){
      const sink=smooth((t-526.11)/14);
      d.golds.forEach(m=>{const r=m.userData.r0*(1-sink*0.7)+Math.sin(t*0.5+m.userData.ph*6.283)*0.1;
        const a=m.userData.a+t*0.1,b=m.userData.b;
        m.position.set(r*Math.sin(b)*Math.cos(a),r*Math.sin(b)*Math.sin(a),r*Math.cos(b));});
      setCam(0,0,11-smooth((t-526.11)/14)*2,0,0,0,46);
    }
    if(xsecP){
      d.xsec.rotation.z=Math.sin(t*0.05)*0.05;
      const arr=d.xgold.geometry.attributes.position.array;
      const sink=smooth((t-540.51)/16);
      for(let i=0;i<d.XN;i++){const a=d.xa[i];const r=(2.6*(1-sink)+0.5)*(0.6+d.xph[i]*0.4)+Math.sin(t*0.4+i)*0.05;
        arr[i*3]=Math.cos(a)*r;arr[i*3+1]=Math.sin(a)*r;arr[i*3+2]=0.05;}
      d.xgold.geometry.attributes.position.needsUpdate=true;
      if(t<560.29)setCam(0,0,9,0,0,0,46);
      else setCam(0,0,9+smooth((t-560.29)/10)*4,0,0,0,48);
    }
  }

  // ---------------- M: meteor bombardment / late veneer / mines ----------------
  if(gM.visible){
    const d=gM.userData;
    d.earth.rotation.y=t*0.05;
    const meteorP=t<604.8;
    d.metGrp.visible=meteorP;
    d.meteors.forEach(m=>{const life=((t*0.12*m.userData.sp+m.userData.ph)%1);
      const r=8*(1-life)+3.1;const a=m.userData.a,b=m.userData.b;
      m.position.set(r*Math.sin(b)*Math.cos(a),r*Math.sin(b)*Math.sin(a),r*Math.cos(b));
      m.visible=life>0.02&&meteorP;});
    const arr=d.veneer.geometry.attributes.position.array;
    for(let i=0;i<d.VN;i++){const r=3.08;const a=d.va[i]+t*0.05,b=d.vb[i];
      arr[i*3]=r*Math.sin(b)*Math.cos(a);arr[i*3+1]=r*Math.sin(b)*Math.sin(a);arr[i*3+2]=r*Math.cos(b);}
    d.veneer.geometry.attributes.position.needsUpdate=true;
    d.veneer.material.opacity=0.9*band(t,587.6,627.52,2.0);
    d.veneer.material.size=t>=604.8?0.42:0.28;
    if(t<587.6)setCam(0,0,10-smooth((t-570.32)/17)*1.5,0,0,0,46);
    else if(t<604.8)setCam(Math.sin(t*0.05)*2,0,8,0,0,0,44);
    else setCam(Math.sin(t*0.04)*3,0.5,12-smooth((t-604.8)/22)*2,0,0,0,50);
  }

  // ---------------- N: close ----------------
  if(gN.visible){
    const d=gN.userData;
    d.ring.grp.rotation.y=t*0.12;d.ring.grp.rotation.x=0.5+Math.sin(t*0.08)*0.12;
    d.ring.mat.emissiveIntensity=0.35+0.25*Math.sin(t*0.4);
    d.glow.material.opacity=0.4+0.25*Math.sin(t*0.3);
    d.kilo.material.opacity=0.35*band(t,665,693,3.0);
    const arr=d.spark.geometry.attributes.position.array,base=d.base;
    for(let i=0;i<d.N;i++){arr[i*3]=base[i*3]+Math.sin(t*0.2+d.ph[i])*0.5;
      arr[i*3+1]=base[i*3+1]+((t*0.3+d.ph[i])%3)-1.5;
      arr[i*3+2]=base[i*3+2]+Math.cos(t*0.18+d.ph[i])*0.5;}
    d.spark.geometry.attributes.position.needsUpdate=true;
    d.spark.material.opacity=0.5*band(t,627.52,715.4,2.0);
    const p=loc(t,'N');
    setCam(Math.sin(t*0.05)*2,1.4-p*0.8,10-smooth(clamp((t-627.52)/40,0,1))*2.5,0,0,0,42);
  }
  }catch(err){var ed=document.getElementById('err');if(ed){ed.style.display='block';ed.textContent='SCENE ERR @t='+t.toFixed(1)+': '+(err&&err.message||err);}}

  // ---------------- global fades ----------------
  let fade=1.0;
  fade*=smooth(clamp(t/3.5,0,1));
  fade*=smooth(clamp((TOTAL-t)/4.0,0,1));

  lens.uniforms.uT.value=t;
  lens.uniforms.uFade.value=fade;
  lens.uniforms.uFlash.value=flash;
  const fiery=(inSc(t,'E')&&t>=237.51)||inSc(t,'G')||inSc(t,'H')||(inSc(t,'L')&&t<540.51);
  bloom.strength=fiery?1.2:0.85;

  updateText(t);
  composer.render();
}

// subtitle / chapter lookup
let _lastSub=-1,_lastChap='';
function updateText(t){
  let idx=0;for(let i=0;i<CUES.length;i++){if(CUES[i].t<=t+1e-6)idx=i;else break;}
  const cur=CUES[idx];
  if(idx!==_lastSub){document.getElementById('sub').textContent=cur?cur.s:'';_lastSub=idx;}
  let chT=-1,chS='';for(const c of CUES){if(c.ch&&c.t<=t){chT=c.t;chS=c.ch;}}
  const chapEl=document.getElementById('chap');
  if(chS!==_lastChap){chapEl.textContent=chS;_lastChap=chS;}
  const op=chT>=0?smooth(clamp((t-chT)/0.8,0,1))*smooth(clamp((chT+4.5-t)/1.2,0,1)):0;
  chapEl.style.opacity=op;
  document.getElementById('sub').style.opacity=1;
}

// ============================================================
//  GSAP timeline (paused) — deterministic driver
// ============================================================
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});
const clk={t:0};
tl.to(clk,{t:TOTAL,duration:TOTAL,ease:"none",onUpdate:()=>renderAtTime(clk.t)},0);
window.__timelines["nguyen-to-vang"]=tl;

// initial render
renderAtTime(0);
</script>
