// ---- seeded PRNG (mulberry32) ----
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// ---- scene boundaries (real time = cue.start) ----
const SC={
  A:[0,35.43], B:[35.43,108.34], C:[108.34,188.6], D:[188.6,281.15],
  E:[281.15,310.57], F:[310.57,412.2], G:[412.2,456.3], H:[456.3,532.06],
  I:[532.06,572.99], J:[572.99,617.32], K:[617.32,664.14], L:[664.14,716.61],
  M:[716.61,806.14]
};
function loc(t,k){const w=SC[k];return Math.min(1,Math.max(0,(t-w[0])/(w[1]-w[0])));}
function inSc(t,k){const w=SC[k];return t>=w[0]&&t<w[1];}
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=(x)=>{x=clamp(x,0,1);return x*x*(3-2*x);};
function band(t,a,b,f){f=f||0.8;if(t<a-f||t>b+f)return 0;let up=smooth((t-(a-f))/(2*f));let dn=smooth(((b+f)-t)/(2*f));return Math.min(1,Math.min(up,dn));}

  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
   varying vec2 vUv;uniform sampler2D tDiffuse;uniform float uT,uVig,uCA,uGrain,uFade,uFlash;
   float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
   void main(){
     vec2 d=vUv-0.5;float r=dot(d,d);
     vec2 off=d*uCA*(1.0+r*2.2);
     vec3 col;
     col.r=texture2D(tDiffuse,vUv+off).r;
     col.g=texture2D(tDiffuse,vUv).g;
     col.b=texture2D(tDiffuse,vUv-off).b;
     float vig=smoothstep(1.02,uVig,r*2.0);
     col*=mix(1.0,vig,0.85);
     float g=h(vUv*vec2(1920.0,1080.0)+fract(uT)*97.3)-0.5;
     col+=g*uGrain;
     col=mix(col,vec3(0.85,0.95,1.0),uFlash);
     col*=uFade;
     gl_FragColor=vec4(col,1.0);
   }`
};

//  SHARED: starfield (temperature-colored) + Milky Way band
// ============================================================
const STAR_R=14000;
function buildStars(){
  const N=5200,pr=mulberry32(20260808);
  const pos=new Float32Array(N*3),col=new Float32Array(N*3),siz=new Float32Array(N);
  const tmp=new THREE.Vector3();
  for(let i=0;i<N;i++){
    let u=pr(),v=pr();
    let theta=Math.acos(2*u-1),phi=2*Math.PI*v;
    let bnd=pr();if(bnd<0.42){theta=Math.PI*0.5+(pr()-0.5)*0.5;}
    tmp.set(Math.sin(theta)*Math.cos(phi),Math.cos(theta)*0.7,Math.sin(theta)*Math.sin(phi)).normalize().multiplyScalar(STAR_R);
    pos[i*3]=tmp.x;pos[i*3+1]=tmp.y;pos[i*3+2]=tmp.z;
    let tt=pr();let c=new THREE.Color();
    if(tt<0.12)c.setRGB(0.62,0.72,1.0);
    else if(tt<0.34)c.setRGB(0.9,0.94,1.0);
    else if(tt<0.66)c.setRGB(1.0,0.96,0.82);
    else if(tt<0.86)c.setRGB(1.0,0.82,0.56);
    else c.setRGB(1.0,0.62,0.44);
    let br=0.4+pr()*0.6;c.multiplyScalar(br);
    col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
    siz[i]=(pr()<0.06?3.4:1.0)*(0.9+pr()*1.7);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  g.setAttribute('aS',new THREE.BufferAttribute(siz,1));
  const m=new THREE.ShaderMaterial({
    uniforms:{uOp:{value:1}},transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    vertexShader:`attribute float aS;attribute vec3 color;varying vec3 vC;
      void main(){vC=color;vec4 mv=modelViewMatrix*vec4(position,1.0);
      gl_PointSize=aS*(${STAR_R.toFixed(1)}/-mv.z);gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`varying vec3 vC;uniform float uOp;
      void main(){vec2 d=gl_PointCoord-0.5;float r=length(d);
      float a=smoothstep(0.5,0.0,r);gl_FragColor=vec4(vC,a*uOp);}`
  });
  return new THREE.Points(g,m);
}
const stars=buildStars();scene.add(stars);

function softDisc(inner,outer,r,g,b){
  const cv=document.createElement('canvas');cv.width=cv.height=256;const cx=cv.getContext('2d');
  const gr=cx.createRadialGradient(128,128,inner,128,128,outer);
  gr.addColorStop(0,`rgba(${r},${g},${b},0.9)`);gr.addColorStop(0.5,`rgba(${r},${g},${b},0.28)`);gr.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=gr;cx.fillRect(0,0,256,256);

// ============================================================
//  Realistic Sun (photosphere shader + chromosphere + corona)
// ============================================================
function makeStar(radius,c1,c2,c3){
  const grp=new THREE.Group();
  const photoMat=new THREE.ShaderMaterial({
    uniforms:{uT:{value:0},uCol1:{value:new THREE.Color(c1||0xb83400)},uCol2:{value:new THREE.Color(c2||0xff9628)},uCol3:{value:new THREE.Color(c3||0xffeeb8)},uBright:{value:1.4}},
    vertexShader:`varying vec3 vP;varying vec3 vN;void main(){vP=position;vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`varying vec3 vP;varying vec3 vN;uniform float uT,uBright;uniform vec3 uCol1,uCol2,uCol3;
      float hash(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453);}
      float snoise(vec3 p){vec3 i=floor(p);vec3 f=fract(p);vec3 u=f*f*(3.0-2.0*f);
        float n000=hash(i+vec3(0.0,0.0,0.0));float n100=hash(i+vec3(1.0,0.0,0.0));
        float n010=hash(i+vec3(0.0,1.0,0.0));float n110=hash(i+vec3(1.0,1.0,0.0));
        float n001=hash(i+vec3(0.0,0.0,1.0));float n101=hash(i+vec3(1.0,0.0,1.0));
        float n011=hash(i+vec3(0.0,1.0,1.0));float n111=hash(i+vec3(1.0,1.0,1.0));
        float nx00=mix(n000,n100,u.x);float nx10=mix(n010,n110,u.x);
        float nx01=mix(n001,n101,u.x);float nx11=mix(n011,n111,u.x);
        float nxy0=mix(nx00,nx10,u.y);float nxy1=mix(nx01,nx11,u.y);
        return mix(nxy0,nxy1,u.z);}
      float fbm(vec3 p){float s=0.0,a=0.5;for(int i=0;i<5;i++){s+=a*snoise(p);p*=2.02;a*=0.5;}return s;}
      void main(){
        vec3 d=normalize(vP);
        float conv=fbm(d*7.0+vec3(0.0,0.0,uT*0.02));
        float fine=fbm(d*22.0+vec3(uT*0.05));
        float v=conv*0.7+fine*0.3;
        float spot=smoothstep(0.56,0.78,fbm(d*1.7+11.0));
        vec3 col=mix(uCol1,uCol2,smoothstep(0.2,0.6,v));
        col=mix(col,uCol3,smoothstep(0.6,0.95,v));
        col=mix(col,uCol1*0.4,spot*0.8);
        float mu=clamp(dot(vN,vec3(0.0,0.0,1.0)),0.0,1.0);
        col*=(0.30+0.70*pow(mu,0.6));
        gl_FragColor=vec4(col*uBright,1.0);
      }`
  });
  const core=new THREE.Mesh(new THREE.SphereGeometry(radius,64,64),photoMat);grp.add(core);
  const chromo=new THREE.Mesh(new THREE.SphereGeometry(radius*1.028,48,48),new THREE.ShaderMaterial({
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.BackSide,
    uniforms:{uCr:{value:new THREE.Color(c2||0xff6a28)}},
    vertexShader:`varying vec3 vN;varying vec3 vE;void main(){vN=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.0);vE=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`varying vec3 vN;varying vec3 vE;uniform vec3 uCr;void main(){float f=pow(1.0-max(dot(vN,vE),0.0),3.2);gl_FragColor=vec4(uCr*f,f);}`
  }));grp.add(chromo);
  const cpr=mulberry32(99);
  function coronaTex(cr,cg,cb){
    const cv=document.createElement('canvas');cv.width=cv.height=512;const cx=cv.getContext('2d');
    const gr=cx.createRadialGradient(256,256,40,256,256,256);
    gr.addColorStop(0,`rgba(${cr},${cg},${cb},0.55)`);gr.addColorStop(0.35,`rgba(${cr},${cg},${cb},0.18)`);gr.addColorStop(1,'rgba(0,0,0,0)');
    cx.fillStyle=gr;cx.fillRect(0,0,512,512);
    cx.globalCompositeOperation='lighter';
    for(let i=0;i<14;i++){const a=cpr()*6.283;const len=120+cpr()*130;
      cx.save();cx.translate(256,256);cx.rotate(a);
      const lg=cx.createLinearGradient(0,0,len,0);lg.addColorStop(0,`rgba(${cr},${cg},${cb},0.22)`);lg.addColorStop(1,'rgba(0,0,0,0)');
      cx.fillStyle=lg;cx.beginPath();cx.moveTo(0,-6);cx.lineTo(len,0);cx.lineTo(0,6);cx.closePath();cx.fill();cx.restore();}
    const tx=new THREE.CanvasTexture(cv);tx.encoding=THREE.sRGBEncoding;return tx;
  }
  const cor=new THREE.Sprite(new THREE.SpriteMaterial({map:coronaTex(255,176,96),color:0xffb060,transparent:true,opacity:0.85,depthWrite:false,blending:THREE.AdditiveBlending}));
  cor.scale.set(radius*5.2,radius*5.2,1);grp.add(cor);
  return {grp,core,photoMat,chromo,cor};
}

// straight downward neutrino rain builder (returns update fn)
function makeRain(N,seed,color,size,spanX,spanY,spanZ){
  const pr=mulberry32(seed);
  const pos=new Float32Array(N*3);const ph=new Float32Array(N);const spd=new Float32Array(N);
  for(let i=0;i<N;i++){
    pos[i*3]=(pr()-0.5)*spanX;pos[i*3+1]=(pr()-0.5)*spanY;pos[i*3+2]=(pr()-0.5)*spanZ;
    ph[i]=pr()*spanY;spd[i]=0.7+pr()*0.6;
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const mat=new THREE.PointsMaterial({map:color,size:size,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,opacity:0.85});
  const pts=new THREE.Points(g,mat);
  return {pts,pos,ph,spd,N,spanY,base:pos.slice()};
}
function updateRain(r,t,fall,dirY){
  const arr=r.pts.geometry.attributes.position.array;dirY=dirY||-1;
  const half=r.spanY*0.5;
  for(let i=0;i<r.N;i++){
    let y=r.base[i*3+1]+dirY*(((t*fall*r.spd[i]+r.ph[i])%r.spanY));
    y=((y+half)%r.spanY+r.spanY)%r.spanY-half;
    arr[i*3]=r.base[i*3];arr[i*3+1]=y;arr[i*3+2]=r.base[i*3+2];
  }
  r.pts.geometry.attributes.position.needsUpdate=true;
}

// ============================================================
//  MAIN renderAtTime(t) — deterministic
// ============================================================
function renderAtTime(t){
  gA.visible=inSc(t,'A');gB.visible=inSc(t,'B');gC.visible=inSc(t,'C');gD.visible=inSc(t,'D');
  gE.visible=inSc(t,'E');gF.visible=inSc(t,'F');gG.visible=inSc(t,'G');gH.visible=inSc(t,'H');
  gI.visible=inSc(t,'I');gJ.visible=inSc(t,'J');gK.visible=inSc(t,'K');gL.visible=inSc(t,'L');
  gM.visible=inSc(t,'M');

  stars.rotation.y=t*0.0015;stars.rotation.x=Math.sin(t*0.02)*0.02;
  let starOp=0.75;
  if(inSc(t,'A')||inSc(t,'M'))starOp=0.5;
  else if(inSc(t,'C')||inSc(t,'F')||inSc(t,'G')||inSc(t,'H')||inSc(t,'I'))starOp=0.25;
  else if(inSc(t,'J')||inSc(t,'L'))starOp=0.85;
  stars.material.uniforms.uOp.value=starOp;
  mwSprite.material.opacity=0.15*starOp;

  let flash=0.0;
  key.intensity=1.05;

  try{
  // ---------------- A: intro ----------------
  if(gA.visible){
    const d=gA.userData;
    d.head.rotation.y=Math.sin(t*0.15)*0.05;
    const rainOn=smooth(clamp((t-5)/6,0,1));
    d.rain.pts.material.opacity=0.15+0.65*rainOn;
    updateRain(d.rain,t,2.6,-1);
    d.rimGlow.material.opacity=0.06+0.05*Math.sin(t*0.4);
    const p=loc(t,'A');
    setCam(Math.sin(t*0.04)*1.2,0.6,12-p*3.5,0,0.4,0,44);
  }

  // ---------------- B: name / sun / earth / night ----------------
  if(gB.visible){
    const d=gB.userData;
    const nameP=t<50.54;
    const sunP=t>=50.54&&t<65.15;
    const flipP=t>=65.15&&t<72.98;
    const nightP=t>=72.98&&t<92.13;
    const glassP=t>=92.13;
    d.ghostGrp.visible=nameP;
    d.sun.grp.visible=sunP;d.streamB.pts.visible=sunP;
    d.earthGrp.visible=flipP||nightP||glassP;
    d.streamE.pts.visible=flipP||nightP||glassP;
    d.lbl12k.visible=nightP;
    if(nameP){
      d.ghost.material.opacity=0.6+0.25*Math.sin(t*3.0);
      d.ghostHalo.material.opacity=0.5+0.2*Math.sin(t*2.0);
      d.ghostGrp.position.set(Math.sin(t*0.5)*0.3,Math.sin(t*0.7)*0.2,0);
      setCam(0,0,8,0,0,0,44);
    }
    if(sunP){
      d.sun.photoMat.uniforms.uT.value=t;d.sun.core.rotation.y=t*0.02;
      d.sun.grp.position.set(-4,1.5,-2);d.sun.grp.scale.setScalar(1.0);
      d.streamB.pts.rotation.z=-0.55;d.streamB.pts.position.set(-1,0,0);
      d.streamB.pts.material.opacity=0.8;updateRain(d.streamB,t,3.5,-1);
      key.intensity=0.5;
      setCam(0,0,13,-1,0.5,0,46);
    }
    if(flipP||nightP||glassP){
      d.earth.rotation.y=t*0.04;d.cloud.rotation.y=t*0.05;
      let glass=glassP?smooth((t-92.13)/6):0;
      d.earth.material.opacity=1-glass*0.7;d.earth.material.transparent=glass>0.01;
      d.cloud.material.opacity=0.45*(1-glass);d.atmo.material.opacity=0.9*(1-glass*0.5);
      d.earthGrp.scale.setScalar(1.0);
      d.streamE.pts.material.opacity=0.75;updateRain(d.streamE,t,3.2,-1);
      key.intensity=nightP?0.45:0.65;
      const p=nightP?smooth((t-72.98)/19):(glassP?0.6:0.3);
      setCam(Math.sin(t*0.05+p*2)*4,1.5,13,0,0,0,46);
    }
  }

  // ---------------- C: sun core ----------------
  if(gC.visible){
    const d=gC.userData;
    d.core.photoMat.uniforms.uT.value=t;d.core.core.rotation.y=t*0.015;
    d.core.cor.material.opacity=0.4;
    const fusionP=t<146.6;
    const lightP=t>=146.6&&t<167.09;
    const neuP=t>=167.09;
    d.flashes.forEach((m)=>{const ph=m.userData.ph;const pulse=Math.max(0,Math.sin(t*1.5+ph));
      m.position.set(Math.cos(m.userData.a+t*0.1)*m.userData.r,Math.sin(m.userData.a+t*0.1)*m.userData.r,m.userData.z);
      m.material.opacity=fusionP?pulse*0.9:pulse*0.3;m.scale.setScalar(0.6+pulse*0.8);});
    d.zline.visible=lightP;d.photon.visible=lightP;d.lblLight.visible=lightP;
    if(lightP){
      d.zline.material.opacity=0.7;
      const prog=smooth((t-146.6)/20);const idx=Math.floor(prog*(d.zpts.length-1));
      const pt=d.zpts[Math.min(idx,d.zpts.length-1)];d.photon.position.copy(pt);
    }
    d.nline.visible=neuP;d.neu.visible=neuP;d.lblNeu.visible=neuP;
    if(neuP){
      d.nline.material.opacity=0.85;
      const prog=(((t-167.09)*0.5)%1);d.neu.position.set(prog*11,prog*3.2,0);
    }
    const p=loc(t,'C');
    setCam(Math.sin(t*0.03)*2,1,16-p*3,0,0.5,0,48);
  }

  // ---------------- D: forces / weak / gaps / lead wall ----------------
  if(gD.visible){
    const d=gD.userData;
    const forceP=t<217.78;
    const weakP=t>=217.78&&t<232.49;
    const gapP=t>=232.49&&t<247.96;
    const wallP=t>=247.96;
    d.neuGrp.visible=forceP;d.forces.visible=forceP;
    d.nucGrp.visible=weakP;d.passStream.pts.visible=weakP;d.lblWeak.visible=weakP;
    d.lattice.visible=gapP;d.gapStream.pts.visible=gapP;d.lblGap.visible=gapP;
    d.wallGrp.visible=wallP;d.wallStream.pts.visible=wallP;d.lblWall.visible=wallP;
    d.lblHalf.visible=wallP&&t>=263.69;
    if(forceP){
      d.neuGrp.position.set(Math.sin(t*0.4)*0.2,0,0);
      d.forces.rotation.z=t*0.05;
      const fade=smooth(clamp((t-207.5)/6,0,1));
      d.flabels[0].material.opacity=1-fade*0.7;d.flabels[1].material.opacity=1-fade*0.7;
      d.flabels[3].material.opacity=1;d.flabels[2].material.opacity=0.5;
      setCam(0,0,11,0,0,0,50);
    }
    if(weakP){
      d.nucleus.rotation.y=t*0.5;
      d.passStream.pts.material.opacity=0.7;updateRain(d.passStream,t,3.0,-1);
      d.passStream.pts.rotation.z=1.57;
      const hit=Math.max(0,Math.sin(t*1.2)*Math.sin(t*1.2)*Math.sin(t*0.31));
      d.hitFlash.material.opacity=hit*0.9;d.hitFlash.scale.setScalar(1.5+hit*2);
      setCam(0,0,7,0,0,0,46);
    }
    if(gapP){
      d.gapStream.pts.material.opacity=0.7;updateRain(d.gapStream,t,3.0,-1);d.gapStream.pts.rotation.z=1.57;
      const p=smooth((t-232.49)/15);d.lattice.scale.setScalar(1+p*0.5);
      setCam(0,0,9,0,0,0,48);
    }
    if(wallP){
      d.wall.material.emissiveIntensity=0.2;
      d.wallStream.pts.material.opacity=0.75;updateRain(d.wallStream,t,3.2,-1);d.wallStream.pts.rotation.z=1.57;
      const p=smooth((t-247.96)/16);
      setCam(Math.sin(t*0.05)*2,0,12+p*3,0,0,0,48);
    }
  }

  // ---------------- E: honest messenger ----------------
  if(gE.visible){
    const d=gE.userData;
    d.sun.photoMat.uniforms.uT.value=t;d.sun.core.rotation.y=t*0.02;d.sun.cor.material.opacity=0.5;
    d.sun.grp.position.set(0,1.5,-2);
    d.beam.pts.material.opacity=0.8;updateRain(d.beam,t,3.8,-1);d.beam.pts.rotation.z=-0.5;d.beam.pts.position.set(0,0,0);
    d.halo.material.opacity=0.25+0.1*Math.sin(t*0.6);d.halo.position.set(0,1.5,-2);
    const p=loc(t,'E');
    setCam(Math.sin(t*0.04)*1.5,0.8,12-p*2,0,0.5,0,46);
  }

  // ---------------- F: detector ----------------
  if(gF.visible){
    const d=gF.userData;
    const digP=t<335.22;
    const buildP=t>=335.22&&t<356.05;
    const tankP=t>=356.05&&t<374.24;
    const ringP=t>=374.24&&t<393.26;
    const dirP=t>=393.26;
    d.rockGrp.visible=buildP;
    d.block.visible=digP;d.blockStream.pts.visible=digP;
    d.tank.visible=tankP||ringP||dirP;
    d.lblSK.visible=tankP;
    d.arrow.visible=dirP;
    if(digP){
      d.blockStream.pts.material.opacity=0.7;updateRain(d.blockStream,t,3.0,-1);
      d.block.rotation.y=t*0.06;
      setCam(Math.sin(t*0.04)*2,0,11,0,0,0,48);
    }
    if(buildP){
      d.rockGrp.rotation.y=Math.sin(t*0.02)*0.1;
      setCam(0,1,13,0,1,0,48);
    }
    if(tankP||ringP||dirP){
      d.tank.rotation.y=t*0.05;
      const ringOn=ringP||dirP;
      if(ringOn){
        const cyc=((t-374.24)*0.5)%1;
        const inner=0.1+cyc*3.8,outer=inner+0.35;
        d.ring.geometry.dispose();d.ring.geometry=new THREE.RingGeometry(inner,outer,64);
        d.ring.material.opacity=0.8*(1-cyc);
        d.hit.material.opacity=Math.max(0,1-cyc*4)*0.9;d.hit.scale.setScalar(1+cyc*1.5);
        d.pmts.forEach(m=>{const lit=(inner*1.05>3.7)?Math.max(0,1-Math.abs(m.position.y-0)/3):0;
          m.material.emissiveIntensity=0.3+lit*1.2;m.material.emissive.setHex(lit>0.3?0x1a5a6a:0x101820);});
      }else{
        d.ring.material.opacity=0;d.hit.material.opacity=0;
        d.pmts.forEach(m=>{m.material.emissiveIntensity=0.3;});
      }
      setCam(Math.sin(t*0.06)*1.5,0.4,7.5,0,0,0,52);
    }
  }

  // ---------------- G: problem graph ----------------
  if(gG.visible){
    const d=gG.userData;
    const grow=smooth(clamp((t-421.83)/6,0,1));
    const missOn=smooth(clamp((t-439.92)/4,0,1));
    d.barMe.scale.y=0.15+grow*0.85;d.barMe.position.y=(1.67*d.barMe.scale.y)/2;
    d.miss.material.opacity=missOn*0.5;
    d.miss.position.y=1.67+(3.33/2);
    d.lblProb.visible=missOn>0.3;
    setCam(Math.sin(t*0.03)*1,1.5,12,0,1.5,0,48);
  }

  // ---------------- H: flavors / oscillation / solved ----------------
  if(gH.visible){
    const d=gH.userData;
    const disgP=t<465.79;
    const threeP=t>=465.79&&t<488.59;
    const oscP=t>=488.59&&t<511.37;
    const solvedP=t>=511.37;
    d.oscGrp.visible=disgP||oscP;
    d.flavGrp.visible=threeP;
    d.waveGrp.visible=oscP;d.lblOsc.visible=oscP;
    d.solved.visible=solvedP;
    if(disgP){
      const sh=0.5+0.5*Math.sin((t-456.3)*1.2);
      const c=new THREE.Color(0x8fe3ff).lerp(new THREE.Color(0xb57bff),sh);
      d.osc.material.color.copy(c);d.oscHalo.material.color.copy(c);
      d.oscGrp.position.set(Math.sin(t*0.4)*0.3,0.5,0);
      setCam(0,0,7,0,0.5,0,46);
    }
    if(threeP){
      d.flav.forEach((f,i)=>{f.g.position.y=0.5+Math.sin(t*1.0+i*2)*0.15;
        f.halo.material.opacity=0.4+0.2*Math.sin(t*1.5+i);
        f.b.material.transparent=true;
        f.b.material.opacity=(i===0)?1:(t>481.24?0.5:1);});
      setCam(Math.sin(t*0.03)*1,0.5,11,0,0.5,0,48);
    }
    if(oscP){
      const prog=((t-488.59)/22.78);
      const px=-5.5+prog*11;
      const phase=prog*6.283*2;
      const w0=Math.max(0,Math.cos(phase));const w1=Math.max(0,Math.cos(phase-2.09));const w2=Math.max(0,Math.cos(phase-4.19));
      const c=new THREE.Color(0x8fe3ff).multiplyScalar(w0).add(new THREE.Color(0xb57bff).multiplyScalar(w1)).add(new THREE.Color(0xff8fa3).multiplyScalar(w2));
      const mx=Math.max(w0,w1,w2)||1;c.multiplyScalar(1/mx);
      d.osc.material.color.copy(c);d.oscHalo.material.color.copy(c);
      d.oscGrp.position.set(px,2.4,0);
      d.waves.forEach((w,wi)=>{const arr=w.ln.geometry.attributes.position.array;
        for(let x=0;x<w.pts.length;x++){const xx=x/(w.pts.length-1);
          const ph2=xx*6.283*2-wi*2.09;arr[x*3+1]=-3+Math.max(0,Math.cos(ph2))*1.6+wi*0.05;}
        w.ln.geometry.attributes.position.needsUpdate=true;});
      setCam(0,0.5,11,0,0,0,50);
    }
    if(solvedP){
      const fill=smooth(clamp((t-511.37)/8,0,1));
      d.sM.scale.y=fill;d.sM.position.y=1.67+(1.67*fill)/2;
      d.sT.scale.y=fill;d.sT.position.y=1.67+1.67+(1.67*fill)/2;
      d.lblSolved.visible=fill>0.5;
      setCam(Math.sin(t*0.03)*1,1.8,12,0,1.8,0,48);
    }
  }

  // ---------------- I: mass / Nobel ----------------
  if(gI.visible){
    const d=gI.userData;
    const nobelP=t>=550.24;
    const rise=smooth(clamp((t-534.57)/8,0,1));
    d.massBar.scale.y=1+rise*6;d.massBar.position.y=-1.9+(0.1*d.massBar.scale.y)/2;
    d.lblTiny.visible=rise>0.6;
    d.medal.visible=nobelP;d.lblNobel.visible=nobelP;
    if(nobelP){const g=smooth((t-559.45)/4);d.medalGlow.material.opacity=g*(0.5+0.2*Math.sin(t*0.8));d.medal.rotation.z=Math.sin(t*0.3)*0.1;}
    else d.medalGlow.material.opacity=0;
    setCam(Math.sin(t*0.03)*1,0.3,12,0,0.3,0,48);
  }

  // ---------------- J: supernova ----------------
  if(gJ.visible){
    const d=gJ.userData;
    d.star.photoMat.uniforms.uT.value=t;d.star.core.rotation.y=t*0.03;
    const introP=t<584.83;
    const blastP=t>=584.83&&t<603.1;
    const snP=t>=603.1;
    d.star.grp.visible=introP||blastP;
    d.flood.pts.visible=blastP||snP;
    d.blast.visible=blastP;
    d.lbl.visible=snP;
    if(introP){d.star.grp.scale.setScalar(0.4);d.star.cor.material.opacity=0.3;setCam(Math.sin(t*0.03)*2,0,20,0,0,0,46);}
    if(blastP){
      const bp=smooth((t-584.83)/8);
      d.star.grp.scale.setScalar(0.4+bp*0.3);
      d.blast.material.opacity=0.3+0.7*Math.sin(bp*Math.PI);d.blast.scale.setScalar(4+bp*14);
      flash=Math.max(0,Math.sin(bp*Math.PI))*0.25;
      d.flood.pts.material.opacity=0.85*bp;updateRain(d.flood,t,4.5,-1);
      setCam(0,0,16,0,0,0,50);
    }
    if(snP){
      d.flood.pts.material.opacity=0.6;updateRain(d.flood,t,4.0,-1);
      const p=smooth((t-603.1)/14);
      setCam(Math.sin(t*0.04)*3,1,18+p*6,0,0,0,48);
    }
  }

  // ---------------- K: race ----------------
  if(gK.visible){
    const d=gK.userData;
    const raceP=t<645.97;
    const countP=t>=645.97;
    d.nR.visible=raceP;d.lR.visible=raceP;d.lblN.visible=raceP;d.lblL.visible=raceP;
    d.lblEarly.visible=raceP&&t>=627.81;
    d.flashGrp.visible=countP;d.lblCount.visible=countP;
    if(raceP){
      const p=smooth(clamp((t-620.43)/22,0,1));
      d.nR.position.x=-5.5+p*11;
      d.lR.position.x=-5.5+p*11*0.75;
      setCam(0,0,12,0,0,0,48);
    }
    if(countP){
      d.cflash.forEach(s=>{const appear=smooth(clamp(((t-645.97)-s.userData.tt*3)/0.4,0,1));
        const flick=0.5+0.5*Math.sin(t*3+s.userData.ph*6.283);
        s.material.opacity=appear*flick*0.9;s.scale.setScalar(0.5+appear*0.5);});
      setCam(Math.sin(t*0.05)*1.5,0,11,0,0,0,50);
    }
  }

  // ---------------- L: big bang / cosmic background ----------------
  if(gL.visible){
    const d=gL.userData;
    const bbP=t>=676.06&&t<695.56;
    const bgP=t>=695.56;
    d.fire.grp.visible=bbP;
    d.trapLine.visible=bbP;d.freeStream.pts.visible=bbP;d.lblBB.visible=bbP;
    d.bg.pts.visible=bgP;d.lblBG.visible=bgP;
    if(t<676.06){setCam(Math.sin(t*0.03)*3,0,22-(t-664.14)*0.5,0,0,0,46);}
    if(bbP){
      d.fire.photoMat.uniforms.uT.value=t;d.fire.core.rotation.y=t*0.02;d.fire.cor.material.opacity=0.4;
      d.fire.grp.scale.setScalar(0.9+0.1*Math.sin(t*0.5));
      d.trapLine.material.opacity=0.6;
      d.freeStream.pts.material.opacity=0.8;updateRain(d.freeStream,t,3.5,-1);d.freeStream.pts.position.set(5,0,0);
      flash=Math.max(0,Math.sin((t-676.06)/4*Math.PI))*0.12;
      setCam(0,0,14,0,0,0,50);
    }
    if(bgP){
      d.bg.pts.material.opacity=0.5;updateRain(d.bg,t,0.6,-1);
      const p=smooth((t-695.56)/15);
      setCam(Math.sin(t*0.04)*2,0,15+p*2,0,0,0,50);
    }
  }

  // ---------------- M: closing ----------------
  if(gM.visible){
    const d=gM.userData;
    d.head.rotation.y=Math.sin(t*0.12)*0.05;
    const threeP=t>=744.88&&t<762.65;
    const galaxyP=t>=762.65;
    updateRain(d.rainSun,t,2.6,-1);
    d.rainSun.pts.material.opacity=0.7;
    const srcOn=smooth(clamp((t-744.88)/3,0,1));
    d.rainStar.pts.visible=threeP||galaxyP;d.rainAnc.pts.visible=threeP||galaxyP;
    if(threeP||galaxyP){updateRain(d.rainStar,t,2.2,-1);updateRain(d.rainAnc,t,1.8,-1);
      d.rainStar.pts.material.opacity=0.55*srcOn;d.rainAnc.pts.material.opacity=0.4*srcOn;}
    const galOn=smooth(clamp((t-762.65)/4,0,1));
    d.inner.material.opacity=galOn*0.5*(0.7+0.3*Math.sin(t*0.4));
    const p=loc(t,'M');
    setCam(Math.sin(t*0.03)*1,0.6,11-p*1.5,0,0.4,0,44);
  }
  }catch(err){var ed=document.getElementById('err');if(ed){ed.style.display='block';ed.textContent='SCENE ERR @t='+t.toFixed(1)+': '+(err&&err.message||err);}}

  // ---------------- global fades ----------------
  let fade=1.0;
  fade*=smooth(clamp(t/3.5,0,1));
  fade*=smooth(clamp((TOTAL-t)/4.5,0,1));

  lens.uniforms.uT.value=t;
  lens.uniforms.uFade.value=fade;
  lens.uniforms.uFlash.value=flash;
  const fiery=inSc(t,'C')||inSc(t,'E')||(inSc(t,'J')&&t>=584.83)||(inSc(t,'L')&&t>=676.06&&t<695.56);
  bloom.strength=fiery?1.2:0.9;

  updateText(t);
  composer.render();
}

// subtitle / chapter lookup
let _lastSub=-1,_lastChap='';
function updateText(t){
  let idx=0;for(let i=0;i<CUES.length;i++){if(CUES[i].t<=t+1e-6)idx=i;else break;}
  const cur=CUES[idx];
  if(idx!==_lastSub){document.getElementById('sub').textContent=cur?cur.s:'';_lastSub=idx;}
  let chT=-1,chS='';for(const c of CUES){if(c.ch&&c.t<=t){chT=c.t;chS=c.ch;}}
  const chapEl=document.getElementById('chap');
  if(chS!==_lastChap){chapEl.textContent=chS;_lastChap=chS;}
  const op=chT>=0?smooth(clamp((t-chT)/0.8,0,1))*smooth(clamp((chT+4.5-t)/1.2,0,1)):0;
  chapEl.style.opacity=op;
  document.getElementById('sub').style.opacity=1;
}

// ============================================================
//  GSAP timeline (paused) — deterministic driver
// ============================================================
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});
const clk={t:0};
tl.to(clk,{t:TOTAL,duration:TOTAL,ease:"none",onUpdate:()=>renderAtTime(clk.t)},0);
window.__timelines["hat-neutrino"]=tl;

// initial render
renderAtTime(0);
</script>
