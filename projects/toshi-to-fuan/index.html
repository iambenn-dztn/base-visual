/** nhãn nguồn/nhãn chữ trong TERR bám THEO CAMERA: đặt ở góc dưới-phải khung.
 * Gọi SAU khi camera đã đặt xong. off = [ngang, dọc] theo tỉ lệ khung. */
/** Ghim một nhãn vào KHUNG HÌNH ở toạ độ tỉ lệ (offX, offY) ∈ [-1,1], và đặt
 * kích thước theo CHIỀU CAO PIXEL MONG MUỐN trên màn 1080p — không theo mét.
 *
 * ⚠ Bài học từ vòng snapshot đầu: nhãn dựng bằng textPlane(txt, hGlyph) có chiều
 * cao CỐ ĐỊNH TÍNH BẰNG MÉT. Ghim nó ở d = 26m thì nó cao 1,28m trên màn hình
 * ở khoảng cách đó, tức chữ "Death Studies 31(6)" trải KÍN CẢ KHUNG. Ba cổng
 * lint/validate/inspect vẫn pass sạch — chỉ nhìn ảnh mới thấy.
 * Cách đúng: quy từ pixel ra mét TẠI khoảng cách ghim.
 *   hWorld = pxWanted/1080 * 2*tan(fov/2)*d
 * rồi chia cho glyphFrac vì scale của plane tính trên TOÀN canvas, không chỉ glyph.
 */
function pinToCamera(obj, offX, offY, distM, pxWanted){
  var d = distM || 14.0;
  var fovR = camera.fov*Math.PI/180;
  var hH = Math.tan(fovR/2)*d;              // nửa chiều cao khung ở khoảng cách d
  var hW = hH*camera.aspect;
  var fwd = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
  var rgt = new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
  var upv = new THREE.Vector3(0,1,0).applyQuaternion(camera.quaternion);
  var p = camera.position.clone()
    .add(fwd.multiplyScalar(d))
    .add(rgt.multiplyScalar(offX*hW))
    .add(upv.multiplyScalar(offY*hH));
  /* obj là con của VEX_FREE (bên trong TERR). VEX_FREE có scale.y = 1/VEX và
   * TERR có scale.y = VEX, nên tích = 1: toạ độ Y cục bộ vẫn là mét thật, chỉ
   * cần trừ offset world của TERR. ⚠ Nếu đổi cha, kiểm lại chỗ này. */
  obj.position.copy(p).sub(TERR.position);
  obj.position.y = obj.position.y*VEX;     /* bù scale 1/VEX của VEX_FREE */
  obj.quaternion.copy(camera.quaternion);
  if(pxWanted){
    /* chiều cao GLYPH mong muốn tính bằng mét ở khoảng cách d */
    var hGlyphWorld = (pxWanted/H)*(2*hH);
    /* plane được dựng với hGlyph = userData.mk[1] → scale bù về đúng cỡ */
    obj.scale.setScalar(hGlyphWorld/obj.userData.mk[1]);
  }
}

/* ==========================================================================
 * 第1章 — 午前三時 (S01–S08)
 *
 * QUY ƯỚC CỨNG: camera ở ĐÚNG vị trí mắt người nằm ngửa (cao 0,45m, ngẩng 62°,
 * 28mm). Không bao giờ rời vị trí đó, trừ shot xe (S06–S07).
 * MỘT NGUỒN SÁNG DUY NHẤT: đèn đường ngoài cửa sổ. Không đèn trần, không đèn ngủ.
 * LỐI RA BẰNG ÁNH SÁNG: không khung nào đen tuyệt đối quá 2s.
 * ========================================================================== */

/* S01 · C01–C02 · 0–6,5s — THẺ CHƯƠNG 1. Đen gần hoàn toàn, mắt quen dần. */
function sc_S01(t){
  var u = loc(t,'S01');
  showGroup('ROOM');
  camAnchor(0,0,0,0,F28);
  /* 0s đen (chỉ nhiễu phim rất nhẹ của lens pass) · 3s trần lộ dần */
  var reveal = ramp(u, 0.6, 5.2);
  shaftUni.uInt.value = 0.16*reveal;          // vệt rất mờ hé ở mép trên khung
  CEIL_BAND.material.uniforms.uInt.value = 0.42*reveal;
  shaftSpot.intensity = 0.30 + 1.05*reveal;
  roomAmb.intensity = 0.05 + 0.13*reveal;
  bounceLight.intensity = 0.04 + 0.07*reveal;
  /* 8s LED đỏ hiện — S01 chỉ dài 6,5s nên LED bắt đầu nhú ở 4,2s và đầy ở S02.
   * Cường độ 0,22: đọc được nhưng không chói. */
  setClock(3, 0, 0.22*ramp(u, 4.2, 6.5), 0.42, 0.0);
  dustUni.uOp.value = 0.0;
}

/* S02 · C02–C03 · 6,5–28,77s — GÓC MÁY MỎ NEO · NGUỒN THUMBNAIL.
 * ⚠ ĐÚNG y hệt S01, không nhúc nhích. S32/S34 phải khớp từng độ với shot này. */
function sc_S02(t){
  var u = loc(t,'S02');
  showGroup('ROOM');
  camAnchor(0,0,0,0,F28);
  /* 0s dải mờ cường độ 0,3 · 7s đạt đầy 1,0 */
  var up = lerp(0.30, 1.00, ramp(u, 0.0, 7.0));
  /* 14s rèm LAY RẤT CHẬM (biên độ 1,2cm, chu kỳ 6,5s) → dải HẸP LẠI RỒI NỞ
   * đúng một nhịp. Hàm thuần của t. */
  var sway = (u > 13.0) ? Math.sin((u-13.0)*2*Math.PI/6.5) : 0;
  var swayK = (u > 13.0) ? clamp((u-13.0)/1.4, 0, 1)*clamp((26.0-u)/2.0, 0, 1) : 0;
  shaftUni.uWidth.value = 0.055*(1 - 0.24*sway*swayK);
  shaftUni.uInt.value = up*(1 + 0.10*sway*swayK);
  shaftSpot.intensity = 3.4*up;
  /* vết dải trên trần: bề rộng 11cm, HẸP LẠI RỒI NỞ theo nhịp rèm */
  CEIL_BAND.material.uniforms.uInt.value = up*(1 + 0.10*sway*swayK);
  CEIL_BAND.material.uniforms.uW.value = 0.11*(1 - 0.24*sway*swayK);
  /* 7s hạt bụi thành nhìn thấy được */
  dustUni.uOp.value = 0.52*ramp(u, 4.0, 9.0);
  /* 21s độ trong không khí tăng nhẹ → thấy thêm chiều sâu phòng ở rìa khung */
  var clarity = ramp(u, 19.0, 22.3);
  roomAmb.intensity = 0.18 + 0.055*clarity;
  bounceLight.intensity = 0.11 + 0.07*clarity;
  setClock(3, 0, 0.22, 0.42, 0.0);
}

/* S03 · C04–C05 · 28,77–37,5s — dolly-back cực chậm 0,35m, KHÔNG zoom.
 * Chủ thể dịch từ giữa khung sang 1/3 trên-trái — ĐỔI BỐ CỤC so với S02. */
function sc_S03(t){
  var u = loc(t,'S03'), d = dur('S03');
  showGroup('ROOM');
  /* dolly-back 0,35m dọc trục nhìn + pan nhẹ để dải sáng dịch sang trên-trái */
  var p = ease(clamp(u/(d*0.94), 0, 1));
  camAnchor(-4.0*p, 11.0*p, 0, 0.35*p, F28);
  shaftUni.uInt.value = 1.00;
  /* tổng cường độ TĂNG 8% so với S02 (mắt đã quen tối). Giữ 4.100K. */
  shaftSpot.intensity = 3.4*1.08;
  CEIL_BAND.material.uniforms.uInt.value = 1.08;
  /* 12s vệt sáng thứ hai rất yếu (phản xạ gián tiếp từ sàn) → tường đối diện
   * hiện mờ: CHỨNG MINH phòng có không gian, không phải hộp đen */
  bounceLight.intensity = 0.11 + 0.26*ramp(u, 4.0, 8.4);
  roomAmb.intensity = 0.20*1.08;
  /* 18s hạt bụi trôi qua điểm sáng nhất */
  dustUni.uOp.value = 0.52 + 0.16*ramp(u, 5.6, 8.0);
  setClock(3, 0, 0.20, 0.40, 0.0);
}

/* S04 · C05–C07 · 37,5–61,8s — CẬN ĐỒNG HỒ LED, 85mm, DOF rất nông f/1.8.
 * Chủ thể lệch HẲN sang PHẢI khung, 2/3 trái là bóng tối CÓ KẾT CẤU. */
function sc_S04(t){
  var u = loc(t,'S04');
  showGroup('ROOM');
  /* camera đặt NGANG mặt đồng hồ (thấp), nhìn vào mặt LED. Đồng hồ ở world
   * (1.05, 0.546, -1.02) quay -0.55 rad → mặt LED hướng ra khoảng (-sin,0,cos). */
  var cz = -1.02 + Math.cos(-0.55)*0.62;
  var cx = 1.05 - Math.sin(-0.55)*0.62;
  /* đặt camera lệch sang TRÁI của mặt đồng hồ → đồng hồ nằm ở PHẢI khung */
  camSet(cx - 0.20, 0.556, cz + 0.055,  1.05 - 0.20*0.32, 0.548, -1.02, F85);
  /* LED nhìn gần: thấy cấu trúc từng đoạn + lớp khuếch tán nhựa đỏ phía trước.
   * 0s 3:00 · 14s đổi sang 3:01 — hàm thuần của t, KHÔNG Date.now. */
  var mm = (u >= 14.0) ? 1 : 0;
  /* 20s bloom co lại 15% (mắt đang điều tiết dần, đọc rõ hơn) */
  var halo = 1.0 - 0.15*ramp(u, 18.0, 22.5);
  setClock(3, mm, 0.30, 0.95*halo, 0.34);
  /* phòng quanh vẫn có ánh sáng — LỐI RA, 2/3 trái là bóng tối CÓ KẾT CẤU */
  shaftUni.uInt.value = 0.42;
  shaftSpot.intensity = 3.0;
  CEIL_BAND.material.uniforms.uInt.value = 0.50;
  roomAmb.intensity = 0.15;
  bounceLight.intensity = 0.22;
  dustUni.uOp.value = 0.10;
}

/* S05 · C08–C11 · 61,8–99,5s — trở lại trần, GÓC CHÉO HƠN: đầu đã nghiêng
 * sang trái trên gối. roll 12° + pan trái 18°. Cỡ cảnh TOÀN (đổi so với cận S04). */
function sc_S05(t){
  var u = loc(t,'S05');
  showGroup('ROOM');
  camAnchor(0, -18.0, 12.0, 0, F28);
  shaftUni.uInt.value = 1.00;
  shaftSpot.intensity = 3.4;
  dustUni.uOp.value = 0.50;
  /* 8s một VỆT XE chạy ngoài đường QUÉT QUA dải sáng — cột sáng bùng 25% rồi
   * tắt trong 2,4s, hạt bụi lộ rõ trong khoảnh khắc đó.
   * ⚠ Đây là mốc thay đổi lớn nhất của shot, và là LỜI NHẮC "bên ngoài vẫn có
   * thế giới đang chạy" — cố ý, không phải trang trí. */
  var sweep = win(u, 8.0, 10.4, 0.9);
  shaftUni.uInt.value = 1.00 + 0.25*sweep;
  shaftSpot.intensity = 3.4*(1 + 0.25*sweep);
  CEIL_BAND.material.uniforms.uInt.value = 1.00 + 0.25*sweep;
  dustUni.uOp.value = 0.50 + 0.42*sweep;
  roomAmb.intensity = 0.20 + 0.08*sweep;
  /* 26s rèm lay một nhịp, dải hẹp lại rồi nở */
  var sway = (u > 25.0) ? Math.sin((u-25.0)*2*Math.PI/6.5) : 0;
  var swayK = (u > 25.0) ? clamp((u-25.0)/1.4, 0, 1)*clamp((36.0-u)/2.0, 0, 1) : 0;
  shaftUni.uWidth.value = 0.055*(1 - 0.22*sway*swayK);
  CEIL_BAND.material.uniforms.uW.value = 0.11*(1 - 0.22*sway*swayK);
  setClock(3, 0, 0.20, 0.40, 0.0);
}

/* S06 · C12–C13 · 99,5–121,19s — CẢNH XE (lần 1). Nhìn từ ghế lái qua kính lái.
 * Ghế phụ: CHỈ THẤY VAI VÀ MỘT BÀN TAY đặt trên đùi. KHÔNG thấy mặt ai. */
function sc_S06(t){
  var u = loc(t,'S06');
  showGroup('CAR');
  PASS.visible = true;
  /* rung theo mặt đường — biên độ 2mm, tần số 1,8Hz, HÀM SIN CỦA t.
   * ⚠ Đây KHÔNG phải rung máy ảo, là chuyển động vật lý của xe, giữ rất nhỏ. */
  var sh = 0.002*Math.sin(t*1.8*2*Math.PI);
  var sh2 = 0.0014*Math.sin(t*2.7*2*Math.PI + 1.1);
  /* mắt người lái, lệch phải 15cm để ghế phụ vào khung rìa phải */
  /* 14s DOF chuyển tiêu điểm chậm từ ngoài đường vào trong xe → dolly nhẹ vào */
  var focusIn = ramp(u, 13.0, 18.5);
  /* mắt người lái, hơi lệch PHẢI 15cm để ghế phụ vào RÌA PHẢI khung.
   * Camera lùi về z = +0.95 (sau vai người ghế phụ 0,79m) — ở 0,62m thì thân
   * người chiếm gần hết khung ở ống 40mm (snapshot 102s ra một mảng nâu phẳng). */
  /* 28mm ở đúng vị trí mắt người lái. Ống 40mm (bản đầu) làm tựa ghế và thân
   * người ghế phụ tràn khung — xem ghi chú ở đầu nhóm CAR. */
  /* camera ĐỨNG YÊN ở mắt người lái, chỉ QUAY sang phải và cúi xuống — đúng
   * động tác liếc sang ghế phụ. Điểm nhìn đi theo cung tròn bán kính 2,2m nên
   * hướng đổi mà vị trí không đổi (28mm, xem ghi chú đầu nhóm CAR). */
  var yaw6 = lerp(-1.5, 22.0, focusIn)*Math.PI/180;
  var pit6 = lerp(-0.4, -16.0, focusIn)*Math.PI/180;
  var R6 = 2.2;
  camSet(-0.42 + sh2, 1.19 + sh, CARZ + 0.22,
         -0.42 + Math.sin(yaw6)*R6, 1.19 + Math.tan(pit6)*R6,
         CARZ + 0.22 - Math.cos(yaw6)*R6, F28);
  driveStreet(t, 11.0);
  /* nắng chiều 3.400K từ trái-sau */
  carSun.intensity = 0.95; carSun.color.setHex(0xffd9a0);
  /* 7s NẮNG QUÉT QUA KÍNH BÊN khi xe rẽ nhẹ: mảng sáng vàng TRƯỢT NGANG táp-lô.
   * Bụi trong xe lộ ra trong luồng sáng — cùng nguyên lý tán xạ với light shaft. */
  var sweep = win(u, 6.2, 11.4, 1.4);
  carShaftUni.uInt.value = 0.80*sweep;
  carShaftUni.uT.value = t;
  dashPatch.material.opacity = 0.62*sweep;
  dashPatch.position.x = lerp(-0.62, 0.66, lin(u, 6.2, 11.4));
  wsFlare.material.opacity = 0.16 + 0.10*sweep;
  /* 22s tay hơi KHÉP LẠI một nhịp rồi buông — cử chỉ duy nhất, rất nhỏ */
  var cl = win(u, 21.0, 23.4, 0.7);
  var i;
  for(i=0;i<4;i++){
    var f = PASS.userData['f'+i];
    if(f) f.rotation.x = -0.34 - 0.40*cl;
  }
  setGrip(0.75);
}

/* S07 · C14–C15 · 121,19–130,37s — CẬN BÀN TAY NGƯỜI LÁI trên vô lăng, 85mm.
 * Tay ở 1/3 dưới-trái, phần còn lại là kính lái LOÁ NẮNG.
 * Tay giữ vô lăng HƠI CHẶT HƠN BÌNH THƯỜNG — khớp ngón trắng nhẹ. Đây là
 * 「うまく相槌が打てませんでした」 kể bằng hình, không cần chữ. */
function sc_S07(t){
  var u = loc(t,'S07');
  showGroup('CAR');
  var sh = 0.002*Math.sin(t*1.8*2*Math.PI);
  /* ⚠ THÔNG SỐ MỎ NEO S07 = S23 — lưu ở CAM_S07 để S23 dùng lại đúng từng số */
  camSet(CAM_S07[0], CAM_S07[1] + sh, CARZ + CAM_S07[2],
         CAM_S07[3], CAM_S07[4], CARZ + CAM_S07[5], F85);
  /* 13s xe CHẬM LẠI, cảnh ngoài kính trôi chậm dần rồi gần như dừng */
  var slow = 1.0 - 0.86*ramp(u, 12.0, 19.0);
  driveStreet(t, 9.0*slow + 0.6);
  /* 7s đèn tín hiệu phía trước đổi sang VÀNG — mảng loá trên kính đổi màu theo */
  var amber = ramp(u, 6.4, 8.6);
  STREET.userData.signal.material.opacity = 0.55*ramp(u, 2.0, 5.0);
  STREET.userData.signal.material.color.setRGB(lerp(0.20,1.0,amber), lerp(0.95,0.72,amber), lerp(0.42,0.12,amber));
  wsFlare.material.opacity = 0.34;
  wsFlare.material.color.setRGB(1.0, lerp(0.88,0.82,amber), lerp(0.66,0.54,amber));
  /* 20s nắng chiều đã thấp hơn một bậc, ẤM HƠN (3.200K) */
  var warm = ramp(u, 17.0, 23.0);
  carSun.color.setRGB(1.0, lerp(0.85,0.80,warm), lerp(0.63,0.52,warm));
  carSun.intensity = 0.95 - 0.10*warm;
  carAmb.intensity = 0.20 + 0.03*warm;
  /* 0s ngón cái gõ nhẹ MỘT NHỊP rồi thôi */
  var tap = win(u, 0.8, 2.0, 0.4);
  handR.thumb.rotation.y = -0.22*tap;      /* ngón cái gõ nhẹ MỘT NHỊP rồi thôi */
  /* tay giữ CHẶT hơn bình thường */
  setGrip(0.94);
}
/* ⚠ THÔNG SỐ MỎ NEO S07 = S23 — một nguồn sự thật, đừng gõ lại ở mỗi shot.
 * Bản đầu đặt camera cách tâm vô lăng 0,50m với ống 85mm: khung chỉ cao 14cm
 * nên vành tràn 147% chiều ngang và không thấy bàn tay (snapshot 127s ra một
 * khối tròn xám kín khung). 1,13m cho khung cao 32cm — tay chiếm ~28% chiều cao,
 * nằm ở 1/3 dưới-trái, phần còn lại là kính lái loá nắng. */
var CAM_S07 = [-0.055, 1.325, 0.545,  -0.335, 0.880, -0.360];

/* S08 · C15–C16 · 130,37–150,93s — ĐÓNG CHƯƠNG 1. ĐÚNG KHUNG S02, tĩnh tuyệt đối.
 * Lần thứ hai người xem thấy khung này, sẽ nhận ra. */
function sc_S08(t){
  var u = loc(t,'S08');
  showGroup('ROOM');
  camAnchor(0,0,0,0,F28);
  /* 8s đồng hồ đổi 3:01 → 3:14 (một cú nhảy — 30 phút của C06 đã trôi) */
  var mm = (u >= 8.0) ? 14 : 1;
  setClock(3, mm, 0.20, 0.40, 0.0);
  /* 16s dải sáng DỊCH XUỐNG 3cm trên trần: Trái Đất quay, đèn đường không đổi
   * nhưng góc bóng đổi. ⚠ Chuẩn bị cho 第4章 — dịch TIẾP CÙNG CHIỀU, không đảo. */
  var drop = 0.03*ramp(u, 14.0, 19.5);
  shaftUni.uOrigin.value.set(SHAFT_ORIGIN.x, SHAFT_ORIGIN.y - drop*1.6, SHAFT_ORIGIN.z - drop*0.9);
  shaftSpot.position.copy(shaftUni.uOrigin.value);
  shaftSpot.target.position.copy(shaftUni.uOrigin.value.clone().add(SHAFT_DIR.clone().multiplyScalar(4.0)));
  placeBand();
  /* 24s cường độ dải sáng GIẢM 12% (sương đêm dày lên) */
  var fade = 1.0 - 0.12*ramp(u, 20.0, 24.0);
  shaftUni.uInt.value = fade;
  shaftSpot.intensity = 3.4*fade;
  CEIL_BAND.material.uniforms.uInt.value = fade;
  dustUni.uOp.value = 0.48*fade;
  /* CUT: gap 1,5s cuối shot — dải sáng KÉO DÀI RA, DẸT XUỐNG và trở thành
   * ĐƯỜNG CHÂN TRỜI của địa hình ở S09. Chuyển hình học trực tiếp: nới uSpread
   * để dải bè ra thành một vạch ngang rộng. */
  var morph = ramp(u, dur('S08') - 3.4, dur('S08'));
  shaftUni.uSpread.value = 0.085 + 1.30*morph;
  shaftUni.uFall.value = 0.26 - 0.16*morph;
  shaftUni.uInt.value = fade*(1 - 0.30*morph);
  /* vết dải DẸT XUỐNG và KÉO DÀI RA → thành đường chân trời của S09 */
  CEIL_BAND.material.uniforms.uW.value = 0.11*(1 + 2.6*morph);
  CEIL_BAND.material.uniforms.uInt.value = fade*(1 - 0.45*morph);
}


/* ==========================================================================
 * 第2章 — 山のかたち (S09–S18) · CẢNH CHÍNH CỦA TẬP
 *
 * Camera đi bộ trên địa hình, thấp, tốc độ người đi (~1,3 m/s).
 * HEIGHT FOG theo cao độ: chỗ cao sương dày, chỗ thấp sương mỏng — LÝ DO VẬT LÝ
 * cho "xuống dốc thì nhìn xa được", và đó là NỘI DUNG.
 * ========================================================================== */

/** đặt sương theo cao độ camera + hệ số điều khiển của shot.
 * base = mật độ ở cao độ thấp; hiK = nhân thêm khi camera ở trên cao. */
function setMist(camY, base, hiK, partOp){
  /* cao độ chuẩn hoá 0–1 so với đỉnh 22m */
  var hn = clamp(camY/(H_SCALE*0.95), 0, 1);
  /* ⚠ tuyến tính, không sRGB — 0.80 ra trắng toát sau ACES (xem setSky) */
  scene.fog.color.setRGB(0.255, 0.270, 0.290);
  scene.fog.density = base*(1.0 + (hiK==null?1.5:hiK)*hn);
  MIST.material.uniforms.uOp.value = (partOp==null? 1.0 : partOp);
  MIST.material.uniforms.uT.value = 0;
}
/** camera ĐI BỘ dọc dải: đặt ở tuổi `age`, lệch ngang `x`, cao `eye` trên đất,
 *  chúi `pitch` độ, nhìn về phía tuổi lớn hơn (hoặc nhỏ hơn nếu back=true) */
function camWalk(age, x, eye, pitchDeg, mm, back, lookX){
  var z = ageToZ(age);
  var y = groundY(SHAPE_F, x, z) + eye;
  var dz = back ? -1 : 1;
  /* ⚠ KẸP 6°: bản đầu nhận 10–15° từ storyboard và ra ĐẤT KÍN KHUNG — ở tầm mắt
   * 1,6m trên dải rộng 10m, chúi 15° thì tia trung tâm chạm đất sau 4m, không còn
   * đường chân trời (snapshot 153s). Người đi bộ thật hạ mắt 3–6°. Storyboard ghi
   * "hơi chúi" là ý đồ bố cục, không phải số đo kỹ thuật. */
  var pit = -Math.min(6.0, pitchDeg)*Math.PI/180;
  var D = 26.0;                         // điểm nhìn xa → thấy được dốc phía trước
  var lz = z + dz*D;
  var ly = y + Math.tan(pit)*D;
  camSet(x, y, TZ + z, (lookX==null? x : lookX), ly, TZ + lz, mm || F35);
}

/* S09 · C17–C19 · 150,93–165,02s — THẺ CHƯƠNG 2.
 * Từ đường chân trời do dải sáng biến thành, sương dâng lên và địa hình lộ ra
 * dưới chân — nhưng CHỈ THẤY VÀI MÉT quanh mình. */
function sc_S09(t){
  var u = loc(t,'S09'), d = dur('S09');
  showGroup('TERR');
  /* bắt đầu ĐI TỚI RẤT CHẬM (0,6 m/s), ease-in từ đứng yên */
  var dist = 0.6*(u - 1.6*(1 - Math.exp(-u/1.6)));   // tích phân của ease-in, hàm thuần
  var age = 18.4 + dist/Z_PER_AGE;
  camWalk(age, 2.6, 1.60, 15.0, F35);
  /* 0s sương DÀY ĐẶC, tầm nhìn 4m · 6s mặt đất vào rõ */
  var clear = ramp(u, 1.0, 7.0);
  setMist(camera.position.y, 0.0165 - 0.0100*clear, 1.2, 0.70);
  terrKey.intensity = 2.25 + 0.95*clear;
  /* 12s hai bên lối đi hiện MÉP DỐC — ta đang trên một DẢI HẸP (~6m) */
  /* 28s cọc mốc 「18」 vào khung bên phải — S09 dài 14s nên cọc 18 hiện từ 9s */
  POSTS[18].visible = true;
  /* ánh sáng: khuếch tán toàn phần, KHÔNG có mặt trời nhìn thấy, xám 5.200K */
  terrKey.color.setHex(0xe4eaf2);
  terrAmb.intensity = 1.15;
}

/* S10 · C19–C20 · 165,02–175,48s — crane-up 1,6m → 12m + lùi 18m, 35→28mm.
 * Lần đầu thấy dải đất kéo dài về hai phía. Góc nhìn 3/4 sau, dải chạy chéo khung. */
function sc_S10(t){
  var u = loc(t,'S10'), d = dur('S10');
  showGroup('TERR');
  /* phóng đại trục tung tăng dần khi camera rời mặt đất — người xem đang chuyển
   * từ "đứng trong cảnh" sang "đọc hình dạng" (xem ghi chú ở setVEX) */
  var p = ease(clamp(u/(d*0.94), 0, 1));
  setVEX(lerp(1.0, 2.6, p));
  var age = 22.0;
  var z = ageToZ(age);
  var gy = groundY(SHAPE_F, 0, z)*VEX;
  var cy = lerp(groundY(SHAPE_F,0,z) + 1.60, gy + 16.0, p);
  var cz = z - lerp(0, 40.0, p);
  var cx = lerp(0.55, -16.0, p);
  camSet(cx, cy, TZ + cz,  1.2, gy*0.72, TZ + z + 30.0, lerp(F35, F28, p));
  /* 20s đạt độ cao 12m; SƯƠNG VẪN CHE PHẦN XA — chưa cho thấy hình dạng,
   * CỐ TÌNH giữ lại cho S12 */
  setMist(cy, 0.0062, 1.6, 0.46);
  terrKey.intensity = 3.20;
  /* 14s dòng nguồn mờ hiện góc dưới-phải, GIỮ TỚI HẾT CHƯƠNG */
  SRC_RUSSAC.material.opacity = 0.45*ramp(u, 4.4, 7.2);
  pinToCamera(SRC_RUSSAC, 0.30, -0.80, 16.0, 26);
  /* 26s một dải sáng mỏng quét dọc địa hình (mây cao trôi qua), lộ thoáng một
   * gờ cao ở xa. S10 dài 10,5s → đặt ở 8s */
  var cloud = win(u, 7.6, 10.2, 0.8);
  terrKey.intensity = 3.20 + 1.05*cloud;
  POSTS[18].visible = true; POSTS[20].visible = true;
}

/* S11 · C20–C21 · 175,48–186,58s — KỲ VỌNG SAI DỰNG THÀNH HÌNH.
 * Một đường thẳng dốc lên đều bay lơ lửng, rồi GÃY VỤN và RƠI theo trọng lực thật.
 * ⛔ Không animation "sai/đúng", không dấu X, không màu đỏ cảnh báo. */
function sc_S11(t){
  var u = loc(t,'S11');
  showGroup('TERR');
  GUESS.visible = true;
  /* tĩnh, nhìn ngang địa hình TỪ BÊN HÔNG (elevation view TRONG KHÔNG GIAN 3D —
   * vẫn thấy chiều sâu, sương, mặt đất có kết cấu), 50mm */
  var zc = ageToZ(52);
  setVEX(3.2);
  camSet(-118.0, H_SCALE*3.2*0.92, TZ + zc - 30.0,  0.0, H_SCALE*3.2*0.46, TZ + zc + 10.0, F50);
  setMist(H_SCALE*1.05, 0.0028, 0.9, 0.34);
  terrKey.intensity = 2.90;
  /* 0s đường vẽ từ trái dưới lên phải trên · 8s đường ĐẦY ĐỦ + nhãn bám đầu */
  var draw = lin(u, 0.0, 6.4);
  var i;
  /* 14s đường GÃY thành từng đoạn và các đoạn RƠI XUỐNG, tan vào sương trong 3s.
   * ⚠ Rơi theo TRỌNG LỰC THẬT (g = 9,8, hàm của t²), KHÔNG biến mất kiểu fade. */
  var tf = u - 9.6;
  for(i=0;i<guessSegs.length;i++){
    var s = guessSegs[i];
    var vis = clamp((draw*guessSegs.length - i)*1.4, 0, 1);
    var op = 0.88*vis;
    if(tf > 0){
      /* mỗi đoạn bắt đầu rơi lệch nhau chút (seeded) */
      var t0 = s.userData.seed*0.9;
      var tt = Math.max(0, tf - t0);
      var drop = 0.5*9.8*tt*tt;
      s.position.set(s.userData.home.x, s.userData.home.y - drop, s.userData.home.z);
      s.rotation.x = s.userData.rot0 + tt*(0.9 + s.userData.seed*1.6);
      s.rotation.z = tt*(0.5 + s.userData.seed);
      op = 0.88*vis*clamp(1 - tt/3.0, 0, 1);
    } else {
      s.position.copy(s.userData.home);
      s.rotation.x = s.userData.rot0; s.rotation.z = 0;
    }
    s.material.opacity = op;
  }
  GUESS.userData.lab.material.opacity = 0.80*ramp(u, 4.4, 6.8)*(1 - ramp(u, 9.2, 11.0));
  SRC_RUSSAC.material.opacity = 0.45;
  pinToCamera(SRC_RUSSAC, 0.30, -0.80, 22.0, 26);
  /* 20s chỉ còn địa hình thật, sương BẮT ĐẦU TỤT XUỐNG */
  POSTS[20].visible = true; POSTS[30].visible = true;
}

/* S12 · C21–C25 · 186,58–211,13s — ⭐ CAO TRÀO 1: ĐỊA HÌNH LỘ NGUYÊN HÌNH.
 * Sương tụt xuống hẳn và TOÀN BỘ dải đất hiện ra MỘT LẦN. Lần đầu người xem
 * thấy "đồ thị" là MỘT NƠI CHỐN. */
function sc_S12(t){
  var u = loc(t,'S12'), d = dur('S12');
  showGroup('TERR');
  /* bay dọc BÊN HÔNG dải đất, cao 25m, 28mm, tốc độ ĐỀU rất chậm (tuyến tính
   * của t, KHÔNG ease — để nhịp ổn định). Dải đất ở 1/3 dưới khung. */
  var p = clamp(u/d, 0, 1);
  var age = lerp(19.0, 46.0, p);
  var z = ageToZ(age);
  setVEX(3.2);
  camSet(-104.0, H_SCALE*3.2*1.00, TZ + z - 46.0,  0.0, H_SCALE*3.2*0.42, TZ + z + 62.0, F28);
  /* 0s sương ngang tầm dải đất · 6s SƯƠNG TỤT XUỐNG DƯỚI MÉP DỐC — cả hình dạng
   * lộ ra trong 2,5s. ⚠ Đây là mốc lớn nhất của shot. */
  var drop = ramp(u, 5.2, 8.0);
  setMist(H_SCALE*1.10, 0.0050 - 0.0040*drop, 0.7, 0.48 - 0.32*drop);
  /* Bóng đổ: nguồn khuếch tán nhưng CÓ HƯỚNG NHẸ TỪ TRÊN-TRÁI → sườn dốc có bóng
   * thật, đỉnh sáng hơn trũng. Đây là cái làm mesh trông là ĐẤT. */
  terrKey.intensity = 2.90 + 0.66*drop;
  terrKey.position.set(-0.62, 0.70, 0.34);
  /* 12s ĐỈNH TUỔI 20 VÀO GIỮA KHUNG · 20s nhãn 「最高地点 ― 二十代」 bám cạnh đỉnh */
  PEAK_LAB.material.opacity = 0.86*win(u, 18.0, d, 1.6);
  PEAK_LAB.position.set(10.0, (groundY(SHAPE_F,0,ageToZ(23)) + 2.6)*VEX, ageToZ(23));
  PEAK_LAB.quaternion.copy(camera.quaternion);
  PEAK_LAB.scale.setScalar(2.4);
  POSTS[20].visible = true; POSTS[30].visible = true; POSTS[40].visible = true;
  SRC_RUSSAC.material.opacity = 0.45;
  pinToCamera(SRC_RUSSAC, 0.30, -0.80, 26.0, 26);
  /* 36s xa hơn nữa, GỜ CAO THỨ HAI hiện mờ trong sương — CHƯA GỌI TÊN, để C27 gọi.
   * Vẫn CHỒNG KHÍT hai lớp: không hé lộ sớm (ràng buộc nguồn). */
  setSeparation(0);
}

/* S13 · C24–C26 · 211,13–231,41s — CHÈN NGƯỢC về trần phòng TRỌ (「若い夜」),
 * rồi hoà tan trở lại địa hình ở chỗ trũng.
 * CÙNG CÔNG THỨC GÓC MÁY với S02 (28mm, 0,45m, 62°), KHÁC PHÒNG — sự lặp lại góc
 * máy là điều làm người xem hiểu "cũng là một người nằm thức".
 * ⛔ Không có người trong phòng trọ. Chỉ trần và ánh sáng. */
function sc_S13(t){
  var u = loc(t,'S13');
  /* 18s HOÀ TAN sang địa hình (2s) */
  var toTerr = ramp(u, 16.6, 18.8);
  if(toTerr < 0.5){
    showGroup('YROOM');
    /* góc mỏ neo nhưng trong YROOM (world z = 200) */
    var p = ANCHOR.pos, l = anchorLook(0,0,3.0);
    camSet(p[0], p[1], 200 + p[2], l[0], l[1], 200 + l[2], F28);
    yshaftUni.uT.value = t;
    yshaftUni.uCamPos.value.copy(camera.position);
    /* 0s trần phòng trẻ · 7s dải sáng MẢNH HƠN, màu LAM LẠNH HƠN 4.400K */
    yshaftUni.uInt.value = 0.72*ramp(u, 0.4, 6.4);
    yspot.intensity = 6.0 + 12.0*ramp(u, 0.4, 6.4);
    /* 13s KHÔNG có đồng hồ LED — thay bằng ánh màn hình điện thoại hắt lên từ
     * dưới, RẤT YẾU, ⛔ không thấy nội dung màn hình */
    phoneLight.intensity = 0.30*ramp(u, 11.0, 14.2);
    yamb.intensity = 0.14 + 0.06*ramp(u, 0.4, 6.4);
  } else {
    showGroup('TERR');
    /* camera đứng DƯỚI CHÂN đỉnh tuổi 20, nhìn LÊN đỉnh · 24s bắt đầu ĐI XUỐNG
     * phía trũng — địa hình dốc xuống dưới chân */
    var ud = u - 18.8;
    var down = clamp(ud, 0, 99);
    var age = 27.0 + down*1.15/Z_PER_AGE*3.0;
    age = Math.min(age, 33.0);
    var lookUp = 1 - clamp(ud/4.2, 0, 1);
    camWalk(age, -3.2, 1.60, lerp(-9.0, 12.0, clamp(ud/5.0,0,1)), F35);
    setMist(camera.position.y, 0.0090, 1.3, 0.52);
    terrKey.intensity = 3.25;
    SRC_RUSSAC.material.opacity = 0.45;
    pinToCamera(SRC_RUSSAC, 0.30, -0.80, 15.0, 26);
    POSTS[20].visible = true; POSTS[30].visible = true;
    setSeparation(0);
  }
}

/* S14 · C26–C28 · 231,41–245,76s — ⭐ HAI LỚP MESH: LỚP 2 HIỆN RA.
 * Camera đi qua đáy trũng và BẮT ĐẦU LÊN DỐC. Đúng lúc bắt đầu lên, một lớp
 * địa hình THỨ HAI TÁCH RA khỏi lớp thứ nhất — cho tới giờ hai lớp chồng khít
 * nên trông như một.
 * ⚠⚠ CƠ CHẾ HAI LỚP là ràng buộc nguồn quan trọng nhất của tập. */
function sc_S14(t){
  var u = loc(t,'S14');
  showGroup('TERR');
  /* tầm người đi 1,6m, 35mm, đi tới 1,1 m/s, chúi 10°.
   * Lối đi ở 1/3 DƯỚI-PHẢI khung (ĐỔI BỐ CỤC so với S09). */
  var dist = 1.1*u;
  var age = 42.0 + dist/Z_PER_AGE;
  camWalk(age, -5.2, 1.60, 10.0, F35, false, 2.6);
  setMist(camera.position.y, 0.0090, 1.4, 0.52);
  terrKey.intensity = 3.20;
  /* 8s dốc bắt đầu lên; mép dải bên trái lộ MỘT ĐƯỜNG NỨT MẢNH chạy dọc — báo hiệu
   * 16s NỨT MỞ RA, lớp trên (nữ) NÂNG LÊN khỏi lớp dưới (nam) rất chậm,
   *     chênh lệch tăng dần theo chiều đi
   * 24s chênh lệch đã đọc rõ, HAI VIỀN MÀU phân biệt được */
  var crack = ramp(u, 6.0, 8.6);
  var sep = ramp(u, 8.6, 14.0);
  setSeparation(sep);
  /* VIỀN MÀU: lớp NỮ ấm, lớp NAM lam nhạt. CHỈ viền — cả hai vẫn là đất đặc. */
  var rimOp = 0.62*ramp(u, 7.4, 13.0);
  /* MẶT CẮT HỞ ở mép dải — chỉ hiện khi hai lớp tách ra */
  var sdF = layerF.userData.side, sdM = layerM.userData.side, si;
  for(si=0; si<2; si++){
    sdF.children[si].material.opacity = 0.85*sep;
    sdM.children[si].material.opacity = 0.85*sep;
  }
  layerF.userData.rim.children[0].material.opacity = rimOp;
  layerF.userData.rim.children[1].material.opacity = rimOp;
  layerM.userData.rim.children[0].material.opacity = rimOp*(0.4 + 0.6*sep);
  layerM.userData.rim.children[1].material.opacity = rimOp*(0.4 + 0.6*sep);
  SRC_RUSSAC.material.opacity = 0.45;
  pinToCamera(SRC_RUSSAC, 0.30, -0.80, 15.0, 26);
  POSTS[40].visible = true; POSTS[50].visible = true;
}

/* S15 · C28–C30 · 245,76–264,51s — ⭐ CAO TRÀO 2: HAI ĐƯỜNG ĐI, HAI NHÃN.
 * Camera lùi ra và lên cao, nhìn hai lớp TỪ BÊN HÔNG: rõ ràng là HAI CON ĐƯỜNG
 * KHÁC NHAU đi qua cùng một vùng tuổi.
 * ⚠ Góc 3/4 để NHÌN THẤY CẢ HAI LỚP KHÔNG CHỒNG CHE NHAU — góc này là BẮT BUỘC,
 * nhìn chính diện sẽ che mất lớp dưới (lỗi "pass mà sai" số 3). */
function sc_S15(t){
  var u = loc(t,'S15');
  showGroup('TERR');
  setSeparation(1.0);
  var p = ease(clamp(u/12.0, 0, 1));
  var z = ageToZ(53);
  var gy = groundY(SHAPE_F, 0, z);
  /* crane-out từ tầm mắt lên 15m + ra bên hông 20m, ease 12s, 35→40mm.
   * Kết ở GÓC 3/4: camera lệch cả X (bên hông) và Z (phía sau) → hai lớp tách bạch. */
  /* phóng đại 3,2× — chênh lệch NỮ 0,76 vs NAM 0,30 là 0,46 đơn vị = 6m ở tỉ lệ
   * đi bộ; trên dải dài 100m trong khung thì gần như không đọc được. Đây là
   * thông tin BẮT BUỘC của tập (ràng buộc nguồn số 1), nên phải nhìn rõ. */
  setVEX(lerp(1.0, 3.2, p));
  var gyv = gy*VEX;
  camSet(lerp(-5.2, -74.0, p), lerp(gy + 1.6, gyv + 16.0, p), TZ + z - lerp(4.0, 56.0, p),
         lerp(0.9, -2.0, p), lerp(gy + 1.0, gyv*0.62, p), TZ + z + lerp(8.0, 34.0, p),
         lerp(F35, F40, p));
  setMist(camera.position.y, 0.0058, 0.9, 0.42);
  terrKey.intensity = 3.35;
  /* viền hai lớp rõ */
  layerF.userData.rim.children[0].material.opacity = 0.70;
  layerF.userData.rim.children[1].material.opacity = 0.70;
  layerM.userData.rim.children[0].material.opacity = 0.70;
  layerM.userData.rim.children[1].material.opacity = 0.70;
  var sdF2 = layerF.userData.side, sdM2 = layerM.userData.side, si2;
  for(si2=0; si2<2; si2++){
    sdF2.children[si2].material.opacity = 0.85;
    sdM2.children[si2].material.opacity = 0.85;
  }
  /* 12s HAI NHÃN XUẤT HIỆN CÙNG LÚC, mỗi nhãn bám vào lớp của nó bằng một
   * ĐƯỜNG CHỈ MẢNH. ⛔ Không hiện lần lượt (sẽ đọc thành nhóm nam là phụ chú). */
  var labOn = ramp(u, 9.6, 12.6);
  LAB_F.material.opacity = 0.92*labOn;
  LAB_M.material.opacity = 0.92*labOn;
  LEAD_F.material.opacity = 0.55*labOn;
  LEAD_M.material.opacity = 0.55*labOn;
  /* nhãn nằm trong VEX_FREE → nhân VEX vào y để bám đúng lớp của mình */
  var zL = ageToZ(55);
  var yFL = groundY(SHAPE_F, 0, zL), yML = groundY(SHAPE_M, 0, zL);
  LAB_F.position.set(-26.0, (yFL + 5.0)*VEX, zL);
  LAB_M.position.set(-26.0, (yML - 3.4)*VEX, zL);
  LEAD_F.position.set(-14.0, (yFL + 3.6)*VEX, zL);
  LEAD_M.position.set(-14.0, (yML - 2.4)*VEX, zL);
  LAB_F.scale.setScalar(2.2); LAB_M.scale.setScalar(2.2);
  LAB_F.quaternion.copy(camera.quaternion);
  LAB_M.quaternion.copy(camera.quaternion);
  /* 18s ĐƯỜNG CHẤM MẢNH nối hai lớp theo chiều đứng ở đúng mốc tuổi 50, kèm cọc
   * 「50」 CẮM XUYÊN QUA CẢ HAI — cùng một tuổi, hai cao độ khác nhau */
  var linkOn = ramp(u, 15.0, 18.4);
  DOTLINK.visible = linkOn > 0.02;
  var i;
  for(i=0;i<DOTLINK.children.length;i++){
    var dd = DOTLINK.children[i];
    dd.material.opacity = 0.82*linkOn*clamp(linkOn*DOTLINK.children.length - i, 0, 1);
    dd.quaternion.copy(camera.quaternion);
  }
  POST50_LONG.visible = linkOn > 0.02;
  POST50_LONG.userData.lab.material.opacity = 0.88*linkOn;
  POST50_LONG.userData.lab.quaternion.copy(camera.quaternion);
  POSTS[50].visible = false;   /* tránh hai cọc 50 chồng nhau */
  POSTS[40].visible = true; POSTS[60].visible = true;
  SRC_RUSSAC.material.opacity = 0.45;
  pinToCamera(SRC_RUSSAC, 0.30, -0.80, 20.0, 26);
  /* 26s camera DỪNG, giữ khung 6s để người xem đọc xong hai nhãn — ⚠ KHÔNG CẮT SỚM,
   * đây là thông tin BẮT BUỘC theo ràng buộc nguồn. (p đã bão hoà ở 12s.) */
}

/* S16 · C30–C32 · 264,51–295,07s — camera QUAY LẠI TẦM MẮT trên lớp cao,
 * gần đỉnh thứ hai. 足音 dừng. Ta đứng yên giữa sương, KHÔNG BIẾT MÌNH ĐANG ĐÂU.
 * Nhịp nghỉ sau hai shot thông tin dày. */
function sc_S16(t){
  var u = loc(t,'S16');
  showGroup('TERR');
  setSeparation(1.0);
  /* tĩnh hoàn toàn ở 1,6m, 35mm, chúi 8°. Đứng yên suốt shot. */
  camWalk(56.0, 1.4, 1.60, 8.0, F35);
  /* 0s sương dâng TRỞ LẠI tới ngang ngực, tầm nhìn 8m — CỐ Ý CHE, vì C31–C32 là
   * chỗ 私 chưa biết mình ở đâu · 16s sương trôi ngang chậm, THOÁNG HÉ thấy dốc
   * phía trước ĐANG ĐI XUỐNG rồi khép lại ngay */
  var thick = ramp(u, 0.0, 5.0);
  var peek = win(u, 14.5, 19.5, 2.0);
  setMist(camera.position.y, 0.0075 + 0.0105*thick - 0.0090*peek, 1.1, 0.46 + 0.26*thick - 0.20*peek);
  /* ⚠ LỐI RA: dù sương dày, LUÔN CÓ MỘT VÙNG SÁNG HƠN ở hướng đi tới —
   * không bao giờ bịt kín */
  endGlow.material.opacity = 0.10 + 0.07*peek;
  endGlow.scale.setScalar(120.0);
  /* 24s ánh sáng qua sương ẤM LÊN 4%, báo trước S17 */
  var warm = ramp(u, 21.0, 28.0);
  terrKey.color.setRGB(lerp(0.894,0.94,warm), lerp(0.918,0.90,warm), lerp(0.949,0.84,warm));
  terrKey.intensity = 2.98 + 0.19*warm;
  layerF.userData.rim.children[0].material.opacity = 0.34;
  layerF.userData.rim.children[1].material.opacity = 0.34;
  SRC_RUSSAC.material.opacity = 0.45;
  pinToCamera(SRC_RUSSAC, 0.30, -0.80, 13.0, 26);
  POSTS[50].visible = true; POSTS[60].visible = true;
}

/* S17 · C33–C35 · 295,07–322,82s — ⭐ CAO TRÀO 3: QUAY NGƯỜI, THẤY DỐC XUỐNG.
 * CÚ MỞ KHUNG CỦA CẢ TẬP. Camera quay 180° chậm: phía sau là đỉnh vừa leo, phía
 * trước là MỘT DỐC XUỐNG DÀI THOẢI, sương tan hết, nhìn tới tận cuối dải đất.
 * ⛔ Cuối dốc KHÔNG được dựng như điểm kết thúc. Không cổng, không vạch, không vực. */
function sc_S17(t){
  var u = loc(t,'S17'), d = dur('S17');
  showGroup('TERR');
  setSeparation(1.0);
  /* orbit ngang 180° quanh trục đứng, RẤT CHẬM, ease-in-out 18s, 35→28mm.
   * Sau khi quay xong, dolly tới 8m rồi dừng. */
  var rot = ease(clamp(u/18.0, 0, 1));
  var dolly = ease(clamp((u - 18.0)/8.0, 0, 1))*8.0;
  var age = 57.0 + dolly/Z_PER_AGE;
  var z = ageToZ(age), x = 0.30;
  var y = groundY(SHAPE_F, x, z) + 1.60;
  /* yaw 180°: bắt đầu nhìn về tuổi NHỎ (sau), kết nhìn về tuổi LỚN (trước) */
  var yaw = Math.PI*(1.0 - rot);
  var pit = -9.0*Math.PI/180;
  var lx = x + Math.sin(yaw)*0.0;
  var lz = z + Math.cos(yaw)*10.0;
  camSet(x, y, TZ + z, x + Math.sin(yaw)*3.0, y + Math.tan(pit)*10.0, TZ + lz,
         lerp(F35, F28, clamp((rot-0.72)/0.28, 0, 1)));
  /* 12s SƯƠNG BẮT ĐẦU TAN theo hướng quay — mật độ fog GIẢM 70% trong 4s.
   * ⚠ Lý do vật lý: xuống thấp thì sương mỏng, khớp quy ước height-fog đã đặt. */
  var clear = ramp(u, 11.0, 15.5);
  setMist(y, 0.0125 - 0.0100*clear, 0.9, 0.58 - 0.44*clear);
  /* 24s ánh sáng đổi: xám 5.200K → VÀNG THẤP GÓC 3.600K, mặt trời thấp ở cuối
   * dốc, NGƯỢC SÁNG NHẸ, viền các gờ đất sáng lên */
  var sun = ramp(u, 21.0, 27.0);
  terrKey.color.setRGB(lerp(0.90,0.99,sun), lerp(0.92,0.90,sun), lerp(0.95,0.80,sun));
  terrKey.intensity = 3.05 + 0.38*sun;
  terrSun.intensity = 1.55*sun;
  setSky(sun, 1.0);                       /* trời chuyển sang vàng thấp góc */
  /* 16s TOÀN BỘ DỐC XUỐNG hiện ra; cuối dải là MỘT VÙNG SÁNG NHẠT —
   * ⛔ không phải vách đá, không phải hư vô: dải đất THOẢI DẦN rồi HOÀ VÀO ÁNH SÁNG */
  endGlow.material.opacity = 0.16 + 0.30*clear + 0.16*sun;
  endGlow.scale.setScalar(150.0);
  endGlow.position.y = (groundY(SHAPE_F,0,Z_END) + 10.0)*VEX;
  POSTS[60].visible = true; POSTS[70].visible = true; POSTS[87].visible = true;
  SRC_RUSSAC.material.opacity = 0.45;
  pinToCamera(SRC_RUSSAC, 0.30, -0.80, 13.0, 26);
}

/* S18 · C36–C39 · 322,82–360,6s — crane lên 40m, toàn cảnh cả dải đất, và giờ
 * có DẢI ĐẤT THỨ HAI chạy song song bên cạnh, mờ hơn: 調査2 (113 phụ nữ,
 * thang Templer) — CÙNG HÌNH DẠNG.
 * ⛔ Không vẽ đường so sánh, không mũi tên, không phần trăm khớp. */
function sc_S18(t){
  var u = loc(t,'S18'), d = dur('S18');
  showGroup('TERR');
  setSeparation(1.0);
  var p = ease(clamp(u/14.0, 0, 1));
  var z = ageToZ(52);
  /* crane lên 40m, 28mm, nhìn CHÉO XUỐNG 35°; dải chính ở 1/3 dưới,
   * dải thứ hai ở phía xa */
  setVEX(3.2);
  /* nhìn NGANG HÔNG như S30 — bản trước nhìn gần tiếp tuyến với dải nên mặt trên
   * thu về một đường và chỉ còn mép trước lộ ra, đọc thành hai vệt thuôn mờ
   * (snapshot 340s/352s). */
  camSet(lerp(-240.0, -380.0, p), lerp(70.0, 120.0, p), TZ + z - lerp(10.0, 30.0, p),
         lerp(-20.0, -40.0, p), H_SCALE*3.2*0.42, TZ + z + 20.0, F28);
  setMist(camera.position.y, 0.0030, 0.6, 0.30);
  /* nắng thấp giữ từ S17 — ⚠ KHÔNG BAO GIỜ quay lại lạnh hơn đoạn trước */
  terrKey.color.setRGB(0.99, 0.90, 0.80);
  terrKey.intensity = 3.42;
  terrSun.intensity = 1.60;
  setSky(1.0, 1.0);
  /* 8s DẢI THỨ HAI hiện dần bên cạnh, cùng hai đỉnh, cùng dốc xuống — hình dạng
   * TRÙNG KHỚP, chỉ khác tỉ lệ nhỏ; độ mờ 55% để phân biệt */
  var s2 = ramp(u, 5.0, 11.0);
  STRIP2.visible = s2 > 0.02;
  STRIP2.material.opacity = 0.55*s2;
  /* ⛔ KHÔNG bật vách mép cho dải thứ hai: nó chỉ cần đọc là "cùng hình dạng",
   * thêm vách làm khung rối và che mất dải chính. */
  /* 14s nhãn nguồn thứ hai mờ hiện DƯỚI dải thứ hai */
  SRC_STUDY2.material.opacity = 0.45*ramp(u, 11.0, 15.0);
  pinToCamera(SRC_STUDY2, -0.34, -0.62, 40.0, 26);
  SRC_RUSSAC.material.opacity = 0.45;
  pinToCamera(SRC_RUSSAC, 0.30, -0.80, 40.0, 26);
  /* 20s hai dải đất CÙNG DỐC XUỐNG về cùng một hướng — hình nói 「形は同じでした」
   * 28s camera giữ, ánh sáng cuối dốc SÁNG LÊN THÊM MỘT BẬC */
  endGlow.material.opacity = 0.42 + 0.20*ramp(u, 24.0, 32.0);
  endGlow.scale.setScalar(190.0);
  POSTS[20].visible = true; POSTS[50].visible = true; POSTS[87].visible = true;
  /* CUT: gap 1,5s — dốc xuống trong nắng MỜ DẦN và ánh nắng vàng ấy trở thành
   * nắng chiều qua kính xe ở S19 (nối bằng MÀU, không cắt cứng) */
}


/* ==========================================================================
 * 第3章 — 四十四組の食い違い (S19–S31) · chương dài nhất (42% kịch bản)
 * ========================================================================== */

/* S19 · C40–C42 · 360,6–384,9s — THẺ CHƯƠNG 3 · CẢNH XE (lần 2).
 * CÙNG XE CÙNG CHIỀU hôm ấy, nhưng GÓC KHÁC: từ ghế sau chéo lên, thấy hai chỗ
 * ngồi phía trước qua khe giữa hai ghế. Hai người CHỈ THẤY GÁY VÀ VAI. */
function sc_S19(t){
  var u = loc(t,'S19');
  showGroup('CAR');
  NAPES.visible = true; WHEEL.visible = false;
  var sh = 0.002*Math.sin(t*1.8*2*Math.PI);
  /* mắt người ngồi ghế sau: TRƯỚC lưng ghế sau (z=+1.18), nhìn qua khe hai ghế */
  camSet(0.02, 1.28 + sh, CARZ + 1.02,  0.0, 1.16, CARZ - 3.4, F50);
  driveStreet(t, 10.0);
  /* nắng chiều 3.400K từ TRÁI-SAU, quét chậm */
  carSun.intensity = 0.92; carSun.color.setHex(0xffd49a);
  /* 7s NẮNG QUÉT QUA, bụi trong xe lộ ra trong luồng sáng — CÙNG NGUYÊN LÝ TÁN XẠ
   * với light shaft phòng ngủ (quy ước thống nhất của tập) */
  var sweep = win(u, 5.4, 13.0, 2.0);
  carShaftUni.uInt.value = 0.95*sweep;
  carShaftUni.uT.value = t;
  dashPatch.material.opacity = 0.24*sweep;
  /* 14s nhãn nguồn hiện góc dưới-phải, GIỮ TỚI C50 */
  SRC_SINOFF.material.opacity = 0.45*ramp(u, 11.0, 15.0);
  SRC_SINOFF.position.set(0.50, 0.80, CARZ - 0.10);
  SRC_SINOFF.quaternion.copy(camera.quaternion);
  SRC_SINOFF.position.copy(camera.position).add(
    new THREE.Vector3(0.30, -0.155, -0.62).applyQuaternion(camera.quaternion));
  SRC_SINOFF.position.sub(CAR.position);
  /* 22s cảnh ngoài kính bên trôi chậm, nhà cửa thành ĐỒNG TRỐNG */
  var open = ramp(u, 18.0, 24.0);
  carAmb.intensity = 0.20 + 0.10*open;
  wsFlare.material.opacity = 0.14 + 0.14*open;
}

/* S20 · C42–C44 · 384,9–408,37s — BA MỨC: 4,0 và 6,9.
 * Ba mức lo âu dựng TRONG KHÔNG GIAN 3D trên một cột thang đứng, đặt trên nền
 * địa hình mờ. ⛔ KHÔNG phải biểu đồ cột, ⛔ không animation đếm số nhảy,
 * ⛔ không thanh bar mọc lên, ⛔ không màu đỏ/xanh giá trị. */
function sc_S20(t){
  var u = loc(t,'S20');
  showGroup('TERR');
  SCALE_COL.visible = true;
  setSeparation(1.0);
  /* tĩnh 50mm, nhìn ngang hơi CHẾCH LÊN 12°; cột thang ở 1/3 PHẢI khung */
  var cp = SCALE_COL.position;
  camSet(cp.x - 2.55, cp.y + 1.45, TZ + cp.z - 5.4,
         cp.x - 0.95, cp.y + 2.85, TZ + cp.z, F50);
  setMist(cp.y + 1.45, 0.0180, 0.5, 0.52);
  terrKey.color.setRGB(0.99, 0.90, 0.80);
  terrKey.intensity = 2.90;
  terrSun.intensity = 0.70;
  setSky(0.85, 0.92);
  /* 0s chỉ cột thang trống, 15 vạch · 8s MỨC 4,0 hiện ra (đĩa mỏng ánh ẤM) */
  var d1 = ramp(u, 6.4, 9.4);
  discs[0].userData.disc.material.opacity = 0.88*d1;
  discs[0].userData.ring.material.opacity = 0.92*d1;
  discs[0].userData.lab.material.opacity = 0.90*d1;
  discs[0].userData.lab.quaternion.copy(camera.quaternion);
  /* 16s GIỮ YÊN — cho người xem đo bằng mắt mức 4 nằm thấp thế nào trên 15 vạch */
  /* 22s MỨC 6,9 hiện ra, đĩa thứ hai màu LAM NHẠT */
  var d2 = ramp(u, 19.6, 22.6);
  discs[1].userData.disc.material.opacity = 0.88*d2;
  discs[1].userData.ring.material.opacity = 0.92*d2;
  discs[1].userData.lab.material.opacity = 0.90*d2;
  discs[1].userData.lab.quaternion.copy(camera.quaternion);
  SRC_SINOFF.material.opacity = 0.0;   /* nhãn Sinoff nằm trong CAR, không hiện ở đây */
}

/* S21 · C45–C46 · 408,37–424,44s — MỨC THỨ BA: 8,1.
 * Camera DỊCH XUỐNG THẤP và NHÌN LÊN — làm mức thứ ba khi hiện ra trông cao hơn
 * hẳn. Bố cục đổi, cùng đối tượng. */
function sc_S21(t){
  var u = loc(t,'S21');
  showGroup('TERR');
  SCALE_COL.visible = true;
  setSeparation(1.0);
  var cp = SCALE_COL.position;
  /* dolly xuống 0,8m + hướng lên 24°, chậm, 50mm; cột chạy DỌC khung từ dưới lên */
  var p = ease(clamp(u/7.4, 0, 1));
  camSet(cp.x - 2.30, cp.y + lerp(1.45, 0.65, p), TZ + cp.z - 4.9,
         cp.x - 0.60, cp.y + lerp(2.85, 3.55, p), TZ + cp.z, F50);
  setMist(cp.y + 1.0, 0.0180, 0.5, 0.52);
  terrKey.color.setRGB(0.99, 0.90, 0.80);
  terrKey.intensity = 2.90;
  terrSun.intensity = 0.70;
  setSky(0.85, 0.92);
  /* hai đĩa đã có từ S20 */
  var i;
  for(i=0;i<2;i++){
    discs[i].userData.disc.material.opacity = 0.88;
    discs[i].userData.ring.material.opacity = 0.92;
    discs[i].userData.lab.material.opacity = 0.90;
    discs[i].userData.lab.quaternion.copy(camera.quaternion);
  }
  /* 8s hai đĩa ở nửa dưới khung, phần cột trên CÒN TRỐNG — khoảng trống này là
   * CÂU HỎI, giữ 4s · 14s MỨC 8,1 hiện ra, đĩa thứ ba LAM ĐẬM HƠN, nằm hẳn trên */
  var d3 = ramp(u, 11.4, 14.4);
  discs[2].userData.disc.material.opacity = 0.90*d3;
  discs[2].userData.ring.material.opacity = 0.94*d3;
  discs[2].userData.lab.material.opacity = 0.92*d3;
  discs[2].userData.lab.quaternion.copy(camera.quaternion);
  /* 20s MỘT ĐƯỜNG CHỈ MẢNH nối đĩa 4,0 và đĩa 8,1, ở giữa nhãn nhỏ 「二倍」 —
   * cách DUY NHẤT được phép "so sánh" trong tập này, vì là quan hệ trong cùng
   * MỘT CỘT, không phải đồ thị */
  var lk = ramp(u, 14.4, 16.07);
  SCALE_COL.userData.link.material.opacity = 0.70*lk;
  SCALE_COL.userData.dbl.material.opacity = 0.88*lk;
  SCALE_COL.userData.dbl.quaternion.copy(camera.quaternion);
}

/* S22 · C47–C48 · 424,44–442,62s — camera LÙI RA: cột thang THU NHỎ DẦN và ta
 * thấy nó đứng giữa vùng sương của địa hình. Con số được ĐẶT LẠI VÀO THẾ GIỚI,
 * không lơ lửng. */
function sc_S22(t){
  var u = loc(t,'S22');
  showGroup('TERR');
  SCALE_COL.visible = true;
  setSeparation(1.0);
  var cp = SCALE_COL.position;
  /* dolly-back 14m, 50→35mm, ease chậm; cột từ chiếm cả khung thành vật nhỏ ở 1/3 trái */
  var p = ease(clamp(u/13.0, 0, 1));
  camSet(cp.x + lerp(-2.30, 2.20, p), cp.y + lerp(0.65, 4.2, p),
         TZ + cp.z - lerp(4.9, 17.5, p),
         cp.x + lerp(-0.60, 3.0, p), cp.y + lerp(3.55, 2.2, p), TZ + cp.z,
         lerp(F50, F35, p));
  setMist(camera.position.y, 0.0160, 0.7, 0.54);
  terrKey.color.setRGB(0.99, 0.90, 0.80);
  terrKey.intensity = 2.98 + 0.56*win(u, 17.0, 19.0, 1.4);
  setSky(0.85, 0.92);
  terrSun.intensity = 0.72;
  /* 0s ba đĩa cận · 7s lùi ra, thấy CHÂN CỘT CẮM XUỐNG MẶT ĐẤT CÓ SỎI
   * 14s lùi hết, nhãn THU LẠI thành ba chữ số 「4.0 / 6.9 / 8.1」 xếp dọc */
  var shrink = ramp(u, 11.0, 14.6);
  var i;
  for(i=0;i<3;i++){
    discs[i].userData.disc.material.opacity = 0.88;
    discs[i].userData.ring.material.opacity = 0.92;
    discs[i].userData.lab.material.opacity = 0.90*(1 - shrink);
    discs[i].userData.lab.quaternion.copy(camera.quaternion);
  }
  SCALE_COL.userData.link.material.opacity = 0.70*(1 - shrink*0.6);
  SCALE_COL.userData.dbl.material.opacity = 0.88*(1 - shrink);
  SCALE_COL.userData.dbl.quaternion.copy(camera.quaternion);
  SCALE_COL.userData.trio.material.opacity = 0.86*shrink;
  SCALE_COL.userData.trio.quaternion.copy(camera.quaternion);
  SCALE_COL.userData.trio.position.set(1.55, SCALE_H*0.56, 0.0);
  /* 20s một dải sáng mây trôi qua, cả cụm SÁNG LÊN rồi TRẦM LẠI (ở terrKey trên) */
}

/* S23 · C49–C50 · 442,62–460,61s — CẢNH XE (lần 3, ĐÓNG VÒNG).
 * ĐÚNG KHUNG S07 — cận bàn tay người lái. Lần này người xem đã biết AI là người
 * đang căng. Không cần một chữ giải thích.
 * ⚠ Khớp đúng thông số S07 — SỰ LẶP LẠI LÀ NỘI DUNG, không phải tiết kiệm. */
function sc_S23(t){
  var u = loc(t,'S23');
  showGroup('CAR');
  var sh = 0.002*Math.sin(t*1.8*2*Math.PI);
  camSet(CAM_S07[0], CAM_S07[1] + sh, CARZ + CAM_S07[2],
         CAM_S07[3], CAM_S07[4], CARZ + CAM_S07[5], F85);
  driveStreet(t, 2.2);
  /* 8s KHỚP NGÓN TAY GIÃN RA — chỗ trắng nhạt biến mất, tay NỚI LỎNG trên vô lăng.
   * Đây là C49–C50 kể bằng hình. */
  var rel = ramp(u, 5.6, 10.4);
  setGrip(0.94 - 0.72*rel);
  /* 16s tay phải RỜI VÔ LĂNG MỘT NHỊP rồi đặt lại, nhẹ hơn */
  var lift = win(u, 14.4, 17.4, 0.9);
  handR.g.position.y = Math.sin(-24*Math.PI/180)*0.185 + 0.026*lift;
  handR.g.position.x = Math.cos(-24*Math.PI/180)*0.185 + 0.012*lift;
  /* 22s nắng chiều hạ thêm một bậc, 3.100K, ẤM HƠN S07 */
  var warm = ramp(u, 13.0, 18.0);
  carSun.color.setRGB(1.0, lerp(0.80,0.77,warm), lerp(0.52,0.46,warm));
  carSun.intensity = 0.86;
  carAmb.intensity = 0.24;
  wsFlare.material.opacity = 0.30;
  wsFlare.material.color.setRGB(1.0, 0.80, 0.52);
  STREET.userData.signal.material.opacity = 0.24;
  STREET.userData.signal.material.color.setRGB(1.0, 0.70, 0.12);
  SRC_SINOFF.material.opacity = 0.45*(1 - ramp(u, 14.0, 18.0));
  SRC_SINOFF.position.copy(camera.position).add(
    new THREE.Vector3(0.115, -0.060, -0.26).applyQuaternion(camera.quaternion));
  SRC_SINOFF.position.sub(CAR.position);
  SRC_SINOFF.quaternion.copy(camera.quaternion);
  SRC_SINOFF.scale.setScalar(0.42);
}

/* S24 · C51–C53 · 460,61–488,48s — CỬA SỔ BỆNH VIỆN nhìn từ trong ra.
 * ⚠⚠ ĐOẠN NHẠY NHẤT TẬP — cảnh phải NHẸ và TRUNG TÍNH:
 * ⛔ Không giường, không rèm ngăn, không thiết bị y tế, không người,
 *    không biểu tượng bệnh viện. Không thấy giường, không thấy người. */
function sc_S24(t){
  var u = loc(t,'S24');
  showGroup('HOSP');
  /* tĩnh 50mm, nhìn THẲNG ô cửa; bệ cửa ở 1/3 dưới. KHÔNG chuyển động camera. */
  camSet(0.0, 1.62, 600 + 1.70,  0.0, 1.38, 600 - 1.60, F50);
  /* 8s một nhành hoa trong bình LAY RẤT NHẸ (luồng khí điều hoà) */
  var i;
  for(i=0;i<3;i++){
    var s = VASE.userData['s'+i];
    if(s) s.rotation.z = (i-1)*0.10 + 0.028*Math.sin(t*0.62 + i*2.1)*ramp(u, 6.0, 9.0);
  }
  /* 14s HAI TỪ hiện lơ lửng cách nhau trong không gian phòng — ⛔ không hộp,
   * ⛔ không mũi tên. Đúng C52–C53: hai thứ khác nhau bị nhét vào một chữ. */
  var wOn = ramp(u, 11.6, 15.2);
  wordEnd.material.opacity = 0.62*wOn;      // bên trái, MỜ HƠN, viền mềm
  wordProc.material.opacity = 0.92*wOn;     // bên phải, RÕ HƠN
  /* 22s giữa hai từ, MỘT ĐƯỜNG MẢNH TÁCH RA LÀM HAI — hình của 「押し込められていた」 */
  var sp = ramp(u, 19.6, 24.0);
  splitA.material.opacity = 0.70*sp;
  splitB.material.opacity = 0.70*sp;
  splitA.position.y = 1.515 + 0.075*sp;
  splitB.position.y = 1.515 - 0.075*sp;
  hospSun.intensity = 0.42;
}

/* S25 · C54–C56 · 488,48–517,72s — cùng ô cửa, camera dịch sang để thấy MỘT CÁI
 * GHẾ TRỐNG bên cạnh bệ cửa — chỗ người đến thăm ngồi, chỗ người ta HỎI ĐƯỢC.
 * Cảnh của 「尋ねられること」.
 * ⛔ Không dựng bác sĩ, không biểu tượng y tế, không nêu thuốc/dịch vụ/終活. */
function sc_S25(t){
  var u = loc(t,'S25');
  showGroup('HOSP');
  CHAIR.visible = true;
  /* dolly ngang TRÁI 1,2m rất chậm, 50mm; ghế vào khung TỪ PHẢI, dừng ở 1/3 phải */
  var p = ease(clamp(u/9.0, 0, 1));
  camSet(lerp(0.0, -1.20, p), 1.62, 600 + 1.70,
         lerp(0.0, -0.55, p), 1.34, 600 - 1.60, F50);
  var i;
  for(i=0;i<3;i++){
    var s = VASE.userData['s'+i];
    if(s) s.rotation.z = (i-1)*0.10 + 0.028*Math.sin(t*0.62 + i*2.1);
  }
  /* 7s ghế vào khung: ghế gỗ đơn giản, TRỐNG, ánh chiều rọi lên mặt ghế */
  chairPatch.material.opacity = 0.44*ramp(u, 5.0, 9.4);
  /* 20s nắng trên mặt ghế DỊCH 4cm (chiều thấp dần), ẤM LÊN 3.000K */
  var warm = ramp(u, 16.0, 24.0);
  chairPatch.position.set(1.06 - 0.04*warm, 0.465, -0.95 + 0.02*warm);
  hospSun.color.setRGB(1.0, lerp(0.81,0.76,warm), lerp(0.60,0.50,warm));
  hospSun.intensity = 0.42;
  HOSP.userData.sky.material.color.setRGB(0.42, lerp(0.35,0.33,warm), lerp(0.27,0.22,warm));
  /* 14s chữ 「尋ねられる」 GIỮ LẠI, chữ 「漠然と怖いもの」 MỜ ĐI 60% —
   * hai thứ KHÔNG BẰNG NHAU nữa */
  var sw = ramp(u, 11.0, 15.4);
  wordAsk.material.opacity = 0.92;
  wordVague.material.opacity = 0.62*(1 - 0.60*sw);
  splitA.material.opacity = 0.70*(1 - sw*0.7);
  splitB.material.opacity = 0.70*(1 - sw*0.7);
  splitA.position.y = 1.590; splitB.position.y = 1.440;
}

/* S26 · C57–C59 · 517,72–545,47s — ra lại địa hình, TRÊN ĐOẠN DỐC XUỐNG DÀI
 * TRONG NẮNG. Ánh sáng ĐẸP NHẤT TẬP ở đây. Camera đi xuống dốc, tốc độ người đi. */
function sc_S26(t){
  var u = loc(t,'S26');
  showGroup('TERR');
  setSeparation(1.0);
  /* tầm mắt 1,6m, 35mm, đi tới 1,2 m/s, chúi 12°; lối đi ở 1/3 DƯỚI-TRÁI
   * (ĐỔI BỐ CỤC so với S09/S14) */
  var dist = 1.2*u;
  var age = 64.0 + dist/Z_PER_AGE;
  camWalk(age, 4.4, 1.60, 12.0, F35, false, -2.0);
  setMist(camera.position.y, 0.0058, 0.8, 0.34);
  /* nắng thấp góc 3.600K, NGƯỢC SÁNG NHẸ */
  terrKey.color.setRGB(1.0, 0.88, 0.76);
  terrKey.intensity = 3.00;
  terrSun.intensity = 1.85;
  setSky(1.0, 1.0);
  endGlow.material.opacity = 0.54;
  endGlow.scale.setScalar(130.0);
  /* 20s BÓNG CAMERA ĐỔ DÀI phía trước trên mặt đất (mặt trời sau lưng) —
   * chứng minh có nguồn sáng CÓ HƯỚNG thật. terrKey đặt từ sau-trên. */
  terrKey.position.set(-0.20, 0.62, -0.75);
  /* 8s nhãn nguồn Carstensen hiện góc dưới-phải
   * 14s NGAY DƯỚI nhãn, một dòng nhỏ hơn, BẮT BUỘC CÓ (ràng buộc nguồn) */
  SRC_CARST.material.opacity = 0.45*ramp(u, 6.0, 9.4);
  pinToCamera(SRC_CARST, 0.26, -0.76, 12.0, 26);
  SRC_CARST2.material.opacity = 0.55*ramp(u, 11.6, 15.0);
  pinToCamera(SRC_CARST2, 0.26, -0.855, 12.0, 24);
  /* 28s một cọc mốc 「70」 lướt qua bên phải */
  POSTS[70].visible = true; POSTS[87].visible = true;
}

/* S27 · C60–C62 · 545,47–583,3s — ⭐ SST DỰNG BẰNG ĐƯỜNG CHÂN TRỜI.
 * Carstensen kể bằng ĐỘ XA của đường chân trời: thời gian còn lại cảm thấy mở
 * ngỏ → chân trời XA; cảm thấy có hạn → chân trời GẦN LẠI và CÁI GẦN RÕ HƠN.
 * ⚠ CHỈ DOF và FOG đổi, CAMERA KHÔNG DI CHUYỂN — điều đổi là "cái gì được nhìn".
 * ⛔ Không đốm nào BIẾN MẤT — SST nói thứ tự ưu tiên ĐẢO, không nói mất mát. */
function sc_S27(t){
  var u = loc(t,'S27');
  showGroup('TERR');
  setSeparation(1.0);
  SPARKS.visible = true;
  /* tĩnh, 35mm, nhìn DỌC DỐC XUỐNG */
  var age = 70.0, z = ageToZ(age), x = 0.55;
  var y = groundY(SHAPE_F, x, z) + 1.60;
  camSet(x, y, TZ + z, x - 0.5, y - 1.7, TZ + z + 9.0, F35);
  terrKey.color.setRGB(1.0, 0.88, 0.76);
  terrKey.intensity = 3.05;
  setSky(1.0, 1.0);
  terrKey.position.set(-0.20, 0.62, -0.75);
  terrSun.intensity = 1.85;
  endGlow.scale.setScalar(130.0);
  /* 0s chân trời RẤT XA, mọi thứ trong nét sâu (hyperfocal); nhãn nhỏ
   * 16s CHUYỂN TIÊU ĐIỂM CHẬM 6s: nét dời từ xa về gần; fog phía xa DÀY LÊN */
  var shift = ramp(u, 14.0, 21.5);
  setMist(y, 0.0052 + 0.0150*shift, 0.8, 0.30 + 0.30*shift);
  endGlow.material.opacity = 0.56*(1 - 0.55*shift);
  /* nhãn đổi ở 30s */
  sstLab1.material.opacity = 0.80*ramp(u, 1.6, 4.4)*(1 - ramp(u, 26.0, 30.0));
  sstLab2.material.opacity = 0.80*ramp(u, 28.4, 32.0);
  sstLab1.quaternion.copy(camera.quaternion);
  sstLab2.quaternion.copy(camera.quaternion);
  pinToCamera(sstLab1, -0.02, 0.60, 15.0, 40);
  pinToCamera(sstLab2, -0.02, 0.60, 15.0, 40);
  /* 8s những ĐỐM SÁNG NHỎ rải khắp phía XA — nhiều, nhỏ, đều, KHÔNG có cái nào
   * nổi bật · 22s vài đốm ở GẦN trở nên LỚN VÀ RÕ HẲN, các đốm xa MỜ ĐI
   * (KHÔNG TẮT, chỉ mờ). ⚠ Số lượng GIẢM nhưng ĐỘ SÁNG TỪNG CÁI TĂNG. */
  var farOn = ramp(u, 6.0, 11.0);
  var i;
  for(i=0;i<sparkList.length;i++){
    var s = sparkList[i];
    var breath = 1.0 + 0.10*Math.sin(t*0.42 + s.seed*19.0);
    if(s.near){
      /* đốm GẦN: yếu lúc đầu, LỚN VÀ RÕ HẲN sau khi chuyển tiêu điểm */
      var k = (0.16 + 0.80*shift)*breath;
      s.core.material.opacity = clamp(k, 0, 1)*farOn;
      s.halo.material.opacity = clamp(k*0.70, 0, 1)*farOn;
      s.core.scale.setScalar(s.r*(1.0 + 0.85*shift));
      s.halo.scale.setScalar(s.r*7.5*(1.0 + 0.70*shift));
      s.beam.material.opacity = 0.0;
    } else {
      /* đốm XA: sáng đều lúc đầu, MỜ ĐI (không tắt) sau khi chuyển tiêu điểm */
      var k2 = (0.58 - 0.34*shift)*breath;
      s.core.material.opacity = clamp(k2, 0, 1)*farOn;
      s.halo.material.opacity = clamp(k2*0.42, 0, 1)*farOn;
      s.core.scale.setScalar(s.r);
      s.halo.scale.setScalar(s.r*7.5);
      s.beam.material.opacity = 0.0;
    }
  }
  SRC_CARST.material.opacity = 0.45;
  pinToCamera(SRC_CARST, 0.26, -0.76, 12.0, 26);
  SRC_CARST2.material.opacity = 0.55;
  pinToCamera(SRC_CARST2, 0.26, -0.855, 12.0, 24);
  POSTS[70].visible = true; POSTS[87].visible = true;
}

/* S28 · C63–C65 · 583,3–609,71s — camera tiếp tục xuống dốc, các đốm sáng gần
 * giờ đã thành những ĐIỂM ẤM RÕ RÀNG hai bên lối đi. Nắng thấp hơn nữa. */
function sc_S28(t){
  var u = loc(t,'S28');
  showGroup('TERR');
  setSeparation(1.0);
  SPARKS.visible = true;
  /* đi tới 1,0 m/s (CHẬM HƠN S26 — C63 ghi 足音がゆっくり), 35mm, chúi 10°;
   * lối đi GIỮA khung, đốm sáng hai bên */
  var dist = 1.0*u;
  var age = 71.5 + dist/Z_PER_AGE;
  camWalk(age, 0.0, 1.60, 10.0, F35);
  setMist(camera.position.y, 0.0075, 0.8, 0.32);
  /* 8s NẮNG MẠNH LÊN: cường độ +30%, ngược sáng làm viền gờ đất SÁNG RỰC,
   * lens flare RẤT NHẸ VÀ TĨNH (hàm của t, KHÔNG nhấp nháy) */
  var boost = ramp(u, 6.0, 11.0);
  terrKey.color.setRGB(1.0, 0.87, 0.74);
  terrKey.intensity = 3.00*(1 + 0.30*boost);
  setSky(1.0, 1.0 + 0.10*boost);
  terrKey.position.set(-0.20, 0.62, -0.75);
  terrSun.intensity = 1.85*(1 + 0.30*boost);
  endGlow.material.opacity = 0.58 + 0.16*boost;
  endGlow.scale.setScalar(140.0);
  sunFlare.material.opacity = 0.26*boost;
  sunFlare.scale.setScalar(20.0);
  /* 16s một đốm sáng LỚN NHẤT trôi qua sát bên trái camera — gần đến mức THẤY
   * ĐƯỢC NÓ CÓ THỂ TÍCH, không phải sprite phẳng */
  var i;
  for(i=0;i<sparkList.length;i++){
    var s = sparkList[i];
    var breath = 1.0 + 0.10*Math.sin(t*0.42 + s.seed*19.0);
    if(s.near){
      s.core.material.opacity = clamp(0.94*breath, 0, 1);
      s.halo.material.opacity = clamp(0.66*breath, 0, 1);
      s.core.scale.setScalar(s.r*1.85);
      s.halo.scale.setScalar(s.r*13.0);
    } else {
      s.core.material.opacity = clamp(0.24*breath, 0, 1);
      s.halo.material.opacity = clamp(0.16*breath, 0, 1);
      s.core.scale.setScalar(s.r);
      s.halo.scale.setScalar(s.r*7.5);
    }
    s.beam.material.opacity = 0.0;
  }
  SRC_CARST.material.opacity = 0.45*(1 - ramp(u, 16.0, 22.0));
  pinToCamera(SRC_CARST, 0.26, -0.76, 12.0, 26);
  SRC_CARST2.material.opacity = 0.55*(1 - ramp(u, 16.0, 22.0));
  pinToCamera(SRC_CARST2, 0.26, -0.855, 12.0, 24);
  POSTS[70].visible = true; POSTS[87].visible = true;
}

/* S29 · C66–C67 · 609,71–626,04s — ⭐ CÚ LẬT: 向きを変えた.
 * Dựng bằng MỘT CHUYỂN ĐỘNG QUAY, không bằng chữ: CẢ CỤM ĐỐM SÁNG CÙNG QUAY
 * HƯỚNG MỘT LƯỢT, từ hướng ra xa sang hướng vào gần. KHÔNG CÁI NÀO TẮT.
 * ⛔ Số lượng đốm sáng KHÔNG ĐỔI MỘT CÁI NÀO trong suốt shot — đây là ràng buộc
 *    nội dung: KHÔNG PHẢI MẤT ĐI, LÀ ĐỔI HƯỚNG.
 * Đây là lần DUY NHẤT trong chương đặt chủ thể CHÍNH GIỮA khung — cố ý, điểm chốt. */
function sc_S29(t){
  var u = loc(t,'S29');
  showGroup('TERR');
  setSeparation(1.0);
  SPARKS.visible = true;
  /* tĩnh, 40mm, nhìn CHẾCH XUỐNG 20° vào cụm đốm sáng; chủ thể GIỮA khung */
  var zc = ageToZ(80.5);
  var yc = groundY(SHAPE_F, 0, zc);
  camSet(0.1, yc + 4.2, TZ + zc - 13.0,  0.0, yc + 0.9, TZ + zc, F40);
  setMist(yc + 4.2, 0.0062, 0.7, 0.28);
  terrKey.color.setRGB(1.0, 0.87, 0.74);
  terrKey.intensity = 3.55;
  setSky(1.0, 1.05);
  terrKey.position.set(-0.20, 0.62, -0.75);
  terrSun.intensity = 2.10;
  endGlow.material.opacity = 0.66;
  endGlow.scale.setScalar(140.0);
  sunFlare.material.opacity = 0.22;
  sunFlare.scale.setScalar(20.0);
  /* 0s mỗi đốm có MỘT HƯỚNG PHÁT SÁNG RIÊNG, tất cả CHĨA RA XA
   * 8s toàn cụm bắt đầu QUAY HƯỚNG ĐỒNG LOẠT, rất chậm, 12s để quay xong 180° —
   *    ease-in-out, HÀM THUẦN CỦA t
   * 16s quay xong: tất cả hướng VÀO GẦN, vùng gần camera SÁNG LÊN RÕ RỆT */
  var turn = ease(clamp((u - 6.4)/9.4, 0, 1));
  var i;
  for(i=0;i<sparkList.length;i++){
    var s = sparkList[i];
    var breath = 1.0 + 0.09*Math.sin(t*0.42 + s.seed*19.0);
    /* ⚠ SỐ LƯỢNG KHÔNG ĐỔI: mọi đốm đều sáng, suốt shot. Chỉ HƯỚNG đổi. */
    s.core.material.opacity = clamp((s.near? 0.90 : 0.62)*breath, 0, 1);
    s.halo.material.opacity = clamp((s.near? 0.58 : 0.40)*breath, 0, 1);
    s.core.scale.setScalar(s.r*(s.near? 1.5 : 1.0));
    s.halo.scale.setScalar(s.r*(s.near? 11.0 : 8.0));
    /* dải hướng phát sáng: quay 180° quanh trục đứng, đồng loạt */
    var ang0 = 0.0 + s.seed*0.5;                 // chĩa ra XA (về +Z)
    var ang = ang0 + Math.PI*turn;               // quay về hướng camera (-Z)
    s.beam.material.opacity = clamp(0.44*breath, 0, 1);
    s.beam.rotation.set(0, ang, 0);
    /* dải đặt LỆCH về phía nó chĩa, để đọc được hướng */
    var off = s.r*5.0;
    s.beam.position.set(s.x + Math.sin(ang)*off, s.y, s.z + Math.cos(ang)*off);
  }
  /* vùng gần camera sáng lên rõ rệt sau khi quay xong */
  terrSun.intensity = 2.10 + 0.55*turn;
  /* 22s NHÃN hiện, MỘT DÒNG, giữa khung dưới — ⚠ CÂU CHỐT, hiển thị đủ 6s.
   * S29 dài 16,3s nên nhãn vào ở 9,6s và ở lại tới hết shot (6,7s). */
  pivotLab.material.opacity = 0.92*ramp(u, 9.0, 11.4);
  pinToCamera(pivotLab, 0.0, -0.44, 13.0, 46);
  POSTS[87].visible = true;
}

/* S30 · C68–C72 · 626,04–678,53s — CHƯƠNG GIỚI HẠN (BẮT BUỘC).
 * Camera lùi RẤT XA và lên cao, nhìn cả dải đất từ trên như một vật đặt trên bàn —
 * CỐ Ý làm nó NHỎ LẠI. Đây là hình của 「これはあくまで傾向です」. */
function sc_S30(t){
  var u = loc(t,'S30'), d = dur('S30');
  showGroup('TERR');
  setSeparation(1.0);
  PEOPLE.visible = true;
  /* crane lên 120m + lùi 90m, ease CHẬM 25s, 28mm */
  var p = ease(clamp(u/25.0, 0, 1));
  var zc = ageToZ(52);
  /* lùi ra BÊN HÔNG (x) chứ không dọc trục dải: dải dài 517m, nhìn dọc trục thì
   * nó thành một vệt chéo hẹp (snapshot 640s). Nhìn ngang hông thì cả 18→87 tuổi
   * trải ngang khung — đúng ý 「như một vật đặt trên bàn」. */
  setVEX(lerp(1.0, 3.2, p));
  camSet(lerp(1.0, -330.0, p), lerp(groundY(SHAPE_F,0,ageToZ(68)) + 1.6, 150.0, p),
         TZ + zc - lerp(24.0, 40.0, p),
         lerp(0.0, 0.0, p), lerp(groundY(SHAPE_F,0,ageToZ(72)), 14.0, p),
         TZ + zc + lerp(12.0, 30.0, p), F28);
  setMist(camera.position.y, 0.0030, 0.4, 0.22);
  terrKey.color.setRGB(1.0, 0.89, 0.78);
  terrKey.intensity = 3.42;
  setSky(1.0, 1.0);
  terrSun.intensity = 1.55;
  endGlow.material.opacity = 0.50;
  endGlow.scale.setScalar(190.0);
  /* 16s những CHẤM SÁNG RẤT NHỎ rải rác KHẮP dải đất, KỂ CẢ chỗ thấp và chỗ cao —
   * mỗi chấm là MỘT NGƯỜI; có chấm SÁNG ở tuổi 80, có chấm MỜ ở tuổi 50.
   * ⚠ C69–C70 dựng bằng hình: HÌNH DẠNG LÀ CỦA ĐÁM ĐÔNG, không phải của một người. */
  var pOn = ramp(u, 13.0, 19.0);
  var i;
  for(i=0;i<PEOPLE.children.length;i++){
    var m = PEOPLE.children[i];
    m.material.opacity = m.userData.b*0.88*pOn;
  }
  /* 24s BA DÒNG GIỚI HẠN hiện LẦN LƯỢT, mỗi dòng cách 6s, xếp dọc góc trái, α 0,7.
   * 42s cả ba dòng cùng trên khung, giữ 5s.
   * ⛔ Không dấu cảnh báo, không màu đỏ, không khung viền. Chữ mờ, BÌNH THẢN. */
  for(i=0;i<3;i++){
    var on = ramp(u, 22.0 + i*6.0, 25.4 + i*6.0);
    LIMITS[i].material.opacity = 0.70*on;
    pinToCamera(LIMITS[i], -0.34, 0.30 - i*0.155, 22.0, 32);
  }
  POSTS[20].visible = true; POSTS[50].visible = true; POSTS[87].visible = true;
}

/* S31 · C73–C74 · 678,53–703,91s — camera HẠ XUỐNG THẤP LẠI, về SÁT MẶT ĐẤT:
 * CẬN SỎI DƯỚI CHÂN, nông đến mức chỉ thấy vài viên. Hình của
 * 「紙の上の数字で言い当てられるとは思えません」: CÁI THẬT thì ở đây, dưới chân. */
function sc_S31(t){
  var u = loc(t,'S31');
  showGroup('TERR');
  setSeparation(1.0);
  GRAVEL_CU.visible = true;
  /* hạ từ 120m xuống 0,3m trong 14s (ease-out MẠNH, gần đất thì chậm hẳn), 85mm */
  var p = clamp(u/14.0, 0, 1);
  var pe = 1 - Math.pow(1 - p, 3.4);              // ease-out mạnh, hàm thuần
  setVEX(lerp(3.2, 1.0, pe));    /* về tỉ lệ đi bộ khi chạm đất */
  var gp = GRAVEL_CU.position;   /* S31 hạ từ 210m (khớp S30) xuống 0,30m */
  /* 20s camera trôi tới rất chậm dọc mặt đất, sỏi trôi qua khung */
  var creep = 0.30*Math.max(0, u - 17.0);
  camSet(gp.x - 0.30, lerp(210.0, gp.y + 0.30, pe), TZ + gp.z - lerp(270.0, 0.74, pe) + creep,
         gp.x + 0.05, lerp(8.0, gp.y + 0.055, pe), TZ + gp.z + creep,
         lerp(F28, F85, pe));
  setMist(camera.position.y, lerp(0.0030, 0.0110, pe), 0.5, lerp(0.22, 0.30, pe));
  /* nắng chiều rọi NGANG: mỗi viên có BÓNG TIẾP XÚC RIÊNG và một mặt sáng một mặt
   * tối — chi tiết này chứng minh đây là VẬT THẬT, không phải texture */
  terrKey.color.setRGB(1.0, 0.89, 0.77);
  terrKey.intensity = 3.65;
  setSky(1.0, 1.0);
  terrKey.position.set(-0.86, 0.22, -0.46);       // rọi rất ngang
  terrSun.intensity = 1.40;
  /* 26s XA XA CUỐI DỐC, vùng sáng VẪN Ở ĐÓ — ⚠ LỐI RA BẰNG ÁNH SÁNG, luôn trong khung */
  endGlow.material.opacity = 0.44;
  endGlow.scale.setScalar(170.0);
  PEOPLE.visible = p < 0.55;
  var i;
  if(PEOPLE.visible){
    for(i=0;i<PEOPLE.children.length;i++){
      var m = PEOPLE.children[i];
      m.material.opacity = m.userData.b*0.88*(1 - ramp(u, 4.0, 9.0));
    }
  }
  for(i=0;i<3;i++) LIMITS[i].material.opacity = 0.70*(1 - ramp(u, 0.0, 3.6));
  if(u < 4.0) for(i=0;i<3;i++) pinToCamera(LIMITS[i], -0.34, 0.30 - i*0.155, 22.0, 32);
  POSTS[70].visible = true; POSTS[87].visible = true;
  /* CUT: gap 2,0s — nắng cuối dốc MỜ DẦN thành dải sáng trên trần phòng ngủ
   * (đảo ngược đúng cú chuyển ở S08). Vòng tròn khép bằng hình. */
}

/* ==========================================================================
 * 第4章 — 帰り道 (S32–S34) · chương ngắn nhất, TĨNH NHẤT
 *
 * Không một chuyển động camera lớn nào. Người xem về đúng chỗ đã bắt đầu.
 * Ánh sáng đã ẤM LÊN — không nói ra, để hình nói.
 * ========================================================================== */

/** đặt phòng ngủ về tông 第4章: 3.200K ÁM ẤM, dải sáng DỊCH XUỐNG 9cm,
 *  cường độ nền phòng +35% (các góc trần KHÔNG CÒN ĐEN, đã đọc được hình).
 *  ⚠ GIỮ NGUYÊN: góc máy · nghiêng dải 34° · bề rộng 11cm · kết cấu trần. */
function room4(t, warmK, dropCm, ambBoost){
  var drop = (dropCm/100.0);
  shaftUni.uOrigin.value.set(SHAFT_ORIGIN.x, SHAFT_ORIGIN.y - drop*1.6, SHAFT_ORIGIN.z - drop*0.9);
  shaftSpot.position.copy(shaftUni.uOrigin.value);
  shaftSpot.target.position.copy(shaftUni.uOrigin.value.clone().add(SHAFT_DIR.clone().multiplyScalar(4.0)));
  placeBand();
  /* 4.100K lam lạnh → 3.200K ám ấm: (0.62,0.72,1.0) → (1.0,0.88,0.74) */
  var r = lerp(0.62, 1.00, warmK), g = lerp(0.72, 0.88, warmK), b = lerp(1.00, 0.74, warmK);
  shaftUni.uCol.value.setRGB(r, g, b);
  shaftSpot.color.setRGB(r, g, b);
  dustUni.uCol.value.setRGB(r, g, b);
  CEIL_BAND.material.uniforms.uCol.value.setRGB(r, g, b);
  roomAmb.color.setRGB(lerp(0.17,0.30,warmK), lerp(0.22,0.26,warmK), lerp(0.31,0.24,warmK));
  roomAmb.intensity = 0.20*(1 + 0.35*ambBoost);
  bounceLight.color.setRGB(lerp(0.36,0.74,warmK), lerp(0.43,0.60,warmK), lerp(0.57,0.44,warmK));
  bounceLight.intensity = 0.16*(1 + 0.60*ambBoost);
  shaftSpot.intensity = 3.4*(1 + 0.10*ambBoost);
  CEIL_BAND.material.uniforms.uInt.value = 1.0*(1 + 0.10*ambBoost);
}

/* S32 · C75–C78 · 703,91–732,87s — THẺ CHƯƠNG 4 · GÓC MÁY MỎ NEO TRỞ LẠI.
 * ĐÚNG KHUNG S02. Cùng trần, cùng dải sáng, cùng đồng hồ. Khác MỘT ĐIỀU: MÀU.
 * ⚠ Phải khớp từng độ với S02 — sai một độ là hỏng cú lặp. */
function sc_S32(t){
  var u = loc(t,'S32');
  showGroup('ROOM');
  camAnchor(0,0,0,0,F28);                         /* ĐÚNG thông số S02 */
  /* dải sáng DỊCH XUỐNG 9cm (tiếp tục cùng chiều đã dịch 3cm ở S08 —
   * Trái Đất quay, chuyển động NHẤT QUÁN, KHÔNG đảo chiều) */
  var warm = 0.82 + 0.06*ramp(u, 20.0, 28.0);     /* 24s ấm lên thêm 5% */
  room4(t, warm, 9.0, 1.0);
  shaftUni.uInt.value = 1.00;
  /* 16s rèm lay MỘT NHỊP, dải hẹp lại rồi nở — ĐÚNG CHU KỲ 6,5s của S02 */
  var sway = (u > 15.0) ? Math.sin((u-15.0)*2*Math.PI/6.5) : 0;
  var swayK = (u > 15.0) ? clamp((u-15.0)/1.4, 0, 1)*clamp((26.0-u)/2.0, 0, 1) : 0;
  shaftUni.uWidth.value = 0.055*(1 - 0.24*sway*swayK);   /* bề rộng 11cm GIỮ NGUYÊN */
  CEIL_BAND.material.uniforms.uW.value = 0.11*(1 - 0.24*sway*swayK);
  dustUni.uOp.value = 0.50;
  /* 8s đồng hồ LED: 3:00 — CÙNG GIỜ, ĐÊM KHÁC */
  setClock(3, 0, 0.22*ramp(u, 4.0, 8.4), 0.40, 0.0);
  /* trời đã chớm sáng và trộn vào — vệt trời qua khe bớt tối */
  skySlit.material.color.setRGB(0.10, 0.13, 0.20);
}

/* S33 · C79–C84 · 732,87–780,71s — camera dolly RẤT CHẬM về phía cửa sổ —
 * lần đầu trong cả tập rời khỏi tư thế nằm.
 * ⚠ Chậm hơn mọi chuyển động camera khác trong tập — NHỊP RU NGỦ.
 * ⛔ Không dựng ai trong phòng. ⛔ Không quay lại cảnh xe — C81–C84 là ký ức,
 *    để LỜI ĐỌC mang; hình giữ ở phòng, tĩnh. */
function sc_S33(t){
  var u = loc(t,'S33'), d = dur('S33');
  showGroup('ROOM');
  /* dolly tới 1,8m + HẠ hướng nhìn từ 62° xuống 34°, ease-in-out 30s, 28mm */
  var p = ease(clamp(u/30.0, 0, 1));
  var ppos = ANCHOR.pos;
  var pit = lerp(62.0, 34.0, p);
  var lk = anchorLook(pit - ANCHOR.pitchDeg, 0, 3.0);
  /* dolly TỚI: đi về phía cửa sổ (+X) và lên nhẹ */
  camSet(ppos[0] + 1.80*p, ppos[1] + 0.22*p, ppos[2] - 0.20*p,
         lk[0] + 1.80*p + 0.9, lk[1] + 0.22*p, lk[2] - 0.20*p, F28);
  room4(t, 0.88 + 0.06*ramp(u, 26.0, 40.0), 9.0, 1.15);
  shaftUni.uInt.value = 1.00;
  dustUni.uOp.value = 0.52;
  setClock(3, 0, 0.20, 0.38, 0.0);
  /* 16s QUA KHE RÈM: MỘT VỆT TRỜI XANH RẤT NHẠT, không phải đen. Trời sắp sáng.
   * ⛔ Không dựng mặt trời, không bình minh rực — CHỈ LÀ BỚT TỐI. */
  var dawn = ramp(u, 12.0, 22.0);
  skySlit.material.color.setRGB(lerp(0.039,0.22,dawn), lerp(0.063,0.30,dawn), lerp(0.125,0.40,dawn));
  /* 24s đường viền các vật trong phòng đã đọc được: mép tủ đầu giường, góc chăn */
  roomAmb.intensity = 0.20*(1 + 0.35*1.15)*(1 + 0.24*ramp(u, 20.0, 30.0));
  /* 32s một BÓNG CHIM NHỎ lướt RẤT NHANH qua vệt trời — ĐÚNG MỘT LẦN, không lặp */
  var bird = win(u, 31.6, 32.5, 0.22);
  skySlit.material.opacity = 1.0 - 0.55*bird;
}

/* S34 · C85–C87 · 780,71–804,88s — ⭐ KHUNG KẾT. Trở lại ĐÚNG KHUNG S02/S32
 * một lần cuối. Trần nhà, dải sáng, hết. KHÔNG CÓ GÌ XẢY RA — đó chính là nội dung.
 * ⚠ C87 nằm trong shot này — packaging yêu cầu TĨNH VÀ NHẸ, KHÔNG KỊCH TÍNH:
 *   không zoom, không dolly, không hiệu ứng suốt shot. */
function sc_S34(t){
  var u = loc(t,'S34');
  showGroup('ROOM');
  camAnchor(0,0,0,0,F28);                         /* ĐÚNG thông số S02, TĨNH TUYỆT ĐỐI */
  /* 8s dải sáng ẤM THÊM MỘT BẬC CUỐI (3.000K), mép dải MỀM HƠN vì độ trong
   * không khí sáng sớm cao hơn */
  var warm = 0.94 + 0.06*ramp(u, 5.0, 11.0);
  room4(t, warm, 9.0, 1.25);
  shaftUni.uInt.value = 1.00;
  shaftUni.uSpread.value = 0.085*(1 + 0.22*ramp(u, 5.0, 12.0));   /* mép mềm hơn */
  CEIL_BAND.material.uniforms.uW.value = 0.11*(1 + 0.18*ramp(u, 5.0, 12.0));
  /* 16s hạt bụi trong cột sáng CHẬM LẠI — phòng đã yên hẳn */
  dustUni.uRise.value = 0.008*(1 - 0.58*ramp(u, 13.0, 19.0));
  dustUni.uOp.value = 0.50;
  /* 24s đồng hồ LED MỜ DẦN ĐI 40% (mắt đang nhắm lại — chủ quan, rất nhẹ) */
  setClock(3, 0, 0.22*(1 - 0.40*ramp(u, 21.0, 24.17)), 0.36, 0.0);
  skySlit.material.color.setRGB(0.24, 0.32, 0.42);
  /* 32s ⚠ C87 bắt đầu (804,88−5,35 = 799,53 → u = 18,82): KHÔNG thêm một chuyển
   * động nào. Dòng 4c hiện ở 1/3 dưới, MỘT DÒNG, 38px, α 0,75, ⛔ không hộp không viền.
   * ⚠ Đây là DÒNG ĐỒ HOẠ CỐ ĐỊNH, không phải phụ đề — phải hiện đủ hết C87 và
   *   ở lại thêm 2s. Phụ đề tự sinh vẫn chạy bình thường song song (track khác). */
  var noteOn = ramp(u, 18.60, 20.20);
  noteEl.textContent = 'ご不安が続くときは、かかりつけの先生にご相談ください';
  noteEl.style.opacity = (0.92*noteOn).toFixed(3);
  /* 38s dòng 4c và cả khung CÙNG TỐI DẦN ĐỀU về đen trong 4s — lo bởi globalFade
   * ở renderAtTime (fade-out 4s). Sau đó là outro 5s màn đen của apply-lead-tail. */
}

/* ==========================================================================
 * DRIVER — renderAtTime(t): hàm THUẦN, đặt TRỌN VẸN mọi thứ theo t rồi render.
 * ========================================================================== */
var SCENE_FN = {
  S01:sc_S01, S02:sc_S02, S03:sc_S03, S04:sc_S04, S05:sc_S05, S06:sc_S06,
  S07:sc_S07, S08:sc_S08, S09:sc_S09, S10:sc_S10, S11:sc_S11, S12:sc_S12,
  S13:sc_S13, S14:sc_S14, S15:sc_S15, S16:sc_S16, S17:sc_S17, S18:sc_S18,
  S19:sc_S19, S20:sc_S20, S21:sc_S21, S22:sc_S22, S23:sc_S23, S24:sc_S24,
  S25:sc_S25, S26:sc_S26, S27:sc_S27, S28:sc_S28, S29:sc_S29, S30:sc_S30,
  S31:sc_S31, S32:sc_S32, S33:sc_S33, S34:sc_S34
};
var SCENE_KEYS = Object.keys(SC);
/** tìm cảnh chứa t (tuyến tính trên 34 phần tử — rẻ, và tất định) */
function sceneAt(t){
  var i;
  for(i=0;i<SCENE_KEYS.length;i++){
    var k = SCENE_KEYS[i];
    if(t >= SC[k][0] && t < SC[k][1]) return k;
  }
  return t < SC.S01[0] ? 'S01' : 'S34';
}

function renderAtTime(t){
  /* LEADTAIL:APPLIED — dịch timeline sang phải 2s cho intro lặng.
     Cảnh vẫn dùng mốc gốc của timing.json; chỉ tới muộn hơn 2s. */
  var _tReal = t;                    /* thời gian THẬT của video, cho phụ đề */
  t = Math.max(0, t - 2);   /* thời gian CẢNH, đã trừ intro */

  t = clamp(t, 0, TOTAL);
  resetState();
  /* các cọc mốc: mặc định TẮT HẾT, mỗi cảnh tự bật cọc mình cần.
   * ⚠ Đặt ở đây (không trong cảnh) vì HyperFrames SCRUB tới mốc bất kỳ. */
  var ages = [18,20,30,40,50,60,70,87], ai;
  for(ai=0; ai<ages.length; ai++){
    POSTS[ages[ai]].visible = false;
    /* bù phóng đại trục tung của TERR: cọc luôn cao 1,15m thật */
    POSTS[ages[ai]].scale.y = 1/VEX;
  }
  POST50_LONG.scale.y = 1/VEX;
  /* uniform thời gian cho mọi shader — cùng t ra cùng frame */
  shaftUni.uT.value = t;
  dustUni.uT.value = t;
  yshaftUni.uT.value = t;
  carShaftUni.uT.value = t;
  MIST.material.uniforms.uT.value = t;

  var key = sceneAt(t);
  SCENE_FN[key](t);
  /* ⚠ SAU khi cảnh đã đặt VEX: bù lại cho cọc mốc (cảnh nào cũng có thể đổi VEX) */
  for(ai=0; ai<ages.length; ai++) POSTS[ages[ai]].scale.y = 1/VEX;
  POST50_LONG.scale.y = 1/VEX;

  /* camPos cho mọi shader ray-march — PHẢI đặt SAU khi cảnh đã đặt camera */
  shaftUni.uCamPos.value.copy(camera.position);
  yshaftUni.uCamPos.value.copy(camera.position);
  carShaftUni.uCamPos.value.copy(camera.position);

  /* phụ đề + nhãn chương */
  HFA.applySubtitle(subEl, CUES, _tReal);
  /* LEADTAIL:APPLIED — màn hình đen 5s cuối: nhạc chạy tiếp, hình tắt dần. */
  (function(){
    var ob = document.getElementById('outro-black');
    if(!ob) return;
    var f = (_tReal - 806.94) / 1.2;         /* 1.2s chuyển sang đen */
    ob.style.opacity = String(Math.max(0, Math.min(1, f)));
  })();
  HFA.applyChapter(chapEl, CHAPTERS, _tReal, 6.0);

  /* fade vào/ra toàn cục. S34 tối dần đều về đen trong 4s cuối (yêu cầu C87).
   * ⚠ LEADTAIL: fade tính theo THỜI GIAN CẢNH và ĐỘ DÀI CẢNH (đã trừ intro 2s +
   * outro 5s). Dùng TOTAL mới (811.94) sẽ đẩy fade-out muộn 7 giây — khung sẽ
   * còn sáng khi overlay đen đã phủ, và C87 không tối dần đều như packaging đòi. */
  var _SCENE_DUR = TOTAL - 2 - 5;
  var fade = HFA.globalFade(t, _SCENE_DUR, 1.6, 4.0);
  rootEl.style.opacity = fade.toFixed(4);

  composer.render();
}

/* ⚠ Dòng đăng ký phải nằm NGUYÊN DẠNG trong file này — StaticGuard quét VĂN BẢN.
 * Khoá trùng ĐÚNG data-composition-id của div gốc. */
window.__timelines = window.__timelines || {};
window.__timelines["toshi-to-fuan"] = HFA.makeTimeline("toshi-to-fuan", TOTAL, renderAtTime);

</script>
