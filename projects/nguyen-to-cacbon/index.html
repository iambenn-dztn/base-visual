// ---- seeded PRNG (mulberry32) ----
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// ---- scene boundaries (real time) ----
const SC={
  A:[0,27.19], B:[27.19,50.52], C:[50.52,85.16], D:[85.16,125.54],
  E:[125.54,174.25], F:[174.25,214.59], G:[214.59,300.56], H:[300.56,345.47],
  I:[345.47,391.90], J:[391.90,427.30], K:[427.30,454.69], L:[454.69,504.02],
  M:[504.02,556.88], N:[556.88,584.05]
};
// local progress 0..1 within a scene window
function loc(t,k){const w=SC[k];return Math.min(1,Math.max(0,(t-w[0])/(w[1]-w[0])));}
function inSc(t,k){const w=SC[k];return t>=w[0]&&t<w[1];}
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=(x)=>{x=clamp(x,0,1);return x*x*(3-2*x);};
// fade helper: rises 0..1 over [a,a+f], holds, falls over [b-f,b]
function band(t,a,b,f){f=f||0.8;if(t<a-f||t>b+f)return 0;let up=smooth((t-(a-f))/(2*f));let dn=smooth((( b+f)-t)/(2*f));return Math.min(1,Math.min(up,dn));}

   void main(){

// ============================================================
//  SHARED: starfield (temperature-colored) with Milky Way band
// ============================================================
const STAR_R=14000;
function buildStars(){
  const N=5200,pr=mulberry32(20250731);
  const pos=new Float32Array(N*3),col=new Float32Array(N*3),siz=new Float32Array(N);
  const tmp=new THREE.Vector3();
  for(let i=0;i<N;i++){
    // bias toward a milky-way band plane
    let u=pr(),v=pr();
    let theta=Math.acos(2*u-1),phi=2*Math.PI*v;
    // squash toward band
    let band=pr();if(band<0.42){theta=Math.PI*0.5+(pr()-0.5)*0.5;}
    tmp.set(Math.sin(theta)*Math.cos(phi),Math.cos(theta)*0.7,Math.sin(theta)*Math.sin(phi)).normalize().multiplyScalar(STAR_R);
    pos[i*3]=tmp.x;pos[i*3+1]=tmp.y;pos[i*3+2]=tmp.z;
    // color by temperature
    let tt=pr();let c=new THREE.Color();
    if(tt<0.12)c.setRGB(0.62,0.72,1.0);        // blue
    else if(tt<0.34)c.setRGB(0.9,0.94,1.0);    // white
    else if(tt<0.66)c.setRGB(1.0,0.96,0.82);   // yellow-white
    else if(tt<0.86)c.setRGB(1.0,0.82,0.56);   // orange
    else c.setRGB(1.0,0.62,0.44);              // red
    let br=0.4+pr()*0.6;c.multiplyScalar(br);
    col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
    siz[i]=(pr()<0.06?3.4:1.0)*(0.9+pr()*1.7);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  g.setAttribute('aS',new THREE.BufferAttribute(siz,1));
  const m=new THREE.ShaderMaterial({
    uniforms:{uOp:{value:1}},transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    vertexShader:`attribute float aS;attribute vec3 color;varying vec3 vC;
      void main(){vC=color;vec4 mv=modelViewMatrix*vec4(position,1.0);
      gl_PointSize=aS*(${STAR_R.toFixed(1)}/-mv.z);gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`varying vec3 vC;uniform float uOp;
      void main(){vec2 d=gl_PointCoord-0.5;float r=length(d);
      float a=smoothstep(0.5,0.0,r);gl_FragColor=vec4(vC,a*uOp);}`
  });
  return new THREE.Points(g,m);
}
const stars=buildStars();scene.add(stars);

// human silhouette point cloud generator (shared)
function humanPoints(N,pr){
  const parts=[];function blob(cx,cy,rx,ry,frac){const n=Math.floor(N*frac);for(let i=0;i<n;i++){let a=pr()*6.283,rr=Math.sqrt(pr());parts.push([cx+Math.cos(a)*rr*rx,cy+Math.sin(a)*rr*ry,(pr()-0.5)*0.5]);}}
  blob(0,3.2,0.7,0.85,0.12);blob(0,1.2,1.15,1.7,0.34);blob(-1.6,1.5,0.5,1.5,0.12);blob(1.6,1.5,0.5,1.5,0.12);blob(-0.55,-2.3,0.55,1.9,0.14);blob(0.55,-2.3,0.55,1.9,0.14);
  while(parts.length<N)parts.push([(pr()-0.5)*3,(pr()-0.5)*8,(pr()-0.5)*0.5]);

// ============================================================
function makeStar(radius){
  const grp=new THREE.Group();
  const photoMat=new THREE.ShaderMaterial({
    uniforms:{uT:{value:0},uCol1:{value:new THREE.Color(0x8a2400)},uCol2:{value:new THREE.Color(0xff9628)},uCol3:{value:new THREE.Color(0xffeeb8)},uBright:{value:1.4}},
    vertexShader:`varying vec3 vP;varying vec3 vN;void main(){vP=normalize(position);vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,

function buildBucky(){

  const nmat=new THREE.MeshStandardMaterial({color:0x3a3a42,emissive:0x1a1a22,roughness:0.4,metalness:0.3});
  const ng=new THREE.SphereGeometry(0.12,12,12);

  // edges

}

// ============================================================
//  MAIN renderAtTime(t) — deterministic
// ============================================================
function renderAtTime(t){
  // toggle scene groups
  gA.visible=inSc(t,'A');gB.visible=inSc(t,'B');gC.visible=inSc(t,'C');gD.visible=inSc(t,'D');
  gE.visible=inSc(t,'E');gF.visible=inSc(t,'F');gG.visible=inSc(t,'G');gH.visible=inSc(t,'H');
  gI.visible=inSc(t,'I');gJ.visible=inSc(t,'J');gK.visible=inSc(t,'K');gL.visible=inSc(t,'L');
  gM.visible=inSc(t,'M');gN.visible=inSc(t,'N');

  sunPt.intensity=0;

  // starfield slow drift (function of t)
  stars.rotation.y=t*0.0016;stars.rotation.x=Math.sin(t*0.02)*0.02;
  const starOp=inSc(t,'A')||inSc(t,'B')?0.55:(inSc(t,'D')?0.7:0.95);
  stars.material.uniforms.uOp.value=starOp;
  mwSprite.material.opacity=0.16*starOp;

  try{
  // ---------------- A: breath ----------------
  if(gA.visible){
    const p=loc(t,'A');const d=gA.userData,arr=d.pos,base=d.base;
    for(let i=0;i<d.N;i++){
      const ph=d.ph[i],sp=d.sp[i];
      // emit from left-lower (mouth), drift right & disperse over t
      const life=(t*0.12+ph/6.283)%1;
      const spread=life*18;
      arr[i*3]=base[i*3]*0.3-6+life*20+Math.sin(t*sp+ph)*0.6;
      arr[i*3+1]=base[i*3+1]*0.3-1.5+Math.cos(t*sp*0.7+ph)*0.8+life*3;
      arr[i*3+2]=base[i*3+2]*0.3+Math.sin(t*0.5+ph)*spread*0.4;
    }
    d.pts.geometry.attributes.position.needsUpdate=true;
    d.pts.material.opacity=0.3+0.6*smooth(p*2)*(1-0.3*Math.max(0,p-0.7));
    d.pts.material.size=10+8*Math.sin(t*0.4);
    // camera slow push-in
    setCam(0,0,26-p*4,0,0,0,46);
  }

  // ---------------- B: body silhouette ----------------
  if(gB.visible){
    const p=loc(t,'B');const d=gB.userData;
    // reveal parts sequentially: bones(0.0) skin(0.2) hair(0.4) brain(0.55)
    const cols=d.pts.geometry.attributes.color.array;
    for(let i=0;i<d.N;i++){
      const tg=d.tag[i];let br=0.5;
      if(tg==='head')br=0.5+0.6*band(t,33.0,41.0,0.6);        // brain
      else if(tg==='hand')br=0.5+0.7*band(t,27.0,31.0,0.6);
      else if(tg==='torso'||tg==='legL'||tg==='legR')br=0.5+0.5*band(t,28.5,34.0,0.8);
      else br=0.5+0.5*band(t,29.0,36.0,0.8);
      cols[i*3]=1.0*br;cols[i*3+1]=0.72*br;cols[i*3+2]=0.4*br;
    }
    d.pts.geometry.attributes.color.needsUpdate=true;
    d.pts.rotation.y=Math.sin(t*0.1)*0.12;
    // cluster (1-in-5) fades in after 41.8
    const cf=band(t,42.0,50.5,1.0);d.cluster.visible=cf>0.02;
    d.cluster.rotation.y=t*0.35;d.cluster.rotation.x=Math.sin(t*0.2)*0.2;
    d.cluster.children.forEach(m=>{m.material.opacity=cf;m.material.transparent=true;});
    // dolly from hand up to head then to cluster
    const q=smooth(p);
    setCam(0.6*q+ (cf>0?cf*1.5:0),1.4-2.0*q,12-1.5*q,0.5, 0.6-1.2*q,0,42);
  }

  // ---------------- C: earth → dying star → embers ----------------
  if(gC.visible){
    const p=loc(t,'C');const d=gC.userData;
    // Phase 1 (C06 50.5-61): earth lonely, pull back
    // Phase 2 (C07 61-73): star lives/burns/dies
    // Phase 3 (C08 73-85): embers gather into human
    const earthVis=t<62;const starVis=t>=60&&t<74.5;const embVis=t>=73;
    d.earth.visible=earthVis;d.cloud.visible=earthVis;d.atmo.visible=earthVis;
    d.star.grp.visible=starVis;d.emb.visible=embVis;
    // earth
    d.earth.rotation.y=t*0.05;d.cloud.rotation.y=t*0.06;
    const eFade=band(t,50.5,62,1.0);
    [d.earth,d.cloud].forEach(m=>{});
    d.cloud.material.opacity=0.55*eFade;d.atmo.material.opacity=eFade;
    // key light dims as "no carbon born here"
    key.intensity=1.15*(1-0.5*smooth((t-50.5)/11));
    // star burn/die
    if(starVis){
      const sp=clamp((t-60)/14.5,0,1);
      d.star.photoMat.uniforms.uT.value=t;
      d.star.core.rotation.y=t*0.02;
      // swell then dim (red giant → death)
      const sc=0.5+smooth(sp)*1.6*(1-0.5*Math.max(0,sp-0.6)/0.4);
      d.star.grp.scale.setScalar(sc);
      // shift color to red as it dies
      const die=smooth(Math.max(0,(sp-0.55)/0.45));
      d.star.photoMat.uniforms.uCol2.value.setRGB(1.0,0.6-die*0.35,0.16);
      d.star.photoMat.uniforms.uBright.value=1.4*(1-die*0.75);
      d.star.cor.material.opacity=0.85*(1-die*0.9);
    }
    // embers gather to human
    if(embVis){
      const ed=d.embData;const g=Math.min(1,smooth((t-73)/9));
      const arr=d.emb.geometry.attributes.position.array;
      for(let i=0;i<ed.N;i++){
        for(let k=0;k<3;k++){const from=ed.rnd[i*3+k],to=ed.tgt[i*3+k];
          arr[i*3+k]=from+(to-from)*g+Math.sin(t*0.6+i)*0.15*(1-g);}
      }
      d.emb.geometry.attributes.position.needsUpdate=true;
      d.emb.material.opacity=0.9*band(t,73,85.2,0.8);
    }
    // camera: pullback then approach star then hold on embers
    if(t<62)setCam(0,0,10+ (t-50.5)*0.5,0,0,0,44);
    else if(t<74.5)setCam(0,0,16-smooth((t-62)/12)*4,0,0,0,44);
    else setCam(0,0,16,0,0,0,44);
    key.intensity=1.15;
  } else {key.intensity=1.15;}

  // ---------------- D: big bang / H+He ----------------
  if(gD.visible){
    const p=loc(t,'D');const d=gD.userData;
    // glow fades from bright to dark over first cue
    d.glow.material.opacity=0.9*(1-smooth(clamp((t-85.2)/9,0,1)));
    d.glow.scale.setScalar(120+p*80);
    // drift H/He clouds slowly
    [d.Hc,d.Hec].forEach((c,ci)=>{const arr=c.pts.geometry.attributes.position.array,base=c.base;
      for(let i=0;i<base.length;i+=3){arr[i]=base[i]+Math.sin(t*0.15+i)*0.4;arr[i+1]=base[i+1]+Math.cos(t*0.12+i)*0.4;arr[i+2]=base[i+2];}
      c.pts.geometry.attributes.position.needsUpdate=true;});
    d.Hc.pts.material.opacity=0.85*band(t,92,125.5,1.0);
    d.Hec.pts.material.opacity=0.85*band(t,100,125.5,1.0);
    // dead-universe cold hue via slight camera
    const q=smooth(p);
    setCam(Math.sin(t*0.03)*4,0,40-q*6,0,0,0,50);
  }

  // ---------------- E: forge ----------------
  if(gE.visible){
    const d=gE.userData;d.star.photoMat.uniforms.uT.value=t;
    // C13-14 (125.5-150.6): cut-away core, push in
    // C15 (150.6-165.8): red giant swell
    // C16 (165.8-174.25): helium collide
    const giant=t>=150.65;const collide=t>=165.82;
    d.star.grp.visible=!collide;d.core.visible=false;
    d.he.visible=collide;
    d.star.core.rotation.y=t*0.02;
    if(!collide){
      // swell for red giant
      const sw=giant?(1+smooth((t-150.65)/15)*1.9):1.0;
      d.star.grp.scale.setScalar(sw);
      d.star.photoMat.uniforms.uCol2.value.setRGB(1.0,giant?0.5:0.6,0.16);
      d.star.photoMat.uniforms.uBright.value=1.4;
      d.star.cor.material.opacity=0.85;
    }
    if(collide){
      const cd=d.heData;
      cd.forEach((h,i)=>{const a=h.a+t*h.sp;const r=h.rr*(0.7+0.3*Math.sin(t*1.5+h.ph));
        h.m.position.set(Math.cos(a)*r,h.y+Math.sin(t*1.2+h.ph)*0.5,Math.sin(a)*r);});
    }
    // camera: push into core, then pull back for giant, then macro for collide
    if(t<150.65)setCam(0,0,14-smooth((t-125.5)/25)*7,0,0,0,44);
    else if(t<165.82){const s=smooth((t-150.65)/15);setCam(0,0,7+s*20,0,0,0,46);}
    else setCam(0,0,9,0,0,0,40);
  }

  // ---------------- F: triple-alpha ----------------
  if(gF.visible){
    const d=gF.userData;
    // C17 (174.25-182.6): 3 He shown, combine into carbon (concept)
    // C18 (182.6-197): 2 He form fragile Be-8, breaks
    // C19 (197-214.6): 3rd He near-miss, "shouldn't exist"
    const t17=clamp((t-174.25)/8.4,0,1);
    const t18=clamp((t-182.64)/14.4,0,1);
    const t19=clamp((t-197.09)/17.5,0,1);
    // positions
    let show3=t<182.64;
    if(show3){
      // 3 helium approaching center, combine at end of C17
      const app=smooth(t17);
      d.he1.position.set(-3.5+app*3.0,1.6-app*1.6,0);
      d.he2.position.set(3.5-app*3.0,1.6-app*1.6,0);
      d.he3.position.set(0,-3.2+app*3.2,0);
      d.he1.visible=d.he2.visible=d.he3.visible=true;d.carbon.visible=app>0.9;d.be.material.opacity=0;
      d.carbon.position.set(0,0,0);d.carbon.scale.setScalar(smooth(Math.max(0,(t17-0.85)/0.15)));
    } else {
      // C18/C19: two helium form Be-8 (fragile), pulse-break; 3rd tries and misses
      const cyc=(t-182.64)% 3.0;const merged=cyc<1.4;
      d.he1.visible=d.he2.visible=true;d.he3.visible=t>=197.09;d.carbon.visible=false;
      const m=merged?smooth(cyc/1.0):0;
      d.he1.position.set(-1.4+m*1.0,0.2,0);
      d.he2.position.set(1.4-m*1.0,0.2,0);
      // Be-8 glow pulses then breaks (opacity spikes then drops)
      d.be.position.set(0,0.2,0);
      d.be.material.opacity=merged?Math.max(0,Math.sin(cyc/1.4*Math.PI))*0.9:0;
      if(!merged){d.he1.position.x=-1.4-Math.min(2,(cyc-1.4)*3);d.he2.position.x=1.4+Math.min(2,(cyc-1.4)*3);}
      // 3rd helium tries to come in but Be breaks before (near miss)
      if(t>=197.09){const tc=(t-197.09)%3.0;const in3=smooth(clamp(tc/1.3,0,1));
        d.he3.position.set(0,4-in3*3.6,0);d.he3.visible=true;
        if(tc>1.35)d.he3.position.y=4;} // resets = miss
    }
    d.he1.rotation.z=t*0.5;d.he2.rotation.z=-t*0.5;d.he3.rotation.z=t*0.4;d.carbon.rotation.z=t*0.3;
    setCam(0,0,10-smooth(clamp((t-174.25)/40,0,1))*1.5,0,0,0,42);
  }

  // ---------------- G: Hoyle energy ladder ----------------
  if(gG.visible){
    const d=gG.userData;
    d.sil.rotation.y=Math.sin(t*0.15)*0.1;
    // the 7.65 bar: dashed/dim during prediction (C24 274-290), bright when measured (C25 290+)
    const measured=t>=289.94;
    const predict=t>=274.18&&t<289.94;
    d.bars.forEach(b=>{
      if(b.hoyle){
        if(measured){b.ln.material.opacity=0.95;b.ln.material.color.setHex(0xffd27a);}
        else if(predict){b.ln.material.opacity=0.35+0.35*Math.abs(Math.sin(t*3.0));b.ln.material.color.setHex(0xffb347);}
        else{b.ln.material.opacity=0.85;b.ln.material.color.setHex(0xffb347);}
      }
    });
    d.hoyleGlow.material.opacity=measured?0.85*band(t,289.94,300.6,1.0):(predict?0.15:0.3);
    d.ladder.rotation.y=Math.sin(t*0.08)*0.06;
    // camera: hold; slight push toward ladder when bar highlighted, big push on reveal
    const rev=smooth(clamp((t-289.94)/4,0,1));
    setCam(0.5+rev*1.4,0.3,13-smooth(clamp((t-214.6)/80,0,1))*2-rev*3,2.5,0.2,0,44);
  }

  // ---------------- H: resonance curve + slit ----------------
  if(gH.visible){
    const d=gH.userData;
    // C26 (300.6-313.7): marker slides off peak, curve/output collapse implied
    // C27 (313.7-331.2): consequences
    // C28 (331.2-345.5): narrow slit, life slips through
    const t26=clamp((t-300.56)/13.1,0,1);
    // marker slides from peak (x=0) to off-peak
    const mx=Math.sin(t*0.8)*3.0*smooth(t26);
    const my=Math.exp(-mx*mx*3.2)*3.2-2.2;
    d.marker.position.set(mx,my,0);
    d.marker.material.color.setRGB(1,1-Math.abs(mx)/3*0.7,0.5-Math.abs(mx)/3*0.4);
    d.curve.material.opacity=1;d.curve.visible=t<331.24;d.marker.visible=t<331.24;
    // slit + life particles for C28
    d.slit.visible=t>=331.24;
    if(t>=331.24){
      const sd=d.slitData;const arr=d.slit.geometry.attributes.position.array;
      for(let i=0;i<sd.N;i++){const life=(t*0.18+sd.ph[i])%1;
        arr[i*3]=-6+life*12;
        // squeeze through slit at x~0
        const sq=1-Math.exp(-arr[i*3]*arr[i*3]*0.5);
        arr[i*3+1]=(sd.ph[i]-0.5)*3*sq*0.4+Math.sin(t+i)*0.1;
        arr[i*3+2]=(sd.ph[i]-0.5)*2*sq;}
      d.slit.geometry.attributes.position.needsUpdate=true;
    }
    setCam(0,0,9-smooth(clamp((t-300.56)/44,0,1))*1.5,0,-0.4,0,46);
  }

  // ---------------- I: seeding ----------------
  if(gI.visible){
    const d=gI.userData;d.star.photoMat.uniforms.uT.value=t;
    // C29-30 (345.5-368.4): red giant pulsates, blows shell
    // C31 (368.4-380.3): supernova flash for big star
    // C32 (380.3-391.9): dark dust cloud
    const pulse=1+Math.sin(t*2.2)*0.05+Math.sin(t*0.7)*0.03;
    const shellStart=354.0;
    d.star.grp.scale.setScalar((1.4)*pulse);
    d.star.photoMat.uniforms.uCol2.value.setRGB(1.0,0.48,0.16);
    // shell expansion
    const sd=d.shellData;const arr=d.shell.geometry.attributes.position.array;
    const ex=Math.max(0,(t-shellStart));
    for(let i=0;i<sd.N;i++){const r=3+ex*sd.sp[i]*1.1;
      arr[i*3]=sd.dir[i*3]*r;arr[i*3+1]=sd.dir[i*3+1]*r;arr[i*3+2]=sd.dir[i*3+2]*r;}
    d.shell.geometry.attributes.position.needsUpdate=true;
    d.shell.material.opacity=0.9*band(t,354,392,1.5);
    // supernova flash C31
    const fl=band(t,368.4,373.5,0.6);d.flash.material.opacity=fl*Math.max(0,1-((t-369.5)/3));
    d.flash.scale.setScalar(40+fl*120);
    d.star.grp.visible=t<380.5;
    // dark dust cloud
    d.dust.material.opacity=0.7*band(t,380,392,1.2);
    d.dust.scale.setScalar(70+smooth(clamp((t-380)/12,0,1))*40);
    setCam(Math.sin(t*0.05)*3,1.5,20+smooth(clamp((t-345.5)/46,0,1))*8,0,0,0,48);
  }

  // ---------------- J: dust cloud fly-through ----------------
  if(gJ.visible){
    const d=gJ.userData;const sd=d.sootData;
    const arr=d.soot.geometry.attributes.position.array,base=sd.base;
    // fly-through: shift z with t, wrap
    const fly=(t-391.9)*3.2;
    for(let i=0;i<sd.N;i++){
      let z=base[i*3+2]+fly;z=((z+45)%90)-45;
      arr[i*3]=base[i*3]+Math.sin(t*0.1+sd.ph[i])*1.2;
      arr[i*3+1]=base[i*3+1]+Math.cos(t*0.08+sd.ph[i])*1.0;
      arr[i*3+2]=z;
    }
    d.soot.geometry.attributes.position.needsUpdate=true;
    d.soot.material.opacity=0.85*band(t,392,427.3,1.2);
    d.org.children.forEach((r,i)=>{r.rotation.x=t*0.2+i;r.rotation.y=t*0.15;r.material.opacity=band(t,405,427.3,1.0);r.material.transparent=true;});
    // diamond + bucky appear at C35 (410-427)
    const dbf=band(t,410,427.3,1.0);
    d.diamond.visible=dbf>0.02;d.bucky.visible=dbf>0.02;
    d.diamond.rotation.x=t*0.4;d.diamond.rotation.y=t*0.3;d.diamond.material.opacity=0.85*dbf;
    d.bucky.rotation.y=t*0.35;d.bucky.rotation.x=t*0.2;
    d.bucky.children.forEach(c=>{if(c.material){c.material.opacity=dbf;c.material.transparent=true;}});
    setCam(Math.sin(t*0.06)*2,Math.cos(t*0.05)*1.5,18,0,0,-4,52);
  }

  // ---------------- K: new solar system ----------------
  if(gK.visible){
    const d=gK.userData;d.sun.photoMat.uniforms.uT.value=t;
    // C36 (427.3-443.7): cloud collapse → sun ignites → disk → earth condenses
    // C37 (443.7-454.7): question, element table hint (kept minimal, focus earth)
    const ign=smooth(clamp((t-428)/8,0,1));
    d.sun.grp.scale.setScalar(0.3+ign*1.0);
    d.sun.photoMat.uniforms.uBright.value=0.6+ign*0.8;
    d.sun.cor.material.opacity=0.85*ign;
    // disk orbit
    const dd=d.diskData;const arr=d.disk.geometry.attributes.position.array;
    for(let i=0;i<dd.N;i++){const a=dd.a0[i]+t*dd.sp[i];const r=dd.rr[i];
      arr[i*3]=Math.cos(a)*r;arr[i*3+1]=dd.yy[i];arr[i*3+2]=Math.sin(a)*r;}
    d.disk.geometry.attributes.position.needsUpdate=true;
    d.disk.material.opacity=0.8*band(t,428,454.7,1.0);
    // earth condenses at C36 late
    const ef=band(t,438,454.7,0.8);d.earth.visible=ef>0.02;
    const ea=t*0.4;d.earth.position.set(Math.cos(ea)*9,0,Math.sin(ea)*9);d.earth.rotation.y=t*0.3;
    d.earth.material.emissiveIntensity=0.3+0.4*(1-ef);
    // camera: pull back over disk then push toward earth
    if(t<442)setCam(0,8-smooth(clamp((t-427.3)/15,0,1))*3,26-smooth(clamp((t-427.3)/15,0,1))*4,0,0,0,48);
    else{const s=smooth(clamp((t-442)/12,0,1));const ea2=t*0.4;
      setCam(Math.cos(ea2)*9*0.6,3-s*1.5,20-s*8,Math.cos(ea2)*9,0,Math.sin(ea2)*9,46);}
  }

  // ---------------- L: carbon bonds ----------------
  if(gL.visible){
    const d=gL.userData;
    // C38 (454.7-467.4): tetra 4 arms
    // C39 (467.4-479.8): chain/benzene/lattice net
    // C40 (479.8-504): DNA
    const showTetra=t<468;const showNet=t>=467.4&&t<480.5;const showDNA=t>=479.8;
    d.tetra.visible=showTetra;d.net.visible=showNet;d.dna.visible=showDNA;
    d.tetra.rotation.y=t*0.4;d.tetra.rotation.x=Math.sin(t*0.2)*0.3;
    if(showNet){d.ring.rotation.z=t*0.3;d.chain.rotation.z=Math.sin(t*0.2)*0.2;d.chain.position.y=1.6;d.lat.rotation.y=t*0.3;d.net.rotation.y=Math.sin(t*0.1)*0.15;}
    if(showDNA){d.dna.rotation.y=t*0.35;d.dna.position.y=Math.sin(t*0.15)*0.2;}
    // camera
    if(showTetra)setCam(0,0,7-smooth(clamp((t-454.7)/13,0,1))*1,0,0,0,44);
    else if(showNet)setCam(0,0,12,0,0,0,50);
    else setCam(4,0,10,0,0,0,50);
  }

  // ---------------- M: carbon cycle ----------------
  if(gM.visible){
    const d=gM.userData;
    // breathing figure fades in early (C41 504-511)
    d.fig.material.opacity=0.55*band(t,504,556,1.5);
    d.fig.position.x=-9;
    // atom travels the ring loop; loop position by t (guard: loopT >= 0)
    const nodes=d.nodes;const NN=nodes.length;
    let loopT=Math.max(0,(t-511.28))*0.11;loopT=loopT-Math.floor(loopT);
    const seg=loopT*NN;let i0=Math.floor(seg)%NN;if(i0<0)i0+=NN;const i1=(i0+1)%NN;const f=seg-Math.floor(seg);
    const a=nodes[i0],b=nodes[i1];
    d.atom.position.set(a.x+(b.x-a.x)*f,a.y+(b.y-a.y)*f,a.z+(b.z-a.z)*f);
    d.atomGlow.position.copy(d.atom.position);
    d.atomGlow.material.opacity=0.9*band(t,511,556,1.0);
    d.atom.visible=t>=511;d.atomGlow.visible=t>=511;
    // brighten cycle nodes so the ring reads
    d.ring.children.forEach(c=>{if(c.material&&c.material.emissiveIntensity!==undefined)c.material.emissiveIntensity=0.7+0.4*Math.sin(t*0.8+c.position.x);});
    d.ring.rotation.z=Math.sin(t*0.05)*0.05;
    setCam(-2+Math.sin(t*0.05)*1.5,0.3,15,-1,0,0,52);
  }

  // ---------------- N: human = stars, final breath ----------------
  if(gN.visible){
    const d=gN.userData;
    // C45 (556.9-570.95): figure of stars, push in
    // C46 (570.95-584): final exhale, fade to black
    d.fig.rotation.y=Math.sin(t*0.08)*0.15;
    d.fig.material.opacity=0.95*band(t,557,584,1.5);
    // final breath particles
    const bd=d.breathData;const arr=d.breath.geometry.attributes.position.array;
    const emit=t>=571;
    d.breath.visible=emit;
    if(emit){
      for(let i=0;i<bd.M;i++){const life=(t*0.1+bd.bph[i]/6.283)%1;
        arr[i*3]=1+life*10+Math.sin(t*bd.bsp[i]+bd.bph[i])*0.6;
        arr[i*3+1]=2+Math.cos(t*0.5+bd.bph[i])*1.2+life*2;
        arr[i*3+2]=Math.sin(t*0.4+bd.bph[i])*life*5;}
      d.breath.geometry.attributes.position.needsUpdate=true;
      d.breath.material.opacity=0.9*(1-smooth(clamp((t-580)/4,0,1)));
    }
    setCam(0,0,16-smooth(clamp((t-556.9)/27,0,1))*3,0,0,0,44);
  }
  }catch(err){var ed=document.getElementById('err');if(ed){ed.style.display='block';ed.textContent='SCENE ERR @t='+t.toFixed(1)+': '+(err&&err.message||err);}}

  // ---------------- global fades (open + close) ----------------
  let fade=1.0;
  fade*=smooth(clamp(t/3.5,0,1));           // fade-in from black
  fade*=smooth(clamp((TOTAL-t)/4.0,0,1));   // fade-out to black at end

  // ---------------- postprocessing uniforms ----------------
  lens.uniforms.uT.value=t;
  lens.uniforms.uFade.value=fade;
  // bloom stronger in fiery scenes
  const fiery=inSc(t,'E')||inSc(t,'I')||inSc(t,'C')&&t>=60&&t<74.5;
  bloom.strength=fiery?1.15:0.85;

  // ---------------- subtitle + chapter ----------------
  updateText(t);

  composer.render();
}

// subtitle / chapter lookup
let _lastSub=-1,_lastChap='';
function updateText(t){
  // find current cue
  let idx=0;for(let i=0;i<CUES.length;i++){if(CUES[i].t<=t+1e-6)idx=i;else break;}
  const cur=CUES[idx];
  if(idx!==_lastSub){document.getElementById('sub').textContent=cur?cur.s:'';_lastSub=idx;}
  // chapter: latest ch defined at or before t, show for ~4s after its start
  let chT=-1,chS='';for(const c of CUES){if(c.ch&&c.t<=t){chT=c.t;chS=c.ch;}}
  const chapEl=document.getElementById('chap');
  if(chS!==_lastChap){chapEl.textContent=chS;_lastChap=chS;}
  const op=chT>=0?smooth(clamp((t-chT)/0.8,0,1))*smooth(clamp((chT+4.5-t)/1.2,0,1)):0;
  chapEl.style.opacity=op;
  // subtitle opacity: hide during long gaps (>0.6s before next cue with silence) — keep simple: always visible if within cue span
  document.getElementById('sub').style.opacity=1;
}

// ============================================================
//  GSAP timeline (paused) — deterministic driver
// ============================================================
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});
const clk={t:0};
tl.to(clk,{t:TOTAL,duration:TOTAL,ease:"none",onUpdate:()=>renderAtTime(clk.t)},0);
window.__timelines["nguyen-to-cacbon"]=tl;

// initial render
renderAtTime(0);
</script>
