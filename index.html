<script>
/* ===== HFA:BEGIN — sinh tự động bởi scripts/inject-lib.mjs, ĐỪNG SỬA TAY ===== */
/* ============================================================================
 * hf-astro.js — bộ khung dùng chung cho composition Du Mục Vũ Trụ
 *
 * Trích từ các tập ĐÃ RENDER VÀ VERIFY (01–07). Trước khi có file này, mỗi tập
 * tự dựng lại cùng một đoạn code (mulberry32, ACESFilmic, composer+bloom, lens
 * pass, starfield, tra phụ đề, driver timeline) — nên bug đã sửa ở tập này lại
 * tái xuất ở tập sau. Dùng file này thay vì chép tay.
 *
 * CÁCH DÙNG: KHÔNG nạp bằng thẻ script ngoài. Preview/render server của HyperFrames
 *      không phục vụ file .js tuỳ ý trong project — nó trả về SPA shell HTML cho
 *      đường dẫn đó, browser parse "doctype html" thành lỗi cú pháp và tập chết
 *      (đã kiểm chứng: curl -D- trả về 200 text/html, 593 byte). Composition phải
 *      TỰ CHỨA. Nhúng bằng:
 *
 *          node scripts/inject-lib.mjs --html index.html
 *
 *      Lệnh này dán nội dung file này vào đầu khối code của tập, giữa hai mốc
 *      HFA:BEGIN / HFA:END. Chạy lại được nhiều lần. Định nghĩa một global: HFA.
 *      Yêu cầu three.min.js + EffectComposer/RenderPass/ShaderPass/UnrealBloomPass
 *      đã nạp trước đó.
 *
 * LUẬT TẤT ĐỊNH: file này không dùng Date.now / performance.now / Math.random /
 * requestAnimationFrame / setTimeout. Mọi thứ là hàm thuần của t hoặc của seed.
 * ========================================================================== */
(function (global) {
  'use strict';

  var HFA = {};

  /* ---- PRNG có seed ------------------------------------------------------
   * Math.random() bị cấm (render phải tất định). Mỗi cụm vật thể dùng MỘT
   * seed riêng — dùng chung một chuỗi cho hai cụm thì thêm/bớt hạt ở cụm này
   * sẽ xê dịch layout cụm kia.
   */
  HFA.mulberry32 = function (a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  /* ---- helper toán -------------------------------------------------------- */
  HFA.clamp = function (x, a, b) { return Math.min(b, Math.max(a, x)); };

  HFA.smooth = function (x) { x = HFA.clamp(x, 0, 1); return x * x * (3 - 2 * x); };

  /** Bao lồi mềm: 0 ngoài [a,b], lên/xuống mượt trong dải f giây ở hai mép. */
  HFA.band = function (t, a, b, f) {
    f = f || 0.8;
    if (t < a - f || t > b + f) return 0;
    var up = HFA.smooth((t - (a - f)) / (2 * f));
    var dn = HFA.smooth(((b + f) - t) / (2 * f));
    return Math.min(1, Math.min(up, dn));
  };

  /* ---- cửa sổ cảnh --------------------------------------------------------
   * SC = {A:[start,end], B:[...], ...} theo GIÂY THẬT (lấy từ timing.json cue.start).
   * Trả về loc(t,k) ∈ [0,1] (tiến độ trong cảnh) và inSc(t,k).
   */
  HFA.scenes = function (SC) {
    return {
      SC: SC,
      loc: function (t, k) {
        var w = SC[k];
        return Math.min(1, Math.max(0, (t - w[0]) / (w[1] - w[0])));
      },
      inSc: function (t, k) { var w = SC[k]; return t >= w[0] && t < w[1]; }
    };
  };

  /* ---- shader lens — PASS CUỐI, kiêm luôn tone mapping + mã hoá sRGB --------
   *
   * ⚠ VÌ SAO PASS NÀY PHẢI TỰ TONE MAP:
   * three.js chỉ chèn ACES + sRGB vào shader của VẬT LIỆU nó tự dựng. Một
   * ShaderMaterial thô trong ShaderPass KHÔNG được chèn — nên khi pass cuối ghi
   * ra màn hình, ảnh chưa hề được mã hoá sRGB.
   * Đo thật (xám #808080, r128): vẽ thẳng = 197, qua EffectComposer = 143.
   * Sai lệch đó là lý do các tập 01–07 ra tối hơn và sai gamma.
   *
   * Vì vậy chuỗi mới là: cảnh vẽ TUYẾN TÍNH vào target HDR (không tone map)
   * → bloom ăn giá trị HDR thật → pass này mới ACES + sRGB ở bước cuối.
   * Bloom đứng TRƯỚC tone mapping mới đúng thứ tự điện ảnh: vùng cực sáng
   * (quang cầu, đĩa bồi tụ) chưa bị nén ngọn nên quầng sáng nở tự nhiên.
   *
   * Thứ tự trong shader: CA → vignette → fade (đều ở TUYẾN TÍNH, vì chúng là
   * phơi sáng) → ACES → sRGB → grain + flash (ở không gian hiển thị, vì grain
   * phim và chớp trắng là hiện tượng của bản in, không phải của ánh sáng).
   * Grain seed theo t, KHÔNG theo đồng hồ — cùng t phải cho cùng frame.
   */
  HFA.LensShader = {
    uniforms: {
      tDiffuse: { value: null }, uT: { value: 0 }, uVig: { value: 0.34 },
      uCA: { value: 0.0015 }, uGrain: { value: 0.045 },
      uFade: { value: 1.0 }, uFlash: { value: 0.0 },
      uExposure: { value: 1.02 }, uToneMap: { value: 1.0 }
    },
    vertexShader:
      'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader: [
      'varying vec2 vUv;uniform sampler2D tDiffuse;',
      'uniform float uT,uVig,uCA,uGrain,uFade,uFlash,uExposure,uToneMap;',
      'float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}',
      // ACES — SAO CHÉP ĐÚNG bản three.js r128 dùng cho ACESFilmicToneMapping
      // (ma trận vào/ra + RRTAndODTFit + tiền tỉ lệ /0.6). KHÔNG dùng xấp xỉ
      // Narkowicz: nó sáng hơn ~4% ở vùng trung, đo được (206 vs 197 trên xám
      // giữa) và sẽ lệch với mọi tài liệu/preset tính theo three.js.
      'vec3 rrt(vec3 v){vec3 a=v*(v+0.0245786)-0.000090537;',
      '  vec3 b=v*(0.983729*v+0.4329510)+0.238081;return a/b;}',
      'vec3 aces(vec3 color){',
      '  const mat3 mIn=mat3(0.59719,0.07600,0.02840, 0.35458,0.90834,0.13383, 0.04823,0.01566,0.83777);',
      '  const mat3 mOut=mat3(1.60475,-0.10208,-0.00327, -0.53108,1.10813,-0.07276, -0.07367,-0.00605,1.07602);',
      '  color/=0.6;',
      '  color=mIn*color; color=rrt(color); color=mOut*color;',
      '  return clamp(color,0.0,1.0);}',
      // tuyến tính → sRGB, đúng công thức chuẩn (không phải pow(1/2.2) cho nhanh)
      'vec3 toSRGB(vec3 c){c=max(c,vec3(0.0));',
      '  return mix(c*12.92,1.055*pow(c,vec3(1.0/2.4))-0.055,step(vec3(0.0031308),c));}',
      'void main(){',
      '  vec2 d=vUv-0.5;float r=dot(d,d);',
      '  vec2 off=d*uCA*(1.0+r*2.2);',
      '  vec3 col;',
      '  col.r=texture2D(tDiffuse,vUv+off).r;',
      '  col.g=texture2D(tDiffuse,vUv).g;',
      '  col.b=texture2D(tDiffuse,vUv-off).b;',
      // --- còn ở TUYẾN TÍNH: vignette + fade là phơi sáng ---
      '  float vig=smoothstep(1.02,uVig,r*2.0);',
      '  col*=mix(1.0,vig,0.85);',
      '  col*=uFade;',
      // --- tone map + mã hoá hiển thị ---
      '  col=mix(col*uExposure,aces(col*uExposure),uToneMap);',
      '  col=toSRGB(col);',
      // --- không gian hiển thị: grain + chớp trắng ---
      '  float g=h(vUv*vec2(1920.0,1080.0)+fract(uT)*97.3)-0.5;',
      '  col+=g*uGrain;',
      '  col=mix(col,vec3(1.0,0.98,0.94),uFlash);',
      '  gl_FragColor=vec4(clamp(col,0.0,1.0),1.0);',
      '}'
    ].join('\n')
  };

  /* ---- dựng sân khấu ------------------------------------------------------
   * Trả về {renderer, scene, camera, composer, bloom, lens, W, H, loadTex}.
   * Ánh sáng mặc định (amb/key/rim) tắt được bằng opt.lights=false.
   */
  HFA.createStage = function (opt) {
    opt = opt || {};
    var W = opt.width || 1920, H = opt.height || 1080;
    var canvas = typeof opt.canvas === 'string'
      ? document.getElementById(opt.canvas)
      : (opt.canvas || document.getElementById('c'));

    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(1);
    renderer.setSize(W, H);
    renderer.setClearColor(opt.clearColor != null ? opt.clearColor : 0x08080a, 1);

    // Tone mapping + sRGB CỐ Ý tắt ở đây: cả hai được làm ở pass lens cuối cùng.
    // Bật ở đây thì cảnh bị nén dải TRƯỚC khi bloom nhìn thấy (quầng sáng bẹt),
    // rồi lại không được mã hoá sRGB lúc ghi ra màn hình (xem chú thích LensShader).
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.outputEncoding = THREE.LinearEncoding;

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(
      opt.fov || 46, W / H, opt.near || 0.05, opt.far || 60000);
    camera.position.set(0, 0, 60);

    if (opt.lights !== false) {
      var amb = new THREE.AmbientLight(0x232838, 0.85); scene.add(amb);
      var key = new THREE.DirectionalLight(0xffe8d2, 1.05); key.position.set(6, 4, 8); scene.add(key);
      var rim = new THREE.DirectionalLight(0x6f9cff, 0.4); rim.position.set(-8, -3, -6); scene.add(rim);
      scene.userData.lights = { amb: amb, key: key, rim: rim };
    }

    /* --- render target: MSAA + HDR -------------------------------------------
     * `antialias:true` ở trên CHỈ tác dụng lên framebuffer mặc định. Đi qua
     * EffectComposer là vẽ vào target offscreen, và target đó KHÔNG multisample
     * theo mặc định — nên cờ antialias thành vô nghĩa và mọi rìa bị răng cưa.
     * WebGLMultisampleRenderTarget (có từ r111) khôi phục MSAA thật.
     * HalfFloat giữ giá trị >1.0 để bloom ăn được highlight HDR thật.
     */
    var samples = opt.msaa != null ? opt.msaa : 4;
    var rtOpts = {
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat,
      type: opt.hdr === false ? THREE.UnsignedByteType : THREE.HalfFloatType
    };
    var rt;
    if (samples > 0 && typeof THREE.WebGLMultisampleRenderTarget === 'function') {
      rt = new THREE.WebGLMultisampleRenderTarget(W, H, rtOpts);
      rt.samples = samples;
    } else {
      rt = new THREE.WebGLRenderTarget(W, H, rtOpts);
      if (samples > 0) console.warn('[hf-astro] không có WebGLMultisampleRenderTarget — chạy không MSAA.');
    }

    var composer = new THREE.EffectComposer(renderer, rt);
    composer.addPass(new THREE.RenderPass(scene, camera));

    /* Ngưỡng bloom: cảnh giờ là HDR TUYẾN TÍNH, không còn bị nén về [0,1] như
     * trước. Highlight thật nằm TRÊN 1.0, nên ngưỡng cũ 0.62 (chỉnh cho ảnh đã
     * tone map) sẽ làm cả những vùng sáng vừa cũng loé. Mặc định nâng lên 1.0. */
    var bloom = new THREE.UnrealBloomPass(
      new THREE.Vector2(W, H),
      opt.bloomStrength != null ? opt.bloomStrength : 0.78,
      opt.bloomRadius != null ? opt.bloomRadius : 0.7,
      opt.bloomThreshold != null ? opt.bloomThreshold : (opt.hdr === false ? 0.62 : 1.0));
    composer.addPass(bloom);

    // Bản sao uniforms để hai stage không dùng chung state.
    var lensDef = {
      uniforms: THREE.UniformsUtils.clone(HFA.LensShader.uniforms),
      vertexShader: HFA.LensShader.vertexShader,
      fragmentShader: HFA.LensShader.fragmentShader
    };
    var lens = new THREE.ShaderPass(lensDef);
    lens.renderToScreen = true;
    lens.uniforms.uExposure.value = opt.exposure != null ? opt.exposure : 1.02;
    composer.addPass(lens);

    var texLoader = new THREE.TextureLoader();
    texLoader.setCrossOrigin('anonymous');
    function loadTex(path, enc) {
      var tx = texLoader.load(path);
      if (enc) tx.encoding = enc;
      tx.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return tx;
    }

    var stage = {
      renderer: renderer, scene: scene, camera: camera,
      composer: composer, bloom: bloom, lens: lens, rt: rt,
      W: W, H: H, loadTex: loadTex,
      clearColor: opt.clearColor != null ? opt.clearColor : 0x08080a
    };

    /* --- environment map (IBL) ----------------------------------------------
     * MeshStandardMaterial là vật liệu PBR: nó phản xạ MÔI TRƯỜNG. Không có
     * envMap thì kim loại và bề mặt bóng mất gần hết thông tin phản xạ, chỉ còn
     * highlight từ đèn → ra chất nhựa sơn. (Tập "Vàng" là ví dụ rõ nhất.)
     * Dựng một bầu trời tối có vài đốm sáng, nướng qua PMREM MỘT LẦN lúc khởi
     * tạo → tất định, không phụ thuộc t, mọi MeshStandardMaterial hưởng ngay
     * qua scene.environment mà không phải sửa từng vật liệu.
     */
    if (opt.environment !== false) {
      stage.environment = HFA.buildEnvironment(renderer, scene, opt.environmentSeed || 4242);
    }

    return stage;
  };

  /** Bầu trời sao mờ nướng thành envMap PMREM. Trả về texture (đã gán scene.environment). */
  HFA.buildEnvironment = function (renderer, scene, seed) {
    var pr = HFA.mulberry32(seed);
    var cv = document.createElement('canvas');
    cv.width = 512; cv.height = 256;
    var cx = cv.getContext('2d');

    // nền: gradient rất tối, hơi lạnh ở dưới, ấm nhạt ở trên (ánh sáng thiên hà)
    var gr = cx.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, '#0a0d16'); gr.addColorStop(0.5, '#070910'); gr.addColorStop(1, '#05060b');
    cx.fillStyle = gr; cx.fillRect(0, 0, 512, 256);

    // dải Ngân Hà mờ vắt ngang → cho phản xạ có hướng, tránh env phẳng lì
    var bandGr = cx.createLinearGradient(0, 96, 0, 160);
    bandGr.addColorStop(0, 'rgba(70,80,110,0)');
    bandGr.addColorStop(0.5, 'rgba(120,130,165,0.30)');
    bandGr.addColorStop(1, 'rgba(70,80,110,0)');
    cx.fillStyle = bandGr; cx.fillRect(0, 96, 512, 64);

    // vài nguồn sáng nhỏ để kim loại có điểm loé
    for (var i = 0; i < 220; i++) {
      var x = pr() * 512, y = pr() * 256, s = pr() < 0.06 ? 2.2 : 1.0;
      var b = 0.35 + pr() * 0.65;
      cx.fillStyle = 'rgba(255,252,245,' + b.toFixed(3) + ')';
      cx.fillRect(x, y, s, s);
    }

    var tex = new THREE.CanvasTexture(cv);
    tex.mapping = THREE.EquirectangularReflectionMapping;
    tex.encoding = THREE.sRGBEncoding;

    var pmrem = new THREE.PMREMGenerator(renderer);
    pmrem.compileEquirectangularShader();
    var env = pmrem.fromEquirectangular(tex).texture;
    pmrem.dispose();
    tex.dispose();

    scene.environment = env;   // KHÔNG gán scene.background — nền do starfield lo
    return env;
  };

  /* ---- CHỌN MÀU SAO CHO SỐNG SÓT QUA ACES ---------------------------------
   * Bài học đo được ở tập 08, tốn 3 vòng sửa mới ra. Đọc trước khi chọn bảng màu.
   *
   * ACES nén mạnh vùng sáng. Càng đẩy độ sáng lên, sắc càng bị kéo về trắng/xám.
   * Nên SẮC PHẢI ĐẾN TỪ TỈ LỆ GIỮA CÁC KÊNH, không đến từ độ sáng.
   *
   * Đo thật (bão hoà còn lại sau khi qua chuỗi ACES của three.js r128):
   *   (0.42, 0.60, 1.05)  → còn 11–25%  → ra XÁM BÊ TÔNG. Đừng dùng.
   *   (0.10, 0.32, 1.00)  → còn 37–67%  → ra LAM THẬT.
   *
   * Quy tắc rút ra:
   *   - Kênh yếu nên ≤ 0.2× kênh mạnh. Nâng kênh yếu lên là giết sắc.
   *   - Kênh mạnh giữ quanh 1.0, đừng hơn.
   *   - Muốn SÁNG hơn thì tăng emissive (vượt ngưỡng bloom), ĐỪNG nâng kênh yếu.
   *
   * Hệ quả cho chữ và sơ đồ: bloom làm NHOÈ MẤT NÉT CHỮ. Nét biểu đồ và typo phải
   * để DƯỚI ngưỡng bloom (<1.0). Muốn chữ rõ hơn thì tăng độ dày nét, không tăng
   * emissive.
   *
   * Chống cháy trắng: giữ diện tích có luminance >0.85 (sau tonemap) dưới ~12%
   * khung. Cần một vùng sáng rộng thì đẩy bằng SỐ LƯỢNG hạt nhỏ, đừng đẩy bằng
   * độ sáng của hạt lớn.
   */
  HFA.saturationAfterACES = function (r, g, b) {
    // Ước lượng nhanh xem một màu tuyến tính có giữ được sắc sau ACES không.

  /* ---- BỐN LỖI ĐÃ LÀM CHẾT HÀNG CHỤC CẢNH — đọc trước khi dựng tập mới -----
   *

   * thời gian. Chúng chỉ lộ ra khi render ảnh và NHÌN. Rút từ tập 09–12.
   *
   * 1. BIẾN BỊ CHE (shadowing).
   *    Tập "nước": một mesh tên `grain` bị che bởi `var grain = 0.040` (lượng
   *    grain của lens) khai báo ngay trong renderAtTime → mọi cảnh từ S19 trở đi
   *    chết. Đặt tên mesh khác hẳn tên biến cục bộ; đối chiếu danh sách biến
   *    top-level với biến trong renderAtTime trước khi giao.
   *

   *    đó CHỈ có `uOp`. Ném TypeError, 17 cảnh liên tiếp đứng hình. Kiểm API
   *    thư viện trước khi gọi, đừng đoán tên uniform.
   *
   * 3. SAI TỈ LỆ SÂN KHẤU.
   *    Tập "nước": nguyên tử r=1.30 đặt trên mặt cầu r=140 với camera cách 2.7
   *    → hai quả cầu phủ kín khung, ống liên kết thành tấm phẳng. Tính trước
   *    tỉ lệ vật thể so với khoảng cách camera, đừng chỉnh mò sau.
   *
   * 4. CHỮ QUÁ NHỎ KHÔNG ĐỌC NỔI.

  /* ---- starfield màu theo nhiệt độ ----------------------------------------

   * Camera bay ra ngoài quả cầu sao → nhìn thấy "quả bóng vũ trụ" bo tròn. Đây là
   * lỗi đã xảy ra thật. Truyền opt.maxCamDist để bật cảnh báo tự động.
   * Hằng số trong gl_PointSize phải BẰNG ĐÚNG radius, nếu không sao đổi độ to khi

    if (opt.maxCamDist && R <= opt.maxCamDist * 1.5) {
      console.warn('[hf-astro] starfield radius ' + R + ' quá nhỏ so với camera xa nhất ' +
        opt.maxCamDist + ' — sẽ lộ "quả bóng vũ trụ". Tăng radius lên >' +

      var tt = pr(), c = new THREE.Color();

      else if (tt < 0.5) c.setRGB(0.85, 0.9, 1.0);
      else if (tt < 0.8) c.setRGB(0.9, 0.92, 1.0);
      else c.setRGB(0.8, 0.82, 0.95);

    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    g.setAttribute('aS', new THREE.BufferAttribute(siz, 1));

    var m = new THREE.ShaderMaterial({
      uniforms: { uOp: { value: 1 } },
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      vertexShader:
        'attribute float aS;attribute vec3 color;varying vec3 vC;' +
        'void main(){vC=color;vec4 mv=modelViewMatrix*vec4(position,1.0);' +
        'gl_PointSize=aS*(' + R.toFixed(1) + '/-mv.z);gl_Position=projectionMatrix*mv;}',
      fragmentShader:

        'void main(){vec2 d=gl_PointCoord-0.5;float r=length(d);' +

  /* ---- TÍCH LUỸ ĐA MẪU: khử răng cưa + motion blur thật -------------------
   *
   * Chỉ làm được vì renderAtTime(t) là HÀM THUẦN, không trạng thái: gọi lại với
   * t nào cũng cho đúng kết quả của t đó. Render offline nên được phép trả giá
   * bằng thời gian để đổi lấy chất lượng — đây là thứ engine realtime không có.
   *
   * Mỗi frame xuất ra lấy N mẫu:
   *   - t rải đều trong khoảng 1/fps      → MOTION BLUR thật theo quỹ đạo
   *   - camera lệch dưới-một-pixel        → SUPERSAMPLING, khử cả răng cưa
   *     shader/specular mà MSAA không xử lý được

   *

      // nếu không màn hình đen (không pass nào ghi ra nữa).
      stage.accum = null;
      stage.composer.renderToScreen = true;
      return stage;

     * ⚠ PHẢI đặt trên COMPOSER, không phải trên pass: EffectComposer.render()
     * gán lại pass.renderToScreen mỗi frame theo công thức
     *   pass.renderToScreen = composer.renderToScreen && làPassCuốiCùng
     * nên mọi thiết lập trực tiếp lên lens.renderToScreen đều bị xoá. (Đo được:

    var quadMat = new THREE.ShaderMaterial({
      uniforms: { tSrc: { value: null }, uWeight: { value: 1 / N } },

      uniforms: { tSrc: { value: accumRT.texture } },
      depthTest: false, depthWrite: false,
      vertexShader: 'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}',
      fragmentShader: 'varying vec2 vUv;uniform sampler2D tSrc;' +
        'void main(){gl_FragColor=vec4(texture2D(tSrc,vUv).rgb,1.0);}'
    });

    outScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), outMat));

      quadMat: quadMat, outScene: outScene

  /* Vị trí lệch subpixel — chuỗi Halton (2,3): phân bố đều hơn ngẫu nhiên,

  HFA.renderFrame = function (stage, renderAtTime, t) {

    var dt = 1 / acc.fps;

    r.clear(true, true, true);

      acc.quadMat.uniforms.tSrc.value = stage.composer.readBuffer.texture;
      r.autoClear = false;
      r.setRenderTarget(acc.rt);
      r.render(acc.quadScene, acc.quadCam);
      r.setRenderTarget(null);
      r.autoClear = prevAutoClear;

    r.setClearColor(stage.clearColor, 1);
    r.render(acc.outScene, acc.quadCam);   // xuất ra màn hình

 {t:66.52,s:"Tôi nói câu đó ra mà chính tôi thấy nó vô"},
 {t:69.36,s:"lý."},
 {t:69.57,s:"Cả chương sau tôi sẽ dành để nói tại sao"},
 {t:72.3,s:"nó không vô lý."},
 {t:75.33,s:"Chuyện bắt đầu vào đầu những năm sáu mươi,"},
 {t:77.93,s:"khi các đài thiên văn vô tuyến bắt đầu"},
 {t:80.29,s:"quét bầu trời và ghi lại những nơi phát ra"},
 {t:82.89,s:"sóng radio mạnh."},
 {t:83.88,s:"Phần lớn các nguồn ấy là những đám mây khí"},
 {t:86.69,s:"lớn, hoặc là tàn tích của những vụ nổ,"},
 {t:89.23,s:"những thứ trải rộng trên bầu trời thành"},
 {t:91.84,s:"một vệt."},
 {t:92.37,s:"Nhưng có vài nguồn thì kỳ quặc."},
 {t:94.57,s:"Chúng phát ra sóng radio dữ dội, và khi"},
 {t:97.25,s:"người ta chĩa kính quang học vào đúng tọa"},
 {t:100.07,s:"độ, cái hiện ra chỉ là một điểm."},
 {t:102.27,s:"Một chấm sắc nét."},
 {t:103.79,s:"Y hệt một ngôi sao."},
 {t:105.99,s:"Người ta đặt cho chúng cái tên tạm bợ nhất"},
 {t:108.99,s:"có thể: nguồn vô tuyến gần giống sao."},
 {t:111.64,s:"Trong tiếng Anh là qua-di ste-la."},
 {t:114.68,s:"Về sau rút ngắn lại thành quasar."},
 {t:117.3,s:"Cái tên ấy, thật ra, là một lời thú nhận"},
 {t:120.31,s:"không biết."},
 {t:121.14,s:"Vì nếu là sao, tại sao quang phổ của chúng"},
 {t:123.91,s:"không đọc được?"},
 {t:126.4,s:"Tôi cần dừng lại giải thích chỗ này, vì cả"},
 {t:129.16,s:"câu chuyện xoay quanh nó."},
 {t:130.8,s:"Khi tôi tách ánh sáng của một ngôi sao ra"},
 {t:133.16,s:"thành dải màu, tôi không thấy một dải liền"},
 {t:135.57,s:"mượt."},
 {t:135.86,s:"Tôi thấy những vạch tối nằm ở những vị trí"},
 {t:138.63,s:"cố định."},
 {t:139.16,s:"Mỗi nguyên tố để lại một bộ vạch riêng,"},
 {t:142.02,s:"như dấu vân tay."},
 {t:143.19,s:"Hydro có bộ vạch của hydro, không lẫn với"},
 {t:147.4,s:"aai."},
 {t:147.81,s:"Bộ vạch ấy không thay đổi."},
 {t:149.56,s:"Trong phòng thí nghiệm ở Trái Đất, trong"},
 {t:152.61,s:"lòng một ngôi sao cách đây nghìn năm ánh"},
 {t:155.66,s:"sáng, hydro vẫn là hydro."},
 {t:157.56,s:"Nhưng quang phổ của những chấm sáng kỳ"},
 {t:159.75,s:"quặc kia thì không khớp với bất cứ nguyên"},
 {t:162.12,s:"tố nào."},
 {t:162.52,s:"Các vạch nằm ở những chỗ không nguyên tố"},
 {t:165.2,s:"nào được phép nằm."},
 {t:166.4,s:"Suốt mấy năm, người ta nghĩ mình vừa tìm"},
 {t:168.86,s:"ra một dạng vật chất chưa từng biết."},
 {t:171.08,s:"Một loại sao mới, có hoá học riêng."},
 {t:174.62,s:"Rồi năm 1963, một nhà thiên văn người Hà"},
 {t:177.76,s:"Lan tên Mác-ten Sờ-mít ngồi nhìn tấm quang"},
 {t:181.06,s:"phổ của một nguồn mang số hiệu ba xê hai"},
 {t:184.21,s:"bảy ba, và ông nhận ra chuyện khác hẳn."},
 {t:187.27,s:"Các vạch ấy là hydro."},
 {t:189.06,s:"Vẫn đúng bộ vạch quen thuộc, vẫn đúng"},
 {t:191.61,s:"khoảng cách giữa chúng, đúng tỉ lệ."},
 {t:194.02,s:"Chỉ là toàn bộ bộ vạch đã bị trượt về phía"},
 {t:196.98,s:"đỏ."},
 {t:197.19,s:"Trượt rất xa."},
 {t:198.98,s:"Mà trong một vũ trụ đang giãn ra, trượt về"},
 {t:201.61,s:"phía đỏ nghĩa là đang lùi xa."},
 {t:203.42,s:"Trượt càng nhiều thì càng xa."},
 {t:205.82,s:"Con số Sờ-mít đọc ra hôm đó đặt cái chấm"},
 {t:209.04,s:"nhỏ ấy cách chúng ta hơn hai tỉ năm ánh"},
 {t:212.19,s:"sáng."},
 {t:214.59,s:"Và ngay khoảnh khắc đó, bài toán lật"},
 {t:217.27,s:"ngược."},
 {t:217.72,s:"Không phải vì nó lạ mà nó khó hiểu."},
 {t:220.05,s:"Nó ở xa hơn gần như mọi thứ người ta từng"},
 {t:223.24,s:"đo."},
 {t:223.47,s:"Ở khoảng cách đó, các thiên hà mờ tới mức"},
 {t:226.46,s:"phải phơi sáng rất lâu mới hiện lên."},
 {t:229.08,s:"Còn cái chấm này thì sáng tới mức một kính"},
 {t:231.65,s:"thiên văn cỡ nhỏ trong sân sau cũng bắt"},
 {t:234.03,s:"được nó."},
 {t:234.52,s:"Nghĩa là nó không phải một ngôi sao."},
 {t:236.62,s:"Không ngôi sao nào cháy nổi như thế."},
 {t:239.22,s:"Người ta vừa nhìn thấy một thứ hoàn toàn"},
 {t:241.91,s:"khác, và chưa aai biết thứ đó là gì."},
 {t:244.33,s:"Câu hỏi đầu tiên mà aai cũng hỏi là: nó"},
 {t:247.09,s:"lấy năng lượng ở đâu?"},
 {t:248.58,s:"Và câu trả lời quen thuộc nhất, phản ứng"},
 {t:251.37,s:"hạt nhân, không dùng được."},
 {t:253.19,s:"Tôi muốn giải thích tại sao không dùng"},
 {t:255.72,s:"được, vì đó là chỗ trực giác của tôi bị bẻ"},
 {t:258.51,s:"gãy."},
 {t:258.78,s:"Một ngôi sao sống bằng cách ép các hạt"},
 {t:261.45,s:"nhân hydro dính vào nhau thành helium."},
 {t:264.13,s:"Khi chúng dính lại, sản phẩm nhẹ hơn tổng"},
 {t:267.22,s:"các phần gộp lại một chút."},
 {t:269.18,s:"Chút hụt đó thoát ra thành năng lượng."},
 {t:272.01,s:"Chút đó là bao nhiêu?"},
 {t:273.31,s:"Khoảng bảy phần nghìn."},
 {t:274.94,s:"Không phẩy bảy phần trăm khối lượng."},
 {t:277.39,s:"Mặt Trời đốt bốn triệu tấn vật chất mỗi"},
 {t:280.09,s:"giây theo kiểu đó."},
 {t:281.33,s:"Bảy phần nghìn nghe thì bé, nhưng nó đủ để"},
 {t:284.22,s:"thắp một ngôi sao trong mười tỉ năm."},
 {t:286.7,s:"Vấn đề là nó không đủ cho cái chấm sáng"},
 {t:289.12,s:"kia."},
 {t:289.37,s:"Dù tôi có nhét bao nhiêu ngôi sao vào một"},
 {t:292.14,s:"vùng nhỏ cỡ hệ Mặt Trời, chúng cũng không"},
 {t:294.91,s:"cháy ra nổi từng ấy ánh sáng."},
 {t:296.87,s:"Và nếu chen nhau tới mức đó, chúng sẽ va"},
 {t:299.88,s:"vào nhau trước khi kịp cháy."},
 {t:303.48,s:"Cái làm cho quasar sáng không phải lửa."},
 {t:306.51,s:"Là độ cao."},
 {t:308.13,s:"Tôi biết nghe lạ, nên để tôi kéo nó về mặt"},
 {t:311.13,s:"đất trước."},
 {t:311.84,s:"Khi tôi thả một hòn đá từ trên cao xuống,"},
 {t:314.5,s:"nó rơi, nó đập vào sàn, và nó phát ra một"},
 {t:317.17,s:"tiếng động."},
 {t:317.88,s:"Tiếng động đó là năng lượng."},
 {t:320.34,s:"Năng lượng đó không do hòn đá tự chế ra."},
 {t:323.33,s:"Nó đến từ việc hòn đá vừa mất độ cao."},
 {t:326.28,s:"Càng thả từ cao, tiếng đập càng lớn."},
 {t:329.12,s:"Đơn giản vậy thôi."},
 {t:330.53,s:"Hấp dẫn không chế tạo năng lượng."},
 {t:332.66,s:"Nó thu thuế trên mỗi mét rơi xuống."},
 {t:335.5,s:"Bây giờ thay cái sàn nhà bằng một hố đen"},
 {t:338.5,s:"nặng bằng một tỉ Mặt Trời."},
 {t:341.45,s:"Cái giếng hấp dẫn quanh một vật như thế"},
 {t:343.94,s:"sâu tới mức vật chất rơi vào đó không rơi"},
 {t:346.55,s:"vài mét."},
 {t:347.06,s:"Nó rơi qua một độ dốc mà tới cuối đường,"},
 {t:350.13,s:"tốc độ của nó đạt phần đáng kể của tốc độ"},
 {t:353.27,s:"ánh sáng."},
 {t:353.96,s:"Nhưng vật chất không rơi thẳng vào."},
 {t:356.38,s:"Đó là chi tiết quan trọng nhất của cả tập"},
 {t:359.74,s:"này, và nó là lý do quasar tồn tại."},
 {t:362.6,s:"Mọi thứ trong vũ trụ đều đang quay quanh"},
 {t:365.42,s:"cái gì đó."},
 {t:366.13,s:"Đám khí trôi về phía hố đen cũng mang theo"},
 {t:368.81,s:"chuyển động ngang của nó."},
 {t:370.4,s:"Nên thay vì lao thẳng xuống, nó bị cuốn"},
 {t:373.78,s:"vòng quanh, và dẹt dần ra thành một cái"},
 {t:377.16,s:"đĩa."},
 {t:377.51,s:"Một cái đĩa khí khổng lồ, xoáy quanh một"},
 {t:380.1,s:"cái miệng không đáy."},
 {t:381.4,s:"Và trong cái đĩa đó, vòng khí phía trong"},
 {t:384.06,s:"quay nhanh hơn vòng phía ngoài."},
 {t:386.13,s:"Chúng cọ vào nhau."},
 {t:388,s:"Chúng kéo lê nhau."},
 {t:389.39,s:"Ma sát."},
 {t:390.85,s:"Ma sát trên quy mô đó không làm ấm lên."},
 {t:393.85,s:"Nó nung đĩa khí lên hàng triệu độ, và ở"},
 {t:396.69,s:"nhiệt độ ấy khí không còn phát ra ánh sáng"},
 {t:399.75,s:"nhìn thấy nữa."},
 {t:400.77,s:"Nó phát tia cực tím."},
 {t:402.71,s:"Nó phát tia X."},
 {t:404.6,s:"Cái đĩa ấy là thứ tôi thấy."},
 {t:406.44,s:"Không phải hố đen."},
 {t:407.96,s:"Hố đen thì đen, và nó luôn đen."},
 {t:410.97,s:"Cái sáng rực là bữa ăn đang bị xé nhỏ ngay"},
 {t:414.41,s:"trước miệng nó."},
 {t:417.14,s:"Nhưng làm sao biết vùng phát sáng ấy nhỏ?"},
 {t:419.42,s:"Không kính thiên văn nào phóng to nổi một"},
 {t:422.1,s:"chấm ở cách hai tỉ năm ánh sáng thành"},
 {t:424.52,s:"hình."},
 {t:424.85,s:"Câu trả lời nằm ở chỗ tôi không ngờ tới."},
 {t:428.08,s:"Nó nằm ở nhịp nhấp nháy."},
 {t:430.43,s:"Độ sáng của quasar không đứng yên."},
 {t:432.54,s:"Có cái thay đổi rõ rệt trong vài tháng."},
 {t:435.44,s:"Có cái đổi trong vài ngày."},
 {t:438.1,s:"Có cái đổi trong vài giờ."},
 {t:440.34,s:"Và một vật không thể thay đổi độ sáng"},
 {t:442.85,s:"nhanh hơn thời gian ánh sáng cần để đi từ"},
 {t:445.62,s:"đầu này sang đầu kia của nó."},
 {t:447.52,s:"Lý do rất cơ học."},
 {t:449.1,s:"Nếu toàn bộ vật sáng lên cùng một lúc, ánh"},
 {t:452.34,s:"sáng từ mép xa vẫn tới sau ánh sáng từ mép"},
 {t:455.58,s:"gần."},
 {t:455.89,s:"Cú sáng bị nhoè ra, kéo dài đúng bằng bề"},
 {t:458.56,s:"ngang của vật tính theo thời gian ánh"},
 {t:461.04,s:"sáng."},
 {t:461.37,s:"Một vật rộng một năm ánh sáng thì không"},
 {t:464.06,s:"thể chớp trong một ngày."},
 {t:465.72,s:"Nó sẽ chớp nhoè thành một năm."},
 {t:468.36,s:"Nên khi tôi thấy một quasar đổi độ sáng"},
 {t:470.91,s:"trong vòng vài giờ, tôi vừa đo được kích"},
 {t:473.53,s:"thước của nó mà không cần nhìn thấy nó."},
 {t:476.08,s:"Vùng phát sáng đó không thể rộng hơn vài"},
 {t:479.41,s:"giờ ánh sáng."},
 {t:480.49,s:"Vài giờ ánh sáng."},
 {t:482.04,s:"Ánh sáng đi từ Mặt Trời ra tới Sao Hải"},
 {t:484.74,s:"Vương mất khoảng bốn tiếng."},
 {t:486.65,s:"Cái máy phát ra nhiều ánh sáng hơn cả một"},
 {t:488.93,s:"thiên hà vừa lọt trong hệ Mặt Trời."},
 {t:490.87,s:"Không phải phỏng đoán."},
 {t:492.4,s:"Đó là hệ quả trực tiếp của việc đếm nhịp"},
 {t:495.74,s:"nhấp nháy."},
 {t:498.57,s:"Bây giờ đến con số làm tôi ngồi lặng khi"},
 {t:501.18,s:"lần đầu đọc được."},
 {t:502.29,s:"Một ngôi sao chuyển được không phẩy bảy"},
 {t:504.53,s:"phần trăm khối lượng thành năng lượng."},
 {t:506.71,s:"Đó là mức tốt nhất mà phản ứng hạt nhân"},
 {t:509.73,s:"làm được."},
 {t:510.43,s:"Một cái đĩa bồi tụ quanh hố đen chuyển"},
 {t:513.01,s:"được từ sáu đến khoảng ba mươi phần trăm,"},
 {t:515.79,s:"tuỳ hố đen quay nhanh cỡ nào."},
 {t:517.76,s:"Hiệu suất gấp mười lần, có khi gấp bốn"},
 {t:520.59,s:"mươi lần, so với thứ đang thắp sáng mọi"},
 {t:523.5,s:"ngôi sao trên bầu trời."},
 {t:525.21,s:"Trong toàn bộ danh mục các cách vũ trụ"},
 {t:527.92,s:"biết biến vật chất thành ánh sáng, chỉ có"},
 {t:530.83,s:"một cách ăn đứt nó: vật chất gặp phản vật"},
 {t:533.75,s:"chất và cả hai cùng biến mất."},
 {t:535.81,s:"Nghĩa là một hố đen đang ăn là cỗ máy hiệu"},
 {t:538.66,s:"quả thứ hai trong vũ trụ."},
 {t:540.35,s:"Và nó không kén nhiên liệu."},
 {t:542.23,s:"Nó ăn bất cứ thứ gì rơi tới: khí hydro,"},
 {t:546.09,s:"bụi, hành tinh lạc, những ngôi sao đi quá"},
 {t:550.14,s:"gần."},
 {t:550.54,s:"Thứ mà một ngôi sao phải chắt chiu cả đời"},
 {t:553.45,s:"để rút ra được bảy phần nghìn, một hố đen"},
 {t:556.37,s:"rút gọn trong một vòng xoáy."},
 {t:559.86,s:"Và không phải tất cả vật chất đều rơi"},
 {t:562.42,s:"xuống được."},
 {t:563.18,s:"Cái đĩa quay quá nhanh, từ trường xoắn"},
 {t:565.86,s:"quanh nó quá chặt, nên một phần khí bị vắt"},
 {t:568.81,s:"ngược ra khỏi mặt phẳng đĩa và bắn đi theo"},
 {t:571.77,s:"hai hướng duy nhất còn trống: thẳng lên và"},
 {t:574.73,s:"thẳng xuống, dọc theo hai cực."},
 {t:576.84,s:"Kết quả là hai tia."},
 {t:578.62,s:"Hai vòi vật chất phun ra ở tốc độ sát tốc"},
 {t:581.68,s:"độ ánh sáng."},
 {t:582.58,s:"Tia của ba xê hai bảy ba, cái chấm mà"},
 {t:586.19,s:"Sờ-mít đọc quang phổ năm 1963, dài khoảng"},
 {t:590.18,s:"hai trăm nghìn năm ánh sáng."},
 {t:592.91,s:"Tôi để con số đó đứng một mình một chút."},
 {t:595.5,s:"Hai trăm nghìn năm ánh sáng."},
 {t:597.43,s:"Dài hơn đường kính dải Ngân Hà."},
 {t:600.03,s:"Một vật thể nhỏ hơn hệ Mặt Trời đang nhổ"},
 {t:602.76,s:"ra một cái vòi dài hơn cả thiên hà của"},
 {t:605.36,s:"tôi."},
 {t:605.63,s:"Tới đây tôi tưởng mình đã hiểu quasar là"},
 {t:608.13,s:"gì."},
 {t:608.32,s:"Rồi tôi nhìn vào chỗ chúng nằm, và mọi thứ"},
 {t:611.55,s:"đổi nghĩa."},
 {t:612.32,s:"Khi các nhà thiên văn vẽ bản đồ quasar, họ"},
 {t:614.97,s:"không tìm thấy chúng rải đều khắp vũ trụ."},
 {t:617.55,s:"Chúng dồn về một phía."},
 {t:619.4,s:"Phía xa."},
 {t:620.91,s:"Càng nhìn gần, quasar càng hiếm."},
 {t:623.56,s:"Càng nhìn xa, chúng càng dày đặc."},
 {t:626.45,s:"Rồi tới một khoảng cách nhất định, chúng"},
 {t:629.17,s:"đông nhất."},
 {t:629.85,s:"Rồi xa hơn nữa, chúng lại thưa dần."},
 {t:632.98,s:"Cái bản đồ đó không phải bản đồ không"},
 {t:635.42,s:"gian."},
 {t:635.75,s:"Nó là bản đồ thời gian."},
 {t:639.36,s:"Ánh sáng đi với tốc độ hữu hạn."},
 {t:642.04,s:"Thứ tôi nhìn thấy ở khoảng cách mười tỉ"},
 {t:644.49,s:"năm ánh sáng không phải hiện trạng của nó."},
 {t:647.13,s:"Đó là trạng thái nó có cách đây mười tỉ"},
 {t:649.79,s:"năm, vì ánh sáng đó mất đúng chừng ấy thời"},
 {t:652.66,s:"gian mới tới được mắt tôi."},
 {t:654.43,s:"Nên khi tôi thấy quasar dày đặc ở rất xa"},
 {t:657.03,s:"và gần như biến mất ở gần, tôi không đang"},
 {t:659.69,s:"thấy chúng phân bố lệch trong không gian."},
 {t:662.35,s:"Tôi đang thấy một cái gì đó đã từng phổ"},
 {t:665.54,s:"biến, rồi ngừng xảy ra."},
 {t:667.42,s:"Quasar không phải một loại vật thể."},
 {t:669.72,s:"Nó là một giai đoạn."},
 {t:671.14,s:"Và giai đoạn ấy gần như đã kết thúc."},
 {t:676.4,s:"Đỉnh điểm rơi vào khoảng mười tỉ năm"},
 {t:679.07,s:"trước, khi vũ trụ mới chỉ được vài tỉ"},
 {t:681.81,s:"tuổi."},
 {t:682.18,s:"Lý do rất thô sơ, và tôi thích nó chính vì"},
 {t:685.84,s:"nó thô sơ: hồi đó còn nhiều đồ ăn."},
 {t:688.8,s:"Các thiên hà thời trẻ ngập trong khí."},
 {t:691.09,s:"Chúng chưa kịp đúc khí thành sao."},
 {t:693.18,s:"Chúng còn đang va vào nhau liên tục, và"},
 {t:695.99,s:"mỗi cú va làm khí mất thăng bằng, đổ ập về"},
 {t:699.02,s:"phía trung tâm."},
 {t:700.1,s:"Ở trung tâm có một hố đen."},
 {t:702.16,s:"Và một hố đen được rót khí vào sẽ làm đúng"},
 {t:705.06,s:"cái nó phải làm."},
 {t:706.17,s:"Nó bật sáng."},
 {t:707.73,s:"Cả vũ trụ hồi ấy lốm đốm những ngọn đèn"},
 {t:710.61,s:"như thế."},
 {t:711.2,s:"Không phải một vài."},
 {t:712.74,s:"Hàng triệu."},
 {t:715.1,s:"Rồi khí hết."},
 {t:716.49,s:"Một phần bị nuốt."},
 {t:717.65,s:"Một phần đông lại thành sao."},
 {t:719.48,s:"Một phần bị chính cái đĩa bồi tụ thổi văng"},
 {t:722.43,s:"ra khỏi thiên hà, vì bức xạ mạnh tới mức"},
 {t:725.25,s:"nó đẩy bay chính nguồn thức ăn của mình."},
 {t:728.06,s:"Và khi dòng khí rót vào ngừng lại, cái đĩa"},
 {t:730.82,s:"cạn dần."},
 {t:731.35,s:"Ma sát không còn gì để nung."},
 {t:733.53,s:"Ánh sáng tắt."},
 {t:735.17,s:"Hố đen vẫn ở đó."},
 {t:736.63,s:"Nó không mất đi cái gì cả."},
 {t:738.74,s:"Nó chỉ thôi ăn."},
 {t:742.57,s:"Và đây là chỗ tôi phải ngồi xuống một lúc"},
 {t:745.36,s:"mới tiêu hoá nổi."},
 {t:746.51,s:"Cái chấm sáng tôi nhìn thấy tối nay."},
 {t:748.7,s:"Ánh sáng của nó rời khỏi đĩa bồi tụ từ"},
 {t:751.5,s:"mười tỉ năm trước."},
 {t:752.83,s:"Mười tỉ năm trước, Mặt Trời chưa có."},
 {t:755.95,s:"Trái Đất chưa có."},
 {t:757.66,s:"Đám mây khí sau này cô đặc lại thành hệ"},
 {t:760.17,s:"Mặt Trời còn chưa hình thành, còn đang là"},
 {t:762.81,s:"bụi trôi ở một góc khác của thiên hà."},
 {t:765.19,s:"Chùm ánh sáng ấy đã lên đường."},
 {t:767.46,s:"Nó băng qua khoảng trống."},
 {t:769.35,s:"Nó đi ngang những thiên hà chưa từng có"},
 {t:771.97,s:"aai nhìn thấy."},
 {t:772.91,s:"Suốt thời gian đó nó không dừng, không"},
 {t:775.42,s:"nghỉ, không mất năng lượng vào đâu ngoài"},
 {t:778.07,s:"chính sự giãn ra của không gian."},
 {t:780.19,s:"Nó vẫn đang đi trong lúc Mặt Trời châm"},
 {t:782.63,s:"lửa."},
 {t:782.89,s:"Nó vẫn đang đi trong lúc Trái Đất nguội"},
 {t:785.37,s:"lại thành đá."},
 {t:786.19,s:"Trong lúc đại dương đầy lên."},
 {t:787.95,s:"Trong lúc thứ gì đó trong nước bắt đầu tự"},
 {t:790.82,s:"sao chép."},
 {t:791.45,s:"Nó vẫn đang đi trong lúc loài người học"},
 {t:794.17,s:"dùng lửa, học viết, dựng thành phố, chế ra"},
 {t:797.1,s:"kính thiên văn."},
 {t:798.15,s:"Và rồi nó tới, đúng vào tối nay, và dừng"},
 {t:801.27,s:"lại ở một tấm cảm biến."},
 {t:804.57,s:"Trong suốt mười tỉ năm ấy, cái quasar đã"},
 {t:807.59,s:"tắt."},
 {t:807.89,s:"Gần như chắc chắn."},
 {t:809.35,s:"Vì cơn đói kiểu đó chỉ kéo dài được vài"},
 {t:812.14,s:"chục triệu năm, có khi vài trăm triệu,"},
 {t:814.86,s:"cùng lắm là thế."},
 {t:816,s:"Mười tỉ năm dài gấp hàng chục tới hàng"},
 {t:818.62,s:"trăm lần một đời quasar."},
 {t:820.27,s:"Thiên hà quanh nó bây giờ chắc đã già."},
 {t:822.94,s:"Khí đã thành sao, những ngôi sao nặng đã"},
 {t:825.45,s:"đốt hết nhiên liệu, ánh sáng còn lại ngả"},
 {t:827.95,s:"về màu đỏ của tuổi."},
 {t:829.14,s:"Ở giữa nó là một hố đen yim lìm, tối,"},
 {t:832.56,s:"không phát ra gì."},
 {t:834.13,s:"Nơi đó bây giờ là một chỗ yên tĩnh."},
 {t:836.58,s:"Và tôi không có cách nào nhìn thấy chỗ yên"},
 {t:839.27,s:"tĩnh ấy."},
 {t:839.78,s:"Ánh sáng của nó phải mất thêm mười tỉ năm"},
 {t:842.41,s:"nữa mới tới đây."},
 {t:843.44,s:"Thứ tôi đang nhìn không phải một vật thể."},
 {t:845.76,s:"Đó là một tấm ảnh chụp một vật thể không"},
 {t:848.4,s:"còn tồn tại, và tấm ảnh ấy vẫn đang được"},
 {t:851.03,s:"rửa, từng giây một, ngay trong mắt tôi."},
 {t:853.6,s:"Cái bầu trời đầy quasar mà tôi tưởng mình"},
 {t:856.12,s:"đang quan sát thật ra là một phòng chiếu."},
 {t:858.64,s:"Mỗi chấm là một cuộn phim cũ, quay xong từ"},
 {t:861.62,s:"lâu, đang chạy tới những khung hình cuối."},
 {t:864.52,s:"Và không aai tắt được máy chiếu."},
 {t:866.64,s:"Ánh sáng đã phát ra rồi thì nó cứ đi, dù"},
 {t:869.71,s:"cái phát ra nó đã tắt từ trước khi có Trái"},
 {t:872.92,s:"Đất."},
 {t:874.73,s:"Có một điều tôi muốn nói rõ, vì nó dễ bị"},
 {t:877.65,s:"hiểu thành chuyện buồn, mà tôi không thấy"},
 {t:880.65,s:"nó buồn."},
 {t:881.23,s:"Cái quasar ấy không biến mất."},
 {t:883.35,s:"Không có gì trong nó bị xoá đi."},
 {t:885.47,s:"Khí nó chưa kịp nuốt vẫn còn trong thiên"},
 {t:888.19,s:"hà đó, có lẽ đã thành sao."},
 {t:889.95,s:"Năng lượng nó phun ra vẫn đang đi, đúng"},
 {t:892.64,s:"cái chùm tôi vừa nhận."},
 {t:894.16,s:"Thứ kết thúc chỉ là cái điều kiện."},
 {t:896.52,s:"Một hố đen, một dòng khí đủ mạnh rót vào,"},
 {t:899.46,s:"và một thời kỳ mà các thiên hà còn đủ đầy"},
 {t:902.41,s:"để rót."},
 {t:902.91,s:"Điều kiện đó đã qua."},
 {t:904.42,s:"Phần lớn khí tự do trong vũ trụ giờ đã bị"},
 {t:907.41,s:"khoá lại trong các ngôi sao, hoặc trôi quá"},
 {t:910.47,s:"loãng, quá xa, để rơi về đâu đó."},
 {t:912.8,s:"Nên khi tôi nói quasar là chuyện của vũ"},
 {t:915.14,s:"trụ trẻ, tôi không nói về tuổi của những"},
 {t:917.53,s:"cái máy."},
 {t:918.01,s:"Tôi nói về tuổi của bữa tiệc."},
 {t:920.44,s:"Bữa tiệc đã tàn từ lâu."},
 {t:922.17,s:"Ánh đèn thì vẫn đang trên đường tới."},
 {t:925.15,s:"Tôi rời mắt khỏi cái chấm ấy và nhìn về"},
 {t:927.68,s:"một hướng khác trên bầu trời."},
 {t:929.56,s:"Hướng chòm Nhân Mã."},
 {t:931.49,s:"Ở đó, cách tôi hai mươi sáu nghìn năm ánh"},
 {t:934.52,s:"sáng, sau nhiều lớp bụi dày tới mức mắt"},
 {t:937.41,s:"thường không xuyên qua nổi, là trung tâm"},
 {t:940.36,s:"dải Ngân Hà."},
 {t:941.25,s:"Và ở chính giữa trung tâm đó có một hố đen"},
 {t:943.95,s:"nặng bằng bốn triệu Mặt Trời."},
 {t:947.31,s:"Nó rất yên."},
 {t:948.34,s:"Đó là điều đầu tiên các nhà thiên văn nói"},
 {t:951.35,s:"về nó."},
 {t:951.79,s:"So với những gì một hố đen cỡ ấy có thể"},
 {t:954.67,s:"làm, nó gần như không làm gì cả."},
 {t:957.03,s:"Nó nhặt nhạnh chút khí loãng trôi ngang"},
 {t:959.52,s:"qua."},
 {t:959.78,s:"Lâu lâu có một đám nhỏ sa vào và nó loé"},
 {t:963.43,s:"lên một chút, rồi lại yim."},
 {t:965.87,s:"Ánh sáng nó phát ra chưa bằng một phần rất"},
 {t:968.54,s:"nhỏ của những gì một quasar phát ra trong"},
 {t:971.15,s:"một giây."},
 {t:971.72,s:"Nhưng nó không hỏng."},
 {t:972.95,s:"Không có gì trong nó bị gãy."},
 {t:975.28,s:"Cái giếng hấp dẫn vẫn sâu y như cũ."},
 {t:977.82,s:"Cơ chế vẫn nguyên vẹn."},
 {t:980.28,s:"Đổ khí vào, đĩa sẽ hình thành, ma sát sẽ"},
 {t:983.03,s:"nung nó lên hàng triệu độ, và trung tâm"},
 {t:985.72,s:"dải Ngân Hà sẽ sáng lên."},
 {t:987.37,s:"Nó không tắt vì hỏng."},
 {t:988.85,s:"Nó yim vì đói."},
 {t:992.87,s:"Có nhiều lý do để nghĩ rằng nó đã từng"},
 {t:995.29,s:"không yim."},
 {t:995.93,s:"Hai bong bóng khí nóng khổng lồ trải ra"},
 {t:998.91,s:"phía trên và phía dưới mặt phẳng thiên hà,"},
 {t:1002.11,s:"mỗi cái cao hàng chục nghìn năm ánh sáng,"},
 {t:1005.24,s:"vẫn còn ở đó, như tàn dư của một cơn gì đó"},
 {t:1008.44,s:"rất lớn đã thổi qua."},
 {t:1009.97,s:"Chúng đối xứng qua tâm thiên hà."},
 {t:1012.11,s:"Chúng phồng ra đúng theo hai hướng mà một"},
 {t:1014.88,s:"cái đĩa bồi tụ sẽ thổi ra nếu nó từng hoạt"},
 {t:1017.71,s:"động."},
 {t:1018.05,s:"Và chúng vẫn còn nóng, nghĩa là cái thổi"},
 {t:1020.9,s:"ra chúng không quá cũ theo thang thiên"},
 {t:1023.61,s:"văn."},
 {t:1023.9,s:"Có một dấu vết nữa, rộng hơn, và tôi thấy"},
 {t:1026.95,s:"nó thuyết phục hơn cả."},
 {t:1028.59,s:"Khi các nhà thiên văn cân hố đen ở tâm"},
 {t:1031.18,s:"nhiều thiên hà khác nhau, họ phát hiện"},
 {t:1033.77,s:"khối lượng hố đen luôn giữ một tỉ lệ khá"},
 {t:1036.49,s:"đều với khối lượng phần lõi thiên hà bao"},
 {t:1039.22,s:"quanh nó."},
 {t:1039.83,s:"Thiên hà lớn thì hố đen lớn."},
 {t:1042.35,s:"Thiên hà nhỏ thì hố đen nhỏ."},
 {t:1045.01,s:"Điều đó không tự nhiên xảy ra."},
 {t:1047,s:"Một hố đen chiếm một phần rất nhỏ khối"},
 {t:1049.41,s:"lượng thiên hà, và lực hấp dẫn của nó"},
 {t:1051.75,s:"không với tới được những vùng ngoài xa."},
 {t:1054.22,s:"Nó không có lý do gì để biết thiên hà"},
 {t:1057.22,s:"quanh nó to cỡ nào."},
 {t:1058.76,s:"Trừ khi cả hai đã lớn lên cùng nhau, và"},
 {t:1061.47,s:"cùng dừng lại vì cùng một lý do."},
 {t:1063.7,s:"Khí nuôi sao cũng chính là khí nuôi hố"},
 {t:1066.26,s:"đen."},
 {t:1066.53,s:"Khi hố đen ăn đủ mạnh, bức xạ của nó thổi"},
 {t:1069.66,s:"khí bay đi, và cả hai cùng đứt bữa."},
 {t:1072.33,s:"Cái tỉ lệ ấy có mặt ở gần như mọi thiên hà"},
 {t:1075,s:"lớn được đo."},
 {t:1075.76,s:"Kể cả thiên hà của tôi."},
 {t:1077.91,s:"Chúng ta không biết chắc hố đen của chúng"},
 {t:1080.17,s:"ta có từng sáng bằng những ngọn hải đăng ở"},
 {t:1082.49,s:"rìa thời gian kia hay không."},
 {t:1084.03,s:"Nó có thể chỉ từng là một ngọn đèn hạng"},
 {t:1086.73,s:"xoàng."},
 {t:1087.14,s:"Nhưng cơ chế thì chỉ có một."},
 {t:1089.82,s:"Và bốn triệu Mặt Trời khối lượng ấy không"},
 {t:1093.28,s:"tự có."},
 {t:1093.79,s:"Chúng đã được ăn vào, từng đợt một."},
 {t:1098.37,s:"Nếu ở đâu đó rất xa, cách đây mười tỉ năm"},
 {t:1101.26,s:"ánh sáng, có aai đó đang nhìn về phía này"},
 {t:1104.15,s:"tối nay, họ sẽ không thấy tôi."},
 {t:1106.26,s:"Họ sẽ không thấy Trái Đất, không thấy Mặt"},
 {t:1109.36,s:"Trời, không thấy dải Ngân Hà như tôi biết"},
 {t:1112.46,s:"nó."},
 {t:1112.69,s:"Ánh sáng tới được chỗ họ là ánh sáng của"},
 {t:1115.15,s:"mười tỉ năm trước."},
 {t:1116.26,s:"Của một thiên hà còn đang lớn, còn đầy"},
 {t:1118.79,s:"khí, còn đang va vào những thiên hà khác."},
 {t:1121.51,s:"Và có thể, ở chỗ này, trên tấm kính của"},
 {t:1124.92,s:"họ, dải Ngân Hà là một chấm."},
 {t:1127.36,s:"Một chấm nhỏ, mờ, lẫn giữa vài nghìn chấm"},
 {t:1130.69,s:"khác."},
 {t:1131.1,s:"Sáng hơn cả một thiên hà."},
 {t:1133.01,s:"Và họ sẽ không có cách nào biết rằng nó đã"},
 {t:1136.31,s:"tắt."},
 {t:1138.62,s:"Tôi nghĩ về điều đó khá lâu."},
 {t:1140.35,s:"Về việc một ngọn hải đăng và cái xác của"},
 {t:1143.05,s:"ngọn hải đăng trông giống hệt nhau, nếu"},
 {t:1145.69,s:"đứng đủ xa."},
 {t:1146.43,s:"Về việc cái vũ trụ tôi ngước lên nhìn"},
 {t:1149.01,s:"không phải cái vũ trụ đang có."},
 {t:1151.1,s:"Nó là cái vũ trụ đã có, xếp chồng lên nhau"},
 {t:1154.17,s:"theo từng lớp khoảng cách, lớp càng xa thì"},
 {t:1157.24,s:"càng cũ."},
 {t:1157.82,s:"Và về việc, ở tâm thiên hà của chính tôi,"},
 {t:1160.7,s:"một cỗ máy nặng bốn triệu Mặt Trời đang"},
 {t:1163.44,s:"nằm đó, nguyên vẹn, lạnh, quay chậm trong"},
 {t:1166.33,s:"bóng tối."},
 {t:1166.96,s:"Không chết."},
 {t:1167.88,s:"Không hỏng."},
 {t:1168.91,s:"Chỉ là hết đồ ăn, và đang đợi."}
];

var TOTAL = 1171.97;

 * Storyboard ghi h_world tho; do lai thay h=0.30 @ d=22 fov44 chi ra 18px —
 * DUOI nguong 26px. Nen moi textPlane nhan KTEXT=1.85:
 *   h 0.26 @ d18 -> 36px | h 0.30 @ d22 -> 34px | h 0.34 @ d22 -> 39px
 *   h 0.40 @ d20 -> 50px | h 0.44 @ d20 -> 55px | h 0.62 @ d40 -> 38px (S97)
 * Chu giu opacity <=0.86 -> luminance duoi nguong bloom 1.0, khong bi nhoe net.
 */
var KTEXT = 1.85;
function textTex(txt, px, colr, wpx, hpx, align, weight){
  var cv=document.createElement('canvas');
  cv.width = wpx||1024;
  /* ⚠ SUA GOC — DAU TIENG VIET BI CAT KHI CANVAS CHAT.
   * textBaseline='middle' canh em-box vao giua canvas. Dau tieng Viet nhô
   * TREN cap-height (mũ/sắc/huyền/ngã/hỏi, co the chong 2 tang nhu 'ế','ộ')
   * va DUOI baseline (nặng). Tong chieu cao muc mot dong ~1.6-1.7x fpx.
   * Do THAT: nhan fpx=86/hpx=180 (ti le 2.09) VAN bi cat dau, nen nguong
   * an toan dat 2.4x fpx moi dong (ratio 2.09 da chung minh 2.0 chua du).
   * Nen canvas duoc NOI TU DONG cho du le; hWorld khong doi vi textPlane
   * dung glyphFrac (tinh tu fpx that) chu khong dung cv.height. */
  var _nl = String(txt).split('\n').length;
  var _fpx0 = px||120;
  var _hMin = Math.ceil(_fpx0 * 2.4 * _nl);
  cv.height = Math.max(hpx||256, _hMin);
  var cx=cv.getContext('2d');
  cx.clearRect(0,0,cv.width,cv.height);
  var fpx = px||120;
  cx.font=(weight||'700')+' '+fpx+'px "Segoe UI",Arial,sans-serif';
  var maxW = cv.width - 40;
  var lns = String(txt).split('\n');
  var widest = 0, li;
  for(li=0; li<lns.length; li++) widest = Math.max(widest, cx.measureText(lns[li]).width);
  var shrink = 1;
  if(widest > maxW){
    shrink = maxW / widest;
    fpx = Math.max(16, Math.floor(fpx * shrink));
    cx.font=(weight||'700')+' '+fpx+'px "Segoe UI",Arial,sans-serif';
  }
  cx.textBaseline='middle';
  cx.textAlign= align||'center';
  cx.fillStyle=colr||COL.TEXT;
  var x = align==='left' ? 14 : (align==='right' ? cv.width-14 : cv.width/2);
  var lh=fpx*1.18;
  var y0=cv.height/2 - lh*(lns.length-1)/2;
  for(li=0;li<lns.length;li++) cx.fillText(lns[li], x, y0+li*lh);
  var tx=new THREE.CanvasTexture(cv);
  tx.encoding=THREE.sRGBEncoding; tx.minFilter=THREE.LinearFilter;
  tx.anisotropy=renderer.capabilities.getMaxAnisotropy();
  /* bao lai ti le da thu de textPlane bu vao hWorld — neu khong, chu dai bi
   * ha font ma plane giu nguyen, glyph that nho hon nhieu so voi estimatePx. */
  /* Ti le chieu cao GLYPH tren chieu cao TEXTURE. textPlane chia hWorld cho
   * so nay de chieu cao chu THAT dung bang hWorld*KTEXT — truoc day plane dung
   * kich thuoc texture nen chu ra nho hon ~40% (do 330s: glyph chi 4px). */
  /* Bao ca cv.height THAT: canvas vua bi noi tu dong nen textPlane khong
   * duoc dung hpx goc de tinh ti le khung (se keo gian chu theo chieu ngang). */
  tx.userData = { shrink: shrink, cw: cv.width, ch: cv.height,
    glyphFrac: Math.min(1, (fpx*1.18*lns.length)/cv.height) };
  return tx;
}
function textPlane(txt, hWorld, px, colr, wpx, hpx, align){
  var tx=textTex(txt,px,colr,wpx,hpx,align);
  /* Phong plane len 1/glyphFrac de CHIEU CAO GLYPH THAT = hWorld*KTEXT.
   * Tran 0.42 chan truong hop canvas qua det lam plane no vo han. */
  var gf = (tx.userData && tx.userData.glyphFrac) ? tx.userData.glyphFrac : 1;
  /* Tran 0.68 chan viec phong qua da (da do: bu toan phan lam tran mep
   * khung o 62s/200s/520s). NHUNG khi canvas bi NOI TU DONG cho du le dau
   * tieng Viet, glyphFrac tut xuong ma tran 0.68 lai giu nguyen h -> chu
   * NHO DI that (do duoc 32px -> 21px o nhan 1000s). Vi vay ha tran theo
   * dung ti le canvas da noi, khong hon. */
  var grow = (tx.userData && tx.userData.ch && hpx) ? Math.max(1, tx.userData.ch/hpx) : 1;
  var h = hWorld*KTEXT/Math.max(gf, 0.68/grow);
  var w=(tx.userData.cw||wpx||1024)/(tx.userData.ch||hpx||256);
  var m=new THREE.MeshBasicMaterial({map:tx,transparent:true,depthWrite:false,
    opacity:0.86, blending:THREE.NormalBlending});
  var p=new THREE.Mesh(new THREE.PlaneGeometry(h*w,h),m);
  p.userData.baseOp=0.86;
  return p;
}

/* ==========================================================================
 * DIA BOI TU — nhan vat chinh cua tap.
 * Shader mat dia: gradient nhiet theo r, Kepler omega ~ r^-1.5, Doppler beaming,
 * van FBM 3 octave chong mang bet. Tam la LO DEN TUYET DOI, khong glow ria,
 * khong photon ring — duong kinh 4% duong kinh dia (RB = 0.04*R_OUT*2 /2).
 * ========================================================================== */
var R_IN = 0.16, R_OUT = 4.0;
var R_BH  = 0.08;   /* ban kinh vung den = 4% duong kinh dia (2*4.0=8 -> 0.32 dk -> r 0.16)
                       giu o 0.08 -> duong kinh 0.16 = 2% dk dia, an toan duoi tran 4% */

var diskUni = {
  uT:{value:0}, uOpacity:{value:1}, uHeat:{value:1.0}, uDop:{value:1.0},
  uFill:{value:1.0}, uRin:{value:R_IN}, uRout:{value:R_OUT},
  uCIn:{value:COL.DIN.clone()}, uCMid:{value:COL.DMID.clone()},
  uCOut:{value:COL.DOUT.clone()}, uCRim:{value:COL.DRIM.clone()},
  uEmis:{value:1.0}, uLens:{value:0.0}
};
var diskMat = new THREE.ShaderMaterial({
  uniforms: diskUni, transparent:true, depthWrite:false,
  side:THREE.DoubleSide, blending:THREE.AdditiveBlending,
  vertexShader:[
    'varying vec2 vP; varying vec3 vW;',
    'void main(){ vP=position.xy; vec4 w=modelMatrix*vec4(position,1.0); vW=w.xyz;',
    ' gl_Position=projectionMatrix*viewMatrix*w; }'
  ].join('\n'),
  fragmentShader:[
    'varying vec2 vP; varying vec3 vW;',
    'uniform float uT,uOpacity,uHeat,uDop,uFill,uRin,uRout,uEmis;',
    'uniform vec3 uCIn,uCMid,uCOut,uCRim;',
    GLSL_NOISE,
    'void main(){',
    ' float r=length(vP);',
    ' if(r<uRin||r>uRout){discard;}',
    ' float x=clamp((r-uRin)/(uRout-uRin),0.0,1.0);',
    /* Kepler: omega ~ r^-1.5 (vong trong quay nhanh thay ro) */
    ' float th=atan(vP.y,vP.x);',
    ' float om=0.85*pow(max(r,0.05),-1.5);',
    ' float ph=th + om*uT;',                 /* nguoc kim dong ho nhin tu cuc bac dia */
    /* van FBM 3 octave bien do +-25% — pha mang bet (GHI CHU muc 2.2) */
    ' vec3 q=vec3(cos(ph)*r*2.6, sin(ph)*r*2.6, r*1.5);',
    ' float f=fbm3(q*1.7)*0.55 + fbm3(q*5.3)*0.30 + fbm3(q*13.0)*0.15;',
    ' float vein=1.0+0.25*f;',
    /* gradient nhiet theo ban kinh: chi r<0.15*rout duoc vuot HDR 1.0 */
    ' vec3 col;',
    ' if(x<0.15) col=mix(uCIn,uCMid,smoothstep(0.0,0.15,x));',
    ' else if(x<0.45) col=mix(uCMid,uCOut,smoothstep(0.15,0.45,x));',
    ' else col=mix(uCOut,uCRim,smoothstep(0.45,1.0,x));',
    /* uHeat: 0 = nguoi han (do sau), 1 = nong het (lam tim o trong) */
    ' col=mix(uCRim*0.55, col, clamp(uHeat,0.0,1.0));',
    /* do sang theo r^-0.75 — hang rao an toan chong chay trang */
    ' float bright=pow(max(r/uRout,0.04),-0.75)*0.16;',
    ' bright*=vein;',
    /* Doppler beaming: nua tien ve camera sang ~2.5x, nua lui toi + nga do */
    ' vec3 vd=normalize(vec3(-sin(th),0.0,-cos(th)));',  /* huong van toc (xy plane -> world xz) */
    ' vec3 toc=normalize(cameraPosition-vW);',
    ' float beam=dot(vd,toc);',
    ' float dop=mix(1.0, 1.0+1.5*beam, clamp(uDop,0.0,1.0));',
    ' dop=clamp(dop,0.30,2.6);',
    ' bright*=dop;',
    ' col=mix(col, col*vec3(0.86,0.93,1.12), clamp(beam,0.0,1.0)*0.55*uDop);',
    ' col=mix(col, col*vec3(1.15,0.78,0.62), clamp(-beam,0.0,1.0)*0.55*uDop);',
    /* do day quang hoc thap + nhieu lop (opacity <=0.35 moi lop) */
    ' float edge=smoothstep(0.0,0.06,x)*smoothstep(1.0,0.86,x);',
    ' float dens=(0.55+0.45*vein)*edge*uFill;',
    ' float a=clamp(dens*0.34,0.0,0.34)*uOpacity;',
    ' gl_FragColor=vec4(col*bright*uEmis, a);',
    '}'
  ].join('\n')
});

/* nhieu lop dia — xep 5 lop lech day tao the tich */
function buildDisk(){
  var g=new THREE.Group();
  var i;
  for(i=0;i<5;i++){
    var m=new THREE.Mesh(new THREE.PlaneGeometry(R_OUT*2, R_OUT*2, 1,1), diskMat);
    m.rotation.x=-Math.PI/2;
    m.position.y=(i-2)*0.035;
    g.add(m);
  }
  /* VUNG DEN TUYET DOI o tam — khong phat gi, khong vien, khong photon ring.
   * Ve bang mot dia mau nen, depthWrite bat de che phan dia phia sau. */
  var bh=new THREE.Mesh(new THREE.CircleGeometry(R_BH, 64),
    new THREE.MeshBasicMaterial({color:0x000000, depthWrite:true}));
  bh.rotation.x=-Math.PI/2;
  var bh2=bh.clone(); bh2.rotation.x=Math.PI/2;
  g.add(bh); g.add(bh2);
  /* qua cau den de che tu moi goc nhin canh */
  var bhs=new THREE.Mesh(new THREE.SphereGeometry(R_BH,32,24),
    new THREE.MeshBasicMaterial({color:0x000000, depthWrite:true}));
  g.add(bhs);
  g.userData.bh=bhs;
  return g;
}

/* THAU KINH TIET CHE — chi S36 va S43: mep sau cua dia cong nhe len tren tam,
 * cung <=25 do, khong warp toan khung. Ve bang mot cung rieng. */
function buildLensArc(){
  var g=new THREE.Group();
  var seg=48, pos=[], col=[];
  var i;
  for(i=0;i<=seg;i++){
    var a=(-12.5+25.0*i/seg)*Math.PI/180;  /* cung <=25 do */
    var rr=R_OUT*0.94;
    pos.push(Math.sin(a)*rr, 0, -Math.cos(a)*rr);

  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  var lineMat=new THREE.LineBasicMaterial({color:COL.DMID, transparent:true, opacity:0.0,
    blending:THREE.AdditiveBlending, depthWrite:false});

  g.add(ln);
  g.userData.line=ln;
  /* dai cong nhe hien len tren dinh dia */
  var band=new THREE.Mesh(new THREE.RingGeometry(R_OUT*0.80, R_OUT*0.98, 64, 1,
    Math.PI*0.5-0.22, 0.44), emisMat(COL.DOUT, 0.0));
  band.userData.baseOp=1.0;
  g.add(band); g.userData.band=band;
  return g;
}

/* ==========================================================================
 * JET — hai tia doi xung qua mat phang dia, VUONG GOC mat phang, goc mo <=5 do,
 * co nut (knots) sang cach quang deu di chuyen ra ngoai.
 * ========================================================================== */
var jetUni = {
  uT:{value:0}, uOpacity:{value:1}, uLen:{value:1.0}, uKnot:{value:1.0},
  uCore:{value:COL.JETC.clone()}, uSheath:{value:COL.JETS.clone()}
};
var jetMat = new THREE.ShaderMaterial({
  uniforms: jetUni, transparent:true, depthWrite:false, side:THREE.DoubleSide,
  blending:THREE.AdditiveBlending,
  vertexShader:'varying vec2 vUv; varying vec3 vPo;'+
    'void main(){vUv=uv; vPo=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:[
    'varying vec2 vUv; varying vec3 vPo;',
    'uniform float uT,uOpacity,uLen,uKnot; uniform vec3 uCore,uSheath;',
    GLSL_NOISE,
    'void main(){',
    ' float y=vUv.y;',                        /* 0 goc -> 1 dau jet */
    ' if(y>uLen) discard;',
    ' float rr=abs(vUv.x-0.5)*2.0;',
    ' float core=smoothstep(1.0,0.0,rr/0.34);',
    ' float sh=smoothstep(1.0,0.0,rr);',
    /* nut sang cach quang deu, di chuyen ra ngoai */
    ' float kn=0.5+0.5*sin((y*14.0 - uT*0.55)*6.2831);',
    ' kn=pow(clamp(kn,0.0,1.0),4.0)*uKnot;',
    /* soc cheo (diamond shock) mo */
    ' float ds=0.5+0.5*sin((y*30.0)*3.1416)*(1.0-rr);',
    ' float tur=0.5+0.5*fbm3(vec3(vUv.x*6.0, y*22.0-uT*0.8, 3.1));',
    ' vec3 col=mix(uSheath, uCore, core);',
    ' float b=(core*1.15 + sh*0.30)*(0.62+0.38*tur)*(1.0+1.35*kn)*(0.85+0.25*ds);',
    /* nhat dan ve dau jet */
    ' b*=mix(1.0,0.38,smoothstep(0.0,1.0,y));',
    ' float a=clamp((core*0.40+sh*0.13)*uOpacity*(0.8+0.5*kn),0.0,0.44);',
    ' a*=smoothstep(0.0,0.03,y)*smoothstep(uLen,uLen-0.10,y);',
    ' gl_FragColor=vec4(col*b, a);',
    '}'
  ].join('\n')
});
/* goc mo <=5 do: chieu dai L, ban kinh dau = L*tan(2.5deg) ~ L*0.0437 */
function buildJetPair(L, w0){
  var g=new THREE.Group();
  var i;
  for(i=0;i<2;i++){
    var sgn=i?-1:1;
    var sub=new THREE.Group();
    var j;
    for(j=0;j<3;j++){      /* 3 lop quay lech de ra the tich */
      var pl=new THREE.Mesh(new THREE.PlaneGeometry(w0*2.0, L, 1, 64), jetMat);
      pl.geometry.translate(0, L/2, 0);
      pl.rotation.y = j*Math.PI/3;
      sub.add(pl);
    }
    sub.scale.y = sgn;
    g.add(sub);
  }
  return g;
}

/* ==========================================================================
 * THIEN HA XOAN OC — loi phinh vang cam, nhanh lam, dai bui toi, diem HII.
 * Quay CUNG CHIEU KIM DONG HO nhin tu cuc bac thien ha (quy uoc ca tap).
 * ========================================================================== */
function buildGalaxy(nStar, rnd, opts){
  opts = opts||{};
  var R = opts.R || 5.0;
  var arms = opts.arms || 2;
  var young = opts.young || 0.0;    /* 0 = thien ha gia, 1 = tre nhieu khi */
  var pos=new Float32Array(nStar*3), col=new Float32Array(nStar*3), siz=new Float32Array(nStar);
  var c=new THREE.Color(), i;
  for(i=0;i<nStar;i++){
    var isBulge = rnd()<0.22;
    var r, a, zz;
    if(isBulge){
      r = Math.pow(rnd(),2.0)*R*0.20;
      a = rnd()*Math.PI*2;
      zz = (rnd()-0.5)*R*0.10;
    } else {
      r = Math.pow(rnd(),0.62)*R;
      var armI = Math.floor(rnd()*arms);
      var base = armI/arms*Math.PI*2;
      /* xoan oc logarit; dau am -> nhin tu +Y quay cung kim dong ho */
      a = base - Math.log(1+r*2.6)*2.05 + (rnd()-0.5)*(0.44+0.5/(1+r));
      zz = (rnd()-0.5)*R*0.035*(1+2.0/(1+r*2));
    }
    pos[i*3]=Math.cos(a)*r; pos[i*3+1]=zz; pos[i*3+2]=Math.sin(a)*r;
    var fr=r/R;
    if(isBulge){ c.copy(COL.DMID).multiplyScalar(0.55+rnd()*0.4); }
    else if(rnd()<0.045+young*0.10){ c.copy(COL.HA).multiplyScalar(0.45+rnd()*0.35); } /* HII */
    else {
      c.copy(COL.YOUNG).lerp(COL.DMID, clamp(1.0-fr*1.25,0,1)*(1.0-young*0.75));
      c.multiplyScalar(0.28+rnd()*0.42);
    }
    if(young>0.2) c.lerp(COL.YOUNG, young*0.35);
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
    siz[i]=(rnd()<0.05?2.4:1.0)*(0.55+rnd()*1.0)*(isBulge?0.85:1.0);
  }
  var g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  g.setAttribute('aS', new THREE.BufferAttribute(siz,1));
  var m=new THREE.ShaderMaterial({
    uniforms:{ uOp:{value:1}, uSize:{value:opts.size||60.0} },
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    vertexShader:'attribute float aS;attribute vec3 color;varying vec3 vC;uniform float uSize;'+
      'void main(){vC=color;vec4 mv=modelViewMatrix*vec4(position,1.0);'+
      'gl_PointSize=max(1.0,aS*(uSize/max(0.1,-mv.z)));gl_Position=projectionMatrix*mv;}',
    fragmentShader:'varying vec3 vC;uniform float uOp;'+
      'void main(){vec2 d=gl_PointCoord-0.5;float r=length(d);'+
      'float a=smoothstep(0.5,0.0,r);gl_FragColor=vec4(vC,a*uOp);}'
  });
  var pts=new THREE.Points(g,m);
  pts.userData.uOp=m.uniforms.uOp;
  return pts;
}

/* dai bui toi cat ngang mat phang thien ha */
function buildDustLane(R, rnd){
  var g=new THREE.Group();
  var i;
  for(i=0;i<26;i++){
    var a=rnd()*Math.PI*2, r=R*(0.25+rnd()*0.72);
    var m=new THREE.Mesh(new THREE.PlaneGeometry(R*(0.30+rnd()*0.45), R*0.05),
      flatMat(0x05060c, 0.36+rnd()*0.22));
    m.userData.baseOp=m.material.opacity;
    m.position.set(Math.cos(a)*r, (rnd()-0.5)*R*0.01, Math.sin(a)*r);
    m.rotation.x=-Math.PI/2;
    m.rotation.z=-a + Math.PI/2 + (rnd()-0.5)*0.4;
    g.add(m);
  }
  return g;
}

/* nhan sang lam tim cua mot thien ha (quasar nho o xa) */
function nucleusSprite(col, sc, op){
  var s=new THREE.Sprite(new THREE.SpriteMaterial({
    map:HFA.dotTex(Math.round(col.r*255), Math.round(col.g*255), Math.round(col.b*255)),
    transparent:true, opacity:(op==null?0.9:op), depthWrite:false,
    blending:THREE.AdditiveBlending }));
  s.userData.baseOp=(op==null?0.9:op);
  s.scale.setScalar(sc);
  return s;
}

/* --- SO DO QUANG PHO (S14–S18, S21) -------------------------------------
 * Dai pho lien tuc do->tim, vach hap thu dat theo BUOC SONG THAT.
 * Balmer: Ha 656.3 Hb 486.1 Hg 434.0 Hd 410.2 nm | He: 587.6 501.6 471.3 447.1
 * Anh xa tuyen tinh 400..700nm -> x in [-L/2, L/2] (tim ben phai theo storyboard:
 * "dai pho lien tuc do->tim trai sang phai") => x = (700-lam)/300 * L - L/2.
 */
var SPEC_L = 7.2;
function lamToX(lam, L){ L=L||SPEC_L; return ((700-lam)/300)*L - L/2; }
function specBand(L, h, op){
  var cv=document.createElement('canvas'); cv.width=512; cv.height=8;
  var cx=cv.getContext('2d');
  var gr=cx.createLinearGradient(0,0,512,0);
  /* trai = do (700nm), phai = tim (400nm) */
  gr.addColorStop(0.00,'rgb(190,26,18)');
  gr.addColorStop(0.22,'rgb(214,104,22)');
  gr.addColorStop(0.42,'rgb(206,186,40)');
  gr.addColorStop(0.60,'rgb(52,180,96)');
  gr.addColorStop(0.78,'rgb(40,110,208)');
  gr.addColorStop(1.00,'rgb(104,44,190)');
  cx.fillStyle=gr; cx.fillRect(0,0,512,8);
  var tx=new THREE.CanvasTexture(cv); tx.encoding=THREE.sRGBEncoding;
  var m=new THREE.Mesh(new THREE.PlaneGeometry(L||SPEC_L, h||0.62),
    new THREE.MeshBasicMaterial({map:tx, transparent:true, opacity:(op==null?0.80:op),
      depthWrite:false}));
  m.userData.baseOp=(op==null?0.80:op);
  return m;
}
function absLine(lam, L, h, z){
  var m=new THREE.Mesh(new THREE.PlaneGeometry(0.048, (h||0.62)*1.02),
    new THREE.MeshBasicMaterial({color:0x04050a, transparent:true, opacity:0.92, depthWrite:false}));
  m.userData.baseOp=0.92;
  m.position.x=lamToX(lam*(1+(z||0)), L);
  m.position.z=0.01;
  m.userData.lam=lam;
  return m;
}

function buildShells(n, r0, rk, rnd, perShell){
  var g=new THREE.Group();
  var shells=[], i, j;
  for(i=0;i<n;i++){
    var R=r0*Math.pow(rk,i);
    var sh=new THREE.Group();
    var cnt=perShell||70;
    for(j=0;j<cnt;j++){
      var u=rnd(), v=rnd();
      var th=Math.acos(2*u-1), phi=2*Math.PI*v;
      var s=nucleusSprite(i<2?COL.YOUNG:COL.OLD, R*0.030*(0.6+rnd()*0.9), 0.85);
      s.position.set(Math.sin(th)*Math.cos(phi)*R, Math.cos(th)*R*0.72, Math.sin(th)*Math.sin(phi)*R);
      sh.add(s);
    }
    var ring=ringXY(R,R*0.0035,COL.GRID,0.20,96); ring.rotation.x=-Math.PI/2;
    sh.add(ring);
    sh.userData.R=R;
    g.add(sh); shells.push(sh);
  }
  g.userData.shells=shells;
  return g;
}

/* --- S32/S86: PHEU HAP DAN — luoi khong-thoi-gian, do sau theo 1/r, KHONG ve day */
function buildFunnel(){
  var g=new THREE.Group();
  var RMAX=5.0, k=1.05, i, j;
  function depth(r){ return -k/Math.max(r,0.30); }
  /* vong tron dong tam */
  for(i=1;i<=13;i++){
    var r=RMAX*Math.pow(i/13, 1.35);
    var pts=[];
    for(j=0;j<=72;j++){
      var a=j/72*Math.PI*2;
      pts.push(new THREE.Vector3(Math.cos(a)*r, depth(r), Math.sin(a)*r));
    }
    var geo=new THREE.BufferGeometry().setFromPoints(pts);
    var ln=new THREE.Line(geo, new THREE.LineBasicMaterial({color:COL.GRID,
      transparent:true, opacity:0.30, depthWrite:false}));
    ln.userData.baseOp=0.30;
    g.add(ln);
  }
  /* nan doc */
  for(i=0;i<24;i++){
    var a2=i/24*Math.PI*2, pts2=[];
    for(j=0;j<=40;j++){
      var rr=0.30+(RMAX-0.30)*Math.pow(j/40,1.35);
      pts2.push(new THREE.Vector3(Math.cos(a2)*rr, depth(rr), Math.sin(a2)*rr));
    }
    var geo2=new THREE.BufferGeometry().setFromPoints(pts2);
    var ln2=new THREE.Line(geo2, new THREE.LineBasicMaterial({color:COL.GRID,
      transparent:true, opacity:0.22, depthWrite:false}));
    ln2.userData.baseOp=0.22;
    g.add(ln2);
  }
  /* vung den o day — khong vien phat sang */
  var hole=new THREE.Mesh(new THREE.SphereGeometry(0.26,28,20),
    new THREE.MeshBasicMaterial({color:0x000000, depthWrite:true}));
  hole.position.y=depth(0.30);
  g.add(hole);
  g.userData.depth=depth;
  return g;
}
var gFunnel = G();

/* --- S35: ~40.000 particle khi det dan ve MOT mat phang -------------------
 * Quy dao ban dau nghieng du huong (seeded); thanh phan vuong goc triet tieu.
 * Chieu quay NGUOC KIM DONG HO nhin tu cuc bac dia.
 */
var gFlatten = G();
(function(){
  var N=40000;
  var a0=new Float32Array(N), rr=new Float32Array(N), inc=new Float32Array(N), nod=new Float32Array(N);
  var siz=new Float32Array(N), col=new Float32Array(N*3);
  var c=new THREE.Color(), i;
  for(i=0;i<N;i++){
    a0[i]=rndDisk()*Math.PI*2;
    rr[i]=0.6+Math.pow(rndDisk(),0.60)*4.4;
    inc[i]=(rndDisk()-0.5)*Math.PI*0.95;     /* nghieng du huong */
    nod[i]=rndDisk()*Math.PI*2;
    siz[i]=0.6+rndDisk()*1.1;
    c.copy(COL.DOUT).lerp(COL.DMID, rndDisk()*0.7).multiplyScalar(0.30+rndDisk()*0.40);
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
  }
  var g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3),3));
  g.setAttribute('aA', new THREE.BufferAttribute(a0,1));
  g.setAttribute('aR', new THREE.BufferAttribute(rr,1));
  g.setAttribute('aI', new THREE.BufferAttribute(inc,1));
  g.setAttribute('aN', new THREE.BufferAttribute(nod,1));
  g.setAttribute('aS', new THREE.BufferAttribute(siz,1));
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  var m=new THREE.ShaderMaterial({
    uniforms:{uOp:{value:1}, uT:{value:0}, uFlat:{value:0}},
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    vertexShader:[
      'attribute float aA,aR,aI,aN,aS; attribute vec3 color; varying vec3 vC;',
      'uniform float uT,uFlat;',
      'void main(){ vC=color;',
      ' float om=0.85*pow(max(aR,0.25),-1.5);',
      ' float a=aA+om*uT;',                         /* nguoc kim dong ho nhin tu +Y */
      ' float inc=aI*(1.0-uFlat);',                 /* nghieng triet tieu dan -> det */
      ' vec3 p=vec3(cos(a)*aR, 0.0, -sin(a)*aR);',
      ' float ca=cos(inc), sa=sin(inc);',
      ' float cn=cos(aN), sn=sin(aN);',
      /* quay quanh truc nut */
      ' vec3 ax=vec3(cn,0.0,sn);',
      ' p = p*ca + cross(ax,p)*sa + ax*dot(ax,p)*(1.0-ca);',
      ' vec4 mv=modelViewMatrix*vec4(p,1.0);',
      ' gl_PointSize=max(1.0,aS*(42.0/max(0.1,-mv.z)));',
      ' gl_Position=projectionMatrix*mv; }'
    ].join('\n'),
    fragmentShader:'varying vec3 vC;uniform float uOp;'+
      'void main(){vec2 d=gl_PointCoord-0.5;float r=length(d);'+
      'float a=smoothstep(0.5,0.0,r);gl_FragColor=vec4(vC,a*uOp*0.72);}'
  });
  var pts=new THREE.Points(g,m);
  gFlatten.add(pts); gFlatten.userData.pts=pts;
})();

/* --- S40: zoom ky thuat so — dom PSF Airy, 5 nac, thong tin KHONG tang */
var gPSF = G();
(function(){
  var cv=document.createElement('canvas'); cv.width=cv.height=128;
  var cx=cv.getContext('2d'), i,j;
  var im=cx.createImageData(128,128);
  for(j=0;j<128;j++) for(i=0;i<128;i++){
    var dx=(i-63.5)/9.0, dy=(j-63.5)/9.0, r=Math.sqrt(dx*dx+dy*dy)+1e-5;
    var A=2*besselJ1(r*Math.PI)/(r*Math.PI);
    var v=Math.min(1, A*A*1.05);
    var k=(j*128+i)*4;
    im.data[k]=Math.round(255*v); im.data[k+1]=Math.round(248*v); im.data[k+2]=Math.round(238*v);
    im.data[k+3]=Math.round(255*Math.min(1,v*1.4));
  }
  cx.putImageData(im,0,0);
  var tx=new THREE.CanvasTexture(cv);
  tx.magFilter=THREE.NearestFilter; tx.minFilter=THREE.LinearFilter;
  var m=new THREE.Mesh(new THREE.PlaneGeometry(3.4,3.4),
    new THREE.MeshBasicMaterial({map:tx, transparent:true, opacity:0.92,
      depthWrite:false, blending:THREE.AdditiveBlending}));
  m.userData.baseOp=0.92;
  gPSF.add(m); gPSF.userData.psf=m;
  /* luoi pixel hien ro dan */
  var grid=new THREE.Group();
  for(i=-8;i<=8;i++){
    grid.add(segXY(i*0.2125,-1.7,i*0.2125,1.7,0.006,COL.GRID,0.30));
    grid.add(segXY(-1.7,i*0.2125,1.7,i*0.2125,0.006,COL.GRID,0.30));
  }
  grid.position.z=0.02; gPSF.add(grid); gPSF.userData.grid=grid;
  /* thanh do phan giai goc cham tran */
  var b=barY(0.24,COL.GRID,0.66); b.position.set(3.0,-1.9,0); b.scale.y=0.0;
  gPSF.add(b); gPSF.userData.bar=b;
  var cap=segXY(2.6,1.05,3.4,1.05,0.022,COL.DOUT,0.72); gPSF.add(cap);
  var lb=textPlane('độ phân giải góc',0.24,54,COL.TEXTDIM,620,110);
  lb.position.set(3.0,-2.25,0); gPSF.add(lb);
})();
function besselJ1(x){
  /* xap xi chuoi — du cho van nhieu xa Airy, tat dinh */
  if(Math.abs(x)<1e-6) return 0.5*x;
  var s=0, i, term;
  for(i=0;i<12;i++){
    term=Math.pow(-1,i)/(fact(i)*fact(i+1))*Math.pow(x/2, 2*i+1);
    s+=term;
  }
  return s;
}
function fact(n){ var r=1,i; for(i=2;i<=n;i++) r*=i; return r; }

var gDens = G();
(function(){
  var W=9.0, H=4.6;
  gDens.add(segXY(-W/2,-H/2,W/2,-H/2,0.022,COL.GRID,0.62));
  gDens.add(segXY(-W/2,-H/2,-W/2,H/2,0.022,COL.GRID,0.62));
  var i;
  for(i=1;i<=5;i++){
    gDens.add(segXY(-W/2,-H/2+i*H/6,W/2,-H/2+i*H/6,0.008,COL.GRID,0.14));
    gDens.add(segXY(-W/2+i*W/6,-H/2,-W/2+i*W/6,H/2,0.008,COL.GRID,0.14));
  }
  /* duong cong: len nhanh, dinh o tuoi ~3.5/13.8, roi tut dai xuong gan 0 */
  function dens(age){ /* age 0..13.8 */
    var a=Math.max(age,0.05);
    return Math.pow(a/3.5,2.4)*Math.exp(-(a-3.5)/2.9)*Math.exp(0)*0.92;
  }
  var maxv=0;
  for(i=0;i<=200;i++){ var v=dens(i/200*13.8); if(v>maxv) maxv=v; }
  var segs=[], fills=[];
  for(i=0;i<160;i++){
    var age=(i+0.5)/160*13.8;
    var y=-H/2 + dens(age)/maxv*H*0.88;
    var age2=(i+1.5)/160*13.8;
    var y2=-H/2 + dens(age2)/maxv*H*0.88;
    var x1=-W/2+i*W/160, x2=-W/2+(i+1)*W/160;
