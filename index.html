/* ==========================================================================
 * renderAtTime(t) — HAM THUAN. Moi chuyen dong la ham dong cua t.
 * Khong += dt, khong Date.now, khong Math.random.
 * BAY SO 1 (bien bi che): moi bien cuc bo o day deu co tien to r_/w_/u_ hoac
 * ten khong trung bat ky mesh/group nao khai bao o tren.
 * ========================================================================== */
var _bill = new THREE.Vector3();
function billboard(g){
  g.traverse(function(o){
    if(o.userData && o.userData.billboard) o.quaternion.copy(camera.quaternion);
  });
}

function renderAtTime(t){
  var i,j,k,u,w,x,y,z,a,r,d,s,p,q;

  for(i=0;i<ALL_GROUPS.length;i++) ALL_GROUPS[i].visible=false;
  STARS.visible=false;
  ambL.intensity=0.0; keyL.intensity=0.0; rimL.intensity=0.0;
  camera.fov=44; camera.up.set(0,1,0);

  var lensVig=0.34, lensGrain=0.040, lensCA=0.0015, lensFlash=0.0, lensExpo=1.02;

  /* ===================================================================
   * S01–S04, S23 (chen), S71 — BAU TROI SAO + CHAM QUASAR VO DANH
   * =================================================================== */
  var w_sky = Math.max(WR(t,'S01','S03',0.40), WR(t,'S04','S04',0.40));
  if(w_sky>0.004){
    STARS.visible=true;
    setGroupOp(gQdot, 1.0);
    /* CAM_S01: goc chuan — S94 tai dung y het o cuoi tap */
    var u_yaw=0;
    var u_star=1.0, u_core=0.95, u_halo=0.0, u_cs=1.6, u_hs=0.0;

    if(inSc(t,'S01')){
      u=loc(t,'S01');
      /* tinh hoan toan 2s dau (khop im lang mo dau), roi drift 0.4 do/s sang trai */
      var u_t1=Math.max(0, ts(t,'S01')-2.0);
      u_yaw = u_t1*0.4*Math.PI/180;
      camera.fov=45;
    } else if(inSc(t,'S02')){
      u=loc(t,'S02');
      u_yaw = (5.67*0.4 + ts(t,'S02')*0.4)*Math.PI/180;
      camera.fov=lerp(45,52,eInOut(u));         /* 45mm -> 38mm (goc rong hon) */
      /* 6 vong tra cuu bat/tat, bam vao SAO KHAC */
      setGroupOp(gLookup, 1.0);
      for(i=0;i<LOOKUPS.length;i++){
        var r_lk=LOOKUPS[i];
        var r_a=band(ts(t,'S02'), r_lk.t0, r_lk.t0+0.8, 0.22);
        r_lk.m.material.opacity=0.72*r_a;
        r_lk.m.quaternion.copy(camera.quaternion);
      }
    } else if(inSc(t,'S03')){
      u=eInOut(loc(t,'S03'));
      u_yaw=(5.67*0.4+9.96*0.4)*Math.PI/180;
      camera.fov=lerp(52,24,u);                 /* push-in 38mm -> 85mm */
      /* moi sao khac mo dan ve 0 trong 1.5s */
      u_star=1.0-smooth(pr01(ts(t,'S03'),0.2,1.7));
      /* cham tang emissive 1.0 -> 3.2 nhung DUONG KINH giu nguyen: chi halo no */
      var r_em=lerp(1.0,3.2,smooth(pr01(ts(t,'S03'),0.4,2.6)));
      u_core=0.95;
      u_cs=1.6;                                  /* loi giu nguyen — sang hon != to hon */
      u_halo=clamp((r_em-1.0)/2.2,0,1)*0.55;
      u_hs=lerp(2.0, 11.0, clamp((r_em-1.0)/2.2,0,1));
    } else {
      /* S04 — cham don doc tren nen den tuyet doi, tho rat nhe +-0.5% */
      u=loc(t,'S04');
      u_yaw=(5.67*0.4+9.96*0.4)*Math.PI/180;
      u_star=0.0;
      camera.fov=24*(1+0.005*Math.sin(ts(t,'S04')*0.9));
      u_core=0.95; u_cs=1.6;
      u_halo=0.55; u_hs=11.0;
      setGroupOp(gNumBox, band(ts(t,'S04'),1.2,7.5,0.7));
      gNumBox.position.copy(QDOT_DIR.clone().multiplyScalar(22));
      gNumBox.position.y -= 3.2;
      gNumBox.quaternion.copy(camera.quaternion);
    }
    STARS.material.uniforms.uOp.value = u_star*w_sky;
    placeQdot(22, u_cs*(inSc(t,'S04')||inSc(t,'S03')?1.0:0.9), u_hs, u_core*w_sky, u_halo*w_sky);
    /* camera o goc toa do nhin theo -Z, yaw quay trai */
    camera.position.set(0,0,0);
    camera.rotation.set(0, u_yaw, 0, 'YXZ');
    if(inSc(t,'S03')||inSc(t,'S04')){
      /* huong thang vao cham khi push-in */
      var r_lk2=QDOT_DIR.clone().multiplyScalar(100);
      camera.lookAt(r_lk2);
    }
    lensVig=0.38; lensGrain=0.046;
  }

  /* ===================================================================
   * S05 — DAI NGAN HA NHIN NGHIENG, camera dang khoi mat phang 0 -> 32 do
   * =================================================================== */
  var w_g5=WR(t,'S05','S05',0.45);
  if(w_g5>0.004){
    STARS.visible=true; STARS.material.uniforms.uOp.value=0.32*w_g5;
    setGroupOp(gGal1, w_g5);
    u=loc(t,'S05');
    /* quay CUNG CHIEU KIM DONG HO nhin tu cuc bac thien ha (+Y) -> goc am */
    gGal1.rotation.y = -t*0.016;
    gal1Core.scale.setScalar(1.5);
    var r_el=lerp(0.0, 32.0, eInOut(u))*Math.PI/180;
    var r_dist=13.5;
    camAt(0, Math.sin(r_el)*r_dist, Math.cos(r_el)*r_dist, 0,0,0, 60);
    gGal1.scale.setScalar(1.0);
    gGal1.position.set(0,0,0);
    lensVig=0.36;
  }

  /* ===================================================================
   * S06 — thien ha co lai thanh MOT ngon den canh cham quasar + thanh do sang
   * =================================================================== */
  var w_g6=WR(t,'S06','S06',0.40);
  if(w_g6>0.004){
    STARS.visible=true; STARS.material.uniforms.uOp.value=0.26*w_g6;
    setGroupOp(gGal1, w_g6);
    setGroupOp(gLumBars, w_g6);
    u=loc(t,'S06');
    var r_sh=lerp(1.0, 0.06, smooth(pr01(ts(t,'S06'),0.3,2.1)));
    gGal1.scale.setScalar(r_sh);
    gGal1.rotation.y=-t*0.016;
    gGal1.position.set(-2.3, 0.35, 0);
    gal1Core.scale.setScalar(lerp(1.5, 26.0, 1.0-r_sh/1.0));
    gal1Core.material.opacity=0.62*w_g6*(1.0-r_sh)+0.15;
    /* cham quasar ben phai giu NGUYEN kich thuoc */
    setGroupOp(gQdot, w_g6);
    qdotSpr.position.set(2.3,0.35,0); qdotSpr.scale.setScalar(0.42);
    qdotSpr.material.opacity=0.95*w_g6;
    qdotHalo.position.set(2.3,0.35,0); qdotHalo.scale.setScalar(1.7);
    qdotHalo.material.opacity=0.30*w_g6;
    /* thanh: thien ha cao 1 don vi; quasar leo 12x roi 100x (tick log) */
    lumBarA.scale.y=1.05;
    var r_lv=smooth(pr01(ts(t,'S06'),1.6,4.2))*0.5 + smooth(pr01(ts(t,'S06'),4.4,6.8))*0.5;
    lumBarB.scale.y=lerp(0.02, 4.2, r_lv);
    gLumBars.traverse(function(o){ if(o.userData.tag==='x100')
      o.material.opacity=0.86*w_g6*smooth(pr01(ts(t,'S06'),5.2,6.6)); });
    camAt(0,0.4,12.6, 0,0.2,0, 62);
    lensVig=0.36;
  }

  /* ===================================================================
   * S07 — push-in vao cham, vong he Mat Troi net dut bao quanh
   * =================================================================== */
  var w_s7=WR(t,'S07','S07',0.35);
  if(w_s7>0.004){
    STARS.visible=true; STARS.material.uniforms.uOp.value=0.18*w_s7;
    setGroupOp(gSolRing, w_s7*smooth(pr01(ts(t,'S07'),0.6,2.4)));
    setGroupOp(gQdot, w_s7);
    u=eInOut(loc(t,'S07'));
    qdotSpr.position.set(0,0,0); qdotSpr.scale.setScalar(0.34);
    qdotSpr.material.opacity=0.95*w_s7;
    qdotHalo.position.set(0,0,0); qdotHalo.scale.setScalar(1.35);
    qdotHalo.material.opacity=0.26*w_s7;
    gSolRing.position.set(0,0,0);
    gSolRing.quaternion.copy(camera.quaternion);
    camAt(0,0,lerp(9.5,5.2,u), 0,0,0, lerp(62,34,u));
    lensVig=0.38;
  }

  /* ===================================================================
   * S08 — split-screen ti le 100.000 ly vs 9 gio anh sang
   * =================================================================== */
  var w_s8=WR(t,'S08','S08',0.35);
  if(w_s8>0.004){
    setGroupOp(gSplit8, w_s8);
    u=loc(t,'S08');
    gSplit8.userData.gl.rotation.z=-t*0.03;
    gSplit8.traverse(function(o){ if(o.userData.tag==='ratio')
      o.material.opacity=0.86*w_s8*smooth(pr01(u,0.45,0.72)); });
    /* d=6.6 fov44: chu h0.34*KTEXT -> 35px, dat */
    camAt(0,0,6.6, 0,0,0, 44);
    lensVig=0.40; lensGrain=0.034;
  }

  /* ===================================================================
   * S09 — vong he Mat Troi con lai mot minh, rung nhe, Dutch 2 do
   * =================================================================== */
  var w_s9=WR(t,'S09','S09',0.40);
  if(w_s9>0.004){
    setGroupOp(gSolRing, w_s9);
    setGroupOp(gSolTicks, w_s9);
    u=loc(t,'S09');
    gSolRing.position.set(0,0,0); gSolRing.rotation.set(0,0,0);
    gSolTicks.position.set(0,0,0);
    for(i=0;i<gSolTicks.children.length;i++){
      var r_tk=gSolTicks.children[i];
      var r_bl=0.5+0.5*Math.sin(ts(t,'S09')*3.4 + r_tk.userData.ph*6.28);
      r_tk.material.opacity=0.62*w_s9*r_bl*(1.0-smooth(pr01(u,0.42,0.92)));
    }
    /* rung rat nhe — ham thuan cua t */
    var r_sk=Math.sin(t*7.3)*0.010*(1.0-smooth(pr01(u,0.3,0.8)));
    camera.position.set(r_sk,0,6.2);
    camera.lookAt(0,0,0);
    camera.rotation.z=2.0*Math.PI/180;   /* Dutch 2 do */
    camera.fov=44;
    lensVig=0.46;
  }

  /* ===================================================================
   * S10 — dai thien van vo tuyen, 5 chao quay DONG BO, crane len
   * =================================================================== */
  var w_s10=WR(t,'S10','S10',0.40);
  if(w_s10>0.004){
    STARS.visible=true; STARS.material.uniforms.uOp.value=0.42*w_s10;
    setGroupOp(gDish, w_s10);
    ambL.intensity=0.22; rimL.intensity=0.16; rimL.color.setRGB(0.22,0.40,0.62);
    u=eInOut(loc(t,'S10'));
    /* tat ca quay DONG BO theo cung mot huong thien dinh */
    var r_az=-0.30 + t*0.020;
    for(i=0;i<DISHES.length;i++){
      DISHES[i].rotation.y=r_az;
      DISHES[i].rotation.x=0.34+0.06*Math.sin(t*0.09);
    }
    /* bau troi sao troi dung chieu quay Trai Dat (dong -> tay) */
    STARS.rotation.y = -t*0.0075;
    camAt(0, lerp(-1.05, 3.6, u), lerp(5.0, 11.5, u), 0, lerp(-0.6,0.2,u), 0, 66);
    lensVig=0.42; lensGrain=0.048;
  } else { STARS.rotation.y=0; }

  /* ===================================================================
   * S11/S12 — ban do vo tuyen: 8 VET nhoe, roi 3 cham SAC NET; cross-fade quang hoc
   * =================================================================== */
  var w_s11=WR(t,'S11','S12',0.34);
  if(w_s11>0.004){
    setGroupOp(gRadioMap, w_s11);
    var r_pan, r_z, r_fov;
    if(inSc(t,'S11')){
      u=loc(t,'S11');
      r_pan=lerp(-1.8, 1.0, u); r_z=8.4; r_fov=50;
      /* 3 cham sac chua hien */
      for(i=0;i<RADIO_POINTS.length;i++)
        setGroupOp(RADIO_POINTS[i], w_s11*smooth(pr01(u,0.82,1.0)));
      setGroupOp(gOptical, 0.0);
    } else {
      u=loc(t,'S12');
      /* dung pan, push-in vao mot trong ba cham 35 -> 75mm */
      r_pan=lerp(1.0, RADIO_POINTS[1].position.x, eInOut(clamp(u/0.45,0,1)));
      r_z=lerp(8.4, 3.0, eInOut(clamp(u/0.55,0,1)));
      r_fov=lerp(50, 26, eInOut(clamp(u/0.55,0,1)));
      for(i=0;i<RADIO_POINTS.length;i++) setGroupOp(RADIO_POINTS[i], w_s11);
      /* cross-fade sang anh quang hoc cung toa do */
      var r_cf=smooth(pr01(u,0.58,0.88));
      setGroupOp(gRadioMap, w_s11*(1.0-r_cf*0.92));
      setGroupOp(gOptical, w_s11*r_cf);
      gOptical.position.set(RADIO_POINTS[1].position.x, RADIO_POINTS[1].position.y, 0);
      gOptical.scale.setScalar(0.30);
    }
    /* vet nhoe tho rat nhe */
    for(i=0;i<RADIO_BLOBS.length;i++){
      RADIO_BLOBS[i].scale.setScalar(1.0+0.02*Math.sin(t*0.5+i));
    }
    camAt(r_pan, inSc(t,'S12')?RADIO_POINTS[1].position.y*0.7:0, r_z,
          r_pan, inSc(t,'S12')?RADIO_POINTS[1].position.y*0.7:0, 0, r_fov);
    lensVig=0.40; lensGrain=0.052;
  }

  /* ===================================================================
   * S13 — KHOANH KHAC DAT TEN "quasar". Tinh tuyet doi, tong tai lieu luu tru.
   * Chu h 0.40 @ cam d=20 fov44 -> 50px (HFA.estimatePx). Luminance 0.86 op,
   * DUOI nguong bloom 1.0 — chu phai doc ro, khong nhoe.
   * =================================================================== */
  var w_s13=WR(t,'S13','S13',0.40);
  if(w_s13>0.004){
    setGroupOp(gName, w_s13);
    setGroupOp(gFilm, w_s13*0.9);
    u=loc(t,'S13');
    /* go ra tung ky tu: 4 tu lan luot */
    for(i=0;i<nameFull.length;i++){
      nameFull[i].material.opacity=0.86*w_s13*smooth(pr01(ts(t,'S13'), 0.7+i*0.62, 1.3+i*0.62));
    }
    /* hai dau bi gach bo */
    var r_str=smooth(pr01(ts(t,'S13'), 4.6, 5.9));
    nameStrike[0].material.opacity=0.80*w_s13*r_str;
    nameStrike[1].material.opacity=0.80*w_s13*r_str;
    /* QUASAR no to */
    var r_qk=smooth(pr01(ts(t,'S13'), 6.1, 7.6));
    gName.userData.q.material.opacity=0.86*w_s13*r_qk;
    gName.userData.q.scale.setScalar(lerp(0.80,1.0,eOut(r_qk)));
    /* nhan giu 1s roi mo */
    var r_fade=1.0-smooth(pr01(ts(t,'S13'), 12.6, 14.4));
    setGroupOp(gName, w_s13*r_fade);
    gFilm.userData.plane.position.copy(camera.position);
    gFilm.userData.plane.quaternion.copy(camera.quaternion);
    gFilm.userData.plane.translateZ(-1.2);
    gFilm.userData.plane.scale.setScalar(1.9);
    camAt(0,0,20, 0,0,0, 44);
    lensVig=0.46; lensGrain=0.075; lensCA=0.0022; lensExpo=0.96;
  }

  /* ===================================================================
   * S14/S15 — may quang pho: lang kinh, dai pho voi vach LON XON; roi dolly-out
   * =================================================================== */
  var w_s14=WR(t,'S14','S15',0.30);
  if(w_s14>0.004){
    setGroupOp(gPrism, w_s14);
    if(inSc(t,'S14')){
      u=loc(t,'S14');
      gPrism.traverse(function(o){ if(o.userData.tag==='q')
        o.material.opacity=0.86*w_s14*smooth(pr01(u,0.55,0.9)); });
      camAt(0.6,0,11.0, 0.6,0,0, 44);
    } else {
      u=eInOut(loc(t,'S15'));
      gPrism.traverse(function(o){ if(o.userData.tag==='q') o.material.opacity=0.0; });
      /* chi con dai pho, mo di 40% */
      setGroupOp(gPrism, w_s14*lerp(1.0,0.60,u));
      camAt(lerp(0.6,1.9,u),0,lerp(11.0,16.5,u), lerp(0.6,1.9,u),lerp(0,-0.35,u),0, 44);
    }
    lensVig=0.42;
  }

  /* ===================================================================
   * S16 — bai hoc van tay: 4 vach Balmer roi dung vi tri, KHOANG CACH THAT
   * =================================================================== */
  var w_s16=WR(t,'S16','S16',0.40);
  if(w_s16>0.004){
    setGroupOp(gFinger, w_s16);
    u=loc(t,'S16');
    for(i=0;i<4;i++){
      var r_dp=smooth(pr01(ts(t,'S16'), 1.4+i*0.85, 2.3+i*0.85));
      fingerLines[i].material.opacity=0.92*w_s16*r_dp;
      fingerLines[i].position.y=0.85 + (1.0-r_dp)*0.9;   /* roi xuong dung cho */
      fingerLabels[i].material.opacity=0.86*w_s16*smooth(pr01(ts(t,'S16'),2.0+i*0.85,2.8+i*0.85));
    }
    /* bo vach helium — khac han, hien sau */
    for(i=4;i<8;i++){
      fingerLines[i].material.opacity=0.92*w_s16*smooth(pr01(ts(t,'S16'),8.2+(i-4)*0.45,8.9+(i-4)*0.45));
    }
    /* d=8.0 fov44: h0.30*1.85 -> 25px... nang: dung fov 38 de du 29px */
    camAt(0,0.15,8.0, 0,0.15,0, 38);
    lensVig=0.40; lensGrain=0.032;
  }

  /* ===================================================================
   * S17 — ba dai pho, vach roi DUNG CUNG MOT COT; duong dong sang len
   * =================================================================== */
  var w_s17=WR(t,'S17','S17',0.35);
  if(w_s17>0.004){
    setGroupOp(gThree, w_s17);
    u=loc(t,'S17');
    var r_al=gThree.userData.align;
    for(i=0;i<r_al.length;i++)

  /* S33/S34 — hat khi truot xuong thanh pheu; camera LUON O NGOAI pheu */

  if(w_s33>0.004){
    setGroupOp(gFunnel, w_s33*0.72);

    var r_k3, r_frz=0;
    if(inSc(t,'S33')){

    var r_as=-1.2 + r_k3*7.5;
    var r_ys=FUNNEL.userData.depth(Math.max(r_rs,0.30));
    gSlide.userData.p.position.set(Math.cos(r_as)*r_rs, r_ys, -Math.sin(r_as)*r_rs);

    if(gSlide.userData.spd.userData.lastv!==r_pc){
      gSlide.userData.spd.userData.lastv=r_pc;
      gSlide.userData.spd.material.map.dispose();
      gSlide.userData.spd.material.map=textTex(r_pc+' % c',68,COL.TEXTWARN,520,120);
    }
    gSlide.userData.spd.quaternion.copy(camera.quaternion);
    gSlide.userData.spd.position.set(3.6, 2.2, 0);
    if(r_frz){
      /* mui ten van toc TIEP TUYEN — vuong goc huong roi */
      u=loc(t,'S34');
      var r_av=smooth(pr01(ts(t,'S34'),0.8,2.2));
      gSlide.userData.arrow.visible=true;
      gSlide.userData.arrow.position.copy(gSlide.userData.p.position);
      gSlide.userData.arrow.rotation.set(0, -r_as + Math.PI/2, 0);
      gSlide.userData.arrow.scale.setScalar(Math.max(0.001,r_av));
      gSlide.traverse(function(o){
        if(o.material && o.material.transparent && o.parent===gSlide.userData.arrow)
          o.material.opacity=0.86*w_s33*r_av;
      });
      setGroupOp(gSlide.userData.arrow, w_s33*r_av);
      /* quy dao du doan doi tu thang xuong sang cong vong */
      var r_pr=smooth(pr01(ts(t,'S34'),2.6,6.4));
      var r_pts=gSlide.userData.pred.geometry.attributes.position;
      for(i=0;i<=48;i++){
        var r_s5=i/48;
        var r_straightR=r_rs, r_straightY=r_ys - r_s5*3.2;
        var r_curveA=r_as + r_s5*3.4, r_curveR=r_rs*(1.0-r_s5*0.18);
        var r_x2=lerp(Math.cos(r_as)*r_straightR, Math.cos(r_curveA)*r_curveR, r_pr);
        var r_y2=lerp(r_straightY, FUNNEL.userData.depth(Math.max(r_curveR,0.30)), r_pr);
        var r_z2b=lerp(-Math.sin(r_as)*r_straightR, -Math.sin(r_curveA)*r_curveR, r_pr);
        r_pts.setXYZ(i, r_x2, r_y2, r_z2b);
      }
      r_pts.needsUpdate=true;
      gSlide.userData.pred.material.opacity=0.55*w_s33*smooth(pr01(ts(t,'S34'),2.2,3.6));
      /* tinh tuyet doi, hat lech trai */
      camAt(-1.8, 1.2, 8.6, -0.6, -0.9, 0, 40);
    } else {
      gSlide.userData.arrow.visible=false;
      gSlide.userData.pred.material.opacity=0.0;
      /* bam theo hat nhung LUON O NGOAI pheu, nhin tu ben ngoai mat luoi */
      var r_cd=8.4;
      camAt(Math.cos(r_as-1.1)*r_cd, 3.4-r_k3*1.4, -Math.sin(r_as-1.1)*r_cd,
            gSlide.userData.p.position.x*0.5, r_ys*0.55, gSlide.userData.p.position.z*0.5, 38);
    }
    lensVig=0.42;
  }

  /* S35 — ~40.000 particle det ve MOT mat phang; NGUOC KIM DONG HO tu +Y */
  var w_s35=WR(t,'S35','S35',0.38);
  if(w_s35>0.004){
    setGroupOp(gFlatten, w_s35);
    u=loc(t,'S35');
    var r_uni=gFlatten.userData.pts.material.uniforms;
    r_uni.uT.value=t;
    r_uni.uFlat.value=smooth(pr01(ts(t,'S35'),0.6,12.0));
    r_uni.uOp.value=0.80*w_s35;
    /* goc cao 55 do nhin xuong, xoay quanh truc doc 40 do trong suot shot */
    var r_az2=(-20 + 40*eInOut(u))*Math.PI/180;
    var r_el2=55*Math.PI/180;
    var r_dd2=12.5;
    camAt(Math.sin(r_az2)*Math.cos(r_el2)*r_dd2, Math.sin(r_el2)*r_dd2,
          Math.cos(r_az2)*Math.cos(r_el2)*r_dd2, 0,0,0, 50);
    lensVig=0.40;
  }

  /* ===================================================================
   * S36 — LO DIEN DIA BOI TU. Doppler beaming, gradient nhiet, thau kinh
   * TIET CHE (cung <=25 do). SHOT RUI RO CHAY TRANG #2.
   * =================================================================== */
  var w_disk = Math.max(WR(t,'S36','S36',0.30), WR(t,'S37','S37',0.0),
                        WR(t,'S38','S39',0.34));
  if(w_disk>0.004 && !inSc(t,'S37')){
    setGroupOp(gDisk, w_disk);
    STARS.visible=true; STARS.material.uniforms.uOp.value=0.16*w_disk;
    diskUni.uT.value=t;
    diskUni.uOpacity.value=w_disk;
    diskUni.uDop.value=1.0;
    diskUni.uFill.value=1.0;
    diskUni.uEmis.value=1.0;
    diskUni.uHeat.value=1.0;
    var r_elD, r_dD, r_fovD;
    if(inSc(t,'S36')){
      u=eInOut(loc(t,'S36'));
      /* ha tu 55 do xuong 14 do tren mat phang dia, dolly-out; LUON NGOAI r_out */
      r_elD=lerp(55,14,u)*Math.PI/180;
      r_dD=lerp(9.6,12.8,u);
      r_fovD=lerp(50,58,u);
      /* thau kinh tiet che: mep sau cong nhe len */
      var r_lz=smooth(pr01(ts(t,'S36'),0.9,2.6));
      LENSARC.userData.band.material.opacity=0.30*w_disk*r_lz;
      LENSARC.userData.line.material.opacity=0.26*w_disk*r_lz;
      LENSARC.userData.band.position.y=0.42;
      LENSARC.rotation.y=0;
    } else {
      /* S38/S39 */

      LENSARC.userData.line.material.opacity=0.0;
      if(inSc(t,'S38')){
        u=loc(t,'S38');
        r_elD=22*Math.PI/180; r_dD=12.0; r_fovD=52;
        /* nhiet leo: vung trong chuyen tu vang sang lam tim */
        diskUni.uHeat.value=smooth(pr01(ts(t,'S38'),0.8,8.0));
      } else {
        /* S39 — chinh dien hoi nghieng 20 do, tinh tuyet doi */
        u=loc(t,'S39');
        r_elD=20*Math.PI/180; r_dD=11.2; r_fovD=50;
      }
    }
    camAt(0, Math.sin(r_elD)*r_dD, Math.cos(r_elD)*r_dD, 0,0,0, r_fovD);
    lensVig=0.38;
  }

  /* S37 — can canh hai vong khi lien ke truot qua nhau (Kelvin-Helmholtz) */
  var w_s37=WR(t,'S37','S37',0.32);
  if(w_s37>0.004){

    u=loc(t,'S37');

    for(i=0;i<r_rl.length;i++){
      /* cuon song DEU, seeded, khong random */
      var r_rx=fract01((i/r_rl.length) + t*0.055)*9.0-4.5;
      r_rl[i].position.x=r_rx;
      r_rl[i].scale.setScalar(0.7+0.5*Math.sin(t*0.9+i));
      r_rl[i].material.opacity=0.62*w_s37*smooth(pr01(ts(t,'S37'),1.2,3.4));
      r_rl[i].rotation.z=t*0.6;
    }
    /* dai trong chay nhanh hon RO RET */
    gKH.children[0].position.x=fract01(t*0.14)*0.0;
    camAt(0,0,lerp(10.5,5.6,eInOut(clamp(ts(t,'S37')/5.0,0,1))), 0,0,0,
          lerp(52,30,eInOut(clamp(ts(t,'S37')/5.0,0,1))));
    lensVig=0.40;

  /* S38 — overlay pho vat den, dinh dich sang trai (UV -> X) */
  var w_bb=WR(t,'S38','S38',0.30);
  if(w_bb>0.004){

    u=loc(t,'S38');

      var r_xx=-4.6+i*9.2/80;
      var r_dv=(r_xx-r_pk2);

    gBB.scale.setScalar(0.62);
    lensVig=0.40;

  /* S39 — hai vong khoanh doi lap: "ho den — luon den" vs "thu toi thay" */
  var w_s39=WR(t,'S39','S39',0.32);
  if(w_s39>0.004){

    gAnnot39.userData.lbA.material.opacity=0.86*w_s39*r_a1*r_af;

    gAnnot39.userData.ln2.material.opacity=0.55*w_s39*r_a2*r_af;

  /* S40 — zoom ky thuat so, PSF Airy, 5 nac, thong tin KHONG tang */

    lensVig=0.42; lensGrain=0.050;

  /* S41/S42 — khung graph + BA DUONG CONG nhap nhay. CAMERA TINH TUYET DOI. */
  var w_s41=WR(t,'S41','S42',0.34);
  if(w_s41>0.004){
    setGroupOp(gGraphBlink, w_s41);
    if(inSc(t,'S41')){
      /* khung graph dung len, chua co duong cong */
      u=loc(t,'S41');
      for(i=0;i<BLINK_CURVES.length;i++){
        var r_cu=BLINK_CURVES[i];
        for(j=0;j<r_cu.segs.length;j++) r_cu.segs[j].material.opacity=0.0;
        r_cu.lbl.material.opacity=0.0;
      }
    } else {
      u=loc(t,'S42');
      for(i=0;i<BLINK_CURVES.length;i++){
        var r_cv2=BLINK_CURVES[i];
        /* ve lan luot trai sang phai */
        var r_t0=0.6+i*2.6;
        var r_draw=smooth(pr01(ts(t,'S42'), r_t0, r_t0+2.1));
        for(j=0;j<r_cv2.segs.length;j++){
          var r_fx=j/r_cv2.segs.length;
          var r_on=r_fx<=r_draw ? 1 : 0;
          /* duong cong TINH theo x (ham thuan cua vi tri), khong theo dong ho */
          var r_ph2=(r_fx*8.0)/r_cv2.per*6.2831;
          var r_v=Math.sin(r_ph2)*0.5+Math.sin(r_ph2*2.3+1.1)*0.26+Math.sin(r_ph2*4.7+2.2)*0.14;
          var r_ny=r_cv2.y + r_v*r_cv2.amp;
          var r_nx=-4.0+(j+0.5)*8.0/r_cv2.segs.length;
          var r_pv=(j>0)?r_cv2.segs[j-1].position.y:r_ny;
          r_cv2.segs[j].position.set(r_nx, r_ny, 0.02);
          r_cv2.segs[j].rotation.z=Math.atan2(r_ny-r_pv, 8.0/r_cv2.segs.length);
          /* hai duong kia mo di khi duong "vai gio" len */
          var r_dim = (i<2) ? (1.0-0.66*smooth(pr01(ts(t,'S42'),7.4,9.2))) : 1.0;
          r_cv2.segs[j].material.opacity=(i===2?0.82:(i===0?0.45:0.55))*w_s41*r_on*r_dim;
        }
        r_cv2.lbl.material.opacity=0.86*w_s41*smooth(pr01(ts(t,'S42'), r_t0+1.0, r_t0+1.8));

  /* S43 — CO CHE: vat rong D bat sang dong loat, ba mat song lech pha -> xung D/c */
  var w_s43=WR(t,'S43','S43',0.32);
  if(w_s43>0.004){

    for(i=0;i<3;i++){

      for(j=0;j<r_arr.length;j++){
        var r_g2=Math.exp(-Math.pow((j-13)/5.5,2));
        r_arr[j].position.set(1.95+i*0.30+j*0.075, -2.15+r_g2*0.62, 0.02);

    for(j=0;j<r_sum.length;j++){

      r_sum[j].position.set(1.75+j*0.085, -2.15+r_g3*0.72, 0.03);
      r_sum[j].material.opacity=0.80*w_s43*r_so;
    }

    gPulse.userData.dc.material.opacity=0.80*w_s43*r_dc;
    gPulse.userData.v1.material.opacity=0.60*w_s43*r_dc;
    gPulse.userData.v2.material.opacity=0.60*w_s43*r_dc;
    gPulse.userData.dcl.material.opacity=0.86*w_s43*smooth(pr01(r_ts4,15.0,16.6));
    camAt(0.4,-0.5,12.4, 0.4,-0.5,0, 48);
    lensVig=0.40; lensGrain=0.030;
  }

  /* S44 — PHAN CHUNG: D=1 ly chop 1 ngay -> xung nhoe 1 nam. Cung bo cuc S43. */
  var w_s44=WR(t,'S44','S44',0.30);
  if(w_s44>0.004){
    setGroupOp(gCounter, w_s44);
    u=loc(t,'S44');
    var r_sp2=smooth(pr01(ts(t,'S44'),0.6,1.4));

    gCounter.userData.spike.scale.y=Math.max(0.001,r_sp2);

    for(j=0;j<r_bp.length;j++){

      r_bp[j].position.set(2.6+j*0.088, -1.6+r_g4*0.62, 0.02);
      r_bp[j].material.opacity=0.72*w_s44*r_bo;
    }
    var r_xk=smooth(pr01(ts(t,'S44'),4.4,5.6));
    gCounter.userData.x1.material.opacity=0.88*w_s44*r_xk;
    gCounter.userData.x2.material.opacity=0.88*w_s44*r_xk;
    gCounter.userData.x1.scale.x=Math.max(0.001,r_xk);
    gCounter.userData.x2.scale.x=Math.max(0.001,r_xk);
    camAt(0.4,-0.5,12.4, 0.4,-0.5,0, 48);
    lensVig=0.40; lensGrain=0.030;
  }

  /* S45 — DAO NGUOC: dt vai gio -> D <= c.dt, dat len he Mat Troi (dung ti le) */
  var w_s45=WR(t,'S45','S45',0.32);
  if(w_s45>0.004){

    u=loc(t,'S45');
    var r_sg=smooth(pr01(ts(t,'S45'),2.4,4.0));
    gInfer.userData.seg.material.opacity=0.86*w_s45*r_sg;
    gInfer.userData.seg.scale.x=Math.max(0.001,r_sg);

    var r_pl=gInfer.userData.pls;
    for(i=0;i<r_pl.length;i++){
      var r_pp=r_pl[i];
      var r_pa=r_pp.a0 + t*r_pp.w*0.20;
      r_pp.m.position.set(Math.cos(r_pa)*r_pp.r, Math.sin(r_pa)*r_pp.r, 0.01);

    var r_ov=smooth(pr01(ts(t,'S45'),5.0,7.2));
    gInfer.userData.seg.position.set(0, lerp(1.35,-0.75,r_ov), 0.05);
    u=eInOut(clamp((ts(t,'S45')-6.0)/6.0,0,1));
    camAt(0, lerp(0.4,0.0,u), lerp(12.4,15.4,u), 0, lerp(0.4,-0.3,u), 0, lerp(44,50,u));
    lensVig=0.40; lensGrain=0.032;
  }

  /* S46 — thien ha mo phia sau, vong he Mat Troi de len tam, nho nhu mot diem */
  var w_s46=WR(t,'S46','S46',0.34);
  if(w_s46>0.004){
    setGroupOp(gOverlay46, w_s46);
    u=eInOut(loc(t,'S46'));
    gOverlay46.userData.gal.rotation.z=-t*0.02;
    gOverlay46.userData.gal.userData.uOp.value=0.30*w_s46;
    gOverlay46.userData.b2.scale.y=lerp(0.02,3.4,smooth(pr01(ts(t,'S46'),2.0,6.4)));
    camAt(0, lerp(1.2,2.8,u), lerp(12.0,19.0,u), 0,0,0, lerp(46,62,u));
    lensVig=0.42;
  }

  /* S47–S50 — KHOI GRAPH HIEU SUAT. MOT KHUNG DUY NHAT suot 3 shot. */
  var w_eff=WR(t,'S47','S50',0.34);
  if(w_eff>0.004){
    setGroupOp(gEff, w_eff);
    var r_H=gEff.userData.H;
    /* S47: chi duong co so ngang */
    var r_gk2 = inSc(t,'S47') ? smooth(pr01(ts(t,'S47'),0.6,2.4)) : 1.0;
    for(i=0;i<gEff.userData.grid.length;i++)
      gEff.userData.grid[i].material.opacity=0.16*w_eff*(inSc(t,'S47')?0:1);
    for(i=0;i<gEff.userData.ticks.length;i++)
      gEff.userData.ticks[i].material.opacity=0.72*w_eff*(inSc(t,'S47')?0:1);
    /* S48: thanh 1 = 0,7% tren thang 0-30% -> cao dung 2,33% vung graph */
    var r_b1=0.0;
    if(!inSc(t,'S47')) r_b1=smooth(pr01(t, SC.S48[0]+0.6, SC.S48[0]+2.4));
    gEff.userData.b1.scale.y=Math.max(0.0001, r_H*(0.7/30.0)*r_b1);
    gEff.userData.b1.material.opacity=0.74*w_eff*r_b1;
    gEff.userData.star.position.y=-r_H/2 + r_H*(0.7/30.0)*r_b1 + 0.16;
    gEff.userData.star.material.opacity=0.86*w_eff*r_b1;
    gEff.userData.l1.material.opacity=0.86*w_eff*(inSc(t,'S47')?0:smooth(pr01(t,SC.S48[0]+1.6,SC.S48[0]+3.0)));
    /* S49: thanh 2 moc len 6% roi tiep 30%, vung giua to DAI gradient */
    var r_b2a=0, r_b2b=0;
    if(t>=SC.S49[0]-0.3){
      r_b2a=smooth(pr01(t, SC.S49[0]+0.4, SC.S49[0]+2.2));
      r_b2b=smooth(pr01(t, SC.S49[0]+2.6, SC.S49[0]+5.6));
    }
    gEff.userData.b2.scale.y=Math.max(0.0001, r_H*(6.0/30.0)*r_b2a);
    gEff.userData.b2.material.opacity=0.74*w_eff*r_b2a;
    gEff.userData.b2b.scale.y=Math.max(0.0001, r_H*(6.0/30.0 + (24.0/30.0)*r_b2b));
    gEff.userData.b2b.material.opacity=0.38*w_eff*r_b2b;
    gEff.userData.l2.material.opacity=0.86*w_eff*(t>=SC.S49[0]?smooth(pr01(t,SC.S49[0]+1.2,SC.S49[0]+2.6)):0);
    gEff.userData.spin.material.opacity=0.72*w_eff*r_b2b;
    gEff.userData.spin.rotation.z=t*(0.4+2.6*r_b2b);
    gEff.userData.spl.material.opacity=0.80*w_eff*r_b2b;
    /* S50: ngoac doc + x10..x40 + dong thanh mong xep chong */
    var r_s50 = (t>=SC.S50[0]-0.3) ? smooth(pr01(t, SC.S50[0]+0.3, SC.S50[0]+1.6)) : 0;
    gEff.userData.brace.material.opacity=0.76*w_eff*r_s50;
    gEff.userData.brace.scale.x=Math.max(0.001, r_s50);
    gEff.userData.brace.position.y=-r_H/2 + r_H*(15.35/30.0);
    gEff.userData.brace.scale.x=1;
    gEff.userData.brace.geometry.dispose?0:0;
    /* dung ngoac bang box mong: dat chieu dai qua scale tren truc x cua lineBox
       (lineBox nam ngang) -> xoay 90 do */
    gEff.userData.brace.rotation.z=Math.PI/2;
    gEff.userData.brace.scale.x=Math.max(0.001, (r_H*(30.0-0.7)/30.0)*r_s50/0.02);
    gEff.userData.ratio.material.opacity=0.86*w_eff*smooth(pr01(t,SC.S50[0]+1.4,SC.S50[0]+2.8));
    var r_stk=gEff.userData.stack;
    var r_nstack=Math.floor(smooth(pr01(t, SC.S50[0]+2.6, SC.S50[0]+6.2))*40);
    for(i=0;i<r_stk.length;i++)
      r_stk[i].material.opacity=0.62*w_eff*(i<r_nstack?1:0)*r_s50;
    /* TINH; S50 zoom nhe vao khoang cach giua hai dinh */
    var r_zz = inSc(t,'S50') ? eInOut(loc(t,'S50')) : 0;
    camAt(0, lerp(0,0.4,r_zz), lerp(12.2,10.4,r_zz), 0, lerp(0,0.4,r_zz), 0, lerp(48,42,r_zz));
    lensVig=0.40; lensGrain=0.030;
  }

  /* S51 — bang xep hang hieu suat 3 hang; hang 1 sang loe roi TAT HAN */
  var w_s51=WR(t,'S51','S51',0.32);
  if(w_s51>0.004){
    setGroupOp(gRank, w_s51);
    u=loc(t,'S51');
    var r_rw2=gRank.userData.rows;
    for(i=0;i<3;i++) setGroupOp(r_rw2[i], w_s51*smooth(pr01(ts(t,'S51'),0.4+i*0.9,1.2+i*0.9)));
    /* hai qua cau doi xung guong lao vao nhau roi bien mat hoan toan */
    var r_an=smooth(pr01(ts(t,'S51'),3.4,5.4));
    gRank.userData.pa.position.set(lerp(-3.6,-0.05,r_an),0,0.02);
    gRank.userData.pb.position.set(lerp( 3.6, 0.05,r_an),0,0.02);
    var r_gone=smooth(pr01(ts(t,'S51'),5.3,5.8));
    gRank.userData.pa.material.opacity=0.88*w_s51*(1.0-r_gone);
    gRank.userData.pb.material.opacity=0.88*w_s51*(1.0-r_gone);
    gRank.userData.flash.material.opacity=0.70*w_s51*pulse(t,SC.S51[0]+5.3,SC.S51[0]+6.3);
    gRank.userData.flash.scale.setScalar(0.3+2.0*pr01(t,SC.S51[0]+5.3,SC.S51[0]+6.3));
    /* hang 1 va 3 mo, con hang 2 */
    var r_keep=smooth(pr01(ts(t,'S51'),8.2,10.0));
    setGroupOp(r_rw2[0], w_s51*(1.0-r_keep*0.88));
    setGroupOp(r_rw2[2], w_s51*(1.0-r_keep*0.88));
    camAt(0,0,12.2, 0,0,0, 50);
    lensVig=0.42;
  }

  /* S52 — KE AN TAP: khi/bui/hanh tinh/sao bi keo thanh tidal stream */
  var w_s52=WR(t,'S52','S52',0.36);
  if(w_s52>0.004){
    setGroupOp(gDisk, w_s52*0.92);
    setGroupOp(gFeed, w_s52);
    STARS.visible=true; STARS.material.uniforms.uOp.value=0.14*w_s52;
    diskUni.uT.value=t; diskUni.uOpacity.value=w_s52*0.92;
    diskUni.uHeat.value=1.0; diskUni.uDop.value=1.0; diskUni.uFill.value=1.0; diskUni.uEmis.value=1.0;
    LENSARC.userData.band.material.opacity=0.0;
    LENSARC.userData.line.material.opacity=0.0;
    gFeed.userData.pts.material.uniforms.uT.value=t;
    gFeed.userData.pts.material.uniforms.uOp.value=0.80*w_s52;
    /* hanh tinh don le bi cuon, keo thanh soi khi vao gan */
    var r_pk3=smooth(pr01(ts(t,'S52'),1.0,13.0));
    var r_pr2=lerp(7.2,1.4,r_pk3);
    var r_pa2=-0.5 + r_pk3*7.0;
    gFeed.userData.planet.position.set(Math.cos(r_pa2)*r_pr2, 0.15*(1-r_pk3), -Math.sin(r_pa2)*r_pr2);
    gFeed.userData.planet.scale.setScalar(lerp(1.0,0.35,r_pk3));
    var r_pt2=gFeed.userData.ptrail;
    for(i=0;i<r_pt2.length;i++){
      var r_kk2=Math.max(0,r_pk3-(i+1)*0.016);
      var r_rr3=lerp(7.2,1.4,r_kk2), r_aa2=-0.5+r_kk2*7.0;
      r_pt2[i].position.set(Math.cos(r_aa2)*r_rr3, 0.15*(1-r_kk2), -Math.sin(r_aa2)*r_rr3);
      r_pt2[i].material.opacity=0.50*(1-i/22)*w_s52*clamp(r_pk3*2.4,0,1);
    }
    /* ngoi sao di ngang bi keo thanh dong thuy trieu dai, quan vai vong */
    var r_sk2=smooth(pr01(ts(t,'S52'),7.0,22.0));
    var r_str2=gFeed.userData.stream;
    for(i=0;i<r_str2.length;i++){
      var r_f2=i/r_str2.length;
      var r_kk3=clamp(r_sk2*1.25 - r_f2*0.55, 0, 1);
      var r_rr4=lerp(8.6, 2.1, r_kk3);
      var r_aa3=1.2 + r_kk3*11.0 + r_f2*0.9;
      r_str2[i].position.set(Math.cos(r_aa3)*r_rr4, (1-r_kk3)*0.5*(r_f2-0.5)*2.0, -Math.sin(r_aa3)*r_rr4);
      r_str2[i].material.opacity=0.42*w_s52*clamp(r_sk2*2.0-r_f2*0.4,0,1);
    }
    var r_ss=clamp(r_sk2*1.25,0,1);
    var r_sr=lerp(8.6,2.1,r_ss), r_sa=1.2+r_ss*11.0;
    gFeed.userData.ststar.position.set(Math.cos(r_sa)*r_sr, 0, -Math.sin(r_sa)*r_sr);
    gFeed.userData.ststar.scale.setScalar(lerp(1.0,0.4,r_ss));
    gFeed.userData.ststar.material.opacity=0.90*w_s52*(1.0-smooth(pr01(r_ss,0.88,1.0)));
    gFeed.userData.mbar.scale.y=lerp(0.02,3.0,smooth(pr01(ts(t,'S52'),1.0,22.0)));
    billboard(gFeed);
    /* goc cao 45 do nhin xuong, xoay quanh 30 do; LUON NGOAI r_out */
    u=loc(t,'S52');
    var r_az3=(-15+30*eInOut(u))*Math.PI/180, r_el3=45*Math.PI/180, r_dd3=14.5;
    camAt(Math.sin(r_az3)*Math.cos(r_el3)*r_dd3, Math.sin(r_el3)*r_dd3,

    lensVig=0.38;

  /* S53 — tu truong xoan oc kep; hai huong thoat VUONG GOC mat phang dia */

    var r_ps=gMag.userData.ps;
    for(i=0;i<r_ps.length;i++){
      var r_pp2=r_ps[i];

      var r_yy3=r_pp2.up*(r_kp*5.0);

      r_pp2.m.material.opacity=0.62*w_s53*smooth(pr01(ts(t,'S53'),3.0,6.0))*
        (1.0-clamp((Math.abs(r_yy3)-3.8)/1.2,0,1));

  /* S54–S56 — JET: hai tia doi xung, goc mo <=5 do, nut sang di chuyen ra ngoai */

    setGroupOp(gJet, w_jet);

    jetUni.uOpacity.value=w_jet;
    jetUni.uKnot.value=1.0;
    diskUni.uT.value=t; diskUni.uOpacity.value=w_jet*0.8;
    diskUni.uHeat.value=1.0; diskUni.uDop.value=0.7; diskUni.uFill.value=1.0; diskUni.uEmis.value=1.0;
    var r_cd2, r_fovJ, r_cy;
    if(inSc(t,'S54')){
      u=eInOut(loc(t,'S54'));
      jetUni.uLen.value=lerp(0.10,0.34,u);
      r_cd2=lerp(9.0,20.0,u); r_fovJ=lerp(40,62,u); r_cy=lerp(0.5,1.5,u);
      setGroupOp(gJetScale, 0.0);
    } else if(inSc(t,'S55')){
      u=eInOut(loc(t,'S55'));
      jetUni.uLen.value=lerp(0.34,1.0,u);
      r_cd2=lerp(20.0,62.0,u); r_fovJ=lerp(62,84,u); r_cy=lerp(1.5,5.0,u);
      /* thien ha chu xuat hien va tut lai phia sau */
      setGroupOp(gHostGal, w_jet*smooth(pr01(ts(t,'S55'),2.4,6.4)));
      gHostGal.scale.setScalar(1.0);
      gHostGal.rotation.x=-0.42; gHostGal.rotation.y=t*0.008;
      gHostGal.position.set(0,0,0);
      gHostGal.userData.gal.userData.uOp.value=0.44*w_jet;
      gHostGal.userData.wash.material.opacity=0.20*w_jet;
      gHostGal.userData.wash.rotation.x=-0.42;
      /* thuoc dong chay doc jet: 10.000 -> 50.000 -> 200.000 ly */
      setGroupOp(gJetScale, w_jet*smooth(pr01(ts(t,'S55'),1.0,2.4)));
      var r_num = ts(t,'S55')<4.0 ? '10.000 ly' : (ts(t,'S55')<7.0 ? '50.000 ly' : '200.000 ly');
      if(gJetScale.userData.num.userData.lastv!==r_num){
        gJetScale.userData.num.userData.lastv=r_num;
        gJetScale.userData.num.material.map.dispose();
        gJetScale.userData.num.material.map=textTex(r_num,90,COL.TEXTWARN,760,140);
      }
      gJetScale.position.set(0, 9.0, 0);
      gJetScale.scale.setScalar(lerp(1.0,3.4,u));
      billboard(gJetScale);
    } else {
      /* S56 — TINH TUYET DOI, jet ngang khung, Ngan Ha lam thuoc ben duoi */
      u=loc(t,'S56');
      jetUni.uLen.value=1.0;
      r_cd2=62.0; r_fovJ=84; r_cy=5.0;
      setGroupOp(gHostGal, 0.0);
      setGroupOp(gMWruler, w_jet*smooth(pr01(ts(t,'S56'),0.6,2.4)));
      /* Ngan Ha 100.000 ly dat SONG SONG duoi jet — jet dai gap doi */
      gMWruler.position.set(0,-11.0,0);
      gMWruler.scale.setScalar(2.55);
      gMWruler.rotation.y=Math.PI/2;
      setGroupOp(gJetScale, w_jet);
      if(gJetScale.userData.num.userData.lastv!=='200.000 ly'){
        gJetScale.userData.num.userData.lastv='200.000 ly';
        gJetScale.userData.num.material.map.dispose();
        gJetScale.userData.num.material.map=textTex('200.000 ly',90,COL.TEXTWARN,760,140);

      gJetScale.scale.setScalar(3.4);
      billboard(gJetScale);

    /* side-view hoan toan: truc dia doc khung */
    if(inSc(t,'S56')){

      gJet.rotation.z=Math.PI/2;
    } else {
      gJet.rotation.z=0;

    camAt(r_cd2*0.32, r_cy, r_cd2, 0, inSc(t,'S56')?0:r_cy*0.4, 0, r_fovJ);

  var w_s60=WR(t,'S60','S60',0.32);
  if(w_s60>0.004){
    setGroupOp(gAxisFlip, w_s60);
    u=loc(t,'S60');
    var r_fl=smooth(pr01(ts(t,'S60'),1.8,3.6));

    lensVig=0.40; lensGrain=0.030;

  var w_s61=WR(t,'S61','S61',0.34);
  if(w_s61>0.004){

    var r_px=lerp(-6.0, 4.2, r_pg);

    gPhoton.userData.age.scale.y=lerp(0.02,3.4,r_pg);

    lensVig=0.40;
  }

  /* S62 — quasar la mot GIAI DOAN: dai lam tim tren truc thoi gian */
  var w_s62=WR(t,'S62','S62',0.34);
  if(w_s62>0.004){
    setGroupOp(gPhase, w_s62);
    u=loc(t,'S62');
    var r_sg2=gPhase.userData.segs;
    for(i=0;i<r_sg2.length;i++){
      var r_dw=smooth(pr01(ts(t,'S62'), 0.8+i*0.055, 1.6+i*0.055));
      r_sg2[i].material.opacity=r_sg2[i].userData.baseOp*w_s62*r_dw;
    }
    var r_sk3=smooth(pr01(ts(t,'S62'),9.0,10.6));
    gPhase.userData.strike.material.opacity=0.86*w_s62*r_sk3;
    gPhase.userData.strike.scale.x=Math.max(0.001,r_sk3);
    gPhase.userData.lt.material.opacity=0.86*w_s62*(1.0-r_sk3*0.5);
    gPhase.userData.lg.material.opacity=0.86*w_s62*smooth(pr01(ts(t,'S62'),11.0,12.6));
    camAt(0,0.2,13.4, 0,0.2,0, 52);
    lensVig=0.40; lensGrain=0.030;
  }

  /* S63 — GRAPH MAT DO QUASAR, dinh o tuoi ~3.5 ti nam (= 10 ti nam truoc).
   * TINH TUYET DOI, doc duoc trong 3 giay. */
  var w_s63=WR(t,'S63','S63',0.30);
  if(w_s63>0.004){
    setGroupOp(gDens, w_s63);
    u=loc(t,'S63');
    var r_dr=smooth(pr01(ts(t,'S63'),0.4,3.2));

    for(i=0;i<r_sg3.length;i++){

    gRewind.userData.young.visible=r_ph3>0.5;
    gRewind.userData.young.userData.uOp.value=0.22*w_s94*clamp(r_ph3-0.7,0,1)*(1.0-r_closing);
    gRewind.userData.young.rotation.y=-t*0.010;
    gRewind.userData.now.rotation.y=-t*0.010;
    /* meo dan */
    var r_wp=clamp(r_ph3-0.9,0,1.2);
    gRewind.userData.young.scale.set(1.0+r_wp*0.22, 1.0+r_wp*0.42, 1.0-r_wp*0.12);
    /* thien ha khac dang va cham */
    gRewind.userData.other.visible=r_ph3>2.1;
    gRewind.userData.other.userData.uOp.value=0.30*w_s94*clamp(r_ph3-2.2,0,1)*(1.0-r_closing);
    var r_oc=clamp((r_ph3-2.2)/1.0,0,1);
    gRewind.userData.other.position.set(lerp(11.0,4.2,r_oc), lerp(4.0,1.6,r_oc), -2.0);
    gRewind.userData.other.rotation.y=-t*0.014;
    /* tam bat sang o cuoi chuoi lui */
    var r_nk=clamp((r_ph3-3.2)/0.8,0,1);
    gRewind.userData.nuc.material.opacity=0.55*w_s94*r_nk*(1.0-r_closing);
    gRewind.userData.nuc.scale.setScalar(lerp(0.6,3.2,r_nk));
    /* cac lop thien ha camera lui qua */
    var r_ly=gRewind.userData.layers;
    /* sprite lop phai NO theo khoang cach camera, neu khong o d>1000 chung nho
     * duoi mot pixel va khung ra trong (da do bang snapshot 1113s). */
    var r_lsc=1.0+r_dist94*0.010;
    for(i=0;i<r_ly.length;i++){
      r_ly[i].scale.setScalar(r_ly[i].userData.sc0*r_lsc);
      r_ly[i].material.opacity=0.62*w_s94*clamp(r_k94*2.6,0,1)*(1.0-r_closing);
    }
    /* pull-back cuc dai roi quay 180 do */
    var r_dist94=lerp(9.0, 3600.0, Math.pow(r_k94,3.4));
    if(r_closing<0.02){
      camAt(r_dist94*0.14, r_dist94*0.10, r_dist94, 0,0,0, lerp(40,86,r_k94));
    } else {
      /* KHOP NOI KHEP VONG: tai dung CHINH XAC tham so cua S01 */
      STARS.material.uniforms.uOp.value=1.0*w_s94*r_closing;
      setGroupOp(gQdot, w_s94*r_closing);
      placeQdot(22, 1.6, 2.0, 0.95*w_s94*r_closing, 0.0);
      camera.position.set(0,0,0);
      camera.rotation.set(0, 0, 0, 'YXZ');
      camera.fov=45;              /* Y HET CAM_S01 */
      /* nhan cau chot */
      gRewind.userData.lbl.material.opacity=0.86*w_s94*smooth(pr01(ts(t,'S94'),34.0,36.4));
      setGroupOp(gRewind, w_s94*0.0);
      gRewind.visible=true;
      gRewind.userData.now.visible=false;
      gRewind.userData.young.visible=false;
      gRewind.userData.other.visible=false;
      for(i=0;i<r_ly.length;i++) r_ly[i].material.opacity=0.0;
      gRewind.userData.nuc.material.opacity=0.0;
      gRewind.userData.lbl.material.opacity=0.86*w_s94*smooth(pr01(ts(t,'S94'),34.0,36.4));
      gRewind.userData.lbl.position.copy(camera.position);
      gRewind.userData.lbl.quaternion.copy(camera.quaternion);
      gRewind.userData.lbl.translateY(-3.0);
      gRewind.userData.lbl.translateZ(-16.0);
      gRewind.userData.lbl.scale.setScalar(2.4);
    }
    if(r_closing<0.02) STARS.material.uniforms.uOp.value=0.30*w_s94;
    lensVig=0.46; lensExpo=0.92;
  }

  /* S95 — cac VO THOI GIAN: hai ngon hai dang TRONG GIONG HET NHAU tren khung */
  var w_s95=WR(t,'S95','S95',0.36);
  if(w_s95>0.004){
    setGroupOp(gShells95, w_s95);
    STARS.visible=true; STARS.material.uniforms.uOp.value=0.18*w_s95;
    u=loc(t,'S95');
    for(i=0;i<SH95.length;i++){
      setGroupOp(SH95[i], w_s95*smooth(pr01(ts(t,'S95'),0.4+i*0.55,1.8+i*0.55)));
      SHL95[i].material.opacity=0.80*w_s95*smooth(pr01(ts(t,'S95'),1.2+i*0.55,2.4+i*0.55));
    }
    var r_lh=smooth(pr01(ts(t,'S95'),7.0,9.0));
    gShells95.userData.la.material.opacity=0.90*w_s95*r_lh;
    gShells95.userData.lb.material.opacity=0.90*w_s95*r_lh;
    gShells95.userData.ta.material.opacity=0.80*w_s95*smooth(pr01(ts(t,'S95'),9.4,11.0));
    gShells95.userData.tb.material.opacity=0.80*w_s95*smooth(pr01(ts(t,'S95'),9.4,11.0));
    gShells95.rotation.y=t*0.012;
    billboard(gShells95);
    /* mo dan roi camera quay vao trong */
    var r_fo=smooth(pr01(ts(t,'S95'),16.2,19.0));
    setGroupOp(gShells95, w_s95*(1.0-r_fo));
    camAt(0, lerp(4.0,1.0,r_fo), lerp(19.0,8.0,r_fo), 0,0,0, lerp(72,52,r_fo));
    lensVig=0.48; lensExpo=0.90;
  }

  /* S96/S97 — TAM NGAN HA NAY: vung toi + vanh khi cuc mong quay RAT CHAM.
   * KHONG bloom, KHONG jet, KHONG phat xa. Vanh VAN QUAY o S97. */
  var w_s96=WR(t,'S96','S97',0.40);
  if(w_s96>0.004){
    setGroupOp(gSleep, w_s96);
    STARS.visible=true; STARS.material.uniforms.uOp.value=0.16*w_s96;
    gSleep.userData.ring.material.uniforms.uT.value=t;
    gSleep.userData.ring.material.uniforms.uOpacity.value=w_s96;
    if(inSc(t,'S96')){
      u=eInOut(loc(t,'S96'));
      /* push-in RAT CHAM, dung o xa — LUON NGOAI */
      camAt(0, lerp(3.0,1.35,u), lerp(15.0,7.2,u), 0,0,0, lerp(72,46,u));
    } else {
      /* S97 — TINH TUYET DOI, giu khung S96 khong doi mot pixel ve bo cuc */
      setGroupOp(gLast, w_s96);
      for(i=0;i<LASTLINES.length;i++)
        LASTLINES[i].material.opacity=0.86*w_s96*smooth(pr01(ts(t,'S97'),0.4+i*1.5,1.4+i*1.5));
      /* chu mo di o cuoi nhung VANH KHI VAN QUAY */
      var r_tf2=1.0-smooth(pr01(ts(t,'S97'),3.6,4.6));
      for(i=0;i<LASTLINES.length;i++)
        LASTLINES[i].material.opacity *= r_tf2;
      gLast.position.copy(camera.position);
      gLast.quaternion.copy(camera.quaternion);
      /* chu h 0.62*KTEXT @ d ~ 12 -> ro rang tren nen toi */
      gLast.translateZ(-12.0);
      camAt(0, 1.35, 7.2, 0,0,0, 46);
      gLast.position.copy(camera.position);
      gLast.quaternion.copy(camera.quaternion);
      gLast.translateZ(-12.0);
    }
    lensVig=0.54; lensExpo=0.88; lensGrain=0.030;
  }

  /* ===================================================================
   * PHU DE · NHAN CHUONG · HAU KY
   * =================================================================== */
  HFA.applySubtitle(elSub, CUES, t);
  if(t > TOTAL-0.35) elSub.textContent='';
  HFA.applyChapter(elChap, CHAPS, t, 5.5);

  var r_fade3 = HFA.globalFade(t, TOTAL, 2.0, 2.5);
  lens.uniforms.uT.value = t;
  lens.uniforms.uFade.value = r_fade3;
  lens.uniforms.uExposure.value = lensExpo;
  lens.uniforms.uVig.value = lensVig;
  lens.uniforms.uGrain.value = lensGrain;
  lens.uniforms.uCA.value = lensCA;
  lens.uniforms.uFlash.value = lensFlash;
  if(elVig) elVig.style.opacity = lensVig>0.70 ? '0' : '1';

  camera.updateProjectionMatrix();
  composer.render();
}

/* ---- DANG KY TIMELINE ---------------------------------------------------
 * Dong duoi phai nam NGUYEN DANG trong file nay: StaticGuard quet VAN BAN.
 * Khoa phai trung DUNG data-composition-id cua div goc.
 */
window.__timelines = window.__timelines || {};
window.__timelines["quasar"] = HFA.makeTimeline("quasar", TOTAL, renderAtTime);

</script>
